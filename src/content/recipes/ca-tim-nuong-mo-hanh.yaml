flavorNote: >-
  **Chuẩn dĩa cà tím nướng:** ruột cà **mềm mướt tới mức tan trong miệng**,
  không còn chút sượng nào. Mỡ hành phải **xanh óng chứ không thâm**, đậu
  phộng còn giòn rôm rốp, và muỗng nước mắm chua ngọt kéo tất cả lại với nhau.
storyEyebrow: Chuyện trái cà tím
storyTitle: Trái cà **nhạt nhất chợ**, và đó lại là điểm mạnh

story:
  - >-
    Cà tím sống thì chẳng có gì: nhạt, hơi chát, ruột xốp như bọt biển. Đúng
    cái xốp đó lại là chỗ hay — nướng lên, ruột cà **sụp xuống thành một
    khối mềm mướt** biết hút mọi thứ rưới lên nó. Cho nên món này thực chất
    không phải món cà tím, mà là món **mỡ hành và nước mắm**, còn trái cà là
    cái nền hoàn hảo để chở hai thứ đó.
  - >-
    Cũng vì vậy mà nó dễ nấu tới mức khó tin: bốn trái cà, một nắm hành lá,
    ít đậu phộng. Tiền chợ chẳng đáng bao nhiêu, làm chưa tới nửa tiếng, mà
    dọn lên mâm thì trông lại **sang miệng** — dĩa cà tím tím sẫm rưới mỡ
    hành xanh, lấm tấm đậu phộng vàng, nhìn tươm tất hơn nhiều món cầu kỳ hơn.
  - >-
    Có mỗi hai chỗ phải làm cho đúng. Một là **nướng cho tới**: bóp trái cà
    thấy mềm rục hẳn, không còn cảm giác cứng ở lõi — non tay là ruột sượng,
    ăn mất hết cái mướt. Hai là **cách làm mỡ hành**: dội dầu nóng lên hành,
    chứ không phải bỏ hành vào chảo dầu mà phi.

