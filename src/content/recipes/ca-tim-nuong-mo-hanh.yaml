heroEyebrow: Món rẻ tiền mà sang miệng…

quick:
  ingredients:
    - Cà tím [[4|trái]] — loại dài, vỏ tím bóng căng, cầm nhẹ tay
    - Hành lá [[6|nhánh]] — chỉ lấy phần xanh, xắt thật nhỏ
    - Dầu ăn [[4|muỗng canh|frac]] — đun già để dội lên hành
    - Đậu phộng rang [[50|g]] — giã dập, đừng giã nhuyễn
    - "Nước mắm chua ngọt: nước mắm [[2|muỗng canh|frac]] · đường [[2|muỗng canh|frac]] · chanh, tỏi, ớt"
  steps:
    - Cà tím rửa sạch, **xăm vài lỗ bằng nĩa** cho hơi thoát — không thì nổ trong lúc nướng.
    - Nướng **12–15 phút**, trở đều, tới khi **vỏ nhăn sém và bóp thấy mềm rục**.
    - Thả vào thau nước lạnh vài phút cho dễ lột, lột sạch vỏ, xé dọc thành sợi to.
    - "Mỡ hành: hành lá xắt nhỏ + chút muối, **dội dầu đang sôi già lên**, khuấy nhanh."
    - Xếp cà ra dĩa, rưới mỡ hành, rắc đậu phộng, chan nước mắm chua ngọt.
  warning: >-
    Không xăm lỗ trước khi nướng là trái cà **nổ bung**, văng ruột nóng
    khắp bếp. Ba nhát nĩa mất năm giây, đừng bỏ qua.

