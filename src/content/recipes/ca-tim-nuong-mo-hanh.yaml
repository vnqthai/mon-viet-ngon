title: Cà tím nướng mỡ hành **mềm mướt, thơm lừng đậu phộng rang**
summary: >-
  Trái cà tím nướng tới **mềm rục như kem**, xé dọc ra rưới mỡ hành xanh
  óng, rắc đậu phộng rang giã dập, chan muỗng nước mắm chua ngọt. Món rẻ
  nhất chợ mà ai ăn cũng gắp thêm — làm chay hay mặn đều được.
region: Miền Nam
category: Nướng
occasions: [Cơm nhà, Ăn chơi]
pubDate: 2026-07-30
