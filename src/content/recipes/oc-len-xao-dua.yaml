  theo sau.
storyEyebrow: Chuyện món ăn
storyTitle: Con ốc **leo cây** và cái mẹo chặt đuôi
story:
  - >-
    Ốc len sống trong rừng ngập mặn — Cà Mau, Bạc Liêu, Cần Giờ là ba vùng có
    nhiều nhất. Nó nhỏ, dài chừng 3–4 phân, vỏ nâu sẫm có vân trắng vắt ngang,
    và điều lạ là **nó bò lên bám thân với rễ cây đước, cây mắm** chứ không nằm
    dưới bùn. Người đi bắt ốc len lội rừng lúc nước ròng, nhặt từng con trên rễ
    cây.
  - >-
    Cả món xoay quanh một cái mẹo rất nhỏ: **chặt bỏ chóp đuôi từng con ốc**.
    Việc đó làm hai chuyện cùng lúc. Một là mở đường cho nước cốt dừa chui vào
    tận trong ruột ốc, nên con ốc đậm từ trong chứ không chỉ dính vị ngoài vỏ.
    Hai là tạo lỗ thông hơi — nhờ vậy khi ăn, bạn **kê miệng vào đầu vỏ hút một
    cái** là ruột ốc trôi ra nguyên con, khỏi cần que lể.
  - >-
    Ruột ốc len nhỏ, mà nếu phải lể từng con bằng gai chanh hay tăm thì ăn một
    dĩa mất cả buổi. Cái mẹo chặt đuôi biến món này từ chỗ nhọc nhằn thành món
    **ngồi lai rai được** — và đó có lẽ là lý do nó thành món nhậu quen thuộc
    của miền Tây chứ không phải món dọn mâm cơm.
  - >-
    Nước cốt dừa ở đây không phải để làm ngọt. Con ốc len vốn mặn mòi và hơi
    nồng mùi bùn rừng; **cái béo của dừa làm dịu chỗ nồng đó lại**, còn sả và ớt
    kéo mùi lên. Ba thứ thiếu một là dĩa ốc lệch hẳn: thiếu dừa thì gắt, thiếu
    sả thì tanh, thiếu ớt thì ngán.

