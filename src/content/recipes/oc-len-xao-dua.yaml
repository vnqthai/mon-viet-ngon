title: Ốc len xào dừa **chặt đuôi cho thấm, ăn thì hút**
summary: >-
  **Ốc len** — con ốc nhỏ cỡ ngón tay, vỏ nâu vân trắng, sống bám rễ đước trong
  rừng ngập mặn miền Tây. Chặt bỏ chóp đuôi rồi rim với nước cốt dừa, sả và ớt;
  ăn thì **hút một cái** là ruột ốc tự trôi ra, không cần lể.
region: Miền Tây
category: Xào
occasions: [Nhậu lai rai, Ăn chơi]
