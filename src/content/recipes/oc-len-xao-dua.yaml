    - Nước dừa tươi [[200|ml]] · lá dứa [[2|lá]] buộc túm
    - "Phi thơm: sả băm [[3|muỗng canh|frac]] · tỏi băm [[1|muỗng canh|frac]] · ớt [[4|trái]]"
    - Sả đập dập [[3|cây]] · rau răm [[1|nắm]]
    - "Nêm: đường [[2|muỗng cà phê|frac]] · muối [[1|muỗng cà phê|frac]] · hạt nêm"
  steps:
    - Ngâm ốc nước vo gạo có vài lát ớt **2–3 tiếng** cho nhả hết bùn, rửa lại nhiều lần.
    - >-
      **Chặt bỏ chóp đuôi** từng con bằng kìm bấm hoặc sống dao.
    - Phi sả tỏi ớt cho thơm, trút ốc vào xào lửa lớn **5 phút** cho săn.
    - Chan nước dừa tươi + **nửa chỗ nước cốt dừa**, thả sả đập dập và lá dứa, rim nhỏ lửa 15–20 phút.
    - Cho **nửa nước cốt dừa còn lại** vào, nêm lại, rắc rau răm rồi tắt bếp ngay.
  warning: >-
    Đừng đổ hết nước cốt dừa ngay từ đầu rồi rim lâu — nước cốt đun quá tay sẽ
    **tách dầu**, mặt chảo nổi váng mà nước lại lạt. Chia hai lần, lần sau cho
    vào sát lúc tắt bếp.

