title: Bún bò Huế **cay nồng sả ruốc đúng chất cố đô**
summary: >-
  Nước dùng hầm xương giò thơm nồng **sả và mắm ruốc Huế**, màu điều đỏ óng,
  bắp bò giò heo mềm tan — tô bún đậm – cay – thơm khiến người xa quê nghe mùi
  là cồn cào.
region: Miền Trung
category: Bún – Phở
occasions: [Đãi khách]
time:
  total: 3 giờ
servingsBase: 4
difficulty: Kỳ công
featured: false
order: 7
art: bun-bo
heroEyebrow: Dạ thưa xứ Huế bây chừ…

quick:
  ingredients:
    - Bắp bò [[600|g]] (cột chỉ giữ khối) · giò heo [[600|g]] khoanh móng trước · xương ống heo [[1000|g]]
    - Sả [[6|cây]] đập dập + [[3|cây]] băm nhuyễn · hành tím [[4|củ]] nướng · tỏi [[4|tép]]
    - Mắm ruốc Huế [[3|muỗng canh|frac]] — pha [[200|ml]] nước, để lắng lấy nước trong
    - "Sa tế: ớt bột [[3|muỗng canh|frac]] · dầu màu điều [[2|muỗng canh|frac]] · sả tỏi băm"
    - Bún sợi to [[1000|g]] · chả Huế [[200|g]] · huyết luộc [[300|g]] (tùy thích)
    - "Rau kèm: bắp chuối bào, giá, húng quế · hành tây, hành lá, ngò gai · chanh, ớt"
    - "Nêm: nước mắm [[2|muỗng canh|frac]] · đường phèn [[1.5|muỗng canh|frac]] · muối"
  steps:
    - Xương, giò, bắp bò **chần 3 phút** nước sôi rồi xả sạch; bắp bò cột chỉ cho giữ khối.
    - Mắm ruốc khuấy với nước, **để lắng 15 phút**, chỉ giữ phần nước trong bên trên.
    - Hầm xương + giò + bắp với [[3|lít]] nước, thả sả đập + hành tím nướng, **hớt bọt đều tay**, lửa liu riu.
    - Giò heo mềm sau **45 phút**, bắp bò sau **90 phút** — vớt tới đâu ngâm nước lạnh tới đó cho săn.
    - Phi sả tỏi băm với ớt bột + dầu điều thành **sa tế** — múc 2 muỗng vô nồi, còn lại để chan.
    - "Chế nước ruốc lắng vô nồi **đang sôi**, nêm mắm – đường phèn – muối: đậm, cay, ngọt hậu, nồng sả."
    - "Tô trụng nóng: bún, bắp bò xắt lát, giò, chả, huyết — chan nước **sôi sùng sục**, rưới sa tế, dọn mâm rau + chanh ớt."
  warning: >-
    Đổ thẳng mắm ruốc vô nồi là nước đục và nặng mùi. Phải **pha loãng – để
    lắng – chỉ lấy nước trong**, và luôn chế vào lúc nồi đang sôi.

flavor:
  chua: 1
  ngot: 5
  man: 7
  cay: 7.5
  thom: 9.5
flavorNote: >-
  **Chuẩn vị Huế:** húp một muỗng thấy **mặn đậm đà dẫn trước, cay nồng đuổi
  sau, ngọt xương đọng lại ở hậu** — và mùi sả – ruốc thơm nức không lẫn vô
  đâu được.
storyEyebrow: Chuyện tô bún
storyTitle: Tô bún **mang cả cố đô** ra chợ sáng
story:
  - >-
    Ở Huế, trời còn chưa tỏ mặt người là các gánh bún bò đã đỏ lửa dọc đường
    Nguyễn Du, chợ Đông Ba. Các mệ, các o ngồi giữa một bên là nồi nước dùng
    bốc khói **thơm nồng sả ruốc**, một bên là thau bún trắng ngần — khách
    ngồi ghé đòn kê, bưng tô bún nóng, xuýt xoa vì cay mà muỗng nào cũng vét
    sạch.
  - >-
    Người ta hay nói ẩm thực Huế là **"ăn bằng cả năm giác quan"**, và bún bò
    là bằng chứng sống: màu điều đỏ óng sánh trên mặt nước, mùi sả quyện mắm
    ruốc bay xa cả góc chợ, miếng bắp bò lát mỏng nằm cạnh khoanh giò trắng
    giòn. Linh hồn của nồi nước nằm ở **hai thứ không được thiếu: sả và mắm
    ruốc Huế** — thiếu một là tô bún "lạc giọng" ngay.
  - >-
    Công thức này giữ đúng nếp nấu Huế nhưng liều lượng đã cân cho bếp nhà:
    ruốc pha lắng cho nước trong, độ cay để bạn tự chỉnh bằng chén sa tế
    riêng. Nấu một nồi cuối tuần, cả nhà **vừa ăn vừa hít hà** — vui như đi
    chợ sáng xứ Huế.

