quick:
  ingredients:
    - Cua biển [[600|g]] (hoặc ghẹ) — hấp rồi gỡ lấy thịt, giữ nước hấp
    - Ức gà [[150|g]] · trứng cút [[8|quả]] · trứng bắc thảo [[2|quả]]
    - Bắp ngọt [[1|trái]] · nấm đông cô [[4|cái]] · cà rốt [[0.5|củ|frac]]
    - Trứng gà [[2|quả]] · bột năng [[3|muỗng canh]] · nước dùng gà [[1.2|lít]]
  steps:
    - Hấp cua với gừng và sả **12–15 phút**, gỡ thịt ra **để nguyên thớ**, giữ lại nước hấp.
    - Luộc ức gà trong nước dùng, vớt ra xé sợi; luộc trứng cút, bóc vỏ.
    - Nấm đông cô ngâm nở thái sợi, bắp tách hạt, cà rốt thái hạt lựu nhỏ.
    - Đun nước dùng với nước hấp cua, thả bắp, cà rốt, nấm — nấu **10 phút**.
    - Nêm nước mắm, muối, đường, tiêu. Cho gà xé và trứng cút vào.
    - "**Rót bột năng pha loãng từ từ**, khuấy tới khi súp sánh như hồ loãng."
    - Tắt bếp rồi mới **rót trứng đánh tan thành dòng chỉ**, khuấy một chiều cho ra vân.
    - Thả thịt cua vào sau cùng, đảo nhẹ. Múc chén, xếp trứng bắc thảo lên mặt.
  warning: >-
    Cho thịt cua vào sớm rồi khuấy là **thớ cua tan hết thành sợi vụn**, chén
    súp mất luôn thứ đắt tiền nhất. Cua vào sau cùng, tắt bếp, và chỉ đảo một
    vòng thật nhẹ.

