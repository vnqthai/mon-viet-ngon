title: Súp cua **sánh đặc, thớ cua nguyên miếng**
summary: >-
  Chén súp sánh vàng nhạt, **thịt cua gỡ ra còn nguyên thớ**, vân trứng kéo
  thành sợi mảnh và mấy múi trứng bắc thảo đen nằm trên mặt. Rắc tiêu, thả
  mấy khoanh quẩy giòn, xúc muỗng nào cũng đủ vị.
region: Miền Nam
category: Món nước
occasions: [Ăn chơi, Đãi khách]
