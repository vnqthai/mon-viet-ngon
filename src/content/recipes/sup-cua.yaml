flavorNote: >-
  **Chuẩn chén súp:** sánh tới mức **muỗng múc lên thì chảy thành dòng chậm**,
  chứ không lỏng như canh cũng không đặc như hồ. Thịt cua còn ra miếng, cắn có
  thớ. Vân trứng là **sợi mảnh dài**, không phải mảng trứng dày.
storyEyebrow: Chuyện chén súp cua
storyTitle: Món ăn chơi buổi chiều, **múc bằng chén chứ không bằng tô**
story:
  - >-
    Súp cua là món quà chiều quen thuộc của Sài Gòn: một chén nhỏ sánh đặc,
    nóng, ăn bằng muỗng, mua ở xe đẩy đầu hẻm hay quán vỉa hè. Không phải món
    chan cơm, cũng không phải một tô no bụng — nó nằm giữa hai thứ đó, và
    người ta ăn nó vào lúc chưa đói hẳn mà thèm cái gì nong nóng.
  - >-
    Cùng lúc đó, súp cua lại là món mở màn quen mặt của **bàn tiệc cưới** —
    chén đầu tiên được bưng ra trước khi tới các món chính. Cùng một công
    thức, đổi cái chén là đổi hẳn chỗ đứng.
  - >-
    Thứ quyết định chén súp ngon hay dở không phải gia vị mà là **cách xử lý
    thịt cua**. Cua hấp xong phải gỡ nhẹ tay để thớ thịt còn nguyên, và chỉ
    được thả vào nồi ở giây cuối cùng. Nấu kỹ hay khuấy mạnh thì thớ cua tan
    ra, chén súp còn ngọt nhưng mất hẳn cái miếng để cắn.

