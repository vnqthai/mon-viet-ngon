stepsEyebrow: Vô bếp thôi!
stepsTitle: 5 bước ra **chén súp sánh, thớ cua còn nguyên**
stepsLead: >-
  Phần lâu nhất là ninh nước dùng và gỡ cua, làm trước được cả. Lúc nấu thì
  chỉ có ba chỗ phải canh: độ sánh, dòng trứng, và giây thả cua vào.
steps:
  - title: Hấp cua và gỡ thịt cho khéo
    icon: shrimp
    minutes: 25 phút
    intro: "Gỡ nhẹ tay ở đây thì chén súp đẹp ở cuối:"
    bullets:
      - text: >-
          Rửa cua, hấp với vài lát gừng và cây sả đập dập **12–15 phút** kể từ
          lúc nước sôi. **Giữ lại phần nước chảy ra dưới xửng** — đó là nước
          ngọt nhất.
      - label: "Gỡ thịt:"
        text: >-
          Tách mai, bẻ càng, dùng chày dằn nhẹ cho nứt vỏ rồi **gỡ thịt ra
          từng miếng theo thớ**. Đừng dùng nĩa cào — cào là nát.
      - text: >-
          Rà lại một lượt bằng tay để chắc chắn **không còn mảnh vỏ nào**. Vỏ
          cua sắc và rất khó phát hiện khi đã lẫn trong súp.
      - text: Để thịt cua riêng trong chén, đậy lại, cất ngăn mát cho tới lúc dùng.
  - title: Chuẩn bị nước dùng và các thứ trong chén
    icon: pot
    minutes: 15 phút
    bullets:
      - text: >-
          Ninh xương gà **40 phút** lấy [[1.2|lít]] nước dùng trong. Lọc, rồi
          **pha thêm phần nước hấp cua** vào.
      - text: >-
          Luộc ức gà trong chính nồi nước dùng đó chừng 12 phút, vớt ra để
          nguội rồi **xé sợi nhỏ dọc thớ**.
      - text: >-
          Luộc trứng cút 4 phút, bóc vỏ. Ngâm nấm đông cô cho nở rồi thái sợi.
          Tách hạt bắp, thái cà rốt hạt lựu.
      - text: >-
          Trứng bắc thảo bổ múi cau, để riêng — thứ này chỉ xếp lên mặt lúc
          dọn, không nấu trong nồi.
  - title: Nấu và làm sánh
    icon: flame
    minutes: 15 phút
    bullets:
      - text: >-
          Đun nước dùng sôi, thả bắp, cà rốt và nấm vào nấu **10 phút** cho
          ngọt nước và rau củ chín mềm.
      - text: >-
          Nêm [[1|muỗng canh]] nước mắm, chút muối, chút đường, tiêu. Nếm cho
          **vừa miệng lúc này**, vì lát nữa bột năng sẽ làm vị nhạt đi một
          chút.
      - text: Cho gà xé và trứng cút vào, đun thêm 2 phút.
      - label: "Làm sánh:"
        text: >-
          **Rót bột năng đã pha loãng thành dòng nhỏ**, vừa rót vừa khuấy đều.
          Dừng lại khi múc muỗng lên thấy súp **chảy xuống thành dòng chậm**.
          Đừng đổ hết một lần.
    callout:
      type: warn
      text: >-
        Súp sẽ **đặc thêm khi nguội bớt**, nên dừng lúc còn hơi loãng hơn ý
        muốn. Lỡ đặc quá thì chế thêm nước dùng nóng, khuấy đều — đừng chế
        nước lạnh.
  - title: Rót trứng thành vân
    icon: egg
    minutes: 3 phút
    intro: "Muốn vân trứng ra sợi mảnh thì làm đúng ba việc sau:"
    bullets:
      - text: >-
          **Tắt bếp** (hoặc hạ lửa nhỏ nhất) trước khi rót. Nước đang sôi bùng
          thì trứng vón thành mảng.
      - text: >-
          Đánh tan trứng, **lọc qua rây**, rồi rót **thành dòng chỉ thật mảnh**
          từ trên cao xuống, đi vòng quanh nồi.
      - text: >-
          Tay kia khuấy **chậm và theo một chiều duy nhất**. Đảo qua đảo lại là
          vân đứt vụn.
      - text: Để yên 30 giây cho vân trứng se lại rồi mới động vào nồi.
  - title: Thả cua và múc chén
    icon: bowl
    minutes: 3 phút
    bullets:
      - text: >-
          Trút thịt cua vào nồi, **đảo đúng một vòng nhẹ** bằng muỗng lớn rồi
          thôi. Nhiệt trong nồi đủ làm ấm thịt cua.
      - text: >-
          Múc ra **chén nhỏ**, xếp mấy múi trứng bắc thảo lên mặt, rắc tiêu và
          ngò, nhỏ vài giọt dầu mè.
      - text: >-
          Thả mấy khoanh quẩy lên trên ngay trước khi bưng — thả sớm là quẩy
          ngấm nước và mềm.
    doneText: Xúc muỗng đầu tiên — sánh, nóng, có thớ cua. Xong!

tipsTitle: 6 bí quyết cho **chén súp sánh đúng, cua còn miếng**
tipsLead: >-
  Súp cua hỏng theo bốn kiểu: loãng như canh, đặc như hồ, vân trứng vón mảng,
  và thịt cua tan mất. Sáu điều dưới đây chặn hết.
tips:
  - icon: shrimp
    title: Cua thả sau cùng, và chỉ đảo một vòng
    text: >-
      Thịt cua đã chín sẵn từ lúc hấp, cho vào nồi chỉ để làm ấm. Nấu thêm hay
      khuấy nhiều là thớ tách ra thành sợi vụn — chén súp vẫn ngọt nhưng nhìn
      không còn thấy cua đâu nữa.
  - icon: drop
    title: Bột năng pha loãng, rót từ từ, dừng sớm
    text: >-
      Đổ ào là vón cục, mà cục bột thì không khuấy tan lại được. Pha với nước
      lạnh cho tan hẳn, rót thành dòng nhỏ, và nhớ rằng súp còn đặc thêm khi
      nguội.
  - icon: egg
    title: Tắt bếp rồi mới rót trứng
    text: >-
      Đây là chỗ quyết định vân trứng ra sợi hay ra mảng. Nước phải lặng, dòng
      trứng phải mảnh, và khuấy chỉ một chiều. Lọc trứng qua rây trước khi rót
      cũng ăn thua nhiều.
  - icon: pot
    title: Giữ lại nước hấp cua
    text: >-
      Phần nước chảy xuống đáy xửng lúc hấp là thứ ngọt đậm nhất của con cua.
      Đổ đi là phí — chắt hết vào nồi nước dùng, chén súp đậm hẳn lên mà không
      cần nêm thêm.
  - icon: alert
    title: Rà kỹ mảnh vỏ trước khi thả vào nồi
    text: >-
      Mảnh vỏ cua sắc, lẫn trong súp sánh thì gần như không nhìn thấy. Sau khi
      gỡ, dàn thịt cua ra dĩa trắng và rà bằng đầu ngón tay một lượt — hai
      phút cho yên tâm cả chén.
  - icon: bread
    title: Quẩy thả lúc bưng ra, không thả sớm
    text: >-
      Quẩy giòn gặp súp nóng thì mềm rất nhanh. Hong lại quẩy trên chảo hoặc
      trong lò cho giòn, cắt khoanh, và chỉ thả lên mặt chén ở giây cuối.

serve:
  title: Chén súp cua — **buổi chiều, hoặc chén mở màn bàn tiệc**
  paras:
    - >-
      Múc chén nhỏ, ăn nóng, kèm một muỗng sứ. Trên mặt chén nên có đủ ba thứ
      cho vui mắt: mấy múi trứng bắc thảo màu nâu trong, nhúm ngò xanh, và
      mấy khoanh quẩy vàng. Rắc tiêu ngay trước khi ăn cho dậy mùi.
    - >-
      Nhà nào thích đậm thì để sẵn chén **nước tương ớt** hoặc lọ **giấm tiều**
      bên cạnh — vài giọt chua cay làm chén súp bật lên. Ăn chơi buổi chiều thì
      một chén là đủ; dọn mở màn bữa tiệc thì múc chén nhỏ hơn nữa.
  aside:
    title: Dọn kèm gì cho đủ
    intro: "Ba thứ để cạnh chén súp:"
    items:
      - icon: bread
        text: "**Quẩy cắt khoanh** — hong lại cho giòn, thả lên mặt lúc ăn."
      - icon: pepper
        text: "**Lọ tiêu xay** — súp cua phải rắc tiêu mới đúng."
      - icon: bottle
        text: "**Chén nước tương ớt hoặc giấm tiều** — vài giọt cho bật vị."

faq:
  - q: Dùng thịt cua đóng hộp hay thanh cua được không?
    a: >-
      **Thịt cua đóng hộp** thì được — vắt bớt nước rồi thả vào ở bước cuối như
      cua tươi. **Thanh cua** (surimi) thì là thứ khác hẳn: làm từ cá xay ép
      thành thanh, xé ra không có thớ và vị ngọt kiểu khác. Dùng cũng ăn được,
      nhưng đừng trông đợi miếng cua thật.
  - q: Súp bị loãng hoặc đặc quá thì chữa sao?
    a: >-
      **Loãng**: đun sôi nhẹ rồi rót thêm bột năng pha loãng từng thìa, khuấy
      đều. **Đặc**: chế thêm nước dùng nóng và khuấy — đừng dùng nước lạnh,
      súp sẽ vón. Cả hai đều chữa được dễ dàng, nên cứ mạnh dạn nêm.
  - q: Vân trứng bị vón thành mảng dày?
    a: >-
      Ba nguyên nhân: **nước còn sôi mạnh khi rót**, **rót quá nhanh**, hoặc
      **khuấy hai chiều**. Lần sau tắt bếp trước, lọc trứng qua rây, rót thành
      dòng chỉ từ trên cao và khuấy chậm một chiều. Nồi đã vón thì vẫn ngon,
      chỉ là nhìn không mảnh.
  - q: Nấu chay được không?
    a: >-
      Được. Nước dùng nấu từ **bắp, củ cải trắng, nấm đông cô và rong biển**;
      thay cua và gà bằng **nấm bào ngư xé sợi** (xé ra rất giống thớ cua) và
      **đậu hũ non cắt hạt lựu**. Ăn chay có trứng thì giữ, chay chuẩn thì bỏ.
      Vẫn làm sánh bằng bột năng như thường.
  - q: Nấu trước rồi hâm lại được không?
    a: >-
      Được, nhưng nấu tới bước làm sánh thôi rồi tắt bếp. **Phần trứng và
      phần cua để riêng**, khi nào ăn mới hâm nồi lên, rót trứng rồi thả cua.
      Hâm cả nồi đã có trứng và cua thì vân trứng nát và thịt cua tan.
  - q: Để tủ lạnh được mấy ngày?
    a: >-
      **2 ngày** ngăn mát. Súp để lạnh sẽ đông đặc lại — hâm nóng và chế thêm
      chút nước dùng là trở lại bình thường. Đừng cấp đông: bột năng rã đông
      thì tách nước, chén súp lợn cợn.

