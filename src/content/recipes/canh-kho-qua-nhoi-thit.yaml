stepsEyebrow: Vô bếp thôi!
stepsTitle: 5 bước ra **tô canh mát lành**
stepsLead: >-
  Món này dễ hơn vẻ ngoài của nó nhiều: moi ruột – nhồi nhân – thả nồi, còn
  lại để lửa liu riu lo. Lích kích duy nhất là khâu moi ruột, có mẹo ngay
  bên dưới.
steps:
  - title: Sơ chế khổ qua — quyết định độ đắng
    icon: knife
    minutes: 15 phút
    bullets:
      - label: "Rạch:"
        text: >-
          rửa sạch, cắt bỏ hai đầu nhọn, **rạch một đường dọc thân** (đừng
          cắt đôi — trái nguyên nhồi mới đẹp và nhân không rớt).
      - label: "Moi ruột:"
        text: >-
          dùng muỗng cà phê nạy nhẹ **hết hột lẫn lớp cùi trắng** bên trong
          — cùi trắng chính là ổ đắng gắt, moi càng sạch canh càng thanh.
      - label: "Giảm đắng (tùy nhà):"
        text: >-
          ngâm khổ qua trong **nước muối loãng 10 phút** hoặc chần nước sôi
          30 giây rồi xả lạnh. Nhà ghiền đắng đúng gu thì bỏ qua bước này.
    callout:
      type: tip
      text: >-
        Chọn trái ngay từ chợ là nửa trận thắng: **gai nở to, màu xanh nhạt,
        trái thon dài** — đắng dịu. Gai li ti dày đặc, xanh đậm lùn mập —
        đắng "thấm thía" dành cho dân chuyên.
  - title: Trộn nhân dai ngọt
    icon: bowl
    minutes: 10 phút
    bullets:
      - text: >-
          Trộn [[300|g]] thịt xay + [[100|g]] chả cá thác lác + nấm mèo băm
          + hành tím băm + phần **đầu hành trắng xắt nhuyễn**.
      - text: >-
          Nêm [[1|muỗng cà phê]] hạt nêm + [[1|muỗng cà phê]] nước mắm +
          [[0.5|muỗng cà phê|frac]] tiêu.
      - text: >-
          **Quết đều tay 2–3 phút** theo một chiều tới khi nhân dẻo quánh —
          nhân quết kỹ nấu xong mới dai, không bở.
    callout:
      type: tip
      text: >-
        Chả cá thác lác là "chất keo tự nhiên": nhân **dai, ngọt và bám chắc
        vô trái** khi nấu. Chợ nào cũng có hàng bán sẵn, mua thêm 100 g về
        trữ đông dùng dần rất tiện.
  - title: Nhồi nhân — chặt tay, trét phẳng
    icon: spoon
    minutes: 10 phút
    bullets:
      - text: >-
          Banh nhẹ đường rạch, dùng muỗng nhỏ **nhét nhân từng chút, ém
          chặt** từ hai đầu vô giữa cho đầy ruột trái.
      - text: >-
          Nhồi hơi **vun lên một chút** rồi vuốt trét mặt nhân cho phẳng,
          miết kín mép rạch — nhân nở khi chín sẽ vừa khít.
      - text: >-
          Còn dư nhân? Vo viên thả nấu chung — mấy viên "mọc" này con nít
          giành nhau gắp trước cho coi.
  - title: Nấu canh — liu riu cho trong nước
    icon: pot
    minutes: 35 phút
    bullets:
      - text: >-
          Đun sôi [[1.5|lít]] nước (nước hầm xương càng ngon), **thả khổ qua
          khi nước sôi** — vỏ xanh giữ màu đẹp.
      - text: >-
          Nước sôi bùng lại thì **hạ lửa liu riu**, hớt sạch bọt — bọt từ
          nhân thịt nổi nhiều ở 10 phút đầu, chăm hớt là nước trong veo.
      - text: >-
          Nấu **30 phút**, xiên đũa qua thân trái thấy **xuyên nhẹ, vỏ chuyển
          xanh trong** là chín mềm đúng độ.
      - text: >-
          Nêm nước mắm + hạt nêm **nhạt tay hơn canh thường** — vị thanh mới
          đỡ được vị đắng, nêm đậm là canh "nặng nề" liền.
    callout:
      type: warn
      text: >-
        Sôi bùng suốt buổi là nước **đục ngầu và nhân bung** khỏi trái. Món
        này với món phở chung một triết lý: sôi lăn tăn, nước trong, chất
        ngọt lành.
    timer:
      secs: 1800
      label: Hẹn giờ nấu canh · 30:00
      doneMsg: Khổ qua mềm trong rồi — nêm và dọn thôi!
  - title: Múc tô — rắc hành ngò
    icon: bowl
    minutes: 5 phút
    bullets:
      - text: >-
          Gắp khổ qua ra tô (nguyên trái hoặc cắt khoanh dày cho dễ gắp),
          chan nước canh ngập.
      - text: Rắc **hành lá, ngò rí, tiêu xay** — tô canh dậy mùi liền.
      - text: >-
          Dọn với cơm trắng nóng; ai thích chấm thì thêm **chén nước mắm
          nguyên chất dằm ớt** cho miếng nhân thịt.
    doneText: Húp miếng nước thanh mát — xong!

tipsTitle: 6 bí quyết cho **tô canh đắng dịu, nước trong**
tipsLead: >-
  Khổ qua là món "gia giảm được độ đắng" — nắm mấy mẹo này, nhà ghiền đắng
  hay sợ đắng đều có tô canh vừa miệng.
tips:
  - icon: okra
    title: Đọc trái khổ qua như dân chợ
    text: >-
      **Gai nở to, xanh nhạt, trái thon** = đắng dịu, thịt dày. **Gai
      nhuyễn dày, xanh sậm** = đắng đậm đô. Chọn theo "trình chịu đắng" của
      nhà mình — hai loại đều tươi ngon, chỉ khác cấp độ.
  - icon: knife
    title: Cùi trắng là ổ đắng
    text: >-
      80% cái đắng gắt nằm ở **lớp cùi trắng quanh ruột**. Moi bằng muỗng
      nhỏ tới khi thấy lòng trái xanh sạch trơn láng — giữ lại vị đắng
      thanh của phần vỏ thịt, bỏ đi phần đắng chát.
  - icon: fish
    title: Chả cá thác lác — nâng cấp nhân
    text: >-
      Tỉ lệ vàng **3 thịt : 1 chả cá**: nhân dai mềm, ngọt tự nhiên, không
      bở vụn khi cắt khoanh. Đây là điểm khác biệt lớn nhất giữa canh khổ
      qua "nhà nghề" và bản chỉ toàn thịt xay.
  - icon: spoon
    title: Quết nhân cho dẻo
    text: >-
      Trộn xong đừng dừng — **quết thêm 2–3 phút một chiều** cho nhân nổi
      độ kết dính. Nhân dẻo bám chắc vô trái, nấu xong cắt khoanh đẹp như
      hàng cỗ.
  - icon: pot
    title: Lửa liu riu, chăm hớt bọt
    text: >-
      Nhân thịt nhả bọt nhiều trong 10 phút đầu — **hớt kịp là nước trong
      veo**, để tan lại vô nước là canh đục và có mùi thịt luộc. Sau đó chỉ
      cần liu riu tới mềm.
  - icon: clock
    title: Nấu trước càng thấm
    text: >-
      Món hiếm hoi **để qua bữa ngon hơn**: nhân thấm vị nước, nước ngọt vị
      nhân. Nấu nồi lớn từ chiều, tối hâm nóng ăn — hoặc như má mình hay
      làm dịp Tết: nấu 29 ăn tới mùng 2, càng ngày càng ngon.

serve:
  title: Bữa cơm có tô khổ qua — **mát từ trong bụng**
  paras:
    - >-
      Canh khổ qua sinh ra để **đi cặp với món mặn đậm**: kề bên nồi thịt
      kho hột vịt là bộ đôi huyền thoại mâm Tết miền Nam — miếng thịt kho
      béo đậm, húp muỗng canh đắng thanh, cân nhau từng li.
    - >-
      Ngày thường trời nóng, chỉ cần tô canh này + dĩa cá chiên + chén cơm
      trắng là **bữa cơm giải nhiệt** đúng nghĩa. Người mệt, ăn không vô
      cơm, húp chén nước canh khổ qua nóng cũng thấy khỏe ra — ông bà mình
      tin vậy, mà ăn rồi thấy… tin được thiệt.
  aside:
    title: Mâm cơm gợi ý
    intro: "Khổ qua bắt cặp đẹp nhất với:"
    items:
      - icon: egg
        text: "**Thịt kho hột vịt** — combo mâm Tết miền Nam, béo đậm gặp đắng thanh."
      - icon: fish
        text: "**Cá chiên sả hoặc cá kho** — mặn giòn đưa cơm, canh mát đỡ lời."
      - icon: rice
        text: "**Cơm trắng nóng** — chan nước canh là chân lý."
      - icon: bottle
        text: "**Nước mắm dằm ớt** — chấm khoanh nhân thịt, đậm đà hơn hẳn."

faq:
  - q: Nhà có con nít sợ đắng — làm sao cho dễ ăn nhất?
    a: >-
      Ba lớp khiên: chọn **trái gai to xanh nhạt**, moi **kiệt cùi trắng**,
      và **chần nước sôi 30 giây** trước khi nhồi. Nấu đủ mềm nữa là vị đắng
      chỉ còn thoang thoảng — nhiều bé ăn khoanh đầu tiên còn xin thêm vì
      cục nhân "mọc" quá ngon.
  - q: Nhân cứ bung ra khỏi trái khi nấu — chữa sao?
    a: >-
      Bốn nghi phạm: moi ruột **làm rách vỏ**, nhân **không quết dẻo**, nhồi
      **hờ tay**, hoặc nước **sôi bùng**. Mẹo chắc ăn cho người mới: nhồi
      xong lấy **cọng hành lá trụng mềm cột quanh thân trái** — vừa giữ nhân
      vừa nhìn xinh như nhà hàng.
  - q: Không tìm được chả cá thác lác?
    a: >-
      Tăng thịt xay lên [[400|g]] và thêm **1 lòng trắng trứng + 1 muỗng cà
      phê bột năng** — nhân vẫn kết dính khá ổn. Hoặc thay bằng **giò sống**
      (mua hàng chả lụa) theo cùng tỉ lệ, cũng dai ngon lắm.
  - q: Nấu bằng nước lọc có ngọt không hay bắt buộc hầm xương?
    a: >-
      Nước lọc vẫn ngon — vì **nhân thịt tự nhả ngọt** vào nước suốt 30 phút.
      Có sẵn nước hầm xương thì canh sâu vị hơn một bậc; kẹt nữa thì ½ muỗng
      cà phê hạt nêm xương hầm là đủ kéo.
  - q: Canh khổ qua để được bao lâu?
    a: >-
      Ngăn mát **2–3 ngày**, hâm sôi trước khi ăn — và như dân miền Nam hay
      nói, nồi khổ qua **ngày thứ hai ngon hơn ngày đầu**. Đừng cấp đông:
      khổ qua rã đông bị mềm xốp, mất cái sựt nhẹ dễ thương của vỏ trái.
  - q: Mùa nào khổ qua ngon nhất?
    a: >-
      Khổ qua có quanh năm nhưng **mùa nắng (tầm tháng 11 tới tháng 4)**
      trái đẹp, ít sâu, giá mềm. Cận Tết là "mùa cao điểm" đúng nghĩa —
      ai cũng mua nấu nồi canh cho cái khổ… qua!

