flavorNote: >-
  **Chuẩn tô canh:** nước **trong veo ngọt thanh**, khổ qua xanh mềm còn
  giữ **vị đắng dịu** — đắng đầu lưỡi, ngọt cuống họng, đó mới là cái ngon
  người lớn hay ghiền.
storyEyebrow: Chuyện trái khổ qua
storyTitle: Món canh **mang lời chúc** trên mâm Tết miền Nam
story:
  - >-
    Trên mâm cơm Tết miền Nam, cạnh nồi thịt kho hột vịt thế nào cũng có tô
    canh khổ qua nhồi thịt — không phải ngẫu nhiên. Người Nam chơi chữ:
    ăn **"khổ qua"** đầu năm để mọi cái khổ… **qua** hết, năm mới chỉ còn
    ngọt lành. Một món canh mà gói cả lời chúc, thiệt khó có món thứ hai.
  - >-
    Mà đâu chỉ Tết — ngày thường trời nóng, tô canh khổ qua là **"máy điều
    hòa" của mâm cơm**: đắng thanh, mát ruột, đưa cơm lạ lùng. Bí quyết nằm
    ở đôi điều nhỏ: moi sạch cùi trắng cho bớt đắng gắt, và trộn nhân với
    **chả cá thác lác** — miếng nhân vừa dai vừa ngọt, cắn vô biết liền
    "nhà này nấu có nghề".
  - >-
    Vị đắng của khổ qua là kiểu vị **phải lớn mới hiểu**: hồi nhỏ nhăn mặt,
    lớn lên tự nhiên thèm. Nhà có con nít cứ làm theo mẹo giảm đắng trong
    bài — biết đâu tụi nhỏ nhà bạn "trưởng thành" sớm hơn một bậc ngay từ
    tô canh này.

