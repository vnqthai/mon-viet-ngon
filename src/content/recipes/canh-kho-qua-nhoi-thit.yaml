title: Canh khổ qua nhồi thịt **đắng thanh, hậu ngọt lành**
summary: >-
  Trái khổ qua xanh mướt ôm nhân thịt **dai mềm nhờ chả cá thác lác**, nước
  canh trong veo ngọt thanh — món canh giải nhiệt ngày thường, và là lời chúc
  **"cái khổ qua đi"** trên mâm Tết miền Nam.
region: Miền Nam
category: Canh
occasions: [Cơm nhà, Cỗ Tết]
pubDate: 2026-07-27
time:
  total: 50 phút
servingsBase: 4
difficulty: Dễ
featured: false
order: 32
art: kho-qua
heroEyebrow: Ăn khổ qua, cái khổ qua đi…

quick:
  ingredients:
    - Khổ qua [[4|trái]] — chọn trái gai nở to, xanh nhạt cho bớt đắng
    - "Nhân: thịt heo xay [[300|g]] · chả cá thác lác [[100|g]] · nấm mèo [[3|tai]] · hành tím [[2|củ]] · đầu hành trắng"
    - "Nêm nhân: hạt nêm [[1|muỗng cà phê]] · tiêu [[0.5|muỗng cà phê|frac]] · nước mắm [[1|muỗng cà phê]]"
    - Nước dùng [[1.5|lít]] (nước hầm xương càng ngọt, nước lọc cũng được)
    - Hành lá + ngò rí · nước mắm nêm canh
  steps:
    - Khổ qua rạch dọc một đường, **moi sạch ruột và cùi trắng** — cùi trắng là chỗ đắng gắt nhất.
    - Trộn thịt + chả cá + nấm mèo + hành tím + gia vị, **quết dẻo**; nhồi đầy vô ruột khổ qua, trét kín hai đầu.
    - Nấu sôi [[1.5|lít]] nước, thả khổ qua vô, sôi lại thì **hạ lửa liu riu**, hớt bọt.
    - Nấu **30 phút** tới khổ qua mềm trong, xiên đũa xuyên nhẹ là chín.
    - Nêm nước mắm + hạt nêm vừa miệng — canh này nêm **nhạt hơn canh thường** một chút cho nổi vị thanh.
    - Múc tô, rắc hành ngò + tiêu. Chan cơm nóng, húp tới đâu mát tới đó.
  warning: >-
    Nhân rớt khỏi trái là do moi ruột làm thủng vỏ hoặc nhồi hờ tay — moi
    nhẹ bằng muỗng nhỏ, nhồi **chặt tay và trét phẳng hai miệng rạch** là
    nằm yên tới lúc dọn.

