flavorNote: >-
  **Chuẩn ly chè:** nước cốt **sánh như kem lỏng**, chảy chậm chứ không loãng
  như sữa; mùi sầu riêng dẫn trước, mít theo sau. Hạt lựu **cắn thấy sựt cái
  lõi củ năng** bên trong lớp áo dai — mất cái sựt đó là hỏng nửa ly.
storyEyebrow: Chuyện cái tên
storyTitle: Gốc Thái, nhưng **ruột đã đổi hết**
story:
  - >-
    Món này đúng là đến từ Thái Lan thật, nhưng sang tới đây thì người mình
    thay gần hết phần ruột. Bản gốc dùng **siro hoa hồng** làm hương chính —
    một mùi mà người Việt không quen. Đổi sang **sầu riêng**, thêm **mít** xé
    sợi, thế là ly chè mang một mùi hoàn toàn khác, và cũng là mùi mà hàng chè
    ở đây bán chạy nhất.
  - >-
    Cái tên "chè Thái" vì vậy hơi lạ: nó chỉ còn giữ **cách bày** của món gốc —
    nhiều thứ xếp chung một ly, chan nước cốt béo, phủ đá bào — còn nguyên liệu
    thì gần như là một danh sách trái cây miệt vườn.
  - >-
    Chỗ tốn công duy nhất là **hạt lựu**. Nhìn thì tưởng mấy viên bột đỏ, thật
    ra bên trong là **củ năng cắt hạt lựu** — cắn vô nghe sựt một cái rất giòn,
    khác hẳn cái dai của lớp bột áo bên ngoài. Mua hạt lựu làm sẵn thì tiện,
    nhưng gần như lúc nào cũng là bột không ruột, và ly chè mất đi đúng cái
    tiếng sựt đó.

