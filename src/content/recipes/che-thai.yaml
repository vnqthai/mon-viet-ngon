heroEyebrow: Tên là Thái, mà ruột thì miệt vườn…

quick:
  ingredients:
    - "Nước cốt: sầu riêng [[200|g]] cơm · sữa tươi [[300|ml]] · sữa đặc [[80|g]] · nước cốt dừa [[300|ml]] · muối [[0.25|muỗng cà phê|frac]]"
    - "Hạt lựu: củ năng [[200|g]] · nước củ dền [[100|ml]] để nhuộm · bột năng [[3|muỗng canh]]"
    - Mít chín [[200|g]] — **xé sợi dọc thớ**, đừng băm
    - Thạch rau câu [[150|g]] cắt sợi · nhãn hoặc vải [[150|g]] bóc sẵn
    - Dừa non nạo sợi [[80|g]] · đá bào
  steps:
    - Củ năng gọt vỏ, **cắt hạt lựu [[6|mm]]**, ngâm nước củ dền [[15|phút]] cho ăn màu đỏ.
    - Vớt ra để ráo, **xóc với bột năng cho áo đều**, rây bỏ bột thừa.
    - Luộc trong nước sôi tới khi hạt **nổi lên và lớp áo trong veo**, vớt ra **xả nước lạnh ngay**.
    - Xay sầu riêng với sữa tươi cho mịn, trộn sữa đặc + nước cốt dừa + nhúm muối. **Để ngăn mát cho thật lạnh.**
    - Mít xé sợi, thạch cắt sợi, nhãn bóc hạt — mỗi thứ để một chén riêng.
    - "Xếp ly: các thứ xuống đáy, **đá bào phủ lên trên**, rồi mới chan nước cốt lạnh."
  warning: >-
    Chan nước cốt còn ấm lên đá là ly chè loãng toẹt trong một phút. **Nước cốt
    phải lạnh sẵn trong tủ** rồi mới đem ra chan — đây là lỗi làm hỏng ly chè
    nhanh nhất, mà cũng dễ tránh nhất.

