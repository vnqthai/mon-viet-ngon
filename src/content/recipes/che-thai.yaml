title: Chè Thái **sầu riêng béo, mít thơm, hạt lựu giòn sựt**
summary: >-
  Sầu riêng xay với sữa và nước cốt dừa thành **nước cốt sánh béo**, chan lên
  ly đầy sợi mít vàng, hạt lựu đỏ giòn sựt, thạch và nhãn — phủ đá bào. Món gốc
  Thái nhưng ruột đã đổi thành trái cây miệt vườn.
region: Miền Nam
category: Chè
occasions: [Ăn chơi, Đãi khách]
