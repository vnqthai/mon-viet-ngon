title: Bún sườn nấu sấu **chua thanh mát miệng, nước trong veo**
summary: >-
  Tô bún nước trong nhìn thấy đáy, chua dịu từ **quả sấu** — thứ quả tròn
  nhỏ vỏ xanh của mùa hè miền Bắc — chua thanh chứ không gắt như chanh.
  Khúc sườn ninh mềm rời xương, cà chua đỏ au, rắc hành mùi thơm nức.
region: Miền Bắc
category: Món nước
occasions: [Bữa sáng, Ăn chơi]
pubDate: 2026-07-30
time:
  total: 1 giờ 15 phút
  active: 25 phút
servingsBase: 4
