heroEyebrow: Ngày oi bức thèm một tô chua…

quick:
  ingredients:
    - Sườn non [[700|g]] — chặt khúc 4 cm, chần sơ cho nước dùng trong
    - Sấu tươi [[8|quả]] — cạo vỏ, khía nhẹ quanh thân
    - Cà chua [[4|trái]] · hành tím [[3|củ]] · hành lá + mùi tàu [[1|nắm]]
    - Bún rối [[800|g]] · rau sống ăn kèm tùy nhà
    - "Nêm: nước mắm [[2|muỗng canh|frac]] · muối, hạt nêm · nước [[2.5|lít]]"
  steps:
    - Sườn chần sơ với gừng – hành đập, rửa sạch — đây là gốc của nồi nước trong.
    - Ninh sườn với [[2.5|lít]] nước **45 phút** lửa nhỏ, **hớt bọt đều tay**.
    - Sấu cạo vỏ, khía quanh thân, thả vào nồi **10 phút** cho ra chua.
    - Vớt sấu ra chén, **dầm nát rồi lọc lấy nước chua** trả về nồi — bỏ hột và xác.
    - Cà chua bổ múi xào sơ với hành phi cho lên màu, trút vào nồi, nêm nếm.
    - Chan lên tô bún, xếp sườn, rắc hành lá + mùi tàu. Ăn nóng.
  warning: >-
    Đừng dầm sấu ngay trong nồi — **xác sấu và hột làm nước đục ngầu** và
    chua gắt không gỡ lại được. Vớt ra chén dầm riêng rồi lọc, luôn luôn.

flavor:
  chua: 6
  ngot: 5
  man: 5
  cay: 0.5
  thom: 6
flavorNote: >-
  **Chuẩn tô bún sườn sấu:** nước dùng **trong tới mức nhìn thấy sợi bún
  dưới đáy**, chua dịu ở đầu lưỡi rồi tan đi chứ không đọng gắt, hậu ngọt
  từ xương. Miếng sườn mềm rời xương mà **không bã**.
storyEyebrow: Chuyện tô bún mùa hè
storyTitle: Mùa sấu về, **cả Hà Nội đổi vị**

story:
  - >-
    Ngoài Bắc có một thứ quả mà hễ thấy bày ở chợ là biết hè đã tới: **quả
    sấu**. Tròn nhỏ bằng đầu ngón tay cái, vỏ xanh sần, chua thanh một kiểu
    rất riêng — không sắc như chanh, không đằm như me, mà chua xong thì
    **tan đi nhẹ nhõm**. Bún sườn nấu sấu là món ăn theo mùa đúng nghĩa:
    hết mùa sấu là hết món, ai thèm thì đợi năm sau.
  - >-
    Cái khéo của tô bún này nằm ở chỗ **chua mà nước vẫn phải trong**. Đây
    là hai thứ hay đá nhau: nấu chua thì dễ đục. Người nấu quen tay xử lý
    bằng ba nhịp rất cụ thể — chần sườn trước khi ninh, hớt bọt đều tay, và
    **vớt sấu ra dầm riêng rồi lọc** thay vì dầm thẳng trong nồi.
  - >-
    Món này cũng là cách hay nhất để hiểu chữ **"thanh"** trong bếp Bắc.
    Không nước màu, không sả ớt, không mắm ruốc — chỉ sườn, sấu, cà chua và
    hành mùi. Ít thứ tới mức không giấu được lỗi nào, nên nấu ngon một tô
    bún sườn sấu khó hơn vẻ ngoài giản dị của nó.

