heroEyebrow: Quán cơm rang đầu ngõ, chảo lửa đỏ rực…

quick:
  ingredients:
    - Cơm nguội [[800|g]] — để ngăn mát **qua đêm**, bóp tơi trước khi rang
    - Thăn bò hoặc bắp bò [[300|g]] — thái **ngang thớ**, mỏng
    - Dưa cải chua [[300|g]] — rửa bớt chua, **vắt thật ráo**, cắt khúc ngắn
    - Trứng gà [[2|quả]] · hành lá · tỏi [[4|tép]] · hành tây [[0.5|củ|frac]]
    - "Ướp bò: dầu hào [[1|muỗng canh|frac]] · tỏi băm · dầu ăn · tiêu"
    - "Nêm: nước mắm · hạt nêm · chút đường cho dịu vị chua"
  steps:
    - Bóp tơi cơm nguội, trộn đều với trứng đánh tan cho hạt áo mỏng.
    - Dưa vắt ráo, xào riêng tới khi **hết nước và thơm**, trút ra.
    - Bò ướp [[10|phút]], xào lửa **lớn nhất** chừng 1 phút, trút ra ngay.
    - Rang cơm lửa lớn cho **săn rời**, nêm nhạt tay.
    - Trút dưa và bò vào, đảo **20 giây** rồi tắt bếp, rắc hành lá.
  warning: >-
    Xào chung ba thứ từ đầu là hỏng cả ba: dưa ra nước làm cơm nhão, cơm hút
    nước làm dưa nhạt, còn thịt bò nằm trong chảo lâu thì **dai như miếng cao
    su**. Ba chảo riêng, gộp ở phút chót.

