steps:
  - title: Chuẩn bị ba thứ, ba nơi
    icon: knife
    minutes: 15 phút
    intro: "Món này nhanh, nên mọi thứ phải sẵn sàng trước khi bật bếp:"
    bullets:
      - label: "Cơm:"
        text: >-
          Bóp tơi từng hạt cơm nguội. Đánh tan [[2|quả]] trứng, rưới vào, trộn
          đều cho mỗi hạt được **áo một lớp mỏng**. Để đó [[5|phút]].
      - label: "Bò:"
        text: >-
          Thái **ngang thớ** lát mỏng 3 mm, ướp [[1|muỗng canh|frac]] dầu hào,
          tỏi băm, tiêu và [[1|muỗng cà phê|frac]] dầu ăn. Để [[10|phút]].
      - label: "Dưa:"
        text: >-
          Rửa dưa qua nước lạnh cho bớt chua và bớt mặn, **vắt thật ráo** bằng
          hai tay, cắt khúc chừng 2 cm. Vắt kỹ tới mức bóp không còn rỉ nước.
    callout:
      type: warn
      text: >-
        Dưa vắt dối là hỏng cả đĩa: nước dưa gặp chảo nóng bốc lên, hạt cơm hút
        vào và **nhão bết** ngay. Đây là lỗi phổ biến nhất của món.
  - title: Xào dưa cho bay hết nước
    icon: flame
    minutes: 8 phút
    bullets:
      - label: "Phi tỏi:"
        text: >-
          Bắc chảo, cho chút dầu, phi [[2|tép]] tỏi băm tới vàng thơm.
      - label: "Xào:"
        text: >-
          Trút dưa vào xào **lửa vừa 5–7 phút**, thêm [[1|muỗng cà phê|frac]]
          đường. Xào tới khi dưa **hết rỉ nước**, cọng ngả vàng trong và dậy mùi
          thơm chua.
      - text: >-
          Trút ra đĩa để riêng. Đừng để lại trong chảo — dưa nằm chảo nóng tiếp
          là mềm nhũn.
    callout:
      type: tip
      text: >-
        Chút đường ở đây **không phải để làm ngọt** mà để bẻ cái chua gắt cho
        tròn lại. Nếm thử trước và sau khi cho đường sẽ thấy rõ — vẫn chua đó,
        nhưng thôi xóc lưỡi.
  - title: Xào bò — một phút, không hơn
    icon: meat
    minutes: 3 phút
    bullets:
      - label: "Chảo thật nóng:"
        text: >-
          Lau chảo, bật **lửa lớn nhất**, cho dầu và đợi tới khi dầu **bốc khói
          nhẹ**. Chảo chưa đủ nóng thì thịt ra nước và luộc trong nước của chính
          nó.
      - label: "Dàn một lớp:"
        text: >-
          Trút thịt vào, **dàn một lớp**, để yên [[20|giây]] cho mặt dưới sém,
          rồi đảo nhanh chừng [[30|giây]] nữa.
      - text: >-
          Thịt vừa đổi màu, còn hồng nhạt ở giữa là **trút ra ngay**. Nó sẽ chín
          nốt lúc quay lại chảo ở bước cuối.
    timer:
      secs: 60
      label: Hẹn giờ xào bò · 01:00
      doneMsg: Trút ra liền nghen — để thêm là dai!
    callout:
      type: warn
      text: >-
        Xào nhiều thịt một lúc làm **tụt nhiệt chảo**, thịt ra nước và thành
        thịt luộc. Chảo nhỏ thì chia hai mẻ — mất thêm một phút, đổi lại miếng
        thịt mềm.
  - title: Rang cơm rồi nhập ba thứ
    icon: rice
    minutes: 10 phút
    bullets:
      - label: "Phi nền:"
        text: >-
          Cho dầu vào chảo, phi tỏi băm còn lại và hành tây thái hạt lựu tới
          thơm.
      - label: "Rang cơm:"
        text: >-
          Trút cơm đã trộn trứng vào, **lửa lớn**, ép cơm xuống mặt chảo rồi mới
          đảo — làm vậy vài lượt. Rang **5–7 phút** tới khi hạt cơm săn rời, đảo
          lên nghe **lạo xạo**.
      - label: "Nêm:"
        text: >-
          [[1|muỗng canh|frac]] nước mắm rưới quanh **thành chảo** chứ đừng đổ
          giữa lòng — mắm gặp thành nóng dậy mùi rồi mới xuống cơm. Thêm hạt
          nêm và tiêu, nếm nhạt tay.
      - label: "Nhập:"
        text: >-
          Trút dưa và bò vào, đảo đúng **20 giây** cho quyện rồi tắt bếp ngay.
          Rắc hành lá, đảo thêm hai vòng bằng nhiệt còn lại của chảo.
    doneText: Xong — xúc ra đĩa lúc còn nóng!

tipsTitle: 4 chỗ **quyết định** đĩa cơm rang dưa bò
tips:
  - icon: rice
    title: Trộn trứng vào cơm nguội, đừng chiên trứng riêng
    text: >-
      Chiên trứng rồi mới trút cơm vào thì ra đĩa cơm có **những mảng trứng
      rời**. Trộn trứng đánh tan vào cơm nguội trước, để 5 phút cho ngấm, rồi mới
      rang: mỗi hạt cơm được áo một lớp mỏng, rang xong **rời hẳn ra** và vàng
      đều. Đây là mẹo dùng được cho mọi món cơm rang.
  - icon: alert
    title: Vắt dưa tới khi bóp không còn rỉ nước
    text: >-
      Vắt qua loa thì trông có vẻ ráo, nhưng nước còn nằm trong lõi cọng dưa và
      sẽ ra hết trong chảo. Túm từng nắm vắt mạnh hai tay, bóp thử — không còn
      giọt nào rỉ ra mới đạt. Kỹ tính chỗ này thì đĩa cơm khô ráo hẳn.
  - icon: flame
    title: Rưới nước mắm quanh thành chảo
    text: >-
      Đổ mắm thẳng vào giữa lòng chảo là nó **thấm xuống cơm dưới đáy**, chỗ
      mặn chỗ nhạt và cơm ướt lại. Rưới vòng quanh thành chảo đang nóng: mắm
      bốc hơi dậy mùi rồi mới rơi xuống, đều hơn và thơm hơn hẳn.
  - icon: clock
    title: Thịt bò vào chảo lần cuối chỉ 20 giây
    text: >-
      Miếng bò đã chín tới ở bước riêng của nó. Quay lại chảo chỉ để **nóng lại
      và quyện vào cơm** — đảo 20 giây là đủ. Nấu lại lần hai là thớ thịt co
      cứng, và không có cách nào làm mềm lại được nữa.

serve:
  title: Đĩa cơm **của bữa sáng vội** — hoặc bữa tối gọn
  paras:
    - >-
      Ngoài Bắc đây là món ăn sáng phổ biến ngang bún phở: một đĩa cơm rang, một
      bát canh nhỏ, đĩa dưa chuột cà chua thái lát. Ăn xong đứng dậy đi làm, no
      tới trưa.
    - >-
      Ở nhà thì nó là cách gọn nhất để giải quyết nồi cơm hôm qua. Từ lúc bật
      bếp tới lúc bưng đĩa lên chưa tới hai mươi phút, mà lại đủ tinh bột, đạm
      và rau trong một đĩa.
  aside:
    title: Bày mâm gợi ý
    intro: "Ba thứ đi kèm cho đĩa cơm đỡ khô:"
    items:
      - icon: tomato
        text: "**Dưa chuột và cà chua thái lát** — mát miệng, cân lại vị đậm."
      - icon: bowl
        text: "**Bát canh nhạt** — canh rau hoặc canh trứng cà chua đều hợp."
      - icon: chili
        text: "**Tương ớt** — đĩa cơm rang ở quán nào cũng có chai tương ớt bên cạnh."

faq:
  - q: Chỉ có cơm mới nấu thì làm sao?
    a: >-
      Xới cơm ra mâm hoặc khay rộng, dàn mỏng, **bật quạt thổi 15–20 phút** cho
      se mặt; hoặc cho vào ngăn đá 20 phút. Cả hai cách đều rút bớt nước bề mặt
      để hạt cơm chịu rời ra. Vẫn không bằng cơm qua đêm, nhưng cứu được bữa.
  - q: Thịt bò xào xong bị dai và ra nhiều nước?
    a: >-
      Hai nguyên nhân, thường đi cùng nhau: **chảo chưa đủ nóng** và **cho quá
      nhiều thịt một lúc**. Đợi dầu bốc khói nhẹ mới trút thịt, và chia mẻ nếu
      chảo nhỏ. Thêm một điều: thái **ngang thớ** — thái dọc thớ thì xào cách
      mấy cũng dai.
  - q: Nhà không ăn được chua nhiều thì làm sao?
    a: >-
      Rửa dưa kỹ hơn — ngâm nước lạnh [[10|phút]] rồi vắt, chua sẽ giảm rõ. Và
      tăng đường lúc xào dưa lên [[2|muỗng cà phê|frac]]. Nhưng đừng giảm lượng
      dưa: dưa ít quá thì đĩa cơm thành cơm rang bò bình thường, mất đúng cái
      làm nên tên món.
  - q: Đây là món "cơm rang" hay "cơm chiên"?
    a: >-
      Cùng một việc, khác chữ theo vùng. Ngoài Bắc gọi là **rang**, trong Nam
      gọi là **chiên** — nên trên site có cả *cơm rang dưa bò* lẫn *cơm chiên cá
      mặn*, và cả hai đều gọi đúng theo nơi món ra đời. Giữ tên gốc là giữ luôn
      cái giọng của vùng đó.

