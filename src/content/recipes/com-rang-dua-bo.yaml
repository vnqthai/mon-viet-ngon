flavorNote: >-
  **Chuẩn đĩa:** hạt cơm **săn rời**, đảo lên nghe lạo xạo chứ không dính bết;
  cọng dưa còn **giòn sựt** và vàng óng chứ không mềm nhũn; lát bò mềm, viền
  hơi sém, cắn vào còn ngọt nước.
storyEyebrow: Chuyện món ăn
storyTitle: Món của **chảo lửa lớn** và của cơm hôm qua
story:
  - >-
    Cơm rang dưa bò là món quán, và là món của **lửa lớn**. Hàng cơm rang đầu
    ngõ nào ở Hà Nội cũng có một cái chảo gang đen bóng đặt trên bếp gas công
    nghiệp cháy ù ù — chảo đủ nóng thì hạt cơm nhảy lên và **săn lại trong vài
    chục giây**, chứ không nằm ì mà đổ mồ hôi.
  - >-
    Ở nhà bếp yếu hơn, nên bù bằng cách khác: **xào tách từng thứ**. Dưa xào
    riêng cho bay hết nước, bò xào riêng lửa lớn nhất rồi trút ra liền, cơm rang
    riêng cho săn hạt. Cách này chậm hơn quán vài phút nhưng ra đúng kết cấu,
    và tránh được lỗi kinh điển là cả đĩa nhão nhoẹt.
  - >-
    **Dưa cải chua** mới là thứ giữ món này đứng riêng. Nó không chỉ cho vị
    chua: cọng dưa vàng óng, cắn **giòn sựt**, và cái chua đó cắt ngang vị béo
    của thịt bò — nên ăn cả đĩa vẫn không thấy ngán. Dưa phải **vắt cho thật
    ráo** rồi mới xào; đây là chỗ quyết định đĩa cơm khô ráo hay ướt nhẹp.
  - >-
    Trên site đã có **cơm chiên cá mặn** — cùng là món cứu cơm nguội, cùng chảo
    lửa lớn. Nhưng đó là món của người Hoa đất Sài Gòn: hạt cơm áo trứng vàng
    ươm, mặn bằng cá mặn, ăn hiền. Còn đĩa cơm rang dưa bò thì **chua và đậm**,
    và ngoài Bắc gọi là *rang* chứ không gọi là *chiên*.

