stepsEyebrow: Vô bếp thôi!
stepsTitle: 7 bước ra **tô hủ tiếu đủ đầy như tiệm**
stepsLead: >-
  Nghe danh sách dài đừng ngán: nồi nước lèo tự sôi lấy 90 phút, mình tranh
  thủ khoảng đó làm hết phần mặt tô là vừa khớp. Xong bước nào đánh dấu
  bước đó, có đồng hồ đếm giờ ngay trong trang.
steps:
  - title: Chần xương, nướng đồ khô
    icon: knife
    minutes: 20 phút
    intro: "Nền của nồi nước lèo trong veo nằm ở đây:"
    bullets:
      - label: "Chần xương:"
        text: >-
          xương ống rửa sạch, chần **3 phút** trong nước sôi có nhúm muối,
          đổ nước, xả kỹ từng khúc, cạo sạch vụn bẩn.
      - label: "Nướng mực:"
        text: >-
          mực khô nướng trên lửa nhỏ (hoặc chảo khô) tới khi **cong nhẹ,
          thơm lựng hai mặt**, xé thành 4–5 miếng lớn cho dễ vớt.
      - label: "Đồ còn lại:"
        text: >-
          tôm khô rửa sơ cho sạch bụi; hành tím nướng xém, cạo vỏ cháy, đập
          dập; củ cải trắng gọt vỏ cắt khúc cỡ ba ngón tay.
    callout:
      type: tip
      text: >-
        Mực nướng rồi mới thả nồi là bí quyết "ăn tiền": mùi khói ngọt của
        mực quyện vô nước lèo thành cái hậu thơm rất Nam Vang — bỏ qua bước
        nướng là nước tanh, uổng con mực.
  - title: Hầm nước lèo — 90 phút lăn tăn
    icon: pot
    minutes: 90 phút
    bullets:
      - text: >-
          Cho xương + tôm khô + mực nướng + củ cải + hành tím vô nồi, châm
          **[[3|lít]] nước lạnh**, thêm [[1|muỗng cà phê]] muối, đun sôi.
      - text: >-
          Sôi thì hớt sạch bọt, hạ lửa **lăn tăn sủi tăm** — mặt nước chỉ
          lay nhẹ, không sôi bùng. Hé vung, hầm đủ **90 phút**.
      - text: Thỉnh thoảng ghé hớt bọt và bớt váng mỡ cho nước thanh.
    callout:
      type: warn
      text: >-
        Sôi bùng là cặn mỡ đánh tan vô nước, nồi nước lèo **đục ngầu hết
        cứu** — công nướng mực rửa tôm coi như đổ sông. Lửa nhỏ tới mức
        chỉ thấy tăm li ti là chuẩn.
    timer:
      secs: 5400
      label: Hẹn giờ hầm nước lèo · 90:00
      doneMsg: Nước lèo ngọt sâu rồi — vớt xác, nêm nếm được!
  - title: Làm phần mặt tô — tranh thủ lúc chờ
    icon: flame
    minutes: 30 phút
    intro: "Cả khay đồ ăn kèm làm gọn trong lúc nồi nước tự sôi:"
    bullets:
      - label: "Trứng cút:"
        text: >-
          luộc **5 phút** từ nước sôi, vớt ngâm nước lạnh rồi lột vỏ — trứng
          trắng nõn, lòng đỏ không xám viền.
      - label: "Thịt nạc:"
        text: >-
          thả nguyên miếng vô **nồi nước lèo đang hầm** luộc 20 phút, vớt
          ngâm nước nguội cho săn, xắt lát mỏng — thịt ngọt mà nồi nước
          càng đậm.
      - label: "Tôm tươi:"
        text: >-
          rửa sạch, luộc nhanh 2–3 phút tới **cong mình đỏ au**, lột vỏ chừa
          đuôi cho đẹp tô.
      - label: "Gan heo:"
        text: >-
          ngâm nước muối loãng 20 phút, **luộc nồi riêng** lửa nhỏ 15 phút,
          ngâm nước nguội rồi xắt lát mỏng.
      - label: "Thịt xay:"
        text: >-
          xào săn với 1 muỗng canh mỡ tỏi + ½ muỗng canh nước mắm + chút
          tiêu, đảo tơi hạt, cạn nước là tắt bếp.
    callout:
      type: tip
      text: >-
        Gan luộc nồi riêng là có lý do: gan ra nhiều bọt và mùi nặng, luộc
        chung là **đục và ám cả nồi nước lèo**. Nhà không ăn gan thì tăng
        tôm hoặc thịt nạc, tô vẫn đề huề.
    timer:
      secs: 300
      label: Hẹn giờ luộc trứng cút · 05:00
      doneMsg: Vớt trứng ngâm lạnh, lột vỏ dễ ơi là dễ!
  - title: Phi tỏi — chữ ký của tô hủ tiếu
    icon: garlic
    minutes: 10 phút
    bullets:
      - text: >-
          Bắc chảo với [[5|muỗng canh]] dầu (hoặc mỡ heo), lửa **vừa**, cho
          tỏi băm vô khi dầu mới ấm — tỏi chín từ từ mới vàng đều.
      - text: >-
          Đảo liên tục tới khi tỏi **vàng ươm, thơm lựng** thì đổ ngay ra
          chén qua cái rây — tỏi phi để ráo, **mỡ tỏi giữ riêng**.
      - text: Nhà làm tóp mỡ thì thắng luôn lúc này, vớt ra để ráo cho giòn.
    callout:
      type: warn
      text: >-
        Tỏi vừa ngả vàng là phải đổ ra **liền** — sức nóng của dầu còn làm
        nó sậm thêm một nấc nữa. Nán chừng mươi giây là tỏi cháy đắng,
        phải phi lại từ đầu.
  - title: Nêm nước lèo — ngọt sâu, mặn dịu
    icon: spoon
    minutes: 10 phút
    bullets:
      - text: >-
          Vớt xương, xác mực, tôm khô, hành tím; **củ cải giữ lại** — miếng
          củ cải hầm mềm trong veo ấy nhiều người giành nhau đó.
      - text: Lược nước lèo qua rây cho trong vắt, đun sôi trở lại.
      - text: >-
          Nêm **[[20|g]] đường phèn** cho tan, thêm muối từng nhúm, cuối
          cùng mới chế [[2|muỗng canh|frac]] nước mắm lúc nước đang sôi.
      - text: >-
          Nếm thử: **ngọt sâu chạy trước, mặn dịu theo sau**, hậu thơm mùi
          mực nướng — nước lèo Nam Vang được phép ngọt nhỉnh hơn phở một
          chút, đúng khẩu vị Sài Gòn.
    callout:
      type: tip
      text: >-
        Thấy nước chưa "dày" vị? Đừng vội thêm mắm — múc một vá nước lèo
        nếm lại lúc **thiệt nóng** rồi hẵng nêm: nước nguội bao giờ cũng
        lạt hơn nước sôi một bậc.
  - title: Trụng sợi — dai đúng điệu
    icon: noodle
    minutes: 10 phút
    bullets:
      - text: Sợi khô **ngâm nước lạnh 10 phút** cho mềm dẻo, để ráo.
      - text: >-
          Nước sôi già, cho sợi vô trụng, đảo nhẹ bằng đũa — canh tới khi
          sợi **vừa chuyển trong, cắn thử còn dai** là vớt liền, xối qua
          nước chín cho hết nhớt bột.
      - text: >-
          Xóc sợi với **1 muỗng canh mỡ tỏi** — sợi rời óng, thơm sẵn mùi
          tỏi, để năm mười phút không dính cục.
    callout:
      type: warn
      text: >-
        Sợi bột lọc chín rất nhanh và **còn chín tiếp trong tô nước nóng**
        — trụng tới mức "vừa miệng" ngay từ nồi là ra tô sẽ nhũn. Vớt lúc
        còn hơi dai già một chút mới là đúng bài.
  - title: Ráp tô đủ đầy
    icon: bowl
    minutes: 10 phút
    bullets:
      - text: Trụng tô nước sôi cho nóng, chia sợi vô ⅔ tô.
      - text: >-
          Xếp mặt tô cho coi được con mắt: **tôm đỏ au, lát thịt, lát gan,
          trứng cút**, múc thịt xay rải giữa.
      - text: >-
          Chan nước lèo **sôi sùng sục** ngập sợi, rắc **tỏi phi + tóp mỡ +
          hẹ cắt khúc + tiêu xay**.
      - text: >-
          Dọn kèm dĩa **giá, xà lách, cần tây**, chanh ớt — rau bỏ vô tô
          nóng tới đâu ăn tới đó mới giòn.
    callout:
      type: tip
      text: >-
        Nhà đông người thì bày kiểu "xe hủ tiếu tại gia": nồi nước lèo giữ
        sôi trên bếp, khay mặt tô để cạnh — ai tới lượt trụng sợi ráp tô
        nấy, vui như mở tiệm.
    doneText: Tô đủ đầy lên mâm — xong!

tipsTitle: 7 bí quyết cho **nồi nước lèo chuẩn Nam Vang**
tipsLead: >-
  Món này nhiều món lặt vặt, nhưng ăn thua nhau đúng ở mấy chỗ này — nắm
  chắc rồi thì tô hủ tiếu nhà không ngán tiệm nào hết.
tips:
  - icon: fish
    title: Tôm khô + mực nướng là "tầng hai"
    text: >-
      Ngọt xương chỉ là tầng trệt; **tầng ngọt đằm kiểu Nam Vang** nằm ở tôm
      khô và mực nướng — thứ ngọt "đồ biển phơi nắng" mà không viên gia vị
      nào giả nổi. Nồi nào bỏ hai thứ này là nước lèo về lại nước hầm
      xương thường ngay.
  - icon: pod
    title: Củ cải trắng — ngọt thanh, nước trong
    text: >-
      Củ cải vừa cho vị ngọt mát, vừa hút bớt mùi nặng của xương heo, nước
      hầm ra **trong và nhẹ** hẳn. Hầm xong đừng bỏ: miếng củ cải trong veo
      mềm rục ấy chấm chút nước mắm ớt là hết ý.
  - icon: garlic
    title: Mỡ tỏi là "nước hoa" của món
    text: >-
      Tỏi phi vàng ươm rắc mặt, còn **mỡ tỏi thì trộn sợi, nêm thịt xay** —
      một công phi tỏi, mùi thơm phủ được cả tô. Tiệm hủ tiếu lâu năm nào
      cũng có hũ mỡ tỏi để riêng, quý như hũ vàng.
  - icon: noodle
    title: Sợi chuyển trong là vớt
    text: >-
      Sợi hủ tiếu bột lọc mỏng, chín nhanh gấp mấy bánh phở — canh màu sợi
      **từ đục sang trong** là mốc vàng để vớt. Trụng lố nửa phút thôi là
      dai thành nhũn, không cứu được nữa.
  - icon: meat
    title: Thịt xay xào săn, đừng luộc
    text: >-
      Thịt xay thả nước luộc là bã và lạt. **Xào săn với mỡ tỏi + nước
      mắm** cho tơi hạt, hơi xém cạnh — múc rải lên tô thơm lựng, đó mới
      là "mô thịt bằm" đúng kiểu Nam Vang.
  - icon: knife
    title: Gan heo — ngâm muối, luộc riêng
    text: >-
      Ngâm nước muối loãng cho gan ra hết máu đọng, luộc **nồi riêng** lửa
      nhỏ rồi ngâm nước nguội — lát gan xắt ra mềm béo bùi, không khô xám,
      và nồi nước lèo chính không bị ám mùi.
  - icon: egg
    title: Trứng cút 5 phút, sốc lạnh
    text: >-
      Luộc đúng **5 phút** rồi ngâm lạnh: vỏ lột trơn tru, lòng đỏ vàng
      ươm không xám viền. Luộc quá lửa trứng vừa khô vừa xỉn — mất điểm
      chữ ký nhận diện của tô Nam Vang uổng lắm.

serve:
  title: Dọn tô — **đủ đầy mới đúng điệu**
  paras:
    - >-
      Tô hủ tiếu bưng ra phải **nóng hôi hổi**: vắt miếng chanh, thả lát
      ớt, gắp đũa sợi dai sần sật quyện tỏi phi, rồi húp một muỗng nước
      lèo — ngọt xương chạy trước, thơm mực nướng đuổi sau, tới đó là hiểu
      vì sao người Sài Gòn ăn sáng món này mấy chục năm không chán. Tôm
      thịt chấm thêm chút **xì dầu dằm ớt** là đúng kiểu tiệm người Hoa.
    - >-
      Nhà đãi khách sáng cuối tuần, món này lợi hại y như **phở bò** hay
      **bún bò Huế**: nước lèo với mặt tô làm sẵn từ chiều trước, sáng ra
      chỉ trụng sợi chan nước, khách tới lúc nào cũng có tô nóng. Đổi tua
      ba món sợi này là cả tháng ăn sáng không trùng bữa.
    - >-
      Bữa nào muốn "lên trình", thử bản **hủ tiếu khô**: sợi trộn xì dầu
      mỡ tỏi, nước lèo để chén riêng — kiểu ăn hai tô họ hàng xa với **phở
      khô Gia Lai** cũng vừa lên site đó. Cách trộn nằm trong phần hỏi đáp
      ngay dưới.
  aside:
    title: Trên bàn hủ tiếu
    intro: "Đủ bộ này là chuẩn tiệm:"
    items:
      - icon: sprout
        text: "**Dĩa giá, xà lách, cần, hẹ** — bỏ vô tô nóng tới đâu ăn tới đó."
      - icon: lime
        text: "**Chanh + ớt xắt** — vắt sát giờ ăn mới thơm."
      - icon: bottle
        text: "**Chén xì dầu dằm ớt** — chấm tôm thịt kiểu tiệm người Hoa."
      - icon: garlic
        text: "**Hũ tỏi phi + tóp mỡ** — ai ghiền cứ tự rắc thêm."

faq:
  - q: Hủ tiếu Nam Vang, Mỹ Tho, hủ tiếu gõ — khác nhau chỗ nào?
    a: >-
      **Nam Vang** gốc Phnom Penh: nước lèo tôm khô mực nướng, mặt tô đề huề
      tôm – trứng cút – thịt bằm – gan. **Mỹ Tho** là niềm kiêu hãnh Tiền
      Giang: ăn nhau ở sợi dai trong làm từ gạo Gò Cát nức tiếng. Còn **hủ
      tiếu gõ** là tô bình dân của Sài Gòn về đêm — xe đẩy gõ lóc cóc, tô
      giản dị vài lát thịt, tóp mỡ, hẹ. Ba anh em ba tính, thương đứa nào
      cũng có lý.
  - q: Không mua được mực khô thì sao?
    a: >-
      Tăng tôm khô lên **70–80 g** và nướng sơ tôm khô trước khi thả nồi
      cho dậy mùi — nước lèo vẫn ngọt đằm, chỉ thiếu chút hậu khói của mực.
      Đừng thay bằng hạt nêm hải sản: ngọt gắt, thơm giả, phí cả nồi xương
      hầm thiệt.
  - q: Không ăn được gan heo, bỏ có mất chất không?
    a: >-
      Không — gan là phần **tùy chọn** từ gốc, nhiều tiệm cho khách chọn
      "không gan" mà. Bù bằng thêm tôm hoặc thịt nạc là tô vẫn đề huề.
      Chỉ đừng bỏ trứng cút với tỏi phi — hai thứ đó mới là chữ ký.
  - q: Ăn kiểu khô thì trộn làm sao?
    a: >-
      Sợi trụng xong cho vô tô, trộn ngay lúc nóng với **1 muỗng canh xì
      dầu + 1 muỗng canh mỡ tỏi + chút đường và giấm** (thích thì thêm
      muỗng tương ớt), xếp mặt tô lên, rắc tỏi phi hẹ. Nước lèo múc **chén
      riêng** thả hẹ, húp xen kẽ. Nhiều người ăn thử bản khô một lần là
      "bỏ phiếu" luôn cho nó đó.
  - q: Sợi dai thay bằng hủ tiếu mềm hoặc bánh phở được không?
    a: >-
      Được — hủ tiếu mềm sợi to trắng đục ăn kiểu người Hoa cũng ngon,
      bánh phở thì thành tô "lai" vui miệng. Nhưng nói thiệt lòng: cái
      **dai sần sật của sợi bột lọc** là một nửa cái thú của hủ tiếu Nam
      Vang — có dịp cứ lùng đúng sợi khô Sa Đéc mà nấu.
  - q: Đãi khách, làm trước được những gì?
    a: >-
      Gần hết: nước lèo hầm xong để nguội cất ngăn mát (3 ngày) hoặc cấp
      đông; tôm, thịt, gan, trứng cút luộc sẵn đậy kín; tỏi phi mỡ tỏi làm
      trước cả tuần cũng được. Sáng đãi khách chỉ còn **đun sôi nước lèo,
      trụng sợi, ráp tô** — 15 phút một lượt bốn tô, nhàn tênh.

