title: Hủ tiếu Nam Vang **nước lèo ngọt sâu, húp một muỗng là ghiền**
summary: >-
  Tô sợi gốc Nam Vang (Phnom Penh) qua tay người Hoa thành đặc sản Sài Gòn:
  nước lèo trong veo **ngọt sâu nhờ tôm khô, mực nướng**, sợi dai sần sật,
  tôm – trứng cút – thịt bằm đề huề, chốt bằng muỗng **tỏi phi thơm lừng**.
region: Miền Nam
category: Món sợi
occasions: [Đãi khách]
time:
  total: 2 giờ 30 phút
servingsBase: 4
difficulty: Kỳ công
featured: false
order: 10
art: hu-tieu
heroEyebrow: Từ Nam Vang ghé bến Sài Gòn…

quick:
  ingredients:
    - >-
      Nước lèo: xương ống heo [[1200|g]] · củ cải trắng [[1|củ]] · tôm khô
      [[50|g]] · mực khô [[1|con|frac]] nướng thơm · hành tím [[3|củ]] nướng
    - Sợi hủ tiếu dai [[500|g]] loại khô (sợi tươi thì [[1000|g]])
    - >-
      Mặt tô: tôm tươi [[300|g]] · thịt heo xay [[250|g]] · thịt nạc
      [[300|g]] · trứng cút [[12|trứng]] · gan heo [[200|g]] (tùy chọn)
    - Tỏi [[1|củ]] phi vàng + mỡ tỏi · tóp mỡ nếu thích
    - Hẹ [[1|bó]] · giá [[200|g]] · xà lách, cần tây · chanh, ớt
    - "Nêm: đường phèn [[20|g]] · muối · nước mắm [[2|muỗng canh|frac]] · tiêu"
  steps:
    - Xương chần kỹ xả sạch; mực khô + hành tím nướng thơm; tôm khô rửa sơ; củ cải cắt khúc.
    - Hầm tất cả với [[3|lít]] nước, **lăn tăn 90 phút**, siêng hớt bọt — nước lèo trong mới đạt.
    - >-
      Làm mặt tô: trứng cút luộc lột vỏ · tôm luộc lột chừa đuôi · thịt nạc
      luộc ngay trong nồi nước lèo, vớt xắt lát · gan luộc riêng · thịt xay
      **xào săn** với tỏi.
    - Phi tỏi **vàng ươm vớt liền**, giữ lại mỡ tỏi — bộ đôi làm nên mùi hủ tiếu.
    - >-
      Nêm nước lèo: đường phèn – muối – nước mắm sau cùng; nếm thấy **ngọt
      sâu, mặn dịu**.
    - Trụng sợi tới **vừa chuyển trong là vớt**, xóc với chút mỡ tỏi cho rời sợi.
    - Ráp tô, chan nước lèo sôi già, rắc tỏi phi – hẹ – tiêu; dọn kèm dĩa giá, xà lách, cần tây.
  warning: >-
    Sợi hủ tiếu dai trụng quá tay là **nhũn cả tô** — sợi vừa chuyển trong
    phải vớt liền; và đừng tiếc công nướng mực: mực không nướng thì nước lèo
    tanh, mất luôn chất Nam Vang.

