flavorNote: >-
  **Chuẩn vị:** nước lèo trong veo mà ngọt **hai tầng** — xương heo làm
  nền, tôm khô mực nướng dội thêm tầng ngọt đằm hương biển; sợi dai sần
  sật, và muỗng tỏi phi rắc sau cùng **thơm chốt tô**, thiếu là lộ liền.
storyEyebrow: Chuyện tô hủ tiếu
storyTitle: Chuyến đi **từ Nam Vang tới Sài Gòn**
story:
  - >-
    Nam Vang là cách người Việt xưa gọi **Phnom Penh**, thủ đô Campuchia —
    và tô hủ tiếu này đúng nghĩa mang tên quê quán trên vai. Gốc của nó là
    món sợi của người Hoa Triều Châu bên xứ chùa tháp; theo chân những gia
    đình người Hoa, người Việt hồi hương giữa thế kỷ trước, nó ghé bến Sài
    Gòn rồi... ở lại luôn. Sài Gòn phóng khoáng nhận món khách phương xa,
    thêm thắt theo ý mình, riết rồi "hủ tiếu Nam Vang" thành một góc không
    thể thiếu của bản đồ ăn sáng thành phố.
  - >-
    Bí mật nằm dưới đáy nồi: ngoài xương ống và củ cải trắng cho vị nền,
    nước lèo Nam Vang phải có **tôm khô và con mực nướng** — hai thứ "đồ
    khô" ấy cho tầng ngọt đằm rất riêng mà nồi nước hầm xương thường không
    bao giờ với tới. Còn trên mặt tô là kiểu hào phóng thấy là thương:
    tôm đỏ au, trứng cút tròn xinh, thịt bằm tơi, lát gan béo bùi — và
    muỗng **tỏi phi vàng ươm** rưới sau cùng, thơm tới mức chưa kịp ngồi
    xuống ghế đã nuốt nước miếng.
  - >-
    Món này nằm ở bậc "kỳ công" của nhà mình — không khó, chỉ nhiều việc
    lặt vặt — nên khôn nhất là nấu khi nhà có dịp tụ tập: một nồi nước lèo,
    mấy dĩa mặt tô soạn sẵn, ai tới trụng sợi chan nước tới đó. Ăn kiểu
    nước hay kiểu khô đều được — bản nước nằm trọn trong bài, bản khô nằm
    chờ ở phần hỏi đáp.

