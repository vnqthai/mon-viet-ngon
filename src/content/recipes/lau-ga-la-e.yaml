title: Lẩu gà lá é **nước trong ngọt thịt, lá é thơm the**
summary: >-
  Nồi lẩu gốc Phú Yên: **gà thả vườn ướp ớt xiêm xanh**, nước dùng trong veo
  không màu mè, tới lúc ăn mới thả nắm lá é xuống cho dậy mùi the the. Chén
  chấm là **muối ớt xanh giã với lá é** — thiếu nó thì món này mất một nửa.
