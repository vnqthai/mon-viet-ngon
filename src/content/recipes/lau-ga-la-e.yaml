flavorNote: >-
  **Chuẩn vị:** nước dùng **trong, không váng màu**, ngọt của gà đi trước rồi
  tới cái the mát của lá é. Cay phải là **cay xanh của ớt xiêm** — nồng mà
  tan nhanh, khác hẳn cái cay đỏ rát của ớt bột.
storyEyebrow: Chuyện nồi lẩu gà lá é
storyTitle: Món của **Phú Yên**, nổi tiếng nhờ **Đà Lạt**
story:
  - >-
    Lá é là thứ rau thơm họ húng quế, người ta còn gọi là **é trắng** hay
    **trà tiên**. Lá nhỏ, có lông tơ, ăn sống thì the the, mà thả vào nước
    nóng là dậy lên một mùi rất riêng — không ngọt gắt như húng quế, cũng
    không hắc như tía tô. Ở Phú Yên, cây é mọc được quanh vùng nắng gió, và
    bếp nhà ở đó dùng lá é nấu gà từ lâu, ban đầu chỉ là **nồi gà nấu kiểu
    vùng núi**, đơn sơ, ăn tại chỗ.
  - >-
    Rồi món này đi lên cao nguyên. Đà Lạt lạnh, mà nồi lẩu nóng có mùi the
    thì hợp thời tiết tới mức người ta kéo nhau đi ăn quanh năm — tới giờ đi
    Đà Lạt vẫn thấy hàng loạt quán treo bảng "lẩu gà lá é Phú Yên". Điều thú
    vị là **cái tên vẫn giữ chữ Phú Yên**: gà thì nuôi đâu cũng có, nhưng lá é
    thơm đúng kiểu thì người bán vẫn nói phải là lá chở từ Phú Yên lên.
  - >-
    Nấu ở nhà thì món này dễ hơn vẻ ngoài của nó rất nhiều. Nước dùng **không
    quế hồi, không sa tế, không màu điều** — chỉ có sả, măng và con gà. Cái
    khó duy nhất là **giữ mùi lá é**, mà giữ mùi thì chỉ có một luật: thả thật
    trễ. Ai quen tay nấu lẩu kiểu đậm đà sẽ thấy nồi này nhạt lúc mới nếm —
    đó là đúng, vì vị đậm nằm ở chén muối ớt xanh bên cạnh chứ không nằm
    trong nồi.

