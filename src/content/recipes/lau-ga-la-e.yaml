quick:
  ingredients:
    - Gà thả vườn [[1|con|frac]] (1,2–1,5 kg) — chặt miếng vừa gắp
    - Lá é [[300|g]] — **rau thơm họ húng quế**; nửa giã lấy mùi, nửa để nhúng
    - Ớt xiêm xanh [[15|trái]] · sả [[3|cây]] · hành tím [[5|củ]]
    - Măng tươi [[300|g]] hoặc măng le — luộc kỹ 2–3 nước
    - Nấm bào ngư [[200|g]] · bún tươi [[800|g]]
    - "Chén chấm: muối hột · ớt xiêm xanh · lá é · chanh"
    - "Nêm: nước mắm · hạt nêm · đường · tiêu"
  steps:
    - Gà chặt miếng, ướp **ớt xiêm xanh giã + hành tím + nước mắm** để 30 phút.
    - Măng luộc **2–3 lần nước sôi**, xả lại cho hết vị đắng và mùi hăng.
    - Nấu nồi nước với sả đập dập, thả măng vào nấu 20 phút, hớt bọt.
    - Thả gà đã ướp vào, hầm **liu riu 20–25 phút** cho thịt mềm mà chưa rã.
    - Giã một nửa chỗ lá é với chút muối, thả vào nồi ngay trước khi bưng ra.
    - Giã **muối ớt xanh với lá é** làm chén chấm; ăn tới đâu nhúng lá é tươi tới đó.
  warning: >-
    **Lá é không được nấu lâu.** Thả xuống rồi để sôi vài phút là mùi bay hết
    mà nước lại ngả đắng. Đúng cách là thả sát giờ ăn, và phần lá để nhúng thì
    chỉ dìm xuống nước sôi vài giây rồi gắp lên liền.

