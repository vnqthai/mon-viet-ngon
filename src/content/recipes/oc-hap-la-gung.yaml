stepsTitle: Bốn nhịp — nhịp **khều thịt ốc** cần kiên nhẫn nhất
stepsLead: >-
  Ngâm ốc mất vài tiếng nên tính giờ từ hôm trước là gọn nhất. Ba nhịp còn lại
  gói trong chừng một tiếng.
steps:
  - title: Ngâm và khều thịt ốc
    icon: drop
    minutes: 2–3 giờ + 25 phút
    bullets:
      - text: >-
          Kì cọ vỏ ốc cho sạch rêu, ngâm ngập nước vo gạo với vài lát ớt **2–3
          tiếng**, giữa chừng thay nước một lần.
      - label: "Lấy thịt:"
        text: >-
          **Đập nhẹ phần trôn ốc** (chóp nhọn ở đáy) cho thủng một lỗ, rồi dùng
          que khều kéo cả con thịt ra từ miệng vỏ. Cắt bỏ phần ruột đen ở đuôi,
          chỉ giữ phần thịt trắng và mày ốc.
      - label: "Khử nhớt:"
        text: >-
          Bóp thịt ốc với muối hột và nước cốt chanh, chà nhẹ tay rồi rửa lại
          **ba bốn lần** tới khi tay sờ không còn thấy nhớt. Để thật ráo.
      - label: "Giữ lại vỏ:"
        text: >-
          Rửa sạch trong lòng vỏ, luộc sơ nước sôi 2 phút rồi úp cho ráo — lát
          nữa nhét nhân vào chính những cái vỏ này.
    timer:
      secs: 3600
      label: Hẹn giờ ngâm ốc · 60:00
      doneMsg: Thay nước rồi ngâm thêm một tiếng nữa nghen!
    callout:
      type: warn
      text: >-
        Con nào ngâm xong vẫn đóng mày kín, đập ra thấy có mùi thì bỏ hẳn. Thịt
        ốc chết trộn vào nhân là cả mẻ có mùi, mà lúc hấp xong mới biết.
  - title: Trộn nhân
    icon: knife
    minutes: 15 phút
    bullets:
      - text: >-
          Băm thịt ốc **dối tay** — để còn miếng cỡ hạt đậu chứ đừng băm nhuyễn,
          cái giòn sần sật của ốc nằm ở đó.
      - text: >-
          Trộn thịt ốc với giò sống, thịt xay, nấm hương và mộc nhĩ băm, nước
          gừng, tiêu, hạt nêm và hành hoa. Trộn đều tay cho quyện.
      - text: Để nghỉ **15 phút** cho ngấm rồi mới gói.
    callout:
      type: tip
      text: >-
        Muốn chắc ăn thì lấy một thìa nhân **hấp thử 3 phút** rồi nếm trước khi
        gói cả mẻ. Nhạt thì thêm hạt nêm, còn thấy tanh thì thêm nước gừng và
        tiêu — chữa lúc này còn kịp.
  - title: Gói lá gừng, nhét vào vỏ
    icon: roll
    minutes: 20 phút
    intro: "Đây là nhịp làm nên hình dáng của món:"
    bullets:
      - label: "Lót trước:"
        text: >-
          Nhét một mẩu lá gừng vào sâu trong lòng vỏ để nhân không dính đáy.
      - label: "Gói:"
        text: >-
          Trải một tàu lá gừng, đặt viên nhân cỡ quả quất lên gần cuống lá, cuốn
          lá lại quanh viên nhân thành một gói thon.
      - label: "Nhét ngược vào vỏ:"
        text: >-
          Đẩy phần viên nhân vào trước, để **đầu lá thò ra ngoài miệng vỏ** chừng
          [[3|cm]]. Đó là cái quai để kéo ra lúc ăn.
      - text: Làm lần lượt cho hết, xếp đứng miệng vỏ lên trên vào xửng hấp.
  - title: Hấp và pha nước chấm
    icon: pot
    minutes: 15 phút
    bullets:
      - text: >-
          Rắc sả đập dập, lá chanh và gừng thái lát lên trên mặt xửng. Đậy vung,
          **hấp lửa vừa 15 phút** kể từ lúc nước sôi.
      - text: >-
          Trong lúc chờ, pha nước chấm: nước mắm, đường, giấm và nước khuấy tan,
          cho gừng tỏi ớt giã vào, rắc lá chanh thái chỉ.
      - text: >-
          Ốc chín khi đầu lá gừng ngả màu xanh sẫm và viên nhân se mặt. Dọn ra
          đĩa **lúc còn nóng**, miệng vỏ hướng lên.
    timer:
      secs: 900
      label: Hẹn giờ hấp ốc · 15:00
      doneMsg: Mở vung ra — mùi lá gừng lên là được rồi!
    doneText: Xong — kéo đầu lá là cả viên nhân ra gọn!

tipsTitle: 4 chỗ **quyết định** đĩa ốc hấp lá gừng
tips:
  - icon: shrimp
    title: Mua đúng ốc nhồi, đừng nhầm ốc bươu vàng
    text: >-
      Ốc nhồi (ốc bươu đen) vỏ dày, có vằn ngang mờ, con to; ốc bươu vàng vỏ
      mỏng bóng và tròn trịa hơn, thịt có một cục màu cam mà ốc nhồi không có.
      Ốc bươu vàng rẻ hơn nên hay bị trộn vào. Thịt nó bở và nhạt, băm ra trộn
      nhân là mất hẳn cái sần sật vốn là điểm của món.
  - icon: lime
    title: Bóp chanh muối kỹ — nhớt là hỏng cả mẻ
    text: >-
      Con ốc nhồi rất nhiều nhớt, và nhớt thì không bay đi trong lúc hấp. Bóp
      muối hột với chanh, chà nhẹ, rửa lại ba bốn lần cho tới khi sờ thấy ráo
      tay. Đây là bước tốn công nhất mà cũng là bước ai làm ẩu cũng bị lộ.
  - icon: knife
    title: Băm dối tay, đừng băm nhuyễn
    text: >-
      Nếu băm thịt ốc nhuyễn như thịt xay thì viên nhân ra một khối mềm đều —
      ngon nhưng không còn nhận ra đó là ốc. Băm còn miếng cỡ hạt đậu thì cắn
      vào gặp chỗ sần sật xen trong chỗ mịn của giò sống, đúng cái tương phản
      làm nên món.
  - icon: herb
    title: Lá gừng non, và phải để một đầu thò ra
    text: >-
      Lá già gói dễ gãy và mùi kém hẳn. Chọn lá non dài, gói xong chừa **một đầu
      lá thò khỏi miệng vỏ** — vừa để nhận ra con nào đã nhồi, vừa làm cái quai
      kéo viên nhân ra. Không có nó thì lại phải lể bằng tăm, mất hết cái gọn
      gàng của món cỗ.

serve:
  title: Đĩa ốc **bày miệng lên** — món của mâm cỗ, ăn thong thả
  paras:
    - >-
      Ốc hấp lá gừng bày ra đĩa, tất cả quay miệng vỏ lên trên cho thấy những
      đầu lá xanh thò ra. Nó là món khai vị của mâm cỗ chứ không phải món ăn no
      — mỗi người vài con, cầm vỏ lên, kéo đầu lá, chấm rồi ăn cả viên.
    - >-
      Ăn nóng là bắt buộc. Nguội đi thì mùi lá gừng bay mất và viên nhân se lại.
      Nếu chưa dọn ngay thì **cứ để nguyên trong xửng đậy vung**, tới lúc ăn hấp
      lại 3 phút là như mới.
  aside:
    title: Ăn thế nào cho gọn
    intro: "Ba việc nhỏ, làm theo là con nào cũng ra nguyên viên:"
    items:
      - icon: herb
        text: "**Cầm đầu lá gừng kéo thẳng ra** — cả viên nhân trôi theo, không cần tăm."
      - icon: bowl
        text: "**Chấm nước mắm gừng** rồi ăn cả gói, đừng bóc lá bỏ đi — mùi nằm ở đó."
      - icon: drop
        text: "**Một bát không để bỏ vỏ**, và một đĩa nhỏ đựng lá đã ăn."

faq:
  - q: Không kiếm được lá gừng thì thay bằng gì?
    a: >-
      Không có thứ thay đúng — mùi lá gừng là tên của món. Gần nhất là **lá
      chanh non xếp chồng hai lá** để gói, mùi cũng the nhưng gắt hơn và hơi
      đắng. Nhà nào hay làm món này thì trồng một chậu gừng ngoài ban công, hái
      quanh năm.
  - q: Nhân bị rời ra khi kéo lá?
    a: >-
      Do thiếu giò sống hoặc trộn chưa quyện. Giò sống là chất kết dính duy nhất
      trong viên nhân; ít quá thì nó không giữ được thịt ốc băm dối. Trộn đều
      tay tới khi hỗn hợp dính thành khối, và nhồi cho **nén chặt** vào vỏ chứ
      đừng để lỏng lẻo.
  - q: Ăn vẫn thấy hơi tanh thì chữa sao?
    a: >-
      Hai chỗ hay thiếu: **ngâm chưa đủ giờ** và **bóp chanh muối chưa kỹ**. Lần
      sau ngâm 2–3 tiếng có thay nước, bóp muối chanh ba bốn lần. Mẻ đang làm dở
      thì tăng nước gừng và tiêu trong nhân, rắc thêm lá chanh lên xửng lúc hấp.
  - q: Làm trước rồi hấp sau được không?
    a: >-
      Được, và nên vậy nếu làm cỗ. Nhồi xong xếp vào hộp, cất ngăn mát **trong
      ngày**, tới bữa mới hấp 15 phút. Đừng hấp trước rồi hâm lại — hấp hai lần
      thì viên nhân se lại và lá gừng ngả vàng, mùi bay gần hết.

