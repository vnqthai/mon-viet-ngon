quick:
  ingredients:
    - Ốc nhồi [[1|kg]] — con to, vỏ dày có vằn ngang, **không phải ốc bươu vàng**
    - Giò sống [[100|g]] · thịt nạc vai xay [[100|g]]
    - Lá gừng non [[25|lá]] — vừa để gói vừa để lót
    - Nấm hương [[6|cái]] · mộc nhĩ [[5|tai]] — ngâm nở, băm nhỏ
    - "Nêm nhân: nước gừng [[2|muỗng canh|frac]] · tiêu · hạt nêm · hành hoa"
    - "Hấp cùng: sả đập dập · lá chanh · gừng thái lát"
    - "Nước chấm: nước mắm · đường · giấm · gừng tỏi ớt giã · lá chanh thái chỉ"
  steps:
    - Ngâm ốc nước vo gạo có vài lát ớt **2–3 tiếng** cho nhả hết nhớt và bùn.
    - >-
      **Đập nhẹ trôn ốc** khều lấy thịt, bỏ phần ruột đen; bóp chanh với muối
      hột cho hết nhớt rồi rửa lại thật sạch. Rửa và giữ lại phần vỏ.
    - Băm thịt ốc, trộn với giò sống, thịt xay, nấm hương, mộc nhĩ, nước gừng và gia vị.
    - Trải lá gừng, đặt viên nhân lên, cuốn lại rồi **nhét ngược vào vỏ ốc**, chừa đuôi lá ló ra.
    - Xếp vào xửng, rắc sả lá chanh gừng lên trên, **hấp 15 phút** là chín.
  warning: >-
    Đừng bỏ qua khâu bóp chanh muối cho thịt ốc. Con ốc nhồi nhiều nhớt, rửa
    nước không thôi là **nhân vẫn nhớt và tanh** — hấp lên mới phát hiện thì
    không cứu được nữa.

