title: Ốc hấp lá gừng **cuốn lại, nhét ngược vào vỏ**
summary: >-
  Món cỗ mùa thu của bếp Bắc: thịt **ốc nhồi** băm trộn giò sống, nấm hương và
  mộc nhĩ, gói trong tàu lá gừng non rồi nhét ngược vào chính cái vỏ ốc mà hấp.
  Mở nắp xửng là mùi lá gừng xông lên trước cả mùi ốc.
region: Miền Bắc
category: Hấp
