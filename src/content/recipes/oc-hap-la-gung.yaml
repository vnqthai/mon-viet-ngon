flavorNote: >-
  **Chuẩn đĩa:** mở xửng ra là mùi **lá gừng** dậy lên trước; cắn vào viên nhân
  thấy **giòn sần sật của thịt ốc** lẫn trong chỗ mềm mịn của giò sống, không
  nhớt, không tanh. Chấm nước mắm gừng chua ngọt có lá chanh thái chỉ.

storyEyebrow: Chuyện món ăn
storyTitle: Cái vỏ ốc làm **cái nồi con**, tàu lá gừng làm **cái nắp thơm**
story:
  - >-
    Ốc hấp lá gừng là món cỗ cũ của người Hà Nội, hay gặp nhất vào **mùa thu** —
    lúc trời trở mát và con ốc nhồi béo nhất trong năm. Nó thuộc loại món bày
    trên mâm cỗ để nhìn cho vui mắt chứ không phải món ăn cho no: mỗi người vài
    con, gỡ ra nhấm nháp.
  - >-
    Cách làm có một chỗ rất khéo. Thịt ốc gỡ ra, băm lên rồi trộn với giò sống —
    tức là đã rời khỏi cái vỏ — vậy mà người ta **nhét ngược trở lại vào chính
    cái vỏ đó** để hấp. Cái vỏ thành một cái nồi con: hơi nước không chạm thẳng
    vào nhân, viên chả chín từ từ trong hơi nóng của chính nó, nên giữ được nước
    ngọt thay vì nhão ra.
  - >-
    Tàu lá gừng gói bên ngoài viên nhân thì làm hai việc. Một là ngăn nhân dính
    vào lòng vỏ, gỡ ra nguyên viên. Hai — và đây mới là chính — là **ướp mùi**:
    lá gừng non gặp hơi nóng tỏa ra một mùi thơm the và ấm, khác hẳn mùi củ
    gừng già, và mùi đó ngấm thẳng vào viên chả trong lúc hấp.
  - >-
    Người ta cố ý để **một đầu lá thò ra khỏi miệng vỏ**. Nhìn thì tưởng để cho
    đẹp, nhưng thật ra đó là cái quai: cầm đầu lá kéo một cái là cả viên nhân
    trôi ra gọn, khỏi phải lể bằng tăm. Món cỗ nhà ai cũng có mẹo riêng, mẹo của
    món này nằm ở cọng lá thò ra ấy.

