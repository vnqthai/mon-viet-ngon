title: Bò lúc lắc **xém cạnh ngoài, mềm mọng trong**
summary: >-
  Khối bò thăn áp chảo **lửa khói xém bốn mặt** mà lòng vẫn mềm mọng, lắc
  cùng hành tây ớt chuông giòn ngọt, đá thêm miếng bơ tỏi thơm lừng — món
  "ăn tiệm" ngày xưa mà nay 30 phút là nhà mình có.
region: Miền Nam
category: Xào
occasions: [Nhậu lai rai, Đãi khách]
