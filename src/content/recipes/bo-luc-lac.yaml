quick:
  ingredients:
    - Thăn bò (phi lê) [[600|g]] — cắt khối quân cờ **2.5 cm**
    - "Ướp 15 phút: tỏi băm [[3|tép]] · dầu hào [[1|muỗng canh|frac]] · xì dầu [[1|muỗng canh|frac]] · đường [[1|muỗng cà phê]] · tiêu · dầu ăn [[1|muỗng canh|frac]]"
    - Hành tây [[1|củ]] bổ múi · ớt chuông xanh + đỏ mỗi thứ [[0.5|trái|frac]] cắt quân cờ
    - "Sốt: xì dầu [[1|muỗng canh|frac]] · dầu hào [[1|muỗng canh|frac]] · tương cà [[1|muỗng canh|frac]] · đường [[1|muỗng cà phê]] · nước [[2|muỗng canh|frac]]"
    - Bơ lạt [[20|g]] + tỏi đập — thả phút cuối
    - "Ăn kèm: xà lách, cà chua, dưa leo lót dĩa · **muối tiêu chanh** · cơm nóng / khoai tây chiên / bánh mì"
  steps:
    - Bò cắt khối 2.5 cm, ướp đủ bộ gia vị **15 phút** (đừng ướp mặn tay — còn sốt).
    - Xếp xà lách cà chua dưa leo ra dĩa; pha sẵn chén sốt.
    - Chảo **nóng tới bốc khói nhẹ**, tráng dầu, thả bò **một lớp thưa** — để yên 40 giây cho xém rồi mới **lắc chảo** cho vàng mặt khác; chia **2 mẻ**, mỗi mẻ ~2 phút, trút ra dĩa.
    - Vẫn chảo đó xào hành tây + ớt chuông **2 phút lửa lớn** — vừa chín tới còn giòn.
    - Đổ bò về chảo + chén sốt, lắc đều 30 giây, thả **bơ + tỏi đập**, đảo một vòng là tắt bếp — đổ lên dĩa rau, dọn kèm muối tiêu chanh.
  warning: >-
    Kẻ thù số một của bò lúc lắc là **chảo chưa đủ nóng và tham dồn một
    mẻ** — bò xuống chảo mà không nghe "xèo" giòn là đang bị luộc: ra
    nước, dai nhách, xám xịt. Chảo khói, chia mẻ, thịt mới xém đẹp.

flavor:
  chua: 1
  ngot: 5
  man: 6.5
  cay: 1.5
  thom: 8.5
flavorNote: >-
  **Chuẩn dĩa bò lúc lắc:** khối bò **nâu xém bốn mặt, cắn vô lòng còn
  hồng mềm mọng**, sốt mặn ngọt bóng nhẹ ôm lấy thịt, hành tây ớt chuông
  còn giòn — và mùi bơ tỏi bay lên là cả nhà tự động ngồi vô bàn.
storyEyebrow: Chuyện dĩa bò
storyTitle: Món **Tây học** mà rất Sài Gòn
story:
  - >-
    Bò lúc lắc là đứa con lai của thời bếp Việt gặp bếp Pháp: miếng bít-tết
    Tây vào tay người mình được **cắt khối quân cờ, ướp xì dầu tỏi tiêu,
    xào lửa lớn** kiểu chảo Á. Cái tên thì thiệt thà hết mức — nấu món này
    là phải **lúc lắc cái chảo** cho khối thịt lăn qua lăn lại, xém đều
    bốn mặt, tên món dạy luôn cách nấu.
  - >-
    Có thời bò lúc lắc là món "ăn tiệm" sang trọng — tiệc tùng, nhà hàng
    mới thấy, dọn trên dĩa xà lách với **khoai tây chiên vàng ruộm** rất
    kiểu Sài Gòn. Giờ thịt bò dễ mua, bí quyết cũng chẳng còn bí: toàn bộ
    nằm ở **nhiệt** — chảo thật nóng, thịt thật khô, tay thật dứt khoát.
  - >-
    Đây là món "đầu tư ít, nở mặt nhiều" nhất kho bếp: 30 phút từ thớt ra
    bàn mà dĩa bò bóng lừng thơm mùi bơ tỏi, đãi khách hay chiều con nít
    đều trúng. Học xong bài lắc chảo này, mấy món xào lửa lớn khác coi như
    ... học ké được nửa đường.

