title: Bò nướng lá lốt **lá sém thơm, thịt mọng bên trong**
summary: >-
  Thịt bò băm trộn sả tỏi, cuốn trong lá lốt rồi đặt lên vỉ than. Lá gặp lửa
  **quăn lại, sém cạnh và dậy mùi thơm hắc rất riêng**, bên trong miếng thịt
  vẫn còn mọng nước. Cuốn bánh tráng với bún và rau, chấm mắm nêm là hết dĩa.
region: Miền Nam
category: Nướng
occasions: [Nhậu lai rai, Đãi khách]
pubDate: 2026-08-01
