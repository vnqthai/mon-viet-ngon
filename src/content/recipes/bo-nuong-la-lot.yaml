quick:
  ingredients:
    - Thịt bò băm [[500|g]] — nạc vai hoặc bắp, băm thô còn thấy thớ
    - Lá lốt [[40|lá]] — chọn lá to bằng bàn tay, mặt lá xanh sậm
    - Sả [[3|cây]] · tỏi [[6|tép]] · hành tím [[4|củ]] · mỡ heo [[50|g]]
    - "Ướp: dầu hào [[1|muỗng canh]] · nước mắm [[1|muỗng canh]] · tiêu · đường"
  steps:
    - Rửa lá lốt, để **thật ráo**, cắt bỏ cuống dài. Chọn riêng lá to để cuốn, lá nhỏ thái sợi trộn vào nhân.
    - Trộn thịt bò với sả tỏi hành băm, mỡ heo thái hạt lựu, lá lốt thái sợi và gia vị.
    - Ướp **30 phút** trong ngăn mát cho thịt săn lại và thấm.
    - "Cuốn: đặt thìa nhân lên **mặt nhạt của lá** (mặt gân nổi), gấp hai bên rồi cuộn tròn — mặt xanh sẫm bóng quay ra ngoài."
    - Ghim mép bằng cuống lá hoặc tăm; xiên 4–5 cuốn vào một xiên cho dễ trở.
    - Nướng than hồng **6–9 phút**, trở đều tay, quét chút dầu ở phút cuối.
    - Dọn nóng cùng bún, bánh tráng, rau sống và chén mắm nêm.
  warning: >-
    Lá còn ướt là gặp lửa **xì nước và rách bung**, nhân rơi xuống than. Rửa
    xong trải ra rổ hay khăn, để ráo hẳn — mất mười lăm phút nhưng không bỏ
    qua được.

flavor:
  chua: 1
  ngot: 3
  man: 6
