flavorNote: >-
  **Chuẩn cuốn bò lá lốt:** mặt lá **quăn lại, xanh sẫm gần đen và sém lấm tấm
  vài chỗ**, cầm lên thấy khô ráo chứ không ướt dầu. Cắn vào thì lá giòn nhẹ
  rồi tới miếng thịt **còn mọng nước bên trong**, mùi lá lốt nổi lên trước cả
  mùi thịt.
storyEyebrow: Chuyện dĩa bò lá lốt
storyTitle: Món mà **cái lá quan trọng hơn miếng thịt**
story:
  - >-
    Bò nướng lá lốt nhìn thì đơn giản — thịt bò băm cuốn trong lá rồi nướng —
    nhưng cái quyết định món lại là **cái lá**. Lá lốt có mùi thơm hắc rất
    riêng, hơi nồng, và mùi đó chỉ bật ra khi lá gặp lửa và quăn lại. Cùng
    khối thịt đó mà vo viên nướng trần thì ra một món khác hẳn.
  - >-
    Vì vậy nên cách cuốn có luật của nó: nhân đặt lên **mặt nhạt có gân nổi
    của lá**; mặt xanh sẫm bóng nằm ra ngoài, gặp than sẽ sém đẹp và không
    rách. Cuốn ngược mặt thì lá dễ bung và nhìn xỉn.
  - >-
    Món này gần như luôn xuất hiện trên bàn nhậu và mâm cỗ ở miền Nam, dọn kèm
    bánh tráng, bún, rau sống và chén mắm nêm. Ăn kiểu cuốn: trải bánh tráng,
    xếp bún, rau, đặt một cuốn lá lốt lên rồi cuộn lại chấm ngập.

