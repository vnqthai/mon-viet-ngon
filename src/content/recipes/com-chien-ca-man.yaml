flavorNote: >-
  **Chuẩn vị:** hạt cơm săn rời áo trứng vàng óng, cắn trúng vụn cá là vị
  **mặn thơm bùng lên rồi dịu liền** nhờ gà xé và cơm — muốn ăn miếng nữa
  ngay chứ không mặn gắt đọng cổ.
storyTitle: Từ tiệm cơm **Chợ Lớn** ra mâm cơm nhà
story:
  - >-
    Ghé mấy tiệm cơm người Hoa quanh vùng Sài Gòn – Chợ Lớn, thế nào bạn
    cũng gặp mùi này: mùi cá mặn chạm chảo dầu nóng, mặn mòi mà thơm tới
    mức đứng ngoài cửa đã nghe đói bụng. Cơm chiên cá mặn theo chân các đầu
    bếp người Hoa vào Nam từ thuở nào, rồi "nhập tịch" luôn vô thực đơn
    quán cơm miền Nam — món gọi thêm mà bàn nào cũng gọi.
  - >-
    Cá mặn là thứ phải nói cho rõ kẻo mua lộn: đó là **cá biển muối nguyên
    con rồi đem phơi** — thường là cá thu, có nơi làm cá chét — nằm đâu đó
    **giữa con khô và hũ mắm**. Thịt cá màu hồng sậm, còn dẻo còn mềm chứ
    không khô xác; ra chợ cứ hỏi sạp khô tiếng "cá thu mặn" là người ta
    hiểu liền. Một miếng bằng hai ngón tay thôi mà chiên lên dậy mùi nguyên
    căn bếp — gần như khỏi nêm nếm gì thêm cho cả chảo cơm.
  - >-
    Cái hay của món này với bếp nhà là nó **chiều mình hết mực**: cơm nguội
    hôm qua, miếng gà luộc còn dư, khứa cá để dành trong hũ — nửa tiếng sau
    thành dĩa cơm nóng hổi ra dáng nhà hàng. Bí quyết chỉ nằm ở hai chữ:
    cơm phải **nguội ráo**, lửa phải **thiệt lớn**. Còn lại, cá mặn tự lo
    phần ngon.

