title: Cơm chiên cá mặn **hạt cơm săn rời, dậy mùi là đói**
summary: >-
  Món "ruột" của tiệm cơm người Hoa đất Sài Gòn: cơm nguội chiên **săn từng
  hạt áo trứng**, vụn cá mặn thơm nức mũi, gà xé cân vị — chảo vừa dậy mùi
  là cả nhà tự động đi dọn chén.
