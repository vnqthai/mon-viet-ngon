quick:
  ingredients:
    - >-
      Cá mặn (cá thu mặn) [[80|g]] — hỏi sạp khô ngoài chợ, chọn miếng thịt
      hồng sậm còn dẻo
    - Cơm nguội [[4|chén]] — nấu hôm trước để ngăn mát là "chuẩn bài" nhất
    - Ức hoặc đùi gà [[250|g]] luộc xé sợi · trứng gà [[3|quả]]
    - Tỏi [[4|tép]] băm · hành lá [[4|nhánh]] · gừng [[4|lát]] để chiên cá
    - "Nêm nhẹ tay: đường [[1|muỗng cà phê]] · tiêu · nước tương (nếm rồi mới thêm)"
    - "Dọn kèm: dưa leo, cà chua · xà lách trộn dầu giấm · chén xì dầu ớt"
  steps:
    - >-
      Luộc gà với vài lát gừng chừng 15 phút, vớt ra để nguội, **xé sợi**;
      nước luộc giữ lại nấu canh.
    - >-
      Cá mặn rửa nhanh, thấm thật khô; chiên **lửa vừa** với gừng tới vàng
      hai mặt, để nguội.
    - Gỡ xương thật kỹ, xé giã vụn cỡ hạt bắp.
    - >-
      Phi tỏi thơm, đổ trứng đánh tan vô, trứng **vừa se còn ướt** là trút
      cơm nguội vô liền, đảo tơi.
    - >-
      Mở **lửa lớn**, đảo mạnh tay cho hạt cơm săn mặt nghe lạo xạo — cho
      vụn cá + gà xé vô, đảo 2 phút cho dậy mùi.
    - Nếm trước rồi nêm nhẹ đường – tiêu, rắc hành lá, đảo một vòng, tắt bếp.
    - Úp chén cơm ra dĩa cho tròn vun, dọn kèm rau tươi và chén xì dầu ớt.
  warning: >-
    Nêm tay quen như cơm chiên thường là **mặn chát hết cứu** — cá đã gánh
    trọn phần mặn của cả chảo, cứ nêm thiếu rồi nếm, thiếu thiệt mới thêm.

flavor:
