stepsTitle: 6 bước ra **ụ cơm vàng kiểu tiệm**
stepsLead: >-
  Trình tự khôn nhất: bắc nồi luộc gà trước rồi tranh thủ chiên cá, gỡ
  xương — gà nguội vừa kịp xé là cơm cũng vừa lên chảo. Một mạch là xong.
steps:
  - title: Luộc gà, xé sợi
    icon: pot
    minutes: 20 phút
    bullets:
      - text: >-
          Ức hoặc đùi gà rửa sạch, cho vô nồi nước **ngập mặt** cùng vài
          lát gừng và nhúm muối.
      - text: >-
          Nước sôi thì hớt bọt, hạ **liu riu 12–15 phút** (ức 12, đùi 15),
          tắt bếp đậy nắp ủ thêm 5 phút cho chín thấu.
      - text: >-
          Vớt gà để nguội rồi **xé sợi vừa gắp** — đừng xé chỉ nhỏ quá,
          chiên lên khô xác mất ngon.
      - label: "Nước luộc:"
        text: >-
          đừng đổ nghen — thả miếng bí, nắm cải là có chén canh ngọt kèm
          cơm chiên, đúng bộ tiệm cơm.
    callout:
      type: tip
      text: >-
        Nhà có sẵn gà luộc dư từ bữa trước thì bước này khỏi luôn — món
        này sinh ra để "giải cứu" đồ dư tủ lạnh mà.
    timer:
      secs: 900
      label: Hẹn giờ luộc gà · 15:00
      doneMsg: Tắt bếp, ủ 5 phút nữa nghen!
  - title: Chiên vàng cá mặn
    icon: fish
    minutes: 8 phút
    bullets:
      - text: >-
          Cá mặn **rửa nhanh** dưới vòi nước cho trôi bụi muối, thấm thật
          khô bằng giấy bếp — càng khô chiên càng thơm, đỡ văng dầu.
      - text: >-
          Chảo dầu nóng **lửa vừa**, thả mấy lát gừng cho thơm rồi cho cá
          vô.
      - text: >-
          Chiên mỗi mặt chừng **2 phút** tới vàng nâu đều, gắp ra giấy
          thấm dầu, để nguội bớt.
    callout:
      type: warn
      text: >-
        Cá mặn ít nước, **bén lửa rất nhanh** — lửa lớn là mép cá cháy
        đen, đắng lây cả chảo cơm. Lửa vừa thôi, đứng canh sát.
    timer:
      secs: 120
      label: Hẹn giờ chiên cá · 02:00
      doneMsg: Lật mặt cá — canh vàng đều nghen!
  - title: Gỡ xương, xé vụn
    icon: knife
    minutes: 5 phút
    bullets:
      - text: >-
          Cá nguội bớt thì **gỡ xương thật kỹ** dưới chỗ sáng — xương cá
          mặn cứng và giòn, lẫn vô cơm là phiền lắm. Gỡ xong miết lại một
          lượt bằng đầu ngón tay để dò xương sót.
      - text: >-
          Xé hoặc **giã sơ** cho thịt cá vụn cỡ hạt bắp — vụn nhỏ mới chia
          đều được khắp chảo cơm, muỗng nào cũng có.
    callout:
      type: tip
      text: >-
        Giã sơ trong cối thôi, đừng giã nhuyễn — vụn cá còn lợn cợn cắn
        mới đã miệng, nhuyễn quá thành bột mặn mất vui.
  - title: Trứng ướt áo lấy hạt cơm
    icon: egg
    minutes: 4 phút
    bullets:
      - text: >-
          Cơm nguội lấy ra **bóp tơi trước** cho rời mảng. Chảo lớn cho
          [[2|muỗng canh]] dầu, nóng già thì phi **tỏi băm** vàng thơm.
      - text: >-
          Đổ trứng đánh tan vô, khuấy nhanh tay — trứng **vừa se mặt còn
          hơi ướt** là trút hết cơm vô liền.
      - text: >-
          Đảo và dằm cho trứng ướt **áo lấy từng hạt cơm** — lớp "sơn lót"
          vàng óng kiểu tiệm là ở nhịp này.
    callout:
      type: warn
      text: >-
        Đợi trứng chín hẳn mới cho cơm là thành cơm chiên lẫn trứng vụn —
        muốn hạt cơm vàng óng thì cơm phải xuống chảo lúc trứng **còn
        ướt**.
  - title: Lửa lớn cho cơm "nhảy"
    icon: flame
    minutes: 5 phút
    bullets:
      - text: >-
          Mở **lửa lớn nhất**, đảo mạnh và đều tay — hạt cơm phải nhảy lạo
          xạo trong chảo, hơi nước bay tới đâu hạt săn mặt tới đó.
      - text: >-
          Cơm săn, rời hạt thì cho **vụn cá mặn + gà xé** vô, đảo thêm
          chừng 2 phút cho mùi cá dậy khắp chảo, thấm vô từng hạt.
      - text: >-
          Múc thử một muỗng nếm — cá thường đã "nêm giùm" tới tám phần
          rồi đó.
    callout:
      type: warn
      text: >-
        Cơm ướt + lửa yếu + đảo lười = **cơm chiên bết** — thành cơm hấp
        dầu chứ không phải cơm chiên. Lỗi số một của món này đó.
  - title: Nêm nhẹ, úp dĩa kiểu tiệm
    icon: spoon
    minutes: 3 phút
    bullets:
      - text: >-
          Nếm rồi mới nêm: thường chỉ cần [[1|muỗng cà phê]] đường cho vị
          dịu + chút tiêu xay; nhạt thiệt mới thêm **vài giọt nước tương**.
      - text: Rắc hành lá, đảo một vòng cuối rồi tắt bếp.
      - text: >-
          Đơm cơm vô chén ém nhẹ, **úp ngược ra dĩa** — ụ cơm tròn vun bốc
          khói như ngoài tiệm, xếp dưa leo cà chua quanh chân là đẹp mâm.
    callout:
      type: tip
      text: >-
        Nước tương đừng tưới thẳng vô cơm — rưới lên **thành chảo nóng**
        cho nó xèo một cái rồi mới đảo, dậy mùi khói chảo đúng kiểu tiệm.
    doneText: Ụ cơm vàng lên mâm — xong!

tipsTitle: 7 bí quyết cho **chảo cơm chiên dậy mùi**
tipsLead: >-
  Món này nguyên liệu đơn giản tới bất ngờ, ăn thua nhau ở con cá, hạt cơm
  và ngọn lửa — đọc hết mấy dòng này rồi hãy bắc chảo.
tips:
  - icon: fish
    title: Nhìn cá mặn biết ngon dở
    text: >-
      Miếng cá ngon **thịt hồng sậm, mặt hơi bóng, bóp thấy dẻo tay**, mùi
      thơm nồng chứ không khai. Miếng trắng mốc muối, cong queo khô xác là
      phơi quá già nắng — chiên lên bã, kém thơm hẳn.
  - icon: rice
    title: Cơm nguội là "chân ái"
    text: >-
      Cơm qua một đêm ngăn mát ráo hẳn nước, hạt hồi cứng nhẹ — vô chảo là
      rời ngay. Cơm mới nấu dẻo ướt, đảo kiểu gì cũng dính thành mảng. Mọi
      chảo cơm chiên ngon trên đời đều bắt đầu từ nồi cơm... hôm qua.
  - icon: flame
    title: Chảo phải "giận" mới chiên
    text: >-
      Chảo nóng già, lửa lớn suốt từ lúc cơm xuống — hơi nước thoát nhanh,
      hạt săn mặt không kịp bết. Bếp nhà lửa yếu thì **chia hai mẻ**, đừng
      tham chảo đầy.
  - icon: egg
    title: Trứng ướt mới áo được cơm
    text: >-
      Trứng còn ướt bám lấy từng hạt cơm rồi chín ngay trên hạt — thành
      lớp áo vàng óng thơm béo. Đây là khác biệt giữa "cơm chiên trứng"
      của tiệm và cơm chiên có trứng vụn của... người vội.
  - icon: spoon
    title: Nêm kiểu "thiếu còn cứu được"
    text: >-
      Cá mặn gánh phần mặn của cả chảo rồi. Nêm thiếu thì thêm được, lỡ
      mặn là chỉ còn nước nấu thêm cơm chữa cháy — vậy nên cứ **nếm trước,
      nêm sau, thêm từng xíu**.
  - icon: meat
    title: Gà xé đóng vai "người hòa giải"
    text: >-
      Sợi gà nhạt ngọt xen giữa vụn cá đậm đà, muỗng cơm nào cũng có nhịp
      **đậm rồi dịu** nên ăn hoài không gắt. Xé sợi vừa gắp thôi — nhỏ quá
      chiên lên khô xác, uổng con gà.
  - icon: lettuce
    title: Xà lách dầu giấm đúng bộ tiệm
    text: >-
      Tiệm cơm người Hoa dọn món này luôn kèm dĩa xà lách dầu giấm — chua
      nhẹ mát lưỡi, đổi vị giữa các muỗng cơm đậm. Có tiệm còn xắt
      nhỏ xà lách **trộn thẳng vô chảo cơm** trước khi tắt bếp; muốn thử
      thì nhớ để xà lách thật ráo nước.

serve:
  title: Dọn mâm **kiểu tiệm Chợ Lớn**
  paras:
    - >-
      Cơm chiên phải ăn **nóng liền tay**, lúc hạt cơm còn lạo xạo. Múc
      muỗng cơm kèm lát dưa leo mát lạnh, thỉnh thoảng gắp miếng xà lách
      dầu giấm — đậm rồi mát, cứ thế hết dĩa lúc nào không hay.
    - >-
      Đúng "bộ" của tiệm: ụ cơm úp chén tròn vun, dĩa xà lách dầu giấm,
      chén xì dầu dằm ớt, thêm chén canh nóng nấu từ nước luộc gà — bữa
      trưa nhanh mà tươm tất, khách tới bất ngờ cũng không quê.
    - >-
      Còn bữa cơm nhà thong thả, dĩa cơm chiên này đứng chung mâm với
      **canh khổ qua nhồi thịt** thanh mát là cân nhau hoàn hảo; nhà đông
      người thêm dĩa **rau muống xào tỏi** xanh giòn nữa là đủ đầy.
  aside:
    title: Trên bàn tiệm cơm
    intro: "Đủ bộ này là y chang quán quen:"
    items:
      - icon: lettuce
        text: "**Xà lách dầu giấm** — chua nhẹ mát lưỡi, cân độ mặn béo của cơm."
      - icon: bottle
        text: "**Chén xì dầu dằm ớt** — chấm dưa leo, ai ăn đậm tự rưới thêm."
      - icon: bowl
        text: "**Chén canh nước luộc gà** — thả nắm cải hay miếng bí là ngọt lừ."
      - icon: tomato
        text: "**Dưa leo + cà chua** — giòn mát, đỡ ngán, thêm màu cho dĩa."

faq:
  - q: Mua cá mặn ở đâu? Không có thì thay bằng gì?
    a: >-
      Ra **sạp khô ngoài chợ** hoặc siêu thị lớn, hỏi "cá thu mặn" là
      trúng; tiệm tạp hóa khu người Hoa càng dễ có. Kẹt quá thì thay **khô
      cá sặc, khô cá lóc** chiên xé — vẫn ngon nhưng vị "khô" hơn, thiếu
      cái dẻo mặn sâu của cá muối phơi. Tuyệt đối đừng thay bằng cách nêm
      thêm nước mắm — mặn thì có mặn, mà mùi thì không có.
  - q: Cơm mới nấu có chiên liền được không?
    a: >-
      Được, nếu chịu khó một nhịp: **trải cơm ra khay cho mỏng, quạt cho
      bay hơi, rồi cho vô ngăn mát 30 phút** không đậy — hạt ráo gần như
      cơm qua đêm. Nấu cơm định bụng để chiên thì bớt nước một chút ngay
      từ đầu càng đẹp.
  - q: Sao cơm chiên của tôi cứ bết dính thành mảng?
    a: >-
      Dò đúng bốn thủ phạm: **cơm còn ướt** (chưa đủ nguội ráo), **chảo
      chưa đủ nóng**, **lửa nhỏ**, hoặc **tham chiên một chảo quá đầy**.
      Sửa đủ bốn — cơm bóp tơi trước, chảo nóng già, lửa lớn, chia mẻ —
      là hạt cơm rời ngay, không có thuốc nào khác đâu.
  - q: Lỡ tay mặn quá thì cứu sao?
    a: >-
      Thêm **cơm trắng + đánh thêm quả trứng** chiên bù cho loãng vị mặn,
      dọn kèm nhiều rau tươi hơn. Rút kinh nghiệm lần sau bớt lượng cá lại
      — và nhớ điều răn của món này: **nếm trước, nêm sau**.
  - q: Cơm chiên dư với cá mặn còn nguyên cất sao?
    a: >-
      Cơm chiên nguội cho vô hộp kín, ngăn mát được **1–2 ngày**; hâm bằng
      **chảo nóng** đảo vài phút cho hạt săn lại, đừng quay vi sóng kẻo
      hạt ỉu mềm. Cá mặn chưa chiên thì bọc kín cất ngăn mát để dành được
      lâu — có sẵn trong bếp là lúc nào cũng ứng biến được một bữa.
  - q: Nhà có con nít, sợ mặn quá thì sao?
    a: >-
      Dễ lắm: tới bước cho cá vô thì **xúc riêng phần cơm trứng gà xé**
      cho bé trước, rồi mới trút cá mặn vô phần còn lại. Một chảo hai
      phiên bản, người lớn con nít đều vui.

