quick:
  ingredients:
    - >-
      Bột bánh: bột gạo tẻ [[150|g]] + bột năng [[80|g]] + [[700|ml]] nước +
      ½ muỗng cà phê muối + [[1|muỗng canh]] dầu — **nghỉ bột 2 giờ**
    - >-
      Tôm chấy: tôm tươi [[400|g]] (hoặc tôm khô [[150|g]] ngâm mềm) · hành tím
      [[4|củ]] · dầu điều [[1|muỗng canh]] · muối, đường, tiêu
    - Hành lá [[1|nắm]] làm mỡ hành · hành tím [[4|củ]] phi vàng
    - >-
      Nước mắm chấm: nước mắm [[3|muỗng canh|frac]] · đường [[3|muỗng canh]] ·
      nước ấm [[180|ml]] · chanh [[1|trái]] · tỏi ớt băm
  steps:
    - Pha bột, **nghỉ 2 giờ**, chắt nước trong rồi châm lại nước mới.
    - >-
      Tôm hấp chín, bóc vỏ, **giã thô chứ đừng xay nhuyễn** — nhuyễn quá là ra
      bột, không bông được.
    - >-
      Rang tôm **lửa nhỏ, đảo liên tục 15–20 phút** với hành tím phi và dầu
      điều, tới khi **tơi xốp, khô hẳn, màu cam ruộm**.
    - Tráng lá bánh mỏng bằng chảo chống dính, úp ra mâm thoa dầu hành.
    - >-
      Rắc tôm chấy thành **một đường ngang** trên lá bánh, gấp hai mép rồi
      **cuốn lỏng tay** thành cuốn nhỏ cỡ ngón tay cái.
    - >-
      Xếp cuốn ra dĩa, rắc thêm tôm chấy và hành phi phủ mặt, dọn kèm chén mắm
      chua ngọt.
  warning: >-
    Rang tôm lửa lớn cho nhanh là **cháy khét bên ngoài mà bên trong còn ẩm** —
    để tới chiều là ỉu. Lửa nhỏ nhất, đảo đều tay, chịu khó mười lăm phút.

