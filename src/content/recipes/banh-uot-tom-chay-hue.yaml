  thì đủ bốn vị mà vẫn thanh.

storyEyebrow: Chuyện mâm bánh
storyTitle: Nhúm tôm chấy — **thứ đi khắp mâm bánh Huế**
story:
  - >-
    Mâm bánh Huế bày ra là một dãy chén dĩa nhỏ: bánh bèo, bánh nậm, bánh lọc,
    bánh ướt. Bốn thứ bánh khác nhau, làm bằng bốn cách khác nhau, mà **nhìn
    lên mặt cái nào cũng thấy một nhúm bông màu cam** — đó là tôm chấy. Nó là
    sợi dây nối cả mâm bánh lại với nhau.
  - >-
    "Chấy" là **một động tác**: giã tôm rồi rang đảo trên lửa nhỏ cho tới khi
    tơi bông ra. Có nơi viết là "tôm cháy", nhưng chữ đúng nằm ở cái động tác
    đó chứ không phải ở chuyện cháy. Tôm chấy đạt thì **xốp như mây, khô mà
    không cứng**, cắn vào tan ngay đầu lưỡi và để lại hậu ngọt của tôm.
  - >-
    Bản bánh ướt thì đơn giản nhất mâm: lá bánh tráng mỏng, rắc tôm chấy, cuốn
    lại thành từng cuốn nhỏ bằng ngón tay, chấm mắm chua ngọt. Nhỏ nhắn tới mức
    ăn một cuốn chưa thấy gì, phải ăn tới cuốn thứ ba thứ tư mới thấm — mà đó
    lại đúng là cách ăn của người Huế: **nhiều món, mỗi món một chút**.

