title: Bánh ướt tôm chấy Huế **cuốn nhỏ xinh, rắc bông tôm cam ruộm**
summary: >-
  Món trên mâm bánh Huế: lá bánh ướt mỏng cuốn lại thành từng cuốn nhỏ, rắc
  **tôm chấy bông tơi màu cam ruộm**, chấm mắm chua ngọt. Cả món ăn thua ở chảo
  tôm — rang đúng lửa thì bông xốp như mây, quá lửa một chút là khô cứng.
