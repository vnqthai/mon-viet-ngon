title: Gỏi xoài xanh tôm khô **chua giòn ứa nước miếng, trộn thau nào hết thau nấy**
summary: >-
  Sợi xoài xanh chua giòn quyện tôm khô ngọt đậm, nước mắm đường thắng hơi
  kẹo bám lấy từng sợi, rau răm đậu phộng rắc rộng tay — **món mồi ruột của
  bàn nhậu**, mà dọn ăn chơi buổi xế cũng cuốn miệng không thua.
region: Miền Nam
category: Gỏi
occasions: [Nhậu lai rai, Ăn chơi]
pubDate: 2026-07-28
time:
  total: 25 phút
servingsBase: 4
difficulty: Dễ
featured: false
order: 33
art: goi-xoai
heroEyebrow: Chiều mát, làm dĩa mồi nghen…

quick:
  ingredients:
    - Xoài xanh [[2|trái]] (xoài keo hoặc xoài tượng còn cứng) — bào sợi to
    - Tôm khô [[60|g]] loại ngon — ngâm nước ấm 10 phút, để ráo
    - Rau răm [[1|nắm]] cắt khúc · ớt sừng [[1|trái]] xắt sợi
    - Đậu phộng rang [[3|muỗng canh]] giã dối · hành phi [[2|muỗng canh]]
    - >-
      Nước trộn: nước mắm [[2|muỗng canh]] · đường [[2.5|muỗng canh|frac]] ·
      nước cốt tắc hoặc chanh [[2|muỗng canh]] · tỏi [[2|tép]] + ớt băm
  steps:
    - Tôm khô ngâm nước ấm **10 phút** cho mềm, để ráo — thích đậm thì giã hơi dập cho tơi.
    - Xoài gọt vỏ, bào hoặc xắt sợi **to cỡ đầu đũa**, cất ngăn mát cho giòn.
    - Thắng nước mắm + đường lửa nhỏ cho tan, để nguội mới thêm nước tắc, tỏi ớt — nước trộn phải **hơi kẹo** mới bám sợi.
    - Sát giờ ăn mới trộn — xoài + tôm khô vô thau, rưới nước trộn, **nhẹ tay nhanh tay** cho áo đều.
    - Rắc rau răm, đậu phộng, hành phi, ớt sợi — đảo thêm hai lượt là bưng ra liền.
  warning: >-
    Gỏi xoài trộn xong phải ăn liền — để lâu xoài **ra nước, sợi xìu**, dĩa
    gỏi lõng bõng là hết ngon.

flavor:
  chua: 8
  ngot: 6.5
  man: 6
  cay: 5
  thom: 7
flavorNote: >-
  **Chuẩn vị:** gắp thử một đũa phải thấy **bốn vị chua – cay – mặn – ngọt
  cân nhau**, không vị nào lấn vị nào; sợi xoài còn giòn sựt, và cái hậu
  đọng lại sau cùng là vị tôm khô ngọt đậm.
storyEyebrow: Chuyện dĩa mồi
storyTitle: Từ trái xoài sau hè **tới dĩa mồi bàn nhậu**
story:
  - >-
    Hồi nhỏ, trái xoài xanh hái sau hè chỉ cần chén muối ớt là tụi nhỏ chia
    nhau chấm hết veo, vừa ăn vừa nhăn mặt hít hà. Lớn lên chút, cũng trái
    xoài đó vô tay má lại thành dĩa gỏi: sợi xoài bào giòn, nhúm tôm khô
    trong hũ **của để dành** nhà nào cũng có, thêm nắm rau răm ngoài chậu —
    giản dị vậy mà thành món người lớn nhắc hoài mỗi chiều trời mát.
  - >-
    Cái duyên của món này nằm ở chỗ **hai thứ chua mặn nương nhau**: xoài
    càng chua giòn, tôm khô càng lộ vị ngọt đậm; tôm khô càng dai thơm,
    miếng xoài càng thanh. Chén nước mắm đường thắng hơi kẹo kéo hai đầu
    đó lại gần nhau, rau răm với đậu phộng đứng giữa làm chứng. Ngoài
    quán, dĩa gỏi xoài kêu ra chưa kịp khui thêm chai bia là đã thấy đáy.
  - >-
    Mà đừng tưởng món quán là khó làm: gỏi xoài gần như **không đụng bếp
    lửa** — chỉ thắng nhúm nước mắm đường — hai mươi lăm phút từ lúc gọt
    xoài tới lúc bưng ra. Chiều cuối tuần có bạn ghé chơi, lận lưng công
    thức này là vừa trộn vừa tám chuyện, dọn kịp trước khi đá trong ly
    kịp tan.

