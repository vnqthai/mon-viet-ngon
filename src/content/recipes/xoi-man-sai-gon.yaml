title: Xôi mặn Sài Gòn **hộp xôi đầy ụ, lạp xưởng chà bông trứng cút**
summary: >-
  Hộp xôi quen thuộc của xe xôi đầu hẻm: nếp trắng dẻo mềm, trên mặt chất đầy
  **lạp xưởng chiên, chà bông, trứng cút, mỡ hành** rồi rưới xì dầu. Không có
  công thức cố định nào — đây là món **xếp chồng**, thích gì thêm nấy.
region: Miền Nam
category: Xôi
occasions: [Bữa sáng, Ăn chơi]
pubDate: 2026-07-31
