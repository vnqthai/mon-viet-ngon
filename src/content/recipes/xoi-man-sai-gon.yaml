heroEyebrow: Xe xôi đầu hẻm, sáng và tối đều có…

quick:
  ingredients:
    - Nếp [[500|g]] — ngâm **6 giờ** với [[1|muỗng cà phê]] muối
    - Nước cốt dừa [[100|ml]] (tùy thích — cho xôi béo mềm)
    - Lạp xưởng [[3|cây]] · trứng cút [[12|trứng]] · chà bông [[80|g]]
    - Chả lụa [[150|g]] · hành lá [[1|nắm]] · hành tím [[6|củ]] phi vàng
    - "Rưới mặt: xì dầu [[2|muỗng canh]] · đường [[1|muỗng cà phê]] · tương ớt"
  steps:
    - Ngâm nếp **6 giờ** với muối, vo lại rồi để **thật ráo** ít nhất 15 phút.
    - >-
      Đồ xôi **35–40 phút**, giữa chừng xới tơi và rưới nước cốt dừa rồi đồ
      tiếp.
    - >-
      Luộc trứng cút [[4|phút]] rồi ngâm nước lạnh cho dễ bóc; lạp xưởng **luộc
      sơ rồi mới chiên** cho bớt mỡ, thái lát xéo.
    - >-
      Làm mỡ hành: hành lá thái nhỏ, dội dầu nóng già lên, thêm chút muối; phi
      riêng hành tím cho vàng giòn.
    - >-
      Pha nước rưới: xì dầu + đường + chút nước, khuấy tan, nếm **mặn ngọt cân
      nhau**.
    - >-
      Xới xôi ra hộp, **rưới mỡ hành trước tiên**, rồi xếp lạp xưởng, chả lụa,
      trứng cút, rắc chà bông và hành phi, rưới xì dầu, vạch tương ớt.
  warning: >-
    Rắc chà bông xuống dưới rồi mới rưới mỡ hành là chà bông **xẹp bết thành
    mảng**. Chà bông luôn rắc sau cùng, ngay trước lúc ăn.

flavor:
  chua: 1
  ngot: 4.5
  man: 6.5
  cay: 2
  thom: 8
flavorNote: >-
  **Chuẩn vị:** hạt nếp dẻo mềm chứ không khô, thấm mỡ hành mằn mặn; lạp xưởng
  ngọt béo, chà bông tơi xốp còn nguyên sợi, trứng cút mềm. Mỗi muỗng phải xúc
  được **ít nhất ba thứ khác nhau** mới đúng tinh thần của món.

storyEyebrow: Chuyện hộp xôi
storyTitle: Món xôi **không có công thức**, chỉ có cách xếp
story:
  - >-
    Xe xôi mặn Sài Gòn bày ra như một cái sạp nhỏ: nồi nếp trắng nóng hổi ở
    giữa, xung quanh là dãy thau nhôm đựng lạp xưởng, chả lụa, trứng cút, chà
    bông, xíu mại, mỡ hành, hành phi. Khách chỉ tay tới đâu người bán xúc tới
    đó. Nên **không có "công thức xôi mặn"** nào hết — chỉ có nền nếp trắng và
    một danh sách thứ để xếp lên.
  - >-
    Chỗ khác biệt với xôi Bắc nằm ngay đó. **Xôi xéo** là một món hoàn chỉnh,
    ba thành phần cố định, thiếu một là không còn là nó. **Xôi mặn** thì ngược
    lại — nó là cái nền, và mỗi xe xôi, mỗi nhà lại chất lên một kiểu. Có nhà
    thêm xíu mại chan nước sốt, có nhà thêm pate, có nhà chỉ mỡ hành với chà
    bông là xong.
  - >-
    Cái chung duy nhất là **thứ tự xếp**, và thứ tự đó có lý của nó: mỡ hành
    xuống trước để thấm vào hạt nếp, đồ mặn nằm giữa, còn **chà bông và hành
    phi rắc sau cùng** vì hai thứ đó gặp nước là xẹp. Nắm được đúng thứ tự này
    thì xếp gì lên cũng ra hộp xôi tử tế.

