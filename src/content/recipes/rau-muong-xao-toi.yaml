title: Rau muống xào tỏi **xanh giòn như nhà hàng**
summary: >-
  Cọng rau **xanh mướt, giòn sựt**, thơm lừng hai tầng tỏi — món rau quốc dân
  mà 10 người xào thì 7 người bị thâm đen, vì thiếu đúng một bí quyết.
region: Cả nước
category: Xào
