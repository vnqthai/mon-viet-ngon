steps:
  - title: Nhặt rau & ngâm rửa
    icon: basket
    minutes: 5 phút
    bullets:
      - text: >-
          Nhặt lấy **phần cọng non và lá non**, ngắt khúc cỡ 10 cm. Cọng to thì
          chẻ đôi cho mau chín.
      - text: >-
          Ngâm **nước muối loãng 10 phút**, xả lại vài nước, vớt ra rổ để thiệt
          ráo.
  - title: Chần sơ & sốc nước đá — bí quyết nhà hàng
    icon: pot
    minutes: 3 phút
    bullets:
      - text: >-
          Nấu nồi nước **thiệt sôi**, thêm **½ muỗng cà phê muối + vài giọt
          dầu ăn**.
      - text: >-
          Thả rau vào chần **đúng 30 giây**, không đậy nắp, vớt ra **thả ngay
          vô thau nước đá** 1 phút rồi vớt lên để ráo.
    callout:
      type: tip
      text: >-
        Muối giữ màu, dầu tạo lớp áo bóng, nước đá **khóa màu xanh và độ
        giòn** tại chỗ. Ba thứ cộng lại — rau xanh mướt tới lúc tàn tiệc.
  - title: Xào lửa lớn, nhanh tay
    icon: flame
    minutes: 3 phút
    bullets:
      - text: >-
          Chảo thiệt nóng, cho dầu + **nửa chỗ tỏi**, phi vàng thơm trong 20
          giây.
      - text: >-
          Trút rau vào, **lửa lớn nhất, đảo liên tục 1–2 phút**. Nêm muối –
          đường – hạt nêm (hoặc dầu hào), đảo đều.
      - text: Rau vừa nóng bóng dầu là **tắt bếp liền** — đừng nán.
    callout:
      type: warn
      text: >-
        Chảo chưa đủ nóng mà đã cho rau là rau **ra nước, luộc trong chảo** —
        thà chờ thêm 30 giây cho chảo bốc khói nhẹ rồi hãy xào.
  - title: Tầng tỏi thứ hai & ra dĩa
    icon: garlic
    minutes: 1 phút
    bullets:
      - text: >-
          Tắt bếp rồi mới trộn **nửa chỗ tỏi sống** còn lại — hơi nóng làm tỏi
          dậy mùi mà không cháy, thành **hai tầng hương tỏi** chín và sống.
      - text: >-
          Ra dĩa, thích thì vắt nhẹ **vài giọt chanh**. Ăn nóng liền, món này
          để nguội là xuống hạng nhanh lắm.
    doneText: Ra dĩa ăn liền — xong!

tipsTitle: 3 bí quyết cho **dĩa rau xanh giòn**
tips:
  - icon: stem
    title: Chọn rau muống nước, cọng nhỏ
    text: >-
      Bó rau **cọng nhỏ, đốt ngắn, bẻ nghe tách giòn** là rau non. Cọng to
      trắng thì chẻ đôi; rau để tủ lạnh lâu đã héo thì ngâm nước đá 15 phút
      trước khi làm cho tươi lại.
  - icon: flame
    title: Chảo phải "bốc khói nhẹ"
    text: >-
      Xào rau là cuộc chơi của **nhiệt lớn + thời gian ngắn**. Chảo mỏng lửa
      yếu thì xào từng nửa mẻ — chất đầy chảo một lượt là nhiệt sụp, rau ra
      nước ngay.
  - icon: garlic
    title: Tỏi hai tầng mới là cao thủ
    text: >-
      Tỏi phi cho mùi **thơm chín ngọt**, tỏi sống trộn cuối cho mùi **cay
      nồng tươi** — dĩa rau thơm có chiều sâu hẳn. Mẹo này xài được cho mọi
      món xào rau khác.

serve:
  title: Dĩa rau **cân cả mâm cơm**
  paras:
    - >-
      Rau muống xào tỏi hợp với gần như mọi món mặn: cạnh **cá kho tộ** hay
      **thịt kho hột vịt** thì thành mâm cơm miền Nam kinh điển; thêm chén
      nước mắm ớt dầm trứng luộc là bữa cơm sinh viên huyền thoại.
    - >-
      Nước rau chần đừng đổ — thêm chút muối, vắt trái chanh là thành **chén
      canh rau muống dầm chanh** thanh mát uống kèm, một công đôi món.
faq:
  - q: Sao rau nhà mình xào hay bị thâm đen?
    a: >-
      Ba lý do: **không chần + sốc đá**, **lửa nhỏ**, hoặc **xào quá lâu**.
      Rau thâm là do enzyme oxy hóa khi nhiệt lên chậm — chần sơ diệt enzyme,
      sốc lạnh khóa màu, xào nhanh lửa lớn là hết thâm.
  - q: Bỏ bước chần được không?
    a: >-
      Được nếu chảo bạn dày, lửa thiệt mạnh và xào **mỗi mẻ ít rau**. Bếp gia
      đình lửa yếu thì đừng bỏ — bước chần 30 giây chính là "bảo hiểm" cho màu
      xanh và độ giòn.
