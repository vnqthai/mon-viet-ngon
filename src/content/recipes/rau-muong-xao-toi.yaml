heroEyebrow: Món rau quốc dân…

quick:
  ingredients:
    - Rau muống [[500|g]] — nhặt cọng non, ngắt khúc 10 cm
    - Tỏi [[6|tép]] — đập dập băm thô, chia đôi
    - Dầu ăn [[2|muỗng canh|frac]] · muối, đường, hạt nêm (hoặc dầu hào)
    - Nước đá 1 thau + chanh vài giọt (bí quyết xanh giòn)
  steps:
    - Rau nhặt rửa, ngâm nước muối loãng 10 phút, vớt ráo.
    - "**Chần 30 giây** trong nước thiệt sôi có chút muối + dầu, vớt ra **ngâm ngay nước đá** — đây là bí quyết xanh giòn."
    - Phi thơm **nửa chỗ tỏi** với dầu, lửa thiệt lớn.
    - Cho rau vào **xào nhanh tay 1–2 phút**, nêm muối – đường – hạt nêm (hoặc 1 muỗng dầu hào).
    - Tắt bếp, trộn **nửa chỗ tỏi sống còn lại**, ra dĩa ăn nóng liền.
  warning: >-
    Xào rau **lửa nhỏ** hoặc xào lâu là rau thâm đen, ra nước, dai nhách —
    chảo phải thiệt nóng, tay phải thiệt nhanh.

