  **Chuẩn dĩa rau xào:** gắp lên nghe **sựt một cái**, thơm hai tầng tỏi —
  tỏi phi dậy mùi chín, tỏi sống cay thơm nồng.
storyEyebrow: Chuyện dĩa rau
storyTitle: Món rau **quốc dân, mà khó không ngờ**
story:
  - >-
    Mâm cơm Việt từ Bắc chí Nam, hễ bí món rau là **rau muống xào tỏi** — rẻ,
    nhanh, đưa cơm. Vậy mà món "dễ nhất" này lại là bài kiểm tra tay nghề
    thầm lặng: rau xào ra **xanh mướt giòn sựt** hay **thâm đen ra nước** là
    biết liền người đứng bếp cứng cỡ nào.
  - >-
    Bí mật không nằm ở chảo xịn hay lửa hồng ngoại — nằm ở **nhịp chần và
    thau nước đá**: chần sơ cho rau chín tới 70%, sốc lạnh khóa màu, rồi mới
    xào lửa lớn thiệt nhanh. Nhà hàng nào cũng làm vậy, giờ mình làm ở nhà
    thôi.

