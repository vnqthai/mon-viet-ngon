heroEyebrow: Tô cháo nóng, nắm giá vừa chan là chín tới…

quick:
  ingredients:
    - Bộ lòng heo [[800|g]] — lòng non, dạ dày, tim, gan, cật
    - Ruột non [[200|g]] để làm dồi · huyết heo [[400|ml]] · mỡ heo [[100|g]]
    - Gạo tẻ [[180|g]] + gạo nếp [[40|g]] — **rang vàng trước khi ninh**
    - Xương ống [[500|g]] ninh nước · hành tím [[5|củ]] · gừng [[1|củ]]
    - "Khử mùi: muối hột · chanh hoặc giấm · rượu trắng · bột mì"
    - "Nhồi dồi: hành lá · húng quế · đậu phộng rang · tiêu"
    - Giá · rau răm · hành lá · quẩy · chén mắm gừng ớt
  steps:
    - Bóp lòng với **muối hột + chanh + bột mì**, rửa nhiều lần, chần nước sôi có gừng và rượu.
    - Nhồi dồi — huyết pha loãng + mỡ hạt lựu + hành + húng quế + đậu phộng, buộc từng khúc.
    - Luộc dồi lửa nhỏ **20 phút**, **châm kim vài chỗ** cho khỏi vỡ, vớt ra ngâm nước lạnh.
    - Luộc lòng và các món khác trong nồi nước xương, vớt ra **ngâm nước đá** cho giòn.
    - Rang gạo vàng thơm rồi ninh trong **nước luộc lòng** chừng 40 phút.
    - Múc cháo, xếp dồi và lòng thái lát lên mặt, rắc rau răm, tiêu; dọn kèm giá và quẩy.
  warning: >-
    **Luộc dồi phải để lửa nhỏ và châm kim.** Nước sôi bùng thì vỏ ruột căng
    lên rồi nứt, huyết trào ra làm đục cả nồi nước — mà nồi nước đó chính là
    nồi cháo.

