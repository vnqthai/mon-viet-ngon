title: Cháo lòng **ngọt nước luộc, lòng giòn sựt**
summary: >-
  Tô cháo của hàng sáng: **gạo rang ninh ngay trong nước luộc lòng** nên ngọt
  đậm mà không cần nêm nhiều, mặt tô xếp lòng non giòn sựt, lát gan bùi, miếng
  cật ngọt. Thêm nắm giá, rau răm, cây quẩy và chén mắm gừng ớt là đủ bộ.
region: Cả nước
category: Cháo
occasions: [Bữa sáng, Nhậu lai rai]
