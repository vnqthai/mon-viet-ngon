flavorNote: >-
  **Chuẩn vị:** cháo sánh nhẹ, ngọt đậm vị nước luộc chứ không phải vị bột
  ngọt. Lòng non **giòn sựt, cắn nghe tiếng**; khoanh dồi mềm ẩm, cắt ra
  không rỗng ruột; miếng gan bùi mà không bở nát.
storyEyebrow: Chuyện tô cháo lòng
storyTitle: Nồi cháo nấu từ **chính nước luộc lòng**
story:
  - >-
    Cháo lòng là món của những hàng dọn sớm: nồi nước sôi lăn tăn từ tờ mờ,
    rổ lòng luộc để sẵn, người bán vừa thái vừa múc. Cái khéo của món này nằm
    ở chỗ **không có gì bị bỏ phí** — luộc lòng xong thì nồi nước ấy thành nồi
    cháo, mỡ nổi lên thì vớt ra phi hành, ruột non thì nhồi thành dồi. Một bộ
    lòng ra được cả tô cháo lẫn đĩa lòng.
  - >-
    Mỗi vùng nấu một kiểu. Ngoài Bắc nồi cháo nổi vị **gừng, hành hoa và
    tiêu**, ăn với quẩy. Miền Nam chuộng **rang gạo trước** cho hạt tơi, dọn
    kèm giá sống và rau răm. Miền Tây thì đánh **huyết vào nồi cháo** nên tô
    cháo có màu nâu nhạt chứ không trắng ngà. Bài này đi theo lối chung dễ nấu
    nhất: rang gạo, ninh bằng nước luộc, còn huyết thì luộc riêng thái miếng
    để ai thích thì gắp.
  - >-
    Món này không khó về kỹ thuật, cái khó nằm ở **khâu làm sạch**. Lòng làm
    ẩu thì cả nồi có mùi, mà mùi đó không gia vị nào che nổi. Người bán lâu
    năm có một bộ động tác gần như bất di bất dịch: bóp muối hột với chanh,
    rồi bóp lại lần nữa với bột mì, rửa tới khi nước trong, chần qua nước sôi
    có gừng và rượu, **vớt ra ngâm ngay vào nước đá**. Làm đủ chừng đó thì
    lòng vừa sạch mùi vừa giòn — hai việc trong một.

