stepsEyebrow: Vô bếp thôi!
stepsTitle: 6 bước ra **tô cháo lòng đủ bộ**
stepsLead: >-
  Món này dài chứ không khó. Thứ tự khôn ngoan là **làm sạch lòng trước, nhồi
  dồi, rồi mới bắc nồi** — vì nồi nước luộc lòng chính là nồi nấu cháo, nên
  mọi thứ phải sạch trước khi chạm vào nước.
steps:
  - title: Làm sạch lòng — bước quyết định
    icon: knife
    minutes: 30 phút
    intro: "Lòng sạch mùi hay không quyết định cả nồi, làm kỹ đừng vội:"
    bullets:
      - label: "Bóp lần một:"
        text: >-
          Bóp lòng với **muối hột + nước cốt chanh** (hoặc giấm), chà kỹ cả
          mặt trong dạ dày, rồi rửa nhiều lần nước.
      - label: "Bóp lần hai:"
        text: >-
          Rắc [[3|thìa canh|frac]] **bột mì** vào bóp tiếp — bột mì kéo nốt
          phần nhớt còn sót. Rửa tới khi nước trong hẳn.
      - label: "Cật và gan:"
        text: >-
          Cật bổ đôi, **lạng sạch phần trắng bên trong** rồi ngâm nước muối
          loãng. Gan ngâm sữa tươi hoặc nước muối 20 phút cho ra máu.
      - label: "Chần thơm:"
        text: >-
          Đun nồi nước với gừng đập dập + [[2|thìa canh|frac]] rượu trắng,
          **chần lòng 2 phút** rồi vớt ra rửa lại.
    callout:
      type: warn
      text: >-
        Bỏ qua bước bóp bột mì là chỗ hay hỏng nhất. Rửa nước không thôi
        **không lấy hết nhớt**, mà nhớt còn sót thì nồi cháo có mùi — và mùi
        đó thì tiêu, gừng hay rau răm đều không che nổi.
  - title: Nhồi dồi
    icon: roll
    minutes: 25 phút
    bullets:
      - text: >-
          Ruột non lộn mặt trong rửa sạch rồi lộn lại, **buộc chặt một đầu**
          bằng chỉ.
      - text: >-
          Trộn nhân: huyết pha loãng (**2 phần huyết 1 phần nước luộc**) +
          mỡ thái hạt lựu + hành lá và húng quế thái nhỏ + đậu phộng giã dập
          + tiêu + chút nước mắm.
      - text: >-
          Dùng phễu **nhồi chừng 70% khúc ruột thôi** — nhồi căng là lúc luộc
          nở ra sẽ nứt. Buộc lại thành từng khúc cỡ gang tay.
    callout:
      type: tip
      text: >-
        Nhân dồi ngon nằm ở **tỷ lệ mỡ**: thiếu mỡ thì khoanh dồi khô và bở,
        đủ mỡ thì mềm ẩm, cắt ra còn ánh mỡ. Cỡ [[100|g]] mỡ cho [[400|ml]]
        huyết là vừa.
  - title: Luộc dồi — lửa nhỏ, châm kim
    icon: pot
    minutes: 25 phút
    bullets:
      - text: >-
          Thả dồi vào nồi nước đang **nóng già chứ chưa sôi**, giữ lửa nhỏ
          suốt, mặt nước chỉ lăn tăn.
      - text: >-
          Luộc chừng **20 phút**. Sau 10 phút thì **dùng tăm hoặc kim châm vài
          lỗ** dọc khúc dồi cho hơi thoát ra.
      - text: >-
          Châm thử thấy **không còn nước hồng chảy ra** là chín. Vớt ra thả
          vào nước lạnh cho khỏi nhăn, để nguội rồi mới cắt khoanh.
    callout:
      type: warn
      text: >-
        Nước sôi bùng là **vỏ dồi nứt, huyết trào ra** làm đục nồi nước — mà
        đó là nồi nấu cháo. Nếu lỡ vỡ thì vớt hết phần huyết vụn ra rồi lọc
        lại nước trước khi ninh gạo.
    timer:
      secs: 1200
      label: Hẹn giờ luộc dồi · 20:00
      doneMsg: Châm thử không ra nước hồng là vớt được!
  - title: Luộc lòng, ngâm nước đá
    icon: drop
    minutes: 25 phút
    bullets:
      - text: >-
          Ninh [[500|g]] xương ống với [[2|lít]] nước trong **30 phút**, hớt
          bọt, thả 2 củ hành tím nướng.
      - text: >-
          Luộc lần lượt trong nồi đó: **dạ dày 25 phút**, **lòng non 7–10
          phút**, **tim 15 phút**, **cật 5 phút**, **gan 10 phút**.
      - text: >-
          Vớt từng thứ ra **thả ngay vào thau nước đá** — đây là chỗ làm nên
          tiếng giòn sựt của lòng.
      - text: >-
          Để ráo rồi thái lát vừa gắp, xếp ra đĩa chung với dồi đã cắt khoanh.
    callout:
      type: tip
      text: >-
        Mỗi món một giờ luộc riêng, đừng thả chung một lượt. **Lòng non luộc
        quá 10 phút là dai như cao su**, còn dạ dày chưa đủ 25 phút thì cắn
        không đứt.
  - title: Rang gạo, ninh cháo
    icon: rice
    minutes: 45 phút
    bullets:
      - text: >-
          Vo gạo nhẹ tay, để **thật ráo**, rang với chút dầu tới khi hạt ngả
          vàng nhạt và dậy mùi — chừng 5 phút.
      - text: >-
          Lọc nồi nước luộc lòng qua rây cho trong, trút gạo rang vào, đun
          sôi rồi hạ liu riu **40 phút**.
      - text: >-
          Nêm nước mắm và muối cho vừa — nồi này đã ngọt sẵn nên **nêm nhẹ
          tay**, nếm rồi hãy thêm.
      - text: >-
          Phi hành tím thái lát với mỡ vớt từ nồi luộc, chan vào nồi cháo cho
          thơm.
    timer:
      secs: 2400
      label: Hẹn giờ ninh cháo · 40:00
      doneMsg: Nếm thử — hạt gạo nở mềm là được!
  - title: Ráp tô, dọn kèm giá và quẩy
    icon: bowl
    minutes: 5 phút
    bullets:
      - text: >-
          Trải một nắm **giá sống** dưới đáy tô rồi múc cháo nóng chan lên —
          giá tự chín tới, còn giòn.
      - text: >-
          Xếp **khoanh dồi, lát lòng, gan, tim, cật** lên mặt tô.
      - text: >-
          Rắc rau răm thái nhỏ, hành lá, hành phi rồi **rắc tiêu dày tay**.
      - text: >-
          Dọn kèm đĩa quẩy cắt khúc và **chén mắm gừng ớt** để chấm lòng.
    doneText: Bưng ra bàn — xong!

tipsTitle: 6 bí quyết cho **tô cháo lòng không mùi, lòng giòn**
tipsLead: >-
  Cháo lòng ngon hay dở gần như chỉ phụ thuộc vào khâu sơ chế và canh giờ
  luộc. Sáu điều dưới đây là toàn bộ chỗ dễ sai.
tips:
  - icon: jar
    title: Bóp muối rồi bóp bột mì
    text: >-
      Đây là mẹo của hàng quán và nó thật sự hiệu quả. Muối hột nhám để **chà
      nhớt**, còn **bột mì kéo nốt phần nhớt còn sót** mà nước rửa không lấy
      đi được. Bóp hai lần, rửa tới khi nước trong hẳn thì lòng gần như hết
      mùi trước cả khi chần.
  - icon: drop
    title: Vớt ra là thả ngay vào nước đá
    text: >-
      Tiếng giòn sựt của lòng đến từ chỗ này chứ không phải từ thời gian luộc.
      Lòng đang nóng gặp nước đá thì **co lại đột ngột, thớ săn và giòn**. Bỏ
      qua bước này thì dù luộc đúng giờ, miếng lòng vẫn mềm oặt.
  - icon: clock
    title: Mỗi món một giờ luộc riêng
    text: >-
      Thả chung một lượt là chắc chắn có thứ quá lửa. Nhớ đại khái theo độ dày:
      **dạ dày 25 phút · tim 15 · gan 10 · lòng non 7–10 · cật 5**. Riêng cật
      luộc lâu là vừa dai vừa nặng mùi, nên vớt sớm nhất.
  - icon: roll
    title: Nhồi dồi 70%, châm kim khi luộc
    text: >-
      Hai lỗi làm vỡ dồi là nhồi căng quá và luộc sôi bùng. Nhồi chừng **70%
      khúc ruột** để chừa chỗ cho nhân nở, luộc lửa nhỏ, và sau 10 phút thì
      **châm vài lỗ** cho hơi thoát. Huyết nhớ pha loãng 2 huyết 1 nước, đặc
      quá thì khoanh dồi cứng.
  - icon: meat
    title: Chọn khúc lòng non căng tròn
    text: >-
      Ngoài chợ hai khúc lòng nhìn giống nhau nhưng ăn khác hẳn. Khúc **căng
      tròn, trắng hồng, bên trong có dịch trắng sữa** là khúc giòn ngọt. Khúc
      **dẹp lép, ngả xám** thì dai và đắng, luộc kiểu gì cũng không cứu được.
  - icon: rice
    title: Nêm nhẹ tay vì nước đã ngọt sẵn
    text: >-
      Nồi cháo này ninh bằng nước luộc xương và luộc lòng nên đã đậm đà sẵn.
      Nêm như nồi cháo thường là **mặn gắt**. Cho một nửa lượng mắm muối quen
      dùng, nếm, rồi mới thêm — và nhớ rằng lát nữa còn chén mắm gừng bên cạnh.

serve:
  title: Tô cháo hàng sáng — **ăn nóng, chấm mắm gừng**
  paras:
    - >-
      Cháo lòng là món của **buổi sáng và của bàn lai rai**. Sáng ra một tô
      nóng với cây quẩy là chắc dạ tới trưa; chiều muộn thì đĩa lòng luộc chấm
      mắm gừng ăn kèm tô cháo lại thành món ngồi lâu được.
    - >-
      Cách ăn quen thuộc là **trải giá sống dưới đáy tô** rồi chan cháo nóng
      lên — giá chín tới mà vẫn giòn. Rau răm thì rắc dày tay, tiêu cũng vậy.
      Ai thích đậm thì gắp miếng lòng chấm vào **chén mắm gừng ớt** rồi mới ăn
      cùng cháo.
    - >-
      Nấu một lần được hai món: nồi cháo và **đĩa lòng luộc thái lát**. Lòng
      còn dư đậy kín để ngăn mát được 1 ngày, hôm sau đem xào với hành và rau
      răm là thành món khác. Riêng dồi thì nên ăn trong ngày, để lâu là khoanh
      dồi khô lại.
  aside:
    title: Trên bàn cháo lòng
    intro: "Mấy thứ phải có sẵn:"
    items:
      - icon: bottle
        text: "**Chén mắm gừng ớt** — chấm lòng và dồi, đừng thiếu."
      - icon: sprout
        text: "**Rổ giá sống** — trải dưới đáy tô rồi chan cháo lên."
      - icon: herb
        text: "**Chén rau răm thái nhỏ** — rắc dày tay hơn ta tưởng."
      - icon: roll
        text: "**Đĩa quẩy cắt khúc** — thả vào tô tới đâu ăn tới đó."

faq:
  - q: Làm sao hết mùi lòng?
    a: >-
      Làm đủ ba lớp thì gần như hết hẳn. **Bóp muối hột với chanh**, rồi **bóp
      lại với bột mì**, rửa tới khi nước trong. Sau đó **chần qua nước sôi có
      gừng đập dập và rượu trắng** rồi rửa lại lần nữa. Riêng cật phải lạng
      sạch phần trắng bên trong, còn dạ dày thì chà thật kỹ mặt trong — hai
      chỗ đó là nguồn mùi chính.
  - q: Ngại làm dồi thì bỏ được không?
    a: >-
      Bỏ được, tô cháo vẫn đầy đủ với lòng, gan, tim, cật. Nhưng nếu muốn có
      dồi mà ngại nhồi thì **mua dồi làm sẵn** ngoài hàng lòng rồi luộc lại
      trong nồi nước xương chừng 10 phút. Chỉ cần nhớ luộc lửa nhỏ và châm kim
      như dồi tự làm.
  - q: Vì sao dồi bị vỡ khi luộc?
    a: >-
      Ba nguyên nhân: **nhồi căng quá** (chỉ nên nhồi 70%), **nước sôi bùng**
      (phải giữ lăn tăn), và **quên châm kim** cho hơi thoát ra. Lỡ vỡ rồi thì
      vớt phần huyết vụn ra, lọc lại nước trước khi ninh gạo — không thì nồi
      cháo đục và có mùi tanh.
  - q: Lòng bị dai thì do đâu?
    a: >-
      Gần như luôn là do **luộc quá lâu** hoặc **không ngâm nước đá**. Lòng
      non chỉ cần 7–10 phút; quá 10 phút là dai như cao su và không cứu được.
      Vớt ra là thả ngay vào thau nước đá cho thớ co lại — đó mới là chỗ tạo
      tiếng giòn.
  - q: Cháo lòng ba miền khác nhau chỗ nào?
    a: >-
      **Miền Bắc** nổi vị gừng, hành hoa và tiêu, ăn kèm quẩy. **Miền Nam**
      rang gạo cho hạt tơi, dọn kèm giá sống và rau răm. **Miền Tây** đánh
      huyết vào nồi nên cháo có màu nâu nhạt chứ không trắng ngà, và cháo
      thường loãng hơn. Bài này đi lối chung: rang gạo, ninh bằng nước luộc,
      huyết luộc riêng thái miếng để ai thích thì gắp.
  - q: Nấu trước được phần nào?
    a: >-
      Lòng luộc và dồi làm trước **từ tối hôm trước**, để nguội đậy kín ngăn
      mát; sáng ra hâm nóng lại trong nồi cháo vài phút là được. Nồi cháo cũng
      nấu trước được, sáng hâm lại và **châm nước sôi** cho về độ sánh. Riêng
      giá, rau răm và quẩy thì để sát giờ ăn.

