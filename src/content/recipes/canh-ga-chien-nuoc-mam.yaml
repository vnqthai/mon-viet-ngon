flavorNote: >-
  **Chuẩn dĩa:** lớp áo ngoài **bóng như kẹo và vẫn còn nghe rắc**, không ướt
  nhẹp; thịt trong mềm mọng, sát xương còn ngọt. Mặn ngọt phải đi cùng nhau chứ
  không bên nào lấn — và mùi tỏi phi dậy lên trên cùng.

storyEyebrow: Chuyện món ăn
storyTitle: Chiên xong rồi **đừng đổ mắm vào chảo đó**
story:
  - >-
    Cánh gà chiên nước mắm là món của bếp nhà: nguyên liệu ra chợ nào cũng có,
    làm chừng nửa tiếng, và hợp cả mâm cơm lẫn bàn nhậu. Nhưng nó cũng là món
    hay hỏng nhất theo đúng một kiểu — **chiên giòn xong mà bưng ra thì đã mềm
    oặt**.
  - >-
    Lý do gần như luôn giống nhau: người nấu tiếc công rửa chảo nên chiên gà
    xong, chắt bớt dầu rồi đổ thẳng nước mắm đường vào chính cái chảo đó. Nước
    trong sốt gặp lớp vỏ giòn là nó thấm ngược vào, và không có cách nào lấy lại.
    Cách chữa nằm ở chỗ tách hẳn hai việc: **một chảo chiên, một chảo nấu sốt**.
    Sốt phải sánh lại tới mức gần thành kẹo rồi mới cho gà vào, đảo đúng hai
    phút cho áo ngoài — vừa đủ bám, chưa kịp ngấm.
  - >-
    Chỗ thứ hai hay hỏng là củ tỏi. Tỏi băm phi vàng rất thơm, nhưng thả nó nằm
    trong chảo đường nóng thêm vài phút nữa là đen và đắng. Người quen tay bao
    giờ cũng **phi tỏi trước, vớt ra để riêng**, rồi rắc lên sau cùng — vừa giữ
    được màu vàng đẹp, vừa còn nguyên mùi.
  - >-
    Còn cái mẹo **chiên hai lần** thì mượn từ nghề chiên gà: lần đầu cho chín và
    vàng, vớt ra để nguội chừng năm phút cho hơi ẩm bên trong thoát bớt, rồi thả
    lại chảo dầu nóng già đúng một phút. Lớp vỏ sau lần hai giòn lâu hơn hẳn —
    đủ để chịu được lớp sốt mà không xẹp.

ingredientGroups:
  - name: Cánh gà
    icon: meat
    items:
      - id: canhga
        name: Cánh gà
        icon: meat
        base: 800
        unit: g
        note: >-
          Chặt đôi ở khớp thành **cánh giữa** và **tỏi gà** cho vừa miếng và
          nhanh chín. Cánh giữa nhiều da hơn nên giòn hơn, tỏi gà nhiều thịt hơn
      - id: khumuiga
        name: Muối hột · gừng · rượu trắng
        icon: ginger
        qtyText: 1 muỗng canh muối · 1 nhánh gừng · 1 muỗng canh rượu
        note: Bóp rửa cho sạch mùi hôi, xả lại nước lạnh rồi lau khô
      - id: uopcanh
        name: Muối · tiêu
        icon: jar
        qtyText: 1 muỗng cà phê muối · 1/2 muỗng cà phê tiêu
        note: >-
          Ướp **khô và nhạt tay** thôi — lát nữa còn cả lớp sốt mắm đường phủ
          lên, ướp đậm là mặn chát
      - id: botchien
        name: Bột chiên giòn
        icon: basket
        base: 3
        unit: muỗng canh
        frac: true
        note: >-
          Xóc **một lớp thật mỏng rồi phủi bớt**. Bột dày thì lớp áo bong ra
          khỏi da lúc đảo sốt, nhìn lem nhem
  - name: Sốt mắm đường
    icon: jar
    items:
      - id: mamduong
        name: Nước mắm · đường
        icon: jar
        qtyText: 3 muỗng canh mỗi thứ
        note: >-
          Tỉ lệ **một mắm một đường** là chỗ dễ nhớ. Nước mắm ngon thì sốt thơm
          hẳn, đây là món để nước mắm lên tiếng
      - id: nuocsot
        name: Nước lọc
        icon: drop
        base: 2
        unit: muỗng canh
        frac: true
        note: Chỉ để đường tan đều và sốt khỏi cháy lúc đầu — sẽ bay hết khi đun
      - id: toiphi
        name: Tỏi băm
        icon: garlic
        base: 1
        unit: củ
        note: >-
          Phi vàng rồi **vớt ra để riêng**, rắc lên sau cùng. Để trong chảo sốt
