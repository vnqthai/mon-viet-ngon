title: Cánh gà chiên nước mắm **giòn tới miếng cuối**
summary: >-
  Cánh gà chiên vàng rồi áo một lớp nước mắm đường kẹo lại, rắc tỏi phi.
  Mẹo giữ giòn nằm ở chỗ **nấu sốt riêng một chảo** rồi mới trút cánh vào đảo
  đúng hai phút — chiên xong đổ mắm thẳng vào chảo là da mềm oặt ngay.
region: Cả nước
category: Chiên
occasions: [Cơm nhà, Nhậu lai rai, Cho bé]
