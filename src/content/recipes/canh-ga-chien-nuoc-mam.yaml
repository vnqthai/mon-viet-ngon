quick:
  ingredients:
    - Cánh gà [[800|g]] — chặt đôi ở khớp thành cánh giữa và tỏi gà
    - "Ướp: muối [[1|muỗng cà phê|frac]] · tiêu · [[1|muỗng canh|frac]] rượu trắng hoặc nước gừng"
    - Bột chiên giòn [[3|muỗng canh|frac]] — áo một lớp **thật mỏng**
    - "Sốt mắm: nước mắm [[3|muỗng canh|frac]] · đường [[3|muỗng canh|frac]] · nước [[2|muỗng canh|frac]]"
    - Tỏi [[1|củ]] băm · ớt [[2|trái]] · hành lá
    - Dầu ăn để chiên ngập nửa miếng cánh
  steps:
    - Rửa cánh gà với muối gừng, **lau thật khô**, ướp muối tiêu rượu **20 phút**.
    - Xóc một lớp bột chiên giòn thật mỏng, phủi bớt chỗ thừa.
    - Chiên dầu nóng **170–180 °C** tới vàng, vớt ra để ráo. Chiên lại lần hai **1 phút** cho giòn lâu.
    - >-
      **Chảo khác**: phi tỏi ớt tới vàng thì vớt riêng, cho mắm đường nước vào
      đun tới khi sốt sánh và nổi bọt to.
    - Trút cánh gà vào đảo **2 phút** cho áo đều, rắc tỏi phi và hành lá, tắt bếp ngay.
  warning: >-
    Đừng phi tỏi rồi để nguyên trong chảo mà nấu sốt và đảo gà. Tỏi nằm trong
    sốt đường nóng vài phút là **cháy đen và đắng**, cả chảo hỏng vị. Phi vàng
    thì vớt ra ngay, để dành rắc lên sau cùng.

