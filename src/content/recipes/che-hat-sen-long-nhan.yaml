flavorNote: >-
  **Chuẩn chén chè:** nước đường **trong suốt nhìn thấy đáy chén**, ngọt thanh
  chứ không gắt. Cùi nhãn còn **giòn mọng**, hạt sen bên trong **bùi và bở tơi**
  nhưng vẫn nguyên hình — cắn một trái thấy rõ hai kết cấu chứ không nhoè
  thành một.
storyEyebrow: Chuyện chén chè xứ Huế
storyTitle: Món chè mà **công nằm ở đôi tay, không nằm ở nồi**
story:
  - >-
    Chè hạt sen long nhãn là món chè của Huế, và là món chè hiếm hoi mà phần
    khó **không nằm ở bếp**. Nấu thì chỉ có hai việc: luộc sen cho mềm, nấu
    nước đường cho trong. Cái làm nên món là việc ngồi **moi hạt từng trái
    nhãn rồi lồng hạt sen vào chỗ trống đó** — ba chục trái là ba chục lần.
  - >-
    Vì sao phải lồng vào nhau chứ không thả chung một nồi? Vì hai thứ này
    ngược nhau. Cùi nhãn **giòn mọng, ngọt sắc, mỏng**; hạt sen **bùi, bở,
    ngọt nhạt**. Nấu chung một nồi thì mỗi thứ nằm một góc chén, ăn muỗng nào
    ra muỗng đó. Lồng vào nhau thì một miếng cắn có đủ cả hai — giòn trước,
    bùi sau.
  - >-
    Đây cũng là lý do món này hay xuất hiện ở mâm cỗ và bàn tiếp khách hơn là
    ở bữa chiều thường ngày. Nó không nấu nhanh được, và nhìn chén chè là biết
    người làm đã ngồi bao lâu. Bù lại, chè có thể làm từ hôm trước — để lạnh
    qua đêm còn ngấm và trong hơn.

