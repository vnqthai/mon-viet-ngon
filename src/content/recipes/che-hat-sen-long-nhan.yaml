heroEyebrow: Chén chè phải ngồi lồng từng trái một…

quick:
  ingredients:
    - Hạt sen tươi [[200|g]] — bỏ tâm sen (cái mầm xanh ở giữa, đắng)
    - Nhãn lồng tươi [[500|g]] — chừng 30 trái, cùi dày, hạt nhỏ
    - Đường phèn [[200|g]] · muối [[0.25|muỗng cà phê|frac]]
    - Nước lọc [[1.2|lít]] · lá dứa [[2|lá]] (tùy thích)
  steps:
    - Hạt sen bỏ tâm, luộc lửa nhỏ **15–20 phút** tới khi bấm nhẹ là mềm — đừng sôi mạnh, hạt bung nát.
    - Vớt sen ra, ngâm ngay vào tô nước lạnh cho **hạt săn lại và trắng**.
    - Nhãn bóc vỏ, dùng **mũi dao nhỏ khoét quanh hạt** rồi đẩy hạt ra — giữ cùi nguyên vòng, đừng làm rách.
    - Nấu nước đường phèn với chút muối cho tan hẳn, để **nguội hoàn toàn**.
    - "**Lồng một hạt sen vào giữa mỗi trái nhãn**, xếp ra dĩa cho khỏi bẹp."
    - Thả nhãn đã lồng sen vào nước đường nguội, ướp ngăn mát **ít nhất 2 tiếng**.
    - "Múc chén: mấy trái nhãn, chan nước đường, thêm đá viên nhỏ nếu thích."
  warning: >-
    Đừng thả nhãn vào nước đường còn nóng. Cùi nhãn gặp nóng là **mềm nhũn và
    đục**, mất hẳn cái giòn mọng — mà đó lại là toàn bộ lý do người ta chịu khó
    ngồi lồng từng trái.

