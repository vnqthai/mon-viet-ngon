title: Chè hạt sen long nhãn **mỗi trái nhãn giấu một hạt sen**
summary: >-
  Hạt sen luộc mềm được **nhét vào giữa trái nhãn đã moi hạt**, thả vào nước
  đường phèn trong veo rồi ướp lạnh. Cắn một trái là thấy hai lớp: vỏ nhãn giòn
  mọng bọc lấy hạt sen bùi mềm bên trong.
region: Miền Trung
category: Chè
occasions: [Ăn chơi, Đãi khách]
pubDate: 2026-08-01
time:
  total: 1 giờ 15 phút
  active: 45 phút
servingsBase: 4
difficulty: Kỳ công
featured: false
