stepsEyebrow: Vô bếp thôi!
stepsTitle: 4 bước ra **tô mắm chưng đông chắc, mặt vàng bóng**
stepsLead: >-
  Nấu mắm và lọc là hai việc mất mười lăm phút; còn lại là ngồi đợi nồi hấp.
  Chỉ cần nhớ mở nắp lau hơi nước cho đều tay.
steps:
  - title: Nấu mắm cho rã, rồi lọc bỏ xương
    icon: pot
    minutes: 15 phút
    intro: "Bước quan trọng nhất, và cũng là bước hay bị bỏ:"
    bullets:
      - text: >-
          Cho [[150|g]] mắm cá vào nồi nhỏ với [[150|ml]] nước, đun **lửa nhỏ
          10–15 phút**, thỉnh thoảng dằm cho thịt cá rã ra hết.
      - label: "Lọc:"
        text: >-
          Đổ qua rây, dùng muỗng **miết mạnh cho phần thịt cá lọt xuống**, giữ
          lại xương, vảy và da trên rây rồi bỏ đi. Phần nước mắm cá thu được
          sẽ hơi sệt và nâu sậm.
      - text: >-
          Để nguội bớt rồi mới trộn với trứng — còn nóng mà đổ trứng vào là
          trứng chín lợn cợn ngay trong tô.
    callout:
      type: warn
      text: >-
        Xương mắm rất nhỏ và mềm, nhai không nhận ra nhưng vẫn mắc cổ được.
        Rây một lần rồi rây lại lần nữa nếu thấy còn lợn cợn — mất thêm hai
        phút thôi.
  - title: Trộn hỗn hợp
    icon: spoon
    minutes: 8 phút
    bullets:
      - text: >-
          Cho thịt băm vào tô, đổ nước mắm cá đã lọc và nguội vào, thêm hành
          tím băm, gừng băm, ớt băm, [[1|muỗng cà phê]] tiêu và [[1|muỗng
          canh]] đường.
      - text: >-
          Đập [[2|quả]] trứng vịt và **hai lòng trắng** của quả thứ ba vào,
          đánh tan rồi trộn thật đều theo **một chiều**. Chừa lại lòng đỏ cuối
          cùng trong chén nhỏ.
      - text: >-
          Trộn miến đã ngâm mềm cắt khúc vào nếu dùng.
      - text: >-
          Nếm thử một chút hỗn hợp sống bằng đầu đũa chạm vào lưỡi: thấy **mặn
          đậm nhưng chưa gắt** là vừa. Mắm mỗi hũ mặn một khác, nên nêm theo
          hũ của mình.
  - title: Hấp cách thủy — và lau hơi nước
    icon: pot
    minutes: 30 phút
    bullets:
      - text: >-
          Đổ hỗn hợp vào **tô sâu lòng** hoặc chén sành, dàn phẳng mặt. Đừng đổ
          đầy quá miệng tô, chừa lại chừng [[2|cm]].
      - text: >-
          Đặt vào xửng, hấp **lửa vừa 25–30 phút**. Nước trong nồi phải đang
          sôi sẵn khi cho tô vào.
      - label: "Cứ 5 phút một lần:"
        text: >-
          Mở nắp, **lau khô mặt trong của nắp** rồi đậy lại. Hoặc bọc nắp bằng
          một chiếc khăn sạch ngay từ đầu.
      - text: >-
          Thử chín: xiên tăm vào giữa, rút ra **khô ráo, không dính hỗn hợp
          ướt** là được.
    callout:
      type: warn
      text: >-
        Hơi nước đọng trên nắp rơi xuống làm mặt tô **rỗ lỗ chỗ và ứ nước**,
        nhìn rất xấu. Đây là lỗi phổ biến nhất của mọi món hấp cách thủy, và
        cách chữa chỉ là chịu khó mở nắp lau.
    timer:
      secs: 1500
      label: Hẹn giờ hấp · 25:00
      doneMsg: Xiên tăm thử — rút ra khô ráo là tới lúc phết lòng đỏ!
  - title: Phết lòng đỏ và dọn
    icon: egg
    minutes: 6 phút
    bullets:
      - text: >-
          Đánh tan lòng đỏ còn lại với vài giọt dầu ăn, **phết một lớp mỏng
          lên mặt tô**, hấp tiếp **5 phút** cho mặt se và vàng bóng.
      - text: >-
          Xếp **lát ớt đỏ và gừng thái sợi** lên mặt. Màu đỏ và vàng trên nền
          nâu sậm là chỗ làm tô mắm nhìn ngon hẳn.
      - text: >-
          Bưng cả tô ra mâm khi còn nóng, xắn từng muỗng ăn với cơm và dưa leo.
    doneText: Xắn muỗng đầu tiên — mặn đậm, thơm mắm. Xong!

tipsTitle: 6 điều cho **tô mắm đông chắc, mùi vừa phải**
tipsLead: >-
  Mắm chưng hỏng theo ba kiểu: nhão không đông, mặt rỗ chảy nước, và mùi mắm
  gắt quá. Sáu điều dưới đây chặn cả ba.
tips:
  - icon: alert
    title: Lọc bỏ xương, không có ngoại lệ
    text: >-
      Xương mắm nhỏ nhưng cứng đủ để mắc cổ. Nấu rã rồi miết qua rây là xong,
      và tô mắm còn mịn hơn hẳn. Đừng tiếc phần thịt cá còn dính trên rây —
      miết mạnh muỗng là lấy được gần hết.
  - icon: drop
    title: Nước ít thôi, tô mới đông chắc
    text: >-
      Mắm đã có sẵn nước trong hũ, cộng thêm nước từ thịt và trứng khi hấp.
      Đổ [[150|ml]] là vừa; nhiều hơn thì hấp xong tô vẫn sóng sánh và xắn
      không thành miếng.
  - icon: ginger
    title: Gừng là thứ làm dịu mùi mắm
    text: >-
      Người chưa quen ăn mắm hay thấy mùi nặng. Tăng gừng lên gấp rưỡi — vừa
      băm trộn vào vừa thái sợi rắc mặt — là mùi dịu hẳn mà vẫn giữ nguyên vị
      mắm.
  - icon: egg
    title: Trứng vịt cho khối chắc hơn trứng gà
    text: >-
      Lòng đỏ trứng vịt to và đặc hơn nên tô mắm đông chắc, cắt ra giữ dáng.
      Chỉ có trứng gà thì dùng thêm một quả nữa, và giảm bớt chút nước.
  - icon: clock
    title: Lau nắp mỗi 5 phút, hoặc bọc khăn từ đầu
    text: >-
      Bọc nắp nồi bằng khăn sạch ngay từ đầu là cách rảnh tay nhất — khăn hút
      hết hơi nước, khỏi phải mở ra mở vào. Nhớ buộc gọn góc khăn cho khỏi
      chạm bếp.
  - icon: jar
    title: Nếm hỗn hợp sống trước khi hấp
    text: >-
      Mỗi hũ mắm một độ mặn, chênh nhau khá xa. Chấm đầu đũa vào hỗn hợp rồi
      chạm lưỡi: mặn quá thì thêm thịt băm hoặc một quả trứng, nhạt thì thêm
      chút mắm. Hấp xong mới biết thì hết đường chữa.

serve:
  title: Tô mắm chưng — **giữa mâm cơm ngày thường**
  paras:
    - >-
      Mắm chưng là món đưa cơm, dọn nóng ngay giữa mâm để cả nhà xắn chung.
      Bên cạnh nhất định phải có **dĩa dưa leo thái lát dày và rổ rau sống** —
      cái mát giòn của rau là thứ cân lại vị mặn đậm, và nhiều người ăn kiểu
      cuốn rau chấm mắm chứ không xắn thẳng vào cơm.
    - >-
      Ăn không hết thì để nguyên tô cất ngăn mát, hôm sau hấp lại là ngon như
      mới — thậm chí còn đậm hơn. Miếng mắm chưng nguội kẹp bánh mì cũng là
      cách ăn quen của nhiều nhà.
  aside:
    title: Mâm gợi ý
    intro: "Ba thứ dọn cùng cho tròn bữa:"
    items:
      - icon: lettuce
        text: "**Dưa leo thái lát dày** — thứ bắt buộc, cân lại cái mặn."
      - icon: bowl
        text: "**Canh rau nhạt** — canh bầu hay canh rau đay, để húp cho nhẹ miệng."
      - icon: rice
        text: "**Cơm trắng thật nóng** — cơm nguội ăn với mắm chưng thì mất nửa phần ngon."

faq:
  - q: Không mua được mắm cá linh thì thay bằng gì?
    a: >-
      **Mắm cá sặc** là thứ gần nhất và cũng dễ tìm hơn, làm y hệt. Sau đó tới
      **mắm cá lóc** (đậm hơn, giảm lượng xuống [[120|g]]). Ngoài vùng Tây Nam
      Bộ thì hàng mắm ở chợ lớn hoặc siêu thị thường có sẵn hũ nhỏ. Nói thẳng
      là mỗi loại mắm ra một mùi khác nhau — đổi loại thì tô mắm vẫn ngon
      nhưng không còn đúng bản gốc.
  - q: Tô mắm hấp xong bị nhão, không đông?
    a: >-
      Ba nguyên nhân: **nước nhiều quá**, **ít trứng quá**, hoặc **hấp chưa đủ
      lâu**. Chữa ngay được: đánh thêm một quả trứng, trộn vào rồi hấp tiếp 10
      phút. Lần sau giảm nước xuống [[120|ml]] và nhớ xiên tăm thử trước khi
      tắt bếp.
  - q: Mùi mắm nồng quá, nhà có trẻ nhỏ không ăn được?
    a: >-
      Ba cách, dùng cùng lúc: **tăng gừng lên gấp đôi**, **tăng thịt băm lên
      [[350|g]]** để pha loãng mùi, và **nấu mắm lâu hơn 5 phút** cho bay bớt.
      Ngoài ra mở cửa bếp lúc nấu — mùi trong lúc nấu nồng hơn mùi lúc ăn khá
      nhiều.
  - q: Món này khác trứng chưng thịt ở chỗ nào?
    a: >-
      Khác ở **thứ làm nên vị chính**. Trứng chưng thịt lấy trứng làm nền, vị
      hiền và ngọt, ai cũng ăn được. Mắm chưng thì trứng chỉ đóng vai kết dính,
      còn vị chính là mắm cá đồng — mặn đậm, mùi rõ, và ăn phải có rau sống
      với dưa leo đi kèm. Nhìn cũng khác hẳn: một bên vàng óng, một bên nâu
      sậm.
  - q: Hấp bằng nồi cơm điện được không?
    a: >-
      Được. Đổ chừng [[300|ml]] nước vào lòng nồi, đặt một cái chén úp ngược
      làm đế rồi để tô mắm lên, bấm nấu. Nồi nhảy sang giữ ấm thì bấm lại lần
      nữa. Tổng chừng **30–35 phút**. Nhớ **lót khăn dưới nắp** vì nắp nồi cơm
      đọng nước rất nhiều.
  - q: Để dành được mấy ngày?
    a: >-
      Ngăn mát **3–4 ngày**, đậy kín. Hấp lại chừng 10 phút hoặc quay lò vi
      sóng là ăn được, và nhiều nhà thấy ngày thứ hai còn đậm đà hơn. Đừng để
      ngoài quá 2 tiếng, trời nóng thì cất sớm hơn nữa.

