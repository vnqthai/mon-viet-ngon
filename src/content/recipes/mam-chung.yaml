title: Mắm chưng thịt trứng **mặt nâu sậm, xắn muỗng là hao cơm**
summary: >-
  Mắm cá đồng nấu rã ra rồi trộn với thịt băm và trứng, hấp cách thủy tới khi
  **đông lại thành một khối nâu sậm lấm tấm thịt**. Mặt phủ lát ớt và gừng
  sợi, xắn một muỗng ăn kèm dưa leo với cơm nóng là hết chén lúc nào không hay.
region: Miền Tây
category: Hấp
occasions: [Cơm nhà]
