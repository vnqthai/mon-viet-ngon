flavorNote: >-
  **Chuẩn tô mắm chưng:** khối mắm **đông chắc, xắn ra thành miếng giữ dáng**
  chứ không lỏng cũng không khô xác. Mặt nâu sậm bóng, cắt ra thấy **lấm tấm
  thịt băm và vân trứng**. Mặn đậm, dậy mùi mắm rõ ràng, hậu ngọt từ thịt.
storyEyebrow: Chuyện tô mắm chưng
storyTitle: Hũ mắm để dành, và **cách dễ nhất để bắt đầu với nó**
story:
  - >-
    Ở miền Tây, mùa nước nổi cá về nhiều tới mức ăn không hết, nên người ta ủ
    muối thành mắm để dành ăn quanh năm. **Mắm cá linh** và **mắm cá sặc** là
    hai loại quen nhất — cá đồng nhỏ, ủ với muối và thính gạo cho tới khi thịt
    cá mềm rục và dậy mùi.
  - >-
    Mắm chưng là cách nấu hiền nhất với hũ mắm đó. Mắm được nấu cho rã ra, lọc
    bỏ xương, rồi trộn cùng thịt băm và trứng đem hấp. Thịt và trứng **kéo cái
    mặn xuống và làm mềm mùi mắm lại**, nên tô mắm chưng đậm đà mà không gắt
    — người chưa quen ăn mắm thường bắt đầu từ món này.
  - >-
    Nấu thì dễ, gần như không có kỹ thuật gì: trộn rồi hấp. Chỗ duy nhất phải
    để tâm là **lau hơi nước đọng ở nắp** trong lúc hấp, vì một giọt nước rơi
    xuống là mặt tô rỗ và loang.

