heroEyebrow: Chén mắm của mùa nước nổi…

quick:
  ingredients:
    - Mắm cá linh hoặc cá sặc [[150|g]] — mắm cá đồng ủ muối, mua ở hàng mắm
    - Thịt nạc dăm băm [[250|g]] · trứng vịt [[3|quả]] (chừa 1 lòng đỏ để phết mặt)
    - Hành tím [[4|củ]] · gừng [[1|nhánh]] · ớt [[3|trái]] · tiêu · đường
    - Dưa leo · rau thơm · cơm trắng để ăn kèm
  steps:
    - Nấu mắm với [[150|ml]] nước, lửa nhỏ **10–15 phút** tới khi thịt cá rã hết.
    - Lọc qua rây, **bỏ xương và da**, chỉ giữ phần nước mắm cá sệt.
    - Trộn nước mắm cá với thịt băm, trứng đánh tan, hành tím băm, tiêu và chút đường.
    - Đổ vào tô sâu lòng, dàn phẳng mặt, **hấp cách thủy 25–30 phút**.
    - Cứ **5 phút mở nắp lau hơi nước** một lần, không thì mặt rỗ và chảy nước.
    - Phết lòng đỏ trứng lên mặt, hấp thêm **5 phút** cho mặt vàng bóng.
    - Rắc gừng thái sợi và ớt thái lát, dọn nóng với cơm và dưa leo.
  warning: >-
    Đừng bỏ qua bước lọc. Mắm cá còn nguyên xương dăm và mảnh da thì cả tô ăn
    vướng, mà xương mắm thì nhỏ và mềm nên nhai không phát hiện ra được cho tới
    lúc mắc ở cổ.

