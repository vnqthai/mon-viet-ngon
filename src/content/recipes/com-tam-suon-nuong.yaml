title: Cơm tấm sườn nướng **thơm khói như góc phố Sài Gòn**
summary: >-
  Miếng sườn ướp sả mật ong nướng **cháy cạnh thơm lừng**, cơm tấm tơi xốp,
  mỡ hành béo, đồ chua giòn, chan muỗng **nước mắm kẹo** — bữa sáng huyền
  thoại của Sài Gòn nay đỏ lửa ngay bếp nhà.
region: Miền Nam
category: Cơm
time:
  total: 1 giờ 30 phút (+ ướp 3 giờ)
servingsBase: 4
difficulty: Vừa
featured: true
order: 5
art: com-tam
heroEyebrow: Khói thơm đầu hẻm Sài Gòn…

quick:
  ingredients:
    - Sườn cốt lết [[4|miếng]] (~[[800|g]]) — dần mềm, ướp càng lâu càng thấm
    - "Ướp sườn: sả băm [[3|cây]] · tỏi + hành tím băm · nước mắm [[2|muỗng canh|frac]] · đường [[2|muỗng canh|frac]] · mật ong [[1|muỗng canh|frac]] · sữa đặc [[1|muỗng canh|frac]] · dầu hào [[1|muỗng canh|frac]] · tiêu + dầu ăn"
    - Gạo tấm [[400|g]] — nấu ít nước hơn cơm thường
    - "Mỡ hành: hành lá [[5|nhánh]] + [[3|muỗng canh|frac]] dầu nóng · đồ chua cà rốt – củ cải"
    - "Nước mắm kẹo: mắm [[4|muỗng canh|frac]] + đường [[4|muỗng canh|frac]] + nước [[4|muỗng canh|frac]], nấu hơi sánh + tỏi ớt"
    - Trứng gà [[4|trái]] ốp la (tùy thích) · dưa leo, cà chua ăn kèm
  steps:
    - Sườn dần sơ cho mềm, ướp với hỗn hợp sả tỏi mắm đường mật ong sữa đặc — **ít nhất 3 giờ**, qua đêm càng đỉnh.
    - Vo gạo tấm, nấu với lượng nước **ít hơn cơm thường một nấc** cho hột cơm tơi.
    - Làm mỡ hành (dầu nóng chế vô hành lá + nhúm muối đường); pha nước mắm kẹo nấu tan hơi sánh; làm đồ chua.
    - Nướng sườn than hoa (hoặc lò/nồi chiên không dầu 200°C) **mỗi mặt 7–8 phút**, phết nước ướp 1–2 lần — cháy cạnh mép mỡ là đạt.
    - Ốp la lòng đào nếu thích; sườn nướng xong **để nghỉ 3 phút** mới dọn.
    - Xới cơm, đặt sườn + trứng + dưa leo cà chua + đồ chua, rưới mỡ hành, chan nước mắm kẹo — ăn nóng liền.
  warning: >-
    Sườn khô cứng là do hai lỗi: ướp thiếu dầu/mật ong giữ ẩm, và nướng lửa
    quá gắt quá lâu. Lửa vừa, phết nước ướp, thấy cháy cạnh là dừng.

flavor:
  chua: 2
  ngot: 7
  man: 6
  cay: 1.5
  thom: 9.5
flavorNote: >-
  **Chuẩn dĩa cơm tấm:** sườn **mềm mọng, rìa cháy cạnh caramel**, cơm tơi
  từng hột, và nước mắm phải **kẹo sánh ngọt đậm** — chan tới đâu bám cơm
  tới đó.
storyEyebrow: Chuyện dĩa cơm
storyTitle: Món **tự tình của Sài Gòn** từ hột gạo vỡ
story:
  - >-
    "Tấm" là hột gạo **gãy vụn** khi xay xát — thời trước là phần gạo rẻ nhất,
    dành cho nhà lao động. Vậy mà người Sài Gòn đem nấu khéo, kê thêm miếng
    sườn nướng, chút mỡ hành, chén mắm kẹo… biến phần gạo "hạng bét" thành
    món ăn **cả thành phố say mê**, sáng trưa chiều tối lúc nào cũng đông
    khách.
  - >-
    Nhắc cơm tấm là nhắc **mùi khói**: đi ngang quán, chưa thấy bảng hiệu đã
    nghe mùi sườn ướp sả đường rớt xuống than bốc lên thơm điếc mũi. Ở nhà
    không có lò than cũng đừng lo — bí quyết nằm ở **nước ướp đủ ngọt để
    caramel hóa** và cách canh lửa, công thức này chỉ kỹ từng bước, nướng lò
    hay nồi chiên không dầu vẫn ra miếng sườn cháy cạnh bóng lưỡng.
  - >-
    Dĩa cơm tấm nhà nấu có cái sướng riêng: sườn dày hơn quán, trứng ốp la
    lòng đào theo ý, mắm kẹo nêm đúng khẩu vị nhà mình. Cuối tuần đổ một mẻ,
    cả nhà ngồi quanh bàn — **Sài Gòn tự nhiên gần xịt**, dù bạn ở đâu.

