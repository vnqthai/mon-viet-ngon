flavorNote: >-
  **Chuẩn dĩa:** ngó sen **trắng ngà, cắn nghe giòn tanh tách**, không dai không
  thâm; đáy dĩa **khô ráo**, không đọng nước. Vị chua nổi lên trước, ngọt và mặn
  theo sau, rau răm với đậu phộng khép lại.

storyEyebrow: Chuyện món ăn
storyTitle: "Cọng ngó sen và **hai kẻ thù của nó**: khí trời và muối"
story:
  - >-
    Ngó sen là đoạn cọng non nằm ngầm dưới bùn, nối giữa củ sen và cái lá sắp
    nhú. Nó trắng ngà, mềm, và bên trong **rỗng thành nhiều ống dọc** — chính
    mấy cái ống đó làm cọng ngó sen cắn nghe giòn tanh tách chứ không dai như
    cọng rau thường. Người ta lội bùn moi từng cọng, nên ngó sen bao giờ cũng
    đắt hơn củ sen.
  - >-
    Cọng ngó sen có hai kẻ thù. Thứ nhất là **khí trời**: vừa cắt ra gặp không
    khí là mặt cắt thâm lại thành nâu xỉn, dĩa gỏi nhìn cũ hẳn. Cách chặn là thả
    ngay vào **nước đá pha chanh** — chua giữ cho ngó sen trắng, còn lạnh làm
    thớ cọng săn lại giòn hơn. Thêm chút đường và muối vào chậu nước ngâm thì
    cọng ngó sen còn nở căng chứ không quắt.
  - >-
    Kẻ thù thứ hai là **muối trong nước trộn**. Gỏi trộn xong để càng lâu, muối
    càng rút nước từ trong cọng ngó sen ra, và tới lúc bưng lên thì dĩa gỏi nằm
    trong một vũng nước lạt nhách. Đó là lý do người làm tiệc bao giờ cũng để
    sẵn từng thứ riêng ra, đợi tới sát giờ mới đổ chung vào thau trộn một lượt.
  - >-
    Gỏi ngó sen tôm thịt là món **mở đầu mâm tiệc** ở miền Nam — mâm cưới, mâm
    giỗ, mâm Tết đều gặp. Nó chua giòn và mát, đặt trước những món nặng bụng
    phía sau, và bao giờ cũng đi kèm một dĩa bánh phồng tôm để xúc thay đũa.

