stepsTitle: Bốn nhịp — và nhịp cuối phải **sát giờ bưng ra**
stepsLead: >-
  Cả món chỉ khó ở một chỗ: giữ cho ngó sen trắng và giòn. Ba nhịp đầu làm
  trước lúc nào cũng được, riêng nhịp trộn thì để sau cùng.
steps:
  - title: Chẻ và ngâm ngó sen
    icon: knife
    minutes: 20 phút
    bullets:
      - text: >-
          Rửa sạch ngó sen, cắt khúc dài chừng [[5|cm]]. Cọng nào mập thì **chẻ
          dọc làm đôi** cho thấm đều.
      - label: "Thả ngay vào nước đá:"
        text: >-
          Pha một thau nước đá với nước cốt một trái chanh, một muỗng canh muối
          và một muỗng canh đường. Chẻ tới đâu thả vào tới đó — để ngoài không
          khí là mặt cắt thâm ngay.
      - text: >-
          Ngâm **15–20 phút**, vớt ra rổ, **vẩy cho thật ráo**. Còn đọng nước là
          dĩa gỏi loãng.
    timer:
      secs: 1080
      label: Ngâm ngó sen nước đá · 18:00
      doneMsg: Vớt ra để cho thật ráo nghen!
    callout:
      type: tip
      text: >-
        Không mua được ngó sen tươi thì dùng **ngó sen ngâm chua đóng hũ** — xả
        nước lạnh vài lần cho bớt chua rồi vắt ráo. Nhớ **giảm chanh trong nước
        trộn xuống một nửa**, vì bản thân ngó sen ngâm đã chua sẵn.
  - title: Luộc tôm và thịt
    icon: pot
    minutes: 20 phút
    bullets:
      - label: "Tôm:"
        text: >-
          Rửa sạch, rút chỉ đen ở lưng. Luộc nước sôi có chút muối **5 phút**,
          vớt ra thả ngay vào nước lạnh cho thịt săn, rồi bóc vỏ và chẻ dọc đôi.
      - label: "Thịt ba chỉ:"
        text: >-
          Luộc với chút muối và củ hành đập dập chừng [[20|phút]] tới khi xiên
          đũa qua được. Vớt ra, **để nguội hẳn** rồi thái lát mỏng vừa ăn.
      - text: Để riêng hai thứ ra dĩa, đậy lại chờ trộn.
    timer:
      secs: 300
      label: Luộc tôm · 05:00
      doneMsg: Vớt tôm thả nước lạnh ngay cho săn chắc!
  - title: Pha nước trộn
    icon: lime
    minutes: 5 phút
    bullets:
      - text: >-
          Hòa nước mắm, đường và nước cốt chanh theo **tỉ lệ bằng nhau**, khuấy
          cho đường tan hoàn toàn.
      - text: >-
          Nếm thử: phải thấy **chua nổi lên trước**, rồi mới tới ngọt và mặn.
          Nhạt thì thêm mắm, gắt thì thêm chút nước lọc.
      - text: Cho tỏi băm và ớt băm vào sau cùng, để chúng nổi trên mặt chén.
    callout:
      type: warn
      text: >-
        Đừng pha nước trộn quá loãng cho "vừa miệng" khi nếm riêng. Lát nữa nó
        phải áo cả thau ngó sen, tôm và thịt — nếm riêng thấy **hơi đậm một
        chút** mới là vừa.
  - title: Trộn — sát giờ bưng ra
    icon: bowl
    minutes: 5 phút
    bullets:
      - text: >-
          Cho ngó sen đã ráo, hành tây, tôm và thịt vào thau lớn. Rưới nước trộn
          quanh thành thau chứ đừng dội thẳng vào giữa.
      - label: "Trộn nhẹ tay:"
        text: >-
          Dùng đũa dài **xới từ dưới lên** chừng mười cái là đủ. Bóp mạnh tay là
          ngó sen gãy và ra nước.
      - text: >-
          Cho rau răm cắt khúc vào, đảo thêm hai vòng rồi gắp ra dĩa — **chừa
          lại phần nước dưới đáy thau**, đừng chan lên.
      - text: Rắc đậu phộng giã và hành phi, xếp bánh phồng tôm quanh dĩa.
    doneText: Xong — bưng ra ngay khi ngó sen còn lạnh và giòn!

tipsTitle: 4 chỗ **quyết định** dĩa gỏi ngó sen
tips:
  - icon: lime
    title: Nước đá pha chanh — cả ba thứ đều có việc
    text: >-
      Chanh giữ cho mặt cắt **không thâm**, đá làm thớ cọng **săn và giòn** hơn,
      còn chút đường muối giữ cọng nở căng thay vì quắt lại. Thiếu chanh thì gỏi
      ngả nâu, thiếu đá thì mềm — mà cả hai lỗi đều nhìn thấy ngay trên dĩa.
  - icon: clock
    title: Trộn sau cùng, không trộn trước
    text: >-
      Đây là lỗi phổ biến nhất khi làm tiệc: trộn sẵn cho nhàn rồi để đó. Muối
      rút nước ra khỏi ngó sen, mười lăm phút sau là đáy dĩa đọng nước, cọng ngó
      mềm oặt và vị loãng hẳn. Chuẩn bị sẵn từng phần rồi trộn lúc sắp bưng ra —
      mất đúng năm phút.
  - icon: drop
    title: Vẩy cho thật ráo trước khi trộn
    text: >-
      Ngó sen vừa vớt khỏi thau nước đá còn ngậm rất nhiều nước. Không vẩy ráo
      thì chỗ nước đó pha loãng nước trộn, nêm kiểu gì cũng thấy nhạt. Vẩy rổ
      mấy lượt, hoặc trải ra khăn sạch thấm bớt.
  - icon: basket
    title: Đậu phộng và hành phi rắc lúc bưng ra
    text: >-
      Hai thứ này là phần **giòn khô** đối lại chỗ ướt của gỏi. Trộn chung vào
      thau thì chúng ngậm nước trộn và mềm nhũn, coi như mất. Rắc lên mặt dĩa
      ngay trước khi bưng, và để riêng một chén nhỏ cho ai muốn thêm.

serve:
  title: Dĩa gỏi **mở màn bữa tiệc** — xúc bằng bánh phồng tôm
  paras:
    - >-
      Gỏi ngó sen là món đầu tiên lên bàn: chua, giòn, mát, dọn trước những món
      nặng phía sau. Bày dĩa nông và trải rộng chứ đừng chất đống — chất cao thì
      phần dưới bị đè, ra nước và mềm.
    - >-
      Bánh phồng tôm chiên phồng xếp quanh dĩa, dùng **bẻ đôi xúc gỏi** thay
      đũa. Nếu bữa có bia thì đây cũng là món nhắm mở đầu quen thuộc — chua giòn
      nên uống được lâu.
  aside:
    title: Còn dư thì làm sao
    intro: "Gỏi đã trộn không để được, nhưng cứu được một phần:"
    items:
      - icon: drop
        text: "**Chắt bỏ nước đọng**, cất ngăn mát, hôm sau trộn thêm rau răm mới cho lại mùi."
      - icon: bowl
        text: "**Ngó sen chưa trộn** thì ngâm nước đá pha chanh, đậy kín, để được tới hôm sau."
      - icon: shrimp
        text: "**Tôm thịt luộc còn dư** cứ để riêng — hôm sau trộn với dưa leo là ra một dĩa gỏi khác."

faq:
  - q: Ngó sen tươi và ngó sen ngâm chua đóng hũ khác nhau ra sao?
    a: >-
      Ngó sen tươi giòn hơn hẳn và vị ngọt thanh; ngó sen ngâm chua tiện, để lâu
      được, nhưng đã chua sẵn và mềm hơn. Dùng loại ngâm thì **xả nước lạnh vài
      lần, vắt ráo, và giảm chanh trong nước trộn xuống một nửa** — không thì
      dĩa gỏi chua gắt.
  - q: Ngó sen bị thâm đen dù đã ngâm?
    a: >-
      Thường do **chẻ xong để ngoài không khí quá lâu rồi mới thả vào nước**.
      Phải chẻ tới đâu thả tới đó. Cũng có thể nước ngâm ít chanh quá — một trái
      cho một thau là mức tối thiểu. Cọng đã thâm thì không trắng lại được, chỉ
      còn cách cắt bỏ khúc đó.
  - q: Ăn chay thì thay tôm thịt bằng gì?
    a: >-
      Đậu hũ chiên vàng thái lát và nấm bào ngư xé xào sơ là cặp gần nhất — vẫn
      có chỗ đậm và chỗ dai để cân với ngó sen. Nước trộn đổi nước mắm thành
      **nước tương pha chút muối**, còn tỉ lệ chua ngọt thì giữ nguyên.
  - q: Làm cho tiệc đông người thì chuẩn bị thế nào?
    a: >-
      Làm sẵn hết ba nhịp đầu từ sáng: ngó sen ngâm để trong thau nước đá đậy
      kín, tôm thịt luộc để riêng ngăn mát, nước trộn pha sẵn để chén. Tới giờ
      thì **trộn từng thau nhỏ theo từng lượt dọn** thay vì trộn một lần cả mẻ —
      dĩa nào lên bàn cũng còn giòn.

ticker:
