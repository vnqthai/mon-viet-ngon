heroEyebrow: Món khai vị của mâm tiệc…

quick:
  ingredients:
    - Ngó sen tươi [[400|g]] — chọn cọng non, trắng ngà, chưa thâm
    - Tôm sú [[300|g]] · thịt ba chỉ [[250|g]]
    - "Ngâm ngó sen: nước đá + [[1|trái]] chanh + [[1|muỗng canh|frac]] muối + [[1|muỗng canh|frac]] đường"
    - "Nước trộn: nước mắm [[3|muỗng canh|frac]] · đường [[3|muỗng canh|frac]] · nước cốt chanh [[3|muỗng canh|frac]]"
    - Tỏi ớt băm · rau răm [[1|nắm]] · hành tây [[0.5|củ|frac]]
    - Đậu phộng rang [[50|g]] · hành phi [[3|muỗng canh|frac]] · bánh phồng tôm
  steps:
    - Chẻ ngó sen thành khúc [[5|cm]], ngâm **nước đá pha chanh muối đường 15–20 phút** rồi vớt ra để thật ráo.
    - Luộc tôm 5 phút, thả vào nước lạnh, bóc vỏ rồi **chẻ dọc đôi**. Luộc ba chỉ, để nguội, thái lát mỏng.
    - Pha nước trộn theo tỉ lệ **mắm — đường — chanh bằng nhau**, cho tỏi ớt băm vào sau cùng.
    - >-
      **Trộn ngay trước khi dọn**: cho ngó sen, tôm, thịt, hành tây vào thau,
      rưới nước trộn, trộn nhẹ tay bằng đũa.
    - Bày ra dĩa, rắc rau răm cắt khúc, đậu phộng giã và hành phi. Dọn kèm bánh phồng tôm.
  warning: >-
    Đừng trộn gỏi trước rồi để đó chờ khách. Muối trong nước trộn rút nước ra
    khỏi ngó sen, chừng mười lăm phút là **đáy dĩa đọng một vũng nước**, ngó sen
    mềm oặt và vị thì loãng hẳn. Chuẩn bị sẵn từng phần, trộn lúc sắp bưng ra.

