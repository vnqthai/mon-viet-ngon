title: Gỏi ngó sen tôm thịt **giòn sần sật, dĩa không ra nước**
summary: >-
  **Ngó sen** — cọng non mọc ngầm dưới bùn của cây sen, rỗng ruột nên cắn nghe
  giòn tanh tách. Chẻ khúc ngâm nước đá pha chanh cho trắng giòn, trộn với tôm
  luộc và ba chỉ, rắc đậu phộng hành phi, xúc bánh phồng tôm.
region: Miền Nam
category: Gỏi
occasions: [Đãi khách, Cỗ Tết, Nhậu lai rai]
pubDate: 2026-07-30
