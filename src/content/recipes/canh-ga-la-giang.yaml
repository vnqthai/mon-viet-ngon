flavorNote: >-
  **Chuẩn nồi canh lá giang:** nước **vàng trong, chua thanh có hậu
  ngọt** — chua kiểu lá vườn dịu dàng chứ không gắt giọng như giấm; thịt
  gà săn ngọt, húp nóng giữa trưa nắng là "hạ hỏa" liền.
storyEyebrow: Chuyện nồi canh
storyTitle: Canh chua **cây nhà lá vườn** đúng nghĩa đen
story:
  - >-
    Ở miền Tây, lá giang là thứ **mọc cho không**: dây leo quấn bờ rào,
    mé mương, hàng cây sau hè — lá nhỏ xanh mướt, nhấm thử nghe chua dịu.
    Nhà có khách bất chợt, con gà trong chuồng với nắm lá ngoài rào là
    thành nồi canh đãi khách; bởi vậy dân miệt vườn hay cười: món này là
    **"cây nhà lá vườn" theo nghĩa đen trăm phần trăm**.
  - >-
    Gọi tên cho rành mạch: đây là một nồi **canh chua** — họ hàng ruột
    với canh chua cá lóc, chỉ khác hai chỗ: chất chua là **lá giang thay
    cho me**, phần nhân là **gà thay cho cá**. Cái hay của lá giang là
    chua mà thanh: vị chua tiết ra từ từ khi nấu, muốn chua tới đâu cứ
    **thêm lá tới đó**, nước canh giữ màu vàng trong veo chứ không thẫm.
    Gặp thịt gà ta dai ngọt là thành cặp trời sinh; các quán miền Tây còn
    nâng lên thành **lẩu gà lá giang** bốc khói cho cả bàn xúm xít.
  - >-
    Công thức này giữ đúng nếp nấu miệt vườn: gà xào săn cho thơm, nước
    sôi hớt bọt cho trong, lá giang vò giập thả sau cùng. Ba mươi lăm
    phút — mà bưng nồi canh lên, nghe mùi chua thanh bay ra là hiểu vì
    sao người miền Tây xa quê **nhớ bờ rào nhà mình** trước cả nhớ chợ.

