title: Canh gà lá giang **chua thanh lá vườn, ngọt thịt gà ta**
summary: >-
  Món **canh chua của miền Tây**, cùng họ với canh chua cá lóc — nhưng
  chất chua không phải me mà là **nắm lá giang vò giập** hái bờ rào, nhân
  không phải cá mà là gà ta xào săn. Nước vàng trong chua thanh, húp một
  muỗng nghe mát tới ruột gan.
region: Miền Tây
category: Canh
occasions: [Đãi khách]
time:
  total: 35 phút
servingsBase: 4
difficulty: Dễ
featured: false
order: 34
art: ga-la-giang
heroEyebrow: Ra bờ rào hái nắm lá giang…

quick:
  ingredients:
    - Gà ta [[800|g]] chặt miếng vừa gắp
    - Lá giang [[1|bó]] — nhặt lấy chừng [[2|nắm]] lá non, rửa sạch, **vò giập**
    - Tỏi [[3|tép]] băm · hành tím [[2|củ]] · ớt sừng [[1|trái]] xắt lát
    - "Nêm: nước mắm [[2|muỗng canh|frac]] · đường phèn [[1|muỗng cà phê]] · muối"
    - Ngò gai + ngò om [[1|bó]] nhỏ — xắt khúc rắc cuối
    - "Ăn kèm: cơm nóng (hoặc bún) · chén **muối ớt** chấm gà"
  steps:
    - Gà chà muối rửa sạch, để ráo; lá giang nhặt lá non, **vò giập** cho mau ra chua.
    - Phi thơm tỏi + hành tím, cho gà vô **xào săn 5 phút**, nêm sơ [[1|muỗng canh|frac]] nước mắm.
    - Châm [[1.5|lít|frac]] nước sôi, hớt bọt, nấu **liu riu 15 phút** cho gà mềm ngọt nước.
    - Thả lá giang vò, sôi lại **3–5 phút** — nếm rồi thêm lá tới độ chua ưng ý.
    - Nêm nước mắm – đường phèn – muối cho **chua ngọt cân nhau**, thả ớt lát.
    - Tắt bếp, rắc ngò gai ngò om — dọn nóng với cơm và chén muối ớt.
  warning: >-
    Nấu lá giang **đừng dùng nồi nhôm** — chất chua của lá phản ứng với
    nhôm, canh dễ chát và không tốt cho sức khỏe. Cứ nồi inox, nồi đất
    hay nồi tráng men là yên tâm.

