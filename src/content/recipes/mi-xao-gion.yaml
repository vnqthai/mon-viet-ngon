flavorNote: >-
  **Chuẩn dĩa mì:** sốt **sánh bám được vào muỗng** chứ không lỏng chảy tràn
  dĩa; mì ở rìa vẫn **giòn rụm** khi đã ăn tới nửa dĩa. Tôm mực chín tới, còn
  sần sật; cải ngọt xanh và giòn ở cọng.
storyEyebrow: Chuyện dĩa mì xào giòn
storyTitle: Một món, **hai kết cấu**, và một cuộc chạy đua với thời gian
story:
  - >-
    Mì xào giòn là món của mấy tiệm ăn người Hoa trong vùng Chợ Lớn, và cách
    dựng món khá lạ: hai phần được nấu **hoàn toàn tách nhau** rồi chỉ gặp
    nhau đúng lúc bưng ra bàn. Phần dưới là ổ mì trứng chiên ngập dầu, vàng
    và rụm. Phần trên là chảo sốt sánh nóng hổi đầy tôm mực và rau.
  - >-
    Cái hay nằm ở chỗ hai phần đó **không bao giờ hoà làm một**. Sốt ngấm dần
    từ giữa ra, nên gắp muỗng đầu tiên thì mì mềm ngọt đẫm sốt, gắp tới rìa
    dĩa lại thấy sợi khô rụm gãy tanh tách. Một dĩa mà ăn được hai kiểu, và
    kiểu nào cũng đúng.
  - >-
    Đổi lại, món này **không chờ được**. Nấu xong là phải ăn. Nên khi làm ở
    nhà, thứ tự quan trọng hơn kỹ thuật: chiên mì trước để nguội cũng không
    sao, nhưng chảo sốt phải là việc cuối cùng, và chan xong là bưng lên bàn
    ngay.

