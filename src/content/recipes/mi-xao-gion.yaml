heroEyebrow: Món ăn có hai kết cấu cùng lúc…

quick:
  ingredients:
    - Mì trứng sợi nhỏ [[300|g]] — loại vắt khô, chiên ngập dầu
    - Tôm [[200|g]] · mực [[150|g]] · gan heo [[100|g]] (hoặc thay bằng thịt nạc)
    - Cải ngọt [[200|g]] · cà rốt [[1|củ]] · nấm rơm [[100|g]] · hành tây [[0.5|củ|frac]]
    - "Sốt: dầu hào [[2|muỗng canh]] · nước tương [[1|muỗng canh]] · bột năng [[2|muỗng canh]] · nước dùng [[400|ml]]"
  steps:
    - Trụng mì **30 giây** cho sợi rời, xả nước lạnh, để **thật ráo** — còn ướt là chiên bắn dầu.
    - Chiên mì ngập dầu nóng già, ép thành **ổ tròn dẹt**, vàng đều hai mặt thì vớt ra giấy thấm.
    - Ướp tôm mực gan với chút muối tiêu dầu hào, **chần nhanh qua nước sôi** rồi vớt ra.
    - Phi tỏi, xào cà rốt và hành tây trước, cải ngọt và nấm sau — rau còn xanh giòn thì trút ra.
    - Đổ nước dùng vào chảo, nêm dầu hào nước tương, **rót bột năng pha loãng từ từ** tới khi sốt sánh.
    - Trả hải sản và rau vào chảo, đảo nhẹ một vòng rồi tắt bếp ngay.
    - "Dọn: đặt ổ mì ra dĩa sâu lòng, **chan sốt lên giữa** cho tràn ra mép."
  warning: >-
    Chan sốt sớm rồi để đó là cả dĩa mì **ỉu nhũn trong ba phút**. Chiên mì
    xong cứ để riêng, bắc chảo sốt xong mới chan — và chan ngay trước khi bưng
    ra bàn.

flavor:
  chua: 1
  ngot: 4
  man: 6
  cay: 1
