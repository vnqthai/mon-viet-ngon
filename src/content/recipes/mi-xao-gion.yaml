title: Mì xào giòn **sợi rụm dưới lớp sốt sánh**
summary: >-
  Vắt mì trứng chiên ngập dầu thành **ổ vàng giòn rụm**, bên trên đổ một lớp
  sốt sánh nóng đầy tôm, mực, gan và cải ngọt. Ăn nhanh tay: chỗ sốt chạm tới
  thì mềm ngọt, chỗ còn khô vẫn rụm tan trong miệng.
region: Miền Nam
category: Xào
occasions: [Đãi khách, Ăn chơi]
