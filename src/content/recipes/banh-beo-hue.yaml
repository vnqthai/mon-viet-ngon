stepsEyebrow: Vô bếp thôi!
stepsTitle: 5 bước ra **mâm bánh bèo lõm xoáy giữa chén**
stepsLead: >-
  Pha bột trước một tiếng rồi làm mấy thứ rắc mặt trong lúc chờ. Khi bắt đầu
  hấp thì làm liền một mạch — mỗi mẻ chỉ mất bảy phút.
steps:
  - title: Pha bột và để nghỉ
    icon: rice
    minutes: 10 phút
    intro: "Bước này làm sớm, rồi để đó:"
    bullets:
      - text: >-
          Trộn [[200|g]] bột gạo với [[30|g]] bột năng và nhúm muối, rót
          [[700|ml]] nước vào **từ từ** và khuấy cho tan hết, không còn lợn cợn.
      - text: >-
          Để bột nghỉ **ít nhất 1 tiếng**, để qua đêm trong ngăn mát càng tốt.
          Bột nghỉ thì hạt bột ngậm đủ nước, bánh mới mềm mịn.
      - label: "Chắt nước trong:"
        text: >-
          Sau khi nghỉ, bột lắng xuống và **nổi một lớp nước trong ở trên**.
          Chắt bỏ lớp đó rồi châm lại đúng bằng ấy nước sạch, khuấy đều. Bánh
          sẽ trong hơn và bớt mùi chua của bột.
    callout:
      type: tip
      text: >-
        Bột lắng rất nhanh, nên **khuấy lại trước mỗi lần múc**. Múc mấy chén
        cuối từ phần bột đặc dưới đáy là mấy chén đó dày cộm và không lõm.
  - title: Rang tôm chấy cho bông tơi
    icon: shrimp
    minutes: 20 phút
    bullets:
      - text: >-
          Tôm khô ngâm nước ấm 20 phút cho mềm, vắt thật ráo rồi **giã trong
          cối cho tơi ra thành sợi bông**, đừng giã nát thành bột.
      - text: >-
          Cho tôm vào chảo khô, để **lửa nhỏ nhất**, đảo liên tục
          **12–15 phút**. Tôm sẽ khô dần rồi **bông tơi lên và ngả màu cam
          ruộm**.
      - text: >-
          Gần cuối rắc một nhúm muối, một nhúm đường và [[1|muỗng cà phê]] dầu
          điều, đảo đều cho lên màu rồi tắt bếp.
      - text: >-
          Để nguội hẳn. Tôm chấy nguội mới thật sự tơi — lúc còn nóng nhìn vẫn
          hơi bết.
    callout:
      type: warn
      text: >-
        Lửa lớn là tôm cháy và đắng trước khi kịp bông. Cả bước này phải ở lửa
        nhỏ nhất và đảo không ngừng tay — giống hệt lúc rang chà bông.
  - title: Thắng tóp mỡ và làm mỡ hành
    icon: flame
    minutes: 12 phút
    bullets:
      - text: >-
          Thái ba chỉ thành hạt lựu nhỏ, cho vào chảo **nguội** rồi bật lửa
          nhỏ. Đảo tới khi tóp **teo lại, vàng và giòn** thì vớt ra để riêng
          trên giấy thấm.
      - text: >-
          Hành lá thái nhỏ cho vào chén chịu nhiệt. Đun chỗ mỡ vừa thắng cho
          **nóng già** rồi dội thẳng lên hành, khuấy nhanh — hành chín tái,
          xanh và bóng.
      - text: >-
          Pha mắm: khuấy [[2|muỗng canh]] đường vào [[4|muỗng canh]] nước ấm
          cho tan, thêm [[3|muỗng canh]] nước mắm, vắt chanh, thả tỏi ớt băm.
  - title: Hấp bánh — chén phải nóng già trước
    icon: pot
    minutes: 25 phút
    intro: "Đây là chỗ quyết định cái xoáy lõm:"
    bullets:
      - text: >-
          Quét một lớp dầu **thật mỏng** vào lòng từng chén nhỏ, xếp chén vào
          xửng.
      - text: >-
          Đậy nắp, **hấp chén không chừng 3 phút cho nóng già** rồi mới mở ra
          múc bột.
      - text: >-
          Khuấy đều thau bột, múc vào mỗi chén chừng **2/3 chén** (dày cỡ đốt
          ngón tay là vừa). Đậy nắp hấp **6–8 phút**.
      - label: "Dấu hiệu chín:"
        text: >-
          Mặt bánh **chuyển từ trắng đục sang trắng trong, se lại và lõm xuống
          một xoáy nhỏ ở giữa**. Chạm ngón tay thấy không dính là được.
      - text: >-
          Lấy chén ra, làm mẻ tiếp theo. Nhớ **lau khô nắp** mỗi mẻ cho nước
          không nhỏ xuống mặt bánh.
    timer:
      secs: 420
      label: Hẹn giờ hấp một mẻ · 07:00
      doneMsg: Mặt bánh trắng trong và lõm giữa — lấy ra, làm mẻ tiếp!
  - title: Rắc mặt và dọn mâm
    icon: basket
    minutes: 8 phút
    bullets:
      - text: >-
          Bánh còn ấm thì rắc **tôm chấy vào đúng chỗ lõm giữa chén**, thả
          hai ba viên tóp mỡ, rưới một vòng mỡ hành.
      - text: >-
          Chan **một thìa mắm** lên từng chén ngay trước khi ăn — chan sớm thì
          bánh ngấm mắm và nhũn.
      - text: >-
          Xếp chén ra mâm hoặc khay, để sẵn **thìa nhỏ** cho mỗi người. Ăn khi
          bánh còn ấm.
    doneText: Lách thìa một vòng, xúc nguyên cái — xong!

tipsTitle: 6 bí quyết cho **bánh trong, lõm giữa, lách ra nguyên miếng**
tipsLead: >-
  Bánh bèo hỏng theo bốn kiểu: mặt phẳng lì, bánh đục và bở, dính đáy chén, và
  tôm chấy bết. Sáu điều dưới đây chặn hết.
tips:
  - icon: pot
    title: Hấp chén nóng già rồi mới múc bột
    text: >-
      Bí quyết số một của cái xoáy lõm. Bột gặp chén nóng thì mép bánh chín
      ngay và bám vào thành chén, phần giữa chín sau nên lún xuống. Chén nguội
      thì bánh chín đều, mặt phẳng lì và đáy dính chặt.
  - icon: drop
    title: Bột pha loãng, và chắt bỏ lớp nước trong
    text: >-
      Bột đặc cho ra cái bánh dày và bở. Loãng như nước gạo mới đúng. Chắt bỏ
      lớp nước nổi sau khi bột nghỉ rồi châm nước mới là mẹo làm bánh trong
      hẳn — nhiều nhà bỏ qua bước này.
  - icon: clock
    title: Khuấy lại thau bột trước mỗi lần múc
    text: >-
      Bột gạo lắng xuống đáy rất nhanh. Không khuấy thì mấy chén đầu loãng
      toẹt, mấy chén cuối dày cộm. Một vòng khuấy trước mỗi mẻ là đủ.
  - icon: flame
    title: Tôm chấy rang lửa nhỏ nhất, đảo không ngừng
    text: >-
      Muốn tôm bông lên như bông gòn thì phải rút nước ra từ từ. Lửa lớn là
      cháy sém bên ngoài mà bên trong còn ẩm, để một hôm là bết lại. Mười lăm
      phút lửa nhỏ, và giã trước cho tơi.
  - icon: bottle
    title: Mắm bánh bèo pha loãng hơn mắm chấm
    text: >-
      Vì mắm này **chan lên bánh** chứ không phải để nhúng. Pha đặc như mắm
      chấm gỏi cuốn là chén bánh mặn chát. Tỉ lệ dễ nhớ: nước nhiều hơn mắm
      một chút.
  - icon: spoon
    title: Chan mắm ở chén nào ăn chén đó
    text: >-
      Chan cả mâm một lượt rồi ngồi ăn dần là mấy chén sau nhũn và nhạt. Để
      chén mắm giữa mâm, ai ăn tới chén nào thì chan chén đó — đúng cách người
      Huế dọn.

serve:
  title: Mâm bánh bèo — **ăn bằng chén, đếm bằng cái**
  paras:
    - >-
      Bánh bèo dọn cả mâm chén con, mỗi người ăn chục cái là chuyện thường. Để
      chén mắm ở giữa, ai ăn tới đâu chan tới đó. Ăn lúc bánh còn ấm tay là
      ngon nhất — nguội hẳn thì bánh cứng lại và mất phần mềm dai.
    - >-
      Ở Huế, bánh bèo hay được dọn chung với mấy thứ bánh cùng họ trên một
      mâm: bánh nậm gói lá dong, bánh bột lọc trong veo, bánh ít trần. Làm ở
      nhà thì chỉ cần bánh bèo với một dĩa rau sống là đủ cho buổi chiều.
  aside:
    title: Dọn kèm gì cho đủ
    intro: "Ba thứ nên có trên mâm:"
    items:
      - icon: spoon
        text: "**Thìa nhỏ lòng nông** — loại nào cũng được, miễn lách vừa mép chén."
      - icon: bottle
        text: "**Chén mắm chan đặt giữa mâm** — mỗi người tự chan chén của mình."
      - icon: chili
        text: "**Dĩa ớt xanh thái lát** — cắn một miếng giữa chừng cho đỡ ngán."

faq:
  - q: Không có chén nhỏ chuyên dụng thì hấp bằng gì?
    a: >-
      **Chén chấm** hoặc **nắp hũ thủy tinh** đều dùng được, miễn là lòng nông
      và đáy phẳng. Khuôn bánh flan bằng nhôm cũng ổn. Chỉ cần nhớ hai điều:
      lòng chén phải nông (bánh dày quá thì không lõm) và chén phải chịu được
      nhiệt hấp.
  - q: Mặt bánh không lõm, phẳng lì thì sao?
    a: >-
      Gần như luôn là do **chén chưa đủ nóng** khi múc bột. Nguyên nhân thứ
      hai là **bột pha đặc quá**. Chữa: hấp chén không 3 phút cho nóng già rồi
      mới múc, và châm thêm nước vào thau bột cho loãng bớt. Bánh phẳng vẫn
      ăn ngon, chỉ là không có chỗ đựng nhân.
  - q: Bánh dính chặt đáy chén, lách không ra?
    a: >-
      Ba chỗ: **quên quét dầu**, **chén chưa nóng lúc múc bột**, hoặc **hấp
      quá lâu**. Chữa ngay được: để chén nguội bớt rồi lách — bánh nóng quá
      thì mềm và dễ rách, nguội một chút lại rời ra dễ hơn.
  - q: Làm tôm chấy bằng tôm tươi thế nào?
    a: >-
      Hấp [[200|g]] tôm tươi chín, bóc vỏ, bỏ chỉ lưng, rồi **giã cho tơi** và
      rang y như tôm khô. Tôm tươi cho màu hồng cam nhạt hơn và vị ngọt thanh
      hơn, nhưng cũng mau bết hơn — nên rang kỹ hơn vài phút và dùng trong 2
      ngày.
  - q: Làm trước được phần nào?
    a: >-
      **Tôm chấy** làm trước cả tuần, cất hũ kín. **Tóp mỡ** và **mắm** làm
      trước 2–3 ngày. **Bột** pha từ tối hôm trước để ngăn mát thì bánh còn
      ngon hơn. Chỉ có phần hấp bánh là phải làm trong ngày — bánh bèo để qua
      đêm thì cứng lại.
  - q: Bánh nguội bị cứng, hâm lại được không?
    a: >-
      Được. **Hấp lại 3–4 phút** là bánh mềm như mới. Đừng quay lò vi sóng —
      chỗ nóng chỗ nguội và mép bánh dai lại. Nếu đã rắc nhân rồi thì gạt nhân
      ra, hấp bánh xong rắc lại.

