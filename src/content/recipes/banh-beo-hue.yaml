title: Bánh bèo Huế **chén nhỏ lõm giữa, tôm chấy cam ruộm**
summary: >-
  Bột gạo pha loãng đổ vào từng chén con rồi hấp, mặt bánh **se lại và lõm
  xuống một xoáy nhỏ ở giữa** — đúng chỗ để đùn nhúm tôm chấy cam, viên tóp mỡ
  vàng và một thìa mắm ngọt. Cầm chén, lách thìa một vòng quanh mép là gọn một cái.
