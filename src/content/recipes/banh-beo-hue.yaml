quick:
  ingredients:
    - Bột gạo [[200|g]] + bột năng [[30|g]] + nước [[700|ml]] — pha loãng, để nghỉ 1 tiếng
    - Tôm khô [[80|g]] (hoặc tôm tươi [[200|g]]) — làm tôm chấy
    - Thịt ba chỉ [[100|g]] — thắng lấy tóp mỡ · hành lá làm mỡ hành
    - "Mắm chấm: nước mắm [[3|muỗng canh]] · đường [[2|muỗng canh]] · nước ấm [[4|muỗng canh]] · chanh, tỏi, ớt"
  steps:
    - Pha bột gạo với bột năng, nước và chút muối, khuấy tan rồi **để nghỉ ít nhất 1 tiếng**.
    - Chắt bỏ phần nước trong nổi trên mặt, châm lại đúng bằng ấy nước sạch — bánh sẽ trong hơn.
    - Xếp chén nhỏ vào xửng, **hấp cho chén nóng già** rồi mới múc bột vào, mỗi chén chừng 2/3.
    - Hấp **6–8 phút** tới khi mặt bánh **chuyển trắng trong và se lại**.
    - Tôm khô ngâm mềm, giã nhỏ rồi rang chảo lửa nhỏ tới khi **bông tơi và cam ruộm**.
    - Thắng ba chỉ lấy tóp mỡ; hành lá thái nhỏ, dội dầu nóng lên làm mỡ hành.
    - Pha mắm chua ngọt loãng hơn bình thường — mắm này để **chan**, không phải để chấm.
    - Rắc tôm chấy, tóp mỡ, rưới mỡ hành, chan một thìa mắm lên từng chén.
  warning: >-
    Múc bột vào chén nguội là **mặt bánh không lõm** và đáy bánh dính chặt,
    lách thìa không ra. Chén phải được hấp nóng già trước, và bột phải khuấy
    lại ngay trước mỗi lần múc.

flavor:
