flavorNote: >-
  **Chuẩn chén bánh bèo:** mặt bánh **trắng trong, lõm một xoáy nhỏ ở giữa**,
  dày chừng đốt ngón tay. Bánh **mềm mà còn dai nhẹ**, lách thìa là rời khỏi
  chén thành một miếng nguyên. Tôm chấy bông tơi, cắn vào tan ra; tóp mỡ giòn
  rụm; mắm chan loãng và chua ngọt dịu.
storyEyebrow: Chuyện mâm bánh bèo
storyTitle: Cái xoáy giữa chén — **dấu hiệu bánh đã đạt**
story:
  - >-
    Bánh bèo Huế được hấp ngay trong cái chén sẽ dọn lên bàn, nên mỗi cái bánh
    là một chén riêng và một mâm bánh bèo là mấy chục chén con xếp sát nhau.
    Cách ăn cũng đi theo: cầm chén lên, **lách thìa một vòng quanh mép** cho
    bánh rời ra khỏi lòng chén, rồi xúc nguyên cái. Hàng ở Huế hay để thìa tre
    cho hợp cảnh, nhưng thìa sứ hay thìa inox nhà nào cũng có đều xúc được —
    miễn là thìa nhỏ, lòng nông, lách vừa cái chén con.
  - >-
    Điều đầu tiên người Huế nhìn khi mâm bánh bưng ra là **cái xoáy lõm ở giữa
    mặt bánh**. Xoáy đó không phải trang trí — nó xuất hiện khi bột được đổ
    vào chén đang nóng già và hấp đúng lửa, phần giữa chín sau nên lún xuống.
    Bánh mặt phẳng lì nghĩa là chén chưa đủ nóng hoặc bột pha đặc quá.
  - >-
    Cái lõm đó cũng có việc của nó: nó là chỗ đựng. Nhúm **tôm chấy** — tôm
    giã nhỏ rang khô cho bông tơi lên như bông gòn, màu cam ruộm — nằm gọn ở
    giữa, thêm viên tóp mỡ, một vòng mỡ hành xanh, rồi thìa mắm chan xuống là
    đủ bốn thứ trong một miếng.

