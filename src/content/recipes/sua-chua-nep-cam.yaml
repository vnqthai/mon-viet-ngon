title: Sữa chua nếp cẩm **nếp tím dẻo quánh dưới lớp sữa chua trắng**
summary: >-
  Nếp cẩm ninh với lá dứa cho tới lúc hạt nứt và nước sánh lại, thêm đường và
  nước cốt dừa. Múc vào ly, chan sữa chua lạnh lên trên — **tím sẫm nằm dưới,
  trắng ngà nằm trên**, xúc một thìa là được cả hai.
