quick:
  ingredients:
    - Nếp cẩm [[250|g]] — ngâm **6 giờ**, vớt bỏ hạt nổi
    - Lá dứa [[3|lá]] — buộc nút thả vào nồi ninh
    - Đường [[120|g]] — nêm sau khi hạt đã mềm
    - Nước cốt dừa [[150|ml]] · muối [[1|muỗng cà phê|frac]]
    - Sữa chua [[6|hộp]] — để lạnh
  steps:
    - Ngâm nếp cẩm **6 giờ**, vo lại, vớt bỏ hạt nổi lều bều.
    - >-
      Ninh với [[1|lít]] nước và lá dứa, lửa nhỏ **50–60 phút** tới khi hạt nứt
      và nước sánh.
    - Nêm đường, đảo cho tan, ninh thêm **10 phút**.
    - Cho nước cốt dừa và chút muối, đun **3 phút** rồi tắt bếp, để nguội hẳn.
    - Múc nếp cẩm vào ly, chan sữa chua lạnh lên trên.
  warning: >-
    Cho đường vào **lúc hạt còn cứng** thì vỏ hạt se lại, ninh thêm một tiếng
    nữa vẫn không mềm được. Đợi hạt nứt ra và bấm thấy bở mới nêm đường.

