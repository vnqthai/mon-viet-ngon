flavorNote: >-
  **Chuẩn ly:** hạt nếp cẩm **nứt vỏ, mềm mà còn nguyên hạt**, nhai ra dẻo và
  hơi sựt ở lõi; phần nước quanh hạt **sánh như hồ loãng**, kéo thìa lên thấy
  chảy chậm; sữa chua lạnh gặp nếp cẩm mát tạo hai lớp rõ, xúc xuống mới trộn
