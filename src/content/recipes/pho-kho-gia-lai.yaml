flavorNote: >-
  **Chuẩn vị:** sợi phở săn dai áo đều tương đen **mặn ngọt dịu**, cắn
  trúng hành phi giòn thơm; húp muỗng nước dùng phải **trong veo ngọt
  xương** — tô đậm tô thanh nương nhau, không bên nào lấn bên nào.
storyEyebrow: Chuyện hai tô phở
storyTitle: Gọi **một phở**, bưng ra **hai tô**
story:
  - >-
    Khách lần đầu tới Pleiku, sáng se lạnh ghé quán kêu "cho một phở khô",
    rồi ngơ ngác khi cô chủ bưng ra... **hai tô** — một tô phở trộn, một
    tô nước dùng bốc khói. Không ai dọn nhầm đâu: dân phố núi kêu món này
    là **"phở hai tô"**, và cái tên mộc mạc đó đã theo món đi xa — năm
    2012, phở khô Gia Lai được Tổ chức Kỷ lục châu Á đưa vào danh sách
    món ăn đạt **"giá trị ẩm thực châu Á"**.
  - >-
    Nghe chữ "phở" mà đừng chờ mùi quế hồi: sợi phở khô xay từ bột gạo —
    dân Gia Lai chuộng gạo Phú Thiện — **nhỏ mảnh cỡ sợi hủ tiếu**,
    trụng xong vẫn săn dai chứ không mềm oặt; nước dùng chỉ ninh xương
    cho ngọt trong, thơm hành gừng nướng. Còn linh hồn của tô trộn là
    **tương đen** — đậu nành lên men với muối và mật mía, màu nâu đen,
    sánh mịn, mặn ngọt dịu, hũ tương ủ càng lâu càng dậy thơm.
  - >-
    Cái thú của món nằm ở nhịp ăn: rưới tương đen, trộn cho từng sợi phở
    tơi ra và áo đều, gắp một đũa đậm đà rồi húp một muỗng nước dùng thanh
    ngọt — **cứ vậy xen nhau** tới cuối bữa. Nấu ở nhà không khó, chỉ cần
    săn đúng hai thứ: gói phở khô và hũ tương đen — phần còn lại, công
    thức này lo.

