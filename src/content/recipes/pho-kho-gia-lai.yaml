title: Phở khô Gia Lai **sợi dai quyện tương đen, một món dọn hai tô**
summary: >-
  Đặc sản phố núi Pleiku mà dân địa phương quen kêu **"phở hai tô"**: một
  tô phở trộn sợi nhỏ săn dai quyện tương đen, gà xé, hành phi thơm lựng —
  kề bên một tô nước dùng ninh xương ngọt trong. Một đũa phở, một muỗng
  nước, xen nhau tới giọt cuối cùng.
region: Tây Nguyên
category: Món nước
occasions: [Ăn chơi, Bữa sáng]
