quick:
  ingredients:
    - >-
      Phở khô Gia Lai [[400|g]] — sợi nhỏ, mảnh, dai; kẹt lắm thay hủ tiếu
      khô sợi nhỏ
    - Gà ta [[1|con]] (cỡ 1,5 kg) + xương heo [[500|g]] — vừa thịt vừa nước dùng
    - >-
      Bò băm [[200|g]] vo viên thả tô nước · hành tím [[6|củ]] phi vàng ·
      tóp mỡ tùy thích
    - >-
      Linh hồn: **tương đen Gia Lai** [[3|muỗng canh|frac]] (tương đậu nành
      lên men, sánh mịn) + xì dầu [[2|muỗng canh|frac]]
    - >-
      Rau ăn kèm: giá [[200|g]] · xà lách + húng quế · hành lá, ngò · chanh
      [[1|trái]], ớt
  steps:
    - Xương heo chần rửa sạch, ninh chung nồi với gà + hành gừng nướng — **hớt bọt, liu riu**, không quế hồi.
    - Sau 30 phút vớt gà ra xé thịt; xương ninh tiếp cho ngọt; nêm muối, đường phèn, chút nước mắm **nhẹ tay**.
    - Hành tím thái mỏng phi vàng giòn (làm nhiều nhiều); bò băm ướp tiêu hành, vo viên nhỏ.
    - Trụng phở **vừa tới còn dai**, xóc ráo, trộn ngay muỗng mỡ hành phi cho sợi rời; giá trụng sơ.
    - "Tô trộn: phở + giá + gà xé + hành phi + tóp mỡ + hành ngò."
    - "Tô nước: nước dùng sôi bùng thả viên bò, chín nổi lên là múc, rắc hành ngò tiêu."
    - Ăn kiểu Pleiku — rưới tương đen + xì dầu vô tô phở, **trộn tách từng sợi**, một đũa phở một muỗng nước.
  warning: >-
    Trụng phở quá tay là sợi nở bở, bết thành tảng — sợi phở khô quý nhất
    độ dai, trụng vừa tới, xóc ráo trộn mỡ liền.

