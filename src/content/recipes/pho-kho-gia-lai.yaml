stepsEyebrow: Vô bếp thôi!
stepsTitle: 6 bước ra **cặp tô chuẩn Pleiku**
stepsLead: >-
  Nồi nước dùng lên bếp trước, mọi thứ khác làm trong lúc chờ — tới giờ ăn
  chỉ còn trụng phở, ráp tô. Nhớ giùm một điều xuyên suốt: nước phải
  trong, sợi phải dai.
steps:
  - title: Ninh nồi nước dùng trong veo
    icon: pot
    minutes: 60 phút
    intro: "Nước dùng phở khô chỉ cần một chữ: **trong**. Ngọt từ xương, không mượn mùi gia vị:"
    bullets:
      - label: "Chần xương:"
        text: >-
          xương heo chần nước sôi 3 phút, đổ nước, rửa sạch vụn bẩn — bước
          nhỏ quyết định nồi nước trong.
      - label: "Bắc nồi:"
        text: >-
          xương + gà nguyên con + hành tím, gừng nướng đập giập +
          [[3|lít]] nước + 1 muỗng cà phê muối; đun sôi, **hớt bọt kỹ**,
          hạ liu riu.
      - label: "Vớt gà:"
        text: >-
          sau **30 phút** gà chín tới, vớt ra ngâm thau nước đá cho da săn
          thịt mọng; xương cứ ninh tiếp **30–45 phút** nữa.
      - label: "Nêm:"
        text: >-
          muối + 1 muỗng cà phê đường phèn + chút nước mắm — nêm **thanh
          nhẹ thôi**, vì tô phở bên kia đã có tương đen lo phần đậm.
    callout:
      type: warn
      text: >-
        **Không quế – hồi – thảo quả.** Phở khô Gia Lai không mượn mùi phở
        Bắc: nồi nước chỉ ngọt xương, thơm hành gừng nướng — thả hồi quế
        vô là lạc tông liền.
    timer:
      secs: 1800
      label: Hẹn giờ luộc gà · 30:00
      doneMsg: Vớt gà ra, ninh xương tiếp nghen!
  - title: Xé gà & vo viên bò
    icon: knife
    minutes: 15 phút
    bullets:
      - label: "Xé gà:"
        text: >-
          gà nguội bớt thì lóc thịt, **xé dải theo thớ** miếng vừa gắp —
          đừng xé vụn; da thái sợi trộn chung, ai thích thì để.
      - label: "Viên bò:"
        text: >-
          bò băm trộn ½ muỗng cà phê tiêu + 1 muỗng canh hành tím băm + 1
          muỗng cà phê nước mắm, **vo viên cỡ đầu ngón cái** — thả tô nước
          lúc dọn.
    callout:
      type: tip
      text: >-
        Bộ lòng gà làm sạch, luộc chín thái miếng thả tô nước là đúng kiểu
        nhiều quán Pleiku — nhà ăn được lòng thì đừng bỏ qua.
  - title: Phi hành & thắng tóp mỡ
    icon: onion
    minutes: 15 phút
    bullets:
      - label: "Hành phi:"
        text: >-
          hành tím thái lát mỏng đều, thả vô dầu **còn ấm** rồi mới tăng
          lửa vừa, đảo tới **vàng nhạt là vớt liền** ra giấy thấm — hành
          còn chín tiếp, nguội là vàng ruộm giòn tan.
      - label: "Tóp mỡ:"
        text: >-
          mỡ heo xắt hạt lựu, thắng lửa vừa tới vàng giòn thì vớt; **phần
          mỡ nước giữ lại** — lát nữa trộn phở cho sợi rời, bóng đẹp.
    callout:
      type: warn
      text: >-
        Hành phi vàng sậm ngay trên chảo là ra tới dĩa thành **đắng** —
        nhớ vớt lúc vàng nhạt. Món này hành phi là mùi chủ đạo, phi hư
        là uổng cả tô.
  - title: Trụng phở — khúc sống còn
    icon: noodle
    minutes: 10 phút
    intro: "Sợi phở dai hay bở là quyết định ở đây:"
    bullets:
      - text: >-
          Nước sôi già, thả phở vô **rũ tơi bằng đũa**, trụng chừng **1
          phút** (coi thêm hướng dẫn trên bao bì) — nếm thử thấy sợi mềm
          ngoài mà còn **săn dai ở lõi** là vớt.
      - text: >-
          Xóc thiệt ráo, trút ra thau, trộn ngay **1 muỗng mỡ hành
          phi** (hoặc dầu ăn) cho sợi rời và bóng.
      - text: Giá trụng nhanh 10 giây, vớt để ráo.
    callout:
      type: tip
      text: >-
        Sợi phở khô còn **hút nước tiếp sau khi vớt** — thà vớt sớm 10
        giây còn hơn trễ 10 giây, ra tô là sợi vừa tới.
    timer:
      secs: 60
      label: Hẹn giờ trụng phở · 01:00
      doneMsg: Nếm thử — còn săn dai là vớt liền!
  - title: Ráp tô phở trộn
    icon: bowl
    minutes: 5 phút
    bullets:
      - text: >-
          Chia phở ra tô, lót giá trụng, phủ **gà xé**, rắc **hành phi
          hào phóng** + tóp mỡ + hành ngò + tiêu.
      - text: >-
          Dọn kèm chén **tương đen + xì dầu** — tương nêm lúc ăn mới đúng
          kiểu, khỏi lo tô mặn tô lạt.
    callout:
      type: tip
      text: >-
        Tô trộn "chuẩn quán" nhìn xuống phải đủ bốn màu: sợi phở trắng
        ngà, gà vàng nhạt, hành phi nâu óng, hành ngò xanh — thiếu màu nào
        bổ sung màu đó.
  - title: Tô nước dùng & dọn "hai tô"
    icon: spoon
    minutes: 5 phút
    bullets:
      - text: >-
          Nước dùng sôi bùng, thả **viên bò** vô — viên nổi lên chừng 1–2
          phút là chín; nếm lại lần cuối.
      - text: >-
          Múc ra **tô nhỏ hơn tô phở**, rắc hành ngò + tiêu, thêm lòng gà
          nếu có.
      - text: >-
          Dọn mỗi người **một cặp tô kề nhau** + chén tương đen — đúng bộ
          "phở hai tô" phố núi.
    callout:
      type: tip
      text: >-
        Cách ăn đúng điệu: rưới tương đen + xì dầu vô tô phở, **trộn tách
        từng sợi cho tơi**, gắp một đũa phở rồi húp một muỗng nước dùng —
        xen nhau vậy tới cuối bữa.
    doneText: Hai tô lên mâm — xong!

tipsTitle: 7 bí quyết cho **đúng chất phở phố núi**
tipsLead: >-
  Món này nguyên liệu không cầu kỳ, nhưng có mấy chỗ "lệch một ly đi một
  dặm" — đọc trước cho chắc tay.
tips:
  - icon: noodle
    title: Sợi phở là "căn cước" của món
    text: >-
      Sợi bột gạo **nhỏ mảnh, trụng xong vẫn săn dai** — đó là thứ làm phở
      khô ra phở khô. Ngoài Gia Lai cứ đặt online gói "phở khô Gia Lai";
      kẹt lắm thay hủ tiếu khô sợi nhỏ. Bánh phở tươi kiểu Bắc thì đừng —
      mềm oặt, trộn là nát.
  - icon: jar
    title: Tương đen ủ càng lâu càng thơm
    text: >-
      Đậu nành lên men với muối và mật mía cho hũ tương **nâu đen sánh
      mịn, mặn ngọt dịu** — không gắt như xì dầu, không ngọt lự như tương
      chấm gỏi cuốn. Mua được hũ ngon cứ cất ngăn mát, ăn dần được rất
      lâu.
  - icon: pot
    title: Nước trong là danh dự
    text: >-
      Chần xương, hớt bọt, ninh **liu riu không đậy vung** — nước dùng
      trong veo nhìn thấu đáy tô mới đạt. Món này nước đục là mất nửa cái
      đẹp của cặp tô.
  - icon: onion
    title: Hành phi phải hào phóng
    text: >-
      Quán Pleiku rắc hành phi **phủ vàng mặt tô** chứ không rắc lấy lệ —
      mùi thơm của nó dẫn cả tô trộn. Tự phi thơm hơn hành mua sẵn nhiều,
      và nhớ vớt lúc vàng nhạt.
  - icon: clock
    title: Trụng phở canh từng chục giây
    text: >-
      Sợi nhỏ nên chín rất nhanh, lại còn hút nước sau khi vớt — **canh
      đồng hồ, nếm thử liên tục**. Vớt đúng lúc, sợi phở dai ngon tới
      miếng cuối cùng.
  - icon: meat
    title: Viên bò thả lúc nước sôi bùng
    text: >-
      Nước sôi già làm mặt viên bò **se lại tức thì** — viên săn, ngọt,
      không tan vụn làm đục nước. Thả vô nước chưa sôi là viên bở, nồi
      nước lợn cợn.
  - icon: spoon
    title: Tô nước không phải để chan
    text: >-
      Đổ tô nước vô tô phở là thành món khác liền, mất cái thú sợi trộn
      đậm đà. **Húp riêng, ăn xen kẽ** — một bên đậm một bên thanh, đó mới
      là "phở hai tô".

serve:
  title: Dọn mâm **kiểu "hai tô" phố núi**
  paras:
    - >-
      Trước mặt mỗi người là một cặp tô: tô phở trộn ấm, tô nước dùng bốc
      khói, chén tương đen để giữa bàn ai nêm nấy. Sáng cuối tuần trời
      mát mà dọn bộ này ra, cả nhà lạ miệng — có người ăn xong còn đòi
      "phở gì mà vui vậy".
    - >-
      Nhịp ăn cứ thong thả: trộn tô phở cho từng sợi áo tương, gắp một
      đũa, húp một muỗng nước, thêm lá húng quế bẻ đôi — ăn tới đâu ấm
      bụng tới đó, đúng kiểu sáng se lạnh cao nguyên.
    - >-
      Mê kiểu "tô khô + chén nước riêng" này thì nhà mình còn bài **hủ
      tiếu Nam Vang** — bản khô cũng dọn kèm chén nước lèo. Còn hôm nào
      thèm phở nước nghi ngút đúng nghĩa, đã có **phở bò**, **phở gà**
      chờ sẵn.
  aside:
    title: Trên mâm cho đủ bộ
    intro: "Bộ này dọn thiếu thứ nào là kém vui thứ đó:"
    items:
      - icon: jar
        text: "**Chén tương đen + xì dầu** — linh hồn, để giữa bàn ai nêm nấy."
      - icon: lettuce
        text: "**Dĩa xà lách, húng quế** — ngắt bỏ thẳng vô tô trộn cho mát."
      - icon: lime
        text: "**Chanh + ớt xắt lát** — tô nước vắt chanh, người ăn cay dầm ớt."
      - icon: drop
        text: "**Nhúm tóp mỡ giòn** — thêm vô tô trộn là 'tới bến' luôn."

faq:
  - q: Tên là "phở" mà sao chẳng giống phở?
    a: >-
      Đúng vậy — nó chỉ mượn chữ "phở" thôi: sợi **nhỏ dai** chứ không
      mềm dẹt, nước dùng **không quế hồi**, và dọn **hai tô ăn trộn** chứ
      không chan. Cứ coi đây là một món riêng của Tây Nguyên. Còn thèm
      phở nước "chính chủ" thì nhà có bài phở bò, phở gà.
  - q: Không mua được sợi phở khô Gia Lai thì sao?
    a: >-
      Gói phở khô để được rất lâu, nên **đặt online từ các tiệm đặc sản
      Gia Lai một lần vài gói** là tiện nhất. Thay thế gần nhất là **hủ
      tiếu khô sợi nhỏ dai** — hơi khác một chút nhưng vẫn ra tinh thần
      món. Đừng dùng bánh phở tươi — mềm, trộn là nát.
  - q: Không có tương đen Gia Lai, pha thay thế được không?
    a: >-
      Được, gần đúng: **[[2|muỗng canh|frac]] tương đen (hoisin) +
      [[1|muỗng canh]] tương hột xay + chút nước**, đun nhỏ lửa cho sánh
      mịn rồi để nguội. Nhưng nói thiệt lòng, đúng bài nhất vẫn là đặt hũ
      tương đặc sản — để được lâu, đáng công chờ ship.
  - q: Bản gà với bản bò khác nhau chỗ nào?
    a: >-
      Quán Pleiku thường có hai bản: **bản gà** như bài này (gà xé tô
      trộn, nước ninh xương heo – gà) và **bản bò** — tô trộn phủ thịt heo
      bằm xào hành, tô nước ninh xương bò thả **bò tái hoặc bò viên**.
      Tô nước có viên bò băm như công thức này là kiểu nhiều quán vẫn dọn
      kèm bản gà — gọn một nồi mà đủ vị.
  - q: Làm trước được những gì?
    a: >-
      Gần hết: nước dùng ninh trước, để **ngăn mát 2–3 ngày hoặc trữ đông
      cả tháng**; hành phi cất hũ kín 1–2 tuần; gà xé đậy kín ngăn mát 2
      ngày. Riêng **phở thì ăn tới đâu trụng tới đó** — trụng trước để tủ
      là bết dính, mất dai.
  - q: Tô phở trộn bị bết thành tảng — sao vậy?
    a: >-
      Ba thủ phạm: trụng quá tay, **quên xóc ráo trộn mỡ**, hoặc trụng
      xong để lâu mới ăn. Cứu liền tại bàn: chan **một muỗng nước dùng
      nóng** vô tô, dùng đũa tách sợi trộn lên là tơi lại ngay — mẹo này
      dân Gia Lai xài hoài.

