title: Bò xào bông thiên lý **giòn xanh, thơm mùi giàn hoa**
summary: >-
  Bông thiên lý xanh mướt xào lửa lớn **đúng một phút** cho còn giòn, trộn với
  thịt bò mềm ngọt vừa xào tới — dĩa xào mùa hè nhanh gọn, mà mùi hoa thì
  thoang thoảng suốt bữa cơm.
