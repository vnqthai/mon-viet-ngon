heroEyebrow: Mùa hè, giàn thiên lý trổ bông…

quick:
  ingredients:
    - Bông thiên lý [[300|g]] — chọn chùm còn búp, nụ khép, cuống xanh
    - Thịt bò [[250|g]] — thăn hoặc bắp, thái mỏng ngang thớ
    - "Ướp bò: tỏi băm · dầu ăn [[1|muỗng canh]] · dầu hào [[1|muỗng canh]] · tiêu"
    - Tỏi [[5|tép]] băm · hành tím [[2|củ]]
    - "Nêm: nước mắm [[1|muỗng canh]] · đường [[0.5|muỗng cà phê|frac]]"
  steps:
    - Bông thiên lý **rửa nhẹ tay trong thau nước**, đừng xối vòi — xối mạnh là nụ rụng rời cuống.
    - Ướp bò với tỏi băm, dầu ăn, dầu hào và tiêu — **[[15|phút]]**, có dầu thì thịt mềm và không dính chảo.
    - Chảo **thật nóng**, xào bò lửa lớn **1 phút cho vừa tái**, trút ra dĩa riêng ngay.
    - Chảo đó phi thơm tỏi hành, cho bông thiên lý vào **xào lửa lớn đúng 1 phút**.
    - Nêm nước mắm và đường ở thành chảo, đảo nhanh.
    - Trút bò trở lại, **đảo 15 giây rồi tắt bếp** — dựa vào nhiệt còn lại của chảo là đủ.
    - Rắc tiêu, dọn ra dĩa ăn liền lúc còn nóng.
  warning: >-
    Xào bò và bông chung một lượt là hỏng chắc: bò cần lửa lớn thời gian ngắn,
    bông thiên lý thì chỉ chịu được đúng một phút. Xào chung thì hoặc bò dai,
    hoặc bông nhũn nhớt — **luôn xào riêng rồi mới trộn lại**.

