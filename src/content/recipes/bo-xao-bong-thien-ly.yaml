flavorNote: >-
  **Chuẩn dĩa xào:** bông thiên lý **còn xanh nguyên màu, cắn thấy giòn**,
  không ngả vàng úa và không ra nước; lát bò **mềm mọng, mặt ngoài vừa săn**
  chứ không xám khô. Dĩa xào khô ráo, không đọng vũng nước dưới đáy.
storyEyebrow: Chuyện bông thiên lý
storyTitle: Giàn hoa trước ngõ, **mỗi năm chỉ một mùa**
story:
  - >-
    Thiên lý là loại dây leo quen thuộc của sân nhà quê: người ta trồng cho
    leo giàn trước ngõ, vừa lấy bóng mát vừa hái bông nấu ăn. Bông nở thành
    chùm nhỏ màu vàng xanh, thơm dịu — cái mùi thơm đó giữ nguyên cả sau khi
    xào, và đó chính là thứ làm dĩa xào này khác hẳn mọi dĩa bò xào rau khác.
  - >-
    Điểm cần biết trước khi đi chợ: **thiên lý là rau theo mùa**, rộ nhất vào
    những tháng hè. Ngoài mùa thì có nhưng ít, đắt, và bông hay nở bung. Chọn
    chùm còn **búp khép, cuống xanh cứng** — chùm đã nở xoè thì xào xong nhũn
    và mất mùi.
  - >-
    Món này là kiểu món "đi chợ về là có ngay": tổng cộng chưa tới nửa tiếng,
    mà cả nhà ai cũng gắp. Chỉ cần nhớ đúng một điều — **bông thiên lý chỉ chịu
    được một phút trên chảo**. Quá một phút là nó chuyển từ giòn xanh sang nhũn
    vàng, không có đường lùi.

