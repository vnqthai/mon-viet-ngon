flavorNote: >-
  **Chuẩn miếng:** rìa hơi dai, giữa còn mềm và mọng nước; chấm muối vào thì
  **chua bật lên trước**, cay theo sau, mặn đi sau cùng.
storyEyebrow: Chuyện món ăn
storyTitle: Miếng thịt của **vùng nắng**, và hũ muối không nơi nào khác có
story:
  - >-
    **Krông Pa** (Gia Lai) với **Sơn Hòa** (Phú Yên) nằm sát nhau, cùng một
    thung lũng nắng chang chang và gió khô — vùng nuôi bò lâu đời. Trước khi có
    tủ lạnh, thịt ăn không hết thì đem phơi. Phơi kiệt thành khô bò để dành được
    hàng tháng; phơi **đúng một buổi nắng** rồi ăn ngay thì miếng thịt vẫn còn
    mềm và ngọt. Cái tên **"một nắng"** nói đúng nghĩa đen như vậy.
  - >-
    Người Ê Đê ở Sơn Hòa được cho là đã làm kiểu thịt này từ lâu; sau đó nó lan
    dần lên thị trấn Phú Túc của huyện Krông Pa và thành nghề ở đó. Nên hỏi món
    này quê đâu thì câu thật thà nhất là **của cả một vùng giáp ranh**, không
    phải của riêng tỉnh nào. Trang này xếp vào Tây Nguyên vì Krông Pa là nơi nó
    thành cái tên ai cũng biết.
  - >-
    Thứ đi kèm mới là chỗ lạ. **Kiến vàng** là loài kiến làm tổ trên cây rừng,
    kết lá lại thành tổ treo lơ lửng. Người ta lấy tổ về, làm sạch, rang hoặc
    phơi cho khô rồi **giã chung với ớt và muối hột**. Con kiến vàng vốn có vị
    chua tự nhiên, nên hũ muối làm ra chua nhẹ, cay, mặn — ba vị cùng lúc.
  - >-
    Vì sao hai thứ đó hợp nhau: miếng bò một nắng đậm và hơi ngọt, tự nó thiếu
    một nhịp chua để đỡ ngán. Chanh thì làm ướt miếng thịt, còn **muối kiến vàng
    đưa cái chua vào ở dạng khô** — chấm bao nhiêu ăn bấy nhiêu, miếng thịt vẫn
    ráo. Đó là lý do người ta không đổi nó lấy chén muối ớt chanh thường.

