title: Bò một nắng **xé tay, chấm muối kiến vàng**
summary: >-
  Thịt bò ướp sả ớt rồi **phơi đúng một buổi nắng** — khô mặt ngoài mà trong còn
  ẩm, nên nướng xong xé tay vẫn mềm. Chấm **muối kiến vàng**: thứ muối Tây Nguyên
  giã từ kiến vàng rừng với ớt và muối hột, chua nhẹ trước rồi mới cay.
