quick:
  ingredients:
    - Thịt bò bắp hoặc thăn [[600|g]] — thái miếng to bản, dày cỡ đốt ngón tay
    - "Ướp: sả băm [[2|muỗng canh|frac]] · tỏi băm [[1|muỗng canh|frac]] · ớt bột [[1|muỗng cà phê|frac]]"
    - "Nêm: nước mắm [[1.5|muỗng canh|frac]] · đường [[1|muỗng canh|frac]] · dầu điều [[1|muỗng canh|frac]] · tiêu"
    - Muối kiến vàng [[3|muỗng canh|frac]] — hũ bán sẵn ở hàng đặc sản Gia Lai · Phú Yên
    - "Dọn kèm: dưa leo, chuối chát, rau răm · một chén muối ớt chanh cho ai chưa quen vị kiến"
  steps:
    - Thái bò **to bản, ngang thớ**, dày cỡ đốt ngón tay — mỏng quá là phơi xong hết mềm.
    - Ướp sả tỏi ớt và gia vị, để ngăn mát **1 giờ**.
    - Phơi **một nắng** 5–6 tiếng, trở mặt hai lần. Không nắng thì sấy lò 80 °C trong 2–3 giờ.
    - Nướng than hoa lửa vừa, mỗi mặt 3–4 phút — mặt se lại là được, đừng nướng tới khô.
    - Đập nhẹ cho tơi thớ rồi **xé dọc thớ** bằng tay, chấm muối kiến vàng.
  warning: >-
    Phơi quá tay là thành **khô bò**, dai nhách và mất hẳn cái ngọt. Món này chỉ
    khô mặt ngoài — bấm vào giữa miếng vẫn phải thấy mềm. Hết một nắng là cất,
    đừng tiếc thêm một tiếng.

