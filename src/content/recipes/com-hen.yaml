steps:
  - title: Ngâm hến cho nhả cát
    icon: drop
    minutes: 3 giờ
    intro: "Chậm nhưng không được cắt bớt — cả món hỏng hay không nằm ở đây:"
    bullets:
      - label: "Ngâm:"
        text: >-
          Đổ hến vào thau nước vo gạo, thả vài lát ớt, ngâm **3 giờ**. Thay nước
          2–3 lần; nước nào cũng thấy lắng một lớp cát dưới đáy.
      - label: "Chà rửa:"
        text: >-
          Dùng tay chà mạnh vỏ hến vào nhau dưới vòi nước, rửa lại tới khi nước
          trong. Bỏ con nào **há miệng sẵn mà không ngậm lại** khi chạm vào.
    callout:
      type: warn
      text: >-
        Ngâm cho có lệ là tô cơm **sạn cát**, ăn một miếng là bỏ đũa. Không có
        cách nào cứu ở bước sau, nên thà chờ đủ 3 giờ.
  - title: Luộc hến, giữ bằng được nước luộc
    icon: pot
    minutes: 20 phút
    bullets:
      - label: "Luộc:"
        text: >-
          Cho hến vào nồi với [[2|lít]] nước lạnh, đun tới khi **hến há miệng
          đều** thì tắt bếp ngay — chừng 8–10 phút. Luộc quá là ruột hến teo lại
          và dai.
      - label: "Đãi ruột:"
        text: >-
          Trút hến ra rổ đặt trong thau nước, **đãi và khuấy** cho ruột rơi
          xuống, vỏ nổi lên hớt bỏ. Nhặt lại lần nữa cho hết mảnh vỏ vụn.
      - label: "Gạn nước:"
        text: >-
          Nước luộc để **lắng 20 phút**, rồi nghiêng nồi **gạn nhẹ lấy phần
          trong**, bỏ lớp cặn dưới đáy. Đây là bát nước chan của cả món — đừng
          đổ đi.
    timer:
      secs: 1200
      label: Hẹn giờ để nước hến lắng · 20:00
      doneMsg: Gạn nhẹ tay lấy phần trong nghen — chừa cặn lại!
    callout:
      type: tip
      text: >-
        Mua được **hến đã đãi sẵn** ngoài chợ thì đỡ hẳn hai bước, nhưng nhớ xin
        thêm một bịch **nước luộc hến** — không có nước đó thì không thành cơm hến.
  - title: Xào hến với mắm ruốc
    icon: flame
    minutes: 15 phút
    bullets:
      - text: >-
          Phi thơm [[3|muỗng canh|frac]] sả + hành tím băm với chút dầu.
      - text: >-
          Cho ruột hến vào xào **lửa lớn** cho ráo nước, rồi hạ lửa, thêm
          [[2|muỗng canh|frac]] mắm ruốc đã hòa loãng với chút nước hến.
      - text: >-
          Đảo tới khi hến **săn lại, thấm màu nâu và dậy mùi**, chừng 5 phút.
          Nêm chút đường và tiêu. Trút ra tô để riêng.
    callout:
      type: warn
      text: >-
        Cho mắm ruốc thẳng vào chảo mà chưa hòa loãng thì ruốc **vón cục và
        cháy khét**, cả mẻ hến thành đắng. Hòa với nước hến trước, luôn luôn.
  - title: Đun nồi nước hến
    icon: pot
    minutes: 10 phút
    bullets:
      - text: >-
          Bắc phần nước trong đã gạn lên bếp, thả **gừng lát**, đun sôi rồi hạ
          nhỏ lửa giữ nóng.
      - text: >-
          Nêm **rất nhạt tay** — chút muối, chút nước mắm là đủ. Nước này chan
          vào tô đã có mắm ruốc, có tóp mỡ, nêm đậm là cả tô mặn chát.
    callout:
      type: tip
      text: >-
        Nước hến đục là **đúng**, không phải nấu hỏng. Cái đục sữa nhạt đó chính
        là vị ngọt của con hến — nồi nước trong veo mới là nồi đã bị gạn quá tay.
  - title: Xếp tô — thứ tự có lý của nó
    icon: bowl
    minutes: 10 phút
    intro: "Xếp theo lớp, đừng trộn sẵn:"
    bullets:
      - text: >-
          Đáy tô: **cơm nguội** xới rời. Trên cơm: bắp chuối bào, rau má, bạc
          hà, khế — trải thành lớp rau.
      - text: >-
          Kế đến **hến xào**, rồi rắc tóp mỡ, đậu phộng, mè, bánh tráng bóp vụn.
          Thêm một muỗng ớt chưng lên mặt.
      - text: >-
          Chan **nước hến đang sôi** quanh thành tô, chừng nửa tô. Trộn đều rồi
          ăn ngay — trộn sớm quá thì rau mềm và bánh tráng ỉu.
    doneText: Trộn đều lên — ăn liền nghen!

tipsTitle: 4 điều **đừng làm khác** với cơm hến
tips:
  - icon: rice
    title: Đừng hâm nóng cơm
    text: >-
      Đây là chỗ ai nấu lần đầu cũng muốn "sửa lại cho đúng" — và sửa là hỏng.
      Cơm nóng gặp nước hến sẽ **hút nước và nhão**, tô cơm bết lại thành cháo
      loãng. Cơm nguội thì hạt rời, thấm mà vẫn săn. Nấu cơm hơi khô hơn thường
      ngày một chút là vừa.
  - icon: drop
    title: Nước luộc hến quý hơn con hến
    text: >-
      Nhiều người luộc xong đổ nước đi, chỉ giữ ruột — thế là mất phần hồn. Vị
      ngọt của cơm hến nằm gần hết trong **nồi nước đục** ấy. Gạn lấy phần
      trong, bỏ cặn, và đừng pha thêm nước lã cho nhiều.
  - icon: jar
    title: Mắm ruốc hòa loãng trước khi vào chảo
    text: >-
      Mắm ruốc đặc quánh, thả nguyên vào chảo nóng là **vón cục rồi cháy**, cả
      mẻ hến đắng. Múc ruốc ra chén, hòa với vài muỗng nước hến cho tan đều, rồi
      mới đổ vào — mất mười giây mà cứu cả món.
  - icon: lettuce
    title: Rau bào xong là ngâm chanh ngay
    text: >-
      Bắp chuối bào để ngoài không khí chừng vài phút là **thâm đen**, nhìn hết
      muốn ăn. Bào tới đâu thả ngay vào thau nước pha chanh tới đó, lúc dọn mới
      vớt ra vẩy ráo. Bạc hà thì tước vỏ, bóp muối rồi **xả thật kỹ** cho hết ngứa.

serve:
  title: Ăn cơm hến — **tô cơm và bát nước**
  paras:
    - >-
      Ở Huế, cơm hến thường dọn hai phần: **tô cơm đã xếp đủ thứ** và **bát nước
      hến nóng để riêng**. Ai thích ăn khô thì chan ít, húp nước riêng; ai thích
      ướt thì chan ngập rồi trộn. Dọn ở nhà cứ theo cách đó — người ăn tự liệu
      lấy độ ướt của mình.
    - >-
      Cùng nồi hến ấy còn ra được **bún hến** và **cháo hến**: đổi cơm nguội
      lấy bún tươi, hoặc nấu nước hến với gạo cho nhừ. Ngâm hến một lần, ăn
      được ba kiểu.
  aside:
    title: Trên mâm nên có
    intro: "Ba thứ để bên cạnh, ai thích thì tự thêm:"
    items:
      - icon: chili
        text: "**Hũ ớt chưng** — cơm hến vốn cay, nhưng cay tới đâu để người ăn quyết."
      - icon: lime
        text: "**Khế và chanh** — chua thêm một nấc là tô cơm bừng lên."
      - icon: bowl
        text: "**Bát nước hến nóng** — dọn riêng, húp giữa chừng cho ấm bụng."

faq:
  - q: Không mua được hến thì thay bằng gì?
    a: >-
      **Nghêu hoặc chem chép** thay được, cách làm y hệt — luộc, đãi ruột, giữ
      nước. Vị sẽ đậm và to miếng hơn, không mảnh và thanh như hến, nhưng vẫn ra
      đúng tinh thần món. Nhớ ngâm nhả cát kỹ như với hến.
  - q: Mắm ruốc khác mắm tôm thế nào?
    a: >-
      **Mắm ruốc** ủ từ con ruốc (miền Bắc gọi là con moi) trong nửa năm trở
      lên, đặc sệt, màu nâu ngả tím, mặn mà có hậu ngọt. **Mắm tôm** ủ nhanh
      hơn, loãng hơn, màu tím đậm và mùi mạnh hơn hẳn. Hai thứ không thay nhau
      được — đổi là ra món khác.
  - q: Bạc hà trong công thức có phải lá bạc hà pha trà không?
    a: >-
      Không, đây là chỗ dễ nhầm nhất. **Bạc hà** ở miền Trung – Nam là **dọc
      mùng**: cọng xốp của một loại cây họ môn, tước vỏ rồi xắt xéo, ăn giòn và
      hút nước dùng. Không liên quan gì tới rau bạc hà thơm. Nhớ **bóp muối và
      xả thật kỹ**, làm dối là ngứa cổ.
  - q: Nấu trước được bao lâu?
    a: >-
      Hến xào và nước hến để ngăn mát được **2 ngày**. Rau bào thì làm trong
      ngày, để qua đêm là mềm oặt và thâm. Sáng ra chỉ việc hâm nóng nước hến,
      bào rau mới, xới cơm nguội ra là xong tô.

ticker:
