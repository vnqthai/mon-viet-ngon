title: Cơm hến **cơm để nguội, nước hến chan nóng**
summary: >-
  Món Huế lạ ở chỗ **cơm không hâm lại** — cơm nguội trộn hến xào **mắm ruốc**,
  tóp mỡ, đậu phộng và cả rổ rau bào, rồi chan bát **nước luộc hến** đục ngọt
  còn bốc khói.
region: Miền Trung
category: Cơm
occasions: [Bữa sáng, Ăn chơi]
pubDate: 2026-07-29
time:
  total: 1 giờ 30 phút
servingsBase: 4
difficulty: Vừa
featured: false
order: 21
art: com-hen
heroEyebrow: Sáng ở xứ Huế…

quick:
  ingredients:
    - Hến tươi [[2|kg]] — **ngâm trước 3 giờ** cho nhả hết cát
    - Cơm trắng [[4|chén]] — nấu từ hôm trước, **để nguội hẳn**
    - Mắm ruốc [[2|muỗng canh|frac]] — mắm đặc làm từ con ruốc, đặc sản xứ Huế
    - Tóp mỡ [[100|g]] · đậu phộng rang [[100|g]] · mè rang [[2|muỗng canh|frac]]
    - Bắp chuối bào, rau má, bạc hà (dọc mùng) xắt sợi, khế chua [[400|g]]
    - "Nêm: hành tím, sả băm, ớt bột chưng dầu, gừng lát"
  steps:
    - Ngâm hến với nước vo gạo + vài lát ớt **3 giờ**, chà rửa nhiều lần cho sạch cát.
    - Luộc hến tới khi **há miệng đều**, đãi lấy ruột — giữ lại toàn bộ nước luộc.
    - Để nước luộc **lắng 20 phút**, gạn nhẹ lấy phần trong, bỏ cặn dưới đáy.
    - Phi hành sả, xào ruột hến với mắm ruốc cho **săn và thấm**, để riêng.
    - Đun nước hến với gừng lát, nêm nhạt tay — nước này để chan, không phải để nêm đậm.
    - Xới cơm nguội ra tô, xếp hến, rau, tóp mỡ, đậu phộng, chan nước hến nóng.
  warning: >-
    Hến không ngâm đủ giờ là **cả tô sạn cát**, hỏng không cứu được. Ngâm 3 giờ,
    thay nước 2–3 lần, và chà kỹ vỏ trước khi luộc.

