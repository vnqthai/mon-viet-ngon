flavorNote: >-
  **Chuẩn tô:** cơm mát, hến mặn thơm, rau giòn, tóp mỡ béo — húp một ngụm nước
  hến nóng là mọi thứ ráp lại. Cay phải **cay thật**, đó là tô cơm cay nhất mâm Huế.
storyEyebrow: Chuyện món ăn
storyTitle: Món sang trọng làm từ **những thứ rẻ nhất**
story:
  - >-
    Cơm hến bắt đầu từ chỗ khiêm nhường: con hến bé xíu bắt ở bãi bồi trên sông,
    tô cơm nguội còn lại từ bữa trước, ít rau vườn, ít tóp mỡ. Không thứ nào
    đắt tiền. Vậy mà xếp chung vào một tô thì thành món ăn được nhắc tới mỗi khi
    người ta kể về bếp Huế — vùng **Cồn Hến** giữa sông còn lấy luôn con hến
    làm tên.
  - >-
    Chỗ khiến người lần đầu ngạc nhiên: **cơm không hâm nóng**. Cơm nguội, để
    nguyên nhiệt độ phòng, xới ra tô rồi mới chan nước hến đang sôi. Đó không
    phải sự cẩu thả mà là cách giữ cho **hạt cơm rời và săn**; cơm nóng mềm sẽ
    hút nước, nhão ra, và tô cơm hến mất hết cái lạo xạo vốn có của nó.
  - >-
    Tô cơm hến đúng bài có tới hơn chục thứ, mỗi thứ một việc: **mắm ruốc** đưa vị
    mặn nền, **tóp mỡ** cho béo, **đậu phộng và mè** cho bùi, **bắp chuối, rau
    má, bạc hà** cho giòn mát, **khế** cho chua, **ớt** cho cay. Không thứ nào
    đủ sức đứng một mình — nhưng bỏ bớt vài thứ là thấy hụt liền.
  - >-
    Và cay. Cơm hến nổi tiếng là món **cay nhất** trong mâm cơm Huế; hàng quán ở
    Huế dọn ra là mặc định cay xé. Nấu ở nhà thì cứ nêm cay vừa sức mình, để hũ
    ớt chưng bên cạnh cho ai muốn thêm.

