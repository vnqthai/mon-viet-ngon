flavorNote: >-
  **Chuẩn vị:** sợi mì **săn và ráo, có vài chỗ xém vàng**, không ướt nhẫy
  cũng không khô cứng; miếng bò cắn vào còn mềm và ứa nước; cải thìa vẫn
  xanh, cọng còn nghe giòn.
storyEyebrow: Chuyện đĩa mì xào
storyTitle: Đĩa mì của những **tối không muốn nấu**
story:
  - >-
    Mì xào bò không có quê. Nó là món **cả nước cùng nấu**, mỗi nhà một
    kiểu, ra đời từ chỗ giao nhau giữa chảo xào của bếp Hoa và cái tủ lạnh
    của nhà mình: một vắt mì, miếng thịt bò còn lại từ hôm trước, nắm rau
    nào cũng được. Đúng ba mươi phút, đủ no, không phải nấu cơm.
  - >-
    Dễ nấu không có nghĩa là dễ ngon. Đĩa mì xào hỏng thường hỏng theo hai
    kiểu quen thuộc: **mì bết thành khối** vì trụng quá tay và không xả
    nguội, hoặc **bò dai nhách** vì bị quăng chung vào chảo với mì rồi xào
    tới lúc mì chín. Cả hai lỗi đều đến từ cùng một thói quen — muốn gọn
    nên dồn hết vào một chảo một lượt.
  - >-
    Bí quyết thì lại rất đơn giản và mượn thẳng từ bếp Hoa: **bột bắp** áo
    quanh miếng bò để giữ nước ngọt bên trong, **lửa lớn và tay nhanh** để
    thịt vừa tái là ra khỏi chảo, rồi **để yên cho mì xém cạnh** thay vì
    đảo liên tục. Ba mẹo đó biến một đĩa mì qua loa thành đĩa mì đáng ngồi
    xuống ăn tử tế.

