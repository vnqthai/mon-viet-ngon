quick:
  ingredients:
    - Thịt bò thăn hoặc bắp hoa [[400|g]] — thái lát mỏng **ngang thớ**
    - Mì trứng tươi [[500|g]] (hoặc [[250|g]] mì khô)
    - Cải thìa [[300|g]] · hành tây [[1|củ]] · cà rốt [[1|củ]]
    - >-
      Ướp bò: dầu hào [[1|thìa canh|frac]] · xì dầu [[1|thìa canh|frac]] ·
      bột bắp [[1|thìa cà phê|frac]] · tỏi băm · tiêu · dầu ăn [[1|thìa canh|frac]]
    - "Nước xào: dầu hào [[1|thìa canh|frac]] · xì dầu [[1|thìa canh|frac]] · đường [[1|thìa cà phê|frac]] · nước [[60|ml]]"
    - Tỏi [[4|tép]] · hành lá · rau mùi · tiêu xay
  steps:
    - Bò thái **ngang thớ**, ướp dầu hào + xì dầu + **bột bắp** + dầu ăn, để 15 phút.
    - Mì trụng nước sôi **1–2 phút**, xả nước lạnh, để thật ráo, xóc chút dầu cho khỏi dính.
    - Chảo nóng già, **xào bò lửa lớn 1 phút**, thịt vừa tái là trút ra bát ngay.
    - Xào cà rốt, hành tây, cải thìa — cọng trước lá sau, giữ cải còn xanh.
    - Trút mì vào, rưới nước xào pha sẵn, **để yên 30 giây cho xém cạnh** rồi mới đảo.
    - Trả bò và rau vào, đảo nhanh, tắt bếp, rắc hành lá + rau mùi + tiêu.
  warning: >-
    Xào bò chung với mì từ đầu là **thịt dai như cao su**: bò chỉ chịu được
    đúng một phút trên lửa lớn, mà mì thì cần bốn năm phút. Xào riêng rồi
    trả vào cuối, không có cách nào khác.

