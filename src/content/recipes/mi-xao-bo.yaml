title: Mì xào bò **sợi vàng săn cháy cạnh, thịt mềm mọng**
summary: >-
  Đĩa mì trứng xào **săn sợi, xém vàng vài chỗ**, thịt bò mềm mọng còn ứa
  nước ngọt, cải thìa xanh giòn cắt ngang cái đậm đà. Nửa tiếng từ lúc mở
  tủ lạnh tới lúc bưng ra bàn — món cứu đói tối muộn quen mặt nhất.
