flavorNote: >-
  **Chuẩn bánh:** bẻ đôi nghe **rắc**, rìa vàng sậm và giòn tan, giữa còn mềm
  ẩm; chan nước lèo lên thì sánh bám vào mặt bánh chứ không chảy tuột.
storyEyebrow: Chuyện món ăn
storyTitle: Có thể **cái tên đến từ làn khói**
story:
  - >-
    Người Huế kể rằng ngày trước bánh này đổ trên bếp củi, mà Huế thì mưa dầm,
    củi ẩm — đổ bánh là **khói mù cả gian bếp, xè cay mắt**. Vậy nên gọi là
    "bánh khói"; giọng Huế đọc chữ *khói* nghe gần như *khoái*, lâu dần thành
    **bánh khoái**. Cũng có người bảo đơn giản là bánh ăn khoái miệng nên gọi
    vậy. Cả hai đều là giai thoại, chưa ai chốt được.
  - >-
    Điều chắc chắn hơn là **bánh khoái không phải bánh xèo**, dù nhìn thoáng qua
    hao hao. Bánh xèo miền Tây đổ chảo lớn, mỏng tang, rộng cả gang tay, cuốn với
    bánh tráng. Bánh khoái đổ trong **khuôn gang nhỏ**, dày gấp đôi, nhiều dầu
    hơn nên **giòn rụm tới giữa bánh**, và trong bột có **trứng** nên mặt bánh
    vàng đậm và chắc tay.
  - >-
    Nhưng chỗ khác nhau lớn nhất nằm ở chén chấm. Bánh xèo chấm **nước mắm chua
    ngọt** loãng, trong. Bánh khoái chấm **nước lèo** — mà "nước lèo" ở đây
    không phải nước dùng như thường hiểu, mà là **một thứ sốt sánh đặc** nấu từ
    gan heo băm, thịt nạc xay, tương đậu nành, mè rang và đậu phộng giã. Màu nâu
    đục, sánh như cháo đặc, mặn bùi và thơm ngậy.
  - >-
    Người Huế nói không có nước lèo thì bánh khoái không còn là bánh khoái nữa —
    và quả thật, mất chén nước lèo thì nó chỉ còn là một cái bánh chiên giòn.
    Nên nếu chỉ làm được một nửa công thức này, hãy làm nửa nước lèo.

