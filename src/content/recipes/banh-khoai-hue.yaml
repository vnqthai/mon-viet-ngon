title: Bánh khoái Huế **nhỏ, dày, giòn — chấm nước lèo**
summary: >-
  Không phải bánh xèo thu nhỏ: bánh khoái đổ khuôn gang nhỏ, **dày và giòn rụm**,
  có trứng, và chấm bằng **nước lèo** — thứ sốt sánh đặc từ gan heo, mè và đậu phộng.
region: Miền Trung
category: Chiên
occasions: [Ăn chơi, Đãi khách]
pubDate: 2026-07-29
time:
  total: 1 giờ 15 phút
servingsBase: 4
difficulty: Vừa
featured: false
order: 25
art: banh-khoai
heroEyebrow: Nghe tên đã thấy khoái…

quick:
  ingredients:
    - Bột gạo [[250|g]] · trứng gà [[2|quả]] · bột nghệ [[0.5|muỗng cà phê|frac]]
    - Tôm đất [[200|g]] · thịt nạc dăm [[200|g]] · giá [[200|g]]
    - "Nước lèo: gan heo [[100|g]] · thịt nạc xay [[100|g]] · tương đậu nành [[3|muỗng canh|frac]]"
    - Mè rang [[3|muỗng canh|frac]] · đậu phộng rang giã [[4|muỗng canh|frac]]
    - Rau kèm — xà lách, trái vả, chuối chát, khế, rau thơm [[400|g]]
  steps:
    - Pha bột gạo + trứng + nghệ + nước, để **nghỉ 30 phút** cho bột nở.
    - "Làm nước lèo: xào gan + thịt xay, cho tương, thêm mè và đậu phộng, khuấy tới sánh."
    - Khuôn gang thật nóng, tráng dầu, đổ bột **dày hơn bánh xèo**, xếp tôm thịt lên.
    - Rắc giá, đậy nắp **2 phút**, mở ra chiên tiếp cho **rìa vàng giòn**, gấp đôi.
    - Cắt bánh làm đôi, kẹp rau, chan hoặc chấm ngập nước lèo.
  warning: >-
    Khuôn chưa đủ nóng mà đổ bột là bánh **dính đáy và mềm oặt**. Nhỏ một giọt
    bột xuống, nghe **xèo** và se lại ngay thì mới đổ mẻ đầu.

