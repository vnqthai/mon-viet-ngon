title: Canh sườn bí đao **nước trong veo, ngọt mà nhẹ**
summary: >-
  Nước canh trong tới mức nhìn thấy đáy tô, ngọt sâu từ sườn ninh; miếng bí
  đao **mềm mướt, trong như ngọc** mà vẫn giữ nguyên dáng. Tô canh mát miệng
  nhất mâm cơm ngày oi — nấu nhanh, nêm nhạt, ăn hoài không ngán.
region: Cả nước
category: Canh
occasions: [Cơm nhà]
pubDate: 2026-07-30
time:
  total: 45 phút
  active: 12 phút
servingsBase: 4
difficulty: Dễ
featured: false
order: 65
art: canh-suon-bi-dao
heroEyebrow: Ngày oi bức, mâm cơm cần một tô nhẹ…

quick:
  ingredients:
    - Sườn non [[500|g]] — chặt khúc 4 cm, chần sơ cho nước trong
    - Bí đao [[600|g]] — gọt vỏ, bỏ ruột nếu trái già, cắt miếng dày 1,5 cm
    - Tôm khô [[20|g]] (tùy chọn) — ngâm mềm, cho nước ngọt đậm thêm một tầng
    - Hành tím [[2|củ]] · hành lá + ngò rí [[1|nắm]]
    - "Nêm: nước mắm [[1.5|muỗng canh|frac]] · hạt nêm, muối, tiêu · nước [[1.8|lít]]"
  steps:
    - Sườn chần sơ với gừng – hành đập, rửa lại cho sạch bọt.
    - Ninh sườn với [[1.8|lít]] nước **30 phút** lửa liu riu, hớt bọt kỹ. Có tôm khô thì thả cùng.
    - Bí đao gọt vỏ, cắt miếng **dày 1,5 cm** — mỏng quá là tan mất.
    - Thả bí vào, nấu **7–10 phút** tới khi miếng bí **chuyển trong** là được.
    - Nêm nhạt tay, tắt bếp, rắc hành lá + ngò + tiêu.
  warning: >-
    Bí đao chín **nhanh hơn tưởng tượng rất nhiều** — quá 12 phút là nhũn
    rồi rã ra thành nước đục. Thấy miếng bí vừa chuyển từ trắng đục sang
    **trong** là tắt bếp ngay.

