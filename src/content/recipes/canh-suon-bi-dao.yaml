flavorNote: >-
  **Chuẩn tô canh bí đao:** nước **trong tới mức nhìn rõ khúc sườn dưới
  đáy**, vị ngọt đến từ xương chứ không từ bột nêm — nêm phải nhạt hơn mọi
  món canh khác. Miếng bí **trong veo, mềm mướt mà còn nguyên khối**.
storyEyebrow: Chuyện tô canh ngày oi
storyTitle: Tô canh **nêm nhạt nhất mâm**, và đó là chủ ý

story:
  - >-
    Trong nhà bí đao là thứ rau củ hiền nhất: không mùi mạnh, không màu nổi,
    vị nhạt gần như trung tính. Chính vì vậy mà nó **để cho nước xương lên
    tiếng**. Nấu canh bí đao với sườn là kiểu nấu ăn tối giản — hai nguyên
    liệu, không gia vị màu mè, cả tô chỉ có một việc phải làm cho đúng là
    **giữ nước cho trong và nêm cho nhạt**.
  - >-
    Nói "nêm nhạt" nghe dễ mà nhiều người không quen tay. Ta hay có phản xạ
    nêm cho tô canh "đậm đà" như món mặn — làm vậy với bí đao là **giết
    chết món**: vị mặn phủ lên hết, còn miếng bí thì chẳng còn gì để nói.
    Nêm đúng là nhạt hơn khẩu vị thường một bậc, đủ để tôn cái ngọt của
    xương, rồi thôi.
  - >-
    Miếng bí nấu đạt có một dấu hiệu rất dễ nhìn: nó **chuyển từ trắng đục
    sang trong**, gần như trong suốt, mà cạnh miếng vẫn sắc nét. Đó là
    khoảnh khắc phải tắt bếp. Chậm thêm ba phút thôi là cạnh miếng bắt đầu
    tròn đi, rồi nhũn, rồi rã — và nước canh đang trong veo bỗng đục lờ.

