title: Bánh đúc nóng **bột gạo quánh mịn, chan nước mắm ấm**
summary: >-
  Bột gạo pha bột năng, khuấy trên bếp cho tới lúc quánh lại và trong ra. Múc
  vào bát khi còn bốc hơi, đắp thìa thịt băm xào mộc nhĩ lên giữa, rắc hành phi
  rồi chan nước mắm chua ngọt còn ấm — húp bằng thìa, cả bát ăn hết trong dăm
  phút.
region: Miền Bắc
category: Bánh
occasions: [Ăn chơi, Bữa sáng]
pubDate: 2026-08-01
time:
