heroEyebrow: Chiều mưa Hà Nội, hàng vỉa hè khói bay…

quick:
  ingredients:
    - Bột gạo [[150|g]] · bột năng [[100|g]] — pha với [[1|lít]] nước, ngâm **2 giờ**
    - Thịt nạc vai băm [[200|g]] · mộc nhĩ (nấm mèo) [[15|g]] · nấm hương [[10|g]]
    - Hành tím [[5|củ]] · hành lá, rau mùi · hành phi [[3|muỗng canh]]
    - "Nước chan: nước mắm [[3|muỗng canh]] · đường [[3|muỗng canh]] · giấm [[2|muỗng canh]] · nước [[400|ml]]"
    - Dầu ăn [[3|muỗng canh]] · muối, tiêu
  steps:
    - Pha bột với nước và chút muối, để **2 giờ** rồi gạn bỏ lớp nước trong ở trên.
    - >-
      Ngâm nở mộc nhĩ nấm hương, băm nhỏ; xào với thịt băm và hành tím cho tơi
      và đậm.
    - Pha nước chan chua ngọt, đun ấm, thả chút đồ chua nếu thích.
    - >-
      Khuấy bột trên lửa nhỏ, **đảo liên tục một chiều** 20–25 phút tới khi
      quánh và trong.
    - Múc bột nóng ra bát, đắp nhân lên giữa, rắc hành phi rau mùi, chan nước mắm.
  warning: >-
    Ngừng đảo một phút là đáy nồi khét và bột vón thành cục — mà đã vón thì
    khuấy cách mấy cũng không tan lại. Từ lúc bắc lên bếp là **tay không rời
    đũa**, và luôn đảo theo một chiều.

flavor:
  chua: 4
  ngot: 4
  man: 5
