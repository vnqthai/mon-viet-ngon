title: Mì Quảng tôm thịt **sợi vàng óng, nước nhưn đậm đà**
summary: >-
  Sợi mì vàng nghệ nằm dưới lớp tôm thịt um đỏ au, nước lèo chỉ chan **xâm
  xấp mà đậm điếng người**, bẻ miếng bánh tráng mè rắc đậu phộng lên — trộn
  đều một cái là hiểu tính hào sảng của người xứ Quảng.
region: Miền Trung
category: Món sợi
occasions: [Đãi khách]
time:
  total: 1 giờ 30
servingsBase: 4
difficulty: Vừa
featured: true
order: 4
art: mi-quang
heroEyebrow: Ai về xứ Quảng cùng tui…

quick:
  ingredients:
    - Mì Quảng tươi [[1000|g]] (hoặc mì Quảng khô [[400|g]]) · xương ống heo [[500|g]]
    - Tôm đất [[300|g]] để vỏ · ba chỉ [[400|g]] thái miếng mỏng · trứng cút [[12|trái]]
    - "Ướp: củ nén [[1|nắm]] (không có thì hành tím [[4|củ]]) · bột nghệ [[1|muỗng cà phê]] · dầu điều [[2|muỗng canh|frac]] · nước mắm [[2|muỗng canh|frac]] · tiêu"
    - Đậu phộng rang [[100|g]] · bánh tráng mè [[4|cái]] nướng giòn
    - "Rau sống: bắp chuối bào · cải con · húng lủi · giá"
    - "Nêm: nước mắm · muối · đường — nước nhân phải **đậm hơn nước phở** một bậc"
  steps:
    - Hầm xương ống với [[1.5|lít|frac]] nước lấy chừng [[1.2|lít]] nước ngọt (45 phút, hớt bọt).
    - Tôm cắt râu **để vỏ**, ba chỉ thái mỏng — ướp chung nén đập + nghệ + dầu điều + mắm tiêu **20 phút**; luộc trứng cút bóc vỏ.
    - Phi nén thơm với dầu điều, cho ba chỉ xào săn, tôm vô đảo tới **cong đỏ**, thả trứng cút, rim nhỏ lửa 10 phút.
    - Châm nước xương **vừa ngập nhân**, nêm mắm – muối – đường thiệt đậm, sôi liu riu 15 phút.
    - Nướng bánh tráng mè, giã dối đậu phộng, soạn rau sống.
    - "Ráp tô: mì trụng nhanh, xếp tôm thịt trứng, chan nước **xâm xấp ⅓ sợi mì**, rắc đậu phộng hành ngò, cắm miếng bánh tráng — trộn và ăn liền."
  warning: >-
    Mì Quảng mà chan ngập nước là thành... bún! Nước lèo chỉ **xâm xấp ⅓
    tô**, bù lại phải nêm **đậm gấp rưỡi nước phở** — nhín nước chứ không
    nhín vị.

flavor:
  chua: 0.5
  ngot: 5.5
  man: 7
  cay: 3
  thom: 8.5
flavorNote: >-
  **Chuẩn vị Quảng:** sợi mì dai mềm quyện nước nhân **đậm – béo – thơm
  nghệ**, cắn trúng tôm um ngọt lừ, và lúc nào cũng phải nghe **rôm rốp**
  của bánh tráng mè với đậu phộng mới đúng điệu.
storyEyebrow: Chuyện tô mì
storyTitle: Tô mì **hào sảng như người xứ Quảng**
story:
  - >-
    Ở Quảng Nam – Đà Nẵng, mì Quảng không hẳn là "món ăn" — nó là **chuyện
    nhà**: đám giỗ, cưới hỏi, khách quý ghé chơi, kiểu gì cũng thấy nồi
    nhân mì um đỏ au đặt giữa bếp. Người ta còn truyền câu ca **"Thương
    nhau múc bát chè xanh, làm tô mì Quảng mời anh xơi cùng"** — quý nhau
    tới cỡ nào mới đem mì Quảng ra mời.
  - >-
    Cái độc nhất của mì Quảng là **nước nhưn** — người Quảng gọi nhân là
    "nhưn", nên thứ nước um sóng sánh từ nồi nhân cũng mang tên đó: chan
    chỉ xâm xấp đáy tô, nhưng đậm và béo tới mức thấm hết vào từng sợi mì
    vàng ươm màu nghệ. Nhân thì "bao dung" vô cùng — tôm thịt là bản kinh điển, chứ gà,
    cá lóc, ếch, thậm chí sứa đều thành mì Quảng được hết. Bởi vậy dân
    Quảng hay cười: **mì Quảng không có chuẩn, chuẩn là... nhà mình nấu**.
  - >-
    Bản tôm thịt này giữ đúng bộ tứ làm nên mùi xứ Quảng: **củ nén, nghệ,
    dầu điều và đậu phộng** — thêm miếng bánh tráng mè nướng bẻ cái rốp
    trước khi trộn. Nấu một lần cho đúng bài, lần sau bạn sẽ tự tin "chế"
    kiểu nhà mình — và thế là món này thành của bạn, đúng tinh thần Quảng.

