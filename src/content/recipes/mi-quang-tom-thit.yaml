stepsEyebrow: Vô bếp thôi!
stepsTitle: 6 bước ra **tô mì vàng óng đúng chất Quảng**
stepsLead: >-
  Mì Quảng làm một mạch rất nhàn: nồi xương tự sôi, mình ướp và um nhân —
  khâu quyết định là **um cho thấm** và **nêm cho đậm**, còn lại dễ ợt.
steps:
  - title: Hầm nước xương nền
    icon: pot
    minutes: 45 phút
    bullets:
      - text: >-
          Xương ống chần nước sôi **2 phút**, xả sạch, cho vô nồi với
          [[1.5|lít|frac]] nước + [[1|muỗng cà phê]] muối.
      - text: >-
          Đun sôi, hớt bọt, hạ **liu riu 45 phút** — lấy chừng
          [[1.2|lít]] nước ngọt trong. Nồi này sôi trong lúc mình làm
          hết các bước dưới, khỏi đứng canh.
    callout:
      type: tip
      text: >-
        Kẹt giờ thì thay bằng nước dùng gà hộp pha loãng — nhưng có 45 phút
        thì cứ hầm: nước xương thật là cái nền làm **nước nhưn ngọt sâu**,
        khác hẳn nêm bột ngọt.
    timer:
      secs: 2700
      label: Hẹn giờ hầm xương · 45:00
      doneMsg: Nước xương ngọt rồi — chuẩn bị châm vô nhân!
  - title: Sơ chế & ướp tôm thịt
    icon: knife
    minutes: 25 phút
    bullets:
      - label: "Tôm:"
        text: >-
          cắt râu, rút chỉ lưng, **giữ nguyên vỏ và đầu** — gạch tôm um lên
          màu đỏ óng, vỏ tiết ngọt không gì thay được.
      - label: "Ba chỉ:"
        text: thái miếng mỏng cỡ nửa bao diêm, để ráo.
      - label: "Ướp chung:"
        text: >-
          củ nén đập giập, trộn tôm + thịt với [[1|muỗng cà phê]] bột nghệ,
          [[1|muỗng canh|frac]] dầu điều, [[2|muỗng canh|frac]] nước mắm,
          ½ muỗng cà phê tiêu — ướp **20 phút**.
      - label: "Trứng cút:"
        text: luộc **5 phút** từ nước sôi, ngâm nước lạnh, bóc vỏ để sẵn.
    callout:
      type: tip
      text: >-
        Củ nén đập giập chứ đừng băm nhuyễn — nén thả mùi vào dầu khi phi,
        còn nguyên tép nhỏ cắn trúng thơm bùng miệng mới thú.
    timer:
      secs: 1200
      label: Hẹn giờ ướp · 20:00
      doneMsg: Tôm thịt thấm nghệ vàng ươm — um thôi!
  - title: Um nhân — linh hồn của tô mì
    icon: flame
    minutes: 15 phút
    bullets:
      - text: >-
          Nồi rộng đáy, [[3|muỗng canh|frac]] dầu phộng, lửa vừa, phi **củ
          nén** (và [[1|muỗng canh|frac]] dầu điều còn lại) tới thơm nức.
      - text: >-
          Cho ba chỉ vô xào **3–4 phút** cho săn và ra mỡ; trút tôm vô đảo
          tới khi **cong mình đỏ au**.
      - text: >-
          Thả trứng cút, hạ lửa nhỏ, đậy nắp **um 10 phút** — thỉnh thoảng
          xóc nồi cho nhân thấm đều, ra nước um sóng sánh.
    callout:
      type: warn
      text: >-
        "Um" là rim nhỏ lửa cho tự ra nước — **đừng châm nước ở bước này**.
        Châm sớm là tôm thịt luộc lơ lớ, mất lớp vị um đậm bám ngoài mặt.
    timer:
      secs: 600
      label: Hẹn giờ um nhân · 10:00
      doneMsg: Nhân thấm đỏ au rồi — châm nước xương!
  - title: Châm nước, nêm cho tới
    icon: spoon
    minutes: 15 phút
    bullets:
      - text: >-
          Châm nước xương vô nồi nhân **vừa ngập mặt** (chừng
          [[1.2|lít]]), đun sôi trở lại, hớt bọt.
      - text: >-
          Nêm: [[1.5|muỗng canh|frac]] nước mắm + [[1|muỗng cà phê]] đường +
          muối từng chút, sôi **liu riu 15 phút** cho tôm thịt nhả ngọt.
      - text: >-
          Nếm thử và nhớ luật: nước nhân phải **đậm tới mức húp một muỗng
          thấy "hơi quá"** — vì lát nữa chỉ chan xâm xấp, sợi mì lạt sẽ kéo
          vị về đúng chỗ.
    callout:
      type: warn
      text: >-
        Nêm "vừa miệng như nước canh" là tô mì ra **lạt nhách** — lỗi số một
        của người lần đầu nấu mì Quảng. Cứ mạnh dạn đậm lên một bậc.
  - title: Soạn đồ ăn kèm — dàn bao rôm rả
    icon: basket
    minutes: 15 phút
    bullets:
      - label: "Bánh tráng:"
        text: >-
          nướng bánh tráng mè trên lửa nhỏ (hoặc nồi chiên không dầu 160°C
          chừng 3 phút) tới **phồng giòn, mè vàng thơm**.
      - label: "Đậu phộng:"
        text: rang vàng vỏ hơi nứt, để nguội, **giã dối** — còn hột còn mảnh mới vui miệng.
      - label: "Rau:"
        text: >-
          bắp chuối bào ngâm nước pha chanh cho trắng giòn; cải con, húng
          lủi, giá rửa sạch để ráo; hành ngò xắt nhỏ.
    callout:
      type: tip
      text: >-
        Món này "dàn bao" quan trọng ngang nhân chính — thiếu bánh tráng
        với đậu phộng là tô mì **mất tiếng rôm rốp**, ăn hụt hẫng lắm.
  - title: Ráp tô — chan nhín tay thôi!
    icon: bowl
    minutes: 5 phút
    bullets:
      - text: >-
          Mì tươi trụng nước sôi **10 giây** cho nóng (mì khô luộc theo bao
          bì, xả, xóc chút dầu phộng), cho vô tô lót ít rau sống dưới đáy
          nếu thích đúng kiểu Quảng.
      - text: Xếp tôm, thịt, trứng cút lên mặt, múc nước nhân chan **xâm xấp ⅓ sợi mì**.
      - text: >-
          Rắc đậu phộng + hành ngò, **cắm miếng bánh tráng mè** bên thành
          tô, dọn kèm rổ rau và trái ớt xanh.
      - text: Ăn đúng bài — bẻ vụn bánh tráng vô tô, **trộn đều từ dưới lên** rồi lùa ngay khi còn nóng.
    callout:
      type: tip
      text: >-
        Người Quảng ăn mì kèm **trái ớt xanh cắn nguyên trái** — cay giòn
        thơm chứ không xé lưỡi như ớt đỏ. Thử một lần cho biết đã đời.
    doneText: Trộn đều, lùa liền — xong!

tipsTitle: 7 bí quyết cho **tô mì Quảng đúng điệu**
tipsLead: >-
  Mì Quảng dễ nấu mà khó "ra chất Quảng" — khác nhau nằm hết ở mấy điều
  này, đọc trước khi vô bếp nghen.
tips:
  - icon: drop
    title: Nước nhưn — chan nhín, nêm đậm
    text: >-
      "Nhưn" là tiếng Quảng của "nhân" — nước um từ nồi nhân nên gọi là
      **nước nhưn**. Luật của nó: **chan ít, nêm đậm** — xâm xấp ⅓ tô để
      sợi mì thấm chứ không bơi, vị đậm gấp rưỡi nước phở để mỗi đũa mì
      đều "dính" vị. Đây là ranh giới giữa mì Quảng và một tô bún thường.
  - icon: garlic
    title: Củ nén — mùi không thay được
    text: >-
      Nén (hành tăm) thơm nồng ấm rất riêng, phi lên là bếp "bay mùi miền
      Trung" liền. Chợ đặc sản, sạp rau Quảng – Huế hay siêu thị online đều
      có. Kẹt lắm mới thay hành tím — tô mì vẫn ngon nhưng dân Quảng nếm là
      biết "thiếu nén" ngay.
  - icon: shrimp
    title: Tôm để vỏ mới ra màu ra ngọt
    text: >-
      Vỏ và đầu tôm khi um tiết **gạch đỏ óng** xuống nước nhân — bóc vỏ
      trước là nước nhợt, tôm khô. Sợ khó ăn thì để vỏ khi um, lúc dọn bóc
      vài con bày mặt tô cho đẹp là vẹn cả đôi đường.
  - icon: ginger
    title: Nghệ + điều, màu thật của xứ Quảng
    text: >-
      Màu vàng cam của tô mì là **nghệ và dầu điều cộng lại** — nghệ cho
      vàng trầm, điều cho cam óng. Đừng thay bằng bột màu công nghiệp; và
      cũng đừng quá tay nghệ kẻo nước nhân đắng nhẹ.
  - icon: roll
    title: Bánh tráng mè, nướng sát giờ ăn
    text: >-
      Bánh tráng nướng để lâu là **ỉu mềm oặt** — nướng ngay trước khi ráp
      tô, hoặc nướng sẵn thì cất hộp kín. Phải là loại **có mè**: vừa giòn
      vừa thơm, bẻ vô tô nghe rốp một cái là "đúng đài" rồi.
  - icon: pod
    title: Đậu phộng giã dối, rắc hào phóng
    text: >-
      Giã dối — nửa nát nửa nguyên hột — để vừa có bụi bùi quyện nước, vừa
      có hột giòn cắn vui răng. Mì Quảng mà rắc đậu phộng dè sẻn là người
      Quảng... buồn lắm đó.
  - icon: clock
    title: Ăn liền, đừng để tô chờ
    text: >-
      Sợi mì gặp nước nóng là bắt đầu nở — để 15 phút là **bở, đục nước**.
      Nhà đông người cứ dọn kiểu Quảng: nồi nhân giữa bàn, ai ăn ráp tô
      nấy, tới đâu nóng giòn tới đó.

serve:
  title: Dọn mâm — **nồi nhân giữa bàn, ai ăn nấy ráp**
  paras:
    - >-
      Mì Quảng ăn kiểu "tự phục vụ" là vui nhất: nồi nhân đỏ au đặt giữa,
      mâm bày mì, rau, đậu phộng, chồng bánh tráng — mỗi người ráp tô theo
      "trường phái" của mình, đứa nhiều tôm, đứa ngập đậu phộng, **rôm rả
      như đám giỗ ngoài quê**.
    - >-
      Nhớ trộn đều trước khi ăn cho nước nhân áo lấy từng sợi mì, gắp kèm
      nhúm **cải con húng lủi**, thỉnh thoảng cắn miếng ớt xanh — đậm, béo,
      the, giòn đủ cả trong một đũa.
    - >-
      Nước nhân dư đừng đổ: mai trụng thêm vắt mì, chan lại vẫn ngon — hoặc
      chan cơm nóng ăn sáng kiểu "mì Quảng hóa cơm hến" cũng hao cơm lắm à.
  aside:
    title: Trên mâm mì Quảng
    intro: "Thiếu thứ nào tô mì kém vui thứ đó:"
    items:
      - icon: roll
        text: "**Bánh tráng mè nướng** — bẻ vô tô trước khi trộn, giòn rụm."
      - icon: pod
        text: "**Chén đậu phộng rang** — rắc thoải mái, đừng tiếc."
      - icon: lettuce
        text: "**Rổ rau có cải con + bắp chuối** — tươi giòn, the nhẹ đúng vị Quảng."
      - icon: chili
        text: "**Ớt xanh nguyên trái** — cắn kèm, cay thơm kiểu miền Trung."

faq:
  - q: Mì Quảng khác bún, phở chỗ nào mà nước ít vậy?
    a: >-
      Khác ở **triết lý**: bún phở là món nước — sợi bơi trong nước lèo;
      mì Quảng là **món trộn có nước** — nước nhưn chan nhín tay, chỉ để
      thấm và dẫn vị,
      còn cái ngon nằm ở sợi mì, nhân um và đồ giòn rắc mặt. Bởi vậy ăn mì
      Quảng phải trộn, không ai "húp" mì Quảng bao giờ.
  - q: Ngoài miền Trung, kiếm sợi mì Quảng ở đâu?
    a: >-
      Ba đường: sạp **đặc sản miền Trung** ở chợ lớn thường có lá mì tươi
      buổi sáng; siêu thị và sàn online bán **mì Quảng khô** (dùng tốt, trụng
      theo bao bì rồi xóc dầu phộng); kẹt nữa thì **bánh phở tươi loại to
      bản** thay tạm — kém dai hơn nhưng vẫn ra dáng tô mì.
  - q: Không tìm được củ nén thì sao?
    a: >-
      Thay bằng **hành tím đập giập** (4 củ cho công thức này) + 1 tép tỏi.
      Mùi sẽ "hiền" hơn bản gốc chút. Mà nén để được lâu lắm — thấy đâu bán
      cứ mua sẵn một túi, cất ngăn mát cả tháng, nấu canh gà kho cá đều
      thơm.
  - q: Đổi nhân gà, cá lóc… được không?
    a: >-
      Quá được — mì Quảng nổi tiếng "bao dung": **gà ta chặt miếng um sả
      nghệ**, cá lóc, ếch, thậm chí sứa đều thành chuyện. Giữ nguyên bộ tứ
      nén – nghệ – điều – đậu phộng và nguyên tắc chan nhín nêm đậm là kiểu gì cũng
      ra "chất Quảng".
  - q: Sao nước nhân của mình nhạt màu, lạt vị?
    a: >-
      Ba chỗ hay hụt: **um chưa tới** (nhân chưa kịp ra nước ngọt đã châm
      nước xương), **thiếu dầu điều** (màu chỉ trông vào nghệ nên xỉn), và
      **nêm rụt rè**. Um đủ 10 phút, đủ 2 muỗng dầu điều, nêm đậm hơn cảm
      giác "vừa miệng" một bậc là tô sau đẹp liền.
  - q: Làm trước được khâu nào khi đãi khách?
    a: >-
      Gần hết luôn: nước xương và nhân um **nấu trước nửa ngày**, rau rửa
      sẵn, đậu phộng bánh tráng làm từ sáng. Khách tới chỉ đun sôi nồi
      nhân, trụng mì, ráp tô — 10 phút ra một loạt tô nóng hổi, chủ nhà
      vẫn kịp ngồi kể chuyện.

