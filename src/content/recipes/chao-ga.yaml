stepsEyebrow: Vô bếp thôi!
stepsTitle: 5 bước ra **nồi cháo gà đúng kiểu**
stepsLead: >-
  Cả món xoay quanh một nồi nước: luộc gà xong thì chính nồi đó thành nồi
  cháo. Hai việc đáng chú tâm là **rang gạo** và **canh giờ luộc gà** — làm
  đúng hai chỗ đó thì phần còn lại gần như không sai được.
steps:
  - title: Luộc gà, ủ rồi ngâm đá
    icon: pot
    minutes: 40 phút
    intro: "Con gà quyết định cả nồi nước lẫn đĩa thịt, nên làm cho tới:"
    bullets:
      - label: "Làm sạch:"
        text: >-
          Chà xát **muối hột với gừng đập dập** trong ngoài con gà, rửa lại
          kỹ, để ráo.
      - label: "Luộc:"
        text: >-
          Xếp gà vào nồi, châm **nước lạnh** ngập (cỡ [[2.2|lít]]), thả gừng
          và hành tím nướng xém + [[1|thìa cà phê|frac]] muối. Sôi thì **hớt
          sạch bọt**, hạ liu riu **25 phút**.
      - label: "Ủ và ngâm:"
        text: >-
          Tắt bếp, đậy vung **ủ 10 phút**, rồi vớt gà thả vào **thau nước đá
          5 phút** cho da săn và thịt mọng.
    callout:
      type: warn
      text: >-
        Để nồi sôi bùng suốt là **da nứt, thịt xác xơ, nước đục**. Mặt nước
        chỉ lăn tăn từ đầu tới cuối — nồi cháo lấy chính nước này nên nước đục
        thì tô cháo cũng xỉn màu.
    timer:
      secs: 1500
      label: Hẹn giờ luộc gà · 25:00
      doneMsg: Tắt bếp, ủ thêm 10 phút nghen!
  - title: Rang gạo cho dậy mùi
    icon: flame
    minutes: 8 phút
    bullets:
      - text: >-
          Vo [[180|g]] gạo tẻ + [[40|g]] gạo nếp **nhẹ tay một lượt**, để
          thật ráo — gạo còn ướt thì rang không vàng.
      - text: >-
          Bắc chảo khô, cho [[1|thìa canh|frac]] dầu, trút gạo vào **đảo đều
          tay 4–5 phút** trên lửa vừa.
      - text: >-
          Đạt là khi hạt gạo **ngả vàng nhạt và dậy mùi thơm như mùi cốm**.
          Đừng rang tới nâu — nâu là cháo sẽ đắng và ngả màu.
    callout:
      type: tip
      text: >-
        Rang gạo là chỗ chia đôi nồi cháo "ăn được" và nồi cháo "ăn là nhớ".
        Hạt gạo được áo dầu thì lúc ninh **nở tơi và rời nhau** thay vì bết
        thành hồ, lại thơm sẵn từ trước khi vào nồi.
  - title: Ninh cháo bằng nước luộc gà
    icon: rice
    minutes: 40 phút
    bullets:
      - text: >-
          Lọc nồi nước luộc gà qua rây cho trong, bỏ xác gừng hành. Trút gạo
          rang vào, đun sôi rồi **hạ liu riu**.
      - text: >-
          Ninh **40 phút**, thỉnh thoảng khuấy nhẹ từ đáy lên cho khỏi khê.
          Đạt là hạt gạo nở mềm mà vẫn còn tơi.
      - text: >-
          Bộ xương gà đã lọc thịt **thả lại nồi** ninh chung cho ngọt, gần
          xong thì vớt ra.
      - text: >-
          Nêm [[2|thìa canh|frac]] nước mắm và chút muối; đặc quá thì châm
          **nước sôi**, đừng châm nước lạnh.
    timer:
      secs: 2400
      label: Hẹn giờ ninh cháo · 40:00
      doneMsg: Nếm thử — hạt gạo nở mềm là được!
  - title: Xé gà, trộn muối tiêu chanh
    icon: knife
    minutes: 10 phút
    bullets:
      - text: >-
          Lọc thịt khỏi xương, **xé tay theo thớ** thành miếng to bằng ngón
          tay — xé chứ đừng thái, thớ xù xì mới bám gia vị.
      - text: >-
          Pha chén **muối + tiêu + nước cốt chanh**, rưới vào gà xé, bóp nhẹ
          cho thấm.
      - text: >-
          Thái [[5|lá]] lá chanh thành chỉ thật mảnh, trộn vào sau cùng.
      - text: >-
          Muốn ăn kiểu gỏi thì trộn thêm hành tây thái mỏng đã ngâm giấm —
          thành đĩa gà xé phay ăn xen với cháo.
    callout:
      type: tip
      text: >-
        Lá chanh chỉ nên **trộn vào thịt, đừng thả vào nồi cháo**. Nấu trong
        nồi thì lá chanh ngả đắng và mùi lấn hết cái ngọt của nước gà.
  - title: Ráp tô, rắc gừng sợi
    icon: bowl
    minutes: 5 phút
    bullets:
      - text: >-
          Phi thơm hành tím thái lát với chút mỡ gà lấy từ nồi luộc, được
          **mỡ hành** để chan mặt tô.
      - text: >-
          Múc cháo nóng ra tô, **xếp gà xé lên mặt**, rắc gừng thái sợi thật
          mảnh.
      - text: >-
          Rắc hành lá, ngò rí, hành phi rồi **rắc tiêu**; chan một muỗng mỡ
          hành lên trên cùng.
      - text: >-
          Dọn kèm đĩa quẩy cắt khúc — để riêng, ai ăn tới đâu thả vào tô tới
          đó cho khỏi ỉu.
    doneText: Bưng ra bàn — xong!

tipsTitle: 5 mẹo cho **nồi cháo gà không nhạt nhòa**
tipsLead: >-
  Món dễ nên ít ai để ý mấy chi tiết nhỏ. Mà chính mấy chi tiết đó tạo ra
  khác biệt rõ nhất giữa tô cháo ở nhà và tô cháo ngoài hàng.
tips:
  - icon: flame
    title: Rang gạo — mẹo đáng giá nhất
    text: >-
      Bốn phút rang gạo đổi lấy hai thứ: **hạt cháo nở tơi rời nhau** thay vì
      bết dính, và **mùi thơm như cốm** ngấm sẵn trong từng hạt. Rang tới vàng
      nhạt là dừng; rang tới nâu thì cháo đắng và ngả màu xỉn.
  - icon: drop
    title: Nấu bằng nước luộc gà, không nước lã
    text: >-
      Cả vị ngọt của nồi cháo nằm ở nồi nước luộc. Lọc cho trong rồi dùng
      nguyên, và **thả bộ xương đã lọc thịt vào ninh chung** để rút thêm chất
      ngọt. Nấu bằng nước lã rồi nêm bột ngọt cho đậm là ra vị gắt, không
      giống nữa.
  - icon: clock
    title: Luộc 25 phút rồi ủ, đừng ninh lâu
    text: >-
      Nhiều người ninh gà cả tiếng để lấy nước ngọt — được chút nước mà **mất
      cả đĩa thịt**. Luộc liu riu 25 phút, ủ 10 phút, ngâm nước đá 5 phút là
      thịt vừa chín tới, săn và mọng. Xiên đũa vào đùi không rỉ nước hồng là
      đạt.
  - icon: ginger
    title: Gừng thái sợi, không phải gừng băm
    text: >-
      Gừng băm chìm vào cháo và cho vị nồng đều đều. **Thái sợi thật mảnh rắc
      lên mặt tô** thì mỗi muỗng gặp một chút, cái ấm bật lên rồi tan — vừa
      đẹp mắt vừa đúng vị. Gừng nướng thả nồi luộc là việc khác, đừng lẫn hai
      thứ.
  - icon: rice
    title: Cháo đặc thì châm nước sôi
    text: >-
      Cháo để một lúc là đặc lại, nhất là khi hâm nồi hôm trước. Châm **nước
      sôi** rồi khuấy nhẹ; châm nước lạnh thì hạt gạo bị "sốc" và cháo mất độ
      sánh, mặt nồi tách nước trông rất mất ngon.

serve:
  title: Tô cháo nóng — **bữa sáng chắc dạ, bữa khuya nhẹ bụng**
  paras:
    - >-
      Cháo gà hợp cả hai đầu ngày: sáng ra một tô nóng cho ấm bụng trước khi
      đi làm, khuya về đói thì hâm lại nồi là có ngay. Đây cũng là nồi **nấu
      một lần ăn được hai bữa** — cháo để ngăn mát, sáng hôm sau hâm lên châm
      thêm nước sôi là vừa.
    - >-
      Nhà có bé thì múc riêng một tô trước khi rắc tiêu và gừng, xé thịt nhỏ
      hơn chút, cháo múc loãng hơn một chút là vừa miệng. Người lớn thì cứ
      rắc tiêu dày tay và thêm gừng sợi cho dậy.
    - >-
      Một con gà nấu được cả nồi cháo lẫn **đĩa gà xé phay** — trộn thêm hành
      tây ngâm giấm và rau răm là thành món gỏi ăn xen. Muốn đổi hướng hẳn thì
      dùng phần ức làm **gỏi gà bắp cải**, phần đùi với nước luộc để nấu cháo.
  aside:
    title: Trên bàn cháo gà
    intro: "Mấy thứ nên có sẵn:"
    items:
      - icon: roll
        text: "**Đĩa quẩy cắt khúc** — thả vào tô tới đâu ăn tới đó."
      - icon: ginger
        text: "**Chén gừng thái sợi** — ai thích ấm miệng tự rắc thêm."
      - icon: bottle
        text: "**Chén muối tiêu chanh** — chấm gà xé, đậm hơn hẳn."
      - icon: pepper
        text: "**Hũ tiêu xay** — rắc sát lúc ăn cho thơm."

faq:
  - q: Có cần rang gạo không, bỏ qua được không?
    a: >-
      Bỏ qua vẫn ra nồi cháo, nhưng đây là **mẹo đáng giá nhất của món** nên
      tiếc lắm. Bốn phút rang đổi lấy hạt gạo nở tơi và mùi thơm sẵn. Nếu thật
      sự vội thì ít nhất hãy **để gạo thật ráo và trộn qua chút dầu** trước
      khi cho vào nồi — được một phần tác dụng.
  - q: Gà công nghiệp nấu được không?
    a: >-
      Được. Chỉnh hai chỗ: **rút thời gian luộc còn 15–17 phút** rồi ủ 10 phút
      (thịt gà công nghiệp mềm sẵn, luộc lâu là bở), và mua thêm [[300|g]]
      xương gà ninh chung cho nước dùng có chiều sâu. Xé thịt cũng nên xé
      miếng to hơn kẻo vụn.
  - q: Nấu bằng nồi cơm điện hay nồi áp suất được không?
    a: >-
      Được cả hai. **Nồi áp suất**: sau khi rang gạo, cho vào với nước luộc
      gà, nấu áp suất **15 phút** rồi xả tự nhiên — nhanh hơn nhiều nhưng hạt
      gạo nở đều tới mức hơi bết. **Nồi cơm điện** chế độ nấu cháo thì cứ để
      máy chạy, chỉ cần nhớ khuấy một lần giữa chừng.
  - q: Muốn thêm đậu xanh thì cho lúc nào?
    a: >-
      Cho **đậu xanh cà vỏ** đã ngâm 2 tiếng vào **cùng lúc với gạo**, cỡ
      [[50|g]] cho nồi [[4|người]]. Đậu xanh làm cháo sánh và bùi hơn, hợp
      với nhà có trẻ nhỏ. Nhớ giảm gạo nếp xuống một nửa, không thì nồi cháo
      đặc quánh.
  - q: Cháo để tủ lạnh hâm lại thế nào cho ngon?
    a: >-
      Để nguội hẳn rồi cất ngăn mát, dùng trong **2–3 ngày**. Hâm thì bắc lên
      bếp lửa nhỏ, **châm nước sôi** từng chút và khuấy nhẹ cho về độ sánh cũ.
      Phần gà xé nên để hộp riêng và chỉ xếp lên tô lúc ăn — trộn sẵn vào cháo
      rồi cất là thịt bị khô xác.
  - q: Vì sao cháo bị bết dính thành hồ?
    a: >-
      Hai lý do quen thuộc: **không rang gạo** và **khuấy quá nhiều**. Khuấy
      làm hạt gạo vỡ ra nhả tinh bột, càng khuấy càng đặc quánh. Chỉ khuấy khi
      sợ khê đáy nồi, mỗi lần một vòng nhẹ. Lỡ bết rồi thì châm nước sôi khuấy
      loãng ra, ăn vẫn ngon nhưng hạt không tơi lại được.

