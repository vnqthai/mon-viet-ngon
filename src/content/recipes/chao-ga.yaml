title: Cháo gà **gạo rang thơm, nước luộc gà ngọt lịm**
summary: >-
  Nồi cháo quen nhất của mọi nhà, nấu cho ra tấm ra món: **gạo rang vàng trước
  khi ninh** nên hạt tơi và dậy mùi, nước dùng lấy nguyên từ nồi luộc gà, thịt
  xé phay trộn muối tiêu chanh để riêng. Rắc gừng sợi với hành lá, thêm cây
  quẩy là xong bữa sáng.
region: Cả nước
category: Cháo
occasions: [Cơm nhà, Bữa sáng, Cho bé]
