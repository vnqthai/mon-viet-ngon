quick:
  ingredients:
    - Gà ta [[1|con|frac]] (1,2–1,5 kg) — hoặc [[800|g]] đùi góc tư cho gọn
    - Gạo tẻ [[180|g]] + gạo nếp [[40|g]] — **rang vàng trước khi ninh**
    - Gừng [[1|củ]] · hành tím [[4|củ]] · hành lá · ngò rí
    - "Trộn gà xé: muối [[1|thìa cà phê|frac]] · tiêu · chanh [[1|trái]] · lá chanh thái chỉ"
    - "Nêm: nước mắm [[2|thìa canh|frac]] · muối · tiêu"
    - Quẩy ăn kèm · hành phi
  steps:
    - Luộc gà từ **nước lạnh** với gừng hành nướng — sôi hớt bọt, liu riu 25 phút, ủ 10 phút.
    - Rang gạo với chút dầu tới khi **hạt vàng nhạt và dậy mùi cốm**, chừng 5 phút.
    - Trút gạo rang vào **nước luộc gà**, ninh liu riu 40 phút cho nở mềm.
    - Vớt gà ngâm nước đá, xé phay, trộn muối tiêu chanh + lá chanh thái chỉ.
    - Nêm nồi cháo, thả gừng thái sợi, chan mỡ hành cho thơm.
    - Múc ra tô, xếp gà xé lên mặt, rắc hành lá, ngò, tiêu; dọn kèm quẩy.
  warning: >-
    **Đừng ninh gà quá lâu để lấy nước ngọt.** Gà luộc 25 phút rồi ủ là vừa
    chín tới, xé ra còn mọng. Ninh cả tiếng thì nước có ngọt thêm chút nhưng
    thịt xác xơ, mà thịt mới là thứ đáng ăn nhất trong tô.

