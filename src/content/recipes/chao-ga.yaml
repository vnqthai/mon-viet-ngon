flavorNote: >-
  **Chuẩn vị:** cháo sánh nhẹ, **hạt gạo nở tơi chứ không dính bết**, húp vào
  thấy ngọt nước gà đi trước rồi mùi gừng ấm theo sau. Thịt gà xé phay phải
  **còn mọng, thấm muối tiêu chanh**, ăn riêng cũng ngon.
storyEyebrow: Chuyện nồi cháo gà
storyTitle: Món **ai cũng biết nấu**, nhưng ngon thì hiếm
story:
  - >-
    Cháo gà là món hầu như nhà nào cũng từng nấu: có con gà, có nắm gạo, thế
    là xong. Chính vì dễ nên nó hay bị nấu qua loa — thả gạo sống vào nồi nước
    luộc, ninh cho nhừ rồi múc ra. Ăn thì vẫn ăn được, nhưng tô cháo ra một
    thứ **sền sệt nhạt nhòa**, hạt gạo bết vào nhau, thịt gà thì khô vì bị
    luộc quá tay.
  - >-
    Khác biệt giữa nồi cháo cho qua bữa và nồi cháo đáng ngồi xuống ăn nằm ở
    hai việc nhỏ. Một là **rang gạo trước khi ninh**: hạt gạo được áo qua dầu
    nóng thì lúc nở ra sẽ **tơi và rời nhau**, lại có mùi thơm như mùi cốm.
    Hai là **luộc gà cho đúng giờ rồi ngâm nước đá**, để miếng thịt săn lại và
    còn mọng nước, xé ra thành thớ đẹp.
  - >-
    Còn lại thì cứ để nồi cháo tự làm việc của nó. Nước luộc gà đã đủ ngọt nên
    không cần thêm gì; gừng thái sợi cho ấm miệng, hành lá và tiêu rắc lúc
    bưng ra. Nhà nào thích đậm thì trộn thêm đĩa gà xé phay với muối tiêu
    chanh và lá chanh thái chỉ, ăn xen với cháo. Một con gà nấu được cả nồi
    cháo lẫn đĩa gỏi — đó là lý do món này có mặt trong bếp Việt lâu tới vậy.

