quick:
  ingredients:
    - Thịt nạc vai xay [[500|g]] · mỡ heo [[100|g]] xắt hạt lựu
    - Giò sống [[200|g]] — thứ làm viên nem dai và mịn
    - "Ướp nem: đường [[2|muỗng canh|frac]] · nước mắm [[1|muỗng canh|frac]] · tỏi + hành tím băm · tiêu"
    - "Tương chấm: thịt xay [[100|g]] · tôm bóc vỏ [[100|g]] · tương đậu nành xay [[3|muỗng canh|frac]]"
    - Đậu phộng rang giã [[50|g]] · gạo nếp [[2|muỗng canh|frac]] rang xay
    - Bánh tráng cuốn · bánh tráng mỏng để chiên · bún rối
    - Rau sống · dưa leo · chuối chát · xoài xanh · hẹ
  steps:
    - Trộn thịt xay + giò sống + mỡ hạt lựu với gia vị, **quết cho thật dẻo**, ướp lạnh 1 tiếng.
    - Nặn thành thỏi dài quanh que tre, nướng than hoa hoặc lò 220 °C tới khi vàng đều.
    - >-
      **Cuốn ống bánh tráng rồi chiên** — cắt bánh tráng mỏng thành dải, thấm
      chút nước cho dẻo, cuốn thành ống nhỏ rồi chiên tới phồng giòn.
    - "Nấu tương: phi hành tỏi, xào thịt + tôm, cho tương đậu nành và bột nếp vào nấu cho sánh."
    - Dọn mẹt rau, bún, nem, ống bánh tráng chiên — mỗi người tự cuốn tự chấm.
  warning: >-
    Đừng chiên ống bánh tráng quá sớm. Chiên xong để quá nửa tiếng là nó **hút
    ẩm và dai lại**, mất đúng cái tiếng rắc trong cuốn nem. Chiên sát giờ ăn,
    để nguyên trong rổ có lót giấy, không đậy kín.

flavor:
