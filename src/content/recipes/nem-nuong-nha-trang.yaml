title: Nem nướng Nha Trang **cuốn bánh tráng, chấm tương**
summary: >-
  Bản gốc xứ Ninh Hòa: viên thịt quết nướng xiên que, cuốn bánh tráng với rau
  sống và **một ống bánh tráng chiên phồng giòn rụm** giấu bên trong, chấm thứ
  sốt sánh màu cam nâu người ta gọi là **tương** — không phải nước mắm chua ngọt.
