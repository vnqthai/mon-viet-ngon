stepsTitle: Bốn việc — làm **ống bánh tráng chiên** trước là đúng thứ tự
stepsLead: >-
  Trộn nem cần thời gian ướp lạnh, nên bắt tay vào đó đầu tiên rồi mới quay
  sang nấu tương và chiên bánh tráng.
steps:
  - title: Trộn và quết viên nem
    icon: knife
    minutes: 20 phút + 1 giờ ướp
    bullets:
      - label: "Xử lý mỡ trước:"
        text: >-
          Mỡ heo xắt hạt lựu cỡ hạt đậu, chần nước sôi 1 phút rồi xóc với 1
          muỗng đường, để riêng.
      - text: >-
          Trộn thịt xay, giò sống, tỏi hành tím băm, đường, nước mắm, tiêu và
          dầu màu điều. **Quết mạnh tay 10 phút** hoặc đánh bằng máy tới khi hỗn
          hợp dẻo quánh, nhấc lên thấy dính khối.
      - label: "Cho mỡ vào sau cùng:"
        text: >-
          Trộn nhẹ phần mỡ hạt lựu vào, đừng quết tiếp — mỡ phải còn nguyên hạt
          thì lúc nướng mới chảy ra làm viên nem mọng.
      - text: Bọc kín, để ngăn mát **1 tiếng** cho thịt nghỉ và ngấm.
    timer:
      secs: 3600
      label: Ướp lạnh viên nem · 60:00
      doneMsg: Lấy ra nặn que là vừa đẹp!
    callout:
      type: tip
      text: >-
        Quết là công đoạn quyết định. Trộn qua loa thì viên nem bở ra khi nướng,
        rơi khỏi que. Thịt càng lạnh càng dễ quết dẻo — để chén thịt trên một
        chậu đá trong lúc quết.
  - title: Nấu chén tương
    icon: pot
    minutes: 25 phút
    intro: "Đây là thứ làm nên bản Ninh Hòa, đáng dành thời gian:"
    bullets:
      - text: >-
          Phi thơm hành tím tỏi băm với dầu màu điều. Cho thịt xay, tôm băm (và
          gan heo băm nếu có) vào **xào tới chín săn**.
      - text: >-
          Cho tương đậu nành xay vào đảo đều, chan [[300|ml]] nước, nêm đường và
          chút nước mắm. Đun **lửa nhỏ 10 phút**.
      - label: "Làm sánh:"
        text: >-
          Rắc bột gạo nếp rang từ từ, khuấy đều tay tới khi sốt sánh như sữa
          đặc. Tắt bếp, rắc đậu phộng giã.
      - text: >-
          Nếm lại: phải **ngọt bùi mặn nhẹ**, không chua. Lạt quá thì thêm nước
          mắm, đặc quá thì pha thêm nước nóng.
    timer:
      secs: 600
      label: Đun tương liu riu · 10:00
      doneMsg: Rắc bột nếp vào cho sánh nghen!
  - title: Cuốn ống bánh tráng rồi chiên
    icon: flame
    minutes: 15 phút
    bullets:
      - text: >-
          Cắt bánh tráng mỏng thành dải rộng chừng [[5|cm]]. Nhúng ngón tay vào
          nước, **vuốt nhẹ một đường** cho dải bánh dẻo lại — ướt quá là nhão,
          không cuốn được.
      - text: >-
          Cuốn từng dải thành ống nhỏ cỡ ngón tay, để mí xuống dưới cho khỏi bung.
      - label: "Chiên:"
        text: >-
          Dầu nóng già, thả ống vào chiên **20–30 giây** là phồng lên vàng giòn.
          Vớt ra rổ có lót giấy thấm dầu.
    callout:
      type: warn
      text: >-
        Chiên sát giờ ăn thôi. Để lâu ống bánh tráng hút ẩm không khí và dai
        lại, mà cái ống hết giòn thì cuốn nem mất nửa cái hay của nó.
  - title: Nướng nem và dọn mẹt
    icon: flame
    minutes: 20 phút
    bullets:
      - label: "Nặn que:"
        text: >-
          Thoa chút dầu vào tay, lấy một nắm thịt vuốt quanh que tre thành thỏi
          dài chừng [[10|cm]], bóp cho chặt vào que.
      - label: "Than hoa:"
        text: >-
          Nướng trên than hồng vừa, trở đều **10–12 phút** tới khi mặt ngoài
          vàng xém, thoa chút dầu cho bóng.
      - label: "Lò nướng:"
        text: >-
          Đặt vỉ giữa lò, **220 °C trong 15 phút**, trở một lần giữa chừng, bật
          lửa trên 2 phút cuối cho xém mặt.
      - text: >-
          Dọn mẹt: rau sống, bún rối, chuối chát, xoài xanh, dưa leo, nem nướng
          còn nóng, ống bánh tráng chiên và chén tương.
    timer:
      secs: 720
      label: Nướng nem trở đều · 12:00
      doneMsg: Vàng xém mặt là được — dọn ra lúc còn nóng!
    doneText: Xong — cuốn ngay khi nem còn nóng!

tipsTitle: 4 chỗ **quyết định** mẹt nem nướng
tips:
  - icon: knife
    title: Quết cho dẻo, đừng chỉ trộn
    text: >-
      Viên nem nướng dai mà mịn là nhờ quết chứ không nhờ nguyên liệu đắt. Trộn
      sơ sài thì thịt rời rạc, nướng tới nửa chừng là rơi khỏi que và ăn bở như
      thịt viên. Quết mạnh tay 10 phút, thịt càng lạnh càng dễ dẻo.
  - icon: roll
    title: Ống bánh tráng chiên không phải thứ trang trí
    text: >-
      Nhiều nhà bỏ qua bước này cho nhanh, và cuốn nem mất đúng cái làm nó khác
      mọi món cuốn khác: **tiếng giòn ở giữa**. Cuốn có ống thì cắn xuống nghe
      rắc trước, rồi mới tới thịt mềm và rau mát — ba lớp một nhịp.
  - icon: bowl
    title: Tương phải sánh, không phải nước chấm loãng
    text: >-
      Chén tương đúng là **sánh bám vào cuốn**, nhúng lên không chảy ròng ròng.
      Chỗ làm sánh là bột gạo nếp rang, cho từ từ và khuấy đều tay. Sánh quá thì
      pha thêm nước nóng — chứ đừng nấu đặc rồi để nguội mới chữa, lúc đó nó vón.
  - icon: lime
    title: Chuối chát và xoài xanh là phần cân vị
    text: >-
      Nem ngọt, tương béo — nếu cuốn chỉ có thịt với rau thơm thì tới cuốn thứ
      ba là ngán. Lát chuối chát và que xoài xanh mang cái **chát và chua** vào,
      kéo cả cuốn nhẹ lại. Thiếu hai thứ này ăn vẫn được, nhưng ăn ít hơn hẳn.

serve:
  title: Mẹt để giữa bàn — **ai nấy tự cuốn phần mình**
  paras:
    - >-
      Nem nướng không dọn sẵn từng cuốn. Cả mẹt đặt giữa bàn, mỗi người trải một
      lá bánh tráng, gắp rau, đặt viên nem, bẻ một khúc ống bánh tráng chiên rồi
      cuốn lấy — cuốn to nhỏ tùy người, và đó là một phần của bữa ăn.
    - >-
      Bánh tráng cuốn loại dẻo thì chỉ cần **vuốt ẩm hai mặt** chứ đừng nhúng
      ngập nước, không thì lá bánh nhão và rách lúc cuốn. Để một chén nước lã
      với cái khăn ẩm cạnh mẹt là gọn nhất.
  aside:
    title: Thứ tự xếp trong một cuốn
    intro: "Xếp đúng thứ tự thì cuốn chặt tay và không bung:"
    items:
      - icon: herb
        text: "**Lá xà lách trải trước** — nó là lớp giữ cho mọi thứ khỏi đâm rách bánh tráng."
      - icon: noodle
        text: "**Một nhúm bún nhỏ**, rồi rau thơm, dưa leo, chuối chát, xoài xanh."
      - icon: meat
        text: "**Nem nướng và ống bánh tráng đặt cuối cùng**, nằm dọc theo cuốn rồi mới cuộn lại."

faq:
  - q: Không có than hoa thì nướng bằng gì?
    a: >-
      Lò nướng **220 °C trong 15 phút**, trở một lần, hai phút cuối bật lửa trên
      cho xém mặt. Nồi chiên không dầu cũng được: 200 °C khoảng 12 phút. Cái mất
      là mặt ngoài không xém loang lổ như nướng than, nên nhớ **thoa dầu cho
      bóng** trước khi dọn.
  - q: Nem bị rơi khỏi que lúc nướng?
    a: >-
      Hai lý do. Một là thịt chưa quết đủ dẻo nên không bám. Hai là que tre khô
      quá trơn — **ngâm que trong nước 15 phút** trước khi nặn, và bóp thịt chặt
      quanh que chứ đừng chỉ vuốt ngoài.
  - q: Làm trước được tới đâu?
    a: >-
      Viên nem trộn xong cất ngăn mát được **một ngày**, nặn que rồi nướng lúc
      ăn. Chén tương nấu trước cũng được, hâm lại thì pha thêm chút nước nóng
      cho loãng ra đúng độ. Riêng **ống bánh tráng chiên phải làm sát giờ**.
  - q: Ăn kiểu tô bún có được không?
    a: >-
      Được, và đó là bản quen thuộc ở Sài Gòn: nem xắt khúc, bún, rau, chan nước
      mắm chua ngọt. Nhưng nếu đã nấu chén tương Ninh Hòa thì đừng đổi sang nước
      mắm — hai thứ chấm đó dành cho hai cách ăn khác nhau.

