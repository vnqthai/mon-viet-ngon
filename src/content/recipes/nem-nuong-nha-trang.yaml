flavorNote: >-
  **Chuẩn cuốn:** cắn xuống nghe **rắc** trước — đó là ống bánh tráng chiên —
  rồi mới tới viên nem mềm dai; chén tương phải **sánh bám vào cuốn**, béo bùi
  đậu phộng, mặn ngọt nhẹ chứ không chua gắt như nước mắm pha.

storyEyebrow: Chuyện món ăn
storyTitle: Món của **Ninh Hòa**, nổi tiếng dưới tên **Nha Trang**
story:
  - >-
    Nem nướng vốn là món của **Ninh Hòa**, một vùng phía bắc tỉnh Khánh Hòa. Cái
    tên đi ra thế giới lại là "nem nướng Nha Trang" — đơn giản vì Nha Trang là
    nơi khách phương xa dừng chân, và hàng nem nướng ở đó đông hơn. Người trong
    vùng vẫn gọi đúng tên gốc, còn tấm biển ngoài đường thì viết theo tên khách
    biết.
  - >-
    Điểm nhận dạng chắc chắn nhất của bản gốc **không nằm ở viên nem** mà nằm ở
    **cái ống bánh tráng chiên** cuốn kèm. Bánh tráng mỏng được cắt dải, cuốn
    thành ống nhỏ rồi thả chảo dầu cho phồng lên giòn tan. Cuốn nem nướng đúng
    kiểu bao giờ cũng có một ống nằm giữa — nó là tiếng động của món ăn này.
  - >-
    Chỗ khác nữa là chén chấm. Nhiều nơi trong Nam dọn nem nướng với nước mắm
    chua ngọt, nhưng bản Ninh Hòa chấm **tương** — một thứ sốt nấu, sánh và đục,
    màu cam nâu, nấu từ thịt và tôm xay với tương đậu nành, đậu phộng rang giã,
    và một chút bột gạo nếp cho sánh. Nó ngọt bùi chứ không chua, nên vị cả cuốn
    nghiêng hẳn sang béo và thơm.
  - >-
    Còn một bản nữa hay gặp ở Sài Gòn: nem nướng xắt khúc bỏ vào **tô bún** chan
    nước mắm, ăn bằng đũa. Bản đó tiện và no bụng, nhưng nó là món khác. Bài này
    làm **bản cuốn** — mẹt rau để giữa bàn, ai nấy tự cuốn lấy phần mình, vì đó
    mới là cách món này sinh ra.

ingredientGroups:
