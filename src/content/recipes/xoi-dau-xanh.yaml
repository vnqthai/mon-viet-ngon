flavorNote: >-
  **Chuẩn đĩa:** hạt nếp **bóng, dẻo, còn rời nhau** chứ không dính thành mảng;
  hạt đậu chín mềm mà vẫn **giữ nguyên hình**, cắn ra bùi và bở nhẹ; nhạt nền,
  vị mặn thơm là do muối vừng rắc lên chứ không nêm sẵn trong xôi.
storyEyebrow: Chuyện món ăn
storyTitle: Món xôi **đơn giản nhất**, và vì vậy khó giấu lỗi nhất
story:
  - >-
    Nếp với đậu xanh, thêm nhúm muối. Danh sách nguyên liệu chỉ có vậy, mà đĩa
    xôi đậu xanh vẫn là món xôi được nấu ở nhà nhiều hơn mọi món xôi khác — sáng
    dọn ra ăn nóng, trưa nguội vẫn ngon, mà chiều tối đem hấp lại là mềm như mới.
  - >-
    Cách làm cũng nói lên tính cách của nó: đậu **ngâm riêng nhưng đồ chung với
    nếp**. *Đồ* là chữ nhà bếp quen dùng cho món nếp — nghĩa là **làm chín bằng
    hơi nước**, không nấu trong nước; cái nồi hấp xôi truyền thống thì gọi là
    **chõ**, và xửng hấp thường cũng thay được. Đậu đồ chung với nếp nên khi xới
    ra, hạt đậu vàng nhạt nằm rải đều trong nền nếp trắng, thìa nào cũng có cả
    hai. Ăn tới đâu gặp đậu tới đó, chứ không phải một lớp đậu nằm trên một lớp
    nếp.
  - >-
    Chính vì ít nguyên liệu nên món này **không có chỗ nào để giấu lỗi**. Nếp
    ngâm chưa đủ thì hạt sượng lõi, thấy ngay. Để ráo không kỹ thì cả đĩa bết
    lại. Đậu ngâm quá tay thì nát bung ra thành một lớp bột vàng phủ khắp. Không
    có nước sốt hay hành phi nào cứu được — cả món nằm gọn trong hai lần canh
    giờ ngâm và một lần để ráo.
  - >-
    Muối vừng đi cùng cũng không phải chuyện phụ. Xôi nhạt nền là **cố ý**: vị
    mặn, béo và thơm đến từ nhúm muối vừng rắc lên lúc ăn, nên rắc tới đâu mặn
    tới đó, mỗi người một tay. Nhà nào cũng có một hũ muối vừng để tủ, ăn dần cả
    tuần.

