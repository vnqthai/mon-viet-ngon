title: Xôi đậu xanh **hạt đậu bùi nằm lẫn trong nếp dẻo**
summary: >-
  Đĩa xôi nhà nấu quen nhất: nếp trắng dẻo bóng, **hạt đậu xanh vàng nhạt nằm
  rải đều trong từng thìa**, chấm với muối vừng giã thô. Đậu và nếp ngâm riêng
  nhưng hấp chung một lượt — cả món gọn trong hai thứ và một nhúm muối.
