    - Muối hạt [[1|muỗng cà phê]] · dầu ăn hoặc mỡ gà [[1|muỗng canh]]
    - "Muối vừng: vừng trắng [[50|g]] · lạc rang [[50|g]] · muối [[1|muỗng cà phê]] · đường [[1|muỗng cà phê|frac]]"
  steps:
    - >-
      Ngâm nếp **6 giờ**, đậu xanh **4 giờ**. Vo lại cả hai, để **thật ráo**
      15 phút.
    - Trộn nếp với đậu và muối hạt, xóc đều cho đậu rải khắp chứ đừng dồn một chỗ.
    - >-
      Hấp **35–40 phút**. Giữa chừng mở ra xới tơi một lần, rưới dầu, đậy lại
      hấp tiếp.
    - Rang vừng và lạc, giã thô, trộn muối đường — được chén muối vừng.
    - Xới xôi ra đĩa lúc còn nóng, rắc muối vừng lên hoặc để riêng chén nhỏ.
  warning: >-
    Ngâm rồi mà **không để ráo** thì nếp thừa nước, xôi ra nhão bết thành một
    khối. Vo xong đổ ra rá, để đứng **ít nhất 15 phút**, thấy mặt hạt khô ráo
    mới đem hấp.

