title: Gà kho gừng **ấm bụng những ngày trở trời**
summary: >-
  Miếng gà da vàng óng bám lớp nước kho **sánh keo màu cánh gián**, gừng
  sợi cay ấm thơm lừng góc bếp — món kho quốc dân mà hễ trời chuyển mưa,
  se lạnh là tự nhiên thèm cơm nóng với nó.
region: Cả nước
category: Kho
time:
  total: 50 phút
servingsBase: 4
difficulty: Dễ
featured: false
order: 15
art: ga-kho
heroEyebrow: Gừng cay muối mặn xin đừng quên nhau…

quick:
  ingredients:
    - Gà ta [[1200|g]] chặt miếng vừa (đùi, cánh, má đùi — giữ da)
    - Gừng già [[1|củ]] lớn — nửa thái sợi, nửa thái lát + ít đập giập khử mùi
    - "Ướp: nước mắm [[2|muỗng canh|frac]] · đường [[1|muỗng canh|frac]] · hành tím [[2|củ]] băm · tiêu · ớt (tùy nhà)"
    - Đường thắng nước màu [[1.5|muỗng canh|frac]] (hoặc nước màu dừa có sẵn)
    - Hành lá vài nhánh · cơm nóng + dưa leo ăn kèm
  steps:
    - Gà chà **muối + gừng đập**, xả sạch, để ráo; chặt miếng vừa gắp.
    - Ướp gà với mắm – đường – hành tím – tiêu + **nửa phần gừng lát**, để **15 phút**.
    - Thắng [[1.5|muỗng canh|frac]] đường tới **màu cánh gián**, cho gà vô xào lửa vừa tới săn da, bám màu.
    - Châm nước sôi **xâm xấp ⅓ mặt thịt**, kho **liu riu 20 phút**, hé vung, thỉnh thoảng trở miếng.
    - Thả **gừng sợi**, mở lửa vừa rim tới nước **sánh keo bám da gà**; nêm lại, rắc hành lá + tiêu.
    - Dọn với cơm trắng nóng — chan muỗng nước kho lên cơm trước, lùa một đũa rồi mới gắp gà!
  warning: >-
    Gừng cho quá tay ngay từ đầu là nồi kho **hăng và đắng**. Đúng bài là
    chia hai đợt: gừng lát ướp cùng cho thơm trầm, **gừng sợi thả 5 phút
    cuối** cho thơm tươi cay dịu.

flavor:
  chua: 0
  ngot: 5
  man: 7.5
  cay: 3.5
  thom: 8.5
flavorNote: >-
  **Chuẩn nồi gà kho gừng:** nước kho **sánh keo, mặn ngọt đậm đà** vừa đủ
  "bắt cơm", miếng gà thấm tới xương mà không khô, và mùi gừng **ấm — cay
  dịu chứ không hăng**, nghe là thấy được an ủi.
storyEyebrow: Chuyện nồi kho
storyTitle: Món kho của câu ca **"gừng cay muối mặn"**
story:
  - >-
    Người Việt mình nói chuyện nghĩa tình là nhắc tới gừng: **"Tay bưng dĩa
    muối chén gừng / Gừng cay muối mặn xin đừng quên nhau."** Chẳng biết có
    phải vì vậy không mà nồi gà kho gừng ăn vào cứ thấy... thương thương —
    nó là món của những bữa cơm thường nhất, không giỗ chạp lễ lạt gì,
    chỉ là má thấy trời chuyển gió nên kho nồi gà cho ấm bụng cả nhà.
  - >-
    Món này hay ở chỗ **cả ba miền đều nhận là món nhà mình**: ngoài Bắc
    kho khô đứng vị mặn, trong Nam thêm chút đường chút nước dừa cho dịu,
    miền Trung bỏ thêm ớt cay xé — nhưng cái lõi thì đâu cũng vậy: gà xào
    săn với nước màu, kho liu riu cho thấm, và gừng, thiệt nhiều mùi gừng.
  - >-
    Bí quyết cả công thức gói trong hai chữ **"hai đợt"**: gừng lát kho từ
    đầu cho vị ấm ngấm vào thớ thịt, gừng sợi thả phút cuối cho mùi tươi
    bung lên theo khói cơm. Nấu đúng một lần là tay quen — sau này cứ thấy
    gió về là tự động ghé chợ xách con gà với củ gừng.

