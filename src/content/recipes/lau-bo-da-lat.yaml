flavorNote: >-
  **Chuẩn nồi lẩu:** nước dùng **nâu trong, ngọt đậm vị xương bò**, thoảng hồi
  quế chứ không nồng như phở. Miếng gân **trong veo, dai giòn sựt**; khúc đuôi
  **rời xương khi khều nhẹ**; miếng nạm mềm mà vẫn còn thớ để cắn.
storyEyebrow: Chuyện nồi lẩu chiều mưa
storyTitle: Nồi lẩu bò **ăn với bánh mì**, không ăn với bún
story:
  - >-
    Đà Lạt mưa thì mưa dai, có khi rả rích từ chiều tới tối. Và cái mưa đó đẻ
    ra một thói quen ăn uống rất riêng: nồi lẩu bò đặt giữa bàn, để lửa liu riu
    suốt buổi, ngồi nghe mưa ngoài hiên mà nồi vẫn nóng. Không phải món ăn
    nhanh — nó là cái cớ để ngồi nán lại cho tạnh mưa rồi hẵng về.
  - >-
    Điểm khác biệt lớn nhất so với mấy nồi lẩu bò miền xuôi nằm ở thứ ăn kèm:
    **bánh mì**. Xé miếng bánh mì chấm vào nước lẩu nâu sánh, cắn miếng gân
    dai sựt — người quen ăn lẩu với bún lần đầu thấy lạ, ăn tới miếng thứ ba
    thì hiểu ngay vì sao dân ở đây làm vậy.
  - >-
    Cái ngon của nồi này nằm ở **ba thứ cùng nồi mà ba kết cấu khác nhau**:
    nạm mềm còn thớ, gân trong veo dai sựt, đuôi bò béo ngậy rời xương. Thiếu
    một thứ là nồi lẩu mất cân — nên dù có tốn công đi chợ thêm một hàng, cũng
    nên mua đủ cả ba.

