title: Lẩu bò Đà Lạt **nạm gân đuôi ninh mềm, chấm chao**
summary: >-
  Nạm, gân và đuôi bò ninh tới **mềm rục mà miếng còn nguyên**, nước dùng ngọt
  đậm từ xương bò, chấm chén chao béo — và **chấm bánh mì**, đúng kiểu người
  Đà Lạt ăn cho ấm bụng những chiều mưa dầm.
