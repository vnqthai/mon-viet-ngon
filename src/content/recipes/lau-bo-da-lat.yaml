quick:
  ingredients:
    - "Bộ ba bắt buộc: nạm bò [[400|g]] · gân bò [[300|g]] · đuôi bò [[500|g]]"
    - Xương ống bò [[700|g]] — nướng sơ rồi hầm cho nước ngọt sâu
    - Sả [[5|cây]] · gừng [[1|củ]] nướng · hành tây [[1|củ]] nướng · hoa hồi [[2|cái]] · quế [[1|thanh]]
    - Cà rốt [[2|củ]] · củ cải trắng [[1|củ]]
    - "Nêm: chao đỏ [[2|viên]] tán · nước mắm · đường phèn · muối"
    - Rau nhúng — cải xanh, tần ô, cải thảo · **bánh mì** · mì trứng
    - "Chén chấm: chao tán + sa tế + chanh"
  steps:
    - Chần nạm, gân, đuôi qua nước sôi có gừng đập dập, xả sạch — nước chần đổ bỏ.
    - >-
      **Nướng sơ xương ống, gừng và hành tây** cho cháy xém mặt rồi mới hầm —
      đây là chỗ nước dùng lên mùi.
    - Hầm xương [[2|tiếng]] với hoa hồi, quế, sả đập dập; hớt bọt kỹ 20 phút đầu.
    - Thả **đuôi bò và gân trước** (lâu mềm nhất), 40 phút sau mới tới nạm.
    - Ninh tới khi **gân trong veo, đuôi rời xương nhẹ tay** — chừng 2 tiếng tính từ lúc thả đuôi.
    - Nêm chao tán + nước mắm + đường phèn. Thả cà rốt, củ cải ở 20 phút cuối.
    - Bắc nồi lên bếp giữa bàn. Nhúng rau, **xé bánh mì chấm nước lẩu**, cuối bữa thả mì trứng.
  warning: >-
    Thả nạm cùng lúc với gân và đuôi là hỏng: nạm mềm trước cả tiếng, tới lúc
    gân vừa trong thì nạm đã bã ra xơ. **Thả theo ba đợt** — đuôi và gân
    trước, nạm sau, rau củ sau cùng.

