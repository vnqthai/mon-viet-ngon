quick:
  ingredients:
    - Thịt ba chỉ [[500|g]] — xắt que cỡ ngón út
    - Mắm ruốc [[3|muỗng canh|frac]] — mắm đặc màu nâu tím, ủ từ con ruốc
    - Sả [[5|cây]] băm nhuyễn · hành tím [[3|củ]] · tỏi [[1|củ]]
    - Ớt sừng [[3|trái]] · ớt bột [[1|muỗng cà phê|frac]] — tùy sức ăn cay
    - Đường [[2|muỗng canh|frac]] · dầu ăn — **không thêm muối hay nước mắm**
  steps:
    - Chà thịt với muối, rửa sạch, để thật ráo rồi xắt que.
    - Hòa mắm ruốc với [[4|muỗng canh|frac]] nước, khuấy tan, để lắng rồi gạn lấy phần nước.
    - Phi hành tỏi, cho thịt vào xào **lửa lớn** tới săn và tứa mỡ.
    - Cho sả băm vào, đảo tới khi **sả khô ráo và dậy mùi** mới tới ớt.
    - Rót nước mắm ruốc vào, hạ lửa, rim tới khi cạn và thịt **bóng lên**; cho đường sau cùng.
  warning: >-
    Cho sả vào cùng lúc với thịt là sả **hấp trong nước thịt rồi ỉu**, mất sạch
    mùi thơm. Đợi thịt săn và tứa mỡ ra rồi mới thả sả.

