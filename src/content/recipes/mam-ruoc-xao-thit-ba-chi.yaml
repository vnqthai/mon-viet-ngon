storyEyebrow: Chuyện món ăn
storyTitle: Món của **những ngày không đi chợ**
story:
  - >-
    Bếp miền Trung nào cũng có một hũ mắm ruốc — thứ mắm đặc sệt, màu nâu ngả
    tím, ủ từ **con ruốc** (miền Bắc gọi là con moi) suốt nửa năm trở lên. Nó
    mặn, nó nồng, và nó là chỗ dựa của cả gian bếp vào những ngày mưa dầm không
    ra chợ được.
  - >-
    Đem hũ mắm ấy xào với thịt ba chỉ và một nắm sả băm là ra món này. Cách làm
    gần như không có gì để sai: xào, rim, cạn nước. Nhưng chỗ tinh nằm ở **thứ
    tự** — sả phải vào sau khi thịt đã tứa mỡ, và mắm ruốc phải hòa loãng trước
    khi rót vào chảo. Đảo hai thứ tự đó thì món vẫn ăn được, chỉ là thành một
    món khác, nhạt mùi hơn hẳn.
  - >-
    Đây cũng là món **để dành** đúng nghĩa. Rim cho thật khô, cho vào hũ sạch,
    cất ngăn mát thì ăn được cả tuần lễ mà càng để càng thấm. Nhà có người đi
    học đi làm xa, mẹ hay gói theo một hũ — mở ra là có ngay bữa cơm.
  - >-
    Ăn thì đơn giản: **cơm nóng, dưa leo xắt lát, ít rau sống**. Vị mặn của mắm
    và cái nồng của sả cần cơm trắng để dịu lại; ăn không với cơm thì gắt.

