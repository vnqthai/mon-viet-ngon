title: Mắm ruốc xào thịt ba chỉ **sả nhiều, ăn hao cơm**
summary: >-
  Thịt ba chỉ xắt que xào săn với **thật nhiều sả băm** rồi rim trong mắm ruốc
  cho khô ráo, bóng mỡ. Một hũ để tủ lạnh, bữa nào lười thì xới cơm nóng ra là
  xong bữa.
region: Miền Trung
category: Xào
occasions: [Cơm nhà]
pubDate: 2026-07-29
time:
  total: 40 phút
servingsBase: 4
difficulty: Dễ
featured: false
