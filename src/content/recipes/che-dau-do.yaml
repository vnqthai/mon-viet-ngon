heroEyebrow: Cả món chỉ có hạt đậu với đường…

quick:
  ingredients:
    - Đậu đỏ hạt nhỏ [[300|g]] — ngâm nước lạnh **qua đêm** (6–8 tiếng)
    - Đường [[200|g]] · muối [[0.5|muỗng cà phê|frac]] · lá dứa [[3|lá]]
    - Nước cốt dừa [[250|ml]] + bột năng [[2|muỗng cà phê]]
    - Đá bào · dừa nạo sợi (tùy thích)
  steps:
    - Ngâm đậu **qua đêm**, đổ bỏ nước ngâm, đãi lại — hạt nào nổi lều bều thì vớt bỏ.
    - Ninh đậu với nước ngập [[3|cm]] + lá dứa + **một nhúm muối**, lửa liu riu, hớt bọt.
    - Ninh **50–60 phút** tới khi hạt bấm nhẹ là nát mà **vỏ chưa nứt**.
    - Chắt bớt nước ra để riêng. **Rim đậu với đường** trên lửa nhỏ 10 phút cho ngấm ngọt vào ruột hạt.
    - Chan nước vừa chắt trở lại, nêm lại cho vừa, tắt bếp, để **nguội hẳn**.
    - Nấu cốt dừa với muối + bột năng cho sánh.
    - "Múc ly: đậu dưới, **đá bào phủ trên**, chan cốt dừa, rắc dừa nạo."
  warning: >-
    Đổ hết đường vào ngay từ đầu là hạt đậu **chai lại, gần như không mềm lại
    được nữa** — ninh thêm hai tiếng cũng vô ích. Ninh mềm trước, rim đường
    sau: đó là toàn bộ kỹ thuật của món này.

