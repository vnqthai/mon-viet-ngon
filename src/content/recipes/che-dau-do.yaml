title: Chè đậu đỏ **hạt bở mà còn nguyên, đá bào phủ trên**
summary: >-
  Đậu đỏ ngâm qua đêm, ninh tới **bở tơi mà hạt vẫn tròn**, rim đường cho ngấm
  tới ruột rồi mới chan nước — múc ly, phủ đá bào, rót cốt dừa mặn nhẹ. Chỉ hai
  nguyên liệu mà ra một ly chè đậm đà.
region: Cả nước
category: Chè
occasions: [Ăn chơi]
pubDate: 2026-07-31
time:
