flavorNote: >-
  **Chuẩn ly chè:** hạt đậu **bở tơi trong miệng nhưng nhìn còn nguyên hình,
  vỏ không bung**, và cái ngọt phải nằm **bên trong ruột hạt** chứ không chỉ ở
  nước. Nước chè màu đỏ nâu trong, không lợn cợn bột vỏ.
storyEyebrow: Chuyện ly chè đậu đỏ
storyTitle: Hai nguyên liệu, và **một mẹo làm nên tất cả**
story:
  - >-
    Chè đậu đỏ là món gần như không có gì để giấu: một nắm đậu, một ít đường,
    chan nước cốt dừa. Vậy mà ly chè hàng với ly chè nấu ở nhà khác nhau rõ
    rệt — và khác đúng ở **một bước mà nhà hay bỏ**: rim đậu với đường **trước
    khi** chan nước.
  - >-
    Nấu kiểu đổ chung một nồi thì đường chỉ tan trong nước; cắn hạt đậu vô vẫn
    nhạt phèo, phải húp nước mới thấy ngọt. Rim riêng thì nước đường sánh lại
    bám quanh hạt và **thấm vào tận ruột** — mỗi hạt tự nó đã đủ vị, không cần
    dựa vào nước.
  - >-
    Mẹo thứ hai nằm ở thứ tự: **ninh cho mềm hẳn rồi mới nêm đường**. Cho đường
    sớm là vỏ hạt săn chai lại, ninh thêm hai tiếng cũng vô ích. Nắm hai điều
    đó rồi thì món này chỉ còn là chuyện ngâm qua đêm và để nồi liu riu, gần
    như không phải đứng bếp.

