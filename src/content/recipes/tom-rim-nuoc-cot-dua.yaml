title: Tôm rim nước cốt dừa **vỏ đỏ au, sốt trắng ngà quánh béo**
summary: >-
  Món mặn trứ danh của **Bến Tre xứ dừa**: tôm đất tươi rim lửa nhỏ trong
  nước cốt dừa tới khi sốt keo quánh trắng ngà bám lấy vỏ tôm đỏ au — mặn
  dịu, ngọt béo, hậu tiêu ấm. Lưu ý nghen: rim bằng **nước cốt** vắt từ
  cơm dừa, không phải nước dừa tươi trong trái.
region: Miền Tây
category: Kho
time:
  total: 40 phút
servingsBase: 4
difficulty: Dễ
featured: false
order: 27
art: tom-rim
heroEyebrow: Bến Tre gửi lên mâm cơm…

quick:
  ingredients:
    - Tôm đất tươi [[400|g]] (tôm thẻ cũng được) — cắt râu, **giữ nguyên vỏ**
    - Nước cốt dừa [[200|ml]] — vắt từ [[300|g]] dừa nạo, hoặc lon lắc đều
    - Hành tím [[2|củ]] + tỏi [[2|tép]] băm · hành lá [[2|nhánh]] · tiêu xay
    - "Nêm: nước mắm [[1.5|muỗng canh|frac]] · đường phèn [[2|muỗng cà phê]] (hoặc đường cát)"
  steps:
    - Tôm cắt râu, chân, rút chỉ lưng bằng tăm, rửa sạch, **để thật ráo**.
    - Ướp tôm với [[1|muỗng canh|frac]] nước mắm – hành tỏi băm – tiêu **15 phút**; tranh thủ vắt nước cốt dừa.
    - Phi hành tỏi thơm, trút tôm vô đảo lửa vừa tới **vỏ đỏ au, thân cong lại**.
    - Châm nước cốt dừa + đường phèn, hạ ngay **lửa nhỏ nhất**.
    - Rim **10–12 phút**, xóc chảo nhẹ, tới khi sốt **keo quánh trắng ngà** bám vỏ tôm.
    - Nêm lại cho mặn dịu – ngọt béo, rắc tiêu + hành lá, tắt bếp — ăn nóng với cơm.
  warning: >-
    Lửa lớn là nước cốt dừa **tách dầu, lợn cợn, mùi gắt** — cả món sống
    chết ở hai chữ liu riu.

flavor:
  chua: 0.5
  ngot: 7
  man: 6
  cay: 1.5
  thom: 8.5
flavorNote: >-
  **Chuẩn vị:** mặn dịu đi trước, **ngọt béo mùi dừa** ôm theo liền, hậu
  cay ấm của tiêu đọng cuối lưỡi — sốt trắng ngà phải quánh tới mức bám
  lưng muỗng.
storyEyebrow: Chuyện nồi tôm rim
storyTitle: Món tủ của **bếp nhà xứ dừa**
story:
  - >-
    Về Bến Tre chơi một bữa là hiểu câu người ta hay đùa: **cây dừa lo từ
    đầu tới cuối bữa cơm** — củi dừa chụm bếp, cơm dừa nạo vắt cốt, nước
    dừa kho thịt, tráng miệng có kẹo dừa. Trong cái "gia tài dừa" đó, dĩa
    tôm rim nước cốt dừa là món mặn được cưng nhất mâm: tôm đỏ au nằm gọn
    trong lớp sốt trắng ngà, chưa ăn đã thơm béo tới mũi.
  - >-
    Phải nói rõ kẻo lẫn: món này rim bằng **nước cốt dừa** — thứ nước
    trắng đục béo ngậy vắt ra từ cơm dừa nạo — chứ không phải nước dừa
    tươi trong vắt mình hay uống. Cũng vì rim bằng cốt nên cái khéo nằm
    trọn ở **ngọn lửa liu riu**: đủ nhỏ để nước cốt sánh dần thành lớp
    keo mịn màng, còn nóng vội lửa lớn là cốt dừa tách dầu, công sức đổ
    sông đổ biển.
  - >-
    Còn lại thì món này dễ ơi là dễ: một mớ **tôm đất con nhỏ mà ngọt
    lịm**, chén nước cốt, bốn chục phút là xong. Không cần dịp gì hết —
    chiều đi chợ gặp mớ tôm đất còn búng tanh tách là đủ lý do để bữa cơm
    nhà nay có "một góc Bến Tre".

