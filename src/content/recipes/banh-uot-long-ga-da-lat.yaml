stepsEyebrow: Vô bếp thôi!
stepsTitle: 5 bước ra **tô bánh ướt lòng gà**
stepsLead: >-
  Bốn bước đầu cứ thong thả, riêng bước xào lòng thì phải chuẩn bị sẵn hết mọi
  thứ bên cạnh bếp rồi mới bật lửa — nó chỉ kéo dài chừng hai ba phút.
steps:
  - title: Làm sạch bộ lòng — kỹ chứ đừng vội
    icon: knife
    minutes: 15 phút
    intro: "Lòng sạch hay không quyết định tô bánh thơm hay tanh:"
    bullets:
      - label: "Ruột non:"
        text: >-
          lộn trái, **tuốt sạch bằng sống dao** rồi bóp với muối hột và nước cốt
          chanh, rửa lại 3–4 nước tới khi hết nhớt và nước rửa trong.
      - label: "Mề gà:"
        text: >-
          bổ đôi, **lột bỏ lớp màng vàng cứng bên trong** (chỗ này để lại là
          đắng), cạo sạch, bóp muối rồi rửa.
      - label: "Gan và tim:"
        text: >-
          gan cắt bỏ phần gân trắng, ngâm nước muối loãng **10 phút**; tim bổ
          đôi, nặn bỏ máu đông bên trong.
      - label: "Chần sơ:"
        text: >-
          bắc nồi nước sôi thả **gừng đập dập**, cho hết lòng vào chần **đúng 1
          phút**, vớt ra **ngâm ngay nước lạnh**. Lòng săn lại, giòn hơn, và
          hết hẳn mùi.
    callout:
      type: warn
      text: >-
        Lớp màng vàng trong mề gà là chỗ nhiều người bỏ sót. Nó dai và **đắng
        gắt**, chỉ một mảnh sót lại là cả tô bánh có vị lạ mà không biết tại
        đâu.
    timer:
      secs: 60
      label: Hẹn giờ chần lòng · 01:00
      doneMsg: Vớt lòng ra ngâm nước lạnh liền cho giòn!
  - title: Thái & ướp — mỗi thứ một cỡ
    icon: knife
    minutes: 10 phút
    bullets:
      - label: "Thái theo độ dai:"
        text: >-
          **mề thái lát mỏng** (dai nhất, thái mỏng cho nhanh chín), **tim bổ
          đôi**, **gan thái miếng dày cỡ 1 cm**, **ruột non cắt khúc 3 cm**.
      - label: "Ướp:"
        text: >-
          xóc đều với hành tím tỏi băm, [[1|muỗng canh]] nước mắm, ½ muỗng cà
          phê tiêu. **Ướp đúng 10 phút** — lâu hơn là lòng ra nước, xào không
          giòn nổi.
      - label: "Để riêng từng thứ:"
        text: >-
          quan trọng: **để mề, tim, gan, ruột non ra bốn chén riêng**. Lát nữa
          cho vào chảo theo thứ tự, không đổ chung một lượt.
  - title: Pha nước mắm & trộn gà xé
    icon: bottle
    minutes: 8 phút
    bullets:
      - text: >-
          Hòa [[2|muỗng canh]] đường vào [[150|ml]] nước ấm cho tan, thêm
          [[3|muỗng canh|frac]] nước mắm. Để nguội rồi mới vắt chanh và thả tỏi
          ớt băm.
      - text: >-
          Nếm phải **mặn ngọt rõ, chua nhẹ, loãng** — vì chan cả tô chứ không
          phải chấm.
      - text: >-
          Thịt gà xé sợi, trộn với **một nửa chỗ rau răm thái nhỏ** và chút
          tiêu. Nửa rau răm còn lại để rắc mặt tô.
  - title: Xào lòng — hai ba phút, đứng canh
    icon: flame
    minutes: 5 phút
    intro: >-
      Bày sẵn bốn chén lòng, chén hành tây, muỗng nước mắm ngay cạnh bếp rồi mới
      bật lửa. Từ lúc này trở đi không kịp đi lấy gì nữa:
    bullets:
      - label: "Chảo thật nóng:"
        text: >-
          bắc chảo lửa lớn, cho dầu, phi thơm chỗ hành tỏi băm còn lại. Chảo
          phải **nóng tới mức thả miếng lòng vào nghe xèo mạnh**.
      - label: "Mề trước:"
        text: >-
          trút mề vào đảo nhanh **khoảng 1 phút** — mề dai nhất nên cần nhiều
          thời gian nhất.
      - label: "Tim, rồi ruột non:"
        text: >-
          cho tim vào đảo **30 giây**, tiếp ruột non đảo **30 giây** nữa.
      - label: "Gan và hành tây sau cùng:"
        text: >-
          cho gan và hành tây vào, đảo **30 giây**, nêm lại chút nước mắm rồi
          **tắt bếp ngay**. Gan chín rất nhanh và nát rất nhanh.
      - label: "Nhìn là biết:"
        text: >-
          mề **cong mép**, gan **vừa hết màu đỏ ở giữa**, hành tây còn hơi
          trong là đạt. Cả mẻ gói gọn trong **2–3 phút**.
    callout:
      type: warn
      text: >-
        Đây là chỗ hỏng nhiều nhất. Lòng xào quá tay **dai như cao su và ra
        nước**, chảo từ xào thành luộc. Thà nhấc xuống sớm mươi giây — nhiệt còn
        lại trong chảo vẫn nấu chín tiếp.
    timer:
      secs: 180
      label: Hẹn giờ xào lòng · 03:00
      doneMsg: Mề cong mép, gan vừa hết đỏ — tắt bếp ngay!
  - title: Múc tô & chan
    icon: bowl
    minutes: 5 phút
    bullets:
      - text: >-
          Bánh ướt cắt miếng vừa gắp, cho vào **tô sâu hoặc dĩa lòng sâu** —
          đúng kiểu phố núi, để giữ hơi ấm và chứa được nước mắm.
      - text: >-
          Xếp **gà xé trộn rau răm** lên trước, rồi trút **lòng xào còn nóng**
          phủ lên trên cùng.
      - text: >-
          Rắc hành phi, hành lá, phần rau răm còn lại, và **rắc tiêu rộng
          tay**. Chan 2–3 muỗng nước mắm quanh tô rồi trộn nhẹ, ăn liền khi còn
          ấm.
    callout:
      type: tip
      text: >-
        Trộn từ dưới lên chứ đừng khuấy vòng tròn — lá bánh ướt mềm, khuấy mạnh
        là nát thành hồ. Xới nhẹ vài nhịp cho nước mắm thấm đều là đủ.
    doneText: Tô bánh ướt lòng gà bốc khói — xong!

tipsTitle: 6 bí quyết **lòng giòn, tô bánh thơm**
tipsLead: >-
  Món này chỉ có hai chỗ phải cẩn thận: khâu làm sạch và khâu xào. Sáu điều
  dưới đây chia đều cho hai chỗ đó.
tips:
  - icon: alert
    title: Lột màng vàng trong mề
    text: >-
      Lớp màng cứng màu vàng bên trong mề gà vừa dai vừa **đắng gắt**. Bổ đôi
      mề, lột bỏ hẳn lớp đó rồi mới rửa — sót một mảnh là cả tô có vị lạ.
  - icon: ginger
    title: Chần với gừng, rồi ngâm nước lạnh
    text: >-
      Một phút nước sôi có gừng làm lòng **săn, giòn và sạch mùi**; ngâm nước
      lạnh ngay sau đó khóa lại độ giòn. Bỏ bước này thì xào ra lòng mềm và còn
      mùi.
  - icon: knife
    title: Bốn chén riêng, cho vào theo thứ tự
    text: >-
      **Mề → tim → ruột non → gan.** Đổ chung một lượt thì hoặc mề còn sượng
      hoặc gan đã nát. Đây là toàn bộ nghề của món.
  - icon: flame
    title: Chảo phải nóng già trước khi thả lòng
    text: >-
      Chảo chưa đủ nóng thì lòng **ra nước và luộc trong nước của chính nó**,
      mất hết độ giòn. Thả miếng đầu tiên phải nghe xèo mạnh mới đúng.
  - icon: clock
    title: Ướp đúng mười phút
    text: >-
      Ướp lâu cho "thấm" là sai với món này: muối kéo nước ra khỏi miếng lòng,
      xào lên vừa dai vừa nhạt. Mười phút là đủ, và nêm lại lúc gần tắt bếp.
  - icon: herb
    title: Rau răm chia làm hai lượt
    text: >-
      Một nửa trộn với gà xé cho ngấm, một nửa rắc lên mặt lúc dọn để giữ mùi
      tươi. Rắc hết một lượt lúc đầu thì tới lúc ăn mùi đã bay gần hết.

serve:
  title: Dọn tô **kiểu sáng phố núi**
  paras:
    - >-
      Món này ăn **bằng muỗng, trong tô sâu**, chứ không gắp từng miếng như dĩa
      bánh ướt miền xuôi. Nước mắm chan xâm xấp đáy tô, mỗi muỗng xúc lên có đủ
      lá bánh, gà xé, miếng lòng và nhúm rau răm.
    - >-
      Buổi sáng lạnh thì rắc tiêu rộng tay hơn thường ngày, và dọn kèm **chén
      ớt xanh dầm nước mắm** cho ai ăn cay. Uống ly trà nóng là đủ ấm cả buổi
      sáng.
    - >-
      Luộc con gà cho món này thì đừng bỏ nước luộc — để dành nấu **cháo gà**
      hay **miến gà** là ra thêm một bữa nữa. Còn nếu thích lá bánh ướt kiểu
      dĩa trộn thì qua **bánh ướt chả lụa** miền Nam, hay **bánh ướt tôm chấy**
      kiểu Huế.
  aside:
    title: Trong tô bánh phố núi
    intro: "Bốn thứ làm nên tô bánh này:"
    items:
      - icon: meat
        text: "**Lòng gà xào giòn** — mề sần sật, gan bùi, ruột non tanh tách."
      - icon: herb
        text: "**Rau răm** — cay ấm, chia hai lượt, không thay bằng rau khác."
      - icon: pepper
        text: "**Tiêu rắc rộng tay** — thứ làm tô bánh ấm bụng buổi sáng lạnh."
      - icon: bottle
        text: "**Nước mắm chan loãng** — xâm xấp đáy tô, không phải chén chấm."

faq:
  - q: Không thích ăn lòng thì làm sao?
    a: >-
      Bỏ hẳn phần lòng, tăng **thịt gà xé lên [[500|g]]** là ra một tô bánh ướt
      gà xé rất ngon, vẫn giữ nguyên rau răm, hành phi, tiêu và nước mắm chan.
      Chỉ mất phần sần sật, còn lại đủ cả.
  - q: Bộ lòng mua ở đâu, chọn thế nào?
    a: >-
      Hàng gà nào ngoài chợ cũng có bán riêng bộ lòng. Chọn **mề chắc tay, mặt
      ngoài hồng nhạt**; **gan nâu đỏ bóng, không xỉn hay bở**; **ruột non
      trắng ngà, không nhớt vàng**. Mua buổi sáng sớm là tươi nhất.
  - q: Sao lòng xào ra nước, thành luộc?
    a: >-
      Ba nguyên nhân, theo thứ tự hay gặp: **chảo chưa đủ nóng** → **đổ hết vào
      cùng lúc** (chảo tụt nhiệt) → **ướp quá lâu** nên lòng đã ngậm muối và
      nhả nước. Chảo nóng già, chia đợt, ướp mười phút là hết.
  - q: Dùng bánh ướt mua sẵn được không?
    a: >-
      Được, và tiện hơn nhiều. Mua bịch **còn ấm, lá rời nhau**, về **hấp lại
      3–4 phút** hoặc trụng nhanh qua nước sôi cho mềm mướt rồi cắt miếng. Muốn
      tự tráng thì xem phần bột và cách tráng ở bài **bánh ướt chả lụa**.
  - q: Món này khác bánh ướt miền Nam chỗ nào?
    a: >-
      Khác cả thứ phủ lẫn cách dọn. Miền Nam dọn **dĩa phẳng**, phủ chả lụa
      thái sợi và giá trụng, chan mắm chua ngọt, ăn nguội bớt. Phố núi dọn **tô
      sâu**, phủ lòng gà xào nóng và gà xé, nặng tiêu và rau răm, ăn lúc còn
      ấm cho hợp trời lạnh.
  - q: Làm trước được phần nào?
    a: >-
      Làm sạch lòng, chần sơ, thái và để riêng bốn chén — **tất cả làm được từ
      tối hôm trước**, cất ngăn mát. Thịt gà cũng luộc trước được. Sáng ra chỉ
      còn pha nước mắm và xào lòng, đúng ba phút.

