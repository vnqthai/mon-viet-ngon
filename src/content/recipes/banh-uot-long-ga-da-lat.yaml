title: Bánh ướt lòng gà **phố núi — lòng xào giòn sần sật, ăn trong tô sâu**
summary: >-
  Đặc sản Đà Lạt ăn cho ấm người: lá bánh ướt còn nóng cắt miếng vào **tô sâu**,
  phủ lòng gà xào giòn sần sật và thịt gà xé, rắc rau răm với tiêu, chan muỗng
  nước mắm mặn ngọt. Cả món ăn thua ở **hai phút xào lòng** — quá tay một chút
  là dai.
region: Tây Nguyên
