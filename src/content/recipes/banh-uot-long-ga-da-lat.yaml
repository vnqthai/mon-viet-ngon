quick:
  ingredients:
    - Bánh ướt [[500|g]] — tráng ở nhà hoặc mua bịch còn ấm ngoài chợ
    - >-
      Bộ lòng gà [[400|g]] (mề, gan, tim, ruột non) · thịt gà luộc xé
      [[250|g]]
    - Hành tây [[0.5|củ|frac]] · hành tím [[4|củ]] · tỏi [[3|tép]] · gừng [[1|nhánh]]
    - Rau răm [[1|nắm]] · hành lá · hành phi · tiêu xay
    - >-
      Nước mắm chan: nước mắm [[3|muỗng canh|frac]] · đường
      [[2|muỗng canh]] · nước ấm [[150|ml]] · chanh, tỏi ớt
  steps:
    - >-
      Làm sạch lòng: **bóp muối hột với chanh**, tuốt ruột non, lột màng vàng
      trong mề, rửa lại nhiều nước cho hết nhớt.
    - >-
      Chần lòng qua nước sôi có **gừng đập dập** chừng 1 phút, vớt ra ngâm nước
      lạnh — lòng giòn và hết mùi.
    - >-
      Thái mề lát mỏng, tim bổ đôi, gan thái miếng, ruột non cắt khúc; ướp sơ
      với hành tỏi, chút nước mắm và tiêu.
    - >-
      **Chảo thật nóng**, xào mề trước, tim theo sau, gan và ruột non sau cùng
      — cả mẻ chỉ chừng **2–3 phút** rồi tắt bếp ngay.
    - Pha nước mắm mặn ngọt loãng; xé thịt gà, trộn với rau răm thái nhỏ.
    - >-
      Bánh ướt cắt miếng cho vào tô sâu, xếp gà xé rồi lòng xào lên trên, rắc
      hành phi, rau răm, tiêu, chan nước mắm rồi trộn.
  warning: >-
    Xào lòng quá tay là **dai như cao su**, không cách nào cứu. Thấy mề vừa
    cong mép, gan vừa hết đỏ là nhấc chảo xuống ngay — nhiệt còn lại sẽ nấu
    chín nốt.

flavor:
  chua: 3.5
