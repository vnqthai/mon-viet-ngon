flavorNote: >-
  **Chuẩn vị:** miếng mề **sần sật bật lại dưới răng**, gan bùi mềm, ruột non
  giòn tanh tách; lá bánh còn ấm mềm mướt bên dưới. Nghe rõ mùi **rau răm và
  tiêu** thì mới ra tô bánh phố núi.

storyEyebrow: Chuyện tô bánh
storyTitle: Tô bánh ướt **ăn cho ấm** của xứ lạnh
story:
  - >-
    Đà Lạt sáng nào cũng lạnh, nên món quà sáng ở đây khác hẳn miền xuôi: người
    ta **không dọn ra dĩa mà múc vào tô sâu**, chan nước mắm cho xâm xấp, ăn
    bằng muỗng như ăn một tô nóng. Cùng là lá bánh ướt đó, mà dọn kiểu này thì
    giữ được hơi ấm lâu hơn nhiều.
  - >-
    Thứ phủ lên cũng là thứ của vùng: **lòng gà**. Gà thả vườn xứ này thịt săn,
    bộ lòng nhỏ mà chắc; luộc con gà lấy thịt xé thì còn nguyên bộ lòng, xào
    lên là ra món. Nên tô bánh ướt lòng gà thật ra là cách **tận dụng trọn vẹn
    một con gà** — thịt một đường, lòng một đường, nước luộc thì để dành.
  - >-
    Chỗ khó duy nhất nằm ở cái chảo. Lòng gà chín rất nhanh, mà mỗi bộ phận lại
    chín một tốc độ: **mề dai nhất nên vào trước, gan mềm nhất nên vào sau
    cùng**. Cho hết vào một lượt thì hoặc mề còn sượng, hoặc gan đã nát. Biết
    thứ tự đó rồi thì món này thành dễ.

