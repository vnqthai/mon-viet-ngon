heroEyebrow: Bát miến nóng, khói bay ngang mặt…

quick:
  ingredients:
    - Gà ta [[1|con|frac]] (1,2–1,5 kg) — hoặc [[800|g]] đùi góc tư nếu nấu gọn
    - Miến dong [[200|g]] — sợi suôn nhỏ, **màu xám nhạt hơi đục**
    - Mộc nhĩ [[30|g]] · nấm hương [[20|g]] — ngâm nở, thái sợi
    - Bộ lòng gà [[1|bộ]] (tùy chọn) — mề, tim, gan, tràng
    - Gừng [[1|củ]] · hành tím [[4|củ]] nướng xém · hành tây [[1|củ]]
    - "Nêm: muối [[2|thìa cà phê|frac]] · nước mắm [[2|thìa canh|frac]] · tiêu"
    - "Rắc: hành hoa · rau răm · hành phi"
  steps:
    - Gà chà muối gừng cho sạch; nướng xém gừng và hành tím rồi cạo vỏ cháy.
    - Luộc gà từ **nước lạnh** với gừng hành nướng — sôi hớt bọt, hạ **liu riu 25 phút**, tắt bếp ủ 10 phút.
    - Vớt gà ngâm nước đá, **xé tay theo thớ**; bộ xương trả lại nồi ninh tiếp cho ngọt.
    - Mộc nhĩ, nấm hương ngâm nở thái sợi, **xào riêng** với hành tím cho thơm và ráo.
    - Miến dong ngâm **nước lạnh 10–15 phút** rồi cắt khúc — tuyệt đối không ngâm nước nóng.
    - Nêm nước dùng, trụng miến **10–15 giây** trong chính nồi nước dùng, xếp tô, chan sôi già, rắc rau răm + hành phi.
  warning: >-
    Miến dong nở rất nhanh. **Ngâm nước nóng hoặc trụng quá 20 giây là nhũn
    nát**, tô miến biến thành tô cháo — sợi miến ngon phải còn dai khi húp
    tới muỗng cuối.

