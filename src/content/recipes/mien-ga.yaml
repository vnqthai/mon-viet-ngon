title: Miến gà **sợi dai bóng mướt, nước ngọt thanh nhẹ bụng**
summary: >-
  Tô miến gà kiểu Bắc: **sợi miến dong trong mờ, dai mà mềm**, gà ta xé tay
  từng thớ, thêm mộc nhĩ giòn sựt với nấm hương thơm ngầm, rắc rau răm the
  the. Nhẹ bụng hơn tô phở mà vẫn ấm người — bữa sáng hay bữa khuya đều hợp.
region: Miền Bắc
category: Món nước
occasions: [Bữa sáng, Cho bé]
pubDate: 2026-07-29
