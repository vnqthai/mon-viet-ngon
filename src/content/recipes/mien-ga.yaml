flavorNote: >-
  **Chuẩn vị:** nước dùng trong, ngọt thanh của gà chứ không đậm gắt; sợi
  miến **trong mờ, cắn thấy dai mà không cứng**; mộc nhĩ giòn sựt cắt ngang
  cái mềm của thịt gà xé.
storyEyebrow: Chuyện bát miến gà
storyTitle: Sợi miến làm từ **củ dong riềng**
story:
  - >-
    Miến gà là món "anh em họ" của phở gà, nhưng gốc gác sợi thì khác hẳn.
    Bánh phở làm từ gạo, còn **miến dong kéo từ tinh bột củ dong riềng** —
    thứ củ trồng ở vùng trung du, đào lên mài lấy bột, lọc rồi tráng phơi
    thành sợi. Vì vậy sợi miến không trắng đục như bánh phở mà **xám nhạt,
    hơi trong**, nấu lên thì bóng mướt và dai, húp vào nhẹ bụng hơn hẳn.
  - >-
    Trong bếp Bắc, miến là sợi của những dịp cần **nhẹ mà tinh**: bát miến
    gà cho đứa nhỏ biếng ăn, cho bữa khuya không muốn nặng bụng, cho những
    hôm chỉ thèm ăn nhẹ mà vẫn phải có miếng thịt trong tô. Bát miến đúng
    kiểu không cần nhiều thứ — con gà ta, nắm mộc
    nhĩ, mấy cánh nấm hương, thế là đủ. Cái ngon nằm ở chỗ **ba kết cấu chạm
    nhau trong một muỗng**: sợi miến dai, thịt gà mềm, mộc nhĩ giòn sựt.
  - >-
    Cũng nhờ vậy mà nấu miến gà không phải là làm lại phở gà. Nồi nước dùng
    ở đây **không quế hồi, không hạt mùi, không lá chanh** — chỉ hành gừng
    nướng và chính con gà. Càng ít gia vị thì con gà càng phải tới nơi, và
    nồi nước càng phải trong. Đổi lại, món này **nấu gọn hơn phở gà một
    tiếng đồng hồ**.

