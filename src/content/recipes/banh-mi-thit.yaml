heroEyebrow: Ổ bánh mì cầm tay, cả nước ăn sáng…

quick:
  ingredients:
    - Bánh mì ổ [[4|ổ]] — loại vỏ mỏng ruột rỗng, mua sáng nào ăn sáng đó
    - >-
      Đồ chua: cà rốt [[1|củ]] + củ cải trắng [[200|g]] · giấm
      [[100|ml]] · đường [[80|g]] · muối 1 muỗng cà phê · nước ấm [[100|ml]]
    - >-
      Pate gan heo: gan heo [[250|g]] · thịt ba chỉ [[150|g]] · hành tây
      [[0.5|củ|frac]] · tỏi [[4|tép]] · sữa tươi không đường [[150|ml]] ·
      ruột bánh mì [[40|g]]
    - >-
      Bơ trứng: lòng đỏ trứng [[1|cái]] · dầu ăn [[150|ml]] · nước cốt chanh
      [[1|muỗng cà phê]] · chút muối, đường
    - >-
      Nhân kẹp: chả lụa [[200|g]] · thịt nguội hoặc xíu mại [[150|g]] · dưa
      leo [[1|trái]] · ngò rí, hành lá · nước tương, tiêu, ớt
  steps:
    - >-
      Ngâm đồ chua trước tiên — bào sợi, bóp muối, vắt ráo rồi ngâm nước giấm
      đường, **để tối thiểu 1 giờ**.
    - >-
      Hấp pate: xay gan + thịt + hành tỏi với sữa và ruột bánh, hấp cách thủy
      **45 phút** rồi để nguội hẳn cho đông lại.
    - Đánh bơ trứng — nhỏ dầu **từng giọt một** lúc đầu, đặc lại rồi mới rót thành dòng.
    - >-
      Hâm ổ bánh: xịt sương nước lên vỏ, nướng **200°C trong 4–5 phút** cho vỏ
      giòn tan trở lại.
    - >-
      Rạch ổ bánh chừa sống lưng, **phết pate rồi tới bơ trứng**, xếp chả và
      thịt, nhét đồ chua vắt ráo, dưa leo, ngò.
    - Rưới chút nước tương, rắc tiêu, thả lát ớt — bóp nhẹ ổ bánh cho nhân bám rồi ăn liền.
  warning: >-
    Đồ chua **không vắt ráo** là hỏng cả ổ: nước chua ngấm xuống ruột bánh, mới
    cắn miếng thứ hai vỏ đã mềm oặt. Vắt tới lúc không còn nhỏ giọt mới nhét vô.

flavor:
  chua: 4
  ngot: 4
  man: 6
  cay: 2.5
  thom: 8
flavorNote: >-
  **Chuẩn vị:** cắn một miếng phải nghe **vỏ bánh vỡ giòn trước**, rồi mới tới
  béo của pate và bơ trứng, chua giòn của đồ chua đuổi theo sau. Ổ bánh mềm oặt
  hay nhân át hết vỏ đều là trật.

storyEyebrow: Chuyện ổ bánh
storyTitle: Ổ bánh **của người Việt**, không còn là bánh Tây nữa
story:
  - >-
    Bánh mì theo chân người Pháp vào Việt Nam từ thế kỷ 19, mà hồi đó là ổ
    baguette dài, đặc ruột, ăn tại bàn với dao nĩa. Người mình đổi từ từ: ổ
    ngắn lại còn chừng gang tay, có thời còn pha thêm chút **bột gạo** cho vỏ
    mỏng giòn và ruột rỗng xốp — rỗng để làm gì thì tới năm **1958** mới rõ
    nét, khi một tiệm bánh ở Sài Gòn được cho là nơi đầu tiên nhét sẵn pate,
    chả, thịt vào giữa ổ cho khách cầm đi làm, đi học.
  - >-
    Cái ruột rỗng đó chính là chỗ ổ bánh Việt tách hẳn khỏi bánh mì kẹp phương
    Tây. Bánh kẹp Tây là **hai lát bánh úp lại**; ổ bánh mì mình là **một cái
    túi** — rạch một đường chừa sống lưng, nhồi đủ thứ vào trong mà cầm một tay
    vẫn không rớt. Nhồi được nhiều thì mới đủ chỗ cho cái công thức lạ đời của
    nó: béo Pháp (pate, bơ), mặn Hoa (thịt nguội, xíu mại), rồi rau thơm và
    chua ngọt kiểu Đông Nam Á.
  - >-
    Nên ổ bánh mì thịt không có "công thức gốc" nào để mà học thuộc. Cái đáng
    học là **bốn thứ làm sẵn** — đồ chua, pate, bơ trứng, và cách hâm cho vỏ
    giòn lại. Bốn thứ đó nằm sẵn trong tủ lạnh thì sáng nào cũng có ổ bánh mì
    nóng, mà nhân kẹp gì cũng được: chả lụa, thịt nguội, trứng ốp la, hay miếng
    thịt kho còn lại từ tối qua.

