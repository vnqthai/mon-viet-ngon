stepsEyebrow: Vô bếp thôi!
stepsTitle: 5 bước ra **ổ bánh mì thịt đủ tầng**
stepsLead: >-
  Bốn bước đầu đều là **làm sẵn để dành** — làm một lần ăn cả tuần, cất tủ lạnh
  là sáng nào cũng có bánh mì. Riêng bước cuối, ráp ổ bánh, thì phải làm ngay
  trước khi ăn, không để trước được.
steps:
  - title: Đồ chua — làm đầu tiên vì phải chờ
    icon: pod
    minutes: 15 phút (+ ngâm 1 giờ)
    intro: "Đồ chua là thứ kéo cả ổ bánh khỏi ngán, nên làm cho tử tế:"
    bullets:
      - label: "Bào sợi:"
        text: >-
          cà rốt và củ cải bào sợi **cỡ que diêm**, dài chừng 5 cm. Sợi nhuyễn
          như bào rau câu thì ngâm xong mềm nhũn, mất hết cái giòn.
      - label: "Bóp muối:"
        text: >-
          rắc [[1|muỗng cà phê]] muối, bóp nhẹ, để **10 phút** rồi **vắt thật
          ráo**. Bước này rút nước sẵn có trong rau ra — không làm thì hũ đồ
          chua loãng dần và có mùi nồng của củ cải.
      - label: "Pha nước ngâm:"
        text: >-
          hòa [[80|g]] đường vào [[100|ml]] nước ấm cho tan, để nguội rồi mới
          châm [[100|ml]] giấm. Nếm thử phải **chua rõ, ngọt đuổi theo sau**.
      - label: "Ngâm:"
        text: >-
          thả rau vào hũ, đổ ngập nước ngâm, đậy nắp. **Sau 1 giờ là ăn được**,
          để qua đêm thì thấm đều hơn; cất ngăn mát dùng được cả tuần.
    callout:
      type: tip
      text: >-
        Muốn đồ chua giòn lâu thì đừng đổ nước ngâm còn ấm vào rau — nước nóng
        làm sợi rau chín tái, hôm sau là mềm oặt.
    timer:
      secs: 3600
      label: Hẹn giờ ngâm đồ chua · 60:00
      doneMsg: Đồ chua thấm rồi — vớt ra vắt ráo là kẹp được!
  - title: Pate gan heo hấp cách thủy
    icon: meat
    minutes: 20 phút (+ hấp 45 phút)
    intro: >-
      Đây là bước dài nhất, nhưng làm một mẻ ăn cả tuần. Ai bận thì mua pate
      ngon sẵn cũng chẳng ai trách:
    bullets:
      - label: "Khử hăng gan:"
        text: >-
          gan thái lát mỏng, **ngâm trong sữa tươi 20 phút** rồi rửa lại, để
          ráo. Sữa kéo hết mùi hăng của gan mà không làm gan bở.
      - label: "Phi thơm:"
        text: >-
          hành tây + tỏi băm phi vàng với chút dầu, trút ra. Cùng chảo đó xào
          sơ thịt ba chỉ thái nhỏ cho ra mỡ, rồi cho gan vào đảo **vừa chín
          tái mặt ngoài** là tắt bếp.
      - label: "Xay:"
        text: >-
          cho tất cả vào máy xay cùng [[40|g]] ruột bánh mì đã ngâm
          [[150|ml]] sữa, nêm [[1|muỗng cà phê]] muối + ½ muỗng cà phê tiêu.
          Xay **thật nhuyễn**, mịn tới mức nhấc muỗng lên thấy chảy thành dòng.
      - label: "Hấp:"
        text: >-
          đổ vào khuôn hoặc tô sứ, bọc kín mặt bằng giấy bạc, **hấp cách thủy
          45 phút** lửa vừa. Xăm que tăm vào giữa rút ra không dính là chín.
      - label: "Để nguội hẳn:"
        text: >-
          pate mới hấp còn mềm, phải **để nguội rồi cất ngăn mát ít nhất 3
          giờ** mới đông lại thành khối phết được.
    callout:
      type: warn
      text: >-
        Đừng bỏ qua miếng ruột bánh ngâm sữa. Nó giữ nước và mỡ lại trong khối
        pate; thiếu nó là hấp xong pate **tách một lớp dầu vàng** trên mặt, ăn
        bở và ngán.
    timer:
      secs: 2700
      label: Hẹn giờ hấp pate · 45:00
      doneMsg: Xăm tăm thử coi — rút ra khô là pate chín rồi!
  - title: Đánh bơ trứng — nhỏ dầu từng giọt
    icon: egg
    minutes: 10 phút
    intro: >-
      Bơ trứng là thứ làm ổ bánh mì Việt khác hẳn bánh kẹp Tây: béo mà nhẹ, mặn
      ngọt vừa, quét lên là dính hết nhân lại với nhau:
    bullets:
      - label: "Bắt đầu:"
        text: >-
          lòng đỏ + chút muối + chút đường vào tô sâu, đánh cho lòng đỏ nhạt
          màu và hơi bông.
      - label: "Nhỏ dầu:"
        text: >-
          **nhỏ dầu từng giọt một** trong lúc đánh liên tục — chừng 3 muỗng
          canh đầu là giai đoạn quyết định. Khi hỗn hợp đặc lại rõ, sánh như
          kem, mới rót dầu thành dòng nhỏ.
      - label: "Hoàn thiện:"
        text: >-
          đánh tới khi hết [[150|ml]] dầu, cuối cùng cho
          [[1|muỗng cà phê]] nước cốt chanh, đánh thêm vài vòng. Bơ trứng đạt
          là **nhấc que lên tạo chóp mềm**, không chảy tuột.
    callout:
      type: warn
      text: >-
        Lỡ tách dầu (hỗn hợp lợn cợn, dầu nổi lên) thì **đừng đổ đi**: lấy tô
        khác, đập một lòng đỏ mới, rồi nhỏ từ từ cái hỗn hợp hỏng đó vào như
        nhỏ dầu. Chín trên mười lần là cứu được.
  - title: Hâm ổ bánh — bước ai cũng bỏ, mà quyết định tất cả
    icon: flame
    minutes: 5 phút
    bullets:
      - label: "Xịt sương:"
        text: >-
          **xịt hoặc vẩy chút nước lên vỏ ổ bánh** cho hơi ẩm mặt ngoài. Nghe
          ngược đời mà đúng: nước bốc hơi trong lò sẽ kéo vỏ giòn trở lại, còn
          ruột thì mềm ẩm.
      - label: "Nướng:"
        text: >-
          lò hoặc nồi chiên không dầu **200°C trong 4–5 phút**. Không có lò thì
          để ổ bánh lên chảo khô, đậy nắp, lửa nhỏ, trở đều chừng 3 phút.
      - label: "Nghe tiếng:"
        text: >-
          ổ bánh đạt là **gõ ngón tay nghe cồm cộp**, bóp nhẹ nghe vỏ răng rắc.
          Còn mềm thì nướng thêm một phút.
      - label: "Rạch bánh:"
        text: >-
          để nguội chừng một phút rồi rạch **một đường dọc, chừa sống lưng** —
          đừng cắt đứt đôi, ổ bánh phải còn là cái túi mới giữ được nhân.
    callout:
      type: tip
      text: >-
        Bánh mua từ sáng, tới chiều đã dai? Đúng bước này là cứu được y như ổ
        mới ra lò. Chỉ có ổ đã mềm ỉu vì đựng trong bọc ni lông kín thì chịu —
        bánh mì phải để trong bao giấy.
    timer:
      secs: 300
      label: Hẹn giờ hâm bánh · 05:00
      doneMsg: Gõ thử coi — nghe cồm cộp là giòn rồi, lấy ra rạch bánh!
  - title: Ráp ổ bánh — thứ tự có lý của nó
    icon: knife
    minutes: 5 phút
    intro: >-
      Xe bánh mì nào cũng xếp theo một thứ tự, và thứ tự đó không phải ngẫu
      nhiên — mỗi lớp che cho lớp sau khỏi làm ướt bánh:
    bullets:
      - label: "Pate trước, sát ruột bánh:"
        text: >-
          quét pate lên **mặt dưới**, dày mỏng tùy ý. Lớp béo này là cái áo mưa
          — nó ngăn nước từ đồ chua và nước tương thấm xuống ruột bánh.
      - label: "Bơ trứng lên mặt trên:"
        text: >-
          quét bơ trứng lên nắp bánh. Tách hai thứ béo ra hai mặt thì cắn miếng
          nào cũng gặp cả hai.
      - label: "Chả và thịt:"
        text: >-
          xếp chả lụa và thịt nguội **trải đều suốt chiều dài ổ**, đừng dồn cục
          ở giữa — dồn giữa thì hai đầu ổ bánh cắn vào chỉ có bánh không.
      - label: "Đồ chua vắt ráo:"
        text: >-
          gắp đồ chua lên rây, **ép cho hết nước** rồi mới nhét vào. Chỗ này là
          nơi hỏng ổ bánh nhiều nhất.
      - label: "Rau và nêm cuối:"
        text: >-
          nhét thanh dưa leo, nhánh ngò rí; rưới chút nước tương, rắc tiêu, thả
          lát ớt. **Bóp nhẹ ổ bánh một cái** cho nhân nén lại rồi ăn liền.
    callout:
      type: tip
      text: >-
        Gói ổ bánh trong miếng giấy, xoắn nhẹ một đầu — vừa cầm gọn vừa giữ
        nóng. Đúng kiểu ổ bánh cầm tay ăn dọc đường.
    doneText: Ổ bánh mì nóng giòn trên tay — xong!

tipsTitle: 7 bí quyết **ổ bánh mì không bị ỉu**
tipsLead: >-
  Bánh mì thịt hỏng thì hầu như không phải vì nhân dở, mà vì cái vỏ. Bảy điều
  dưới đây xoay quanh đúng chuyện đó.
tips:
  - icon: flame
    title: Xịt nước rồi mới nướng
    text: >-
      Vỏ bánh giòn là do lớp ngoài khô nhanh hơn ruột. Xịt sương nước rồi nướng
      **200°C 4–5 phút** tái lập đúng chênh lệch đó — ổ để từ sáng vẫn giòn lại
      như mới ra lò.
  - icon: drop
    title: Vắt đồ chua tới lúc không nhỏ giọt
    text: >-
      Đây là lỗi phổ biến nhất. Nước chua ngấm xuống ruột bánh thì chỉ vài phút
      sau là **ổ bánh mềm oặt từ trong ra**, không cứu được nữa.
  - icon: meat
    title: Pate quét sát ruột bánh
    text: >-
      Lớp pate béo đóng vai **áo mưa** cho ruột bánh. Quét pate lên trên rồi để
      đồ chua nằm sát ruột là làm ngược, ổ bánh ướt nhanh gấp đôi.
  - icon: egg
    title: Bơ trứng — ba muỗng dầu đầu quyết định
    text: >-
      Nhỏ **từng giọt** cho tới khi hỗn hợp đặc rõ. Rót ào một lần ngay từ đầu
      là tách dầu chắc chắn, không cách nào đánh lại cho đặc.
  - icon: knife
    title: Chừa sống lưng, đừng cắt đứt
    text: >-
      Ổ bánh mì Việt phải còn là **một cái túi**. Cắt đứt đôi thành hai lát úp
      lại là nhân rớt ra khi cầm, và mất luôn cái thú cắn xuyên qua đủ tầng.
  - icon: basket
    title: Trải nhân suốt chiều dài ổ
    text: >-
      Dồn nhân ở giữa cho "nhìn đầy" là hai đầu ổ bánh cắn vào **chỉ có bánh
      không**. Trải mỏng mà đều, miếng nào cũng đủ vị.
  - icon: clock
    title: Bốn thứ làm sẵn, ráp trong 5 phút
    text: >-
      Đồ chua để được cả tuần, pate 4–5 ngày, bơ trứng 2–3 ngày trong ngăn mát.
      Cuối tuần làm một lượt thì sáng nào cũng có bánh mì nóng, **ráp đúng 5
      phút**.

serve:
  title: Dọn ổ bánh **kiểu xe bánh mì đầu hẻm**
  paras:
    - >-
      Bánh mì thịt không có mâm, không có chén — nó là món **cầm một tay**, gói
      giấy xoắn một đầu, ăn đứng cũng được mà ăn trên đường đi làm cũng được.
      Đó là toàn bộ lý do nó thành món ăn sáng của cả nước.
    - >-
      Ở nhà thì bày hơi khác: dọn cái mâm giữa bàn có rổ bánh vừa nướng, hũ đồ
      chua, khay pate, chén bơ trứng, dĩa chả thái sẵn — **ai muốn kẹp gì thì
      kẹp**. Nhà có con nít thì bỏ ớt ra riêng, đứa nào ăn cay thì tự thả.
    - >-
      Ăn kèm ly cà phê sữa đá là đúng bài sáng Sài Gòn. Còn muốn đổi ổ khác thì
      qua **bánh mì chả cá** thơm mùi biển, hay **bánh mì heo quay** giòn da —
      cùng bốn thứ làm sẵn đó, chỉ đổi cái nhân chính.
  aside:
    title: Bốn thứ nên có sẵn trong tủ
    intro: "Có đủ bốn thứ này thì sáng nào cũng ráp được ổ bánh:"
    items:
      - icon: pod
        text: "**Hũ đồ chua** — để được cả tuần, càng ngâm càng thấm."
      - icon: meat
        text: "**Khối pate** — hấp một mẻ dùng 4–5 ngày, cắt tới đâu phết tới đó."
      - icon: egg
        text: "**Chén bơ trứng** — dùng trong 2–3 ngày, đánh lại vài vòng trước khi quét."
      - icon: bread
        text: "**Bánh mì mua sáng** — thà mua ít mà mới, đừng trữ nhiều rồi hâm mãi."

faq:
  - q: Không có lò nướng thì hâm bánh kiểu gì?
    a: >-
      Bắc chảo khô lửa nhỏ, để ổ bánh vào, **đậy nắp chừng 3 phút**, trở đều
      các mặt. Hơi nước trong ruột bánh quẩn dưới nắp làm ruột mềm lại, còn mặt
      tiếp xúc chảo thì giòn. Nồi chiên không dầu thì **200°C 4 phút** là đẹp.
  - q: Lười làm pate, mua sẵn có sao không?
    a: >-
      Chẳng sao hết, xe bánh mì nào cũng có nhà cung cấp pate riêng. Mua thì
      chọn loại **đặc, cắt ra thấy mịn, không tách dầu**; lấy ra khỏi tủ lạnh
      chừng 10 phút cho mềm rồi hãy phết, không thì miết rách ruột bánh.
  - q: Bơ trứng để được bao lâu, có thay bằng mayonnaise không?
    a: >-
      Tự đánh thì **dùng trong 2–3 ngày**, cất ngăn mát, đậy kín. Thay bằng
      mayonnaise mua sẵn cũng được nhưng vị chua hơn và ngọt hơn — muốn gần bơ
      trứng thì trộn mayonnaise với chút sữa đặc và vài giọt chanh.
  - q: Mua bánh mì thế nào cho đúng?
    a: >-
      Cầm lên thấy **nhẹ tay** là ruột rỗng, đúng loại để kẹp nhân; nặng tay là
      ruột đặc, nhét nhân không vô. Bóp nhẹ nghe vỏ răng rắc, nhìn vỏ có vết
      rạch nở bung. Và xin đựng **bao giấy**, đừng bao ni lông — bọc kín là hấp
      hơi, nửa tiếng sau vỏ mềm hết.
  - q: Kẹp được những gì ngoài chả lụa và thịt nguội?
    a: >-
      Gần như mọi thứ mặn trong tủ lạnh: **trứng ốp la**, xíu mại sốt cà, thịt
      nướng, gà xé, chả cá chiên, hay miếng thịt kho hôm qua thái lát. Giữ
      nguyên bốn thứ nền — đồ chua, pate, bơ trứng, vỏ giòn — thì đổi nhân gì
      cũng ra ổ bánh mì đàng hoàng.
  - q: Làm sẵn ổ bánh từ tối để sáng mai mang đi được không?
    a: >-
      Được, nhưng phải **tách phần ướt ra**: ráp bánh với pate, bơ trứng, chả
      thịt thôi; đồ chua, dưa leo, nước tương để riêng hộp nhỏ, tới nơi mới
      nhét vào. Ráp đủ từ tối thì sáng ra ổ bánh đã mềm nhũn.

