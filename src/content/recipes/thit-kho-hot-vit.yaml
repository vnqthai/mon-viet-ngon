title: Thịt kho hột vịt **nước dừa vàng óng**
summary: >-
  Ba rọi mềm rục, hột vịt thấm nâu, nước kho **trong veo màu hổ phách** nhờ
  nước dừa xiêm — nồi thịt kho ngày Tết mà ngày thường ăn cũng "bao ghiền".
region: Miền Nam
category: Kho
occasions: [Cho bé, Cơm nhà, Cỗ Tết]
pubDate: 2026-07-27
time:
  total: 1 giờ 30 phút
servingsBase: 4
difficulty: Vừa
featured: false
order: 29
art: thit-kho
heroEyebrow: Nghe mùi là thấy Tết…

quick:
  ingredients:
    - Ba rọi rút sườn [[800|g]] — cắt khúc vuông 4 cm
    - Hột vịt [[6|trứng]] — luộc chín, bóc vỏ
    - Nước dừa tươi [[1|lít]] (1–2 trái dừa xiêm)
    - Hành tím [[3|củ]] + tỏi [[3|tép]] băm · ớt [[2|trái]] nguyên trái
    - "Nêm: nước mắm [[4|muỗng canh|frac]] · đường [[2|muỗng canh|frac]] · tiêu, hạt nêm"
  steps:
    - Thịt chần sơ nước sôi, rửa sạch; ướp mắm – đường – hành tỏi – tiêu **30 phút**. Luộc trứng, bóc vỏ.
    - Đảo thịt trên lửa vừa cho **săn lại, ra bớt mỡ**, thơm mùi hành tỏi.
    - Châm **nước dừa ngập thịt**, sôi thì hớt bọt kỹ, hạ liu riu kho **45 phút** mở hé nắp.
    - Thả hột vịt, kho thêm **15–20 phút**, thỉnh thoảng trở trứng cho thấm đều màu.
    - Nêm lại cho **mặn ngọt cân nhau**, thả ớt nguyên trái, tắt bếp. Ăn với cơm + dưa giá / dưa cải.
  warning: >-
    Kho nước dừa mà để **lửa lớn sôi sùng sục** là nước bị chua và đục — món
    này ăn nhau ở lửa liu riu và cây kiên nhẫn.

flavor:
  chua: 0.5
  ngot: 8
  man: 7
  cay: 2
  thom: 8
flavorNote: >-
  **Chuẩn nồi thịt kho:** nước trong màu hổ phách, ngọt dịu vị dừa, mặn đằm vị
  mắm — miếng mỡ **trong veo, cắn tan không ngán**.
storyEyebrow: Chuyện nồi thịt kho
storyTitle: Nồi thịt kho — **mùi của ngày Tết**
story:
  - >-
    Ở miền Nam, 28–29 Tết mà đi ngang xóm nào cũng nghe **mùi thịt kho nước
    dừa** — cái mùi báo hiệu năm hết Tết tới còn chính xác hơn lịch. Nhà nào
    cũng kho một nồi thiệt bự, ăn lai rai mấy ngày Tết, càng hâm càng thấm
    càng ngon.
  - >-
    Bí quyết của nồi thịt kho miền Nam nằm ở **nước dừa xiêm**: vừa cho vị
    ngọt thanh không cần nhiều đường, vừa cho màu hổ phách tự nhiên đẹp tới
    mức không cần nước màu. Hột vịt kho lâu chuyển màu nâu bóng, cắn vô lòng
    đỏ bùi béo quyện nước kho — thứ mà đám nhỏ giành nhau trước tiên.

