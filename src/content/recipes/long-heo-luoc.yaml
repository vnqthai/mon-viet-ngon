flavorNote: >-
  **Chuẩn dĩa lòng luộc:** miếng lòng **trắng ngà chứ không xám**, cắn vào
  giòn sần sật rồi mới tới cái béo ngậy ở giữa. Không hôi, không đắng, không
  dai. Chén mắm tôm phải **bông sủi tăm**, dậy mùi mà vẫn dịu nhờ chanh đường.
storyEyebrow: Chuyện dĩa lòng
storyTitle: Món **đơn giản nhất mà khó nhất** — chỉ có luộc thôi

story:
  - >-
    Nghe tên thì tưởng dễ: luộc lên rồi thái ra, hết. Nhưng ai đã từng bưng
    lên một dĩa lòng dai nhách, xám xịt, ăn còn thoảng mùi khó chịu thì hiểu
    — món này **không có chỗ nào để giấu**. Không nước sốt, không gia vị
    ướp, không lửa lớn để chữa. Chỉ có miếng lòng và tay người làm.
  - >-
    Cả món ăn thua ở **ba chỗ, đúng ba chỗ thôi**. Một là làm sạch: bóp muối
    hạt với chanh cho hết nhớt, mà **tuyệt đối không lộn trái lòng non** —
    lộn ra là mất sạch phần béo ngậy bên trong, thứ làm nên miếng lòng ngon.
    Hai là canh phút luộc, mỗi loại một thời gian khác nhau. Ba là **thau
    nước đá** chờ sẵn bên cạnh bếp.
  - >-
    Cái thau nước đá đó mới là chỗ nhiều người bỏ qua nhất, mà lại quyết
    định nhiều nhất. Miếng lòng vừa vớt khỏi nồi đang nóng rẫy, thả cái ùm
    vào nước đá — **co lại đột ngột nên thớ thịt săn giòn**, đồng thời màu
    trắng sáng lên trông thấy. Không có bước này thì luộc chuẩn tới đâu,
    miếng lòng vẫn cứ mềm oặt và ngả xám.

