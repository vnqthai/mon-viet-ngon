title: Lòng heo luộc **trắng giòn sần sật, chấm mắm tôm dậy mùi**
summary: >-
  Dĩa lòng thái xéo trắng ngà, cắn vào nghe **giòn sần sật** chứ không dai
  không bở, xếp cạnh nắm húng quế với chén mắm tôm đánh bông sủi tăm. Bí
  quyết gói gọn trong hai chữ: **luộc đúng phút, thả ngay vào nước đá**.
region: Miền Bắc
category: Hấp
occasions: [Nhậu lai rai, Ăn chơi]
