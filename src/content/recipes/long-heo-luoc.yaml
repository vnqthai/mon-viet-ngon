quick:
  ingredients:
    - Lòng non [[500|g]] · dạ dày [[300|g]] · gan [[200|g]] — mua buổi sáng cho tươi
    - Muối hạt + chanh (hoặc giấm) [[2|trái]] — để bóp rửa
    - Gừng [[1|củ]] + hành tím [[3|củ]] + rượu trắng [[2|muỗng canh|frac]] — cho nồi nước luộc
    - Một thau **nước đá thật lạnh** — thứ quan trọng nhất của món
    - "Chén chấm: mắm tôm [[3|muỗng canh|frac]] · đường [[1|muỗng canh|frac]] · rượu trắng · chanh · ớt"
    - Húng quế, rau mùi, hành lá chần · vài lát khế chua và chuối chát
  steps:
    - Lòng non **tuốt sạch, không lộn trái**; bóp muối hạt + chanh 2–3 lượt, rửa kỹ.
    - Nước sôi già thả gừng đập + hành + rượu trắng. Thả **dạ dày trước 20 phút**, gan 12 phút.
    - Lòng non thả sau cùng, luộc **đúng 5–7 phút** — vớt ra là ngâm ngay **nước đá**.
    - Ngâm đá **5 phút** cho trắng và giòn; ai kỹ thì nhúng lại **nước ấm 1 phút** rồi mới thái.
    - Thái xéo miếng vừa gắp, xếp dĩa cùng rau thơm và khế chuối chát.
    - "Pha mắm tôm: mắm + đường + rượu, đánh bông rồi vắt chanh, thả ớt, rưới thìa mỡ nóng."
  warning: >-
    Luộc quá tay là **dai như cao su**, không cứu được. Lòng non chỉ **5–7
    phút**. Và bỏ khâu nước đá thì miếng lòng vừa xỉn màu vừa mất hẳn độ giòn.

flavor:
