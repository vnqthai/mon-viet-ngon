title: Cá kho tộ **lửa liu riu keo sánh**
summary: >-
  Khứa cá thấm đẫm nước màu cánh gián, tiêu cay nồng, kho trong nồi đất tới khi
  **nước kho keo lại óng ánh** — món đưa cơm số một của bếp Nam Bộ.
region: Miền Nam
category: Kho
time:
  total: 1 giờ 15 phút
servingsBase: 4
difficulty: Vừa
featured: true
order: 4
heroEyebrow: Cơm trắng chờ sẵn nghen…

quick:
  ingredients:
    - Cá lóc (hoặc cá hú, cá basa) [[700|g]] — cắt khúc dày, khử tanh kỹ
    - Thịt ba rọi [[100|g]] xắt mỏng (cho béo — bỏ qua cũng được)
    - Hành tím [[3|củ]] + tỏi [[3|tép]] băm · ớt [[2|trái]] · hành lá, tiêu
    - >-
      Ướp & kho: nước mắm [[3|muỗng canh|frac]] · đường [[2.5|muỗng canh|frac]]
      (thắng nước màu) · hạt nêm, tiêu
  steps:
    - Cá chà muối + chanh khử tanh, cắt khúc; ướp mắm – đường – hành tỏi – tiêu **30 phút**.
    - "Thắng nước màu: đường + chút nước, lửa vừa tới màu cánh gián thì tắt bếp, chế nước nóng vào."
    - Lót ba rọi đáy tộ, xếp cá lên, rưới nước màu + nước ướp, thêm nước sôi xâm xấp mặt cá.
    - Kho **lửa liu riu, mở nắp** 25–30 phút; thỉnh thoảng nghiêng nồi rưới nước kho lên mặt cá.
    - Nước kho keo sánh thì nêm lại, rắc tiêu + hành lá + ớt. Ăn nóng với thiệt nhiều cơm.
  warning: >-
    Thắng nước màu quá tay là đắng cả nồi — đường vừa chuyển cánh gián là dừng
    ngay. Và kho cá thì **đừng lật trở nhiều**, cá nát mất đẹp.

flavor:
  chua: 0.5
  ngot: 7
  man: 8
  cay: 5
  thom: 8.5
flavorNote: >-
  **Chuẩn cá kho tộ:** mặn ngọt đậm đà quyện nhau, hậu cay ấm của tiêu, miếng
  cá gắp lên phải **kéo theo sợi nước kho keo óng**.
storyEyebrow: Chuyện ơ cá kho
storyTitle: Ơ cá kho — **tri kỷ của nồi cơm**
story:
  - >-
    Nếu canh chua là "bản nhạc mở màn" của mâm cơm Nam Bộ thì cá kho tộ là
    **giọng trầm giữ nhịp**. Hai món này sinh ra để đi chung: một chua thanh
    mát, một mặn ngọt đậm đà — và ở giữa là nồi cơm trắng vơi đi nhanh tới mức
    khó tin.
  - >-
    Chữ "tộ" là cái nồi đất, cái thố sành — thứ giữ nhiệt đều và ám mùi khói
    bếp qua từng lần kho, càng kho lâu năm càng "ngọt nồi". Cá kho đúng kiểu
    phải **kho mở nắp, lửa liu riu**, để nước kho cạn từ từ mà keo lại, chớ
    không phải đậy vung um sùm cho mau.
  - >-
    Công thức này dùng cá lóc cho chắc thịt, thêm mấy lát ba rọi cho béo —
    kiểu kho "nhà giàu chút xíu" mà đám nhỏ nào cũng mê.

