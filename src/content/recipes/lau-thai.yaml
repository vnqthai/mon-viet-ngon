title: Lẩu Thái kiểu Việt **chua cay dậy sả, nhúng gì cũng hợp**
summary: >-
  Nồi lẩu chua cay quen mặt ở mọi bàn tiệc Việt: **sả, riềng, lá chanh** làm
  nền, me và chanh cho vị chua, sa tế cho cái cay đỏ. Hải sản với thịt bò
  nhúng tới đâu ăn tới đó, cuối bữa thả vắt mì vào là hết sạch nồi.
region: Cả nước
category: Lẩu
occasions: [Đãi khách, Ăn chơi]
