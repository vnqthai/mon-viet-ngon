heroEyebrow: Nồi đỏ au sôi lục bục, mùi sả bốc lên…

quick:
  ingredients:
    - Xương ống heo [[700|g]] — ninh [[2.5|lít]] nước lấy nền ngọt
    - Sả [[6|cây]] · riềng [[1|củ]] · lá chanh [[10|lá]] · tỏi [[1|củ]] · hành tím [[4|củ]]
    - Cà chua [[3|trái]] · thơm (dứa) [[0.5|trái|frac]] · nấm rơm [[200|g]]
    - Tôm sú [[400|g]] · mực [[300|g]] · nghêu [[500|g]] · thịt bò [[300|g]] thái mỏng
    - "Chua & cay: nước cốt me [[3|thìa canh|frac]] · chanh [[2|trái]] · sa tế [[2|thìa canh|frac]] · ớt"
    - "Nêm: nước mắm · đường · hạt nêm"
    - Rau nhúng — cải thảo, rau muống, nấm kim châm · bún hoặc mì gói
  steps:
    - Ninh xương [[45|phút]] lấy nước trong; hớt bọt kỹ ngay từ lúc mới sôi.
    - Phi tỏi, hành tím, **sả băm + riềng thái lát**, cho cà chua và thơm vào xào mềm.
    - Trút chỗ xào vào nồi nước xương, thả **sả đập dập + lá chanh vò**.
    - Nêm nước cốt me, sa tế, nước mắm, đường — **nếm theo thứ tự cay → chua → mặn**.
    - Vắt chanh **lúc gần bưng ra**, không vắt sớm kẻo nước đắng.
    - Bắc lên bàn, nhúng hải sản trước, thịt bò sau, rau cuối; hết thì thả mì.
  warning: >-
    **Đừng vắt chanh vào nồi đang sôi lâu.** Nước cốt chanh đun lâu sẽ ngả
    đắng và mất mùi thơm. Vị chua nền lấy từ **me**, còn chanh chỉ vắt sát
    giờ ăn để dậy hương.

flavor:
  chua: 7
  ngot: 5
  man: 6
  cay: 7
  thom: 8
flavorNote: >-
  **Chuẩn vị:** nước lèo **đỏ cam có váng sa tế**, húp vào chua trước, cay
  theo sau, hậu ngọt của xương và thơm. Mùi phải nhận ra ngay là **sả và lá
  chanh** — thiếu lá chanh thì nồi chỉ còn là canh chua cay thường.
storyEyebrow: Chuyện nồi lẩu Thái
storyTitle: Món **gốc Thái Lan**, nấu theo lối bàn tiệc Việt
story:
  - >-
    Cần nói ngay cho rõ: đây **không phải món Việt**. Gốc của nó là *tom yum*
    — món canh chua cay của Thái Lan, nấu với sả, riềng, lá chanh và ớt.
    Người Việt gặp món này rồi giữ lại đúng bộ ba mùi đó, nhưng đổi cách ăn:
    thay vì một tô canh dọn trong mâm, nó thành **nồi lẩu đặt giữa bàn**,
    nhúng tới đâu ăn tới đó. Cái tên "lẩu Thái" ra đời từ chỗ đó, và giờ nó
    có mặt ở gần như mọi quán lẩu từ Bắc vào Nam.
  - >-
    So với bản gốc thì bản Việt khác vài chỗ thấy rõ. Nồi **to hơn hẳn** vì
    phải nuôi cả bàn ăn suốt buổi, nên nước dùng ninh từ **xương heo** cho có
    nền ngọt thay vì chỉ dùng nước luộc tôm. Người Việt cũng hay cho thêm
    **cà chua và thơm** — hai thứ vừa cho màu đỏ cam vừa cho vị chua ngọt
    dịu, và **rau nhúng thì nhiều gấp mấy lần**, đúng thói quen ăn lẩu ở đây.
  - >-
    Vì vậy nấu nồi này ở nhà đừng cố đuổi theo bản Thái chính gốc, cũng đừng
    coi thường nó vì là món mượn. Cứ nấu cho đúng cái nó đang là: **một nồi
    chua cay dễ tính**, nhúng gì cũng hợp, ai cũng ăn được, và tới cuối bữa
    thả vắt mì vào thì cả bàn im lặng một lúc. Điều duy nhất phải giữ cho
    đúng là **bộ ba sả – riềng – lá chanh**; bỏ mất một thứ là nồi mất chữ ký.

