heroEyebrow: Sáng phố biển, mùi chả cá chiên…

quick:
  ingredients:
    - Bánh mì ổ [[4|ổ]] — hâm giòn trước khi kẹp
    - >-
      Chả cá: phi lê cá thu [[400|g]] · mỡ heo [[50|g]] · bột năng
      [[2|muỗng canh]] · tỏi [[4|tép]] · hành tím [[3|củ]] · thì là
      [[1|nhánh]] · muối [[1|muỗng cà phê]] · đường, tiêu · đá lạnh [[3|viên]]
    - >-
      Sốt hành: hành tây [[1|củ]] · tỏi băm [[2|tép]] · nước mắm
      [[1.5|muỗng canh|frac]] · đường [[1|muỗng cà phê]] · bột năng
      [[1|muỗng cà phê]] pha nước · [[150|ml]] nước
    - >-
      Kèm ổ bánh: đồ chua cà rốt củ cải · dưa leo [[1|trái]] · rau răm, hành
      lá, ngò rí · tương ớt
  steps:
    - >-
      Cá thái nhỏ, **để ngăn đá 20 phút cho thật lạnh** rồi xay với muối, tỏi
      hành, mỡ heo và đá lạnh — xay từng nhịp ngắn, đừng xay liền một mạch.
    - >-
      Trộn bột năng và thì là băm, **quết cho khối chả dẻo quánh**, ướp lạnh
      thêm 1 giờ cho chả nghỉ.
    - >-
      Nặn miếng dày cỡ 1,5 cm, **hấp 10 phút** cho chín rồi mới chiên vàng hai
      mặt — hấp trước thì chả nở đều, không cháy vỏ mà sống ruột.
    - >-
      Sốt hành: phi tỏi, xào hành tây thái mỏng cho trong, châm nước và nước
      mắm đường, **nêm rồi rót bột năng pha nước** cho sánh lại.
    - Hâm ổ bánh 200°C 4–5 phút cho vỏ giòn, rạch chừa sống lưng.
    - >-
      Xếp chả cá thái lát, đồ chua vắt ráo, dưa leo, **rau răm**; chan muỗng sốt
      hành nóng, vạch tương ớt rồi ăn liền.
  warning: >-
    Xay cá lúc đã ấm tay là chả **bở như thịt viên**, cứu không được. Cá phải
    lạnh gần đông đá, và xay từng nhịp ngắn cho máy khỏi nóng.

flavor:
  chua: 3
  ngot: 4.5
  man: 6
  cay: 3
  thom: 8
flavorNote: >-
  **Chuẩn vị:** miếng chả cắn vào **dai sật rồi bật lại**, ngọt thịt cá chứ
  không nhạt thếch; sốt hành sánh vừa đủ bám vào chả, không loãng chảy ướt
  bánh. Nghe được mùi thì là và rau răm mới đúng ổ bánh phố biển.

storyEyebrow: Chuyện ổ bánh
storyTitle: Ổ bánh mì **của xứ biển**, nhân làm từ mẻ cá sáng nay
story:
  - >-
    Nha Trang có nghề chả cá lâu đời, mà lý do thì đơn giản: thuyền về là có cá
    tươi, mà cá tươi quết thành chả thì để được lâu hơn cá tươi để nguyên con.
    Chả cá xứ này quết từ **cá thu, cá mối, cá đỏ** — mấy loại thịt săn, ít
    xương dăm, ngọt đậm. Nhà nào cũng biết mùi cối quết chả buổi sáng.
  - >-
    Rồi ổ bánh mì gặp miếng chả cá. Cả nước kẹp bánh mì với thịt, riêng phố
    biển kẹp với thứ sẵn nhất của mình, và thành ra một ổ bánh khác hẳn: **không
    có pate, không có bơ trứng**, mà chan **sốt hành tây sền sệt** — thứ nước
    sốt vừa mặn vừa ngọt dịu, quánh đủ để bám vào miếng chả chứ không chảy tuột
    làm ướt ruột bánh.
  - >-
    Làm chả cá ở nhà nghe khó mà thật ra chỉ có một luật: **giữ mọi thứ thật
    lạnh**. Thịt cá lạnh gần đông thì các sợi đạm mới bện được vào nhau thành
    khối dẻo quánh, chiên lên dai sật. Ấm tay một chút là khối chả bở ra như
    thịt viên — không mẹo nào chữa được, nên cứ thò tay vô ngăn đá lấy cá ra là
    xay liền.

