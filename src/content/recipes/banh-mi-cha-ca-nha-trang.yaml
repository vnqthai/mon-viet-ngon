stepsEyebrow: Vô bếp thôi!
stepsTitle: 6 bước ra **ổ bánh mì chả cá phố biển**
stepsLead: >-
  Phần chả cá làm được từ hôm trước, cất ngăn mát. Sáng ra chỉ việc chiên chả,
  nấu sốt, hâm bánh — chừng mười lăm phút là có ổ bánh nóng.
steps:
  - title: Làm lạnh cá — bước đứng trước mọi bước
    icon: fish
    minutes: 25 phút
    intro: "Cả món này ăn thua ở đây, nên làm thật kỹ:"
    bullets:
      - label: "Lọc cá:"
        text: >-
          phi lê cá thu lạng bỏ da, dò tay theo sống lưng **nhổ hết xương
          dăm**, thái miếng cỡ 2 cm.
      - label: "Ướp sơ:"
        text: >-
          xóc cá với [[1|muỗng cà phê]] muối + [[1|muỗng cà phê]] đường +
          ½ muỗng cà phê tiêu, tỏi hành băm. Muối cho vào **ngay lúc này**, chứ
          không phải lúc xay xong.
      - label: "Ướp lạnh:"
        text: >-
          trải cá ra khay, bọc kín, **để ngăn đá 20 phút** — cá phải lạnh tới
          mức sờ vào tê tay, mép miếng hơi cứng lại nhưng chưa đông đá.
    callout:
      type: tip
      text: >-
        Kỹ hơn nữa thì cho luôn **cối xay và lưỡi dao vào ngăn đá** cùng lúc.
        Máy xay chạy là sinh nhiệt; cối lạnh sẵn thì mẻ chả giữ được lạnh lâu
        hơn hẳn.
    timer:
      secs: 1200
      label: Hẹn giờ ướp lạnh cá · 20:00
      doneMsg: Cá lạnh tê tay rồi — bỏ vô cối xay ngay!
  - title: Xay & quết cho khối chả dẻo quánh
    icon: knife
    minutes: 15 phút (+ nghỉ 1 giờ)
    bullets:
      - label: "Xay từng nhịp:"
        text: >-
          cho cá + mỡ heo + [[3|viên]] đá lạnh vào cối, **xay từng nhịp 5–10
          giây**, ngừng, vét thành cối, xay tiếp. Xay liền một mạch là máy nóng
          lên và chả bở.
      - label: "Nhìn là biết đạt:"
        text: >-
          khối cá chuyển từ vụn rời sang **dẻo quánh, bám vào nhau, mặt bóng**
          — nhấc cối lên dốc ngược mà khối chả không rơi là được.
      - label: "Trộn cuối:"
        text: >-
          trút ra tô, rắc [[2|muỗng canh]] bột năng và thì là băm, **quết
          bằng muỗng cho tới khi nghe nặng tay** — cỡ 3–4 phút.
      - label: "Cho chả nghỉ:"
        text: >-
          bọc kín, cất ngăn mát **1 giờ**. Chả nghỉ xong thì săn lại, nặn miếng
          không dính tay.
    callout:
      type: warn
      text: >-
        Không có máy xay thì **giã cối đá** được, thậm chí còn dai hơn máy —
        nhưng phải giã cá còn lạnh, giã tới đâu nghỉ tay tới đó, và bỏ cối vào
        ngăn đá trước cho lạnh.
    timer:
      secs: 3600
      label: Hẹn giờ cho chả nghỉ · 60:00
      doneMsg: Chả nghỉ đủ rồi — nặn miếng và bắc nồi hấp thôi!
  - title: Hấp rồi mới chiên
    icon: flame
    minutes: 20 phút
    intro: >-
      Hàng chả cá nào cũng làm hai nhịp này, đừng gộp lại thành một:
    bullets:
      - label: "Nặn miếng:"
        text: >-
          thoa chút dầu vào lòng bàn tay, nặn miếng tròn dẹt **dày cỡ 1,5 cm**
          — dày hơn thì trong chưa chín, mỏng hơn thì chiên xong khô cứng.
      - label: "Hấp:"
        text: >-
          xếp lên xửng có lót lá chuối hoặc giấy nến, **hấp 10 phút** lửa vừa.
          Chả chín là mặt se lại, ấn vào bật lên.
      - label: "Chiên:"
        text: >-
          chảo dầu nóng vừa, chiên **mỗi mặt 2–3 phút** cho vàng nâu, mặt ngoài
          hơi rộp. Vớt ra để trên rây cho ráo dầu.
      - label: "Thái lát:"
        text: >-
          để nguội bớt rồi thái **lát xéo dày cỡ 8 mm** — lát xéo dài, nằm gọn
          suốt chiều dài ổ bánh.
    callout:
      type: tip
      text: >-
        Vì sao phải hấp trước: chiên thẳng miếng chả sống thì vỏ vàng rất nhanh
        trong khi ruột còn nhão, mà chiên tiếp thì vỏ cháy. Hấp chín rồi chiên
        chỉ để **lấy màu và lấy mùi**, nên canh lửa dễ hơn nhiều.
    timer:
      secs: 600
      label: Hẹn giờ hấp chả · 10:00
      doneMsg: Chả se mặt rồi — vớt ra, bắc chảo chiên vàng!
  - title: Nấu sốt hành tây sền sệt
    icon: onion
    minutes: 10 phút
    bullets:
      - label: "Xào hành:"
        text: >-
          phi thơm [[2|tép]] tỏi băm, cho hành tây thái múi cau vào xào lửa vừa
          tới khi **hành trong và mềm rũ** — chừng 5 phút, đừng vội.
      - label: "Châm nước, nêm:"
        text: >-
          đổ [[150|ml]] nước, [[1.5|muỗng canh|frac]] nước mắm,
          [[1|muỗng cà phê]] đường, ít tiêu. Nấu sôi lăn tăn 2 phút.
      - label: "Làm sánh:"
        text: >-
          hòa [[1|muỗng cà phê]] bột năng với 2 muỗng canh nước, **rót từ từ
          vào nồi đang sôi**, khuấy đều. Sốt đạt là **chảy chậm khỏi muỗng
          thành dòng dày**, không loãng như nước canh.
    callout:
      type: warn
      text: >-
        Sốt loãng thì chan vào ổ bánh là ngấm thẳng xuống ruột, vài phút sau
        bánh nhũn. Thà sánh hơi quá rồi châm thêm muỗng nước, còn hơn để loãng.
  - title: Hâm ổ bánh cho giòn lại
    icon: bread
    minutes: 5 phút
    bullets:
      - text: >-
          Vẩy chút nước lên vỏ ổ bánh rồi nướng **200°C trong 4–5 phút** (hoặc
          áp chảo khô đậy nắp 3 phút). Gõ nghe cồm cộp là đạt.
      - text: >-
          Để nguội chừng một phút rồi rạch **một đường dọc, chừa sống lưng** —
          ổ bánh phải còn là cái túi mới giữ được chả và sốt.
    timer:
      secs: 300
      label: Hẹn giờ hâm bánh · 05:00
      doneMsg: Vỏ giòn rồi — rạch bánh và xếp chả thôi!
  - title: Ráp ổ bánh — chan sốt sau cùng
    icon: knife
    minutes: 5 phút
    bullets:
      - label: "Xếp chả:"
        text: >-
          trải lát chả cá **suốt chiều dài ổ**, hơi gối lên nhau như lợp ngói.
      - label: "Rau và đồ chua:"
        text: >-
          nhét đồ chua đã vắt ráo, thanh dưa leo, rồi **một nhúm rau răm** và
          vài nhánh ngò rí, chút hành lá thái nhỏ.
      - label: "Chan sốt:"
        text: >-
          rưới **1–2 muỗng sốt hành còn nóng** dọc theo hàng chả, vạch một
          đường tương ớt. Chan sau cùng thì sốt nằm trên chả chứ không kịp
          thấm xuống ruột bánh.
      - text: Bóp nhẹ ổ bánh cho nhân nén lại, gói giấy, ăn ngay lúc còn nóng.
    doneText: Ổ bánh mì chả cá thơm lừng — xong!

tipsTitle: 7 bí quyết **chả cá dai sật như hàng**
tipsLead: >-
  Chả cá tự làm hơn chả mua ở chỗ ngọt thịt và thơm mùi cá thật. Đổi lại nó
  đòi đúng một thứ kỷ luật: giữ lạnh.
tips:
  - icon: drop
    title: Lạnh, lạnh nữa, lạnh mãi
    text: >-
      Cá lạnh gần đông · cối và dao để ngăn đá · xay chung với đá viên · xay
      từng nhịp ngắn. Bốn việc này quyết định **dai hay bở**, mấy thứ còn lại
      chỉ là gia giảm.
  - icon: jar
    title: Muối cho vào lúc xay, không phải lúc trộn
    text: >-
      Muối là thứ kéo các sợi đạm trong thịt cá bện vào nhau thành khối dẻo.
      Cho muối sau khi xay xong thì chả **không bao giờ dẻo quánh** được nữa.
  - icon: fish
    title: Chọn cá thịt săn, đừng chọn cá thịt mềm
    text: >-
      Cá thu, cá mối, cá đỏ, cá rựa đều quết được. Cá basa hay cá tra thịt bở
      và nhiều nước, quết ra chả **nhão, chiên là teo lại**.
  - icon: meat
    title: Chút mỡ heo cho chả khỏi khô
    text: >-
      Cá gần như không mỡ, nên [[50|g]] mỡ heo là chỗ giữ cho miếng chả mềm
      mượt. Ai kiêng mỡ thì thay bằng 2 muỗng canh dầu ăn, cho vào lúc xay cuối.
  - icon: flame
    title: Hấp trước rồi chiên, đừng chiên thẳng
    text: >-
      Chiên thẳng chả sống thì **vỏ vàng trước khi ruột chín**. Hấp 10 phút rồi
      chiên chỉ để lấy màu và mùi — canh lửa dễ hơn hẳn, mà miếng chả nở đều.
  - icon: spoon
    title: Sốt phải sánh, không được loãng
    text: >-
      Sốt đạt là **chảy chậm khỏi muỗng thành dòng dày**. Loãng thì ngấm xuống
      ruột bánh, mà đặc quá thì đóng cục — hòa bột năng với nước lạnh rồi rót
      từ từ vào nồi đang sôi là chuẩn nhất.
  - icon: herb
    title: Rau răm chứ không phải rau thơm nào khác
    text: >-
      Nhiều người thay bằng ngò gai hay húng quế cho tiện, nhưng vị **cay ấm
      hơi the** của rau răm mới là thứ cắt được cái tanh nhẹ của cá. Thiếu nó
      là ổ bánh mất một tầng.

serve:
  title: Dọn ổ bánh **kiểu sáng phố biển**
  paras:
    - >-
      Ổ bánh mì chả cá ăn ngon nhất lúc **chả vừa chiên xong còn nóng** và sốt
      hành vừa nhấc khỏi bếp. Chả nguội rồi hâm lại vẫn ăn được, nhưng cái mặt
      ngoài hơi rộp giòn thì mất, chỉ còn phần dai.
    - >-
      Ở phố biển người ta hay ăn kèm **ly trà đá**, và bên cạnh có chén ớt xanh
      dầm nước mắm cho ai ăn cay. Nhà nào thích đậm thì chan thêm sốt, thích
      thanh thì bớt sốt và tăng rau răm.
    - >-
      Mẻ chả làm dư đừng bỏ phí: thả vào **tô bún chả cá** là ra ngay món khác,
      hoặc chiên lại ăn với cơm trắng và chén nước mắm ớt. Còn muốn đổi sang ổ
      bánh khác thì có **bánh mì thịt** đủ tầng hay **bánh mì heo quay** giòn da.
  aside:
    title: Bên cạnh ổ bánh
    intro: "Mấy thứ làm ổ bánh phố biển đủ vị:"
    items:
      - icon: herb
        text: "**Rau răm** — cay ấm, cắt tanh, không thay bằng rau khác được."
      - icon: onion
        text: "**Sốt hành tây** — chan nóng, sánh vừa, là linh hồn của ổ bánh này."
      - icon: chili
        text: "**Tương ớt** — vạch một đường dọc, đừng vắt cả gói."
      - icon: pod
        text: "**Đồ chua vắt ráo** — chua giòn kéo lại cái béo của chả chiên."

faq:
  - q: Mua chả cá làm sẵn có được không?
    a: >-
      Được, và nhiều nhà làm vậy. Chọn miếng **mặt bóng, ấn vào bật lại**, cắt
      ra thấy thớ mịn chứ không rỗ. Về nhà chiên vàng lại hai mặt cho dậy mùi.
      Chỉ là chả mua thường nêm đậm hơn, nên bớt nước mắm trong sốt lại.
  - q: Chả xay xong bị bở, còn cứu được không?
    a: >-
      Cứu được một phần: cho lại vào cối cùng **2–3 viên đá lạnh và ½ muỗng cà
      phê muối**, xay thêm vài nhịp ngắn. Nếu vẫn rời thì thêm 1 muỗng canh bột
      năng rồi quết mạnh tay. Chả sẽ kết lại, chỉ là kém dai hơn mẻ làm đúng.
  - q: Cá thu đông lạnh dùng được không?
    a: >-
      Dùng tốt, thậm chí tiện vì cá vốn đã lạnh sẵn. **Rã đông trong ngăn mát
      qua đêm**, thấm thật khô rồi mới xay — đừng rã bằng nước ấm, thịt cá sẽ
      ra nước và bở.
  - q: Không có xửng hấp thì sao?
    a: >-
      Đặt cái rổ inox hoặc dĩa sâu lên trên ba cái chén úp trong nồi có chút
      nước, đậy nắp là thành xửng. Hoặc **áp chảo lửa nhỏ đậy nắp 6–7 phút**
      mỗi mặt — chín kiểu này chả hơi khô hơn nhưng vẫn ổn.
  - q: Chả cá và chả lụa khác nhau chỗ nào?
    a: >-
      Khác nguyên liệu và khác cách làm chín. **Chả lụa** quết từ thịt heo, gói
      lá chuối rồi luộc hoặc hấp, ăn nguội, thớ mịn trắng. **Chả cá** quết từ
      thịt cá, thường hấp rồi chiên, ăn nóng, mặt vàng và có mùi biển rõ.
  - q: Làm dư thì trữ được bao lâu?
    a: >-
      Chả đã hấp chín để **ngăn mát 3 ngày**, ngăn đá được cả tháng. Trữ ngăn
      đá thì chia sẵn từng phần, khi ăn rã đông ngăn mát rồi chiên lại — đừng
      chiên thẳng lúc còn đá, dầu bắn tung tóe mà ruột vẫn lạnh.

