title: Bánh chưng **gói vuông lá dong, luộc suốt đêm**
summary: >-
  Nếp bọc đậu xanh bọc miếng ba chỉ ướp tiêu, gói vuông trong lá dong, buộc lạt
  rồi luộc mười hai tiếng. Bóc ra là một khối **xanh mướt màu lá**, cắt bằng
  chính sợi lạt thành tám miếng, mỗi miếng đủ ba tầng nếp — đậu — thịt.
region: Miền Bắc
category: Bánh
occasions: [Cỗ Tết, Đãi khách]
pubDate: 2026-08-01
time:
  total: 14 giờ (+ ngâm nếp và đậu 8 giờ)
  active: 2 giờ
servingsBase: 8
difficulty: Kỳ công
featured: true
