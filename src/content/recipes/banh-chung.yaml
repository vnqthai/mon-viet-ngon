art: banh-chung
heroEyebrow: Nồi bánh sôi ngoài sân, đêm hai chín Tết…

quick:
  ingredients:
    - Nếp cái hoa vàng [[1|kg]] — ngâm **8 giờ**, xóc muối
    - Đậu xanh cà vỏ [[400|g]] — ngâm **4 giờ**, đồ chín, nắm thành nắm
    - Thịt ba chỉ [[500|g]] — thái miếng to bản, ướp muối tiêu **1 giờ**
    - Lá dong [[20|lá]] · lạt giang [[8|sợi]] — rửa sạch, lau khô
    - Muối [[2|muỗng canh]] · tiêu xay [[1|muỗng canh]]
  steps:
    - Ngâm nếp 8 giờ và đậu 4 giờ; đồ đậu chín rồi nắm thành 4 nắm tròn.
    - Ướp thịt với muối tiêu **1 giờ** — không ướp nước mắm, bánh mau thiu.
    - >-
      Xếp 4 lá dong vuông góc nhau, đổ nếp — đậu — thịt — đậu — nếp, gấp lá
      thành khối vuông, buộc 4 sợi lạt.
    - Xếp bánh vào nồi, đổ nước ngập, luộc **10–12 giờ**, châm nước sôi khi cạn.
    - Vớt ra rửa nước lạnh, xếp lên mặt phẳng, **ép nặng 6–8 giờ**.
  warning: >-
    Nước trong nồi phải **ngập bánh suốt cả đêm**. Hở mặt một lúc là chỗ đó nếp
    không chín, cắt ra thấy một mảng trắng sống ngay giữa miếng bánh — mà lúc
    ấy thì không cứu được nữa.

