      - id: latgiangbchg
        name: Lạt giang
        icon: stem
        base: 8
        unit: sợi
        note: >-
          Ngâm nước cho mềm và dẻo trước khi buộc, không thì gãy giữa chừng. Mỗi
          bánh buộc 4 sợi, hai chiều vuông góc nhau. Cũng chính sợi lạt này dùng
          để cắt bánh khi ăn
      - id: khuonbchg
        name: Khuôn gỗ
        icon: basket
        qtyText: 1 cái (không bắt buộc)
        note: >-
          Khuôn vuông cạnh chừng 15 cm giúp bánh vuông vức và đều tay. Không có
          khuôn thì gói tay được, chỉ cần chịu khó gấp mép cho vuông

steps:
  - title: Ngâm nếp, đồ đậu, ướp thịt
    icon: clock
    minutes: 8 giờ
    intro: "Làm tối hôm trước, sáng hôm sau gói:"
    bullets:
      - label: "Nếp:"
        text: >-
          Vo sạch, ngâm ngập nước lạnh **8 giờ**. Vo lại, để ráo **30 phút** rồi
          xóc [[1|muỗng canh]] muối.
      - label: "Đậu xanh:"
        text: >-
          Ngâm **4 giờ**, đãi bỏ vỏ còn sót, đồ chín tới rồi tán mịn khi còn
          nóng, nêm chút muối. Chia và nắm thành **4 nắm tròn**.
      - label: "Thịt:"
        text: >-
          Thái miếng to bản dày 1 cm, ướp [[1|muỗng canh]] tiêu xay, chút muối
          và hành tím băm. Để **1 giờ**.
      - label: "Lá dong:"
        text: >-
          Rửa từng lá hai mặt bằng khăn mềm, lau **thật khô**, cắt bỏ phần sống
          lá cứng ở gáy để lá gấp được.
    callout:
      type: warn
      text: >-
        **Đừng ướp thịt bằng nước mắm.** Nước mắm làm nhân dậy mùi lúc mới luộc
        xong nhưng khiến bánh nhanh chua — mà bánh chưng thì phải để được cả
        tuần. Chỉ muối và tiêu.
  - title: Gói bánh
    icon: knife
    minutes: 1 giờ
    intro: "Bốn lá một bánh, xếp vuông góc từng đôi:"
    bullets:
      - label: "Xếp lá:"
        text: >-
          Đặt 2 lá úp mặt xanh xuống, 2 lá còn lại đặt vuông góc lên trên, mặt
          xanh ngửa. Nếu có khuôn thì lót lá vào lòng khuôn.
      - label: "Đổ lớp:"
        text: >-
          Một bát nếp dàn đều đáy → nửa nắm đậu dàn thành vòng → **1–2 miếng
          thịt đặt chính giữa** → nửa nắm đậu phủ lên → một bát nếp phủ kín.
      - label: "Gấp lá:"
        text: >-
          Gấp hai mép lá đối diện vào trước, ấn cho phẳng mặt, rồi gấp hai mép
          còn lại. Miết các góc cho vuông vức.
      - label: "Buộc lạt:"
        text: >-
          Buộc 2 sợi theo một chiều, 2 sợi theo chiều vuông góc. Siết
          **vừa chặt** — ấn tay xuống mặt bánh thấy hơi lún là đúng.
    callout:
      type: warn
      text: >-
        Đây là chỗ hay sai nhất với người gói lần đầu. **Chặt quá** thì nếp
        không có chỗ nở, luộc xong cắt ra sượng và cứng. **Lỏng quá** thì nước
        lọt vào, bánh nhão và bung góc. Ấn ngón tay lên mặt bánh đã buộc: lún
        xuống chừng nửa đốt rồi phồng lại là vừa.
  - title: Luộc suốt đêm
    icon: pot
    minutes: 12 giờ
    intro: "Bước dài nhất, và chỉ có một việc phải làm: canh nước."
    bullets:
      - label: "Xếp nồi:"
        text: >-
          Lót đáy nồi bằng **cuống lá dong và lá thừa** cho bánh không chạm đáy
          và khỏi khét. Xếp bánh đứng cạnh nhau, chèn khít.
      - label: "Đổ nước:"
        text: >-
          Đổ nước lạnh **ngập trên mặt bánh chừng 5 cm**. Đun sôi rồi hạ lửa vừa,
          giữ sôi đều.
      - label: "Châm nước:"
        text: >-
          Cứ 2 tiếng kiểm một lần. Nước cạn thì châm thêm **nước sôi**, tuyệt đối
          đừng châm nước lạnh — bánh đang nở gặp lạnh là chai lại.
      - label: "Đủ giờ:"
        text: >-
          Bánh cỡ vừa (chừng 1 kg) luộc **10 tiếng**; bánh to hơn thì
          **12 tiếng**. Luộc thiếu giờ thì lõi còn sống, không có cách nào biết
          trước khi bóc.
    timer:
      secs: 3600
      label: Hẹn giờ ghé canh nước · 60:00
      doneMsg: Ghé nhìn mực nước, cạn thì châm nước SÔI nghen!
    callout:
      type: tip
      text: >-
        Nửa chừng nên **trở bánh một lần** — vớt ra, đảo trên xuống dưới rồi xếp
        lại. Bánh nằm sát đáy chịu lửa mạnh hơn nên chín nhanh hơn bánh ở trên;
        trở một lần là cả nồi đều nhau.
  - title: Rửa, ép, để nguội
    icon: drop
    minutes: 8 giờ
    intro: "Bước hay bị bỏ, mà bỏ thì bánh chỉ để được vài ngày:"
    bullets:
      - label: "Rửa:"
        text: >-
          Vớt bánh ra, **rửa ngay dưới nước lạnh** cho sạch lớp nhựa lá bám
          ngoài. Bánh không rửa thì mặt lá nhớt và chóng mốc.
      - label: "Ép:"
        text: >-
          Xếp bánh lên mặt phẳng, đặt tấm ván lên trên rồi chồng vật nặng. Ép
          **6–8 tiếng**.
      - label: "Vì sao phải ép:"
        text: >-
          Ép đẩy hết nước còn đọng trong bánh ra ngoài. Bánh ép kỹ thì chắc tay,
          cắt đứng miếng và **để được cả tuần**; bánh không ép thì ướt nhèo và
          chua sau ba ngày.
      - text: >-
          Ép xong treo nơi thoáng gió hoặc cất ngăn mát. Ăn tới đâu bóc tới đó.
    doneText: Xong — bóc một cái ra thắp hương là vừa!

tipsTitle: 5 chỗ **quyết định** nồi bánh chưng
tips:
  - icon: alert
    title: Nước phải ngập bánh suốt cả đêm
    text: >-
      Đây là lỗi làm hỏng bánh nhiều nhất và cũng là lỗi dễ tránh nhất. Hở mặt
      bánh nửa tiếng thôi là phần trên không nhận đủ nhiệt, bóc ra thấy một mảng
      nếp **trắng đục và sượng** nằm giữa lớp xanh trong. Đặt đồng hồ hai tiếng
      một lần, và luôn châm bằng **nước sôi**.
  - icon: bulb
    title: Buộc vừa tay — thử bằng ngón trỏ
    text: >-
      Ấn ngón trỏ lên mặt bánh vừa buộc xong: **lún xuống chừng nửa đốt rồi
      phồng lại** là đúng. Cứng như đá thì nếp hết chỗ nở, luộc xong vẫn sượng.
      Lún sâu mà không phồng thì lỏng, nước sẽ lọt vào và bánh nhão.
  - icon: herb
    title: Lá dong lau thật khô trước khi gói
    text: >-
      Rửa xong phải lau khô từng lá bằng khăn sạch. Lá còn ướt mang nước vào
      trong bánh, chỗ đó nếp nhão và bánh **chóng chua**. Cũng đừng rửa lá bằng
      nước nóng — lá chín tái, mất màu xanh và giòn dễ rách khi gấp.
  - icon: meat
    title: Thịt phải có mỡ, đừng chọn nạc
    text: >-
      Sau mười hai tiếng luộc, phần mỡ chuyển thành **trong như thạch** và tan
      vào lớp đậu quanh nó — đó chính là cái béo ngậy của miếng bánh chưng. Chọn
      thịt nạc vì sợ ngán thì làm ngược: nạc luộc lâu ra bã khô, mà cả miếng
      nhân thành ra khô khốc.
  - icon: clock
    title: Ép xong mới coi là làm xong
    text: >-
      Nhiều người vớt bánh ra là coi như hết việc. Sáu tiếng ép mới là thứ quyết
      định bánh để được một tuần hay ba ngày, và quyết định miếng cắt ra có đứng
      hay bở nát. Không có ván ép thì dùng cái thớt to đặt lên, chồng thêm nồi
      nước cũng được.

serve:
  title: Cắt bằng **chính sợi lạt**, tám miếng đều nhau
  paras:
    - >-
      Bóc lá xong, đừng vội cầm dao. Cách cắt truyền thống là dùng **chính sợi
      lạt buộc bánh**: đặt hai sợi bắt chéo dưới đáy bánh, vắt lên trên rồi kéo
      hai đầu cho lạt siết xuống — bánh đứt gọn thành bốn miếng, làm thêm lần
      nữa theo đường chéo là được tám. Dao thái thì nếp dính lưỡi và miếng bánh
      bị kéo lệch.
    - >-
      Bánh chưng trên mâm cỗ luôn đi cùng **dưa hành** và **giò lụa**. Dưa hành
      chua giòn cắt cái béo của nhân, giò lụa thì bù phần đạm. Ba thứ ấy đặt
      cạnh nhau là thành mâm, thiếu một thứ là thấy thiếu.
  aside:
    title: Ăn còn dư thì làm gì
    intro: "Bánh để mấy ngày là cứng lại — ba cách xử:"
    items:
      - icon: flame
        text: "**Rán bánh chưng** — thái miếng, rán chảo cho hai mặt vàng giòn, ruột mềm."
      - icon: pot
        text: "**Hấp lại** — 15 phút trong xửng là dẻo gần như mới, giữ nguyên vị."
      - icon: lettuce
        text: "**Ăn kèm dưa hành** — miếng bánh nguội mà có dưa hành thì vẫn ngon."

faq:
  - q: Làm sao biết bánh đã chín mà không phải bóc ra?
    a: >-
      Không có cách nào chắc chắn — đó chính là lý do phải luộc đủ giờ thay vì
      canh chừng. Dấu hiệu tương đối: bánh chín thì **cầm lên thấy nặng chắc
      tay, mặt lá đã ngả sang xanh sẫm**, và ấn vào thấy chắc chứ không mềm oặt.
      Nếu buộc phải kiểm thì hy sinh một cái nhỏ nhất, bóc ra xem lõi.
  - q: Bánh cắt ra có một mảng nếp trắng sống ở giữa, vì sao?
    a: >-
      Gần như chắc chắn là **nước cạn hở mặt bánh** trong lúc luộc, hoặc luộc
      thiếu giờ. Cũng có thể do gói quá chặt nên nếp không nở được. Chỗ sống thì
      không cứu được, nhưng phần còn lại vẫn ăn bình thường — cắt bỏ mảng trắng
      rồi rán lên là ngon.
  - q: Không có lá dong thì gói bằng lá gì?
    a: >-
      **Lá chuối** thay được, và đó cũng là thứ miền Nam vẫn dùng. Khác biệt:
      lá chuối không cho vỏ bánh cái màu xanh trong đặc trưng và mùi cũng nhạt
      hơn. Chọn lá chuối bánh tẻ, hơ qua lửa hoặc trụng nước sôi cho mềm rồi lau
      khô, xếp hai lớp vì lá chuối mỏng và dễ rách hơn lá dong.
  - q: Luộc bằng nồi áp suất có được không?
    a: >-
      Được, và rút xuống còn **1,5–2 tiếng**. Nhưng bánh sẽ khác: vỏ nếp nhừ hơn
      và không có được cái dẻo quánh của bánh luộc chậm, mùi lá cũng nhạt vì
      thời gian tiếp xúc ngắn. Nếu chọn cách này thì gói bánh nhỏ lại và ép kỹ
      hơn, vì bánh ra ướt hơn hẳn.
  - q: Bánh bảo quản được bao lâu?
    a: >-
      Ép kỹ và treo nơi thoáng gió thì được **5–7 ngày** trong tiết trời lạnh
      miền Bắc dịp Tết. Trời ấm thì cất ngăn mát, được **10 ngày**; ngăn đá thì
      cả tháng, lúc ăn rã đông rồi hấp lại 20 phút. Thấy mặt lá nhớt hoặc ngửi
      chua là bỏ, đừng gọt phần ngoài rồi ăn phần trong.

