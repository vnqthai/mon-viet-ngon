flavorNote: >-
  **Chuẩn cái:** vỏ nếp **xanh mướt màu lá** và trong, dẻo quánh mà cắt vẫn
  đứng miếng; lớp đậu vàng mịn nằm đều một vòng; miếng thịt mềm rục, phần mỡ
  **trong như thạch** chứ không còn trắng đục; thơm mùi lá dong quyện tiêu.
storyEyebrow: Chuyện món ăn
storyTitle: Cả năm chỉ gói một lần, nên **mọi thứ đều phải đúng ngay từ đầu**
story:
  - >-
    Theo tích xưa, một người con vua dâng lên hai thứ bánh làm từ hạt gạo nhà
    nông: một chiếc vuông, một chiếc tròn. Chiếc vuông ấy là bánh chưng, và từ
    đó tới nay nó vẫn là thứ đầu tiên được đặt lên mâm cỗ Tết miền Bắc.
  - >-
    Cấu tạo của nó là **năm lớp lồng vào nhau**: nếp ngoài cùng, rồi đậu xanh,
    rồi miếng thịt nằm chính giữa, rồi lại đậu và nếp. Cắt một miếng ra là thấy
    đủ cả năm lớp xếp thành vòng đồng tâm — và đó cũng là phép thử xem người gói
    có khéo không, vì lớp lệch thì miếng cắt ra chỗ dày chỗ mỏng.
  - >-
    Cái khó của bánh chưng không nằm ở nguyên liệu — chỉ có nếp, đậu, thịt và
    lá. Nó nằm ở chỗ **mọi sai sót đều lộ ra sau mười hai tiếng**, lúc không còn
    sửa được gì. Gói lỏng tay thì bánh nhão; gói chặt quá thì nếp không có chỗ
    nở, cắt ra sượng. Nước cạn hở mặt bánh nửa tiếng thì góc đó sống. Luộc xong
    quên ép thì bánh ướt nhèo, để ba ngày là chua.
  - >-
    Bù lại, đây là món **làm một lần ăn cả tuần**, và cái nồi bánh sôi suốt đêm
    vốn là một phần của Tết chẳng kém gì chiếc bánh. Nhà nào gói bánh thì đêm ấy
    cả nhà thức, ngồi quanh bếp lửa canh nước — công việc thì nhàn mà chuyện thì
    dài.

ingredientGroups:
  - name: Nếp và đậu
    icon: rice
    items:
      - id: nepbchg
        name: Nếp cái hoa vàng
        icon: rice
        color: gold
        base: 1
        unit: kg
        note: >-
          Đây là chỗ **không nên tiết kiệm**. Nếp cái hoa vàng hạt tròn mẩy,
          trắng đục, dẻo và thơm — nếp thường thì bánh kém dẻo và nhanh lại gạo
          (cứng lại sau vài ngày). Ngâm 8 giờ, vo lại, để ráo rồi xóc
          [[1|muỗng canh]] muối
      - id: dauxanhbchg
        name: Đậu xanh cà vỏ
        icon: pod
        color: gold
        base: 400
        unit: g
        note: >-
          Ngâm **4 giờ**, đồ chín tới rồi giã hoặc tán cho mịn, nắm thành
          **4 nắm tròn** bằng nhau. Nắm sẵn thì lúc gói chỉ việc bổ đôi đặt vào,
          nhanh và đều tay hơn xúc từng thìa
      - id: muoibchg
        name: Muối hạt
        icon: jar
        base: 2
        unit: muỗng canh
        note: >-
          Chia hai: một phần xóc nếp, một phần nêm đậu và ướp thịt. Bánh chưng
          nêm nhạt tay hơn ta tưởng — nó ăn kèm dưa hành và giò, không phải ăn
          một mình
  - name: Nhân thịt
    icon: meat
    items:
      - id: bachibchg
        name: Thịt ba chỉ
        icon: meat
        color: red
        base: 500
        unit: g
        note: >-
          Chọn miếng có **mỡ dày chừng một phần ba**, nhiều tầng nạc mỡ xen kẽ.
          Thịt nạc quá thì sau mười hai tiếng luộc sẽ khô xác và bã; mỡ chính là
          thứ làm miếng nhân mềm rục và thơm. Thái miếng to bản, dày chừng 1 cm
      - id: tieubchg
        name: Tiêu xay
        icon: pepper
        base: 1
        unit: muỗng canh
        note: >-
          Xay thô, xay nhiều — tiêu là mùi chủ đạo của nhân bánh chưng. Ướp cùng
          muối, để **1 giờ** cho ngấm
      - id: hanhtimbchg
        name: Hành tím
        icon: onion
        base: 4
        unit: củ
        note: >-
          Băm nhỏ ướp cùng thịt. Tùy nhà — có nơi không cho hành, để nhân chỉ
          thuần vị tiêu
  - name: Lá và lạt
    icon: herb
    items:
      - id: ladongbchg
        name: Lá dong
        icon: herb
        color: green
        base: 20
        unit: lá
        note: >-
          Chọn lá **bánh tẻ** — không quá non (dễ rách) cũng không quá già (giòn
          và nhạt màu), bản rộng, cuống còn tươi. Mỗi chiếc bánh cần 4 lá lành
          cộng 1 lá dự phòng. Rửa từng lá hai mặt, lau **thật khô**, cắt bỏ sống
