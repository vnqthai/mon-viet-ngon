heroEyebrow: Bí quyết nằm ở hai chục phút trong ngăn đá…

quick:
  ingredients:
    - Cua biển sống [[1.2|kg]] — chừng 3–4 con, còn buộc dây, càng cựa mạnh
    - Bia [[330|ml]] — một lon là đủ, đổ dưới đáy nồi
    - Sả [[5|cây]] đập dập · gừng [[1|củ]] thái lát dày
    - "Chấm: muối [[1|muỗng cà phê]] · tiêu xay [[1|muỗng cà phê]] · chanh [[2|trái]] · ớt"
  steps:
    - Để **nguyên dây buộc**, cho cua vào ngăn đá **[[20|phút]]** — cua ngủ yên thì hấp không giãy, không rụng càng.
    - Lấy ra, dùng **bàn chải chà sạch mai, yếm và kẽ chân**, xả nước, cắt bỏ dây.
    - Đổ [[330|ml]] bia vào đáy nồi, xếp sả đập dập và gừng lát lên xửng hấp.
    - Xếp cua lên trên, **để ngửa bụng lên trời** — gạch nằm yên trong mai, không chảy mất.
    - Đậy nắp, đun **lửa lớn tới khi bia sôi**, rồi hạ lửa vừa hấp **15–18 phút**.
    - Mai chuyển **đỏ cam đều, không còn mảng xám** là chín. Đừng hấp lâu hơn.
    - Pha muối tiêu chanh, dọn nóng.
  warning: >-
    Thả cua sống thẳng vào nồi nóng là nó giãy và **tự rụng hết càng**, thịt
    trong càng chảy ra ngoài. Hai chục phút trong ngăn đá giải quyết triệt để
    chuyện đó — bước này không có cách thay thế.

flavor:
  chua: 1.5
  ngot: 7
  man: 4
