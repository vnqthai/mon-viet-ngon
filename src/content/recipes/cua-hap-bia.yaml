title: Cua hấp bia **thịt ngọt chắc, càng nguyên vẹn**
summary: >-
  Cua biển ướp lạnh cho ngủ yên rồi mới hấp — **càng không rụng, gạch không
  chảy** — xếp trên giàn sả gừng, hơi bia bốc lên khử tanh và giữ nguyên vị
  ngọt của thịt. Chấm muối tiêu chanh là xong một bàn.
region: Cả nước
category: Hấp
occasions: [Nhậu lai rai, Đãi khách]
pubDate: 2026-07-31
time:
  total: 45 phút
  active: 25 phút
servingsBase: 4
difficulty: Vừa
featured: false
