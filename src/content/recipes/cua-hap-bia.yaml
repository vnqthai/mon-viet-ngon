stepsEyebrow: Vô bếp thôi!
stepsTitle: 4 bước ra **dĩa cua hấp nguyên càng**
stepsLead: >-
  Bước đầu là bước quan trọng nhất và cũng nhàn nhất — cho cua vào ngăn đá rồi
  đi làm việc khác. Ba bước sau chỉ là chà rửa, xếp nồi và canh giờ.
steps:
  - title: Ướp lạnh cho cua ngủ
    icon: clock
    minutes: 20 phút
    bullets:
      - text: >-
          **Để nguyên dây buộc**, cho cả con vào ngăn đá **[[20|phút]]** (hoặc
          vùi trong thau nước đá chừng 15 phút).
      - text: >-
          Lấy ra thấy cua **nằm im, không cựa** là được. Còn cựa mạnh thì cho
          lại thêm 5 phút.
      - text: >-
          Đừng để quá 30 phút — cua đông cứng thì thịt bị xốp sau khi hấp.
    callout:
      type: tip
      text: >-
        Đây là mẹo giải quyết luôn ba vấn đề cùng lúc: **cua không giãy nên
        không rụng càng**, dễ chà rửa hơn hẳn, và người làm cũng đỡ sợ. Nếu
        thích cách nhanh gọn thì dùng **dao nhọn đâm dứt khoát vào phần yếm
        tam giác dưới bụng** — cua đi ngay, không giãy.
  - title: Chà rửa thật kỹ
    icon: knife
    minutes: 10 phút
    bullets:
      - text: >-
          Dùng **bàn chải cứng chà mai, yếm và nhất là kẽ chân** — chỗ đó bám
          nhiều bùn cát nhất.
      - text: >-
          Xả lại nhiều lần dưới vòi nước cho tới khi nước trong.
      - text: >-
          Cắt bỏ dây buộc **sau khi rửa xong**, ngay trước lúc xếp vào nồi.
    callout:
      type: warn
      text: >-
        Không chà kỹ kẽ chân thì hấp xong cả nồi có mùi bùn, và cắn miếng thịt
        lại nghe sạn. Đây là việc buồn tay nhất của món nhưng bỏ qua là hỏng
        hết.
  - title: Xếp nồi — cua nằm ngửa
    icon: pot
    minutes: 5 phút
    bullets:
      - text: >-
          Đổ [[330|ml]] bia vào **đáy nồi**, đặt xửng hấp lên trên — mực bia
          phải **thấp hơn đáy xửng**, không chạm tới cua.
      - text: >-
          Xếp sả đập dập và gừng lát thành một lớp trên xửng, làm giàn cho cua
          nằm.
      - text: >-
          Xếp cua lên trên, **ngửa bụng lên trời**. Nằm ngửa thì gạch đọng lại
          trong mai; nằm sấp là gạch chảy hết xuống nồi.
    callout:
      type: warn
      text: >-
        Đây là món **hấp**, không phải luộc bia. Đổ bia ngập cua thì thịt nhả
        hết chất ngọt vào nước, con cua ăn nhạt và bã. Một lớp mỏng dưới đáy là
        đủ — hơi bia mới là thứ làm việc.
  - title: Hấp & pha chén chấm
    icon: flame
    minutes: 18 phút
    bullets:
      - text: >-
          Đậy nắp, **lửa lớn cho bia sôi** rồi hạ xuống lửa vừa, hấp
          **15–18 phút** với cua cỡ [[300|g]] một con. Con to hơn thì cộng
          thêm 3–4 phút.
      - text: >-
          Cua chín khi mai **đỏ cam đều, không còn mảng xám**, và mở nắp là
          dậy mùi thơm ngọt.
      - text: >-
          Trong lúc chờ, giã muối, tiêu và ớt với nhau, **vắt chanh vào ngay
          trước khi dọn** — vắt sớm là chén chấm đắng.
      - text: >-
          Bày cua ra dĩa, dọn nóng cùng chén muối tiêu chanh và cái kẹp càng.
    callout:
      type: warn
      text: >-
        Hấp quá tay là hỏng theo kiểu không cứu được: **thịt tách khỏi vỏ, khô
        xác và mất ngọt**. Canh giờ cho đúng, thà thiếu một phút — thiếu thì
        đậy lại hấp thêm, thừa thì chịu.
    timer:
      secs: 1080
      label: Hẹn giờ hấp cua · 18:00
      doneMsg: Mai đỏ cam đều rồi — tắt bếp, dọn nóng ngay!
    doneText: Tách mai thấy gạch còn nguyên khối — xong!

tipsTitle: 6 bí quyết cho **cua nguyên càng, thịt chắc ngọt**
tipsLead: >-
  Cua là nguyên liệu đắt, nên món này đáng bỏ công nhớ mấy điều dưới đây —
  sai một chỗ là mất tiền oan.
tips:
  - icon: clock
    title: Ngăn đá hai chục phút — mẹo quan trọng nhất
    text: >-
      Cua lịm đi thì vào nồi nằm yên, **càng không rụng, thịt không chảy**.
      Đây là khác biệt lớn nhất giữa dĩa cua nhà hàng và dĩa cua nấu ở nhà,
      mà lại là bước dễ nhất trong cả món.
  - icon: shrimp
    title: Chọn cua chắc, đừng chọn cua to
    text: >-
      Bấm nhẹ vào **yếm** (phần tam giác dưới bụng): thấy **cứng, không lún**
      là cua chắc thịt. Lún mềm là cua ốp, hấp xong toàn nước. Xem thêm cái
      **càng cựa có mạnh không** — cua yếu ớt là đã để lâu.
  - icon: pot
    title: Hấp, không luộc
    text: >-
      Bia chỉ đổ một lớp dưới đáy, **không được chạm tới cua**. Ngâm trong
      nước là thịt nhả hết chất ngọt ra ngoài. Cùng lý do đó, đừng mở nắp
      giữa chừng nhiều lần — mỗi lần mở là mất hơi và kéo dài thời gian.
  - icon: flame
    title: Nằm ngửa để giữ gạch
    text: >-
      Con cua nằm sấp thì gạch chảy xuống nồi hết, tách mai ra chỉ còn một
      khoảng trống. **Ngửa bụng lên trời** thì gạch đọng nguyên khối trong
      mai — với cua gạch, đó chính là phần đáng tiền nhất.
  - icon: lime
    title: Vắt chanh vào chén chấm sát giờ ăn
    text: >-
      Muối tiêu ớt giã trước thì được, nhưng **chanh phải vắt ngay trước khi
      dọn**. Vắt sớm để lâu là chén chấm chuyển đắng, phí cả dĩa cua. Ai thích
      thì thay bằng **muối ớt xanh** giã với lá chanh.
  - icon: bulb
    title: Đừng bỏ phần nước đọng trong mai
    text: >-
      Khi tách mai, chỗ nước ngọt đọng lại bên trong là **tinh túy của con
      cua**. Nghiêng mai húp trực tiếp, hoặc rưới lại lên phần thịt. Đổ đi là
      bỏ mất thứ ngon nhất mà chẳng ai để ý.

serve:
  title: Dĩa cua nóng giữa bàn — **món ăn bằng tay, ăn chậm**
  paras:
    - >-
      Cua hấp là món **phải ăn nóng và ăn bằng tay**. Dọn kèm cái kẹp càng,
      cái xiên nhỏ để khều thịt trong ngóc ngách, và một tô nước ấm có vắt
      chanh để rửa tay. Bày giấy lót bàn cho thoải mái — món này không có
      cách ăn nào lịch sự hết.
    - >-
      Thứ tự ăn quen thuộc: **tách mai húp phần nước ngọt và gạch trước**, rồi
      mới tới thân, cuối cùng là càng — để dành phần thịt chắc nhất sau cùng.
      Bên cạnh nên có dĩa rau răm hoặc vài lát dưa leo cho đỡ ngán.
  aside:
    title: Trên bàn nên có
    intro: "Bốn thứ dọn cùng dĩa cua:"
    items:
      - icon: lime
        text: "**Chén muối tiêu chanh** — vắt chanh sát giờ ăn."
      - icon: knife
        text: "**Kẹp càng và xiên nhỏ** — thiếu là khều thịt không ra."
      - icon: herb
        text: "**Rau răm hoặc dưa leo** — cắt cái ngậy, ăn được lâu hơn."
      - icon: drop
        text: "**Tô nước ấm vắt chanh** — để rửa tay giữa chừng."

faq:
  - q: Làm sao chọn được cua chắc thịt, không bị ốp?
    a: >-
      Bấm vào **yếm dưới bụng**: cứng, không lún là chắc. Bóp nhẹ phần **đầu
      càng** cũng vậy — lún mềm là cua ốp. Thêm hai dấu hiệu: cua còn **cựa
      mạnh khi chạm** và **cầm lên thấy nặng tay so với kích thước**. Cua ốp
      hấp xong chỉ còn nước, mất tiền oan.
  - q: Cua thịt và cua gạch, nên mua loại nào?
    a: >-
      **Cua gạch** (con cái, yếm to tròn) có khối gạch cam béo trong mai — đắt
      hơn và là phần nhiều người mê nhất. **Cua thịt** (con đực, yếm nhọn) thì
      càng to, thịt nhiều và chắc hơn. Mua cả hai loại mỗi thứ vài con là bàn
      nào cũng vui.
  - q: Không có bia thì hấp bằng gì?
    a: >-
      Hấp bằng **nước lọc với sả gừng** vẫn ngon — bia chỉ giúp khử tanh và
      thêm chút mùi thơm, không phải thứ quyết định. Hoặc thay bằng **nước dừa
      tươi**, con cua sẽ ngọt hơn một chút. Điều quan trọng vẫn là lượng nước
      chỉ đủ dưới đáy nồi.
  - q: Hấp bao lâu là đúng với cua to?
    a: >-
      Tính theo con: cỡ **[[300|g]] mỗi con thì 15–18 phút**; con **[[500|g]]
      trở lên thì 20–22 phút**. Dấu hiệu chắc chắn nhất vẫn là **mai đỏ cam
      đều, không còn mảng xám**. Nghi ngờ thì tắt bếp, tách thử một con — chưa
      tới thì đậy lại hấp thêm 3 phút.
  - q: Cua hấp xong bị tanh?
    a: >-
      Do **chà rửa chưa kỹ**, nhất là kẽ chân và mặt yếm. Cũng có thể do cua đã
      để lâu — cua càng ươn càng tanh, và không gia vị nào cứu được. Lần sau
      chà bằng bàn chải cứng và mua cua còn cựa mạnh.
  - q: Ăn không hết thì cất thế nào?
    a: >-
      Để nguội, cất hộp kín trong ngăn mát, **dùng trong 1 ngày**. Hâm lại
      bằng cách hấp lại 5 phút chứ đừng quay lò vi sóng — vi sóng làm thịt cua
      dai như cao su. Hoặc gỡ thịt ra làm **cháo cua, miến xào cua** cho bữa
      sau, còn ngon hơn hấp lại.

