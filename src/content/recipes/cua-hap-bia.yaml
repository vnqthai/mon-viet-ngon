flavorNote: >-
  **Chuẩn con cua hấp:** mai **đỏ cam đều**, thịt **trắng ngà, tách khỏi vỏ
  thành thớ chắc** chứ không nhão bết; gạch còn **nguyên khối trong mai**,
  màu cam sậm và béo. Không mùi tanh — chỉ thoảng mùi sả gừng.
storyEyebrow: Chuyện con cua
storyTitle: Bí quyết không nằm ở nồi hấp, **nằm ở ngăn đá**
story:
  - >-
    Ai từng hấp cua ở nhà đều gặp cảnh này: mở nắp nồi ra, mấy cái càng nằm
    lăn lóc một góc, con cua thì trơ thân. Lý do đơn giản — cua sống gặp nóng
    thì giãy, mà khớp càng của nó vốn có cơ chế **tự rụng khi bị kích động**.
    Càng rụng thì nước ngọt trong càng chảy hết ra nồi.
  - >-
    Cách chữa lại nằm ở chỗ chẳng ai nghĩ tới: **cho cua vào ngăn đá chừng hai
    chục phút**. Lạnh làm con cua lịm đi, thả vào nồi hấp là nằm yên. Càng
    nguyên vẹn, gạch nguyên khối, thịt giữ được hết vị ngọt. Một mẹo nhỏ mà
    thay đổi hẳn kết quả.
  - >-
    Còn bia trong nồi thì làm hai việc: hơi bia bốc lên **cuốn mùi tanh đi**,
    và cùng với sả gừng để lại một mùi thơm nhẹ trên vỏ. Đừng đổ bia ngập cua
    — chỉ cần một lớp dưới đáy, vì đây là món **hấp** chứ không phải luộc. Cua
    ngâm trong nước là thịt nhạt ngay.

