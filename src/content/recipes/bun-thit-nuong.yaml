quick:
  ingredients:
    - Ba rọi hoặc nạc dăm [[600|g]] — có mỡ mới không khô; thái lát mỏng bản to
    - >-
      Ướp: sả băm [[3|cây]] · tỏi [[4|tép]] · hành tím [[2|củ]] · nước mắm
      [[2|muỗng canh|frac]] · đường [[1.5|muỗng canh|frac]] (hoặc mật ong) ·
      dầu hào [[1|muỗng canh]] · nước màu [[1|muỗng cà phê]] · tiêu · dầu ăn
    - >-
      Bún tươi [[1|kg|frac]] · xà lách, húng quế, tía tô · giá [[150|g]] ·
      dưa leo [[2|trái]]
    - >-
      Đồ chua: cà rốt [[1|củ]] + củ cải trắng [[1|củ]] bào sợi, ngâm giấm
      đường
    - >-
      Mỡ hành: hành lá [[1|bó]] + dầu nóng · đậu phộng rang [[60|g]] giã dối
    - >-
      Nước mắm chan: nước mắm [[4|muỗng canh|frac]] · đường
      [[4|muỗng canh|frac]] · nước ấm [[250|ml]] · chanh [[1|trái]] · tỏi ớt
      băm
  steps:
    - Thịt thái lát mỏng **bản to**, ướp sả tỏi + gia vị, để **ít nhất 1 giờ** (qua đêm càng thấm).
    - Bào sợi cà rốt, củ cải bóp muối, ngâm giấm đường 30 phút; làm mỡ hành; rang đậu phộng giã dối.
    - Pha nước mắm chua ngọt **loãng kiểu chan** — dịu hơn nước chấm hẳn một bậc.
    - Nướng thịt trên **than hồng** (hoặc chảo gang, nồi chiên không dầu), trở đều tới vàng nâu xém cạnh.
    - Xà lách, rau thơm, dưa leo xắt sợi lót đáy tô, gắp bún tơi lên trên.
    - Xếp thịt nóng + đồ chua, rưới mỡ hành, rắc đậu phộng.
    - Chan 3–4 muỗng nước mắm, **trộn đều từ dưới lên** rồi ăn liền.
  warning: >-
    Thịt nạc trơn + thái dày + lửa ngọn bùng = miếng thịt khô cứng. Chọn
    thịt **có mỡ**, thái mỏng, nướng trên than hồng chứ không phải trên
    ngọn lửa.

flavor:
  chua: 5
  ngot: 6
  man: 5.5
  cay: 3
  thom: 8.5
flavorNote: >-
  **Chuẩn vị:** một đũa phải đủ bún mát – thịt nóng xém thơm – đồ chua
  giòn tan, nước mắm chua ngọt thấm tới đáy tô mà không đọng thành vũng —
  "khô" mà không khô, đó là cái duyên của món này.
storyEyebrow: Chuyện tô bún
storyTitle: Tô bún của **những trưa Sài Gòn**
story:
  - >-
    Ở Sài Gòn, nhiều khi chưa thấy quán đã biết mình sắp đi ngang hàng bún
    thịt nướng: **mùi thịt ướp sả rớt mỡ xuống than** bay ra tận đầu hẻm,
    ai chạy xe ngang cũng phải nuốt nước miếng một cái. Cái bếp than nhỏ
    với vỉ thịt xèo xèo chính là tấm bảng hiệu thơm nhất của món này —
    không cần đèn, không cần chữ.
  - >-
    Tô bún thịt nướng hay ở chỗ **gói đủ nóng lạnh trong một tô**: bún với
    rau mát rượi nằm dưới, thịt vừa rời vỉ còn ấm khói nằm trên, đồ chua
    giòn, mỡ hành béo, đậu phộng bùi. Và đây là bún "khô" kiểu Nam — **nước
    mắm chua ngọt chan thẳng vô tô** rồi trộn, chứ không bưng chén chấm như
    ngoài Bắc. Chan tới đâu, sợi bún thấm tới đó.
  - >-
    Nướng than là đúng điệu nhất, nhưng nhà phố không có bếp than cũng đừng
    buồn: chảo gang hay nồi chiên không dầu vẫn ra miếng thịt xém cạnh
    ngon lành. Ăn thua không nằm ở cái bếp, mà ở **miếng thịt có mỡ và
    thau nước ướp pha khéo** — hai thứ đó, công thức dưới đây lo trọn.

