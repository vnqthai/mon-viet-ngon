title: Bún thịt nướng **xém cạnh mật ong, chan mắm là ghiền**
summary: >-
  Tô bún "khô" đúng kiểu Sài Gòn: bún tươi mát nằm dưới, thịt ướp sả nướng
  vàng xém nằm trên, thêm đồ chua giòn, mỡ hành béo, đậu phộng bùi — rồi
  **chan thẳng nước mắm chua ngọt vô tô** mà trộn. Một đũa đủ nóng lạnh
  giòn mềm, ăn một lần là hiểu vì sao ai cũng ghiền.
region: Miền Nam
category: Bún trộn
occasions: [Ăn chơi]
pubDate: 2026-07-28
time:
  total: 1 giờ (+ ướp 1 giờ)
servingsBase: 4
