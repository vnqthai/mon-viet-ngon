stepsEyebrow: Vô bếp thôi!
stepsTitle: 6 bước ra **tô bún chuẩn hẻm Sài Gòn**
stepsLead: >-
  Trình tự khôn nhất: ướp thịt trước rồi mới làm đồ chua, mỡ hành, nước
  mắm — thịt vừa thấm là mọi thứ sẵn sàng, nướng xong ráp tô ăn liền cho
  nóng.
steps:
  - title: Thái & ướp thịt — thắng nửa trận
    icon: knife
    minutes: 15 phút (+ ướp 1 giờ)
    intro: "Miếng thịt ngon hay dở là từ thau ướp mà ra:"
    bullets:
      - label: "Thái:"
        text: >-
          thịt rửa sạch, thấm khô, bỏ ngăn đá **20 phút** cho hơi cứng rồi
          thái lát mỏng cỡ **nửa phân, bản to** — mỏng để xém nhanh không
          kịp khô, bản to để gác vỉ không lọt.
      - label: "Pha nước ướp:"
        text: >-
          sả + tỏi + hành tím băm nhuyễn, trộn với [[2|muỗng canh|frac]]
          nước mắm + [[1.5|muỗng canh|frac]] đường (hoặc mật ong) +
          [[1|muỗng canh]] dầu hào + [[1|muỗng cà phê]] nước màu (nước
          đường thắng kiểu kho thịt, ngoài Bắc kêu nước hàng) + ½ muỗng cà
          phê tiêu + [[2|muỗng canh|frac]] dầu ăn.
      - label: "Ướp:"
        text: >-
          trộn đều cho từng lát thịt áo kín nước ướp, đậy kín, để ngăn mát
          **ít nhất 1 giờ** — ướp qua đêm càng thấm sâu.
    callout:
      type: tip
      text: >-
        Muỗng dầu ăn trong thau ướp nghe lạ mà có lý: lớp dầu **khóa ẩm
        cho miếng thịt**, xuống vỉ đỡ khô, lên màu lại bóng đẹp.
    timer:
      secs: 3600
      label: Hẹn giờ ướp thịt · 60:00
      doneMsg: Thịt thấm rồi — nhóm bếp thôi!
  - title: Ngâm đồ chua giòn tan
    icon: pod
    minutes: 10 phút (+ ngâm 30 phút)
    bullets:
      - text: >-
          Cà rốt, củ cải gọt vỏ **bào sợi** (hoặc xắt que mỏng), bóp với 1
          muỗng cà phê muối chừng 10 phút rồi xả sạch, vắt ráo — sợi dẻo
          giòn, hết hăng.
      - text: >-
          Khuấy tan [[100|ml]] giấm gạo + [[100|ml]] nước lọc +
          [[4|muỗng canh|frac]] đường, trút vô ngâm **ít nhất 30 phút**.
    callout:
      type: tip
      text: >-
        Làm dư gấp đôi, cất hũ ngăn mát để dành — đồ chua này kèm cơm tấm
        sườn, bánh mì hay món nướng nào cũng hợp rơ.
    timer:
      secs: 1800
      label: Hẹn giờ ngâm đồ chua · 30:00
      doneMsg: Đồ chua chua ngọt giòn rồi!
  - title: Mỡ hành, đậu phộng & nước mắm chan
    icon: bottle
    minutes: 15 phút
    bullets:
      - label: "Mỡ hành:"
        text: >-
          hành lá xắt nhuyễn cho vô chén với nhúm muối + nhúm đường; đun
          [[3|muỗng canh|frac]] dầu **thiệt nóng**, dội thẳng vô nghe
          "xèo" một tiếng, khuấy đều — hành chín tái, xanh óng.
      - label: "Đậu phộng:"
        text: >-
          rang vàng (hoặc mua loại rang sẵn), để nguội rồi **giã dối** —
          còn hột to hột nhỏ lổn nhổn mới vui miệng.
      - label: "Nước mắm chan:"
        text: >-
          khuấy tan [[4|muỗng canh|frac]] đường trong [[250|ml]] nước ấm,
          thêm [[4|muỗng canh|frac]] nước mắm + nước cốt [[1|trái]] chanh,
          nếm cho chua – ngọt – mặn cân nhau; tỏi ớt băm thả sau cùng.
    callout:
      type: warn
      text: >-
        Nước mắm chan phải **loãng và dịu hơn nước chấm chả giò, gỏi
        cuốn** — vì nó thấm ngập cả tô chứ không phải chấm từng đũa. Pha
        đậm kiểu nước chấm là mặn cả tô bún, cứu không kịp.
  - title: Nướng thịt — khúc "ăn tiền" nhất
    icon: flame
    minutes: 20 phút
    intro: "Than hồng là đúng điệu, nhưng bếp nào cũng có bài riêng:"
    bullets:
      - label: "Bếp than (đúng điệu):"
        text: >-
          chờ than **cháy hồng, phủ lớp tro trắng** mới gác vỉ. Xếp thịt
          thưa tay, trở đều mỗi mặt 2–3 phút tới **vàng nâu xém cạnh**,
          phết thêm chút nước ướp cho bóng.
      - label: "Chảo gang / chảo chống dính:"
        text: >-
          chảo thiệt nóng với chút dầu, xếp thịt **một lớp** — để yên cho
          xém mặt rồi mới lật, đừng đảo lia lịa như xào.
      - label: "Nồi chiên không dầu:"
        text: >-
          xếp một lớp, 180°C chừng **12–15 phút**, lật một lần giữa chừng
          — tiện cho ngày mưa không nhóm than được.
    callout:
      type: warn
      text: >-
        Mỡ nhỏ xuống than **bùng lửa ngọn** là thịt đen khét ngoài, sống
        trong. Thấy lửa bùng thì dời thịt né qua góc vỉ, chờ lửa dịu rồi
        nướng tiếp.
  - title: Ráp tô cho đủ tầng lớp
    icon: bowl
    minutes: 10 phút
    bullets:
      - text: >-
          Xà lách, rau thơm xắt sợi + dưa leo + giá — **lót đáy tô** làm
          lớp nệm mát.
      - text: Gắp bún **tơi từng vắt** phủ lên, đơm vun mà đừng nén chặt.
      - text: >-
          Xếp thịt nướng còn nóng một bên, đồ chua vắt ráo một bên; rưới
          **mỡ hành** lên thịt và bún, rắc đậu phộng khắp mặt.
    callout:
      type: tip
      text: >-
        Muốn "full topping" như ngoài quán: cắt thêm 1–2 cuốn **chả giò
        nóng** thành khúc gác lên mặt — tô bún thịt nướng chả giò huyền
        thoại, nhà có bài chả giò rồi đó, cuốn một thể luôn.
  - title: Chan mắm & trộn — nghi thức cuối
    icon: spoon
    minutes: 2 phút
    bullets:
      - text: Rưới **3–4 muỗng canh nước mắm** vòng quanh tô cho thấm đều.
      - text: >-
          Trộn **từ dưới lên** cho rau, bún, thịt áo đều nước mắm; nếm thử
          rồi chan thêm tùy miệng.
      - text: >-
          Ăn liền khi thịt còn ấm — để lâu bún ngấm mặn, rau xẹp, uổng
          công nướng.
    doneText: Trộn đều — khai đũa thôi!

tipsTitle: 8 bí quyết cho **miếng thịt nướng để đời**
tipsLead: >-
  Bún, rau, đồ chua ai làm cũng giống nhau — ăn thua là ở vỉ thịt và chén
  nước mắm. Mấy điều này nghe qua là nấu khác liền.
tips:
  - icon: meat
    title: Có mỡ mới có khói thơm
    text: >-
      Ba rọi hay nạc dăm đều được, miễn **có mỡ**: mỡ chảy xuống than bốc
      khói quyện ngược vô thịt — đó mới là mùi bún thịt nướng. Nạc thăn
      trơn nướng xong khô xác, ướp giỏi cỡ nào cũng không cứu nổi.
  - icon: knife
    title: Thái mỏng, bản to
    text: >-
      Lát mỏng cỡ nửa phân chín nhanh, xém cạnh mà chưa kịp khô; bản to
      cho miếng thịt "ăn ảnh" và không lọt vỉ. Thịt bỏ ngăn đá 20 phút cho
      hơi cứng là thái mỏng dễ như chơi.
  - icon: stem
    title: Sả tỏi phải băm nhuyễn
    text: >-
      Băm nhuyễn thì tinh dầu mới tiết ra **bám vô từng lát thịt**, nướng
      lên thơm dậy góc bếp. Sả đập giập nguyên khúc chỉ hợp nồi kho nồi
      luộc — ướp thịt nướng là quá "hiền".
  - icon: jar
    title: Đường + nước màu lo phần "da"
    text: >-
      Đường (hay mật ong) caramel hóa trên vỉ cho **màu mật ong óng**,
      nước màu tiếp thêm tông cánh gián — thiếu bộ đôi này miếng thịt chín
      mà nhợt, nhìn kém thèm hẳn.
  - icon: flame
    title: Than hồng, không lửa ngọn
    text: >-
      Chờ than **ửng hồng phủ tro trắng** mới nướng: nhiệt đều, chín từ
      từ, khói thơm. Lửa ngọn táp mặt là cháy đắng lớp ướp ngoài mà trong
      còn sống — nóng vội hư vỉ thịt.
  - icon: bottle
    title: Nước mắm chan pha "hiền"
    text: >-
      Nó là nước "tắm" cho cả tô chứ không phải nước chấm: **loãng, ngọt
      dịu, chua nhẹ**. Cứ pha rồi nếm bằng cách chấm thử cọng bún — thấy
      vừa miệng là chuẩn, thấy "đậm đà" là mặn.
  - icon: drop
    title: Mỡ hành là chất keo
    text: >-
      Lớp mỡ hành áo sợi bún cho **bóng, béo nhẹ và giữ đậu phộng, thịt
      dính vô đũa bún** — thiếu nó tô bún rời rạc, ăn cứ thấy lạt lẽo dù
      nêm đủ.
  - icon: noodle
    title: Bún tơi thì tô mới ngon
    text: >-
      Bún tươi mua về nếu bết dính, **trụng nước sôi 5 giây rồi xả nguội,
      để ráo** — sợi rời, mát, hết mùi chua nhẹ. Gắp vô tô từng vắt nhỏ
      cho tơi, đừng nén.

serve:
  title: Dọn tô **kiểu Sài Gòn**
  paras:
    - >-
      Tô bún dọn ra phải thấy **đủ tầng lớp**: rau xanh dưới đáy, bún
      trắng ở giữa, thịt nướng màu mật ong với đồ chua cam trắng trên mặt,
      mỡ hành đậu phộng rắc sau cùng. Trưa nắng làm một tô, thêm ly trà đá
      — đúng bài vỉa hè Sài Gòn.
    - >-
      Nhà có khách thì bày kiểu **"trạm ráp tô"**: thau bún, rổ rau, dĩa
      thịt mới nướng, chén mỡ hành, hũ đồ chua và ca nước mắm giữa bàn —
      ai ráp tô nấy, nướng tới đâu ăn tới đó, vui như tiệc nhỏ mà chủ nhà
      nhàn tênh.
    - >-
      Còn dư thịt nướng? Mai kẹp bánh mì với đồ chua, dưa leo là có ổ bánh
      mì thịt nướng giòn thơm — món này nấu một lần, ngon được hai bữa.
  aside:
    title: Trên bàn cho đủ bộ
    intro: "Thêm mấy thứ này là y hình ngoài quán:"
    items:
      - icon: roll
        text: >-
          **Chả giò cắt khúc** — lên đời tô bún "full topping", nhà có
          bài chả giò rồi đó.
      - icon: bottle
        text: "**Ca nước mắm chan để giữa bàn** — ai ăn đậm tự dặm thêm."
      - icon: lettuce
        text: "**Dĩa rau sống dặm thêm** — món này phải hào phóng rau mới đã."
      - icon: drop
        text: "**Ly trà đá mát lạnh** — combo trưa nắng không thể tách rời."

faq:
  - q: Bún thịt nướng khác bún chả Hà Nội chỗ nào?
    a: >-
      Khác nhau ở cách "gặp" nước mắm: bún chả Hà Nội có **chén nước chấm
      ấm pha giấm đường**, gắp bún gắp chả **chấm ngập** trong chén; còn
      bún thịt nướng kiểu Nam gom hết vô một tô rồi **chan nước mắm chua
      ngọt trộn đều**. Thịt cũng khác: ngoài Bắc là chả viên + ba chỉ
      miếng, trong Nam là thịt lát ướp sả. Site có bài bún chả Hà Nội —
      nấu thử cả hai rồi hẵng chọn phe.
  - q: Không có bếp than thì nướng kiểu gì cho gần giống nhất?
    a: >-
      **Chảo gang** cho kết quả gần than nhất — giữ nhiệt cao, xém cạnh
      đẹp; nhớ mở hết hút mùi. **Nồi chiên không dầu** tiện và sạch, thịt
      chín đều nhưng thiếu chút mùi khói — bù bằng cách chọn thịt nhiều mỡ
      hơn và rưới mỡ hành hào phóng.
  - q: Thay ba rọi bằng thịt gì được?
    a: >-
      **Nạc dăm** là lựa số một (nạc xen mỡ, mềm mà không ngấy), rồi tới
      **nạc vai**. Thăn hay mông quá trơn thì ướp thêm 1 muỗng dầu ăn và
      chấp nhận miếng thịt "hiền" hơn — hoặc để dành hai loại đó cho món
      xào.
  - q: Ướp thịt trước rồi trữ được không?
    a: >-
      Được và nên: thịt ướp đậy kín để **ngăn mát tới 24 giờ** — càng
      thấm. Làm nhiều thì chia hộp **trữ đông cả tháng**, bữa nào lười lấy
      xuống rã đông ngăn mát từ đêm trước, sáng ra chỉ việc nướng.
  - q: Nước mắm chan pha sẵn để được bao lâu?
    a: >-
      Phần **mắm + đường + nước** nấu tan để nguội, cất chai ngăn mát được
      cả tuần. **Chanh, tỏi, ớt thì bữa nào pha bữa đó** — chanh để lâu
      lên vị đắng, tỏi ớt ngâm lâu mất mùi tươi.
  - q: Miền Trung cũng có bún thịt nướng mà?
    a: >-
      Có, và khác ở chén nước: Huế, Đà Nẵng chan **mắm nêm** pha khóm —
      mặn nồng, "nghe mùi là biết", ghiền rồi khó dứt. Bản Sài Gòn trong
      bài dùng nước mắm chua ngọt dịu, dễ ăn cho cả nhà — hôm nào muốn đổi
      gió cứ pha mắm nêm thế vô, còn lại giữ nguyên.

