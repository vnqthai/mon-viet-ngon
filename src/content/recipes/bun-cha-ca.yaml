steps:
  - title: Quết chả cá cho dẻo tay
    icon: knife
    minutes: 25 phút
    intro: "Đây là bước quyết định — làm dối ở đây thì cả tô hỏng:"
    bullets:
      - label: "Lóc và ướp:"
        text: >-
          Phi lê cá lạng bỏ da, xắt miếng nhỏ, ướp với hành tỏi băm, [[1|muỗng
          cà phê|frac]] tiêu trắng, [[1|muỗng cà phê|frac]] đường và chút nước
          mắm. Để **15 phút** trong ngăn mát.
      - label: "Quết:"
        text: >-
          Xay từng mẻ nhỏ, xay **nhấp nhả** chứ đừng xay liền một hơi — máy nóng
          làm thịt cá chảy nhão. Trút ra tô, dùng muỗng **quết mạnh một chiều**
          chừng 5 phút tới khi khối cá dẻo dính, vỗ xuống thớt nghe **bộp**.
      - label: "Chia đôi:"
        text: >-
          Một nửa trộn thêm thì là + hành lá để **hấp**; nửa còn lại để trơn,
          dành **chiên**.
    callout:
      type: warn
      text: >-
        Cá xay quá nhuyễn thành **bột cá**, miếng chả bở như bánh. Xay tới khi
        còn thấy lợn cợn sợi thịt là dừng — phần dẻo do quết mà ra, không phải
        do xay.
  - title: Hấp một nửa, chiên một nửa
    icon: flame
    minutes: 25 phút
    bullets:
      - label: "Chả hấp:"
        text: >-
          Ém khối cá vào tô lòng nông, dàn dày chừng 2 cm, **hấp 15 phút**. Để
          nguội hẳn rồi mới xắt miếng vuông — nóng mà xắt là nát mặt.
      - label: "Chả chiên:"
        text: >-
          Nặn khối còn lại thành viên tròn dẹt dày 1 cm, chiên **lửa vừa** tới
          vàng hai mặt. Vớt ra giấy thấm dầu.
    timer:
      secs: 900
      label: Hẹn giờ hấp chả · 15:00
      doneMsg: Chả chín rồi — để nguội hẳn mới xắt nghen!
    callout:
      type: tip
      text: >-
        Nhúng tay vào nước lạnh trước khi nặn thì cá không dính tay, viên chả ra
        mặt láng đẹp.
  - title: Nướng hành gừng, hầm xương cá
    icon: pot
    minutes: 30 phút
    bullets:
      - label: "Nướng:"
        text: >-
          Hành tím và gừng nướng trực tiếp trên lửa tới **sém vỏ**, rửa sạch tro
          rồi đập dập. Bỏ qua bước này là nước lèo nhạt mùi thấy rõ.
      - label: "Rửa xương:"
        text: >-
          Xương và đầu cá rửa muối, **trụng qua nước sôi** rồi xả lại — bước này
          lấy đi phần lớn mùi tanh.
      - label: "Hầm:"
        text: >-
          Cho xương cá + hành + gừng vào [[2.5|lít]] nước lạnh, sôi thì hạ nhỏ
          lửa, hớt bọt, hầm **đúng 25 phút**. Lọc qua rây, bỏ xác.
    timer:
      secs: 1500
      label: Hẹn giờ hầm xương cá · 25:00
      doneMsg: Lọc liền nghen — để lâu là nước đắng!
    callout:
      type: warn
      text: >-
        Đừng bao giờ để nồi **sôi bùng**. Xương cá sôi mạnh là nước đục ngầu và
        tanh, mà đã đục thì không cứu lại được.
  - title: Nêm nồi — và chỗ rẽ hai lối
    icon: spoon
    minutes: 15 phút
    intro: "Tới đây nồi nước gốc đã xong, chọn một trong hai đường:"
    bullets:
      - label: "Lối Đà Nẵng:"
        text: >-
          Thả **bí đỏ xắt khối + bắp cải cắt khúc** vào nấu [[10|phút]], rồi mới
          tới thơm và cà chua. Nước ngọt dày hơn, ngả màu cam nhạt, thoảng chua.
      - label: "Lối Nha Trang – Quy Nhơn:"
        text: >-
          Bỏ qua rau củ, chỉ thả thơm và cà chua, nấu [[5|phút]] rồi vớt ra.
          Nước **trong veo**, vị nhẹ, để người ăn tự nêm ở tô.
      - label: "Nêm chung:"
        text: >-
          [[2|muỗng canh|frac]] nước mắm + [[1|muỗng cà phê|frac]] đường + muối.
          Nếm tới khi **ngọt trước, mặn sau, hậu vị nhẹ** là đạt.
      - text: >-
          Thả chả hấp và chả chiên vào nồi trước khi dọn **5 phút** cho chả ngấm
          nước — đừng thả sớm, chả chiên sẽ mất rìa giòn.
  - title: Dọn tô nóng
    icon: bowl
    minutes: 10 phút
    bullets:
      - text: >-
          Bún trụng nước sôi, xóc ráo, cho vào tô. Xếp **chả chiên một bên, chả
          hấp một bên** cho nhìn ra hai thứ.
      - text: >-
          Chan nước lèo đang sôi, rắc hành ngò xắt nhỏ và chút tiêu. Dọn kèm dĩa
          rau sống, chén mắm ruốc và chén ớt tỏi giã.
    doneText: Xong — bưng lên khi còn bốc khói!

tipsTitle: 4 chỗ **quyết định** nồi bún chả cá
tips:
  - icon: fish
    title: Xin bằng được xương và đầu cá
    text: >-
      Nấu nước lèo bằng xương heo thì ra một món khác hẳn — béo và nặng. Cái
      ngọt **thanh, hơi mảnh** của bún chả cá chỉ có khi nấu từ chính con cá đã
      lấy thịt làm chả. Mua phi lê nhớ xin xương, hàng cá thường cho không.
  - icon: clock
    title: 25 phút, không hơn
    text: >-
      Xương heo càng hầm càng ngọt, xương cá thì ngược lại: qua mốc 30–40 phút
      là **chất đắng ra nước** và mùi tanh quay trở lại. Hẹn giờ đàng hoàng rồi
      lọc, đừng ước chừng.
  - icon: onion
    title: Hành tím nướng là cái mùi người ta nhớ
    text: >-
      Hành tím sống thả vào chỉ cho vị. Nướng tới **sém vỏ** rồi mới thả thì nồi
      nước có thêm tầng mùi khói ngọt — đó chính là thứ làm tô bún ăn ở nhà khác
      tô mua ngoài hàng.
  - icon: spoon
    title: Mắm ruốc để riêng, đừng cho vào nồi
    text: >-
      Nêm mắm ruốc thẳng vào nồi là cả nồi đục và nồng, ai không quen sẽ bỏ tô.
      Dọn một chén riêng — người ăn quen thì khuấy một muỗng vào tô mình, người
      lạ vị thì để nguyên. Một nồi vừa lòng cả nhà.

serve:
  title: Tô bún sáng — **dọn nhanh, ăn nóng**
  paras:
    - >-
      Bún chả cá là món ăn sáng, mà ăn sáng thì không ai chờ. Nấu nồi nước từ
      tối hôm trước, chả cũng làm sẵn để ngăn mát — sáng ra chỉ việc bắc nồi lên
      cho sôi lại, trụng bún là có tô nóng trong mười phút.
    - >-
      Rau sống đừng bỏ vào tô sẵn. Để một dĩa riêng, ai muốn ăn tới đâu bốc tới
      đó — bắp chuối bào bỏ vào nước nóng sớm là mềm oặt, mất hết cái giòn.
  aside:
    title: Trên bàn nên có
    intro: "Ba thứ dọn kèm, thiếu thì tô bún hụt một góc:"
    items:
      - icon: chili
        text: "**Ớt tỏi giã** — giã thô trong cối, cay mà còn nghe sựt."
      - icon: jar
        text: "**Mắm ruốc** — một chén nhỏ, ai quen vị thì khuấy vào tô mình."
      - icon: lime
        text: "**Chanh và ớt xắt lát** — vắt vào lúc gần cuối tô, nước lèo bừng lên."

faq:
  - q: Không mua được cá thu thì thay bằng cá gì?
    a: >-
      **Cá mối, cá cờ, cá nhồng, cá rựa** đều làm chả ngon — miền biển vẫn dùng
      lẫn lộn. Nguyên tắc chung là chọn **cá thịt chắc, ít mỡ**; cá thịt bở như
      cá basa thì quết cách mấy cũng không dẻo.
  - q: Lười quết thì mua chả cá làm sẵn được không?
    a: >-
      Được, ngoài chợ có bán cả chả chiên lẫn chả hấp. Nhưng vẫn nên **tự nấu
      nồi nước lèo từ xương cá** — đó mới là phần làm nên món. Mua chả sẵn thì
      thả vào nồi trước khi dọn 5 phút cho ngấm.
  - q: Nước lèo bị đục thì chữa sao?
    a: >-
      Nếu do sôi mạnh thì khó cứu, nhưng vớt vát được: lọc qua rây lót khăn
      xô, rồi đun lại **thật nhỏ lửa** và hớt bọt liên tục. Lần sau nhớ hai
      điều — trụng xương trước khi hầm, và giữ nồi ở mức **lăn tăn**, không bao
      giờ sôi bùng.
  - q: Nấu lối Đà Nẵng hay lối Nha Trang thì ngon hơn?
    a: >-
      Không có lối nào hơn, chỉ có lối hợp bữa. Nhà có trẻ nhỏ hoặc ăn thay bữa
      chính thì **lối Đà Nẵng** no và ngọt hơn nhờ bí đỏ, bắp cải. Muốn một tô
      nhẹ buổi sáng, húp xong còn thấy nhẹ bụng thì **lối Nha Trang – Quy Nhơn**
      đúng bài hơn.

ticker:
  - text: Chả chiên vàng, chả hấp trắng
  - text: Nước lèo xương cá trong veo
