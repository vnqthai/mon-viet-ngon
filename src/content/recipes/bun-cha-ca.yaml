title: Bún chả cá **chả chiên vàng, chả hấp trắng**
summary: >-
  Nước lèo nấu từ **xương và đầu cá**, không phải xương heo — ngọt thanh mà
  không ngán. Một tô có đủ hai thứ chả: **chiên vàng giòn rìa** và **hấp trắng
  mềm dai**.
region: Miền Trung
category: Món nước
occasions: [Bữa sáng]
pubDate: 2026-07-29
time:
  total: 1 giờ 30 phút
servingsBase: 4
difficulty: Vừa
featured: false
order: 15
art: bun-cha-ca
heroEyebrow: Dọc bờ biển miền Trung…

quick:
  ingredients:
    - Phi lê cá thu (hoặc cá mối, cá cờ) [[500|g]] — làm chả
    - Xương + đầu cá [[600|g]] — nấu nước lèo, xin thêm khi mua cá
    - Bún tươi sợi nhỏ [[800|g]] · thơm [[0.25|trái|frac]] · cà chua [[2|trái]]
    - Hành tím [[4|củ]] · gừng [[1|nhánh]] — nướng sém rồi mới thả nồi
    - "Nêm: nước mắm [[2|muỗng canh|frac]] · đường [[1|muỗng cà phê|frac]] · muối"
    - "Dọn kèm: giá, xà lách, bắp chuối bào, hành ngò · chén mắm ruốc + ớt tỏi giã"
  steps:
    - Quết cá với hành tỏi tiêu cho **dẻo quánh**, chia đôi — nửa hấp, nửa chiên.
    - Nướng hành tím và gừng tới sém vỏ, rửa sạch tro.
    - Hầm xương cá **25 phút thôi**, lọc lấy nước trong.
    - Thả thơm + cà chua, nêm mắm muối đường, hớt bọt cho tới khi nước trong lại.
    - Trụng bún, xếp hai thứ chả lên, chan nước sôi, rắc hành ngò.
  warning: >-
    Hầm xương cá quá tay là nước **đắng và tanh ngược** — xương cá không chịu
    lửa lâu như xương heo. Canh đúng 25 phút rồi lọc liền.

flavor:
  chua: 3
  ngot: 6
