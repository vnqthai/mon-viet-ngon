flavorNote: >-
  **Chuẩn tô:** nước lèo **trong nhìn thấy đáy**, húp vào ngọt mà hậu vị nhẹ
  tênh; miếng chả chiên cắn nghe **sựt**, miếng chả hấp thì mềm mà vẫn dai tay.
storyEyebrow: Chuyện món ăn
storyTitle: Món **không có quê**, vì cả dải biển đều nhận
story:
  - >-
    Đi dọc miền Trung, tỉnh nào có biển là tỉnh đó có bún chả cá — và tỉnh nào
    cũng tin món của mình mới đúng. Vậy nên trang này **cố ý không gắn địa danh
    vào tên món**: gắn một cái tên là mặc nhiên chê ba cái tên còn lại, trong
    khi khác nhau nằm ở chỗ nêm chứ không phải chỗ đúng sai.
  - >-
    **Đà Nẵng** thả thêm rau củ vào nồi — **bí đỏ, bắp cải, cà chua, thơm** —
    nên nước lèo ngọt dày hơn, thoảng chua, màu hơi cam. **Nha Trang** và **Quy
    Nhơn** đi hướng ngược lại: nước chỉ nấu từ xương cá với hành tím nướng, để
    **trong veo**, ai nêm thêm gì thì tự nêm ở tô. **Quảng Ngãi** nghiêng về chả
    chiên.
  - >-
    Công thức dưới đây nấu **nồi nước gốc** — xương cá, hành nướng, thơm, cà
    chua — rồi ở bước cuối chỉ ra chỗ rẽ: muốn lối Đà Nẵng thì thả bí đỏ với
    bắp cải, muốn lối Nha Trang – Quy Nhơn thì dừng lại và lọc cho thật trong.
    Cùng một nồi, hai đường về.
  - >-
    Còn thứ làm nên món thì cả bốn nơi giống nhau: **chả cá phải quết tay**.
    Cá xay máy nhuyễn quá thì miếng chả bở, cắn không có gì để nhớ. Quết cho
    tới lúc khối cá dẻo dính, vỗ xuống thớt nghe **bộp** là được.

