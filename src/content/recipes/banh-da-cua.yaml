flavorNote: >-
  **Chuẩn tô:** nước dùng **ngọt thanh vị cua, trong và có ánh vàng của gạch**,
  không chua gắt; riêu cua nổi thành **tảng xốp** chứ không vụn; sợi bánh đa
  mềm mà còn dai, không bở nát; miếng chả lá lốt vàng rám và thơm mùi lá.
storyEyebrow: Chuyện món ăn
storyTitle: Sợi bánh đa đỏ — **thứ làm nên tên món**
story:
  - >-
    Điều đầu tiên đập vào mắt khi bát bánh đa cua được bưng ra là màu sợi:
    **đỏ nâu, bản to gần bằng ngón tay út, dày và dai**. Đó là bánh đa đỏ Hải
    Phòng, làm từ bột gạo pha thêm chút gấc hoặc đường thắng để lên màu, tráng
    dày rồi thái bản rộng.
  - >-
    Sợi ấy quyết định cả tô. Nó **dày và dai** nên không bở ra trong nước nóng
    như sợi phở, húp tới thìa cuối cùng vẫn còn nguyên độ. Nó cũng **hút nước
    dùng** vào trong thân sợi, nên mỗi gắp lên là mang theo vị cua chứ không chỉ
    là sợi bột trắng nhúng nước.
  - >-
    Nồi nước thì nấu từ **cua đồng giã lọc**, ngọt thanh và có hậu, để nguyên
    vị chứ không đánh chua. Đây là chỗ khác của bát bánh đa cua: nó ngọt và đằm,
    chỗ đậm đà đến từ thìa **gạch cua chưng** đỏ au thả giữa tô — thứ được khều
    riêng từ mai cua rồi chưng với hành phi cho dậy mùi.
  - >-
    Trên mặt tô thì mỗi hàng một kiểu, nhưng gần như luôn có **chả lá lốt**:
    thịt băm gói lá lốt rán vàng, cắn vào là mùi lá lốt xộc lên át cả nước dùng
    trong một nhịp rồi lắng xuống. Thêm con tôm đồng, lát chả cá, và một nắm rau
    muống hoặc rau rút chần xanh mướt vắt ngang.

ingredientGroups:
  - name: Sợi
