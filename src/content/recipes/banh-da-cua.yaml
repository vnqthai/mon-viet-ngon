        note: Thái nhỏ rắc mặt. Mùi tàu là mùi nền quen thuộc của tô bánh đa cua

steps:
  - title: Giã và lọc cua
    icon: knife
    minutes: 25 phút
    intro: "Lọc kỹ tới đâu, nồi nước ngọt tới đó:"
    bullets:
      - label: "Làm sạch:"
        text: >-
          Ngâm cua nước lạnh 15 phút cho nhả bùn, xóc rửa nhiều lần. Bóc mai,
          bỏ yếm và mang.
      - label: "Khều gạch:"
        text: >-
          Dùng tăm khều hết phần **gạch vàng cam** trong từng cái mai, gom vào
          một chén nhỏ. Để riêng, lát nữa chưng.
      - label: "Giã:"
        text: >-
          Cho phần thân cua vào cối với [[1|muỗng cà phê]] muối, giã nhuyễn.
          Muối giúp thịt cua kết tảng khi đun.
      - label: "Lọc ba nước:"
        text: >-
          Hoà cua giã với nước, bóp kỹ rồi lọc qua rây. Làm lại **ba lần** với
          phần bã, tổng cộng chừng [[1.5|lít]] nước. Nước lọc lần ba vẫn còn
          ngọt — đừng bỏ.
    callout:
      type: tip
      text: >-
        Nhờ hàng xay sẵn thì đỡ hẳn hai mươi phút, nhưng nhớ **dặn để lại mai**
        để tự khều gạch. Nhiều hàng bỏ mai đi, mà mất gạch thì tô bánh đa cua
        mất luôn cả màu lẫn mùi đặc trưng.
  - title: Đun cho riêu nổi
    icon: pot
    minutes: 20 phút
    intro: "Bước duy nhất cần đứng nhìn, và tuyệt đối không khuấy:"
    bullets:
      - label: "Bắc nồi:"
        text: >-
          Đổ nước cua đã lọc vào nồi, bắc lên **lửa vừa**. Dùng đũa gạt nhẹ sát
          đáy vài lần trong hai phút đầu cho khỏi lắng khét, rồi bỏ tay ra.
      - label: "Để yên:"
        text: >-
          Từ lúc nước bắt đầu nóng là **không đụng vào nữa**. Thịt cua sẽ kết
          lại và nổi dần lên mặt thành từng mảng.
      - label: "Hạ lửa:"
        text: >-
          Khi riêu đã nổi kín mặt, hạ lửa nhỏ để riêu se lại thành **tảng chắc**.
          Đun sôi bùng là tảng vỡ.
      - label: "Vớt riêu:"
        text: >-
          Nhẹ tay vớt riêu ra bát để riêng. Phần nước dưới giữ nguyên trong nồi.
    timer:
      secs: 900
      label: Hẹn giờ chờ riêu nổi · 15:00
      doneMsg: Riêu nổi kín mặt thì hạ lửa cho nó se lại nghen!
    callout:
      type: warn
      text: >-
        Khuấy là hỏng. Thịt cua đang kết mà bị đũa xé ra thì không bao giờ tụ
        lại được nữa — nồi nước đục lờ và lợn cợn thay vì có tảng riêu xốp. Đây
        là lỗi hay gặp nhất, và nó xảy ra chỉ vì sốt ruột.
  - title: Chưng gạch, làm chả lá lốt
    icon: flame
    minutes: 20 phút
    bullets:
      - label: "Chưng gạch:"
        text: >-
          Phi thơm [[1|muỗng canh]] hành phi với chút dầu, trút chén gạch cua
          vào, thêm [[1|muỗng cà phê]] nước mắm. Đảo nhẹ trên **lửa nhỏ** tới
          khi gạch chuyển đỏ au và dậy mùi, chừng 2 phút. Để riêng.
      - label: "Trộn nhân:"
        text: >-
          Thịt băm trộn hành khô băm, [[1|muỗng cà phê]] nước mắm, tiêu, để
          10 phút.
      - label: "Gói lá lốt:"
        text: >-
          Đặt lá **mặt xanh đậm úp xuống**, cho thìa nhân vào cuống lá, cuộn
          lại rồi gấp hai mép. Cuộn chặt tay cho khỏi bung khi rán.
      - label: "Rán:"
        text: >-
          Rán lửa vừa, **mặt gấp mép úp xuống trước** cho dính lại. Rán vàng rám
          hai mặt, chừng 3 phút mỗi mặt.
    callout:
      type: warn
      text: >-
        Chưng gạch trên lửa to là **gạch cháy sém và đắng**, mà chỉ cần lỡ tay
        vài giây. Để lửa nhỏ nhất, đảo đều, thấy chuyển đỏ và dậy mùi là bắc
        xuống ngay.
  - title: Nêm nồi và chuẩn bị đồ chần
    icon: spoon
    minutes: 15 phút
    bullets:
      - label: "Xào cà chua:"
        text: >-
          Xào cà chua bổ múi với chút dầu cho mềm và ra màu, trút vào nồi nước cua.
      - label: "Nêm:"
        text: >-
          Nêm nước mắm và chút muối cho vừa miệng. Nếm thử: phải **ngọt thanh vị
          cua**, chua rất nhẹ từ cà chua. Thấy nhạt thì thêm mắm chứ đừng thêm
          bột ngọt.
      - label: "Rang tôm:"
        text: >-
          Rang tôm với chút nước mắm cho săn và đỏ.
      - label: "Chần rau:"
        text: >-
          Chần rau muống trong nước sôi có chút muối **đúng 30 giây**, vớt ra
          thả ngay vào thau nước lạnh cho xanh và giòn.
      - label: "Chần bánh đa:"
        text: >-
          Bánh đa ngâm mềm, chần qua nước sôi **20–30 giây** rồi vớt ngay. Chần
          lâu là sợi bở nát.
    callout:
      type: tip
      text: >-
        Chần bánh đa **từng tô một, ngay trước khi chan**. Chần cả mẻ để đó thì
        sợi hút hết nước, dính bết vào nhau và đã mềm quá trước khi tô đầu tiên
        kịp bưng ra.
  - title: Ráp tô
    icon: bowl
    minutes: 5 phút
    bullets:
      - text: Cho bánh đa vừa chần vào tô, chan nước cua **thật nóng** ngập sợi.
      - text: >-
          Xếp lên mặt: tảng riêu cua, hai miếng chả lá lốt, mấy con tôm, vài lát
          chả cá, nắm rau muống chần vắt sang một bên.
      - text: >-
          Rưới một thìa **gạch cua chưng** vào giữa tô, rắc hành phi, hành lá và
          mùi tàu thái nhỏ.
    doneText: Xong — bưng ra lúc còn bốc khói!

tipsTitle: 4 chỗ **quyết định** tô bánh đa cua
tips:
  - icon: alert
    title: Không khuấy, từ lúc nồi bắt đầu nóng
    text: >-
      Đây là luật cứng của mọi nồi nấu từ cua giã. Thịt cua đông lại theo nhiệt
      và tự tụ thành mảng nổi lên — đũa xé vào là nó tan ra thành lợn cợn, không
      cách nào gom lại. Gạt nhẹ sát đáy vài lần trong hai phút đầu cho khỏi
      khét, rồi **bỏ tay ra và đứng nhìn**.
  - icon: bulb
    title: Khều gạch riêng, chưng riêng
    text: >-
      Phần gạch vàng cam trong mai cua mới là thứ cho tô bánh đa cái màu và mùi
      của nó. Khều riêng từng con rồi chưng với hành phi trên lửa nhỏ — hai
      phút, thấy đỏ au và dậy mùi là bắc xuống. Thả thẳng gạch sống vào nồi thì
      nó tan mất, còn chưng quá lửa thì cháy đắng.
  - icon: noodle
    title: Chần bánh đa từng tô, đếm bằng giây
    text: >-
      Sợi bánh đa đỏ dày và dai, nhưng chần quá **30 giây** là bắt đầu bở. Chần
      từng tô ngay trước khi chan nước, vớt ra là chan luôn. Chần sẵn cả mẻ để
      đó thì tới lúc ăn sợi đã nát và dính thành nắm.
  - icon: lettuce
    title: Rau chần xong thả ngay vào nước lạnh
    text: >-
      Ba mươi giây trong nước sôi rồi ngâm ngay nước lạnh — rau muống giữ được
      màu **xanh mướt và độ giòn**. Vớt ra để nguyên ngoài không khí thì hơi
      nóng còn trong cọng rau vẫn tiếp tục làm nó chín, mươi phút sau là ngả
      vàng và mềm oặt.

serve:
  title: Bưng ra lúc **còn bốc khói**, vắt chanh nếu thích
  paras:
    - >-
      Tô bánh đa cua ăn ngay khi vừa chan. Sợi bánh đa để lâu trong nước nóng sẽ
      tiếp tục nở và mềm ra, nên đây là món chan tới đâu ăn tới đó, không phải
      món bày sẵn chờ người.
    - >-
      Trên bàn hàng nào cũng có đĩa **rau sống, chanh ớt và lọ giấm tỏi**. Vắt
      chút chanh vào tô là nước dùng bật lên rõ hơn; ai thích cay thì thêm vài
      lát ớt tươi. Nhưng nếm nồi nước trước đã — nồi ngọt đúng thì có khi chẳng
      cần thêm gì.
  aside:
    title: Trên bàn nên có gì
    intro: "Ba thứ để mỗi người tự chỉnh tô của mình:"
    items:
      - icon: lime
        text: "**Chanh tươi** — vắt chút vào là vị cua bật lên rõ hơn."
      - icon: chili
        text: "**Ớt tươi thái lát** — hoặc ớt chưng, cho ai ăn cay."
      - icon: lettuce
        text: "**Rau sống** — xà lách, kinh giới, tía tô ăn xen cho đỡ ngán."

faq:
  - q: Không mua được bánh đa đỏ thì sao?
    a: >-
      Nói thẳng: thay sợi thì **không còn đúng là món này nữa**, vì chính sợi
      bánh đa đỏ làm nên tên gọi và cả cách ăn. Nếu vẫn muốn nấu thì
      **bánh phở loại bản to nhất** là gần nhất — nước dùng và đồ xếp mặt vẫn
      cho ra một tô ngon, chỉ là sợi mỏng hơn, bở nhanh hơn và không có màu đỏ
      nâu. Bánh đa đỏ khô đóng gói bán khá sẵn trên mạng, đặt một lần dùng được
      lâu vì để khô cả năm.
  - q: Nước dùng bị đục và lợn cợn, không có tảng riêu?
    a: >-
      Do **khuấy trong lúc đun**, hoặc để lửa quá to nên nước sôi bùng làm tảng
      riêu vỡ. Mẻ này không gom lại được nhưng vẫn ngọt và ăn ngon — cứ lọc qua
      rây cho bớt lợn cợn rồi dùng. Lần sau: gạt đáy vài lần lúc đầu, sau đó
      không đụng, và hạ lửa ngay khi riêu bắt đầu nổi.
  - q: Cua xay sẵn ngoài chợ có nấu được không?
    a: >-
      Được, và tiết kiệm hai mươi phút. Hai điều cần nhớ: **dặn hàng để lại mai**
      để tự khều gạch, và mua vào đúng buổi sáng hôm nấu chứ đừng mua cua đã xay
      để qua đêm. Về nhà vẫn phải hoà nước và lọc lại ba lần như cua giã tay.
  - q: Bánh đa cua khác bún riêu cua ở đâu?
    a: >-
      Cùng nấu từ cua đồng giã lọc nhưng ra hai tô khác hẳn. Bánh đa cua dùng
      **sợi bánh đa đỏ bản to**, nước dùng để **ngọt thanh** và đậm đà bằng gạch
      cua chưng, trên mặt có chả lá lốt và rau muống chần. Bún riêu thì dùng
      **sợi bún nhỏ**, nước dùng **đánh chua rõ** bằng giấm bỗng hoặc me, và đồ
      xếp mặt là đậu rán, cà chua, huyết. Một bên ngọt đằm, một bên chua thanh.
  - q: Làm trước được phần nào?
    a: >-
      Nồi nước cua và tảng riêu nấu trước một ngày được, để ngăn mát rồi hâm lại
      **thật nhẹ tay** cho khỏi vỡ riêu. Chả lá lốt rán sẵn, tôm rang sẵn cũng
      để được. Gạch chưng thì để hũ kín trong ngăn mát 2–3 ngày. Chỉ có
      **chần rau và chần bánh đa** là phải làm ngay lúc ăn.

