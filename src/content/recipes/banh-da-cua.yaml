title: Bánh đa cua **sợi đỏ nâu bản to, nước cua ngọt thanh**
summary: >-
  Tô bún của đất cảng: **sợi bánh đa đỏ nâu bản to** nằm trong nước cua đồng
  ngọt thanh, trên mặt là tảng riêu cua, miếng chả lá lốt, con tôm và nắm rau
  muống chần xanh. Một thìa gạch cua chưng đỏ au thả giữa tô làm màu và làm mùi.
region: Miền Bắc
category: Món nước
occasions: [Bữa sáng, Ăn chơi]
pubDate: 2026-08-01
time:
  total: 1 giờ 30 phút
  active: 1 giờ
servingsBase: 4
difficulty: Vừa
featured: false
order: 114
art: banh-da-cua
heroEyebrow: Hàng vỉa hè Hải Phòng, sáng nào cũng đông…

quick:
  ingredients:
    - Bánh đa đỏ [[400|g]] — loại sợi bản to, ngâm mềm trước khi chần
    - Cua đồng [[700|g]] — giã lọc lấy nước, gạch để riêng
    - "Chả lá lốt: thịt băm [[200|g]] · lá lốt [[15|lá]]"
    - Tôm đồng [[150|g]] · chả cá hoặc giò lụa [[150|g]]
    - Rau muống hoặc rau rút [[1|bó]] · hành lá, mùi tàu
    - Cà chua [[2|quả]] · hành phi · nước mắm, muối
  steps:
    - >-
      Giã cua, lọc kỹ **ba nước**, khều gạch để riêng. Đun nước cua lửa nhỏ cho
      riêu nổi thành tảng.
    - Chưng gạch cua với hành phi và chút nước mắm cho đỏ au và thơm.
    - >-
      Băm thịt trộn gia vị, gói lá lốt thành miếng dẹt, rán vàng hai mặt.
    - Xào cà chua, nêm nồi nước cho vừa; chần rau, chần bánh đa.
    - >-
      Xếp bánh đa vào tô, chan nước cua, xếp riêu, chả lá lốt, tôm, rau, rưới
      gạch chưng.
  warning: >-
    Đun nước cua mà **khuấy** thì riêu vỡ vụn thành lợn cợn, không đóng được
    thành tảng. Bắc lên bếp là để yên, chỉ dùng đũa gạt nhẹ ở đáy vài lần cho
    khỏi khét, rồi đứng nhìn cho tới lúc riêu nổi lên.

flavor:
