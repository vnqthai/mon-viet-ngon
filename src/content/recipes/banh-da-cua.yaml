        base: 400
        unit: g
        note: >-
          Loại **sợi bản to, màu đỏ nâu**, bán tươi ở chợ miền Bắc và bán khô
          đóng gói trên mạng. Bản khô thì ngâm nước lạnh **20 phút** cho mềm
          trước khi chần. Ngoài Hải Phòng thì không phải chợ nào cũng có — nói
          thẳng là thay bằng sợi khác thì không còn đúng món, vì chính sợi này
          làm nên tên gọi
      - id: thaythebdc
