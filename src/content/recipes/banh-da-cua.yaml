        icon: noodle
        qtyText: bánh phở bản to
        note: >-
          Bánh phở loại bản to nhất là gần nhất — vẫn ngon nhưng sợi mỏng hơn,
          bở nhanh hơn và không có màu đỏ nâu. Bánh đa khô Nghệ An thì dai hơn
          nhưng mỏng và sẫm màu
