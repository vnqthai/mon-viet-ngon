title: Bún riêu cua **nước chua thanh, riêu béo ngậy**
summary: >-
  Nước riêu đỏ hồng màu cà chua chua thanh **mùi giấm bỗng**, tảng riêu cua
  vàng óng gạch, đậu phụ chiên phao, ăn kèm rổ rau có rau muống chẻ — tô
  bún quà sáng khiến người Hà Nội đi đâu cũng ngoái lại.
region: Miền Bắc
category: Món sợi
occasions: [Bữa sáng]
pubDate: 2026-07-27
time:
  total: 1 giờ 15
servingsBase: 4
difficulty: Vừa
featured: false
order: 9
art: bun-rieu
heroEyebrow: Gánh bún riêu đầu ngõ…

quick:
  ingredients:
    - Cua đồng [[500|g]] xay sẵn (xin túi gạch để riêng) · muối [[1|muỗng cà phê]] để lọc
    - Cà chua [[5|trái]] bổ múi cau · đậu phụ [[3|bìa]] chiên vàng cắt quân cờ
    - "Nêm hồn Bắc: **giấm bỗng [[100|ml]]** (kẹt thì me/giấm gạo) · mắm tôm [[1|muỗng canh|frac]]"
    - Hành khô [[3|củ]] · dầu màu điều [[1|muỗng canh|frac]] để chưng gạch
    - Bún sợi nhỏ [[1000|g]] · hành lá, ngò gai
    - "Rổ rau: **rau muống chẻ** · tía tô, kinh giới · xà lách · giá — thêm chanh ớt, mắm tôm chén riêng"
  steps:
    - Hòa cua xay với [[1.4|lít]] nước + muối, bóp kỹ, **lọc 2–3 lần** cho sạch sạn.
    - Phi hành khô, chưng **gạch cua + dầu điều** ra chén; chiên đậu phụ vàng giòn.
    - Xào sơ **nửa phần cà chua** cho ra màu; nửa còn lại để múi tươi.
    - Nấu nước cua lửa vừa, khuấy nhẹ lúc nguội — **gần sôi ngừng khuấy** cho riêu kết tảng, vớt riêu ra bát.
    - Thả cà chua xào + múi tươi + đậu phụ vô nồi, nêm **mắm tôm + giấm bỗng**, sôi liu riu 10 phút.
    - "Ráp tô: bún trụng, xếp riêu + đậu + cà, chan nước **sôi sùng sục**, rưới gạch chưng — dọn rổ rau, chanh ớt."
  warning: >-
    Vị bún riêu phải **chua thanh dịu** kiểu giấm bỗng — nêm me hay giấm
    gạo quá tay là chua gắt, "lạc giọng" ngay. Nêm từng muỗng, vừa nêm vừa
    nếm, tới khi húp thấy thanh mát là dừng.

flavor:
  chua: 6
  ngot: 6
  man: 6
  cay: 2
  thom: 8
flavorNote: >-
  **Chuẩn tô bún riêu Bắc:** nước **đỏ hồng trong**, chua thanh mùi bỗng
  rượu quyện chút nồng mắm tôm, riêu cua **xốp mà chắc**, húp một muỗng
  thấy ngọt cua lan khắp miệng — đậm mà vẫn nhẹ bụng.
storyEyebrow: Chuyện tô bún
storyTitle: Quà sáng **gánh trên vai** của phố phường Bắc bộ
story:
  - >-
    Bún riêu là món của những **gánh hàng rong**: một đầu là nồi nước riêu
    đỏ au liu riu trên bếp than, đầu kia là thúng bún với rổ rau xanh mướt.
    Tiếng rao "ai bún riêu nóng đơi…" len qua ngõ nhỏ buổi sáng, người ta
    bưng tô bún ngồi ghế con, vừa thổi vừa húp — hình ảnh đó gần như là
    một "đặc sản" của Bắc bộ, ngang với chính tô bún.
  - >-
    Bí mật làm nên giọng riêng của bún riêu Bắc nằm ở **giấm bỗng** — thứ
    bỗng rượu nếp lên men, chua thanh mà thơm dịu, không gắt như giấm
    thường, không thẫm màu như me. Cộng thêm **chút mắm tôm** nêm lúc nồi
    đang sôi, nước riêu bỗng dậy mùi "rất chợ quê" — hai thứ đó mà thiếu,
    tô bún riêu chỉ còn là canh cua chan bún.
  - >-
    Nhà đã nấu quen **canh cua rau đay** thì bún riêu là bước tiếp theo dễ
    ợt: cũng lọc cua, cũng đợi riêu kết, chỉ thêm màn cà chua, đậu phụ và
    nêm chua. Nấu một nồi cuối tuần, cả nhà ăn sáng như ngồi giữa chợ phiên
    — mà nước riêu thì ngọt cua thật, không viên gia vị nào bì được.

