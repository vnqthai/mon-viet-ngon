flavorNote: >-
  **Chuẩn dĩa cơm phố Hội:** cơm béo nhẹ mùi mỡ gà, **vàng mơ chứ không
  vàng khè**; gà xé ngọt thịt quyện hành tây chua giòn, rau răm the nồng
  đuổi sau — và chén súp nóng húp xen kẽ cho trơn miệng.
storyEyebrow: Chuyện dĩa cơm
storyTitle: Dĩa cơm **danh thiếp** của phố Hội
story:
  - >-
    Tới Hội An, chưa ăn cơm gà coi như chưa trọn chuyến đi — món này là
    **danh thiếp ẩm thực** của phố cổ, bên cạnh cao lầu. Từ những gánh cơm
    gà giữa thế kỷ trước, nghề nấu truyền qua mấy đời, mỗi quán một bí
    quyết riêng nhưng chung một chuẩn: **cơm vàng tơi, gà xé mọng, rau răm
    hào phóng**.
  - >-
    Người Hội An hay nói cơm gà ngon là nhờ **gạo dẻo thơm và nồi nước
    luộc gà ngọt lừ** — hạt gạo được xào qua mỡ gà với chút nghệ rồi mới
    nấu bằng chính nước luộc, nên vừa béo vừa thơm mà không hề ngấy. Gà
    nhất định phải là **gà ta thả vườn**: thịt chắc, da vàng óng, xé ra
    từng thớ ngọt đậm chứ không bở bùng bục.
  - >-
    Cái hay của món này với bếp nhà: **một con gà lo trọn một bữa tiệc
    nhỏ** — nước luộc chia ba vai (nấu cơm, chén súp, nước trộn), thịt
    thành gỏi, lòng gà bỏ vô súp. Nấu một lần cuối tuần, nhà mình có
    "chuyến du lịch Hội An" ngay trên mâm cơm.

