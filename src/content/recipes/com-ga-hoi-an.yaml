title: Cơm gà Hội An **cơm vàng tơi hạt, gà xé mọng ngọt**
summary: >-
  Hạt cơm **vàng mơ nấu bằng nước luộc gà** tơi ráo từng hạt, gà ta xé
  trộn hành tây rau răm chua ngọt the nồng — dĩa cơm "danh thiếp" của phố
  cổ, kèm chén súp nóng đúng lệ, ăn một lần là nhớ Hội An.
region: Miền Trung
category: Cơm
occasions: [Cơm nhà]
pubDate: 2026-07-27
time:
  total: 1 giờ 30
servingsBase: 4
difficulty: Vừa
featured: false
order: 22
art: com-ga
heroEyebrow: Phố cổ lên đèn vàng…

quick:
  ingredients:
    - Gà ta [[1500|g]] (1 con) · gừng [[1|củ]] đập + hành tím [[2|củ]] nướng để luộc
    - Gạo dẻo thơm [[500|g]] — vo, **ngâm 30 phút**, để ráo
    - Bột nghệ [[1|muỗng cà phê]] · mỡ gà (hớt từ nước luộc) hoặc dầu ăn [[2|muỗng canh|frac]] · tỏi [[2|tép]]
    - Hành tây [[1|củ]] thái mỏng ngâm giấm đường · rau răm [[1|bó]] lớn
    - "Nước trộn gà: nước mắm [[1.5|muỗng canh|frac]] · chanh [[1|trái]] · đường [[1|muỗng cà phê]] · tiêu"
    - "Ăn kèm: hành phi · đồ chua (đu đủ/cà rốt) · **tương ớt** · chén súp từ nước luộc"
  steps:
    - Luộc gà ngập nước với gừng, hành nướng, muối — sôi hạ **liu riu 25 phút**, tắt bếp **ủ 10 phút**, vớt ngâm nước đá.
    - Gạo ngâm để ráo, **xào với mỡ gà + tỏi + nghệ** cho săn hạt thơm vàng.
    - Nấu cơm bằng **nước luộc gà**, châm ít hơn nấu thường một chút (gạo đã ngâm).
    - Gà nguội xé miếng vừa ăn; hành tây ngâm giấm đường 10 phút cho hết hăng.
    - Trộn gà + hành tây + rau răm với nước mắm – chanh – đường – tiêu, nêm **đậm hơn gỏi thường một chút**.
    - "Ráp dĩa: úp chén cơm vàng, phủ gà trộn, rắc hành phi; dọn kèm **chén súp nóng**, đồ chua và tương ớt."
  warning: >-
    Cơm gà mà **nhão là thua từ vòng gửi xe** — gạo phải ngâm rồi để ráo,
    xào săn, và châm nước luộc gà **ít tay hơn nấu cơm thường**. Hạt cơm
    chuẩn Hội An là vàng mơ, tơi ráo, hạt nào ra hạt nấy.

