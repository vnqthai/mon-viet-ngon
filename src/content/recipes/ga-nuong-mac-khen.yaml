title: Gà nướng mắc khén **vàng ruộm óng mật, tê tê đầu lưỡi**
summary: >-
  Gà ta mổ phanh ép dẹt, xoa kín **mắc khén – hạt dổi** — cặp gia vị rừng
  Tây Bắc, nướng lửa liu riu tới da vàng ruộm óng mật; xé miếng chấm
  chẩm chéo, nghe đầu lưỡi tê tê thơm hương núi rừng là hiểu vì sao ai lên
  Tây Bắc về cũng nhớ.
region: Tây Bắc
category: Nướng
occasions: [Nhậu lai rai, Đãi khách]
pubDate: 2026-07-28
time:
  total: 1 giờ 15 phút (+ ướp 3 giờ)
servingsBase: 4
difficulty: Kỳ công
featured: true
order: 30
art: ga-nuong
heroEyebrow: Lửa hồng nhà sàn Tây Bắc…

quick:
  ingredients:
    - Gà ta / gà đồi [[1|con|frac]] (1.2–1.5 kg) — nhờ người bán **mổ phanh** để ép dẹt
    - >-
      Mắc khén [[2|muỗng cà phê]] + hạt dổi [[3|hạt]] — cặp gia vị rừng Tây
      Bắc, rang nướng thơm rồi giã nhỏ
    - Sả [[3|cây]] · gừng [[1|củ]] nhỏ · tỏi [[4|tép]] · hành tím [[3|củ]] — giã nhuyễn
    - >-
      Ướp thêm: muối [[1|muỗng cà phê]] · ớt bột [[1|muỗng cà phê]] · mật
      ong [[1|muỗng canh|frac]]
    - >-
      Chẩm chéo: muối hột · mắc khén + hạt dổi · ớt nướng · tỏi · ngò gai,
      ngò rí · chanh
    - Than hoa 1 bao nhỏ + đôi thanh tre kẹp gà (không than thì lò nướng / nồi chiên không dầu)
  steps:
    - Mắc khén **rang chảo khô** tới lách tách dậy mùi; hạt dổi **hơ than cho phồng** — để nguội, giã nhỏ.
    - Gà mổ phanh, úp thớt **ấn ép dẹt**, khứa vài đường chỗ thịt dày.
    - Xoa kín hỗn hợp mắc khén – dổi – sả gừng tỏi hành – muối – ớt – mật ong; bọc kín, ngăn mát **tối thiểu 3 giờ**.
    - Kẹp gà giữa hai thanh tre, nướng **than hoa liu riu 30–40 phút**, trở đều mỗi 5 phút tới da vàng ruộm.
    - Không than thì lò **190°C** chừng 25 phút mỗi mặt (tùy con) — chốt bằng mặt da hướng lửa cho óng.
    - Giã chén **chẩm chéo**; gà chín để **nghỉ 5–10 phút** rồi chặt hoặc xé, chấm ăn với xôi nếp.
  warning: >-
    Nôn nóng nướng **lửa lớn là toi con gà**: ngoài cháy đen, trong còn
    đỏ. Than phải hồng liu riu, tay chịu khó trở — món này ăn nhau ở cái
    kiên nhẫn.

flavor:
  chua: 0.5
