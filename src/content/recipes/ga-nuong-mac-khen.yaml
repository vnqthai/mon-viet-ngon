stepsEyebrow: Vô bếp thôi!
stepsTitle: 7 bước ra **con gà vàng ruộm hương rừng**
stepsLead: >-
  Món "Kỳ công" nhưng công nằm ở chờ ướp với canh than — tay làm thật sự
  nhẹ nhàng. Cứ theo nhịp: gia vị qua lửa, gà ép dẹt, ướp sâu, than liu
  riu — bốn cửa ải là tới mâm.
steps:
  - title: Rang mắc khén, nướng hạt dổi
    icon: pepper
    minutes: 10 phút
    intro: "Gia vị Tây Bắc phải qua lửa mới chịu \"mở mùi\":"
    bullets:
      - label: "Mắc khén:"
        text: >-
          rang chảo khô **lửa nhỏ 2–3 phút**, nghe lách tách và dậy mùi
          thơm hơi hướng cam quýt là được — đổ ra chén cho **nguội giòn**.
      - label: "Hạt dổi:"
        text: >-
          kẹp que gắp **hơ trên than hoặc lửa** vài chục giây tới phồng
          nhẹ, thơm nức — hạt dổi chỉ cần hơ, không rang lâu như mắc khén.
      - label: "Giã:"
        text: >-
          để nguội rồi giã nhỏ mịn; **chừa lại 1 muỗng cà phê mắc khén +
          1 hạt dổi** để lát nữa giã chẩm chéo.
    callout:
      type: warn
      text: >-
        Hai thứ này **quá lửa là đắng hắc**, bay sạch mùi thơm — canh
        từng chục giây, thà non tay còn hơn già lửa.
  - title: Mổ phanh, ép dẹt con gà
    icon: knife
    minutes: 15 phút
    intro: "Dáng gà dẹt chính là \"công nghệ nướng\" của người bản:"
    bullets:
      - label: "Khử mùi:"
        text: >-
          gà chà muối hột + gừng đập (hoặc chanh), rửa sạch trong ngoài,
          **thấm thật khô** — da khô ráo nướng mới óng.
      - label: "Ép dẹt:"
        text: >-
          cắt phanh dọc bụng – ức, banh con gà ra, úp lên thớt rồi lấy
          lòng bàn tay **ấn mạnh xuống sống lưng** cho nằm phẳng (nghe
          "rắc" nhẹ là đúng bài).
      - label: "Khứa:"
        text: >-
          khứa vài đường chéo ở **đùi và ức** — chỗ thịt dày nhất — cho
          gia vị chui vô sâu, chín cũng đều hơn.
    callout:
      type: tip
      text: >-
        Ngại khoản dao kéo? Dặn người bán gà một câu **"để nguyên con,
        mổ phanh đem nướng"** là người ta làm giùm tới nơi tới chốn.
  - title: Ướp sâu — 3 tiếng không mặc cả
    icon: jar
    minutes: 3 giờ
    bullets:
      - text: >-
          Trộn phần mắc khén – hạt dổi đã giã với sả gừng tỏi hành giã
          nhuyễn + [[1|muỗng cà phê]] muối + [[1|muỗng cà phê]] ớt bột +
          [[1|muỗng canh|frac]] mật ong thành hỗn hợp sền sệt.
      - text: >-
          Xoa **kín hai mặt** con gà, nhét gia vị vô từng đường khứa, kẽ
          đùi kẽ cánh — chỗ nào dày thịt, chỗ đó xoa đậm.
      - text: >-
          Cho vô hộp đậy kín, ngăn mát **tối thiểu 3 giờ**; để được qua
          đêm thì miếng thịt thấm tới tận xương.
    callout:
      type: tip
      text: >-
        Ướp qua đêm là "chế độ nhà nghề": chiều nay ướp, trưa mai nướng.
        Lượng muối trong công thức đã cân cho ướp lâu — không lo mặn.
    timer:
      secs: 10800
      label: Hẹn giờ ướp gà · 180:00
      doneMsg: Gà thấm rồi — nhóm than thôi!
  - title: Kẹp tre, nướng than hoa
    icon: flame
    minutes: 40 phút
    intro: "Khúc này là sân khấu chính — chậm mà chắc:"
    bullets:
      - label: "Nhóm than:"
        text: >-
          đốt than hoa tới **hồng đều, hết khói đen**, gạt tản cho lửa
          dịu — hơ tay trên vỉ thấy nóng rát nhẹ là độ lửa vừa.
      - label: "Kẹp gà:"
        text: >-
          kẹp con gà dẹt giữa **hai thanh tre đã ngâm nước**, buộc chặt
          hai đầu (hoặc dùng vỉ kẹp inox) — trở gà nguyên khối, không
          rách da.
      - label: "Nướng:"
        text: >-
          đặt cách than 15–20 cm, **trở đều mỗi 5 phút**, quạt phe phẩy;
          chừng **30–40 phút** là da vàng ruộm óng, mỡ nhỏ xuống than
          dậy mùi thơm điếc mũi.
      - label: "Thử chín:"
        text: >-
          xiên đũa vô chỗ đùi dày nhất — **nước chảy ra trong veo** là
          chín; còn hồng đục thì nướng thêm, đừng đoán mò.
    callout:
      type: warn
      text: >-
        Mật ong trong lớp ướp làm da gà **rất mau bén lửa** — thấy chỗ
        nào sậm màu nhanh là xoay chỗ đó ra rìa than liền tay.
    timer:
      secs: 2100
      label: Hẹn giờ nướng gà · 35:00
      doneMsg: Xiên đũa thử — nước trong veo là chín rồi!
  - title: Nhà phố không than? Lò nướng lo được
    icon: bulb
    bullets:
      - label: "Lò nướng:"
        text: >-
          làm nóng lò **190°C**; gà dẹt đặt lên vỉ + khay hứng bên dưới,
          nướng **25 phút**, lật, thêm **20–25 phút** tùy con — lượt cuối
          để mặt da hướng lửa trên.
      - label: "Cho da óng:"
        text: >-
          5 phút cuối phết một lớp **mật ong pha loãng** thiệt mỏng, da
          căng bóng màu hổ phách là đạt.
      - label: "Nồi chiên không dầu:"
        text: >-
          chặt đôi con gà cho vừa lòng nồi — **180°C 15 phút**, lật,
          thêm **12–15 phút**; con to thì nhích thêm chút.
    callout:
      type: tip
      text: >-
        Muốn có "mùi than" cho bản lò nướng: gà chín xong **hơ nhanh
        từng mặt trên lửa bếp gas** chừng mươi giây — da xém nhẹ, thơm
        lên hẳn một tông.
  - title: Giã chén chẩm chéo
    icon: chili
    minutes: 10 phút
    intro: "Chén muối chấm \"thần thánh\" của Tây Bắc, giã một lần là ghiền:"
    bullets:
      - text: Ớt tươi + tỏi **hơ lửa** cho thơm dậy, bóc bỏ chỗ vỏ cháy đen.
      - text: >-
          Cho vô cối: [[1|muỗng canh|frac]] muối hột rang + phần mắc khén,
          hạt dổi để dành + ớt tỏi nướng + ngò gai, ngò rí xắt nhỏ —
          **giã tơi**, không cần nhuyễn ướt.
      - text: >-
          Lúc ăn mới vắt **miếng chanh** trộn đều — chẩm chéo tơi ẩm,
          thơm cay tê tê là đạt chuẩn.
    callout:
      type: tip
      text: >-
        Mỗi nhà Tây Bắc giã chẩm chéo một phách — cốt lõi chỉ cần **muối
        + mắc khén + ớt**, còn lại cứ nêm theo miệng nhà mình.
  - title: Nghỉ thịt, xé gà, lên mâm
    icon: bowl
    minutes: 10 phút
    bullets:
      - text: >-
          Gà rời lửa để **nghỉ 5–10 phút** cho nước ngọt rút lại vô thớ —
          chặt liền là chảy hết ra thớt, khô thịt uổng công nướng.
      - text: >-
          Chặt miếng vừa gắp, hoặc **xé tay theo thớ** kiểu bản làng —
          xé tay dính chút gia vị ở đầu ngón mới đã cái miệng.
      - text: >-
          Bày lên mẹt lót lá chuối (có thì càng đẹp), kèm chén chẩm chéo,
          dưa leo rau thơm — và rá xôi nếp dẻo bốc khói.
    timer:
      secs: 600
      label: Hẹn giờ nghỉ thịt · 10:00
      doneMsg: Xé gà thôi — chấm chẩm chéo nghen!
    doneText: Cả mâm thơm mùi núi rừng — xong!

tipsTitle: 8 bí quyết **đúng chất bản làng**
tipsLead: >-
  Gà nướng thì đâu cũng có, nhưng mấy điều nho nhỏ này mới làm ra đúng
  con gà Tây Bắc — đọc trước khi đặt mua mắc khén nghen.
tips:
  - icon: pepper
    title: Mắc khén — rang, nguội, rồi mới giã
    text: >-
      Rang xong để nguội hạt mới **giòn, giã tơi như bột**; giã lúc còn
      nóng là bết dầu vón cục. Và nêm chừng mực thôi — mắc khén quá tay
      là tê đắng lấn hết vị ngọt của gà.
  - icon: pod
    title: Hạt dổi hơ than, 3 hạt là đủ
    text: >-
      Hạt dổi gặp lửa than **phồng lên, dậy mùi ấm rất riêng** — cả con
      gà chỉ cần 2–3 hạt, tham nhiều là hắc. Nhớ giùm: nó **không phải
      hoa hồi**, đừng thay bằng hồi kẻo lạc mùi cả mẻ ướp.
  - icon: meat
    title: Gà đồi da dày mới "chịu" được than
    text: >-
      Gà ta, gà đồi da dày thịt chắc — nướng lâu da càng óng, thịt vẫn
      mọng. Gà công nghiệp da mỏng nhão, lên than là rách tơi bời — món
      này đừng tiếc tiền con gà.
  - icon: knife
    title: Ép dẹt là công nghệ, không phải màu mè
    text: >-
      Con gà phẳng thì **mọi điểm cách than đều nhau** — chín đồng loạt,
      vàng đồng loạt, hết cảnh ức khô mà đùi còn sống. Que tre kẹp giữ
      dáng, trở một nhát là lật cả con.
  - icon: flame
    title: Than hồng liu riu, cấm lửa ngọn
    text: >-
      Lửa ngọn liếm tới đâu, da đen tới đó mà thịt trong chưa kịp chín.
      Than phải **hồng rực hết khói** mới đặt gà; người bản nói vui:
      nướng gà là ngồi tâm sự với cục than — sốt ruột là thua.
  - icon: drop
    title: Mật ong một muỗng, đủ rồi
    text: >-
      Một muỗng cho da **vàng óng màu mật**; nhiều hơn là đường cháy
      trước khi gà chín, đen đắng. Muốn bóng thêm thì phết mỏng lúc gần
      chín, đừng tăng trong lớp ướp.
  - icon: clock
    title: Nghỉ thịt 10 phút — luật của mọi món nướng
    text: >-
      Vừa rời lửa, nước ngọt trong thớ còn đang "sôi sục"; chặt ngay là
      tuôn hết ra thớt. Nghỉ 5–10 phút cho nước rút lại, miếng gà **mọng
      từ trong ra** — kiên nhẫn nốt khúc cuối.
  - icon: jar
    title: Chẩm chéo giã dư, để dành chấm cả tuần
    text: >-
      Phần khô (chưa vắt chanh) cất hũ kín ngăn mát, chấm gà luộc, măng
      luộc, xôi, cả trái cây chua — nhà có hũ chẩm chéo là món luộc nào
      cũng "lên đời" liền.

serve:
  title: Lên mâm **kiểu bản làng**
  paras:
    - >-
      Đúng bài nhất: nấu nồi **xôi nếp trắng dẻo**, ngắt nắm xôi, kẹp
      miếng gà xé, quẹt chút chẩm chéo — một miếng đủ ba tầng dẻo, mọng,
      tê thơm. Người Tây Bắc đãi khách quý bằng đúng bộ ba này, và chỉ
      cần ăn một lần là hiểu vì sao.
    - >-
      Bữa nhậu lai rai thì con gà vàng ruộm đặt giữa mâm, cả bàn xé tay
      chấm chung chén chẩm chéo — thêm dĩa **gỏi xoài xanh tôm khô** chua
      cay giòn giòn bên cạnh là thành cặp mồi "cháy" nhất bàn, nói chuyện
      quên cả giờ về.
    - >-
      Còn vô mâm cơm đãi khách, để con gà làm ngôi sao: kế bên dọn dĩa
      **rau muống xào tỏi** xanh giòn, tô **canh chua cá lóc** chua thanh
      mát miệng — mâm cơm có núi có sông, khách nhìn là biết chủ nhà có
      lòng.
  aside:
    title: Bên mẹt gà nướng
    intro: "Đủ bộ này là bữa \"Tây Bắc tại gia\":"
    items:
      - icon: rice
        text: "**Xôi nếp trắng dẻo** — nắm xôi kẹp gà chấm chẩm chéo, đúng bài nhất."
      - icon: chili
        text: "**Chẩm chéo** — giã dư chút, chấm luôn dưa leo, đồ luộc."
      - icon: lettuce
        text: "**Dưa leo, rau thơm** — miếng mát cân lại miếng nướng đậm."
      - icon: drop
        text: >-
          **Ấm chè nóng** — ngụm chè chát nhẹ rửa vị, miếng gà sau thơm
          y như miếng đầu.

faq:
  - q: Mua mắc khén, hạt dổi ở đâu?
    a: >-
      Tiệm đặc sản Tây Bắc và các sàn online đều có — gõ đúng tên **"mắc
      khén"**, **"hạt dổi"** là ra. Hàng bán theo lạng, một gói mắc khén
      nhỏ với chục hạt dổi xài được cả năm. Chọn mắc khén còn nguyên hạt
      nâu đỏ, mở túi nghe thơm xộc lên là hàng tốt.
  - q: Không có mắc khén, hạt dổi — thay được không?
    a: >-
      Thay tạm được bằng **tiêu (tiêu rừng càng tốt) + chút vỏ chanh
      bào** cho ra chút hương cam quýt — nhưng nói thiệt lòng, đó chỉ là
      "bản cover": cái tê thơm của mắc khén, mùi ấm của hạt dổi không
      hàng nào nhái được. Ráng đặt mua một lần, xài cả năm — đáng từng
      đồng.
  - q: Nướng lò có ngon bằng than không?
    a: >-
      Nói thẳng: chừng **8 phần 10** — thiếu đúng cái mùi than hoa. Bù
      bằng chiêu hơ lửa cuối ở bước 5 là kéo lại kha khá. Được cái lò
      đều nhiệt, dễ canh — lần đầu làm món này chọn lò cho tự tin cũng
      là nước đi khôn, lần sau hẵng bày than.
  - q: Gà công nghiệp có làm được không?
    a: >-
      Làm được nhưng xuống hạng rõ: **da nhão, thịt bở**, nướng dễ khô.
      Kẹt lắm thì chọn gà thả vườn cỡ nhỏ 1.2 kg đổ lại, rút thời gian
      nướng chừng 5–10 phút và canh sát — còn đã nhất vẫn là gà ta, gà
      đồi thả rông.
  - q: Ướp qua đêm có bị mặn quá không?
    a: >-
      Không — lượng muối trong công thức đã cân sẵn cho ướp lâu, qua đêm
      trong ngăn mát là "điểm rơi" ngon nhất. Chỉ đừng để quá **24
      tiếng**: gia vị bắt đầu lấn vị gà, thớ thịt cũng bở đi.
  - q: Chẩm chéo trữ được bao lâu?
    a: >-
      Phần **khô** (chưa vắt chanh) cho vô hũ kín, ngăn mát để được 1–2
      tuần — ăn tới đâu múc ra vắt chanh tới đó. Đã lỡ trộn chanh thì
      dùng trong ngày, để lâu mùi ủng mất ngon.

