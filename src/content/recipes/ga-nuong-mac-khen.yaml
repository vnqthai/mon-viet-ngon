flavorNote: >-
  **Chuẩn vị:** da vàng ruộm thơm lựng, thịt xé ra **mọng ngọt**, nhai vài
  miếng mới thấy mắc khén **tê tê nơi đầu lưỡi** lan chầm chậm — quẹt thêm
  chẩm chéo là tròn bộ hương núi rừng.
storyEyebrow: Chuyện bếp nhà sàn
storyTitle: Lời chào **từ núi rừng Tây Bắc**
story:
  - >-
    Nấu tới món này là bếp nhà mình chính thức **"lên Tây Bắc"** — vùng
    bếp mới toanh trên site, nằm ngoài mấy miền xuôi quen thuộc. Mà đã
    chào sân núi rừng thì phải bằng món đúng chất bản làng nhất: con gà
    đồi thả rông, ép dẹt kẹp tre, quay đều trên bếp than giữa nhà sàn,
    mỡ nhỏ xuống than nổ lách tách thơm tận đầu bản.
  - >-
    Linh hồn món này là **mắc khén** — hạt gia vị rừng người Thái Tây Bắc
    dùng như tiêu, được dân sành ăn ví là "đệ nhất gia vị Tây Bắc": thơm
    hương cam quýt, ăn vào **tê tê đầu lưỡi** rất lạ (nó có họ xa với hoa
    tiêu Tứ Xuyên, nhưng là thứ khác nghen). Đi cặp với nó là **hạt dổi**
    — hạt cây dổi đem nướng than cho phồng thơm rồi giã nhỏ, mùi ấm hơi
    nhựa thơm không lẫn vào đâu được. Cặp bài trùng này ướp gà đã đành,
    còn giã thành **chẩm chéo** (có nơi viết chẳm chéo) — chén muối chấm
    "thần thánh" của người Thái, chấm từ gà nướng, đồ luộc cho tới xôi
    nếp.
  - >-
    Công thức dưới đây bám đúng bài bản trên bản: ướp sâu vài tiếng, than
    hoa liu riu trở đều tay, kèm luôn đường lò nướng cho nhà phố. Gia vị
    chỉ phải sắm một lần — gói mắc khén, nhúm hạt dổi dùng được cả năm —
    mà từ nay mâm cơm nhà có thêm **một vùng núi rừng để mời khách**.

