flavorNote: >-
  **Chuẩn vị:** chén mắm **bông trắng như kem, sánh chứ không loãng**, nếm
  thấy mặn đậm nhưng có chua của quất và ngọt nhẹ đỡ phía sau. Miếng đậu
  cắn vào **nghe rộp ở vỏ, bên trong còn nóng và mềm béo**.
storyEyebrow: Chuyện mẹt bún đậu
storyTitle: Món **rẻ nhất bảng** mà cả nước đi theo
story:
  - >-
    Bún đậu mắm tôm khởi đầu là **quà vặt vỉa hè Hà Nội**: một mẹt tre, mấy
    bìa đậu rán, ít bún lá cắt miếng, chén mắm tôm và rổ rau. Không nước
    dùng, không bếp lửa tại chỗ, gọn tới mức gánh đi đâu cũng bán được.
    Rồi từ thứ quà chiều rẻ tiền đó, nó đi vào Nam, đi ra nước ngoài, và
    thành một trong những món Việt được gọi tên nhiều nhất.
  - >-
    Ngôi sao của mẹt là **miếng đậu phụ rán**. Đậu Mơ — thứ đậu phụ nổi
    tiếng của đất Hà thành — rán lên **phồng lớp vỏ vàng óng mà bên trong
    vẫn mềm mát**, ăn nóng ngay tại chỗ mới đúng. Vì vậy hàng bún đậu bao
    giờ cũng có một chảo mỡ sôi ngay cạnh mẹt: khách ngồi xuống rồi mới
    thả đậu vào rán.
  - >-
    Còn chén mắm tôm thì là chỗ phân định người quen và người lạ. Mắm múc
    thẳng từ hũ ra thì mặn gắt và nồng; phải **đánh cho bông trắng lên
    cùng đường, rượu trắng và nước cốt quất**, rồi rưới một thìa **mỡ đang
    sôi vừa rán đậu** — sức nóng làm mắm nở bung, mùi hăng dịu hẳn, thay
    vào đó là mùi thơm đậm rất riêng. Cả món đứng hay đổ đều ở chén mắm đó.

