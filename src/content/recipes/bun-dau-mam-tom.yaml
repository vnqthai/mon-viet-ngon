heroEyebrow: Mẹt bún dọn ra, cả nhà xúm lại…

quick:
  ingredients:
    - Bún lá [[800|g]] — vắt thành bánh, cắt miếng vuông
    - Đậu phụ [[8|bìa]] — chọn bìa trắng ngà, mềm mà đàn hồi
    - Thịt chân giò lọc xương [[400|g]] — luộc rồi sốc nước đá
    - Chả cốm [[300|g]] — hoặc tự làm từ cốm + thịt xay + giò sống
    - Rau kinh giới · tía tô · dưa chuột — rửa sạch để thật ráo
    - >-
      Mắm tôm: mắm tôm [[4|thìa canh|frac]] · đường [[2|thìa cà phê|frac]] ·
      rượu trắng [[2|thìa cà phê|frac]] · quất [[4|trái]] · ớt
    - Mỡ lợn (hoặc dầu) để rán đậu — giữ lại chút mỡ nóng để rưới mắm
  steps:
    - Luộc chân giò với gừng và hành [[15|phút]], **sốc nước đá** cho da giòn, để nguội rồi thái mỏng.
    - Đậu phụ **thấm thật khô**, cắt miếng vuông, rán ngập mỡ nóng già cho **vỏ vàng giòn, ruột còn mềm**.
    - Chả cốm rán vàng hai mặt ở lửa vừa cho chín tới trong.
    - Bún lá cắt miếng vuông vừa gắp; rau nhặt kỹ, vẩy ráo.
    - "Pha mắm tôm: mắm + đường + rượu trắng + nước cốt quất, **đánh cho bông trắng**, rưới **mỡ nóng vừa rán đậu**, thả ớt."
    - Lót lá chuối lên mẹt, bày bún - đậu - thịt - chả - rau, chén mắm đặt giữa. Ăn liền lúc đậu còn nóng.
  warning: >-
    **Mắm tôm pha xong để lâu là xẹp hết bọt và nặng mùi.** Đánh bông sát
    giờ ăn, và mỡ rưới phải đang thật nóng — mỡ nguội thì mắm không dậy
    mùi mà chỉ thấy váng mỡ nổi lều bều.

flavor:
  chua: 4
  ngot: 3
  man: 8
