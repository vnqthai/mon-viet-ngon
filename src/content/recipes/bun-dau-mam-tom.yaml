stepsEyebrow: Vô bếp thôi!
stepsTitle: 5 bước dọn **mẹt bún đậu tại nhà**
stepsLead: >-
  Món này không có nồi nước dùng nào để canh, nhưng lại có một điều kiện
  khắt khe: **đậu phải nóng khi lên mẹt**. Vì vậy thứ tự đúng là làm hết
  mọi thứ khác trước, để chảo mỡ và chén mắm lại sau cùng.
steps:
  - title: Luộc thịt chân giò
    icon: pot
    minutes: 25 phút
    intro: "Làm trước tiên vì thịt cần thời gian nguội mới thái mỏng được:"
    bullets:
      - label: "Luộc:"
        text: >-
          chân giò rửa sạch, chần qua nước sôi rồi rửa lại; luộc trong nước
          lạnh cùng vài lát **gừng đập dập và mấy củ hành tím**, chút muối,
          chừng **15–20 phút** kể từ lúc sôi.
      - label: "Sốc nước đá:"
        text: >-
          vớt ra thả ngay vào **thau nước đá 5 phút** — bì co lại nên miếng
          thịt **giòn bì mà vẫn mọng nước**, mặt cắt cũng trắng đẹp.
      - label: "Thái:"
        text: >-
          để nguội hẳn (cho vào ngăn mát 15 phút càng dễ) rồi **thái lát
          thật mỏng ngang thớ**, bày ra đĩa đậy kín.
    callout:
      type: tip
      text: >-
        Thái thịt lúc còn ấm là lát dày và bở nát. Thịt nguội, dao bén,
        thái ngang thớ — miếng nào miếng nấy mỏng đều, có đủ **viền bì,
        vệt mỡ và phần nạc**.
    timer:
      secs: 1020
      label: Hẹn giờ luộc chân giò · 17:00
      doneMsg: Vớt ra thả vô thau nước đá liền nghen!
  - title: Soạn bún, rau, chả cốm
    icon: basket
    minutes: 15 phút
    bullets:
      - label: "Bún lá:"
        text: >-
          cắt thành **miếng vuông vừa gắp**, xếp chồng lên nhau cho gọn. Nếu
          dùng bún rối thì vắt cho ráo rồi chia thành từng vắt nhỏ.
      - label: "Rau:"
        text: >-
          kinh giới và tía tô nhặt lá, **rửa nhẹ tay** rồi vẩy thật ráo — rau
          còn đọng nước là làm loãng chén mắm khi chấm. Dưa chuột thái lát
          chéo.
      - label: "Chả cốm:"
        text: >-
          rán **lửa vừa** cho vàng đều hai mặt rồi hạ nhỏ lửa thêm 2 phút cho
          chín tới bên trong. Lửa lớn là cháy vỏ mà ruột còn sống.
      - text: Lót **lá chuối** lên mẹt tre, xếp sẵn bún, thịt, chả, rau — chừa chỗ cho đậu.
    callout:
      type: warn
      text: >-
        Rau phải **ráo tuyệt đối**. Đây là món chấm chứ không phải món chan:
        chỉ vài giọt nước đọng trên lá rau cũng đủ làm chén mắm loãng ra và
        nhạt đi sau vài lần chấm.
  - title: Rán đậu — vỏ giòn, ruột mềm
    icon: flame
    minutes: 12 phút
    bullets:
      - text: >-
          Đậu phụ cắt miếng vuông vừa ăn, **thấm thật khô** bằng khăn giấy,
          để hở 5 phút cho ráo hẳn mặt.
      - text: >-
          Đun **mỡ lợn nóng già** trong chảo sâu (thả mẩu đậu vào thấy sủi
          tăm quanh là được), thả đậu vào **ngập mỡ**, không xếp chồng.
      - text: >-
          Rán **lửa vừa lớn** cho tới khi vỏ vàng ruộm và nghe cứng mặt,
          chừng 4–5 phút mỗi mẻ; vớt ra **để lên vỉ** cho ráo mỡ.
      - text: "**Chừa lại 1–2 thìa mỡ đang sôi trong chảo** — lát nữa rưới vào chén mắm."
    callout:
      type: warn
      text: >-
        Đậu còn ướt gặp mỡ nóng vừa **bắn dữ dội** vừa không giòn nổi, vì
        nước bốc hơi làm nguội mặt tiếp xúc. Thấm khô là bước không được
        bỏ. Và đừng rán quá lâu — ruột đậu khô xác là mất hết cái béo mát.
  - title: Pha mắm tôm — đánh cho bông
    icon: bowl
    minutes: 5 phút
    bullets:
      - text: >-
          Cho [[4|thìa canh|frac]] mắm tôm vào bát rộng miệng, thêm
          [[2|thìa cà phê|frac]] đường và [[2|thìa cà phê|frac]] rượu trắng.
      - text: >-
          Vắt nước cốt [[4|trái]] quất vào, dùng đũa hoặc thìa **đánh mạnh
          tay cho tới khi hỗn hợp nổi bông trắng và sánh lại**.
      - text: >-
          Múc **1–2 thìa mỡ đang sôi** từ chảo rán đậu rưới thẳng vào —
          nghe xèo một tiếng, mắm nở bung và dậy mùi thơm. Đánh thêm vài
          vòng.
      - text: "Thả ớt thái lát lên mặt. Nếm thử: mặn đậm, chua rõ, ngọt nhẹ ở hậu."
    callout:
      type: tip
      text: >-
        Nếm thấy còn gắt thì thêm **nước cốt quất** chứ đừng thêm nước lã —
        nước lã làm mắm loãng và tanh. Ai mới ăn mắm tôm thì pha riêng một
        chén nhạt hơn: tăng đường và quất, giảm mắm.
  - title: Bày mẹt, ăn liền lúc đậu còn nóng
    icon: basket
    minutes: 3 phút
    bullets:
      - text: >-
          Xếp **đậu vừa vớt khỏi chảo** vào chỗ trống trên mẹt, cạnh bún và
          thịt; chả cốm cắt miếng xếp bên.
      - text: >-
          Rau kinh giới, tía tô, dưa chuột dồn về một góc; **chén mắm đặt
          giữa mẹt** cho ai cũng với tới.
      - text: >-
          Ăn ngay: gắp miếng bún, kẹp lá kinh giới, thêm miếng đậu nóng,
          chấm ngập mắm. Đậu rán mẻ nào ăn mẻ đó.
    callout:
      type: tip
      text: >-
        Nhà đông người thì **rán đậu thành nhiều mẻ**, ăn hết mẻ này rán mẻ
        khác — đúng kiểu hàng quán. Đậu rán sẵn để cả mẹt thì tới miếng thứ
        ba đã nguội và dai, mất hẳn cái ngon.
    doneText: Dọn mẹt ra — xong!

tipsTitle: 6 bí quyết cho **mẹt bún đậu ra chất hàng quán**
tipsLead: >-
  Món này ít thao tác nên chỗ nào cũng lộ. Mắm pha dở thì cả mẹt hỏng, đậu
  nguội thì cả mẹt nhạt — sáu mẹo dưới đây là những chỗ đáng chú ý nhất.
tips:
  - icon: jar
    title: Chọn mắm tôm màu sim, thơm chứ không khai
    text: >-
      Mắm ngon có **màu sim tím, sánh mịn, dậy mùi thơm đậm**. Mắm đã hỏng
      thì ngả xám, loãng và có mùi khai xộc lên. Không mẹo pha nào cứu được
      một hũ mắm dở, nên đây là thứ đáng chọn kỹ nhất khi đi chợ.
  - icon: flame
    title: Mỡ nóng rưới vào mới ra mùi
    text: >-
      Đường, rượu và quất làm mắm bông lên, nhưng thứ tạo ra mùi thơm đặc
      trưng là **thìa mỡ đang sôi** múc thẳng từ chảo rán đậu. Phải nghe
      tiếng xèo mới đúng — mỡ đã nguội thì chỉ đọng thành váng, mắm vẫn
      nồng nguyên.
  - icon: drop
    title: Đậu thấm khô rồi mới xuống chảo
    text: >-
      Nước trên mặt đậu làm hai việc xấu cùng lúc: **bắn mỡ** và **cản
      giòn**. Thấm khô bằng khăn giấy, để hở vài phút cho ráo hẳn, rồi mới
      thả vào mỡ nóng già. Vỏ sẽ phồng lên vàng ruộm chỉ trong vài phút.
  - icon: meat
    title: Sốc nước đá cho miếng thịt giòn bì
    text: >-
      Chân giò vừa luộc xong thả ngay vào **thau nước đá 5 phút**: bì co
      lại nên cắn nghe giòn, mặt cắt trắng đẹp, và thịt giữ được nước chứ
      không khô. Luộc xong để nguội tự nhiên thì miếng thịt xỉn màu và bì
      mềm oặt.
  - icon: herb
    title: Kinh giới là rau bắt buộc
    text: >-
      Mẹt bún đậu thiếu gì cũng được nhưng **không thiếu kinh giới**. Mùi
      hăng ấm của nó là thứ duy nhất đứng ngang được với mắm tôm; các rau
      thơm khác đều bị mắm át. Tía tô và dưa chuột thì đóng vai làm mát.
  - icon: bowl
    title: Pha sát giờ, pha vừa đủ
    text: >-
      Mắm đánh bông để lâu sẽ **xẹp bọt và nồng trở lại**. Pha ngay trước
      khi dọn mẹt, và pha vừa đủ ăn; thiếu thì pha thêm chén nữa, chỉ mất
      một phút. Đừng pha sẵn cả tô từ sớm.

serve:
  title: Mẹt bún đậu — **ngồi quanh mà gắp**
  paras:
    - >-
      Bún đậu không phải món dọn theo suất, mà là **món cả nhà xúm quanh
      một cái mẹt**. Mỗi người một chén mắm riêng, gắp chung từ mẹt, vừa
      ăn vừa đợi mẻ đậu tiếp theo trong chảo. Kiểu ăn chậm rãi đó chính là
      một nửa cái ngon của món.
    - >-
      Đây cũng là **món nhậu lai rai rất được việc**: mặn, béo, có rau, có
      cái để gắp lâu. Buổi chiều cuối tuần dọn một mẹt ra là ngồi được cả
      buổi. Ai không ăn được mắm tôm thì pha riêng một chén **nước mắm
      chanh tỏi ớt** — mẹt vẫn trọn vẹn.
    - >-
      Cùng nhóm bún trộn, nếu muốn một tô có nước chan chua ngọt thì bên
      cạnh có **bún thịt nướng** và **bún bò Nam Bộ**. Ba món cùng sợi bún
      mà ba lối ăn khác hẳn nhau — chấm, chan, và trộn.
  aside:
    title: Trên mẹt bún đậu
    intro: "Đủ bộ này là ra hàng quán:"
    items:
      - icon: pod
        text: "**Đậu rán nóng theo mẻ** — thứ duy nhất không được để nguội."
      - icon: herb
        text: "**Kinh giới + tía tô** — nhặt lá, để thật ráo."
      - icon: bowl
        text: "**Chén mắm riêng cho từng người** — chấm chung một chén là mất vệ sinh mà lại hết nhanh."
      - icon: lime
        text: "**Đĩa quất và ớt để thêm** — ai muốn chua cay hơn thì tự nêm."

faq:
  - q: Không ăn được mắm tôm thì chấm gì?
    a: >-
      Pha **nước mắm chanh tỏi ớt** theo tỷ lệ quen thuộc — mắm, đường,
      nước cốt chanh, nước lọc, thêm tỏi ớt băm. Mẹt bún đậu chấm nước mắm
      vẫn ngon, chỉ là mất đi cái mùi làm nên tên món. Nhà có người ăn
      được người không thì cứ dọn cả hai chén.
  - q: Mắm tôm đánh mãi không bông là vì sao?
    a: >-
      Thường do **thiếu chất chua** hoặc **mắm quá loãng**. Vắt thêm nước
      cốt quất rồi đánh mạnh tay hơn — chua gặp mắm mới tạo bọt. Nếu mắm
      loãng sẵn thì không cứu được nhiều, lần sau chọn hũ **sánh và đặc**.
      Và nhớ dùng bát rộng miệng, bát hẹp thì đánh không có chỗ nổi bông.
  - q: Bún lá với bún rối khác nhau thế nào?
    a: >-
      **Bún lá** là bún vắt thành từng lá dày rồi cắt miếng — ráo nước, cầm
      chắc tay, chấm mắm không bị nhão, nên hợp mấy món chấm như bún đậu và
      **bún chả Hà Nội**. **Bún rối** thì sợi rời, hợp các món chan nước
      như **bún bò Huế** hay **bún riêu cua**. Chỉ có bún rối thì vắt cho
      thật ráo rồi chia thành vắt nhỏ là dùng được.
  - q: Chả cốm tự làm được không?
    a: >-
      Được. Trộn **cốm** đã xả qua nước cho mềm với **thịt nạc vai xay** và
      **giò sống** theo tỷ lệ áng chừng 1 phần cốm : 2 phần thịt và giò,
      nêm nước mắm, tiêu, hành khô băm. Nặn miếng dẹt rồi **hấp 10 phút cho
      định hình trước, sau đó mới rán vàng** — làm vậy chả không bị vỡ và
      bên trong chín đều.
  - q: Đậu rán bị ỉu, không giòn nổi?
    a: >-
      Ba nguyên nhân, thường đi cùng nhau: **đậu chưa thấm khô**, **mỡ chưa
      đủ nóng**, và **thả quá nhiều miếng một lúc** làm tụt nhiệt chảo. Sửa
      cả ba: thấm khô kỹ, đun mỡ tới nóng già, rán từng mẻ ít. Vớt ra để
      lên vỉ chứ đừng để trên giấy — hơi nước đọng lại là mềm ngay.
  - q: Dọn cho đông người thì tính lượng sao?
    a: >-
      Áng chừng mỗi người **200 g bún, 2 bìa đậu, 100 g thịt** và một nắm
      rau. Nhưng quan trọng hơn con số là **cách dọn**: rán đậu thành nhiều
      mẻ nối nhau thay vì rán hết một lượt, và pha mắm thành từng chén nhỏ
      thay vì một tô lớn. Món này ăn theo nhịp, không dọn hết một lần.

