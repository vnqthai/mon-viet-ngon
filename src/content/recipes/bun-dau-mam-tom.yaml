title: Bún đậu mắm tôm **đậu vàng giòn, mắm đánh bông thơm nức**
summary: >-
  Cái mẹt tre lót lá chuối, bày **bún lá cắt miếng**, đậu phụ rán vàng ruộm
  còn nóng rẫy, thịt luộc thái mỏng, chả cốm dẻo thơm và rổ kinh giới tía
  tô. Linh hồn nằm ở chén **mắm tôm đánh bông rưới mỡ nóng** — chấm một
  miếng là hiểu vì sao món này đi khắp nước.
region: Miền Bắc
category: Bún trộn
occasions: [Ăn chơi, Nhậu lai rai]
pubDate: 2026-07-29
