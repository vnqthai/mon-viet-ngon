quick:
  ingredients:
    - Lươn đồng sống [[600|g]] — cỡ ngón tay cái, còn khoẻ
    - Miến dong [[200|g]] · xương heo [[300|g]] để ninh cùng xương lươn
    - Nghệ tươi [[1|củ]] · hành tăm [[50|g]] — củ hành nhỏ bằng hạt đậu, thơm nồng
    - Rau răm · hành lá · ớt bột · nước mắm · tiêu
  steps:
    - Làm sạch nhớt lươn bằng **muối hạt và nước vo gạo**, tuốt kỹ rồi rửa lại.
    - Luộc lươn với chút muối và gừng chừng **10 phút**, vớt ra để nguội bớt.
    - Gỡ thịt lươn thành **miếng dài dọc theo thớ**, giữ xương sống lại. **Gỡ xong đừng rửa nữa.**
    - Ninh xương lươn với xương heo **50 phút**, lọc lấy nước trong.
    - Giã hành tăm, **vắt lấy nước cốt ướp lươn**; phần bã để dành phi thơm.
    - Xào lươn với nghệ giã, ớt bột và nước cốt hành tăm tới khi miếng lươn **săn và vàng sậm**.
    - Trụng miến **15 giây**, cho vào tô, xếp lươn lên, chan nước dùng nóng.
    - "Rắc: hành tăm phi, rau răm thái nhỏ, tiêu — thêm ớt bột nếu thích cay."
  warning: >-
    Gỡ thịt xong mà đem rửa lại là **lươn tanh hẳn** — nước rửa cuốn mất lớp
    nhớt ngọt bám ngoài thớ thịt và để lại mùi. Chỉ thấm khô bằng giấy, không
    rửa.

