title: Miến lươn Nghệ An **nước vàng nghệ, lươn còn nguyên miếng**
summary: >-
  Lươn đồng gỡ thành **miếng dài còn nguyên thớ**, xào săn với nghệ tới vàng
  sậm rồi xếp lên tô miến trong. Nước dùng ninh từ chính xương lươn, chan vào
  vàng óng, thơm mùi hành tăm phi — húp một muỗng là ấm tới bụng.
region: Miền Trung
category: Món nước
