flavorNote: >-
  **Chuẩn tô miến:** nước dùng **vàng óng và trong**, ngọt từ xương chứ không
  ngọt gắt. Miếng lươn **săn, còn nguyên thớ, cắn có độ dai nhẹ** — không tơi
  bã, không nát vụn. Mùi hành tăm phải nổi lên trước, ấm nghệ và cay ớt tới sau.
storyEyebrow: Chuyện tô miến xứ Nghệ
storyTitle: Con lươn được gỡ **thành miếng, không thành sợi**
story:
  - >-
    Tô miến lươn xứ Nghệ có ba thứ, và thứ nào cũng làm theo lối riêng của
    vùng. Lươn đồng luộc vừa chín rồi **gỡ dọc thớ thành miếng dài**, để
    nguyên chứ không tước nhỏ. Nước dùng ninh từ chính bộ xương con lươn cộng
    ít xương heo. Và miến dong trụng nhanh, sợi trong và dai.
  - >-
    Thứ làm tô miến này khác hẳn mọi tô miến khác là **hành tăm** — thứ hành
    củ nhỏ chỉ bằng hạt đậu, mùi nồng và hắc hơn hành ta nhiều lần, mọc khắp
    vùng đất cát ven biển miền Trung. Người trong vùng giã hành tăm rồi vắt
    lấy nước cốt để ướp lươn, còn phần bã đem phi vàng rắc lên tô. Một củ hành
    dùng hai lần, và cả tô dậy mùi vì nó.
  - >-
    Miếng lươn phải xào cho tới khi **săn lại và ngả vàng sậm** vì nghệ, chứ
    không để mềm. Đó là chỗ nhiều người làm hụt: xào vội thì miếng lươn còn
    mọng nước, thả vào tô là rã ra và tô nước đục ngầu.

