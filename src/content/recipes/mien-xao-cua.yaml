title: Miến xào cua **sợi tơi bóng, thớ cua ngọt nguyên**
summary: >-
  Đĩa miến xào **sợi nào ra sợi nấy, không dính chùm**, quyện thịt cua bể
  gỡ nguyên thớ với gạch cua vàng ươm, thêm mộc nhĩ giòn và giá đỗ ngọt
  nước. Món đủ sang để đặt lên mâm cỗ mà nấu thì chỉ hết một buổi chiều.
region: Cả nước
category: Xào
occasions: [Cỗ Tết, Đãi khách]
