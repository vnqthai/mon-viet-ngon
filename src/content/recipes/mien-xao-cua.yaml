storyEyebrow: Chuyện đĩa miến xào
storyTitle: Đĩa **quen mặt trên mâm cỗ**, nâng lên bằng con cua bể
story:
  - >-
    Trong mâm cỗ Bắc dựng theo lệ **bốn bát bốn đĩa**, gần như bao giờ cũng
    có một đĩa miến xào. Bản phổ thông là **miến xào thập cẩm** — miến với
    mộc nhĩ, nấm hương, cà rốt, su hào, có nhà thêm lòng gà. Nó ở đó vì
    mâm cỗ cần một món **khô, tơi và nhiều màu** để cân lại mấy bát canh
    và mấy đĩa thịt.
  - >-
    Miến xào cua là bản được nâng lên. Thay vì thập cẩm, cả đĩa dồn vào
    một thứ đạm duy nhất: **thịt cua bể gỡ nguyên thớ**, thêm chút **gạch
    cua** phi thơm làm màu và làm mùi. Cua bể ngọt đậm hơn cua đồng và cho
    ra **thớ thịt to, chắc** — gắp lên còn thấy hình miếng thịt chứ không
    tan ra như thịt cua giã.
  - >-
    Cái khó của món không nằm ở con cua mà ở **sợi miến**. Miến dong hút
    nước rất nhanh, gặp nước rau tiết ra là trương lên rồi dính bết thành
    khối. Người nấu quen tay giải bài đó bằng một mẹo cũ: **tráng trứng
    trước rồi mới trút miến vào** — lớp trứng bọc quanh từng sợi, sợi nào
    ra sợi nấy cho tới lúc bưng lên mâm.

