heroEyebrow: Chảo nóng già, tay đảo cho lẹ…

quick:
  ingredients:
    - Cua bể sống [[600|g]] — chừng 2 con vừa, chắc thịt
    - Miến dong [[200|g]] — sợi nhỏ suôn, **màu xám nhạt hơi đục**
    - Trứng gà [[2|quả]] — bí quyết cho miến tơi rời
    - Mộc nhĩ [[30|g]] · nấm hương [[30|g]] · giá đỗ [[150|g]]
    - Hành tây [[1|củ]] · cà rốt [[1|củ]] · hành lá · rau mùi
    - "Nêm: nước mắm [[2|thìa canh|frac]] · tiêu · hành phi · mỡ lợn (hoặc dầu)"
  steps:
    - Hấp cua chín, **gỡ thịt lúc còn ấm** để thớ cua trượt ra nguyên miếng; gạch để riêng.
    - Miến ngâm **nước lạnh 10–15 phút**, vớt ráo, cắt khúc.
    - Phi hành, xào **gạch cua** cho vàng thơm rồi trút thịt cua vào đảo nhẹ, nêm mắm tiêu — múc ra bát.
    - Xào riêng mộc nhĩ, nấm hương, cà rốt, hành tây, giá đỗ cho ráo — múc ra.
    - Chảo nóng, **tráng trứng đánh tan** rồi trút miến vào đảo ngay ở lửa vừa — trứng bọc sợi miến, miến hết dính.
    - Trả rau củ và cua vào, đảo đều nhanh tay, tắt bếp, rắc hành phi + rau mùi + tiêu.
  warning: >-
    **Xào tất tật một lượt trong một chảo là hỏng.** Rau nhả nước, cua nát
    thành xác, miến bết lại thành khối. Món này phải xào từng phần rồi mới
    trộn chung ở nhịp cuối.

