heroEyebrow: Ghe mực vừa về bến…

quick:
  ingredients:
    - >-
      Mực ống hoặc mực lá tươi [[600|g]] — mắt trong veo, râu bám chắc,
      thịt trắng đục chắc tay
    - Thơm chín vừa [[0.5|trái|frac]] · cần tây cọng lớn [[150|g]] · hành tây [[1|củ]]
    - Tỏi [[3|tép]] băm · gừng [[3|lát]] để chần mực · ớt sừng [[1|trái]]
    - >-
      Sốt xào: dầu hào [[1.5|muỗng canh|frac]] · nước mắm [[1|muỗng canh]]
      · đường [[1|muỗng cà phê]] · tiêu
  steps:
    - >-
      Mực làm sạch, rút túi mực; thân **khứa vảy rồng** cắt miếng, phần
      còn lại cắt khoanh, đầu để nguyên chùm râu.
    - >-
      Nước sôi già thả gừng, chần mực **10–15 giây** vừa co lại trắng đục
      là vớt ra ngay, để thật ráo.
    - Pha sẵn chén sốt, rau củ cắt sẵn hết — xào lửa lớn không kịp đong đo.
    - >-
      Chảo thật nóng phi tỏi, mực vô đảo chừng **1 phút** vừa cuộn hoa là
      trút ra dĩa chờ.
    - Vẫn chảo đó xào hành tây + thơm 1 phút, thêm cần tây + ớt đảo 30 giây.
    - >-
      Mực về chảo cùng chén sốt, đảo lửa lớn **30–60 giây**, nêm lại vừa
      miệng, tắt bếp liền.
  warning: >-
    Mực nằm trên lửa tổng cộng quá **3 phút là dai như cao su** — mọi thứ
    cắt sẵn pha sẵn, vô chảo là đi một mạch tới tắt bếp.

