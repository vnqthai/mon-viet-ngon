title: Mực xào thơm cần tây **mực giòn sần sật, chua ngọt hao cơm**
summary: >-
  Mực tươi khứa vảy rồng, chần sơ nước gừng rồi xào **lửa thật lớn** với
  thơm chín giòn, cần tây, hành tây — miếng mực cuộn hoa trắng nõn, cắn
  nghe sần sật, muỗng sốt chua ngọt rưới cơm là hao nồi.
region: Cả nước
category: Xào
occasions: [Cơm nhà]
pubDate: 2026-07-28
time:
  total: 30 phút
servingsBase: 4
difficulty: Dễ
featured: false
order: 45
