flavorNote: >-
  **Chuẩn vị:** mực trắng nõn cắn **sần sật ngọt thịt**, thơm chua ngọt
  mọng nước, cần tây dậy mùi nồng nàn — sốt chỉ vừa đủ áo bóng mặt mực,
  không lênh láng đọng dĩa.
storyTitle: Món xào **"tính bằng giây"** của bếp Việt
story:
  - >-
    Buổi chiều ở mấy chợ ven biển, ghe vừa cập bến là sạp mực đông người
    nhất: mực ống da còn bóng lưỡng, mực lá dày mình ánh ngọc — ai cũng
    biết mực tươi cỡ đó thì xào kiểu gì cũng ngọt. Mà chẳng riêng gì miền
    biển: từ quán cơm bình dân tới bữa giỗ, dĩa **mực xào thơm cần tây**
    gần như là "bài tủ" chung của cả nước — trắng nõn, vàng thơm, xanh cần
    tây, nhìn đã thấy tươi.
  - >-
    Nghe "khứa vảy rồng" tưởng đâu chiêu thức trong truyện chưởng, thiệt
    ra là kỹ thuật quen tay của người đứng bếp: **dao nghiêng khứa chéo
    hai chiều thành ô ca-rô trên mặt trong thân mực**. Miếng mực gặp nóng
    co lại, cuộn tròn nở hoa như bông, sốt len vô từng rãnh khứa — đẹp
    dĩa mà lại thấm vị.
    Cộng thêm cú **chần sơ nước gừng mươi giây** cho mực săn lại, ra bớt
    nước trước — vô chảo chỉ còn mỗi việc chín thơm, không xả nước làm
    nguội chảo.
  - >-
    Còn cặp thơm – cần tây là duyên nợ khó thay: một bên chua ngọt mọng
    nước, một bên thơm nồng đánh thức mũi, đỡ trọn cái ngọt thanh của mực.
    Món này còn dạy mình một nết bếp đáng tiền: **chuẩn bị cho đủ, ra tay
    cho nhanh** — dĩa xào ngon thua nhau ở cái đồng hồ, không phải ở gia
    vị.

