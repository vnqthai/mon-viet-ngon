stepsTitle: 6 bước ra **dĩa mực cuộn hoa**
stepsLead: >-
  Bốn bước đầu cứ thong thả mà làm cho kỹ; hai bước cuối trên lửa thì
  "tính bằng giây" — đọc hết một lượt trước khi bật bếp nghen.
steps:
  - title: Làm sạch mực
    icon: knife
    minutes: 10 phút
    bullets:
      - label: "Tách đầu:"
        text: >-
          nhẹ tay kéo chùm râu, ruột theo ra hết; **rút túi mực** cẩn thận
          kẻo bể (bể cũng đừng hoảng — xả nước là sạch, vị không đổi).
      - label: "Thân mực:"
        text: >-
          rút mảnh xương trong suốt như nhựa, lột lớp da nâu tím cho thân
          trắng đẹp, rửa sạch trong ngoài.
      - label: "Đầu mực:"
        text: >-
          bỏ mắt và răng mực (nốt cứng tròn giữa chùm râu), giữ nguyên
          chùm râu — con lớn thì bổ đôi cho vừa gắp.
      - text: >-
          Bóp mực với [[1|muỗng canh]] rượu trắng + gừng đập giập, xả lại
          nước sạch, để thật ráo.
    callout:
      type: tip
      text: >-
        Mua mực ở chợ cứ nhờ người bán làm sạch giùm, về chỉ việc rửa lại
        — tiết kiệm được chục phút, con mực vẫn tươi nguyên.
  - title: Khứa vảy rồng, cắt miếng
    icon: knife
    minutes: 5 phút
    bullets:
      - text: >-
          Xẻ dọc thân mực, trải phẳng, **mặt trong ngửa lên** — mặt vốn áp
          vô ruột, màu trắng đục hơn mặt ngoài.
      - text: >-
          Dao **nghiêng chừng 45 độ**, khứa các đường chéo song song cách
          nhau nửa phân, sâu chừng hai phần ba bề dày — đừng khứa đứt.
      - text: >-
          Xoay khứa chéo chiều ngược lại thành **ô ca-rô**, rồi cắt miếng
          cỡ ba ngón tay.
      - text: >-
          Phần thân không khứa cắt **khoanh tròn** dày 1 cm — dĩa mực vừa
          có khoanh vừa có hoa mới vui mắt.
    callout:
      type: tip
      text: >-
        Vì sao khứa mặt trong? Thớ thịt mặt trong co mạnh hơn khi gặp
        nóng, miếng mực **cuộn về phía đường khứa mà nở hoa** — khứa lộn
        mặt ngoài là miếng mực nằm thẳng đơ, uổng công.
  - title: Chần sơ nước gừng
    icon: pot
    minutes: 3 phút
    bullets:
      - text: Nấu nồi nước **sôi già**, thả gừng đập giập vô.
      - text: >-
          Trút mực vô, đếm **10–15 giây** — miếng mực vừa co lại, chớm
          cuộn, chuyển trắng đục là vớt ra ngay, để thật ráo.
      - text: >-
          Bí quyết giòn nằm ở đây: mực **săn lại và ra bớt nước trước**,
          lát vô chảo không "xả nước" làm nguội chảo — xào mới ra xào.
    callout:
      type: warn
      text: >-
        Chần quá 20 giây là mực coi như đã chín một lần — vô chảo thành
        chín hai lần, dai ngay từ vạch xuất phát.
    timer:
      secs: 15
      label: Hẹn giờ chần mực · 00:15
      doneMsg: Vớt mực ra liền tay!
  - title: Rau củ + chén sốt sẵn sàng
    icon: basket
    minutes: 7 phút
    bullets:
      - label: "Thơm:"
        text: gọt vỏ khoét mắt, cắt miếng rẻ quạt mỏng vừa gắp.
      - label: "Cần tây:"
        text: >-
          tước xơ già, cắt khúc xéo chừng 4 cm; lá non giữ lại, thả vô
          phút chót cho thơm.
      - label: "Hành tây, ớt, tỏi:"
        text: hành tây bổ múi tách cánh; ớt sừng xắt lát xéo; tỏi băm nhuyễn.
      - label: "Chén sốt:"
        text: >-
          dầu hào + nước mắm + đường + tiêu + 2 muỗng canh nước lọc,
          khuấy tan sẵn.
    callout:
      type: tip
      text: >-
        Xào lửa lớn là "một mạch không phanh" — mọi thứ phải nằm sẵn trong
        tầm tay với. Đang xào mà quay đi đong sốt là y như rằng mực quá
        lửa.
  - title: Xào mực nhanh như chớp
    icon: flame
    minutes: 2 phút
    bullets:
      - text: >-
          Chảo **thật nóng tới bốc khói nhẹ**, cho dầu láng đều, phi tỏi
          vàng thơm.
      - text: >-
          Mực vô, đảo hất liên tục chừng **1 phút** — miếng khứa cuộn hoa,
          khoanh co tròn lại là đủ.
      - text: Trút ngay mực ra dĩa để chờ, kèm luôn cả tỏi phi.
    callout:
      type: warn
      text: >-
        Chảo chưa đủ nóng mà thả mực là nó **nằm im xả nước** — thành mực
        luộc, mất giòn. Thà chờ chảo nóng thêm 30 giây còn hơn.
  - title: Hợp chảo, rưới sốt, tắt bếp
    icon: flame
    minutes: 3 phút
    bullets:
      - text: >-
          Vẫn chảo đó thêm xíu dầu: **hành tây + thơm** vô trước, đảo 1
          phút cho dậy mùi mà cánh hành còn giòn.
      - text: "**Cần tây + ớt** vô sau, đảo 30 giây — cọng cần xanh mướt là đạt."
      - text: >-
          Mực về chảo, rưới **chén sốt** vòng quanh, đảo lửa lớn 30–60
          giây cho sốt áo bóng; nếm lại, rắc lá cần + tiêu, tắt bếp liền.
    callout:
      type: tip
      text: >-
        Sốt đúng chuẩn chỉ **áo bóng mặt mực**, đọng nhẹ dưới đáy dĩa —
        thấy sền sệt lênh láng là lần sau bớt tay dầu hào lại một chút.
    timer:
      secs: 60
      label: Hẹn giờ hợp chảo · 01:00
      doneMsg: Tắt bếp — mực vừa giòn tới!
    doneText: Nghiêng chảo ra dĩa — xong!

tipsTitle: 8 bí quyết cho **dĩa mực không dai**
tipsLead: >-
  Mực là loại nguyên liệu "sòng phẳng": làm đúng thì giòn ngọt, lơ mơ là
  dai liền — mấy điều dưới đây chính là ranh giới đó.
tips:
  - icon: fish
    title: Ba dấu hiệu mực tươi
    text: >-
      **Mắt trong veo** không đục lồi, **râu và đầu bám chắc** vô thân,
      **thịt trắng đục ánh ngọc** ấn tay thấy chắc đàn hồi. Thiếu một
      trong ba là mực đã nằm sạp lâu — xào ra nước, tanh, đừng tiếc rẻ.
  - icon: knife
    title: Mực ống hay mực lá?
    text: >-
      **Mực lá** dày mình, ngọt đậm, khứa vảy rồng nở hoa đẹp nhất; **mực
      ống** mỏng hơn nhưng giòn và giá mềm hơn. Món này con nào cũng ngon
      — miễn là tươi, đừng miễn cưỡng con ươn.
  - icon: pot
    title: Chần sơ — ăn gian một nhịp
    text: >-
      Thân mực vốn mọng nước; chần sôi mươi giây ép bớt nước ra **trước
      khi** vô chảo, nên chảo giữ được độ nóng, mực chỉ việc săn giòn.
      Bỏ qua bước này là dĩa xào thành dĩa... canh mực.
  - icon: flame
    title: Chảo ít, lửa lớn
    text: >-
      Nhà dùng bếp điện hay lửa yếu thì **xào làm hai mẻ nhỏ** — dồn một
      chảo đầy là nhiệt tụt cái rụp, cả dĩa thành om thay vì xào. Nhiệt
      là gia vị số một của món này.
  - icon: pineapple
    title: Thơm chín vừa mới giòn
    text: >-
      Chín quá thì mềm nhũn, xào lên nát và ngọt gắt; còn xanh thì chua
      rát lưỡi. Chọn trái **mắt nở, vàng au chừng hai phần trái, thơm nhẹ
      mũi** — miếng thơm xào xong vẫn nguyên miếng, cắn sựt sựt.
  - icon: stem
    title: Cần tây cọng to, đừng nhầm rau cần
    text: >-
      Món này dùng **cần tây cọng to, đặc ruột, thơm nồng** (miền Bắc hay
      gọi thẳng là cần tây). Đừng nhầm với **rau cần nước** cọng rỗng
      ruột, mùi nhẹ hơn — hợp nồi lẩu hơn là chảo xào này. Nhớ tước xơ
      già kẻo nhai dai nhách.
  - icon: jar
    title: Dầu hào là "nhạc trưởng" của sốt
    text: >-
      Dầu hào cho vị mặn ngọt tròn và lớp bóng đẹp, nước mắm chỉ điểm nhẹ
      cho dậy hậu — hai thứ đều mạnh tay là **mặn chồng mặn**, át luôn vị
      ngọt thanh của mực.
  - icon: sun
    title: Vớ được mực một nắng?
    text: >-
      Mực một nắng xào món này cũng hết sẩy: thịt dẻo, ngọt cô đọng hơn
      mực tươi. Nhớ là nó đã ngậm muối sẵn — **bớt dầu hào nước mắm lại**
      và khỏi chần, chỉ cần xào nhanh đúng lửa.

serve:
  title: Dọn dĩa **còn bốc khói**
  paras:
    - >-
      Món này "tính bằng giây" tới tận lúc ăn: mực vừa ra dĩa là **gắp
      liền** mới trọn cái sần sật, để nguội là miếng mực ỉu đi thấy rõ.
      Rưới muỗng sốt chua ngọt lên chén cơm nóng — góc cơm "dính sốt" đó
      kiểu gì cũng có người giành.
    - >-
      Mâm cơm chiều gọn mà êm: dĩa mực xào, chén **canh bí đỏ** ngọt lành,
      cơm trắng nóng hổi — đậm nhạt nóng mát đủ cả, nấu nhanh mà nhìn mâm
      rất "có lòng".
    - >-
      Còn nói thiệt lòng, món này **làm mồi cũng hết sẩy**: dọn kèm chén
      muối tiêu chanh, thêm dĩa **gỏi xoài xanh tôm khô** chua cay nữa là
      thành tiệc nhỏ cuối tuần — mực ngọt, gỏi chua, chuyện nổ như bắp
      rang.
  aside:
    title: Mâm cơm gợi ý
    intro: "Mấy thứ này kề bên là bữa chiều êm ru:"
    items:
      - icon: rice
        text: "**Cơm trắng nóng** — để hứng muỗng sốt chua ngọt, đừng bỏ phí."
      - icon: bowl
        text: "**Canh bí đỏ** — ngọt lành hiền hậu, cân độ đậm của đồ xào."
      - icon: lime
        text: "**Muối tiêu chanh** — dọn kiểu lai rai, chấm miếng mực khỏi chê."
      - icon: shrimp
        text: "**Gỏi xoài xanh tôm khô** — thêm vị chua cay là ra tiệc nhỏ."

faq:
  - q: Mực đông lạnh làm được không?
    a: >-
      Được — chọn khối mực **trắng đều, không vàng ố, không mùi khai**, rã
      đông từ từ trong ngăn mát rồi thấm thật khô. Độ giòn kém mực tươi
      một bậc, nhưng chần đúng và xào nhanh thì vẫn ngon lành, không dai.
  - q: Sao dĩa mực của tôi ra nước lênh láng?
    a: >-
      Điểm danh ba thủ phạm: **bỏ qua bước chần sơ**, **chảo chưa đủ
      nóng**, và **dồn chảo quá đầy**. Nước từ mực xả ra làm nguội chảo,
      thế là cả dĩa chuyển từ "xào" sang "luộc". Sửa đủ ba là dĩa xào ráo
      bóng ngay.
  - q: Mực dai quá — tại sao, có cứu được không?
    a: >-
      Dai là do **quá lửa** — mực chỉ cần chín tới là giòn, quá thêm phút
      nào dai thêm phút đó. Nói thiệt: đã dai rồi thì trong món xào khó
      cứu (mực chỉ mềm lại nếu om rất lâu — thành món khác mất rồi). Lần
      sau nhớ: chần 10–15 giây, tổng thời gian trên lửa dưới 3 phút.
  - q: Không có dầu hào thì thay bằng gì?
    a: >-
      Pha **nước tương + đường** (2 muỗng canh nước tương, 1 muỗng cà phê
      đường) hoặc nước mắm đường cũng xào được — vị vẫn đậm đà nhưng sốt
      mỏng và kém bóng hơn một chút. Có chai dầu hào trong bếp vẫn đáng
      nhất — món xào nào cũng cậy được nó.
  - q: Túi mực bể đen thui — bỏ luôn hả?
    a: >-
      Đừng! **Xả nước lạnh vài lần là sạch**, thịt mực có ngả màu ngà
      chút xíu cũng không sao, vị y nguyên. Túi mực còn là "gia vị" của thiên
      hạ nữa mà — người ta nấu cả mì mực đen kia kìa. Bể túi mực không
      phải thảm họa, đừng vì nó mà bỏ con mực tươi.
  - q: Đổi rau củ khác được không?
    a: >-
      Được — biến thể quen tay: **ớt chuông, dưa leo, bông cải, nấm
      đông cô**, hoặc tăng hành tây cho ngọt. Nhưng cặp **thơm – cần tây**
      vẫn là "cặp bài trùng" khó thay: một chua ngọt mọng nước, một thơm
      nồng dậy mũi — đổi rồi thấy nhớ liền.

