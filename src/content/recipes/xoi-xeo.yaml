title: Xôi xéo **hạt vàng ươm, phủ lát đậu xanh mỏng như giấy**
summary: >-
  Gói xôi quà sáng của Hà Nội: hạt nếp vàng ươm bóng mỡ gà, trên mặt phủ **lát
  đậu xanh xắt mỏng như giấy**, rắc hành phi giòn tan. Cái tên "xéo" nói đúng
  cái nghề của nó — nghề đưa dao xéo qua nắm đậu.
region: Miền Bắc
category: Xôi
occasions: [Bữa sáng, Ăn chơi]
pubDate: 2026-07-31
time:
  total: 1 giờ 15 phút (+ ngâm nếp 8 giờ)
  active: 45 phút
servingsBase: 4
difficulty: Vừa
