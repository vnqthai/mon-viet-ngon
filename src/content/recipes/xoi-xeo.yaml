  thom: 8.5
flavorNote: >-
  **Chuẩn vị:** hạt nếp **dẻo mà rời ra từng hạt**, bóng mỡ chứ không ướt; lát
  đậu bùi mịn tan trong miệng; hành phi giòn rụm thơm nức. Xôi bết thành mảng
  hay khô cứng đều là trật nhịp đồ.

storyEyebrow: Chuyện gói xôi
storyTitle: Cái tên **nói đúng cái nghề** của người bán xôi
story:
  - >-
    "Xéo" ở đây là **một động tác, không phải một vị**. Người bán xôi nắm đậu
    xanh đã đồ chín thành nắm tròn chắc tay, rồi cầm con dao mỏng **đưa xéo qua
    mặt nắm** — mỗi nhát ra một lát đậu vàng mỏng như tờ giấy, rải phủ kín mặt
    bát xôi. Cái tên món sinh ra từ đúng nhát dao đó.
  - >-
    Cũng vì vậy mà xôi xéo khác **xôi vò** — món kia đậu xanh giã nhuyễn rồi vò
    cho tơi ra, bám thành từng hạt rời quanh hạt nếp. Cùng nếp, cùng đậu xanh,
    mà một bên là **lát phủ**, một bên là **hạt bám**; ăn vào khác hẳn nhau.
  - >-
    Còn thứ giữ cho gói xôi Hà Nội thơm nức thì chỉ có một: **mỡ gà**. Hành tím
    phi trong mỡ gà, đậu giã cùng mỡ gà, xôi đồ giữa chừng rưới mỡ gà — cùng
    một chảo mỡ đi qua ba lần. Thay bằng dầu ăn thì gói xôi vẫn ngon, chỉ là
    thiếu đúng cái mùi làm người ta nhớ hàng xôi đầu ngõ.

