art: xoi-xeo
heroEyebrow: Gói lá chuối nóng trên tay, sáng Hà Nội…

quick:
  ingredients:
    - >-
      Nếp cái hoa vàng [[500|g]] — ngâm **6–8 giờ** với [[1|muỗng cà phê]] muối
      và [[1|muỗng cà phê]] bột nghệ
    - Đậu xanh cà vỏ [[200|g]] — ngâm [[4|giờ]], đồ chín rồi giã nhuyễn
    - Hành tím [[8|củ]] thái lát mỏng · mỡ gà [[80|g]] (hoặc dầu ăn)
    - Muối, đường để nêm đậu và nêm xôi
  steps:
    - >-
      Ngâm nếp với muối và bột nghệ **6–8 giờ**, vo lại nhẹ tay rồi để **thật
      ráo** — nếp còn ướt là xôi nhão.
    - >-
      Đồ đậu xanh chín bở, **giã nhuyễn khi còn nóng** với chút mỡ gà và muối,
      nắm thật chặt thành nắm tròn.
    - >-
      Phi hành tím trong mỡ gà cho vàng, vớt ra giấy thấm; **giữ lại phần mỡ đã
      phi**.
    - >-
      Đồ xôi trong chõ **30–40 phút**, giữa chừng mở ra xới tơi và rưới mỡ gà,
      đậy lại đồ tiếp.
    - >-
      Xới xôi ra dĩa, **cầm dao xéo qua nắm đậu** thành lát mỏng phủ kín mặt
      xôi.
    - Rưới mỡ gà, rắc hành phi vàng ruộm — ăn ngay lúc còn nóng hổi.
  warning: >-
    Nếp vo xong không để ráo mà đổ thẳng vào chõ là xôi **bết thành mảng**, hạt
    dính vào nhau. Để rổ ráo tối thiểu 15 phút, xóc vài lần cho róc nước.

flavor:
  chua: 0
  ngot: 3
  man: 4
