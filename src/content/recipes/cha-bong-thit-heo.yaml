flavorNote: >-
  **Chuẩn mẻ chà bông:** sợi **mảnh, xoăn, tơi rời từng sợi** và nhẹ tới mức
  bốc một nắm gần như không thấy nặng tay. Màu vàng nâu nhạt đều, không có
  mảng sẫm. Bỏ vào miệng thì tan dần chứ không dai nhách cũng không cứng vụn.
storyEyebrow: Chuyện hũ chà bông
storyTitle: 600 g thịt, **một tiếng đứng chảo**, và một hũ để dành
story:
  - >-
    Chà bông là thịt nạc đã được luộc mềm, xé thành sợi rồi rang khô trên chảo
    cho tới khi gần như không còn nước. Miền Nam gọi là chà bông, miền Bắc gọi
    là **ruốc** — cùng một thứ. Vì đã rút hết nước nên nó để được rất lâu
    trong hũ kín, và đó chính là lý do món này ra đời.
  - >-
    Cách làm không có gì khó, nhưng có một chỗ không rút ngắn được: **thời
    gian đứng chảo**. Muốn sợi tơi và nhẹ thì phải rang lửa thật nhỏ và đảo
    liên tục gần một tiếng. Rang nhanh bằng lửa lớn thì bên ngoài cháy sém mà
    bên trong sợi vẫn còn ẩm — hũ đó để một tuần là chua.
  - >-
    Bù lại, một mẻ dùng được rất lâu và đi với gần như mọi thứ: rắc lên chén
    cháo, nhét vào ổ bánh mì, ăn với xôi hay cơm trắng, cuốn bánh tráng. Nhà
    có con nhỏ thì hũ chà bông tự làm gần như luôn có mặt trong bếp.

