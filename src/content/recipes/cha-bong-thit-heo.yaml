title: Chà bông thịt heo **bông tơi như tơ, để dành cả tháng**
summary: >-
  Thịt thăn luộc mềm, xé dọc thớ rồi giã cho tơi ra, sau đó **rang khô trên
  chảo gần một tiếng** tới khi sợi thịt xoăn lại, nhẹ bẫng và vàng ruộm. Một
  mẻ đầy hũ, xúc ăn với cơm, cháo, bánh mì hay xôi đều được.
region: Cả nước
category: Xào
occasions: [Cho bé, Bữa sáng]
