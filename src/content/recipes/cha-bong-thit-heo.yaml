heroEyebrow: 600 g thịt ra một hũ nhỏ xíu…

quick:
  ingredients:
    - Thịt thăn heo [[600|g]] — miếng dài, thớ chạy một chiều, lọc sạch gân mỡ
    - "Ướp: nước mắm [[2|muỗng canh]] · đường [[1|muỗng canh]] · tiêu · hành tím băm"
    - Sả [[2|cây]] · hành tím [[3|củ]] để luộc cùng cho thơm
    - Chảo đáy dày · chày cối hoặc cán bột
  steps:
    - Lọc sạch **gân, mỡ và da**, thái thịt thành khối vuông dày [[2|cm]] dọc theo thớ.
    - Ướp thịt với nước mắm, đường, tiêu, hành tím băm — để **30 phút**.
    - Luộc thịt với sả và hành tím, lửa nhỏ **35–40 phút** tới khi xé được bằng tay.
    - Vớt ra để nguội bớt, **xé dọc thớ** thành sợi nhỏ nhất có thể.
    - Giã nhẹ trong cối cho sợi **tơi và tướp ra**, rồi xé lại lần nữa.
    - Rang chảo **lửa nhỏ nhất 40–50 phút**, đảo liên tục tới khi sợi khô, xoăn và nhẹ bẫng.
    - Để nguội **hoàn toàn** rồi mới cho vào hũ đậy kín.
  warning: >-
    Cho vào hũ khi còn ấm là hơi nước đọng lại trong hũ và **cả mẻ mốc trong
    vài ngày**. Trải ra mâm cho nguội hẳn, sờ tay thấy mát rồi mới cất.

flavor:
  chua: 0
