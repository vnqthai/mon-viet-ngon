stepsEyebrow: Vô bếp thôi!
stepsTitle: 5 bước ra **hũ chà bông sợi tơi, nhẹ bẫng**
stepsLead: >-
  Bốn bước đầu nhanh gọn. Bước cuối — rang chảo — là bước dài nhất và cũng là
  bước quyết định; cứ bật một tập phim rồi đứng đảo cho hết giờ.
steps:
  - title: Lọc và thái dọc thớ
    icon: knife
    minutes: 10 phút
    intro: "Hướng thái quyết định sợi dài hay ngắn:"
    bullets:
      - text: >-
          Lọc bỏ **hết gân, mỡ và màng trắng**. Sót lại một sợi gân là lúc rang
          nó co cứng thành cục, không xé ra được.
      - label: "Thái dọc thớ:"
        text: >-
          Nhìn cho ra hướng chạy của thớ thịt, rồi **cắt theo chiều đó** thành
          khối dài dày chừng [[2|cm]]. Cắt ngang thớ là sợi chà bông sẽ ngắn
          và vụn.
      - text: >-
          Rửa sạch, thấm khô rồi ướp với nước mắm, đường, tiêu và hành tím
          băm. Để **30 phút** cho thấm.
  - title: Luộc tới khi xé được bằng tay
    icon: pot
    minutes: 40 phút
    bullets:
      - text: >-
          Cho thịt vào nồi, đổ nước **xâm xấp mặt thịt** (đừng ngập nhiều —
          nước nhiều thì vị ướp trôi ra hết), thả sả và hành tím đập dập.
      - text: >-
          Đun sôi, hớt bọt, rồi **hạ lửa nhỏ 35–40 phút**. Nước cạn dần tới gần
          hết là vừa đẹp.
      - text: >-
          Thử: lấy một miếng ra, dùng hai chiếc nĩa kéo ngược nhau — **thớ tách
          ra dễ dàng thành sợi** là chín tới. Còn phải dùng sức thì luộc thêm
          10 phút.
      - text: Vớt ra, để nguội bớt tới mức cầm tay được.
    callout:
      type: warn
      text: >-
        Luộc quá tay thì thịt bở, xé ra thành vụn chứ không thành sợi — rang
        lên sẽ ra một thứ giống bột hơn là chà bông. Cứ thử bằng nĩa từ phút
        thứ 30.
    timer:
      secs: 2100
      label: Hẹn giờ luộc · 35:00
      doneMsg: Kéo thử bằng hai chiếc nĩa — thớ tách ra dễ là vớt được rồi!
  - title: Xé rồi giã cho tơi
    icon: spoon
    minutes: 20 phút
    bullets:
      - text: >-
          Dùng hai chiếc nĩa hoặc tay **xé dọc thớ** thành sợi nhỏ nhất có
          thể. Kiên nhẫn ở bước này thì bước rang nhàn hẳn.
      - label: "Giã cho tướp:"
        text: >-
          Cho từng nắm thịt đã xé vào cối, **giã nhẹ tay** (hoặc dùng cán bột
          lăn qua lăn lại) cho sợi tướp ra và mềm. Giã mạnh là nát thành bột.
      - text: >-
          Giã xong xé lại lần nữa những sợi còn to. Tới lúc này khối thịt nhìn
          đã tơi và bông lên.
    callout:
      type: tip
      text: >-
        Có máy trộn bột thì dùng **que trộn hình mái chèo, để số chậm nhất,
        chừng 1–2 phút** — thịt tự tướp ra thành sợi. Đừng dùng máy xay: lưỡi
        xay cắt ngang sợi và cho ra bột thịt.
  - title: Rang chảo — lửa nhỏ nhất, đảo liên tục
    icon: flame
    minutes: 50 phút
    intro: "Bước dài nhất, và là bước làm nên mẻ chà bông:"
    bullets:
      - text: >-
          Xoa một lớp dầu thật mỏng vào chảo đáy dày, trút thịt vào, để **lửa
          nhỏ nhất**.
      - text: >-
          Đảo **liên tục** bằng đũa hoặc xẻng gỗ, dàn mỏng ra rồi gom lại,
          lặp đi lặp lại. Đừng để yên quá mười giây, chỗ chạm chảo sẽ sém.
      - label: "Dấu hiệu tới:"
        text: >-
          Sau **40–50 phút**, sợi thịt **xoăn lại, ngả vàng nâu, rời hẳn ra
          từng sợi** và bốc một nắm thấy nhẹ bẫng. Bóp thử một nhúm: tơi ra
          ngay, không vón.
      - text: >-
          Nếm thử — nhạt thì rắc thêm chút muối mịn ở phút cuối, đảo đều rồi
          tắt.
    callout:
      type: warn
      text: >-
        Lửa lớn cho nhanh là hỏng chắc chắn: mặt ngoài sợi cháy sém và đắng
        trong khi bên trong vẫn còn ẩm. Ẩm còn sót là hũ chà bông sẽ chua và
        mốc trong tuần đầu.
    timer:
      secs: 2700
      label: Hẹn giờ rang · 45:00
      doneMsg: Bốc một nắm — nhẹ bẫng và tơi rời là xong!
  - title: Để nguội hẳn rồi mới vô hũ
    icon: jar
    minutes: 20 phút
    bullets:
      - text: >-
          Trải chà bông ra mâm rộng thành lớp mỏng, để nguội **hoàn toàn** ở
          nơi thoáng. Sờ tay thấy mát hẳn mới được.
      - text: >-
          Cho vào **hũ thủy tinh khô ráo tuyệt đối**, đậy kín. Một hũ nhỏ là
          vừa hết chỗ thịt ban đầu — 600 g thịt ra chừng [[200|g]] chà bông.
      - text: >-
          Cất nơi khô mát. Muốn để lâu hơn nữa thì bỏ ngăn mát tủ lạnh.
    doneText: Đậy nắp hũ — xong, và dùng được cả tháng!

tipsTitle: 6 bí quyết cho **sợi tơi, không vụn, không mốc**
tipsLead: >-
  Chà bông hỏng theo bốn kiểu: vụn như bột, dai như dây, cháy sém, và mốc sau
  vài ngày. Sáu điều dưới đây chặn hết.
tips:
  - icon: knife
    title: Thái dọc thớ ngay từ đầu
    text: >-
      Đây là quyết định sớm nhất và không sửa lại được. Thái dọc thớ thì sợi
      chà bông dài và bông; thái ngang thớ thì dù xé kỹ tới đâu cũng chỉ ra
      vụn ngắn. Nhìn kỹ miếng thịt tìm hướng vân trước khi hạ dao.
  - icon: meat
    title: Lọc sạch gân và mỡ, không chừa sợi nào
    text: >-
      Gân gặp nhiệt thì co lại thành cục dai, nằm lẫn trong hũ chà bông rất
      khó chịu. Mỡ thì làm sợi bết và mau ôi. Bỏ thêm năm phút ở khâu lọc là
      đáng.
  - icon: drop
    title: Luộc nước xâm xấp, đừng ngập nhiều
    text: >-
      Nước nhiều thì vị ướp trôi hết ra nồi, thịt luộc xong nhạt thếch. Xâm
      xấp mặt thịt và để cạn dần tới cuối là vị ở lại trong thớ.
  - icon: flame
    title: Rang lửa nhỏ nhất, không có đường tắt
    text: >-
      Bốn mươi phút là bốn mươi phút. Đây là chỗ duy nhất của món không rút
      ngắn được, và cũng là chỗ phân biệt hũ chà bông nhà làm với thứ rang
      vội — sợi tơi hay không nằm ở đây.
  - icon: bulb
    title: Muốn nhanh hơn thì sấy lò, không phải tăng lửa
    text: >-
      Rang chảo chừng 20 phút cho ráo mặt, rồi trải mỏng ra khay và **sấy lò
      [[120|độ C]] chừng 25 phút**, cứ 10 phút đảo một lần. Nhiệt đều từ mọi
      phía nên sợi khô đồng loạt, khỏi phải đứng đảo.
  - icon: jar
    title: Hũ phải khô tuyệt đối và chà bông phải nguội hẳn
    text: >-
      Một giọt nước trong hũ hay chút hơi ấm còn sót là đủ cho mốc mọc. Tráng
      hũ nước sôi rồi **úp cho khô hẳn** (hoặc sấy lò), và trải chà bông ra
      mâm cho nguội hoàn toàn.

serve:
  title: Hũ chà bông — **thứ cứu bữa sáng của cả nhà**
  paras:
    - >-
      Chà bông không phải món dọn ra dĩa mà là thứ để sẵn trong hũ, xúc ra khi
      cần. Rắc lên chén cháo trắng, nhét vào ổ bánh mì với chút bơ, ăn với xôi
      hay cơm nóng, cuốn bánh tráng cùng rau sống — chỗ nào cần một chút mặn
      và thơm là dùng được.
    - >-
      Nhà có con nhỏ thì hũ này rất được việc: mặn nhẹ, sợi mềm, không xương
      không gân. Rắc lên chén cháo hoặc cơm nát là bé ăn hết chén. Muốn làm
      riêng cho bé thì giảm nước mắm xuống một nửa và bỏ tiêu.
  aside:
    title: Ăn với gì
    intro: "Bốn cách dùng quen nhất:"
    items:
      - icon: rice
        text: "**Cháo trắng hoặc cơm nóng** — rắc một nhúm lên mặt là xong bữa sáng."
      - icon: bread
        text: "**Bánh mì phết bơ** — bơ giữ cho sợi chà bông bám vào ruột bánh."
      - icon: rice
        text: "**Xôi trắng** — thêm chút mỡ hành nữa là thành gói xôi hàng."
      - icon: roll
        text: "**Cuốn bánh tráng** — với rau sống và dưa leo, chấm mắm chua ngọt."

faq:
  - q: "\"Ruốc\" và \"chà bông\" có phải một thứ không?"
    a: >-
      Đúng là một thứ — miền Bắc gọi **ruốc**, miền Nam gọi **chà bông**.
      Nhưng cẩn thận: ở miền Trung và miền Nam, chữ **"mắm ruốc"** lại chỉ một
      thứ hoàn toàn khác — thứ mắm sệt màu tím nâu làm từ con ruốc (loài tôm
      rất nhỏ). Hai thứ không liên quan gì tới nhau, chỉ trùng tên.
  - q: Làm bằng ức gà hay cá được không?
    a: >-
      Được cả hai. **Ức gà** làm y hệt, sợi trắng và mềm hơn, thời gian luộc
      ngắn hơn chừng 10 phút. **Cá** (cá lóc, cá hồi, cá thu) thì hấp chín
      thay vì luộc, gỡ bỏ thật kỹ xương rồi rang — sợi sẽ ngắn và bông hơn,
      và chỉ để được chừng 2 tuần chứ không lâu bằng chà bông heo.
  - q: Chà bông bị vụn như bột, sai ở đâu?
    a: >-
      Hai chỗ: **thái ngang thớ** hoặc **giã quá mạnh**. Cũng có thể do luộc
      quá lâu làm thịt bở. Mẻ đã vụn thì vẫn ăn ngon, cứ dùng để rắc cháo. Lần
      sau nhìn kỹ hướng thớ, và giã thì chỉ dằn nhẹ cho tướp chứ không nện.
  - q: Sợi bị dai và cứng thì sao?
    a: >-
      Ngược lại với vụn: thịt **luộc chưa đủ mềm**, hoặc còn sót gân. Nếu phát
      hiện lúc đang rang thì vẩy vào chảo hai thìa nước luộc, đậy nắp om 5
      phút cho mềm rồi rang tiếp. Phát hiện lúc đã xong thì đành chịu.
  - q: Để được bao lâu?
    a: >-
      Hũ kín để nơi khô mát: **2–3 tuần**. Cất ngăn mát: **1–2 tháng**. Cấp
      đông: **chừng 3 tháng**, rã đông ở nhiệt độ phòng rồi hong lại trên chảo
      cho thơm. Mỗi lần lấy thì dùng **muỗng khô**, đừng thò tay hay dùng muỗng
      ướt.
  - q: Chà bông bị ỉu mềm sau vài ngày, cứu được không?
    a: >-
      Được, và dễ. Trải ra chảo **rang lại lửa nhỏ 5–10 phút** cho khô, để
      nguội hẳn rồi cất vào hũ khác đã sấy khô. Nguyên nhân gần như luôn là
      hũ chưa khô hoặc nắp đậy không kín.

