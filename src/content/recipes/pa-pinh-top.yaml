title: Pa pỉnh tộp **cá nướng gập, kẹp tre**
summary: >-
  Tiếng Thái, **"pa pỉnh tộp" nghĩa là cá nướng gập**. Con cá mổ dọc sống lưng
  chứ không mổ bụng, nhồi đầy sả gừng rau thơm và **mắc khén** — hạt rừng Tây
  Bắc thơm nồng, ăn vào tê nhẹ đầu lưỡi — rồi gập úp lại, kẹp hai thanh tre đem
  nướng than.
region: Tây Bắc
category: Nướng
occasions: [Đãi khách, Nhậu lai rai]
