flavorNote: >-
  **Chuẩn con cá:** da vàng sém và khô ráo, gỡ ra thấy thịt trắng chắc; mùi sả
  gừng xộc lên trước, mắc khén để lại cái **tê nhẹ ở đầu lưỡi** sau cùng.
storyEyebrow: Chuyện món ăn
storyTitle: Ba chữ, ba việc — và món **đãi khách quý** của người Thái
story:
  - >-
    Tên món nói đúng cách làm. Tiếng Thái, **"pa" là cá suối, "pỉnh" là nướng,
    "tộp" là gập úp lại** — ghép lại thành "cá nướng gập". Hiếm có món nào mà
    đọc tên xong là biết phải làm gì như vậy.
  - >-
    Chỗ tinh của món nằm ở **đường dao dọc sống lưng**. Mổ bụng như thói quen
    thì con cá thành hai mảnh phẳng, gia vị nhồi vào sẽ rơi ra hết khi gặp lửa.
    Xẻ dọc lưng thì con cá mở ra như quyển sách mà **bụng vẫn liền**, gập lại là
    thành một cái túi kín — nhân nằm yên bên trong, thấm ngược vào thịt suốt
    thời gian nướng.
  - >-
    Nhân ấy gần như là cả một rổ rau: sả, gừng, hành, tỏi, ớt, mùi tàu, thì là,
    húng — và **mắc khén**, hạt của một loài cây rừng Tây Bắc, rang lên rồi giã.
    Mắc khén không cay theo kiểu ớt; nó thơm nồng và để lại cảm giác **tê nhẹ ở
    đầu lưỡi**, giống hạt sẻn. Chính nó làm người ta nhận ra ngay đây là món của
    vùng cao chứ không phải cá nướng miền xuôi.
  - >-
    Trong nhà người Thái, pa pỉnh tộp là món dọn khi có **khách quý**. Có hẳn
    một câu nói lưu truyền trong vùng, đại ý rằng đem gà tới biếu cũng không quý
    bằng đem cho nhau con pa pỉnh tộp. Dịp Tết, nhiều nhà còn làm để đặt lên bàn
    thờ. Cá nướng xong ăn cùng **xôi nếp nóng và rau luộc** — không có cơm
    trắng, không có nước chấm cầu kỳ, vì bản thân con cá đã đủ đậm.

