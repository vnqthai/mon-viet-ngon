quick:
  ingredients:
    - Cá chép hoặc cá trắm, cá trôi [[1|con]] cỡ [[800|g]] — đánh sạch vảy
    - "Nhồi bụng: sả [[3|cây]] · gừng [[1|nhánh]] · hành lá [[1|bó]] · rau thơm (mùi tàu, thì là, húng) [[1|nắm]]"
    - Mắc khén [[1|muỗng canh|frac]] — rang thơm rồi giã; không có thì dùng hạt sẻn
    - "Nêm: tỏi băm [[1|muỗng canh|frac]] · ớt tươi [[3|trái]] · muối [[1|muỗng cà phê|frac]]"
    - Hai thanh tre chẻ đôi + lạt buộc — hoặc một cái vỉ nướng kẹp
    - "Ăn kèm: xôi nếp nóng · rau cải luộc"
  steps:
    - Đánh vảy, **mổ dọc sống lưng** từ đầu tới đuôi, giữ nguyên bụng cá.
    - Băm nhỏ sả gừng tỏi ớt rau thơm, trộn với mắc khén giã và muối.
    - Nhồi một nửa vào trong thân cá, một nửa xát đều mặt ngoài. Ướp **30 phút**.
    - >-
      **Gập đôi con cá** cho đầu chạm đuôi, kẹp giữa hai thanh tre, buộc lạt hai đầu.
    - Nướng than hoa lửa vừa **25–30 phút**, trở đều tay tới khi da vàng sém.
  warning: >-
    Mổ bụng là hỏng cả món — bụng cá rách thì **gập lại không giữ được nhân**,
    gia vị chảy hết xuống than. Đường dao phải đi **dọc sống lưng**, và chỉ xẻ
    tới xương chứ đừng cắt đứt đôi con cá.

