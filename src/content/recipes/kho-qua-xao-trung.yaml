flavorNote: >-
  **Chuẩn dĩa xào:** lát khổ qua **còn giòn và xanh, chỉ hơi trong ở mép**,
  đắng dịu chứ không gắt; trứng **bám thành lớp áo mềm quanh từng lát** chứ
  không nằm rời thành từng mảng. Dĩa khô ráo, không đọng nước.
storyEyebrow: Chuyện dĩa xào
storyTitle: Món cứu bữa **của mọi căn bếp**
story:
  - >-
    Có những món sinh ra để cứu bữa cơm chiều: trong tủ lạnh còn vài trái khổ
    qua với chục trứng, mười lăm phút sau đã có dĩa nóng đưa cơm. Khổ qua xào
    trứng là món kiểu đó — không cầu kỳ, không tốn kém, mà nhà nào cũng nấu và
    nhà nào cũng ăn hết.
  - >-
    Cặp đôi này hợp nhau vì lý do rất rõ ràng: **trứng béo và ngậy, khổ qua
    đắng và giòn** — hai vị đối nhau nên đứng cạnh nhau là cân. Trứng bọc quanh
    lát khổ qua còn làm cái đắng dịu hẳn xuống, nên đây thường là món đầu tiên
    người sợ đắng chịu ăn.
  - >-
    Mà cái đắng của khổ qua thì **gia giảm được**, không phải chịu trận. Nạo
    sạch cùi trắng, thái mỏng, ngâm nước đá muối — ba việc nhỏ đó kéo độ đắng
    xuống rõ rệt. Nhà nào ghiền đắng thì bỏ bớt vài bước, còn nhà có con nít
    thì làm đủ cả ba.

