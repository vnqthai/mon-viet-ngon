heroEyebrow: Hai thứ trong tủ lạnh là ra một bữa…

quick:
  ingredients:
    - Khổ qua [[3|trái]] — chọn trái **gai nở to, xanh nhạt** cho đỡ đắng
    - Trứng gà [[4|quả]] — đánh tan với chút tiêu và nước mắm
    - Tỏi [[4|tép]] băm · hành lá [[2|cọng]]
    - "Nêm: nước mắm [[1|muỗng canh]] · đường [[0.5|muỗng cà phê|frac]] · tiêu"
    - Muối hạt + đá viên — để ngâm khổ qua
  steps:
    - Bổ dọc khổ qua, **nạo kiệt hột và lớp cùi trắng** — đó mới là chỗ đắng gắt, không phải vỏ xanh.
    - Thái lát **mỏng chừng [[3|mm]]**, ngâm vào tô **nước đá pha muối hạt [[10|phút]]**, rồi vắt nhẹ cho ráo.
    - Đánh trứng vừa tan, nêm chút tiêu và **[[0.5|muỗng cà phê|frac]] nước mắm** — đừng đánh bông.
    - Chảo nóng già, phi thơm tỏi, cho khổ qua vào **xào lửa lớn 2 phút** tới khi lát chuyển hơi trong.
    - Nêm nước mắm và đường, đảo đều.
    - >-
      **Dồn khổ qua sang một bên**, rót trứng vào khoảng trống, để yên 10 giây
      cho trứng se rồi mới đảo trộn.
    - Đảo thêm 30 giây cho trứng bám quanh lát khổ qua, rắc hành lá, tắt bếp.
  warning: >-
    Đổ trứng lên khắp mặt chảo rồi đảo ngay là ra một dĩa **trứng vụn lẫn khổ
    qua**, hai thứ rời nhau. Dồn rau sang một bên, rót trứng vào chỗ trống, chờ
    trứng se rồi mới trộn — trứng mới bám thành áo quanh từng lát.

