title: Khổ qua xào trứng **đắng dịu, trứng bám đều từng lát**
summary: >-
  Khổ qua thái lát mỏng ngâm nước đá cho bớt đắng gắt, xào lửa lớn tới khi vừa
  trong, rồi **rót trứng đánh vào đảo nhanh** cho bám quanh từng lát — món
  hai nguyên liệu, mười lăm phút, mà đưa cơm lạ lùng.
