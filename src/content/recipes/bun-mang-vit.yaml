flavorNote: >-
  **Chuẩn tô:** nước dùng **trong, ngọt hậu mùi vịt** chứ không béo ngậy; sợi
  măng nâu óng, cắn nghe **giòn sần sật**; miếng vịt chấm mắm gừng thì cay ấm
  dậy lên, át hết cái mùi nồng vốn có của con vịt.
storyEyebrow: Chuyện món ăn
storyTitle: Món sinh ra từ **một nồi nước không ai nỡ đổ**
story:
  - >-
    Bún măng vịt là kiểu món của người biết tiếc. Luộc con vịt xong, nồi nước
    ngọt lừ ấy đổ đi thì phí, mà húp không thì nhạt — thả nắm **măng khô** dành
    từ mùa trước vào, thế là thành nồi bún. Ngoài Bắc gọi lối nấu này là **vịt
    xáo măng**, có trước cả khi nó được chan vào tô bún bán ngoài hàng.
  - >-
    Măng khô mới là chỗ đáng nói. Măng tươi bẻ về chỉ có theo mùa, nên người ta
    luộc rồi phơi để dành ăn dần cả năm — phơi xong sợi măng quắt lại, ngả nâu
    hổ phách, và **đổi hẳn tính**: nó thôi mọng nước, sợi quắt lại thành **dai
    giòn**, lại hút nước dùng như miếng bọt biển. Đó là lý do măng khô nấu vịt
    ngon hơn măng tươi, dù măng tươi nhanh hơn nhiều.
  - >-
    Vô tới miền Nam, món này được sửa lại cho hợp miệng: nhiều hàng đổi sang
    **măng tươi hoặc măng chua**, nước nêm ngọt hơn, bún dùng sợi nhỏ. Nhưng có
    một thứ đi theo món suốt từ Bắc vô Nam mà không ai dám bỏ — **chén nước mắm
    gừng**. Thịt vịt có mùi riêng khá nồng; gừng giã với tỏi ớt và đường là thứ
    duy nhất trị được nó mà vẫn để nguyên vị ngọt của thịt.
  - >-
    Công thức dưới đây nấu lối Bắc — măng khô, nước trong, nêm nhạt tay — vì đó
    là bản gốc, và vì nồi nước trong thì ai muốn nêm đậm hơn vẫn nêm được ở tô.

