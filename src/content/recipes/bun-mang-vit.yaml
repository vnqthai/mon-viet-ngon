quick:
  ingredients:
    - Vịt [[1|con]] chừng 1,8 kg — chặt đôi cho vừa nồi
    - Măng khô [[150|g]] — ngâm nước vo gạo **qua đêm**, luộc 3 nước
    - Bún tươi sợi nhỏ [[800|g]] · hành tím [[5|củ]] · gừng [[1|củ]]
    - "Khử mùi vịt: gừng giã + muối hột + rượu trắng [[2|muỗng canh|frac]]"
    - "Mắm gừng: gừng [[1|nhánh]] · tỏi [[3|tép]] · ớt · đường · nước mắm · chanh"
    - "Dọn kèm: rau mùi tàu, hành lá, giá, bắp chuối bào"
  steps:
    - Chà vịt bằng **gừng giã + muối hột + rượu**, xả sạch — bước không được bỏ.
    - Ngâm măng qua đêm, luộc **3 nước**, mỗi nước mở vung, rồi xé sợi.
    - Luộc vịt với hành gừng nướng, nước **lăn tăn** thôi, 35 phút. Vớt vịt ra.
    - Xào măng với mỡ vịt vớt trên nồi, nêm mắm, rồi trút ngược vào nồi nước.
    - Chặt vịt, trụng bún, chan nước nóng. Mắm gừng **giã cối**, dọn chén riêng.
  warning: >-
    Măng khô luộc chưa tới là **đắng và ngứa lưỡi**, mà nấu rồi thì không chữa
    được. Luộc đủ 3 nước, nước nào cũng mở vung, tới khi cắn thấy mềm mới thôi.

flavor:
  chua: 1
  ngot: 6
  man: 6
  cay: 2
