title: Bún măng vịt **măng khô nâu óng, chén mắm gừng bên cạnh**
summary: >-
  Nồi nước luộc vịt để nguyên làm nước dùng, thả **măng khô đã xào mỡ vịt** cho
  ngấm — nước trong mà đậm. Miếng vịt chặt xếp riêng, chấm **mắm gừng giã tay**;
  thiếu chén mắm đó là tô bún hụt hẳn một nửa.
region: Miền Bắc
category: Món nước
occasions: [Cơm nhà, Đãi khách]
pubDate: 2026-07-31
