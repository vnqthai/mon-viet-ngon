title: Bánh giầy **hai miếng trắng dẻo kẹp lát giò lụa**
summary: >-
  Bột nếp nhào nước ấm, vo tròn rồi ấn dẹt thành miếng bằng lòng bàn tay, hấp
  mười lăm phút là trong và dẻo. Kẹp một lát giò lụa vào giữa hai miếng — thành
  cặp bánh giầy giò, thứ quà sáng cầm tay ăn dọc đường.
region: Miền Bắc
category: Bánh
occasions: [Bữa sáng, Ăn chơi]
pubDate: 2026-08-01
time:
  total: 50 phút
  active: 35 phút
servingsBase: 4
difficulty: Vừa
