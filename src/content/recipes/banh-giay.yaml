heroEyebrow: Gánh hàng đầu ngõ, bảy giờ sáng…

quick:
  ingredients:
    - Bột nếp [[300|g]] · bột gạo tẻ [[30|g]] — trộn chung
    - Nước ấm khoảng 70 °C [[220|ml]] · muối [[1|muỗng cà phê|frac]]
    - Dầu ăn [[1|muỗng canh]] — nhào vào bột cho mặt bánh mịn
    - Giò lụa [[300|g]] — thái lát dày cỡ nửa phân
    - Lá chuối — lót xửng và lót từng miếng bánh
  steps:
    - >-
      Trộn bột nếp với bột gạo và muối, rót **nước ấm** từ từ, nhào tới khi bột
      dẻo mịn, không dính tay.
    - Ủ bột **15 phút** cho nghỉ, rồi nhào lại một lượt ngắn.
    - Chia bột thành viên bằng quả trứng gà, vo tròn rồi **ấn dẹt** dày 1 cm.
    - >-
      Xếp lên lá chuối đã phết dầu, hấp **12–15 phút** tới khi mặt bánh trong
      và bóng.
    - Để nguội bớt, kẹp lát giò lụa vào giữa hai miếng.
  warning: >-
    Nhào bằng **nước lạnh** thì bột không kết dính, nặn ra miếng nào cũng nứt
    mép và hấp xong thì bở. Nước phải ấm già — chạm vào thấy nóng nhưng chưa
    tới mức rụt tay.

flavor:
  chua: 0
