storyEyebrow: Chuyện món ăn
storyTitle: Món ăn nguội — và đó là **chủ ý**, không phải cho tiện
story:
  - >-
    Bún ốc nguội là quà chiều Hà Nội cũ, từng gần như biến mất rồi được dựng lại
    từ sách vở và trí nhớ người già. Có nhà văn xưa từng viết rằng món này đạt
    tới chỗ tinh vi nhất trong cách ăn của người Hà Nội — nghe thì to tát, nhưng
    ăn một lần là hiểu vì sao: cả món chỉ có ba thứ bày rời nhau, không thứ nào
    che cho thứ nào.
  - >-
    Thứ làm nên món là **nước để nguội hẳn**, và nguội là chủ ý chứ không phải
    cho tiện bán: để nguội thì vị đi chậm lại, cái chua của giấm bỗng tách hẳn
    ra khỏi cái ngọt của nước ốc, và mùi men nếp hiện rõ lên. Món này ăn bằng
    lưỡi chứ không bằng mũi.
  - >-
    Bún cũng khác. Không phải **bún rối** — thứ bún xới tơi vào tô mà ta gặp ở
    mọi tô bún nước — mà là **bún lá**: sợi bún được vắt lại thành từng **miếng
    tròn dẹt như chiếc lá**, mỗi miếng gọi là một *vắt bún*, bày trên tấm lá
    chuối xanh. Miếng bún nguội, se mặt, chấm vào nước thì chỉ thấm ở ngoài,
    cắn vào vẫn còn phần khô. Đó là lý do không được chan.
  - >-
    Cách ăn cũng có nếp riêng: dùng **gai bưởi** khều từng con ốc thả vào bát
    con, múc nước bằng **thìa gỗ**. Thìa kim loại làm bát nước **tanh** đi thấy
    rõ — chi tiết nghe như chuyện vẽ vời, nhưng thử hai thìa cạnh nhau thì nhận
    ra ngay.

