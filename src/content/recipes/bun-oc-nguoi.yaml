steps:
  - title: Ngâm và luộc ốc
    icon: drop
    minutes: 25 phút
    intro: "Làm từ tối hôm trước, khâu này không rút ngắn được:"
    bullets:
      - label: "Ngâm:"
        text: >-
          Ốc thả chậu nước vo gạo ngập mặt, đập dập [[3|trái]] ớt và rót chút
          giấm bỗng vào. Ngâm **qua đêm**, thay nước một lần. Sáng ra đáy chậu
          phải có lớp cát bùn.
      - label: "Luộc:"
        text: >-
          Cho ốc vào nồi với [[250|ml]] nước và [[100|ml]] rượu nếp trắng. Đun
          sôi thì **mở vung**, hạ lửa, rồi lại vặn lớn — tới khi con ốc **há mày
          bung ra** là chín tới, vớt ngay.
      - label: "Khều:"
        text: >-
          Khều ruột ốc, **bỏ phần đuôi đen** ở cuối. Bóp với chút muối và giấm,
          xả sạch, để ráo rồi cất ngăn mát.
      - label: "Lọc nước:"
        text: >-
          Nước luộc để lắng, gạn phần trong rồi lọc qua rây lót khăn xô. Giữ lại.
    timer:
      secs: 240
      label: Hẹn giờ luộc ốc · 04:00
      doneMsg: Ốc há mày bung ra là vớt liền nghen!
    callout:
      type: warn
      text: >-
        Luộc quá tay là con ốc **dai như cao su**. Ở món này còn tệ hơn ở bát
        nóng, vì ốc ăn nguội nên cái dai lộ ra rõ hơn nhiều — không có hơi nóng
        nào che giúp.
  - title: Ninh xương, dựng bát nước
    icon: pot
    minutes: 70 phút
    bullets:
      - label: "Ninh xương:"
        text: >-
          Xương heo chần qua nước sôi, xả sạch, ninh với [[1.5|lít]] nước lạnh
          **nhỏ lửa 1 tiếng**, hớt bọt. Lọc lấy nước trong.
      - label: "Trộn hai thứ nước:"
        text: >-
          Đổ nước luộc ốc đã lọc vào nồi nước xương. Đây là chỗ bát nước vừa có
          chất vừa có mùi ốc — thiếu một trong hai đều hụt.
      - label: "Chua và nêm:"
        text: >-
          Rót **giấm bỗng** vào từ từ, nếm sau mỗi lần rót. Nêm [[2|muỗng
          canh|frac]] nước mắm, chút muối và đường. Đun sôi lại rồi **tắt bếp**.
      - label: "Để nguội:"
        text: >-
          Để nguội hẳn ở nhiệt độ phòng, ít nhất [[2|tiếng]]. **Nếm lại sau khi
          nguội** rồi mới chỉnh — nguội đi thì vị mặn nổi lên và vị ngọt lùi
          xuống, nêm lúc nóng gần như luôn bị mặn.
    callout:
      type: warn
      text: >-
        Đừng cho vào tủ lạnh cho nhanh nguội. Lạnh quá thì mỡ đóng váng trắng và
        mùi men của bỗng cụp hẳn xuống. Món tên là **nguội**, không phải lạnh —
        để ngoài cho tự xuống nhiệt là đúng.
  - title: Chưng ớt
    icon: flame
    minutes: 10 phút
    bullets:
      - label: "Phi hành:"
        text: >-
          Đun [[4|muỗng canh|frac]] mỡ heo, phi hành khô thái lát tới **vàng
          thơm** thì vớt hành ra để riêng.
      - label: "Chưng ớt:"
        text: >-
          Hạ lửa thật nhỏ, cho [[3|muỗng canh|frac]] ớt bột vào khuấy đều, đun
          liu riu chừng [[2|phút]] tới khi mỡ chuyển đỏ cam thì tắt bếp ngay.
      - text: >-
          Múc một hai thìa ớt chưng thả vào bát nước đã nguội — váng đỏ nổi lên
          mặt, đó là thứ đầu tiên người ta nhìn thấy của món này.
    callout:
      type: tip
      text: >-
        Chưng dư một hũ để ngăn mát. Ớt chưng để được cả tháng và dùng được cho
        cả bún ốc nóng lẫn bún riêu — chưng một lần dùng nhiều bữa.
  - title: Bày mâm
    icon: plate
    minutes: 10 phút
    intro: "Bày rời từng thứ, đó là hình thức của món:"
    bullets:
      - text: >-
          Lót **lá chuối** lên đĩa hoặc mẹt, xếp các miếng bún lá lên trên, để
          nguyên miếng chứ đừng gỡ tơi.
      - text: >-
          Ốc để một đĩa nhỏ riêng. Bát nước nguội có váng ớt chưng đặt cạnh, kèm
          **gai bưởi** và **thìa gỗ**.
      - text: >-
          Ăn: khều một con ốc thả vào bát con của mình, múc thìa nước chan lên,
          rồi gắp miếng bún **chấm** vào. Không chan nước vào bún.
    doneText: Xong — ngồi xuống ăn chậm thôi!

tipsTitle: 4 chỗ **quyết định** mâm bún ốc nguội
tips:
  - icon: spoon
    title: Thìa gỗ, đừng thìa kim loại
    text: >-
      Nghe như chuyện vẽ vời cho có vẻ cổ, nhưng thử hai thìa cạnh nhau thì nhận
      ra ngay: kim loại chạm nước ốc nguội làm **dậy vị tanh** ở đầu lưỡi, còn
      thìa gỗ hay thìa sứ thì không. Bát nóng không bị vì hơi nóng át đi, bát
      nguội thì lộ.
  - icon: clock
    title: Nếm lại sau khi nguội, đừng tin lưỡi lúc nóng
    text: >-
      Nước nóng làm vị mặn chìm xuống và vị ngọt nổi lên, nên nêm lúc nóng thì
      nguội đi gần như luôn **mặn hơn ý muốn**. Nêm hơi nhạt lúc còn nóng, để
      nguội hẳn rồi mới chỉnh lần cuối — đây là lý do món này cần hai tiếng chờ.
  - icon: noodle
    title: Bún phải để nguyên miếng và để se mặt
    text: >-
      Miếng bún gỡ tơi ra thì chấm vào là **sũng nước** ngay, ăn nhão nhoét. Để
      nguyên miếng, để ngoài cho se mặt chừng 15 phút, lúc chấm chỉ ướt ở ngoài
      còn trong vẫn khô — đó mới ra cái nhịp cắn của món.
  - icon: bottle
    title: Chọn mẻ giấm bỗng thơm, đừng chọn mẻ chua nhất
    text: >-
      Bát nước này gọn trong ba thứ — bỗng, nước ốc và nước xương — nên mẻ bỗng
      thế nào thì bát nước y như vậy. Ngửi thử trước khi mua: phải **thơm nhẹ
      mùi men**, chua vừa phải. Gắt là để lại.

serve:
  title: Quà chiều — **ăn chậm mới ra món**
  paras:
    - >-
      Đây là món để nhâm nhi. Một mâm bún ốc nguội cho bốn người ăn hết chừng
      nửa tiếng, mà nửa tiếng đó phần lớn là ngồi khều ốc và nói chuyện — cái
      thú của món nằm đúng ở nhịp chậm đó.
    - >-
      Món hợp buổi chiều muộn, trời oi. Bát nước nguội, miếng bún nguội, con ốc
      lạnh trong ngăn mát lấy ra — cả mâm không có gì bốc khói, mà ăn xong thấy
      mát miệng.
  aside:
    title: Trên mâm nên có
    intro: "Ba thứ nhỏ mà thiếu là mất nếp ăn:"
    items:
      - icon: knife
        text: "**Gai bưởi hoặc tăm nhọn** — mỗi người một cái, tự khều lấy mà ăn."
      - icon: spoon
        text: "**Thìa gỗ** — múc nước, tuyệt đối tránh thìa kim loại."
      - icon: herb
        text: "**Lá chuối lót** — bún đặt lên đó thì không bết và trông ra món."

faq:
  - q: Ăn nguội thì có nhạt miệng không?
    a: >-
      Ngược lại — để nguội mới là lúc vị **rõ nhất**. Nóng thì mùi bốc lên trước
      và lưỡi chỉ kịp bắt cái chua với cái cay; nguội thì từng tầng tách ra:
      chua của bỗng, ngọt của nước ốc, béo của mỡ trong ớt chưng. Chỉ cần nêm
      cho đủ đậm **sau khi đã nguội hẳn**, đừng tin lưỡi lúc còn nóng.
  - q: Không mua được bún lá thì sao?
    a: >-
      Mua bún rối rồi tự vắt: lấy từng nắm nhỏ cỡ hai ngón tay, ép nhẹ cho dẹt
      lại, đặt lên lá chuối và để ngoài chừng [[15|phút]] cho **se mặt**. Không
      đẹp bằng bún vắt sẵn nhưng ăn thì đúng, vì chỗ cần là bún khô ráo và
      thành từng phần rời.
  - q: Để nguội cả tiếng thì có sợ hỏng không?
    a: >-
      Nước đã đun sôi rồi để nguội ở nhiệt độ phòng trong hai tiếng thì bình
      thường, đây là cách món này vẫn được bán. Nhưng nấu xong nên ăn **trong
      ngày**; nếu để qua đêm thì cất ngăn mát rồi lấy ra trước bữa chừng một
      tiếng cho về lại nhiệt độ phòng — ăn lạnh buốt là sai vị.
  - q: Có cho mắm tôm không?
    a: >-
      Bản cổ điển **không có**. Bát nước đã đủ chua, mặn và thơm men rồi; thêm
      mắm tôm là át hết mùi bỗng — mà mùi bỗng chính là lý do món tồn tại. Ai
      quen ăn đậm thì để một chén nhỏ bên ngoài, đừng cho vào bát chung.

ticker:
