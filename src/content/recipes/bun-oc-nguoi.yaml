title: Bún ốc nguội **bún lá chấm bát nước để nguội**
summary: >-
  Quà chiều Hà Nội cũ: **bát nước ốc để nguội hẳn**, chua dịu thơm men nếp, mặt
  nổi váng ớt chưng đỏ cam; bún vắt thành từng miếng bày riêng trên lá chuối.
  Khều một con ốc, chấm một thìa nước, ăn nhẩn nha cả buổi chiều.
