quick:
  ingredients:
    - Ốc mít cỡ vừa [[1.2|kg]] — ngâm nước vo gạo + ớt **qua đêm**
    - Giấm bỗng [[150|ml]] — **bã nếp còn lại sau khi cất rượu**, chua dịu và
      thoảng mùi men
    - Xương heo [[400|g]] — ninh lấy nước, trộn với nước luộc ốc
    - Bún lá [[600|g]] — **bún vắt sẵn thành từng miếng tròn dẹt như chiếc lá**;
      bày trên lá chuối, để nguyên miếng
    - "Ớt chưng: hành khô + mỡ heo + ớt bột [[3|muỗng canh|frac]]"
    - "Dọn kèm: gai bưởi hoặc tăm nhọn · thìa gỗ · vài lá chuối lót"
  steps:
    - Ngâm ốc qua đêm, luộc **vừa há mày là vớt**, khều ruột, bỏ đuôi đen.
    - Ninh xương lấy nước trong, trộn với nước luộc ốc đã lọc kỹ.
    - Rót giấm bỗng vào, nêm nhạt, đun sôi rồi **tắt bếp để nguội hẳn**.
    - Chưng ớt với mỡ và hành khô, thả vào bát nước cho nổi váng đỏ.
    - Bày ốc ra đĩa, bún lá trên lá chuối, bát nước bên cạnh — chấm mà ăn.
  warning: >-
    **Đừng chan.** Chan nước vào bún là miếng bún nở bã ra và bát nước loãng đi,
    mất sạch cái gọn gàng của món. Bún để riêng, chấm tới đâu ăn tới đó.

