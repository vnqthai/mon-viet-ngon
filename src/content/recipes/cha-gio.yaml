title: Chả giò tôm thịt **giòn rụm tới cuốn cuối cùng**
summary: >-
  Vỏ vàng ruộm **nổ giòn rôm rốp**, nhân tôm thịt khoai môn bùi béo đúng kiểu
  Nam Bộ — món "linh hồn mâm tiệc" mà bí quyết chiên hai lần giúp cuốn nào
  cũng giòn, nguội rồi vẫn giòn.
region: Miền Nam
category: Chiên
time:
  total: 1 giờ 15 phút
servingsBase: 4
difficulty: Vừa
featured: false
order: 12
art: cha-gio
heroEyebrow: Nhà có tiệc là có chả giò…

quick:
  ingredients:
    - Thịt heo xay [[400|g]] (nạc dăm) · tôm [[200|g]] băm thô
    - Khoai môn [[200|g]] bào sợi — chữ ký Nam Bộ · cà rốt [[1|củ]] bào sợi
    - Nấm mèo [[4|tai]] ngâm nở băm nhỏ · hành tím [[3|củ]] · trứng [[1|trái]] (lấy lòng đỏ)
    - Bánh tráng chả giò [[24|cái]] (loại dai chuyên cuốn chiên)
    - "Nêm nhân: hạt nêm [[1|muỗng canh|frac]] · đường [[1|muỗng canh|frac]] · tiêu — dầu ăn để chiên ngập"
    - "Ăn kèm: nước mắm chua ngọt + đồ chua · bún tươi · xà lách, rau thơm"
  steps:
    - Khoai môn, cà rốt bào sợi ngắn, **vắt ráo nước**; nấm mèo, hành tím băm nhỏ.
    - Trộn thịt + tôm + rau củ + lòng đỏ trứng + gia vị, quết nhẹ, **để ngăn mát 15 phút** cho nhân kết dính.
    - "Cuốn: nhân vừa phải, gập hai mép, **cuốn lỏng tay** một chút — dán mép bằng nước."
    - Chiên lần 1 **lửa vừa** ngập dầu 6–7 phút cho chín ruột, vớt ra để ráo.
    - Sát giờ ăn chiên lần 2 **lửa lớn** 1–2 phút — vàng ruộm, giòn rụm.
    - Dọn với bún, rau sống, chấm mắm chua ngọt — hoặc cuốn xà lách đúng điệu.
  warning: >-
    Ba thủ phạm làm chả giò xẹp mềm: nhân ướt không vắt ráo · cuốn chặt căng
    tay (nhân nở làm nứt vỏ) · chiên một lần lửa lớn (ngoài cháy trong sống).

flavor:
  chua: 3
  ngot: 5
  man: 5.5
