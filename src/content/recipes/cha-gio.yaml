flavorNote: >-
  **Chuẩn cuốn chả giò:** cắn nghe **"rốp"** một tiếng, vỏ vàng đều không rỗ
  dầu, nhân bên trong **ngọt thịt tôm, bùi khoai môn**, nóng bốc khói.
storyEyebrow: Chuyện cuốn chả
storyTitle: Món **có mặt ở mọi mâm tiệc** của người Việt
story:
  - >-
    Giỗ chạp, cưới hỏi, Tết nhứt hay tiệc tân gia — mâm cỗ người Việt kiểu gì
    cũng có dĩa chả giò vàng ruộm đặt chính giữa. Món này vui từ khâu làm:
    cả nhà xúm lại, người trải bánh, người múc nhân, người cuốn — tay làm
    miệng nói, **chưa chiên đã rộn ràng như tiệc**.
  - >-
    Chả giò miền Nam có chữ ký riêng: **khoai môn bào sợi** trong nhân. Khoai
    chín tỏa vị bùi béo quyện với tôm thịt, khác hẳn nem rán miền Bắc thiên
    về miến và giá. Còn độ giòn huyền thoại thì không nằm ở loại bánh tráng
    đắt tiền, mà ở **kỹ thuật chiên hai lần** — lần đầu chín ruột, lần hai
    tạo vỏ — quán nào giòn lâu cũng đều làm vậy.
  - >-
    Công thức này cân sẵn liều lượng cho mẻ 24 cuốn: ăn một bữa, dư thì cấp
    đông sống — hôm nào nhà có khách đột xuất, thả thẳng vô chảo dầu là
    **10 phút sau có dĩa chả giò nóng giòn**, chủ nhà ung dung như đã chuẩn
    bị từ hôm trước.

