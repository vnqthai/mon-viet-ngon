heroEyebrow: Cuốn là dính…

quick:
  ingredients:
    - Tôm sú [[300|g]] · ba rọi (hoặc thịt đùi) [[300|g]]
    - Bánh tráng [[20|cái]] · bún tươi [[300|g]]
    - Xà lách, húng lủi, húng quế · giá [[100|g]] · hẹ [[20|cọng]]
    - "Nước chấm: tương đen [[3|muỗng canh|frac]] + bơ đậu phộng [[1|muỗng canh|frac]] + tỏi ớt, đậu phộng rang"
  steps:
    - Luộc thịt với hành + muối **20 phút**, ngâm nước lạnh, xắt lát mỏng.
    - Luộc tôm chín đỏ, bóc vỏ, **chẻ đôi theo sống lưng**, rút chỉ đen.
    - "Pha nước chấm: phi tỏi, cho tương đen + bơ đậu phộng + [[4|muỗng canh|frac]] nước, khuấy sệt, rắc đậu phộng + ớt."
    - Nhúng bánh tráng **lướt qua nước** thiệt nhanh, trải rau – bún – thịt, gập hai mép.
    - Đặt **tôm úp mặt đỏ xuống bánh** + cọng hẹ ló đầu, cuốn chặt tay. Chấm và tận hưởng.
  warning: >-
    Bánh tráng nhúng đẫm nước là **rách và dính chùm** — chỉ lướt qua nước 1
    giây, bánh sẽ tự mềm tiếp trong lúc xếp nhân.

