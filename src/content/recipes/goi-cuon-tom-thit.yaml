flavorNote: >-
  **Chuẩn cuốn đẹp:** lớp bánh căng mịn ôm sát nhân, **tôm đỏ nổi rõ**, hẹ ló
  một đầu — chấm ngập tương đậu phộng là "bao ghiền".
storyEyebrow: Chuyện cái cuốn
storyTitle: Món **đãi khách dễ nhất** trần đời
story:
  - >-
    Gỏi cuốn là món Việt hiếm hoi **lên bàn tiệc quốc tế** mà cách làm lại
    thuộc hàng dễ nhất: không cần canh lửa, không sợ mặn lạt — chỉ cần luộc,
    xắt, và cuốn. Vậy nên nhà có khách, cứ bày mâm gỏi cuốn ra là vừa sang
    vừa vui: ai cuốn nấy ăn, rôm rả cả buổi.
  - >-
    Cái hơn thua của gỏi cuốn nằm ở **bàn tay cuốn** và **chén nước chấm**.
    Cuốn phải chặt để cắn không bung, tôm phải úp mặt đỏ ra ngoài cho đẹp;
    còn nước chấm tương đậu phộng phải **sệt óng, béo bùi** — chấm tới đâu
    cuốn trôi tới đó.

