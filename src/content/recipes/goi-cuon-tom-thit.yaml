title: Gỏi cuốn tôm thịt **cuốn chặt tay, chấm đã đời**
summary: >-
  Tôm đỏ au ẩn sau lớp bánh tráng mỏng tang, rau bún thanh mát, chấm **tương
  đậu phộng sền sệt** — món "ăn hoài không ngán" đãi khách cực sang mà cực dễ.
region: Miền Nam
category: Cuốn
occasions: [Ăn chơi, Đãi khách]
