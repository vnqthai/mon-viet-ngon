stepsEyebrow: Vô bếp thôi!
stepsTitle: 6 bước ra **chảo sườn keo bóng**
stepsLead: >-
  Trình tự khôn: sườn nằm ướp thì mình lặt hành, xắt ớt, tới phút cuối bắc
  luôn chảo thắng nước màu — sườn thấm xong là vô chảo liền một mạch, tổng
  vèo cái chừng 50 phút.
steps:
  - title: Chặt khúc & chần sườn
    icon: knife
    minutes: 10 phút
    intro: "Khúc sườn gọn đẹp là đã được nửa dĩa sườn ngon:"
    bullets:
      - label: "Chặt khúc:"
        text: >-
          nhờ hàng thịt chặt sẵn khúc **4–5 cm** — cỡ này gặm vừa miệng,
          rim lâu không khô. Về nhà rửa nước muối loãng, để ráo.
      - label: "Chần sơ:"
        text: >-
          nấu nồi nước sôi với **gừng đập + hành tím**, thả sườn vô chần
          **2 phút** cho bọt bẩn ra hết, vớt ra rửa lại nước sạch.
    callout:
      type: tip
      text: >-
        Chần sơ hay ướp thẳng đều có nhà làm — mình chọn chần: tốn thêm 5
        phút, đổi lại nước ram **trong veo, sốt keo bóng đẹp** không lợn
        cợn vụn xương.
  - title: Ướp sườn — khoan bỏ đường
    icon: spoon
    minutes: 20 phút
    bullets:
      - text: >-
          Trộn sườn với [[1.5|muỗng canh|frac]] nước mắm + hành tím tỏi
          băm + ½ muỗng cà phê tiêu + 1 muỗng cà phê hạt nêm, ướp **20
          phút**.
      - text: >-
          Đường **chưa bỏ vô lúc này** — phần ngọt để dành cho nước màu và
          nhịp nêm cuối, ướp đường sớm là dễ cháy chảo khi đảo.
    timer:
      secs: 1200
      label: Hẹn giờ ướp sườn · 20:00
      doneMsg: Sườn thấm rồi — nước màu tới đâu rồi nè?
  - title: Thắng nước màu — trái tim của món
    icon: flame
    minutes: 5 phút
    intro: "Kỹ thuật trung tâm của mọi món ram, làm chậm và nhìn cho kỹ:"
    bullets:
      - label: "Bắc chảo:"
        text: >-
          cho [[1.5|muỗng canh|frac]] đường + [[3|muỗng canh|frac]] nước
          vô chảo, lửa vừa. **Đừng khuấy** — chỉ cầm cán nghiêng chảo cho
          đường tan chảy đều.
      - label: "Nhìn màu đổi:"
        text: >-
          đường sôi rồi sậm dần từ **trong → vàng nhạt → vàng ươm → cánh
          gián** (nâu đỏ ánh hổ phách, dậy mùi caramel thơm lựng).
      - label: "Dừng đúng lúc:"
        text: >-
          vừa chớm cánh gián, bọt li ti ngả vàng nâu là **hạ lửa nhỏ
          liền**, nhấc chảo khỏi bếp vài giây càng chắc — nhiệt dư còn đẩy
          màu đậm thêm một nấc nữa.
    callout:
      type: warn
      text: >-
        Thắng quá tay là **khét — đắng cả nồi**, không gia vị nào cứu nổi.
        Lỡ khét thì mạnh dạn đổ bỏ, rửa chảo thắng lại: tốn một muỗng
        đường, đỡ tốn cả ký sườn.
  - title: Đảo sườn săn vàng, sém cạnh
    icon: meat
    minutes: 5 phút
    bullets:
      - text: >-
          Nước màu vừa tới, thêm **1 muỗng canh dầu ăn** rồi trút sườn vô
          (gạt bớt xác hành tỏi ướp kẻo cháy đắng).
      - text: >-
          Lửa vừa, đảo cho **từng khúc sườn áo màu nâu đỏ óng**, mặt thịt
          săn lại, cạnh hơi sém thơm — chữ "ram" nằm ở nhịp sém cạnh này.
  - title: Châm nước dừa, rim liu riu
    icon: pot
    minutes: 25 phút
    bullets:
      - text: >-
          Châm **nước dừa xâm xấp mặt sườn** (không ngập hẳn), đun sôi thì
          hớt sạch bọt.
      - text: >-
          Hạ **lửa nhỏ nhất**, đậy hé nắp, rim **25 phút** — thỉnh thoảng
          trở cho khúc nào cũng được "tắm" nước rim đều màu.
    callout:
      type: tip
      text: >-
        Nước dừa cho vị ngọt thanh và lớp keo lên màu óng đẹp — thay nước
        lọc + ½ muỗng canh đường vẫn ngon, chỉ kém chút hậu thanh.
    timer:
      secs: 1500
      label: Hẹn giờ rim sườn · 25:00
      doneMsg: Coi chảo nghen — tới nhịp rút keo rồi!
  - title: Rút keo & cân mặn ngọt
    icon: bowl
    minutes: 5 phút
    bullets:
      - text: >-
          Mở nắp, lên lửa vừa, nêm [[1|muỗng canh|frac]] nước mắm còn lại
          + [[1|muỗng canh|frac]] đường, đảo đều.
      - text: >-
          Để nước **rút dần thành lớp sốt keo bóng** bám từng khúc sườn —
          nghiêng chảo thấy sốt chảy chậm như mật ong là đạt.
      - text: >-
          Nếm thử theo đúng bài **mặn trước, ngọt sau, hậu kẹo nhẹ** —
          thiếu vế nào bồi vế đó, từng chút một.
      - text: >-
          Tắt bếp, rắc hành lá xắt nhỏ + tiêu xay, thả ớt lát nếu nhà ăn
          cay — thích kiểu quán thì thêm nhúm **mè rang** lấm tấm.
    callout:
      type: warn
      text: >-
        Nêm giữa chừng cứ **non tay một chút** — nước rút keo là vị tự đậm
        lên một nấc. Mặn quá ở phút chót gần như hết đường lùi.
    doneText: Sườn bóng lưỡng lên dĩa — xong!

tipsTitle: 7 bí quyết cho **dĩa sườn ram đúng điệu**
tipsLead: >-
  Nguyên liệu món này chợ nào cũng có, ăn thua nhau ở mấy cái "biết" nho
  nhỏ này — đọc trước khi đi chợ là vừa.
tips:
  - icon: meat
    title: Sườn non dẻ nhỏ, có sụn
    text: >-
      Dẻ xương **nhỏ mà dẹt** là sườn nhiều thịt ít xương; lẫn mấy đoạn
      **sụn trắng** thì nấu lên giòn sựt, con nít giành nhau gắp. Sườn già
      xương to tròn, ít thịt, rim cỡ nào cũng dai — đừng ham rẻ.
  - icon: knife
    title: Nhờ hàng thịt chặt giùm
    text: >-
      Sườn non chặt khúc đều tay cần dao nặng thớt chắc — ngoài chợ người
      ta chặt ba mươi giây là xong, khúc nào ra khúc nấy. Về nhà tự chặt
      vừa mẻ dao vừa văng xương vụn, dính vô sốt keo là lợn cợn.
  - icon: flame
    title: Nước màu — tin mắt, đừng tin đồng hồ
    text: >-
      Mỗi bếp mỗi chảo nóng một kiểu, nên đừng canh phút — canh **màu cánh
      gián và mùi caramel**. Cứ hạ lửa sớm hơn cảm giác một giây: nhiệt dư
      của chảo sẽ đẩy màu tới đúng chỗ đẹp.
  - icon: drop
    title: Nước dừa là "đường thanh"
    text: >-
      Dừa xiêm ngọt nhẹ giúp bớt được lượng đường nêm mà hậu vị lại thanh,
      lớp keo lên màu óng chứ không gắt. Thay nước lọc vẫn được — chỉ cần
      nêm đường khéo tay hơn chút.
  - icon: spoon
    title: Mặn trước, ngọt sau
    text: >-
      Công thức nêm của món nằm gọn trong sáu chữ đó: mặn đằm của mắm dẫn
      trước, ngọt đuổi theo, hậu đọng chút kẹo. Ngọt lấn mặn là thành
      "sườn kẹo", mặn lấn ngọt thì thành sườn kho — ram đứng ngay chính
      giữa.
  - icon: clock
    title: Liu riu mới mềm tới xương
    text: >-
      Rim lửa lớn là nước cạn nhanh mà sườn chưa kịp mềm — ngoài đậm trong
      lạt. Lửa nhỏ 25 phút mới đủ thời gian cho mắm đường ngấm tới sát
      xương, gặm mới đã.
  - icon: claypot
    title: Qua bữa càng thấm
    text: >-
      Như mọi món nhà họ kho, sườn ram hâm lại lần hai vị càng sâu. Múc
      phần ăn hâm riêng với muỗng nước cho sốt bóng lại — đừng hâm nguyên
      chảo nhiều lần, sườn nát mất đẹp.

serve:
  title: Dọn mâm — **nồi cơm hao hơn thường lệ**
  paras:
    - >-
      Gắp sườn ra dĩa sâu lòng, rưới hết chỗ **sốt keo óng ánh** lên mặt.
      Chan muỗng sốt vô chén cơm nóng trước đã — hạt cơm áo lớp mặn ngọt
      bóng lưỡng, lùa một hơi hết nửa chén hồi nào không hay. Nhà có con
      nít cứ lựa mấy khúc nhiều sụn gắp vô chén tụi nhỏ: món này xưa giờ
      là **"món dụ cơm" hiệu nghiệm nhất** của các bà má.
    - >-
      Mâm cơm kinh điển miền Nam: dĩa sườn ram đậm đà đặt cạnh **tô canh
      khổ qua nhồi thịt** đắng thanh, hoặc hiền hơn thì **canh bí đỏ thịt
      bằm** ngọt bùi — một đậm một thanh, và cơm là vòng lặp không có điểm
      dừng.
    - >-
      Còn chiều cuối tuần bạn bè ghé chơi? Dọn chảo sườn nóng ra liền —
      khúc sườn keo bóng **cầm tay gặm sạch tới xương**, mặn ngọt hậu kẹo
      càng gặm càng bắt, lai rai câu chuyện là hết chảo hồi nào không
      biết.
  aside:
    title: Mâm cơm gợi ý
    intro: "Đủ bộ này là bữa cơm nhà đúng nghĩa:"
    items:
      - icon: rice
        text: "**Cơm trắng nóng hổi** — nấu dư chút, tin mình đi."
      - icon: bowl
        text: "**Canh khổ qua nhồi thịt** — đắng thanh cân vị keo đậm, cặp mâm kinh điển."
      - icon: pumpkin
        text: "**Canh bí đỏ thịt bằm** — hiền lành ngọt bùi, mâm có con nít càng hợp."
      - icon: lettuce
        text: "**Dưa leo, cà chua xắt lát** — tươi giòn đỡ ngán, khỏi nấu nướng."

faq:
  - q: Sườn ram khác sườn xào chua ngọt chỗ nào?
    a: >-
      Khác cả vị lẫn cách nấu: **sườn xào chua ngọt** cậy vô giấm và cà
      chua (nhiều nhà còn chiên sơ sườn), vị chua dẫn dàn. **Sườn ram**
      không giấm, không cà chua, không áo bột — chỉ mắm, đường, nước màu
      rim tới keo, vị mặn ngọt hậu kẹo. Thèm chua thì nấu chua ngọt, thèm
      "cơm nhà đậm đà" thì ram.
  - q: Dùng sườn cốt lết được không?
    a: >-
      Được nhưng **khô hơn** — cốt lết nạc nhiều mỡ ít, hợp nướng kiểu cơm
      tấm hơn là rim lâu. Nếu vẫn dùng, rút thời gian rim còn cỡ 15 phút
      và thêm chút dầu. Còn ngon nhất cho món ram, trước sau vẫn là **sườn
      non**.
  - q: Không có nước dừa tươi thì thay bằng gì?
    a: >-
      **Nước lọc + ½ muỗng canh đường** là ổn, hoặc nước dừa đóng hộp loại
      không đường. Đừng thay bằng **nước cốt dừa** — cốt béo và đục, rim
      lên thành món khác luôn rồi.
  - q: Ram xong bị mặn chát, cứu sao?
    a: >-
      Châm thêm **3–4 muỗng canh nước sôi + ½ muỗng cà phê đường**, đun
      lửa nhỏ 2–3 phút cho sốt loãng ra rồi keo lại là vị dịu liền. Rút
      kinh nghiệm lần sau: nêm giữa chừng non tay thôi, chờ sốt keo rồi
      mới chốt.
  - q: Để tủ lạnh hâm lại có ngon không?
    a: >-
      Ngon — sườn ram để ngăn mát **2–3 ngày, càng để càng thấm**. Hâm
      bằng chảo lửa nhỏ với 1–2 muỗng nước cho sốt bóng trở lại; hạn chế
      quay vi sóng lâu, sườn bị khô xác.
  - q: Nhà có con nít nhỏ thì nêm sao?
    a: >-
      Món này vốn là **món ruột của tụi nhỏ** rồi: chỉ cần bớt tiêu, khỏi
      bỏ ớt (để ớt ra chén riêng cho người lớn), giữ vị ngọt kẹo tự nhiên
      là bé nào cũng xúc cơm lia lịa. Lựa khúc sụn mềm, gỡ bớt xương cho
      bé nhỏ tuổi.

