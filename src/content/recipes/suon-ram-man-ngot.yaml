heroEyebrow: Xèo một tiếng, thơm cả xóm…

quick:
  ingredients:
    - Sườn non [[800|g]] — chặt khúc 4–5 cm, chọn dẻ xương nhỏ có sụn
    - Nước dừa tươi [[300|ml]] (không có thì thay nước lọc)
    - Hành tím [[2|củ]] + tỏi [[3|tép]] băm · hành lá [[2|nhánh]] · ớt [[1|trái]] tùy nhà
    - Gừng [[3|lát]] + hành tím [[1|củ]] đập giập — để chần sườn
    - "Thắng nước màu: đường cát [[1.5|muỗng canh|frac]] + nước [[3|muỗng canh|frac]]"
    - "Nêm: nước mắm [[2.5|muỗng canh|frac]] · đường [[1|muỗng canh|frac]] · tiêu, hạt nêm"
  steps:
    - Sườn chặt khúc **4–5 cm**, chần sơ nước sôi với gừng + hành đập, rửa sạch — nước ram trong veo.
    - Ướp sườn với [[1.5|muỗng canh|frac]] nước mắm – hành tỏi băm – tiêu **20 phút** (chưa bỏ đường vội).
    - "Thắng nước màu: đường + nước, lửa vừa, sôi tới **màu cánh gián** là hạ lửa liền."
    - Cho sườn vô chảo nước màu, đảo lửa vừa tới **săn vàng, sém nhẹ cạnh**.
    - Châm nước dừa **xâm xấp mặt sườn**, rim liu riu **25 phút**, thỉnh thoảng trở.
    - Nêm chỗ mắm + đường còn lại, mở nắp cho nước **rút keo bóng bám sườn** — rắc hành lá, tiêu, ớt.
  warning: >-
    Cả món ăn thua ở chảo nước màu — thắng **quá lửa là khét, đắng cả nồi
    không cứu được**. Đường vừa chớm cánh gián phải hạ lửa ngay.

flavor:
  chua: 0.5
  ngot: 7.5
  man: 7.5
  cay: 1.5
  thom: 8
flavorNote: >-
  **Chuẩn vị:** cắn miếng sườn phải nghe **mặn đằm chạy trước, ngọt đuổi
  theo liền, hậu kẹo nhẹ dính môi** — sốt keo bóng bám khúc sườn chứ không
  loãng chảy tràn dĩa.
storyEyebrow: Chuyện chảo sườn
storyTitle: Nghe chữ **"ram"** thôi đã thấy đói
story:
  - >-
    Hồi nhỏ đi học về, chưa dắt xe vô tới sân đã đánh hơi được bữa nay má
    ram sườn: mùi đường thắng cánh gián quyện mùi nước mắm bay ra tận đầu
    hẻm, giấu kiểu gì cũng không được. Bữa cơm dọn lên, dĩa sườn nâu đỏ
    óng ánh đặt giữa mâm là **đũa cả nhà chụm về một hướng** — nồi cơm hôm
    đó bao giờ cũng hết sớm hơn thường lệ.
  - >-
    Chữ **"ram"** là cách người miền Nam, miền Trung gọi kiểu rim cho tới
    khi nước cạn keo lại, miếng thịt **sém nhẹ cạnh, áo một lớp sốt bóng
    lưỡng**. Linh hồn của chảo sườn ram nằm ở hai chỗ: muỗng **nước màu
    thắng tay** cho màu nâu đỏ tự nhiên, và thế **cân mặn – ngọt** phải
    thiệt khéo — mặn đằm của mắm đi trước, ngọt hậu kẹo theo sau, lệch về
    bên nào cũng mất cái duyên.
  - >-
    Món này dễ mà được lòng cả mâm: đám con nít mê nhất phần **ngọt kẹo
    với mấy cục sụn giòn sựt**, nhai rào rạo tới hạt cơm cuối cùng; còn
    người lớn thì khỏi nói — khúc sườn keo bóng **cầm tay gặm sạch tới
    xương**, lai rai với bạn bè là bắt mồi vô cùng. Năm chục phút, một
    cái chảo, đáng đồng tiền bát gạo lắm.

