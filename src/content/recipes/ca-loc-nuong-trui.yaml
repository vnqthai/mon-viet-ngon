flavorNote: >-
  **Chuẩn con cá:** gỡ ra thấy thịt **trắng, tách thành từng thớ to**, không
  nát; ăn vào ngọt trơn của cá đồng, mặn là do chén mắm me chứ không phải do
  ướp.
storyEyebrow: Chuyện món ăn
storyTitle: Món nấu **không cần cái bếp nào**
story:
  - >-
    Cá lóc nướng trui sinh ra ngoài đồng chứ không sinh ra trong bếp. Mùa gặt
    xong, rơm chất đầy ruộng; bắt được con cá dưới mương là cắm cái que, phủ
    rơm lên, châm lửa. Cháy hết đống rơm thì cá cũng vừa chín. Không dao thớt,
    không nồi niêu, không gia vị — nên nó là món **ai cũng làm được ở bất cứ
    đâu**, và đó mới là lý do nó sống lâu tới giờ.
  - >-
    Rơm hợp với con cá không phải vì mùi khói, mà vì **cách nó cháy**: bùng lên
    rất nhanh, bao kín con cá từ mọi phía, rồi tàn cũng nhanh. Con cá chín đều
    trong mươi lăm phút, chưa kịp mất nước. Hiểu được cơ chế đó thì ở bếp nhà
    bạn biết mình cần gì — **lửa to, đều, và ngắn**. Than hoa cho đúng thứ đó;
    lò nướng bật hết cỡ cũng làm được, chỉ chậm hơn.
  - >-
    Chuyện "không ướp" cũng có lý riêng. Cá lóc đồng thịt ngọt sẵn, mà nêm vào
    thì gia vị nằm hết ở lớp vảy — chỗ sẽ bị cạo bỏ. Người ta dồn hết phần nêm
    nếm sang **chén nước mắm me và dĩa rau**, để miếng cá giữ nguyên vị của nó.
    Cùng một con cá, mỗi cuốn lại ra một vị tuỳ tay người cuốn.
  - >-
    Cái que xiên cũng có chuyện. Ngoài đồng người ta chuốt một que tre tươi,
    xiên từ miệng cá chạy suốt xuống đuôi rồi cắm xuống đất cho cá đứng thẳng.
    Que tươi không cháy nhanh, và cá đứng thì nước trong mình cá chảy dần xuống
    chứ không đọng lại. Ở nhà, một **cây sả to** hoặc que tre ngâm nước làm được
    đúng việc đó.

