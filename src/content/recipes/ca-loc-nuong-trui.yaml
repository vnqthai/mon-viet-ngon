    - Que tre hoặc que sả to [[1|que]] — xiên từ miệng xuống đuôi
    - "Mỡ hành: hành lá [[1|bó]] · dầu ăn [[3|muỗng canh|frac]] · đậu phộng rang [[50|g]]"
    - "Nước mắm me: me vắt [[40|g]] · nước mắm [[2|muỗng canh|frac]] · đường [[2|muỗng canh|frac]] · tỏi ớt"
    - "Cuốn kèm: bánh tráng, bún tươi [[300|g]], xà lách, húng quế, chuối chát, khế chua, dưa leo"
  steps:
    - Rửa sạch nhớt bằng nước muối, **giữ nguyên vảy và nguyên con**.
    - Xiên que từ miệng chạy dọc thân xuống tới đuôi cho cá thẳng.
    - Nướng lửa to đều tới khi vảy cháy đen giòn — than hoa 20–25 phút, trở đều.
    - Cạo bỏ lớp vảy cháy, lộ thịt trắng; rưới mỡ hành, rắc đậu phộng.
    - Cuốn bánh tráng với bún và rau, chấm nước mắm me.
  warning: >-
    Đừng đánh vảy và đừng mổ bụng. Lớp vảy là thứ **chắn lửa** cho miếng thịt —
    bỏ nó đi thì cá cháy sém bên ngoài mà bên trong vừa khô vừa nhạt.

