title: Cá lóc nướng trui **để nguyên vảy, không ướp gì**
summary: >-
  Con cá lóc xiên que nướng nguyên vảy, không mổ bụng, không nêm một hạt muối —
  lớp vảy cháy đen chính là cái áo giữ cho thịt bên trong **trắng và ngọt**. Cạo
  vảy ra, rưới mỡ hành, cuốn bánh tráng chấm nước mắm me.
region: Miền Tây
category: Nướng
occasions: [Nhậu lai rai, Đãi khách]
