stepsTitle: Bốn nhịp, mà **ba nhịp đầu chỉ là đừng làm gì cả**
stepsLead: >-
  Món này khó ở chỗ ngược đời: hầu hết công đoạn là **không làm**. Không đánh
  vảy, không mổ, không ướp. Việc thật chỉ có canh lửa.
steps:
  - title: Làm cá — chỉ rửa, không hơn
    icon: fish
    minutes: 10 phút
    bullets:
      - label: "Rửa nhớt:"
        text: >-
          Chà con cá với muối hột cho sạch nhớt, xả lại nước cho thật sạch. Chỉ
          làm tới đó.
      - label: "Giữ nguyên vảy:"
        text: >-
          **Không đánh vảy.** Lớp vảy sẽ cháy thành cái vỏ chắn lửa, giữ hơi
          nước lại bên trong.
      - label: "Nếu ngại không mổ bụng:"
        text: >-
          Bản gốc để nguyên con. Ở nhà mà ngại, có thể **moi ruột qua mang** bằng
          một chiếc đũa — bụng cá vẫn kín, vảy vẫn nguyên. Đừng rạch bụng ra.
    callout:
      type: tip
      text: >-
        Khứa **2–3 đường nông** ở lưng con cá phía sau đầu. Không phải để ngấm
        gia vị, mà để hơi nước thoát bớt cho da khỏi nứt toác lúc gặp lửa.
  - title: Xiên que
    icon: stem
    minutes: 5 phút
    bullets:
      - text: >-
          Đưa que **từ miệng cá chạy dọc theo xương sống xuống tới đuôi**, ghim
          ra ngoài. Con cá phải thẳng đơ như cái que — cong thì lúc nướng chín
          không đều.
      - text: >-
          Que dài hơn con cá một gang để còn chỗ cầm trở. Que tre nhớ ngâm nước
          trước; cây sả to thì dùng luôn được.
  - title: Nướng — chọn một trong ba
    icon: flame
    minutes: 20–35 phút
    intro: "Cả ba đường đều cần một thứ: lửa to, đều, và không kéo dài."
    bullets:
      - label: "Than hoa (đường dễ nhất ở nhà):"
        text: >-
          Đốt than cho **cháy đượm, phủ tro trắng**, gạt thành một lớp dày và
          đều. Gác cá cách than một gang tay, nướng **20–25 phút**, trở đều mỗi
          5 phút. Xong khi vảy đen giòn và tróc khỏi thịt.
      - label: "Lò nướng:"
        text: >-
          Bật **250 °C** (hoặc mức cao nhất), có quạt thì bật quạt, đặt cá lên
          vỉ có khay hứng bên dưới. Nướng **30–35 phút**, lật một lần giữa
          chừng, rồi bật **lửa trên 5 phút cuối** cho lớp vảy khô và cháy hẳn.
      - label: "Rơm (nếu bạn đang ở quê):"
        text: >-
          Cắm que xuống đất cho cá đứng, phủ rơm khô kín con cá rồi châm lửa.
          Cháy hết đống rơm là xong, chừng **10–15 phút**. Rơm phải khô và đủ
          nhiều — thiếu rơm thì lửa tắt giữa chừng, cá sống bên trong.
      - label: "Sao là chín:"
        text: >-
          Xiên đũa vào chỗ dày nhất sau đầu, rút ra **không thấy nước hồng** là
          được. Vảy cháy đen và bong lên là dấu hiệu đi kèm.
    timer:
      secs: 1500
      label: Hẹn giờ nướng than · 25:00
      doneMsg: Kiểm thử bằng đũa xem trong đã chín chưa nghen!
    callout:
      type: warn
      text: >-
        Lửa nhỏ mà nướng lâu là hỏng chắc: vảy không cháy tới nơi nên cạo không
        ra, còn thịt thì mất nước, bở và nhạt. Thà lửa hơi già một chút — lớp
        vảy cháy thêm cũng bỏ đi thôi.
  - title: Cạo vảy, rưới mỡ hành, dọn cuốn
    icon: spoon
    minutes: 10 phút
    bullets:
      - label: "Mỡ hành:"
        text: >-
          Hành lá xắt nhuyễn cho vào chén, đun [[3|muỗng canh|frac]] dầu tới bốc
          khói nhẹ rồi **dội thẳng vào hành**, thêm chút muối. Nghe xèo một
          tiếng là đúng.
      - label: "Cạo vảy:"
        text: >-
          Đặt cá ra dĩa, dùng sống dao **cạo hết lớp vảy cháy** cho lộ thịt
          trắng. Cạo lúc còn nóng thì vảy tróc thành từng mảng.
      - text: >-
          Rưới mỡ hành khắp mình cá, rắc đậu phộng giã thô. Dọn kèm dĩa bánh
          tráng, bún, rau và chén nước mắm me.
    doneText: Xong — gỡ tới đâu cuốn tới đó!

tipsTitle: 4 điều **quyết định** con cá nướng trui
tips:
  - icon: alert
    title: Cái vảy là dụng cụ nấu, không phải rác
    text: >-
      Đây là chỗ người mới hay làm sai nhất — thấy vảy thì đánh sạch theo thói
      quen. Nhưng con cá này **không có nồi, không có giấy bạc**: lớp vảy chính
      là thứ giữ hơi nước và chắn lửa. Đánh vảy trước khi nướng thì món ăn đổi
      hẳn, thành cá nướng thường và khô hơn nhiều.
  - icon: flame
    title: Lửa to và ngắn, đừng liu riu
    text: >-
      Nướng trui không phải nướng chậm. Đống rơm cháy hết trong mươi lăm phút —
      cứ lấy đó làm chuẩn. Ở bếp nhà nghĩa là **than thật đượm hoặc lò thật
      nóng**, làm một mạch rồi thôi, chứ không phải để cá trên lửa nhỏ suốt
      nửa tiếng.
  - icon: pod
    title: Chuối chát và khế đừng bỏ
    text: >-
      Cuốn cá lóc mà thiếu hai thứ này thì nhạt hẳn. Miếng cá ngọt, mỡ hành béo,
      đậu phộng bùi — cả cuốn đang đi về một phía. **Chát của chuối và chua của
      khế** kéo ngược lại, nên ăn cuốn thứ năm vẫn còn thấy ngon.
  - icon: drop
    title: Nước mắm me nêm hơi đậm một chút
    text: >-
      Vì con cá hoàn toàn không ướp, chén chấm phải gánh phần mặn cho cả cuốn.
      Nêm tới khi nếm riêng thấy **hơi đậm hơn mức bạn muốn** là vừa — vào cuốn
      có bún và rau, nó loãng ra đúng độ.

serve:
  title: Dọn cả mâm ra giữa bàn — **ai cuốn nấy ăn**
  paras:
    - >-
      Đừng gỡ sẵn cá ra dĩa rồi mới bưng lên. Để nguyên con giữa mâm, đặt cái
      nĩa hay đôi đũa bên cạnh, ai ăn tới đâu gỡ tới đó. Thịt cá nằm trong mình
      con cá thì giữ nóng lâu hơn nhiều so với gỡ sẵn ra dĩa.
    - >-
      Mâm bày kiểu miền Tây là bày rộng: một rổ rau lớn, dĩa bánh tráng, tô bún,
      chén nước mắm me để giữa. Cuốn là việc của người ăn — cuốn chặt hay lỏng,
      nhiều rau hay nhiều cá, tuỳ tay mỗi người.
  aside:
    title: Rổ rau nên có gì
    intro: "Bốn thứ này gánh bốn vị khác nhau, có đủ thì cuốn nào cũng tròn:"
    items:
      - icon: lettuce
        text: "**Xà lách và húng quế** — nền mát và mùi thơm."
      - icon: pod
        text: "**Chuối chát** — vị chát, thứ cân lại mỡ hành."
      - icon: star
        text: "**Khế chua** xắt lát hình sao — chua thanh, khác cái chua của me."
      - icon: okra
        text: "**Dưa leo** chẻ que — giòn và mọng nước."

faq:
  - q: Nhà chung cư không có than, nướng lò có ra không?
    a: >-
      Ra được, và ra khá gần. Cái phải giữ là **nhiệt thật cao**: bật 250 °C hay
      mức cao nhất của lò, nướng 30–35 phút, năm phút cuối bật lửa trên cho lớp
      vảy khô cứng lại. Chỗ khác biệt còn lại là lớp vảy cháy không đều bằng
      nướng than, nên cạo hơi lâu hơn.
  - q: Không mua được cá lóc thì thay bằng cá gì?
    a: >-
      **Cá rô phi, cá diêu hồng, cá trê** đều nướng kiểu này được — chọn con
      **thịt chắc và có vảy**, cỡ 700–1000 g. Cá da trơn không vảy như cá basa
      thì không hợp, vì mất đúng cái lớp áo chắn lửa làm nên món.
  - q: Có nên ướp một chút cho đậm không?
    a: >-
      Không cần, mà cũng gần như vô ích: gia vị chỉ bám ở lớp vảy, mà lớp đó sẽ
      bị cạo bỏ. Muốn đậm hơn thì **nêm chén nước mắm me đậm tay hơn**, hoặc rắc
      chút muối ớt lên thịt sau khi cạo vảy.
  - q: Cá bị nứt da, chảy hết nước ra ngoài thì sao?
    a: >-
      Thường là do lửa quá sát hoặc không khứa lưng trước. Lần sau nhớ hai điều:
      **khứa 2–3 đường nông ở lưng** cho hơi thoát, và gác cá cách than ít nhất
      một gang tay. Con đang nướng dở thì hạ thấp lửa xuống, trở mặt nứt lên
      trên cho nước khỏi chảy tiếp.

