flavorNote: >-
  **Chuẩn nồi chè:** nước cốt dừa **béo mà không ngán nhờ nêm muối**, ba thứ
  khoai mềm tới nơi mà miếng vẫn còn vuông cạnh, hạt bột báng **trong veo dai
  nhẹ**. Múc muỗng lên phải thấy đủ ba màu vàng – tím – trắng trong một muỗng.
storyEyebrow: Chuyện cái tên
storyTitle: Cái tên **bà ba**, và mấy cách người ta cắt nghĩa
story:
  - >-
    Cái tên hay được cắt nghĩa bằng chuyện nhìn: nồi chè có khoai lang vàng
    cam, khoai môn tím lấm tấm, khoai mì trắng, đậu xanh vàng nhạt, bột báng
    trong veo — nhiều màu nằm chen nhau trong nước cốt dừa trắng đục, người
    Nam Bộ thấy giống **tà áo bà ba** nên gọi luôn thành tên. Cũng có người
    kể món do một bà Ba bán chè đặt nền, hay đọc trại từ món bubur cha cha
    của người Hoa vùng eo biển. Nhiều nơi còn gọi món này là **chè thưng**.
  - >-
    Đây là kiểu chè "có gì nấu nấy" đúng nghĩa: nhà nào sẵn khoai gì thì bỏ
    khoai đó, thêm được hạt sen thì thêm, có phổ tai thì bỏ vô. Nhưng có một
    thứ không được thiếu và cũng không được nêm hờ — **muối**. Nồi chè cốt dừa
    mà quên muối thì ngọt trơ, ăn hai muỗng là ngán tới cổ.
  - >-
    Món này **ăn nóng hay lạnh đều đúng**. Trời mát thì múc chén còn bốc khói,
    vừa húp vừa thổi, cái béo của cốt dừa với cái bùi của khoai môn quyện lại,
    ăn xong no bụng rất dễ chịu. Trời nóng thì để nguội rồi cho **ngăn mát vài
    tiếng** — nước chè đặc lại, miếng khoai mát lạnh, ăn đã miệng hơn hẳn.
    Chỉ có một điều: **đừng bỏ đá viên vào** cho nhanh, đá tan ra là nước cốt
    dừa loãng và nhạt hết vị.

