quick:
  ingredients:
    - "Ba thứ khoai, mỗi thứ [[200|g]]: khoai lang bí (ruột vàng cam) · khoai môn · khoai mì"
    - Đậu xanh cà vỏ [[100|g]] — ngâm 3 tiếng
    - Bột báng [[60|g]] — ngâm nước lạnh 20 phút cho nở
    - "Nước cốt dừa [[400|ml]] + nước dão dừa [[600|ml]] (hoặc nước lọc)"
    - Đường [[180|g]] · muối [[0.5|muỗng cà phê|frac]] · lá dứa [[4|lá]]
    - Đậu phộng rang [[60|g]] · một nhúm mè rang
  steps:
    - Ba thứ khoai gọt vỏ, **cắt vuông [[2|cm]]** cho miếng nào cũng bằng nhau — chín cùng lúc.
    - Khoai mì **ngâm nước muối loãng qua đêm**, luộc riêng một lượt, đổ bỏ nước đó.
    - Nấu đậu xanh với nước dão dừa + lá dứa tới khi hạt bở mà còn nguyên.
    - Thả khoai môn trước (lâu mềm nhất), 5 phút sau tới khoai lang, cuối cùng là khoai mì đã luộc.
    - Bột báng ngâm nở **luộc riêng tới khi trong veo**, xả nước lạnh rồi mới cho vào nồi.
    - Nêm đường + **muối**, rót nước cốt dừa, **khuấy nhẹ tay, sôi lăn tăn là tắt**.
    - >-
      Múc chén, rắc đậu phộng và mè rang — ăn nóng liền, hoặc để nguội rồi cho
      **ngăn mát** ăn lạnh (đừng bỏ đá viên).
  warning: >-
    Khuấy mạnh tay sau khi khoai đã mềm là cả nồi biến thành **cháo khoai** —
    hết nhìn ra miếng nào với miếng nào. Từ lúc thả khoai vào, chỉ được đảo
    bằng cách lắc nhẹ nồi hoặc lùa muỗng dọc theo thành.

