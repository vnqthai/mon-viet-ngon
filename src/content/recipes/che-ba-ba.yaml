title: "Chè bà ba: **3 thứ khoai, một nồi cốt dừa**"
summary: >-
  Khoai lang vàng, khoai môn tím, khoai mì trắng cắt vuông nấu chung với đậu
  xanh và bột báng (viên tinh bột tròn nhỏ, luộc lên trong veo) trong **nồi
  nước cốt dừa béo ngậy** — nồi chè Nam Bộ nhiều màu như tà áo bà ba, húp
  nóng cũng được mà để ngăn mát ăn lạnh cũng ngon.
