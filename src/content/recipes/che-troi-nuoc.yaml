flavorNote: >-
  **Chuẩn chén chè:** vỏ **dẻo mềm, cắn đứt ngọt** chứ không dai nhách cũng
  không bở nát. Nhân đậu xanh **bùi và ráo**, không ướt nhoẹt. Nước gừng ngọt
  đậm màu hổ phách, cay ấm ở cuống họng chứ không cay xé lưỡi.
storyEyebrow: Chuyện chén chè trôi nước
storyTitle: Viên chè **chìm xuống rồi nổi lên** — và đó là cái đồng hồ báo chín
story:
  - >-
    Chè trôi nước là món chè nóng, ăn bằng muỗng, mỗi chén chỉ ba bốn viên
    trắng to nằm trong nước đường gừng màu hổ phách. Vỏ làm bằng bột nếp nên
    dẻo, ruột là đậu xanh giã mịn sên với dừa nên bùi và ráo — hai thứ đó
    cộng với cái cay ấm của gừng làm nên toàn bộ món.
  - >-
    Tên món nói đúng cách nấu: thả viên vào nồi nước sôi thì nó **chìm xuống
    đáy**, chín tới đâu nhẹ tới đó, và khi chín hẳn thì **tự nổi lên mặt
    nước**. Không cần bấm giờ, không cần bổ ra xem — nồi tự báo. Chỉ cần nhớ
    đợi thêm chừng hai phút sau khi nổi, để phần vỏ sát nhân cũng chín đều.
  - >-
    Món này hay có mặt trong mâm cúng và mâm Tết ở miền Nam, nhưng nấu ngày
    thường cũng chẳng sao. Phần mất công nhất là ngồi vê viên; làm được tới đó
    rồi thì nồi nước gừng chỉ tốn thêm mười phút.

