title: Chè trôi nước **viên dẻo mềm, nước gừng cay ấm**
summary: >-
  Viên bột nếp trắng to bằng quả quất, bọc **nhân đậu xanh vàng ươm trộn dừa**,
  luộc nổi lên rồi thả vào nồi nước đường gừng. Múc chén nóng, chan nước cốt
  dừa, rắc mè rang — cắn vô là vỏ dẻo, ruột bùi, hậu vị cay ấm.
region: Miền Nam
category: Chè
occasions: [Ăn chơi, Cỗ Tết]
