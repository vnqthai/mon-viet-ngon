quick:
  ingredients:
    - Bột nếp [[300|g]] + nước ấm [[240|ml]] — nhồi tới khi dẻo mịn, không dính tay
    - Đậu xanh cà vỏ [[150|g]] · dừa nạo [[50|g]] · hành tím phi
    - Đường thốt nốt hoặc đường vàng [[200|g]] · gừng [[1|củ]] to
    - Nước cốt dừa [[200|ml]] · mè trắng rang [[2|muỗng canh]]
  steps:
    - Ngâm đậu xanh **3–4 tiếng**, hấp chín rồi giã mịn, sên với đường và dừa nạo cho khô ráo.
    - Vo nhân thành **viên tròn cỡ đầu ngón tay cái**, để riêng ra dĩa.
    - Nhồi bột nếp với nước ấm từng chút một tới khi **dẻo mịn như đất nặn**, ủ 20 phút.
    - Chia bột, ấn dẹt, đặt viên nhân vào giữa rồi **vê kín cho tròn** — hở là bung khi luộc.
    - Luộc viên trong nồi nước sôi, **viên nổi lên rồi đợi thêm 2 phút** mới vớt.
    - Vớt viên thả ngay vào tô nước lạnh cho vỏ săn, rồi vớt ra để ráo.
    - Nấu nước đường với gừng thái sợi, thả viên vào **đun liu riu 5 phút** cho ngấm.
    - "Múc chén: viên chè, chan nước gừng, rưới cốt dừa, rắc mè rang."
  warning: >-
    Vê viên không kín mép là **nhân bung ra giữa nồi**, nước luộc đục ngầu và
    viên xẹp lép. Vê xong lăn tròn trong lòng bàn tay, thấy mặt vỏ **liền lì
    không còn đường nối** thì mới thả.

