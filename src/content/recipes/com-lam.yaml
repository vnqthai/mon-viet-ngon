heroEyebrow: Bên bếp than, xoay từng ống một…

quick:
  ingredients:
    - Nếp nương (hoặc nếp cái hoa vàng) [[600|g]] — ngâm **6 tiếng**, vo sạch
    - Ống nứa hoặc tre bánh tẻ [[6|ống]] — chừa một đầu mấu làm đáy
    - Lá chuối [[3|tàu]] — bịt miệng ống
    - Nước dừa hoặc nước lã [[400|ml]] · muối [[1|muỗng cà phê|frac]]
    - "Muối vừng: vừng rang [[100|g]] · muối hột · chút đường"
  steps:
    - Ngâm nếp **6 tiếng**, vo lại, xóc muối cho ráo.
    - Đổ nếp vào ống chừng **2/3**, chế nước xâm xấp mặt gạo, bịt lá chuối.
    - Nướng trên than hồng, **xoay đều tay** chừng 45–60 phút.
    - Miệng ống bốc hơi nước và dậy mùi nếp là chín — để nguội bớt.
    - Chẻ bỏ lớp vỏ cháy, **giữ lại màng lụa trắng**, bẻ khúc chấm muối vừng.
  warning: >-
    Đặt ống nằm im một chỗ là **cháy thủng một bên mà bên kia còn sống**. Ống
    tre không dẫn nhiệt vòng quanh như cái nồi — phải xoay tay đều suốt, đây là
    việc chiếm gần hết thời gian nướng.

