flavorNote: >-
  **Chuẩn ống:** thỏi cơm ra khỏi ống còn **nguyên khối tròn**, ngoài bọc lớp
  màng lụa trắng mỏng; hạt nếp **dẻo mà rời**, không nát thành khối bết; ngửi
  thấy mùi nếp lẫn mùi tre non — đó là thứ chỉ ống tre mới cho được.
storyEyebrow: Chuyện món ăn
storyTitle: Cái nồi **dùng một lần** — và cũng là gia vị
story:
  - >-
    Cơm lam sinh ra từ chuyện đi rừng, đi nương: không mang nồi theo được thì
    chặt ngay một ống nứa bên đường làm nồi. Gạo nếp đã ngâm sẵn đổ vào, chế
    nước, bịt lá, vùi lên đống lửa — chừng một tiếng sau có cơm ăn, ăn xong vứt
    ống lại rừng. Nấu xong không phải rửa nồi, vì cái nồi cũng là củi.
  - >-
    Nhưng cái ống không chỉ đóng vai nồi. Bên trong lớp vỏ xanh có một **lớp
    màng lụa trắng mỏng** — nướng lên thì màng đó dính vào thỏi cơm, và tre non
    nhả nước ngọt vào hạt nếp. Đó là lý do cơm lam thơm khác cơm đồ trong chõ,
    dù chỉ có mỗi gạo với nước. Chẻ ống mà lỡ tay bóc mất lớp màng ấy là mất
    nửa phần thơm.
  - >-
    Món này gắn với **Tây Bắc** trong đầu hầu hết mọi người, nhưng **Tây Nguyên**
    cũng nấu, và cách nấu gần như y hệt. Khác chăng là thứ ăn kèm: trên này người
    Thái chấm **chẩm chéo** — thứ muối giã với ớt, tỏi, mắc khén — còn phổ biến
    hơn cả là **muối vừng**, giản dị mà hợp nhất.
  - >-
    Trên site đã có **xôi xéo** và **xôi mặn** cũng là nếp đồ, cũng xếp vào nhóm
    Cơm. Chỗ khác của cơm lam là nó **không có nhân, không có mỡ, không có gì
    rắc lên** — chỉ nếp, nước và ống tre. Món càng ít thứ thì càng không giấu
    được tay người nấu.

