title: Cơm lam **ống nứa nướng than, chấm muối vừng**
summary: >-
  Nếp ngâm no nước, nhồi vào **ống nứa tươi**, bịt lá chuối rồi vùi lên than —
  ống tre vừa là nồi vừa là gia vị. Chẻ ra, thỏi cơm còn nguyên **lớp màng lụa
  trắng** bọc ngoài, bẻ từng khúc chấm muối vừng.
region: Tây Bắc
category: Cơm
occasions: [Ăn chơi, Đãi khách]
pubDate: 2026-07-31
