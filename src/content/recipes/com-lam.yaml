steps:
  - title: Ngâm nếp cho no nước
    icon: clock
    minutes: 6 tiếng
    intro: "Không rút ngắn được — hạt nếp phải nở từ trong lõi:"
    bullets:
      - label: "Vo và ngâm:"
        text: >-
          Vo nếp 2–3 nước cho sạch, ngâm ngập nước lạnh **ít nhất 6 tiếng**,
          làm từ tối hôm trước là gọn nhất.
      - label: "Kiểm:"
        text: >-
          Bấm thử một hạt: **vỡ ra bột trắng, không còn lõi cứng** là đủ. Còn
          sạn ở giữa thì ngâm tiếp.
      - label: "Xóc muối:"
        text: >-
          Đổ ra rổ để ráo chừng [[15|phút]], xóc [[1|muỗng cà phê|frac]] muối
          cho đều.
    callout:
      type: warn
      text: >-
        Ngâm thiếu giờ là thỏi cơm **sượng ở lõi** — mà trong ống tre thì không
        có cách nào kiểm tra giữa chừng hay nấu thêm. Hỏng là hỏng cả ống.
  - title: Nhồi ống, bịt lá
    icon: stem
    minutes: 20 phút
    bullets:
      - label: "Rửa ống:"
        text: >-
          Rửa sạch ngoài ống, súc lòng ống bằng nước rồi dốc ngược cho ráo. Đừng
          cạo lớp vỏ xanh.
      - label: "Đổ nếp:"
        text: >-
          Đổ nếp vào chừng **2/3 ống**, đừng đầy hơn — nếp còn nở thêm, đầy quá
          là trào ra và ống dễ nứt.
      - label: "Chế nước:"
        text: >-
          Rót nước (hoặc nước dừa) tới **xâm xấp mặt gạo**, cao hơn chừng một
          đốt ngón tay. Gõ nhẹ đáy ống cho gạo lún đều.
      - label: "Bịt miệng:"
        text: >-
          Vò lá chuối thành nút, nhét chặt miệng ống. Nút phải kín để giữ hơi
          nhưng đừng nêm quá chặt — cần chừa chỗ cho hơi thoát ra từ từ.
    callout:
      type: tip
      text: >-
        Làm dư một ống **không bịt lá**, để hở, dùng làm ống thử: nhìn vào đó
        biết được nếp đã nở tới đâu mà khỏi phải bổ ống thật.
  - title: Nướng — và xoay đều tay
    icon: flame
    minutes: 60 phút
    intro: "Đây là toàn bộ phần khó của món:"
    bullets:
      - label: "Gây than:"
        text: >-
          Đốt than cho **hồng đều, hết lửa ngọn**. Lửa ngọn làm cháy vỏ ống
          trong khi bên trong chưa kịp nóng.
      - label: "Đặt ống:"
        text: >-
          Dựng nghiêng ống quanh bếp, miệng chếch lên, hoặc gác ngang trên vỉ.
          Không để ống chạm thẳng vào cục than.
      - label: "Xoay:"
        text: >-
          Cứ **3–5 phút xoay ống một lần** cho đều mặt. Vỏ ống sẽ khô dần, ngả
          vàng rồi sém đen từng mảng — bình thường, đừng sợ.
      - label: "Nhận biết chín:"
        text: >-
          Sau **45–60 phút**, miệng ống **bốc hơi nước** và dậy **mùi nếp thơm**
          là được. Nhấc thử thấy ống nhẹ hẳn đi so với lúc đầu.
    timer:
      secs: 300
      label: Hẹn giờ xoay ống · 05:00
      doneMsg: Xoay ống một vòng nghen — rồi hẹn tiếp!
    callout:
      type: warn
      text: >-
        **Đừng để lửa ngọn liếm vào ống.** Ngọn lửa đốt cháy lớp vỏ rất nhanh,
        thủng ống là nước chảy hết ra và thỏi cơm sống. Than hồng âm ỉ mới là
        thứ cần.
  - title: Chẻ ống — giữ lấy lớp màng lụa
    icon: knife
    minutes: 15 phút
    bullets:
      - label: "Để nguội bớt:"
        text: >-
          Gác ống ra ngoài chừng [[10|phút]]. Chẻ lúc còn bỏng rát vừa nguy hiểm
          vừa làm thỏi cơm vỡ.
      - label: "Chẻ vỏ:"
        text: >-
          Dùng dao **gọt từng lớp vỏ ngoài đã cháy**, xoay tròn quanh ống, gọt
          dần cho tới khi lộ ra lớp **màng lụa trắng** ôm lấy thỏi cơm.
      - label: "Dừng đúng chỗ:"
        text: >-
          **Dừng lại ở đó** — đừng bóc nốt lớp màng. Nó giữ cho thỏi cơm khỏi
          khô, và cầm ăn cũng sạch tay.
      - label: "Bẻ khúc:"
        text: >-
          Bẻ hoặc cắt thành khúc dài chừng một gang tay, xếp ra mẹt lót lá chuối.
    doneText: Xong — bẻ một khúc chấm muối vừng liền!
  - title: Giã muối vừng
    icon: spoon
    minutes: 10 phút
    bullets:
      - label: "Rang vừng:"
        text: >-
          Rang lửa nhỏ, **đảo liên tục** tới khi hạt vừng nổ lách tách và ngả
          vàng. Đổ ra dĩa cho nguội ngay, để trong chảo nóng là cháy tiếp.
      - label: "Rang muối:"
        text: >-
          Rang khô muối hột chừng [[2|phút]] cho bay hết ẩm — muối ẩm giã ra
          bết lại thành cục.
      - label: "Giã:"
        text: >-
          Giã muối trước cho nhỏ, rồi mới cho vừng vào **giã thô** — chỉ giã tới
          khi chừng nửa số hạt vỡ ra là dừng. Giã nhuyễn hết thì ra bột, mất
          cái bùi.
    callout:
      type: tip
      text: >-
        Thêm nắm **lạc rang giã thô** vào chén muối vừng là đổi hẳn: bùi hơn,
        đậm hơn, và hợp với thỏi cơm nhạt hơn hẳn muối vừng không.

tipsTitle: 4 chỗ **quyết định** ống cơm lam
tips:
  - icon: stem
    title: Ống bánh tẻ, không non không già
    text: >-
      **Ống non** mỏng và nhiều nước, nướng một lúc là nứt toác. **Ống già** thì
      dày, khô, lớp màng lụa bên trong đã cứng lại nên không dính vào cơm và
      cũng không còn nước ngọt để nhả. Ống **bánh tẻ** — vỏ xanh còn tươi, bấm
      móng tay thấy hơi ăn vào — là chỗ vừa.
  - icon: drop
    title: Nước xâm xấp, đừng nhiều hơn
    text: >-
      Nếp đã ngâm 6 tiếng thì đã no nước sẵn, chỉ cần thêm chút cho đủ hấp. Đổ
      nước nhiều là thỏi cơm **nhão và bết**, mà trong ống thì nước không có chỗ
      bay hơi như trong nồi. Cao hơn mặt gạo một đốt ngón tay là đủ.
  - icon: alert
    title: Đừng gọt tới lớp màng trắng
    text: >-
      Lỗi hay gặp nhất lúc chẻ ống: gọt hăng tay tới mức bóc luôn lớp màng lụa.
      Thỏi cơm mất áo thì **khô mặt rất nhanh** và cầm dính tay. Gọt tới khi
      thấy trắng thì buông dao.
  - icon: flame
    title: Than hồng, tuyệt đối không lửa ngọn
    text: >-
      Chỗ này người mới hay sốt ruột: thấy lâu quá bèn thổi cho bùng lửa lên.
      Lửa ngọn đốt thủng vỏ ống trong vài phút, nước chảy ra hết mà lõi cơm vẫn
      sống. Cơm lam là món của **thời gian và bàn tay xoay đều**, không phải của
      lửa to.

serve:
  title: Bẻ tay mà ăn — **đừng dọn ra chén**
  paras:
    - >-
      Cơm lam dọn nguyên khúc trên mẹt lót lá chuối, ai ăn thì bẻ. Xới ra chén
      như cơm trắng là mất hết — cái thú của món nằm ở chỗ cầm khúc cơm còn ấm,
      bẻ ra thấy hạt nếp dẻo rời, chấm vào chén muối vừng rồi cắn.
    - >-
      Ăn không thì nhạt, nên trên mâm nên có thứ mặn đi kèm: miếng **thịt nướng**,
      con **cá nướng**, hay chén **chẩm chéo** cay. Ở vùng cao người ta bày cả
      ba, và cơm lam đóng đúng vai cơm — nền cho mọi thứ khác.
  aside:
    title: Trên mẹt nên có
    intro: "Ba thứ đi cùng, chọn ít nhất một:"
    items:
      - icon: jar
        text: "**Muối vừng** — giã thô, thêm lạc rang thì càng bùi."
      - icon: chili
        text: "**Chẩm chéo** — lối chấm của người Thái, cay và dậy mùi mắc khén."
      - icon: meat
        text: "**Thịt hoặc cá nướng** — cơm lam là nền, cần một thứ mặn đứng cạnh."

faq:
  - q: Mua ống nứa ở đâu?
    a: >-
      Đây là chỗ khó nhất của món, và cũng là món hiếm hoi trên site cần thứ
      **không phải chợ nào cũng có**. Hỏi hàng lá dong, hàng đồ gói bánh ngoài
      chợ — mùa nào cũng thường có ống tre nứa bán kèm; các hàng đặc sản vùng cao
      cũng bán ống chặt sẵn theo bó. Nhà có bụi tre thì chặt ống bánh tẻ là xong.
  - q: Không có ống tre thì làm kiểu gì?
    a: >-
      Có cách thay, và nói thẳng là **không giống bản gốc** — mất mùi tre và mất
      lớp màng lụa, tức mất đúng hai thứ làm nên món. Nhưng vẫn ngon: gói nếp đã
      ngâm trong **lá chuối** thành thỏi dài chặt tay, bọc thêm một lớp giấy bạc,
      rồi nướng trên than hoặc nướng lò 200 °C chừng **50 phút**, lật vài lần.
      Thỏi cơm ra dáng và dẻo đúng kiểu, chỉ thiếu mùi.
  - q: Ống nứa dùng lại được không?
    a: >-
      Không. Nướng xong lớp vỏ đã cháy giòn và lớp màng bên trong đã dính hết
      vào thỏi cơm — ống chỉ dùng đúng một lần. Đó vốn là ý của món: cái nồi
      dùng một lần, nấu xong bỏ lại.
  - q: Cơm lam để được bao lâu?
    a: >-
      Còn nguyên trong ống thì để được **1–2 ngày** ở nơi thoáng, ăn lại vẫn
      dẻo. Đã chẻ ra rồi thì nên ăn trong ngày, vì mặt cơm khô rất nhanh. Cơm
      để qua ngày muốn ăn lại thì **hấp cách thuỷ vài phút**, đừng quay lò —
      quay lò là thỏi cơm cứng đanh.

