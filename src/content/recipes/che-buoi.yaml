title: Chè bưởi **giòn sần sật, béo nước cốt dừa**
summary: >-
  Lớp trắng dày dưới vỏ bưởi đem bóp muối cho hết the, áo bột năng rồi luộc —
  ra những **khối trong veo, giòn sần sật**, nằm cùng đậu xanh bở tơi trong nước
  đường lá dứa, chan muỗng nước cốt dừa mặn nhẹ.
region: Miền Tây
category: Chè
occasions: [Ăn chơi, Đãi khách]
