quick:
  ingredients:
    - >-
      **Cùi bưởi** [[400|g]] — cùi là **lớp trắng dày nằm giữa vỏ xanh và múi**;
      gọt **sạch trơn lớp vỏ xanh** rồi mới lấy phần trắng đó
    - Muối hột [[3|muỗng canh]] để bóp cùi · đường [[250|g]] · lá dứa [[4|lá]]
    - Đậu xanh cà vỏ [[120|g]] — ngâm 3 tiếng
    - "Bột năng [[150|g]]: [[100|g]] áo cùi bưởi · [[50|g]] khuấy sánh nồi chè"
    - "Nước cốt dừa [[250|ml]] · muối [[0.25|muỗng cà phê|frac]] · bột năng [[1|muỗng cà phê]]"
    - Dừa nạo sợi + đậu phộng rang giã thô — rắc mặt ly
  steps:
    - Gọt **kiệt lớp vỏ xanh**, cắt cùi hạt lựu [[1|cm]] — sót vỏ xanh là ly chè the tới cuối.
    - Bóp cùi với muối hột, xả nước, **vắt kiệt — làm đủ 4 lượt**, nếm thấy hết đắng mới thôi.
    - Trụng nước sôi 1 phút, xả nước lạnh, vắt thật ráo rồi **ướp [[80|g]] đường 20 phút** cho cùi trong.
    - Áo cùi qua bột năng, rũ bớt, **luộc tới khi miếng nào cũng nổi lên** rồi vớt qua nước lạnh.
    - Đậu xanh hấp chín bở mà **còn nguyên hạt**, đừng nấu nát thành cháo.
    - Nấu nước đường + lá dứa, khuấy bột năng pha loãng cho **sánh như hồ lỏng**, thả cùi + đậu vào.
    - Nước cốt dừa nấu riêng với muối + chút bột năng cho hơi sệt. Múc chè, chan cốt dừa, rắc dừa nạo và đậu phộng.
  warning: >-
    Ly chè bị **the và đắng** gần như luôn luôn do hai chỗ: gọt còn sót vỏ xanh,
    hoặc bóp muối mới 1–2 lượt đã thấy mỏi tay. Cứ nếm thử một miếng sống —
    hết đắng mới được đem áo bột.

flavor:
  chua: 0
  ngot: 8
  man: 1.5
  cay: 0
  thom: 7
flavorNote: >-
  **Chuẩn ly chè:** miếng cùi bưởi **trong như thạch, cắn nghe sần sật** rồi mềm ra chứ
  không dai nhách, nước chè sánh nhẹ chảy được chứ không đặc quánh, và cốt dừa
  phải **mặn nhẹ** — chính chỗ mặn đó mới làm ly chè ngọt mà không gắt.
storyEyebrow: Chuyện ly chè bưởi
storyTitle: Món chè sinh ra từ **thứ người ta bỏ đi**
story:
  - >-
    Ăn bưởi thì ai cũng chỉ lấy múi rồi quăng vỏ. Cái **cùi** — lớp trắng dày
    cui nằm giữa vỏ xanh và múi — vừa xốp vừa the, chẳng ai ngó tới. Cho tới
    khi có người nghĩ ra chuyện bóp muối cho nó nhả hết vị the, áo bột năng rồi
    luộc lên: miếng cùi **trong vắt, giòn sần sật**, ngọt lịm nước đường.
    Từ chỗ bỏ đi thành món chè có tên tuổi khắp miền Nam.
  - >-
    Nên nói thẳng: đây là món **lấy công làm lãi**. Nguyên liệu rẻ tới mức buồn
    cười, nhưng khâu khử the thì không có đường tắt — bóp muối, xả, vắt, làm đi
    làm lại. Ai làm tắt khúc này thì ly chè nhìn y hệt mà đưa lên miệng là biết
    liền. Bù lại, làm đúng một lần rồi thì lần sau nhắm mắt cũng ra.
  - >-
    Ở nhà cứ nấu nguyên nồi lớn để tủ lạnh, chiều nào nóng múc một ly, chan cốt
    dừa, rắc nắm đậu phộng rang. Cắn miếng cùi bưởi sựt sựt, mát miệng — hiểu
    liền vì sao xứ miệt vườn thương món này tới vậy. Nhà nào có gốc bưởi trước
    sân thì món này gần như **không tốn tiền nguyên liệu chính**.

