flavorNote: >-
  **Chuẩn vị:** cháo sánh nhẹ mà **còn nguyên hạt gạo**, mặt tô nổi màu vàng
  cam của nghệ và dầu điều. Miếng lươn **săn chắc, tước sợi chứ không nát**,
  cay ấm lẫn mùi hành tăm nồng rất riêng.
storyEyebrow: Chuyện tô cháo lươn
storyTitle: Cháo xứ Nghệ nấu **ngược với mọi nồi cháo khác**
story:
  - >-
    Cháo ở phần lớn vùng miền nấu càng nhuyễn càng được, có nơi còn giã gạo
    hoặc xay cho mịn. Xứ Nghệ làm ngược lại: gạo tẻ trộn chút nếp, **ninh
    nguyên hạt** cho tới khi hạt nở bung ra như cánh hoa mà vẫn giữ hình. Húp
    một muỗng là thấy rõ từng hạt gạo trong miệng chứ không phải một thứ hồ
    trơn. Chính chỗ đó làm tô cháo lươn ở đây khác hẳn tô cháo lươn nấu nơi
    khác.
  - >-
    Thứ thứ hai làm nên món này là **hành tăm** — người trong vùng còn gọi là
    củ nén. Củ nhỏ xíu cỡ đầu ngón tay, vỏ trắng hoặc tím nhạt, mùi nồng gắt
    hơn hành tím rất nhiều. Đồng đất miền Trung trồng được thứ này, và bếp ở
    đây dùng nó gần như trong mọi món có cá có lươn. Phi hành tăm lên rồi trút
    lươn vào xào là ra đúng cái mùi mà người xa quê nhắc tới đầu tiên khi nói
    về tô cháo lươn.
  - >-
    Còn con lươn thì có luật riêng: **gỡ thịt bằng tay chứ không đụng dao**.
    Người bán hàng lâu năm luộc lươn xong, đợi nguội bớt rồi dùng tay tước dọc
    theo mình lươn, thịt ra thành từng sợi dài còn nguyên thớ. Dao thái thì
    miếng lươn đứt ngang, xào lên là nát vụn lẫn vào cháo. Ba điều — **hạt gạo
    nguyên, hành tăm, lươn tước sợi** — gộp lại thành tô cháo mà buổi sáng ở
    Vinh hàng nào cũng bán và hàng nào cũng có người xếp hàng.

