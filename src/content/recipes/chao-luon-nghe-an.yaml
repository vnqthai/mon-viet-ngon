title: Cháo lươn Nghệ An **hạt gạo nở bung, lươn vàng ruộm cay ấm**
summary: >-
  Tô cháo xứ Nghệ nấu theo lối riêng: **gạo ninh nguyên hạt cho nở bung chứ
  không xay nhuyễn**, lươn đồng gỡ sợi xào với **hành tăm và nghệ** tới vàng
  ruộm, cay lẫn trong từng muỗng. Sáng ra làm một tô, kèm đĩa **bánh mướt** —
  thứ bánh cuốn không nhân của xứ Nghệ — là no tới trưa.
