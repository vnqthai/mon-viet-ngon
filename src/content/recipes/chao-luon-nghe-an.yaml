stepsEyebrow: Vô bếp thôi!
stepsTitle: 6 bước ra **tô cháo lươn xứ Nghệ**
stepsLead: >-
  Nồi cháo và chảo lươn đi hai đường riêng rồi mới gặp nhau lúc múc ra tô —
  đó là điểm khác lớn nhất so với các loại cháo nấu chung một nồi. Việc mất
  thời gian nhất là **làm sạch lươn**, còn việc dễ sai nhất là **canh nồi
  cháo đừng cho nát**.
steps:
  - title: Làm sạch lươn
    icon: knife
    minutes: 20 phút
    intro: "Con lươn sạch nhớt hay không quyết định tô cháo tanh hay thơm:"
    bullets:
      - label: "Xóc muối:"
        text: >-
          Cho lươn vào thau, rắc [[2|thìa canh|frac]] muối hột và vắt
          [[2|trái]] chanh, **đậy nắp xóc mạnh** vài phút cho ra hết nhớt.
      - label: "Rửa kỹ:"
        text: >-
          Rửa lại **4–5 lần nước** tới khi sờ vào thân lươn thấy ráo, không
          còn trơn tay.
      - label: "Mổ bụng:"
        text: >-
          Mổ bỏ ruột, cạo sạch phần máu đọng dọc sống lưng — chỗ máu đọng này
          là nguồn mùi tanh còn sót lại nhiều nhất.
    callout:
      type: tip
      text: >-
        Mua được lươn còn sống thì nhờ hàng làm sẵn tại chỗ cho nhanh. Nếu tự
        làm ở nhà, **cho lươn vào thau rồi đậy nắp ngay** trước khi rắc muối —
        lươn gặp muối sẽ quẫy rất mạnh.
  - title: Luộc lươn, gỡ thịt bằng tay
    icon: pot
    minutes: 20 phút
    bullets:
      - text: >-
          Xếp lươn vào nồi, châm nước xâm xấp, thả gừng đập dập và ít nghệ,
          luộc **10 phút** từ lúc sôi.
      - text: >-
          Vớt ra để nguội bớt, rồi **dùng tay tước dọc theo mình lươn** thành
          sợi dài. Bỏ xương sống, giữ lại phần thịt lưng và bụng.
      - text: >-
          Xương, đầu và đuôi đem **giã dập rồi lọc qua rây** với chính nước
          luộc — được nồi nước ngọt để ninh cháo.
      - text: >-
          Ướp thịt lươn với [[1|thìa canh|frac]] nước mắm, chút tiêu, để
          [[15|phút]].
    callout:
      type: warn
      text: >-
        **Đừng thái lươn bằng dao.** Thái ngang thớ thì miếng lươn đứt vụn,
        xào lên nát lẫn vào cháo. Tước bằng tay theo chiều dọc mới ra sợi dài
        còn nguyên thớ — đây là chi tiết nhận ra tô cháo nấu đúng kiểu.
    timer:
      secs: 600
      label: Hẹn giờ luộc lươn · 10:00
      doneMsg: Vớt ra để nguội rồi gỡ thịt nghen!
  - title: Ninh cháo — nguyên hạt, nở bung
    icon: rice
    minutes: 50 phút
    bullets:
      - text: >-
          Vo gạo **nhẹ tay một lượt** rồi để ráo. Trộn [[200|g]] gạo tẻ với
          [[50|g]] gạo nếp.
      - text: >-
          Cho gạo vào nồi nước lọc xương lươn (thêm nước cho đủ **[[2|lít]]**),
          đun sôi rồi hạ liu riu.
      - text: >-
          Ninh **45–50 phút**, thỉnh thoảng khuấy nhẹ từ đáy lên cho khỏi khê.
          Đạt là khi hạt gạo **nở bung ra mà vẫn nhìn rõ hình hạt**.
      - text: >-
          Nêm chút muối và nước mắm, thêm mỡ hành tím phi cho thơm. Cháo đặc
          quá thì châm nước sôi, đừng châm nước lạnh.
    callout:
      type: warn
      text: >-
        Khuấy nhiều quá thì hạt gạo vỡ ra thành hồ, đúng cái phải tránh. **Chỉ
        khuấy khi thấy đáy nồi có nguy cơ khê**, mỗi lần một vòng nhẹ rồi thôi.
    timer:
      secs: 2700
      label: Hẹn giờ ninh cháo · 45:00
      doneMsg: Nếm thử — hạt gạo nở bung là được!
  - title: Phi hành tăm, xào lươn
    icon: flame
    minutes: 12 phút
    intro: "Bước cho ra mùi và màu đặc trưng của món:"
    bullets:
      - label: "Phi hành tăm:"
        text: >-
          Bóc vỏ [[50|g]] hành tăm, băm nhỏ, phi với dầu nóng tới **vàng và
          dậy mùi nồng** — chừng 1–2 phút, đừng để cháy.
      - label: "Xào lươn:"
        text: >-
          Trút thịt lươn vào đảo lửa lớn, cho **nước nghệ + [[2|thìa
          canh|frac]] dầu điều + [[1|thìa cà phê|frac]] ớt bột**, đảo đều cho
          bám màu.
      - label: "Rim thấm:"
        text: >-
          Hạ lửa, nêm nước mắm, rim thêm **3–4 phút** cho sợi lươn săn lại và
          ngấm màu vàng cam.
    callout:
      type: tip
      text: >-
        Xào lươn **riêng ra chảo chứ đừng thả vào nồi cháo**. Thả vào nồi thì
        sợi lươn nát ra và cháo ngả màu đục; xào riêng thì lúc múc tô mới xếp
        lên mặt, nhìn rõ màu và giữ được thớ.
  - title: Ráp tô, rắc rau răm
    icon: bowl
    minutes: 5 phút
    bullets:
      - text: >-
          Múc cháo nóng ra tô, **xếp lươn xào lên mặt** chứ không trộn sẵn.
      - text: >-
          Rắc rau răm thái nhỏ, hành lá, ngò, rồi **rắc tiêu dày tay**.
      - text: >-
          Chan thêm một muỗng dầu điều còn lại trong chảo lên mặt tô cho màu
          đẹp và thơm.
      - text: >-
          Người ăn tự trộn đều lươn vào cháo — trộn tại bàn thì mùi hành tăm
          bốc lên đúng lúc.
    doneText: Bưng ra bàn — xong!
  - title: Dọn kèm bánh mướt
    icon: plate
    minutes: 5 phút
    intro: "Bánh mướt là bánh cuốn không nhân của xứ Nghệ — mua sẵn ngoài hàng:"
    bullets:
      - text: >-
          Bánh mướt cuộn sẵn xếp ra đĩa, rắc chút hành phi.
      - text: >-
          Cách ăn quen thuộc nhất là **gắp bánh mướt chấm vào tô cháo** hoặc
          chấm nước mắm ớt, ăn xen với từng muỗng cháo.
      - text: >-
          Ngoài vùng khó mua thì thay bằng **bánh ướt bán sẵn ngoài chợ** —
          gần nhất về kết cấu; hoặc bánh mì, cũng hợp, chỉ là khác vùng.
    doneText: Xong — mời cả nhà!

tipsTitle: 6 điều làm nên **tô cháo lươn đúng kiểu xứ Nghệ**
tipsLead: >-
  Cháo lươn nấu ở đâu cũng có, nhưng nấu theo lối xứ Nghệ thì chỉ khác vài
  điểm — mà điểm nào cũng dễ bỏ sót.
tips:
  - icon: rice
    title: Hạt gạo nở bung, đừng xay
    text: >-
      Đây là điểm nhận dạng số một. Gạo **ninh nguyên hạt 45–50 phút** cho nở
      bung như cánh hoa mà vẫn còn hình hạt. Cách giữ cho được: vo nhẹ tay,
      lửa liu riu, và **hạn chế khuấy**. Cháo xay nhuyễn thành hồ là đã sang
      món khác.
  - icon: onion
    title: Hành tăm, không phải hành tím
    text: >-
      Củ hành tăm nhỏ cỡ đầu ngón tay, mùi nồng gắt hơn hành tím nhiều, và
      chính nó tạo ra mùi mà người xứ Nghệ nhận ra ngay. Chợ ngoài Bắc và
      miền Trung có bán, ở nơi khác thì tìm ở hàng đồ khô. **Không có thì cứ
      dùng hành tím**, nhưng biết là tô cháo sẽ thiếu một tầng mùi.
  - icon: knife
    title: Tước tay, không thái dao
    text: >-
      Lươn luộc xong để nguội bớt rồi **tước dọc theo thớ bằng tay** thành
      sợi dài. Sợi lươn tước tay xào lên vẫn săn và còn nguyên thớ; miếng
      thái dao thì đứt ngang, đảo vài cái là nát.
  - icon: flame
    title: Xào riêng, xếp lên mặt tô
    text: >-
      Lươn và cháo gặp nhau ở tô chứ không gặp trong nồi. Xào riêng thì giữ
      được **màu vàng cam và thớ thịt**, cháo cũng trong. Trộn sẵn cả nồi thì
      sau mươi phút là lươn nát và cả tô ngả một màu đục.
  - icon: pepper
    title: Cay và tiêu, rắc dày tay
    text: >-
      Tô cháo lươn xứ Nghệ **cay rõ** chứ không cay nhẹ, và tiêu thì rắc
      nhiều hơn ta quen. Nhà có trẻ nhỏ thì nấu nhạt cay rồi **để chén ớt bột
      riêng** cho người lớn tự thêm, giữ nguyên phần tiêu.
  - icon: drop
    title: Đừng bỏ xương lươn
    text: >-
      Xương, đầu và đuôi lươn **giã dập rồi lọc lấy nước** để ninh cháo —
      đó là chỗ ngọt nhất còn lại. Bỏ đi thì phải bù bằng nước xương heo,
      mà nước xương heo cho vị khác, tô cháo mất cái ngọt thanh của lươn.

serve:
  title: Tô cháo buổi sáng — **húp nóng, ăn chậm**
  paras:
    - >-
      Ở xứ Nghệ đây là **món của buổi sáng**: hàng dọn từ tờ mờ, tô cháo nóng
      với đĩa bánh mướt, ăn xong là đi làm đi học. Nấu ở nhà thì cứ ninh nồi
      cháo từ tối, sáng ra hâm lại và xào chảo lươn là kịp bữa sáng cả nhà.
    - >-
      Cháo lươn cũng là món **dễ chiều đứa nhỏ**: sợi lươn mềm, cháo dễ húp.
      Nhà có bé thì để riêng một tô trước khi cho ớt, bớt tiêu và rau răm, xé
      sợi lươn nhỏ hơn chút là vừa miệng.
    - >-
      Ăn kèm chuẩn nhất vẫn là **bánh mướt** — nói gọn thì đó là **bánh cuốn
      không nhân**: bột gạo tẻ tráng mỏng trên tấm vải căng miệng nồi hơi rồi
      cuộn lại, mềm và trắng ngần. Gắp một cuộn chấm vào tô cháo, xen với từng
      muỗng cháo nóng, là cách ăn quen thuộc nhất của vùng này.
  aside:
    title: Trên bàn cháo lươn
    intro: "Mấy thứ nên có sẵn:"
    items:
      - icon: plate
        text: "**Đĩa bánh mướt** — cuộn sẵn, rắc hành phi."
      - icon: herb
        text: "**Chén rau răm thái nhỏ** — ai ghiền tự rắc thêm."
      - icon: chili
        text: "**Chén ớt bột hoặc ớt tươi** — để riêng cho nhà có trẻ nhỏ."
      - icon: pepper
        text: "**Hũ tiêu xay** — rắc dày tay hơn bình thường."

faq:
  - q: Không mua được hành tăm thì thay bằng gì?
    a: >-
      Hành tím là thứ gần nhất, nhưng phải biết là **mùi sẽ khác rõ**: hành
      tăm nồng và sắc hơn nhiều, đó chính là mùi làm nên bản sắc tô cháo này.
      Nếu thay thì dùng chừng [[4|củ]] hành tím băm nhỏ và phi kỹ hơn cho dậy
      mùi. Hàng đồ khô và chợ miền Trung thường có hành tăm, mua một lần để
      ngăn mát dùng được lâu.
  - q: Lươn nuôi nấu được không?
    a: >-
      Được, chỉ là thịt bở hơn và ít ngọt hơn lươn đồng. Chỉnh lại hai chỗ:
      **luộc rút còn 7–8 phút** kẻo thịt rã khi tước, và xào lửa lớn hơn cho
      sợi lươn săn lại. Nhận ra lươn đồng qua màu — **lưng nâu sẫm, bụng
      vàng**, mình thon; lươn nuôi mập và màu nhợt hơn.
  - q: Vì sao cháo của mình bị nát thành hồ?
    a: >-
      Thường do ba lỗi: vo gạo quá kỹ làm gãy hạt, **khuấy nhiều quá**, hoặc
      để lửa lớn cho sôi bùng. Nồi cháo này cần lửa liu riu và gần như không
      đụng tới, chỉ khuấy khi sợ khê đáy. Đã nát rồi thì không dựng lại được,
      nhưng vẫn ăn ngon — chỉ là mất đúng cái nét của xứ Nghệ.
  - q: Nấu trước được phần nào?
    a: >-
      Gần như tất cả. **Nồi cháo** nấu tối hôm trước, để nguội cất ngăn mát
      2 ngày; sáng hâm lại, châm nước sôi cho loãng ra vì để lạnh cháo sẽ đặc
      lại. **Lươn xào** cũng để được 2 ngày, hâm nóng trên chảo là xong. Chỉ
      có rau răm và hành lá thì thái sát giờ.
  - q: Cháo bị tanh thì chữa sao?
    a: >-
      Tanh gần như luôn đến từ khâu làm lươn: **chưa xóc muối kỹ**, chưa cạo
      hết máu đọng dọc sống lưng, hoặc luộc mà quên gừng. Chữa tại chỗ bằng
      cách phi thêm hành tăm với gừng băm rồi trút vào chảo lươn, rắc thêm
      tiêu và rau răm. Lần sau thì xóc muối hột với chanh cho tới khi sờ thấy
      ráo tay hẳn.
  - q: Cháo lươn Nghệ An khác cháo lươn nơi khác chỗ nào?
    a: >-
      Ba chỗ. **Hạt gạo để nguyên, ninh nở bung** chứ không xay nhuyễn như
      cháo miền Nam. **Hành tăm** thay cho hành tím. Và **lươn xào riêng xếp
      lên mặt tô** với màu vàng cam của nghệ và dầu điều, thay vì nấu chung
      vào nồi. Ăn kèm cũng khác — ở đây là đĩa bánh mướt chứ không phải quẩy.

