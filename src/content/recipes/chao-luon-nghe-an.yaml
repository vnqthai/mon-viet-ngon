quick:
  ingredients:
    - Lươn đồng [[600|g]] — con thon, lưng nâu bụng vàng, còn sống là tốt nhất
    - Gạo tẻ [[200|g]] + gạo nếp [[50|g]] — **để nguyên hạt, không xay**
    - Hành tăm [[50|g]] — **củ nhỏ cỡ đầu ngón tay, nồng hơn hành tím**, còn gọi là củ nén
    - Nghệ tươi [[1|củ]] hoặc bột nghệ · dầu điều [[2|thìa canh|frac]]
    - Ớt bột [[1|thìa cà phê|frac]] · tiêu · nước mắm
    - Rau răm · hành lá · ngò · bánh mướt (bánh cuốn không nhân) ăn kèm
  steps:
    - Xóc lươn với **muối hột + nước cốt chanh** cho sạch nhớt, rửa lại nhiều lần.
    - Luộc lươn với gừng và ít nghệ chừng **10 phút**, vớt ra để nguội.
    - "**Gỡ thịt bằng tay**, tước dọc thành sợi; xương và đầu đem giã, lọc lấy nước."
    - Ninh gạo với nước lọc xương lươn **45–50 phút** tới khi hạt nở bung mà chưa nát.
    - Phi **hành tăm** cho vàng thơm, trút lươn vào xào với nghệ, dầu điều, ớt bột.
    - Múc cháo ra tô, xếp lươn xào lên mặt, rắc rau răm, hành lá, tiêu.
  warning: >-
    **Đừng xay cháo nhuyễn.** Cháo lươn xứ Nghệ đúng kiểu là hạt gạo **nở bung
    mà vẫn còn hình hạt**, húp lên thấy rõ từng hạt. Xay nhuyễn thành hồ là ra
    một món khác hẳn.

flavor:
  chua: 0.5
  ngot: 5
  man: 6
