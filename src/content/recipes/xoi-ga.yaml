quick:
  ingredients:
    - Nếp [[500|g]] — ngâm **6 giờ** với [[1|muỗng cà phê]] muối
    - Đùi gà hoặc ức gà [[500|g]] · gừng [[1|nhánh]] · hành tím [[4|củ]]
    - "Mỡ hành: hành lá [[1|bó]] · dầu ăn [[4|muỗng canh]] · muối, đường"
    - Hành phi [[3|muỗng canh]] · nước mắm [[2|muỗng canh]] · đường [[1|muỗng canh]]
    - Đồ chua ăn kèm — cà rốt và củ cải bào sợi, ngâm giấm đường
  steps:
    - Ngâm nếp **6 giờ**, vo lại, để **ráo 15 phút** rồi hấp **35–40 phút**.
    - >-
      Luộc gà với gừng và hành tím đập dập **20 phút**, tắt bếp ủ thêm 10 phút,
      vớt ra ngâm nước đá.
    - Xé thịt **dọc thớ** thành sợi dài, ướp chút nước mắm đường cho đậm.
    - >-
      Làm mỡ hành: hành lá thái nhỏ, rắc muối đường, chan dầu nóng già lên cho
      xèo.
    - Xới xôi ra đĩa, phủ gà xé, rưới mỡ hành, rắc hành phi, dọn kèm đồ chua.
  warning: >-
    Luộc gà sôi sùng sục là thịt **co lại và khô xác**, xé ra vừa vụn vừa nhạt.
    Nước phải giữ ở mức **sôi lăn tăn**, thấy nổi bọt to là hạ lửa ngay.

flavor:
  chua: 2
