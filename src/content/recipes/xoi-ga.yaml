title: Xôi gà **thịt xé sợi phủ kín mặt, rưới mỡ hành**
summary: >-
  Đĩa xôi trắng dẻo phủ kín **thịt gà xé sợi vàng nhạt**, rưới mỡ hành xanh
  bóng và rắc hành phi giòn. Gà luộc vừa chín rồi xé tay dọc thớ nên sợi dài và
  còn ngọt nước, không tơi vụn như xé bằng nĩa.
