flavorNote: >-
  **Chuẩn hũ:** viên cơm **còn nguyên hình**, bấm vào mềm mà không nát thành
  bột; nước tiết ra **trong, hơi sánh**, nếm thấy ngọt trước rồi cay nồng nhẹ
  dâng lên mũi; ngửi thơm mùi men chứ không chua gắt.
storyEyebrow: Chuyện món ăn
storyTitle: Cùng nắm nếp, **ba miền làm ra ba thứ khác nhau**
story:
  - >-
    Cơm rượu là món của **mùng 5 tháng 5** — Tết Đoan Ngọ — và là một trong số
    ít món Việt mà cả ba miền đều làm, mỗi nơi một kiểu, khác nhau tới mức đặt
    cạnh nhau khó nhận ra là họ hàng.
  - >-
    **Miền Nam** vo thành **viên tròn** như quả quất, mỗi viên quấn một dải lá
    chuối, ủ xong ngập trong nước ngọt — múc ra chén ăn bằng muỗng, ngọt nhiều
    và mềm. **Miền Bắc** gọi là **rượu nếp**, để **nguyên hạt rời**, gần như
    không có nước, vị nhạt hơn mà mùi men nồng hơn, thường làm bằng nếp lứt hoặc
    nếp cẩm. **Miền Trung** thì ép thành **khối vuông** rồi cắt thành miếng.
  - >-
    Ba kiểu ấy đều chạy trên cùng một nguyên lý: men ăn tinh bột của hạt nếp và
    đổi nó thành đường, rồi đổi tiếp một phần đường thành rượu. Vậy nên vị của
    hũ cơm rượu **thay đổi từng ngày** — ngày thứ hai còn ngọt gắt, ngày thứ ba
    vừa, để tới ngày thứ năm là cay rõ và bớt ngọt. Ăn ngày nào là chuyện khẩu
    vị, không có ngày nào sai.
  - >-
    Trên site này cơm rượu được xếp vào nhóm **Chè** — cùng chỗ với chè bưởi, chè
    bà ba. Đúng chỗ của nó: món ngọt, ăn bằng muỗng, dọn ngoài bữa cơm. Chỉ khác
    một điều so với mấy nồi chè kia — cái ngọt ở đây **không do mình nấu**, mà
    do men làm ra trong ba ngày mình không đụng tới.

