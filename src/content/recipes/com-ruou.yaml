title: Cơm rượu **viên nếp ủ men, ngâm nước ngọt cay**
summary: >-
  Xôi nếp để nguội âm ấm, rắc **men ngọt** rồi vo thành từng viên tròn, ủ ba
  ngày cho tiết nước. Múc ra chén, viên cơm mềm dẻo nằm trong thứ nước **ngọt
  thanh, cay nồng nhẹ** do chính nó tự làm ra.
region: Miền Nam
category: Chè
occasions: [Ăn chơi, Cỗ Tết]
pubDate: 2026-07-31
time:
  total: 4 ngày (ủ men) — bắt tay làm chừng 1 giờ
  active: 1 giờ
servingsBase: 6
difficulty: Vừa
featured: false
