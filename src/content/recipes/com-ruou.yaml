heroEyebrow: Hũ thuỷ tinh để góc bếp, ngày thứ ba…

quick:
  ingredients:
    - Nếp [[600|g]] — nếp trắng, hoặc **nếp cẩm** cho màu tím
    - Men ngọt [[3|viên]] — loại men làm cơm rượu, mua ở hàng khô ngoài chợ
    - Lá chuối [[3|tàu]] — lót hũ và quấn quanh viên
    - Đường [[150|g]] — nấu với nước cơm rượu tiết ra
    - Muối [[1|muỗng cà phê|frac]] — xóc vào nếp lúc đồ xôi
  steps:
    - Ngâm nếp **6 tiếng**, đồ thành xôi, dàn ra mâm cho nguội **âm ấm**.
    - Giã men thật mịn, **rây đều** hai mặt xôi. Chia hai lượt cho khỏi sót chỗ.
    - Vo viên tròn cỡ quả quất, quấn dải lá chuối quanh thân từng viên.
    - Xếp vào hũ lót lá chuối, đậy hờ, ủ **3 ngày** nơi ấm, kê hứng nước.
    - Gạn nước tiết ra, nấu với đường, để nguội rồi đổ lại, ủ thêm 1 ngày.
  warning: >-
    Rắc men lúc xôi còn nóng là **men chết**, ủ mấy ngày cũng không lên — mẻ đó
    chua thiu rồi bỏ. Sờ tay vào xôi thấy **âm ấm như nước tắm** mới được rắc.

flavor:
  chua: 3
