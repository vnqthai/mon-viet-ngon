flavorNote: >-
  **Chuẩn bát canh cua:** nước trong ngọt lịm **vị cua tự nhiên** (không
  phải vị bột nêm), riêu **kết tảng chắc** vàng óng gạch, rau xanh mượt
  còn độ nhớt mát đặc trưng — húp tới đâu mát ruột tới đó.
storyEyebrow: Chuyện bát canh
storyTitle: Bát canh **trưa hè** của Bắc bộ
story:
  - >-
    Chưa có quạt máy điều hòa, người Bắc bộ chống chọi trưa hè bằng… một
    bát canh: **canh cua rau đay ăn với cà pháo muối**. Đi chợ sớm xách
    túi cua đồng còn sủi bọt, trưa về cả nhà ngồi quanh mâm, chan muỗng
    canh ngọt mát vào bát cơm, cắn quả cà giòn tan — nắng nôi ngoài kia
    bỗng dưng... đỡ ghét hẳn.
  - >-
    Cái quý của canh cua là **ngọt thật**: ngọt từ thịt cua đồng giã lọc,
    không cần viên nêm nào cả. Kỳ diệu nhất là lúc nấu — thịt cua đang tan
    trong nước, gặp nóng bỗng **kết lại thành tảng riêu** nổi lên như đám
    mây, được rưới thêm lớp gạch chưng hành vàng óng. Nhà nào nấu khéo,
    tảng riêu dày chắc là được khen "đảm" ngay.
  - >-
    Món này giờ nấu dễ hơn xưa nhiều: hàng cua ngoài chợ **xay sẵn, khều
    gạch để riêng** cho mình, về chỉ việc lọc và nấu. Chỉ xin giữ đúng một
    nếp cũ: canh cua **nấu bữa nào ăn hết bữa đó** — và đừng bao giờ quên
    hũ cà pháo, thiếu nó bát canh cua như thiếu tri kỷ.

