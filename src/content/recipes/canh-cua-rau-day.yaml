quick:
  ingredients:
    - Cua đồng [[400|g]] — nhờ hàng cua **xay sẵn, xin túi gạch để riêng**
    - Rau đay [[1|bó]] + mồng tơi [[1|bó]] — nhặt lá, thái nhỏ
    - Mướp hương [[1|trái]] — gọt vỏ, cắt miếng vát
    - Hành khô [[2|củ]] thái lát — phi thơm chưng gạch
    - "Nêm: muối [[1|muỗng cà phê]] (cho vào lúc lọc) · nước mắm nhẹ tay · mắm tôm nửa muỗng cà phê (tùy nhà)"
    - "Ăn kèm: **cà pháo muối** + cơm trắng — bộ đôi định mệnh"
  steps:
    - Hòa cua xay với [[1.2|lít]] nước + [[1|muỗng cà phê]] muối, bóp kỹ, **lọc qua rây 2–3 lần** cho sạch sạn.
    - Phi hành khô thơm vàng, cho **gạch cua vô chưng** với chút nước mắm — múc ra chén để dành.
    - Bắc nồi nước cua **lửa vừa**, khuấy nhẹ một chiều; nước nóng già thì **ngừng khuấy** cho riêu kết tảng nổi lên, hạ lửa nhỏ.
    - Riêu nổi chắc thì gạt nhẹ về một góc, thả **mướp** nấu 2 phút.
    - Thả **rau đay + mồng tơi**, nêm nhẹ tay, sôi lại chừng 1 phút là tắt bếp — rau vừa chín tới, xanh mượt.
    - Rưới **gạch chưng hành** lên tảng riêu, dọn nóng với cà pháo và cơm trắng.
  warning: >-
    Riêu có kết thành tảng hay tan nát là ở một khoảnh khắc: nước **gần
    sôi là phải ngừng khuấy và hạ lửa** — để sôi bùng lên là riêu vỡ vụn,
    nước đục, coi như mất phần đẹp nhất của bát canh.

