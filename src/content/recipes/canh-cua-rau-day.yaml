title: Canh cua rau đay **riêu nổi tảng, mát lòng trưa hè**
summary: >-
  Nước cua đồng ngọt lịm với **tảng riêu vàng óng gạch chưng**, rau đay
  mồng tơi xanh mượt, mướp hương thơm dịu — bát canh trưa hè của Bắc bộ,
  ăn với cà pháo giòn tan là đắt cơm lạ lùng.
