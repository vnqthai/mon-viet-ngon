stepsEyebrow: Vô bếp thôi!
stepsTitle: 5 bước ra **bát canh riêu nổi tảng**
stepsLead: >-
  Canh cua chỉ có một khâu cần khéo là **lọc cua và canh lửa cho riêu
  kết** — nắm được nhịp đó rồi thì 40 phút ra bát canh ngọt lịm, tay nghề
  như các bà các mẹ.
steps:
  - title: Lọc cua — kỹ khâu này, ngọt cả nồi
    icon: drop
    minutes: 15 phút
    bullets:
      - label: "Hòa nước:"
        text: >-
          cho cua xay vô thau với [[1.2|lít]] nước + [[1|muỗng cà
          phê]] muối, **bóp kỹ 2–3 phút** cho thịt cua tan hết vào nước.
      - label: "Lắng & lọc:"
        text: >-
          để yên 1 phút cho vỏ vụn chìm xuống, gạn nước qua **rây lót vải
          xô** sang nồi; đổ thêm chút nước vô bã, bóp và lọc **lần 2–3**
          tới khi nước lọc trong, không còn sạn.
      - label: "Gạch cua:"
        text: túi gạch xin ở hàng cua để riêng ra chén nhỏ, lát nữa chưng.
    callout:
      type: warn
      text: >-
        Sờ đáy nồi nước lọc thấy **lợn cợn sạn là phải lọc thêm lần nữa** —
        húp canh mà "rạo" một cái là công cả nồi đổ sông. Muối cho vào từ
        bước này cũng chính là bí quyết giúp riêu kết tảng chắc.
  - title: Chưng gạch cua với hành phi
    icon: flame
    minutes: 5 phút
    bullets:
      - text: >-
          Chảo nhỏ, [[1.5|muỗng canh|frac]] dầu ăn (có mỡ nước càng thơm),
          phi **hành khô thái lát** tới vàng thơm.
      - text: >-
          Trút chén gạch cua vô, thêm **vài giọt nước mắm**, đảo nhẹ 1–2
          phút tới khi gạch **vàng óng dậy mùi** — múc ra chén để dành rưới
          mặt canh.
    callout:
      type: tip
      text: >-
        Đừng bỏ qua bước nhỏ này: gạch chưng hành chính là **màu và mùi
        "nhà giàu"** của bát canh cua — thiếu nó riêu nhợt màu, kém hẳn
        phần long trọng.
  - title: Nấu nước cua — đợi riêu kết tảng
    icon: pot
    minutes: 10 phút
    bullets:
      - text: >-
          Bắc nồi nước cua lên **lửa vừa**, dùng đũa **khuấy nhẹ một
          chiều** vài vòng lúc còn nguội — cho thịt cua không lắng dính
          đáy nồi.
      - text: >-
          Nước **nóng già, lăn tăn sắp sôi** thì ngừng khuấy hẳn, hạ lửa
          nhỏ — thịt cua bắt đầu kết bông, nổi dần lên thành **tảng riêu**.
      - text: >-
          Khi riêu nổi chắc thành mảng, lấy muôi **gạt nhẹ riêu gọn về một
          góc nồi** (hoặc múc nhẹ ra bát) cho khỏi vỡ khi thả rau.
    callout:
      type: warn
      text: >-
        Từ lúc nước nóng già, **tuyệt đối không khuấy, không để sôi
        bùng** — riêu đang kết mà bị "quậy" là tan nát, nước đục ngầu.
        Kiên nhẫn đứng cạnh nồi đúng 3–4 phút này thôi.
  - title: Thả mướp, rồi tới rau
    icon: herb
    minutes: 5 phút
    bullets:
      - text: Thả **mướp** vô trước, nấu chừng **2 phút** cho mềm ngọt.
      - text: >-
          Thả **rau đay + mồng tơi** thái nhỏ, nhấn nhẹ cho chìm, nêm
          nước mắm **nhẹ tay** (+ ½ muỗng cà phê mắm tôm nếu nhà quen vị).
      - text: >-
          Canh **sôi lại chừng 1 phút**, rau vừa chín tới xanh mượt là tắt
          bếp liền — nấu lâu rau nẫu vàng, mất giòn mất mát.
    callout:
      type: tip
      text: >-
        Canh cua nêm **nhạt hơn canh thường một chút** mới khôn — vị ngọt
        cua tự nhiên rất thanh, nêm đậm quá là "đè" mất, uổng công lọc kỹ.
    timer:
      secs: 120
      label: Hẹn giờ rau chín tới · 02:00
      doneMsg: Rau xanh mượt rồi — tắt bếp kẻo nẫu!
  - title: Rưới gạch, dọn mâm
    icon: bowl
    minutes: 3 phút
    bullets:
      - text: Múc canh ra tô lớn, khéo tay giữ **tảng riêu nguyên miếng** nằm giữa.
      - text: Rưới **chén gạch chưng hành** lên mặt riêu — vàng óng, thơm nức.
      - text: >-
          Dọn cùng **chén cà pháo muối** và nồi cơm trắng — chan, húp, cắn
          quả cà nghe "rốp", đúng vị trưa hè Bắc bộ.
    doneText: Riêu vàng óng giữa tô — dọn mâm!

tipsTitle: 7 bí quyết cho **bát canh cua ngọt lịm**
tipsLead: >-
  Canh cua là bài thi tay nghề kín đáo của người nội trợ Bắc — điểm cao
  hay thấp nằm ở mấy chỗ này.
tips:
  - icon: basket
    title: Chọn cua đồng chắc, mua buổi sáng
    text: >-
      Cua ngon là cua **còn sống, sủi bọt, bấm yếm thấy cứng tay**; cua cái
      yếm to nhiều gạch, cua đực nhiều thịt — mua lẫn cả hai là nồi canh
      vẹn cả ngọt lẫn béo. Sau vụ gặt là mùa cua béo nhất.
  - icon: jar
    title: Muối bỏ lúc lọc — bí quyết riêu kết
    text: >-
      Một muỗng cà phê muối hòa vào nước lọc cua giúp thịt cua **kết tảng
      chắc nịch** khi gặp nóng — mẹo nhỏ các bà truyền tay, mình chỉ cần
      nhớ: **lọc cua là phải có muối**.
  - icon: flame
    title: Ba nhịp lửa của nồi riêu
    text: >-
      **Lửa vừa** lúc bắt đầu (khuấy nhẹ một chiều), **ngừng khuấy hạ
      nhỏ** khi nước nóng già, và **không bao giờ sôi bùng**. Thuộc ba
      nhịp này là mười nồi kết tảng đủ mười.
  - icon: herb
    title: Rau đay thái nhỏ mới ra chất
    text: >-
      Rau đay thái nhỏ khi nấu mới tiết **độ nhớt mát** đặc trưng — chính
      cái nhớt ấy làm bát canh "mát ruột" và giúp nước sanh sánh ôm lấy
      cơm. Ai chưa quen thì bớt rau đay tăng mồng tơi, đừng bỏ hẳn kẻo
      mất hồn món.
  - icon: pod
    title: Mướp hương, đừng mướp già
    text: >-
      Mướp hương trái thon, cầm **nhẹ tay, da xanh non** nấu lên thơm dịu
      ngọt lừ; mướp già nặng tay là xơ xác, nhạt hoét. Gọt xong ngâm sơ
      nước muối loãng cho khỏi thâm.
  - icon: bowl
    title: Cà pháo — tri kỷ không thể vắng
    text: >-
      "**Canh cua cà pháo**" đi với nhau như đũa có đôi: canh mát – cà
      giòn, canh ngọt – cà chua mặn. Mua hũ cà muối sẵn loại trắng giòn,
      hoặc nhà muối được thì càng quý. Thiếu cà, bữa canh cua mất vui một
      nửa.
  - icon: clock
    title: Nấu bữa nào, hết bữa đó
    text: >-
      Canh cua **rất mau thiu**, hâm lại thì riêu nát mùi nồng — nên nấu
      vừa đủ ăn một bữa, không nấu dư để dành. Cua xay mua về cũng nên
      lọc nấu trong buổi, đừng để qua đêm.

serve:
  title: Mâm cơm **trưa hè chuẩn Bắc bộ**
  paras:
    - >-
      Bộ tứ kinh điển: **canh cua rau đay – cà pháo muối – cơm trắng** và
      thêm món mặn nhẹ (đậu phụ rán chấm mắm, thịt rang cháy cạnh là hợp
      nhất). Trời càng oi, mâm này càng "được lòng" — thanh, mát, đưa cơm
      mà không ngấy chút nào.
    - >-
      Ăn đúng kiểu: chan canh **ngập nửa bát cơm**, gắp miếng riêu vàng
      óng đặt lên trên, và một quả cà pháo cắn kèm — mặn, ngọt, mát, giòn
      đủ cả trong một miếng. Người Bắc xa quê nghe tả tới đây chắc đã
      thấy... nhớ nhà.
    - >-
      Nhà có khách phương xa tới chơi mùa hè, cứ dọn mâm canh cua cà pháo
      thay vì bày vẽ sơn hào — **món quê đúng lúc luôn thắng món sang
      sai chỗ**, tin đi.
  aside:
    title: Mâm cơm gợi ý
    intro: "Đi cùng canh cua là hợp cạ nhất:"
    items:
      - icon: pod
        text: "**Cà pháo muối giòn** — tri kỷ định mệnh, thiếu là mất vui."
      - icon: meat
        text: "**Đậu phụ rán chấm mắm** hoặc **thịt rang cháy cạnh** — mặn ấm cân vị."
      - icon: rice
        text: "**Cơm trắng dẻo** — để chan canh ngập nửa bát."
      - icon: lime
        text: "**Đĩa dưa muối/quả sấu dầm** — thêm góc chua mùa hè, tùy nhà."

faq:
  - q: Mua cua xay sẵn ngoài chợ có ngon bằng tự giã không?
    a: >-
      Gần bằng, mà **tiện gấp mười** — quan trọng là chọn hàng cua đông
      khách, cua còn sống nhảy, **xay tại chỗ trước mặt mình** và xin túi
      gạch để riêng. Về nhà lọc kỹ là bát canh không thua cua tự giã bao
      nhiêu. Chỉ tránh mua cua xay để tủ từ hôm trước — mất ngọt, dễ nặng
      mùi.
  - q: Sao riêu của mình không kết tảng mà tan lợn cợn?
    a: >-
      Ba lỗi quen thuộc: **quên muối lúc lọc** (riêu thiếu "keo"), **khuấy
      khi nước đã nóng già** (riêu đang kết bị đánh tan), và **lửa lớn sôi
      bùng** (riêu vỡ vụn). Thêm một lý do ít ngờ: cua quá ít — dưới
      [[300|g]] cua cho nồi nước này thì riêu mỏng, khó thành tảng.
  - q: Không quen độ nhớt của rau đay thì làm sao?
    a: >-
      Giảm rau đay còn nửa bó, tăng mồng tơi và mướp — nước canh sẽ thanh
      trong hơn hẳn. Nhưng thử "nguyên bản" một lần đã: cái nhớt mát ấy
      chan cơm rất dễ ăn, nhiều người "ghét trên lý thuyết" xong húp hai
      bát mới chịu buông.
  - q: Mắm tôm có bắt buộc không?
    a: >-
      Không — nhiều nhà chỉ nêm muối với chút nước mắm cho thanh. Nửa
      muỗng cà phê mắm tôm là kiểu "đậm đà đồng quê", thơm dậy rất riêng
      nhưng ai không quen sẽ thấy nặng mùi. Nêm thử nửa nồi trước là cách
      an toàn cho cả nhà.
  - q: Canh cua để tủ lạnh mai hâm ăn được không?
    a: >-
      Thiệt tình là **không nên** — canh cua nổi tiếng mau thiu, hâm lại
      thì riêu nát, mùi nồng, rau nhũn. Đây là món "ăn tươi": nấu sát giờ
      cơm, dọn nóng, hết veo trong bữa. Nấu dư thì bớt lượng lại từ đầu
      cho vừa.
  - q: Thay cua đồng bằng cua biển hay tôm được không?
    a: >-
      Món này thì không — **ngọt cua đồng là vị không thay thế**: cua biển
      ngọt kiểu khác và không kết riêu; tôm xay thành... canh tôm. Không
      tìm được cua đồng tươi thì nhiều chợ có **cua đồng xay cấp đông**
      loại uy tín — vẫn ra bát canh ra hồn, chỉ kém tươi một bậc.

