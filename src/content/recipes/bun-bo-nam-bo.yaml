stepsEyebrow: Vô bếp thôi!
stepsTitle: 5 bước ra **tô bún bò Nam Bộ trộn tại bàn**
stepsLead: >-
  Món này gần như không có bước nào khó, chỉ có một luật phải giữ: **thịt
  bò là thứ làm sau cùng**. Mọi thứ khác — đồ chua, nước mắm, rau, bún —
  soạn xong xuôi rồi mới bật bếp xào bò.
steps:
  - title: Làm đồ chua và pha nước mắm
    icon: jar
    minutes: 20 phút
    intro: "Hai thứ này cần thời gian ngấm nên làm trước tiên:"
    bullets:
      - label: "Đồ chua:"
        text: >-
          đu đủ xanh và cà rốt gọt vỏ, thái sợi hoặc lát mỏng. **Xóc với
          chút muối hột, để 10 phút** cho ra bớt nước rồi rửa sạch, vắt
          nhẹ. Ngâm với **giấm và đường tỷ lệ 1:1**, thêm chút muối, tỏi
          ớt — 20 phút là ăn được.
      - label: "Nước mắm chan:"
        text: >-
          hòa tan đường trong nước ấm trước, rồi mới cho nước mắm và giấm
          vào theo tỷ lệ **1 mắm : 1 đường : 1 giấm : 4 nước**. Nếm lại,
          chua ngọt phải rõ hơn nước chấm thường vì lát nữa còn bị bún và
          rau làm nhạt đi.
      - label: "Tỏi ớt:"
        text: >-
          băm nhuyễn, **thả vào sau cùng và chỉ khuấy nhẹ** để nổi lên mặt
          chén cho đẹp.
    callout:
      type: tip
      text: >-
        Bước **xóc muối** cho đu đủ đừng bỏ qua: nó rút bớt nước trong sợi
        đu đủ nên đồ chua vừa giòn hơn vừa ngấm giấm đường nhanh hơn, mà
        lúc trộn tô cũng không nhả nước làm loãng nước mắm.
  - title: Thái và ướp thịt bò
    icon: knife
    minutes: 15 phút
    bullets:
      - text: >-
          Thịt bò cho vào **ngăn đông 30 phút** cho hơi cứng rồi thái lát
          mỏng — nhớ **đặt dao vuông góc với vân thịt**.
      - text: >-
          Ướp với nước mắm, [[1|thìa canh|frac]] xì dầu, **sả băm và tỏi
          băm**, chút tiêu; trộn đều rồi rưới
          [[1|thìa canh|frac]] dầu ăn, để **15 phút**.
      - text: >-
          Trong lúc chờ: hành tây thái múi cau, giá đỗ chần sơ nước sôi rồi
          xả lạnh, rau sống rửa sạch **vẩy thật ráo** và thái sợi.
    callout:
      type: tip
      text: >-
        Sả là thứ tách tô bún này khỏi mọi tô bún trộn khác — nó cho **mùi
        thơm the ấm** rất hợp với nước mắm chua ngọt. Băm thật nhuyễn phần
        gốc trắng, phần lá già thì bỏ vì xơ và đắng.
  - title: Chần bún, soạn tô
    icon: noodle
    minutes: 5 phút
    bullets:
      - text: >-
          Bún rối chần nhanh qua nước sôi cho **tơi sợi và nóng lại**, xóc
          thật ráo.
      - text: >-
          Xếp sẵn từng tô: **bún xuống đáy**, rau sống thái sợi và giá đỗ
          quanh thành tô, đồ chua vắt ráo đặt một bên.
      - text: Chừa hẳn khoảng trống ở giữa mặt tô — chỗ đó dành cho thịt bò.
    callout:
      type: warn
      text: >-
        Soạn tô **trước khi xào bò**, không phải sau. Bò ra khỏi chảo là
        phải có tô sẵn để đổ lên ngay; loay hoay xếp rau lúc đó thì thịt
        nguội mất.
  - title: Xào bò — lửa lớn, một lượt
    icon: flame
    minutes: 3 phút
    bullets:
      - text: >-
          Chảo **thật nóng già**, cho dầu, phi thơm chỗ tỏi và sả băm còn
          lại chừng 20 giây.
      - text: >-
          Trút bò vào **dàn một lớp**, để yên 20 giây rồi đảo nhanh tay
          trên lửa lớn tới khi thịt **chín chừng 80%**.
      - text: >-
          Cho **hành tây** vào đảo 20 giây, rồi tới **giá đỗ**, đảo thêm
          vài đảo là tắt bếp ngay — hơi nóng còn lại sẽ làm chín nốt.
    callout:
      type: warn
      text: >-
        Xào tới khi chín hẳn trong chảo là **thịt co lại và dai**, mà giá
        thì mềm nhũn hết. Nhấc chảo sớm hơn một nhịp bao giờ cũng đúng hơn
        muộn một nhịp.
    timer:
      secs: 90
      label: Hẹn giờ xào bò · 01:30
      doneMsg: Tắt bếp, đổ ngay lên tô bún nghen!
  - title: Ráp tô — đổ nóng, chan mắm, trộn liền
    icon: bowl
    minutes: 2 phút
    bullets:
      - text: >-
          Múc **bò xào còn bốc khói** đổ vào giữa tô, cả phần nước tiết ra
          trong chảo cũng trút theo.
      - text: >-
          Rắc **lạc rang giã dập và hành phi** lên mặt — rắc lúc này thì
          lạc còn giòn.
      - text: >-
          Chan nước mắm chua ngọt quanh thành tô, chừng **4–5 thìa canh**
          mỗi tô, đủ xâm xấp đáy chứ không ngập.
      - text: >-
          Bưng ra bàn, **trộn đều rồi ăn ngay**. Ai muốn chua cay hơn thì
          tự chan thêm.
    callout:
      type: tip
      text: >-
        Chan nước mắm **quanh thành tô** chứ đừng dội thẳng lên đống lạc
        rang — dội trúng là lạc ỉu ngay, mất tiếng giòn đáng ra phải nghe
        thấy ở đũa đầu tiên.
    doneText: Trộn lên ăn liền — xong!

tipsTitle: 6 bí quyết cho **tô bún bò Nam Bộ đúng điệu**
tipsLead: >-
  Không có nước dùng nghĩa là không có chỗ nào che được sai sót: chén nước
  mắm nhạt là biết ngay, rau ướt là biết ngay, thịt nguội là biết ngay.
tips:
  - icon: flame
    title: Nóng gặp mát — cả món nằm ở đó
    text: >-
      Thứ làm nên tô bún này là **khoảnh khắc thịt bò nóng bốc khói chạm
      vào rau sống mát và đồ chua lạnh**. Vì vậy bò phải xào sau cùng và
      đổ lên tô ngay. Xào trước rồi để đó, dù chỉ mươi phút, là tô bún
      thành một tô bún trộn nguội bình thường.
  - icon: knife
    title: Ngăn đông 30 phút rồi hãy thái
    text: >-
      Thịt bò mềm thì dao trượt, lát dày mỏng không đều. Để **ngăn đông 30
      phút** cho khối thịt cứng lại là thái được lát mỏng đều tăm tắp. Và
      luôn nhớ **thái ngang thớ** — đây là luật chung của mọi món bò xào.
  - icon: stem
    title: Sả băm nhuyễn, đừng băm dối
    text: >-
      Sả cho **mùi the ấm** làm nên nét riêng của đĩa bò xào này, nhưng chỉ
      khi được băm thật nhuyễn phần gốc trắng. Băm dối thì gặp phải mẩu sả
      xơ trong miệng, còn dùng cả phần lá già thì vừa xơ vừa đắng.
  - icon: drop
    title: Rau vẩy ráo, đồ chua vắt ráo
    text: >-
      Món này chỉ có xâm xấp nước mắm dưới đáy tô, nên **mọi giọt nước thừa
      đều làm loãng vị**. Rau rửa xong vẩy thật ráo (có rổ quay càng tốt),
      đồ chua vớt khỏi hũ thì vắt nhẹ cho ráo giấm rồi mới xếp vào tô.
  - icon: bottle
    title: Nước mắm pha đậm hơn bình thường
    text: >-
      Chén nước mắm nếm riêng thấy hơi gắt mới là vừa, vì khi vào tô nó còn
      bị **bún, rau và đồ chua kéo nhạt đi**. Pha theo tỷ lệ **1 : 1 : 1 :
      4** rồi nếm — nhạt thì thêm mắm và đường, đừng thêm nước.
  - icon: pod
    title: Lạc giã dập, rắc sát giờ
    text: >-
      **Giã dập chứ đừng giã nhuyễn**: mảnh lạc còn to mới nghe bùi và
      giòn khi cắn. Rắc lên ngay trước lúc bưng ra, và chan nước mắm vòng
      quanh thành tô để lạc không bị ngâm.

serve:
  title: Tô trộn — **ăn nhanh lúc còn nóng lạnh lẫn nhau**
  paras:
    - >-
      Bún bò Nam Bộ là món **ăn ngay khi vừa bưng ra**: trộn đều một lượt
      từ đáy lên rồi ăn liền, đừng ngồi ngắm. Để chừng mười phút là rau
      héo, lạc ỉu, và cái tương phản nóng - mát mà cả tô dựa vào sẽ biến
      mất hoàn toàn.
    - >-
      Vì không có nước dùng nên món này **nhẹ bụng và nhanh gọn**, hợp bữa
      trưa hoặc bữa sáng muốn đổi vị. Nhà đông người thì cứ soạn sẵn từng
      tô bún rau, để chảo bò xào trên bếp, ai ăn tới đâu múc tới đó — cách
      này giữ được đúng nhịp nóng của món.
  aside:
    title: Trên bàn bún bò Nam Bộ
    intro: "Mấy thứ nên để sẵn:"
    items:
      - icon: bottle
        text: "**Bình nước mắm chua ngọt** — ai thích ướt hơn thì tự chan thêm."
      - icon: chili
        text: "**Chén tỏi ớt băm** — để riêng cho người ăn cay."
      - icon: pod
        text: "**Hũ lạc rang giã dập** — rắc thêm giữa chừng cho lại tiếng giòn."
      - icon: lime
        text: "**Chanh cắt múi** — vắt vào nếu muốn chua thanh hơn vị giấm."

faq:
  - q: Bún bò Nam Bộ có phải món miền Nam không?
    a: >-
      Món này nổi tiếng từ vỉa hè Hà Nội, và có một thuyết được nhắc
      nhiều: chữ "Nam Bộ" là **tên một con phố cũ ở Hà Nội**, nơi hàng
      bún đầu tiên dọn ra hồi những năm 1980. Khách quen gọi tắt "bún bò
      ở phố Nam Bộ" thành "bún bò Nam Bộ" rồi thành tên món luôn. Nguồn
      gốc chính xác vẫn còn tranh cãi nên chuyện này nên nghe như giai
      thoại.
  - q: Món này khác bún thịt nướng chỗ nào?
    a: >-
      Cùng là bún trộn chan nước mắm chua ngọt, nhưng khác ở phần đạm và
      phần rắc. **Bún bò Nam Bộ** dùng **bò xào tỏi sả** đổ nóng lên tô,
      kèm giá chần và rau sống thái sợi. **Bún thịt nướng** dùng **thịt
      ướp sả nướng xém cạnh**, thêm **mỡ hành** béo và đồ chua kiểu Nam.
      Một bên là chảo xào, một bên là vỉ nướng.
  - q: Không có đu đủ xanh thì làm đồ chua bằng gì?
    a: >-
      **Su hào** là thứ thay gần nhất — cũng giòn, cũng ngấm giấm đường
      nhanh. Ngoài ra dùng **cà rốt kèm củ cải trắng** cũng được. Cách làm
      giữ nguyên: thái sợi, **xóc muối 10 phút cho ra nước**, rửa lại rồi
      ngâm giấm đường tỷ lệ 1:1.
  - q: Thịt bò xào ra nước, tô bị nhão thì sao?
    a: >-
      Do **chảo chưa đủ nóng** hoặc **xào quá nhiều một lượt** nên thịt bị
      hầm trong nước của chính nó. Đun chảo tới thật nóng già, và nếu nấu
      cho đông người thì **xào làm hai ba mẻ**. Chút nước tiết ra là bình
      thường và nên trút vào tô, nhưng nếu nhiều tới mức đọng thành vũng
      thì chảo đã sai nhiệt.
  - q: Nấu cho đông người thì tổ chức thế nào?
    a: >-
      Soạn trước **tất cả trừ thịt bò**: đồ chua ngâm từ sớm, nước mắm pha
      sẵn để tủ lạnh, rau rửa để ráo, bún chần để đó. Tới bữa xếp sẵn các
      tô bún rau, rồi **để chảo bò xào ngay trên bếp**, ai ăn tới đâu múc
      tới đó. Đừng xào hết một lượt rồi để nguội chờ.
  - q: Ăn chay hoặc không ăn bò thì thay bằng gì?
    a: >-
      Thay bò bằng **thịt gà** hoặc **tôm** xào cùng tỏi sả theo đúng cách
      trên — gà cần thêm chừng một phút, tôm thì vừa cong mình đỏ vỏ là
      tắt bếp. Ăn chay thì dùng **nấm bào ngư xé sợi** xào tỏi sả cho xém
      cạnh, và pha nước chan bằng **xì dầu thay nước mắm** với cùng tỷ lệ
      chua ngọt.

