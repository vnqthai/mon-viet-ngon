flavorNote: >-
  **Chuẩn vị:** trộn xong nếm thấy **chua trước, ngọt theo sau, mặn đỡ phía
  dưới**; miếng bò còn mềm và ứa nước; rau vẫn giòn chứ chưa kịp héo; đáy
  tô còn đọng chút nước mắm chứ không ngập thành canh.
storyEyebrow: Chuyện tô bún bò Nam Bộ
storyTitle: Món Hà Nội mang **cái tên gây hiểu nhầm**
story:
  - >-
    Nghe tên thì ai cũng tưởng đây là món miền Nam ra Bắc. Người Hà Nội
    lại kể khác: món này lớn lên ở vỉa hè Hà Nội, và **có một thuyết được
    nhắc nhiều** — chữ "Nam Bộ" là **tên một con phố cũ ở đây**, nơi hàng
    bún đầu tiên dọn ra hồi những năm 1980, chứ không phải chỉ vùng miền
    nào cả.
  - >-
    Giai thoại kể rằng ban đầu người ta gọi món đó đơn giản là **bún bò
    trộn**. Khách ăn quen, hẹn nhau đi ăn "bún bò ở phố Nam Bộ", rồi nói
    tắt dần thành **bún bò Nam Bộ** — cái tên dính luôn từ đó và theo món
    đi khắp nơi. Nguồn gốc chính xác tới nay vẫn còn tranh cãi, nên chuyện
    này nên nghe như một giai thoại hơn là một mốc lịch sử.
  - >-
    Gạt tên gọi sang một bên thì đây là một tô rất khéo. Nó **không có
    nước dùng** — thứ mà gần như mọi món bún khác đều dựa vào — mà thay
    bằng một chén nước mắm chua ngọt chan xâm xấp đáy tô. Cái khéo nằm ở
    **tương phản**: thịt bò xào vừa nhấc khỏi chảo còn bốc khói đổ thẳng
    lên rau sống mát lạnh và đồ chua giòn tan. Trộn lên, một đũa có đủ
    nóng và mát, mềm và giòn, béo và chua.

