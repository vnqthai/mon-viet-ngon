quick:
  ingredients:
    - Thịt bò thăn [[500|g]] — thái lát mỏng **ngang thớ**
    - Bún rối [[1000|g]] — chần lại nước sôi cho tơi
    - Giá đỗ [[300|g]] · hành tây [[1|củ]] · xà lách · húng quế · rau mùi
    - "Đồ chua: đu đủ xanh [[300|g]] · cà rốt [[1|củ]] — ngâm giấm đường"
    - Lạc rang giã dập [[100|g]] · hành phi [[4|thìa canh|frac]]
    - >-
      Ướp bò: nước mắm · xì dầu · sả băm [[2|cây]] · tỏi băm · tiêu ·
      dầu ăn [[1|thìa canh|frac]]
    - "Nước mắm chan: mắm · đường · giấm · nước theo tỷ lệ **1 : 1 : 1 : 4** + tỏi ớt băm"
  steps:
    - Đu đủ và cà rốt thái sợi, **xóc muối 10 phút cho ra nước**, rửa lại rồi ngâm giấm đường.
    - "Pha nước mắm theo tỷ lệ **1 mắm : 1 đường : 1 giấm : 4 nước**, khuấy tan rồi thả tỏi ớt băm."
    - Bò thái mỏng ngang thớ, ướp mắm + xì dầu + **sả tỏi băm** + dầu ăn, để 15 phút.
    - Giá chần sơ nước sôi; rau sống rửa sạch để ráo; bún chần lại cho tơi.
    - Phi thơm tỏi sả, **xào bò lửa lớn tới 80% chín**, cho hành tây rồi giá vào đảo nhanh, tắt bếp.
    - "Xếp tô: bún → rau sống → đồ chua → **bò xào còn nóng** → lạc rang + hành phi, chan nước mắm, trộn đều ăn liền."
  warning: >-
    Bò phải **còn nóng bốc khói lúc đổ lên tô**. Xào trước để nguội rồi mới
    ráp là mất hẳn cái hay của món — cả tô này sống nhờ khoảnh khắc thịt
    nóng chạm rau mát.

