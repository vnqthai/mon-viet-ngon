title: Bún bò Nam Bộ **bò xào nóng hổi, trộn lên là mát rượi**
summary: >-
  Tô bún trộn khô: bún trắng lót dưới, rau sống và đồ chua giòn
  xếp quanh, trên cùng là **thịt bò xào tỏi sả còn bốc khói**, rắc lạc rang
  với hành phi rồi chan nước mắm chua ngọt. Trộn đều lên — **nóng gặp mát**
  ngay trong một đũa. Món quen của vỉa hè Hà Nội, bốn mươi phút là xong.
region: Miền Bắc
category: Bún trộn
occasions: [Bữa sáng, Ăn chơi]
