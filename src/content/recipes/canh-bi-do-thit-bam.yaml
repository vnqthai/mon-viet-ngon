title: Canh bí đỏ thịt bằm **ngọt lành 20 phút**
summary: >-
  Miếng bí **dẻo bùi vàng ươm**, nước canh ngọt thanh vị thịt, rắc hành ngò
  thơm phức — món canh "cứu bữa" nhanh gọn mà đứa nhỏ nào cũng chịu ăn.
region: Cả nước
category: Canh
occasions: [Cho bé, Cơm nhà]
pubDate: 2026-07-27
time:
  total: 20 phút
servingsBase: 4
difficulty: Dễ
featured: false
order: 63
art: canh-bi-do
heroEyebrow: Bữa vội có canh ngon…

quick:
  ingredients:
    - Bí đỏ [[500|g]] — gọt vỏ, cắt miếng vuông 3 cm
    - Thịt heo bằm [[200|g]] — ướp hạt nêm + tiêu + hành tím
    - Hành tím [[2|củ]] · hành lá + ngò rí 1 nắm
    - "Nêm: nước mắm [[1|muỗng canh|frac]] · hạt nêm, muối, tiêu · nước [[1|lít]]"
  steps:
    - Bí gọt vỏ cắt miếng; thịt bằm ướp hạt nêm – tiêu – hành tím băm **10 phút**.
    - Phi thơm hành, cho thịt vào **xào tơi** tới săn.
    - Châm [[1|lít]] nước sôi, sôi lại thì **hớt bọt**, thả bí vào.
    - Nấu **10 phút** lửa vừa tới khi bí **mềm dẻo mà chưa nát**, nêm nếm lại.
    - Tắt bếp, rắc hành lá + ngò + tiêu. Chan cơm nóng là hết ý.
  warning: >-
    Bí nấu quá tay là **nát tan thành súp** — xiên đũa thấy vừa qua là tắt
    bếp, bí sẽ chín thêm trong nồi nóng.

flavor:
  chua: 0.5
  ngot: 7
  man: 5
  cay: 1
  thom: 6
flavorNote: >-
  **Chuẩn nồi canh bí:** nước ngọt thanh tự nhiên từ bí và thịt, miếng bí
  **giữ dáng mà dẻo bùi** — không mặn gắt, không nát nhừ.
storyEyebrow: Chuyện nồi canh chiều
storyTitle: Món canh **"cứu bữa" của mọi nhà**
story:
  - >-
    Chiều đi làm về trễ, mở tủ lạnh thấy khúc bí đỏ với vỉ thịt bằm — vậy là
    đủ một nồi canh ngon. Canh bí đỏ thịt bằm là kiểu món **không cần công
    thức vẫn nấu được, nhưng có vài mẹo nhỏ thì ngon hẳn lên**: thịt phải xào
    săn trước cho nước ngọt trong, bí phải canh đúng độ "mềm mà chưa nát".
  - >-
    Bí đỏ lại là thứ rau củ dễ chiều nhất chợ: **ngọt sẵn nên khỏi nêm
    nhiều**, nấu lên vàng ươm bắt mắt — nồi canh này là cách dễ nhất để đám
    nhỏ trong nhà **ăn rau mà không cằn nhằn**.

