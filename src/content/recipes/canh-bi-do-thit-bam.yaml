steps:
  - title: Sơ chế nhanh gọn
    icon: knife
    minutes: 7 phút
    bullets:
      - label: "Bí đỏ:"
        text: >-
          gọt vỏ, nạo sạch ruột, cắt miếng vuông cỡ **3 cm** — đều tay cho
          chín cùng lượt.
      - label: "Thịt bằm:"
        text: >-
          ướp **1 muỗng cà phê hạt nêm + ¼ muỗng cà phê tiêu + 1 củ hành tím
          băm**, trộn đều, để 10 phút.
      - label: "Hành ngò:"
        text: rửa sạch, xắt nhỏ, để riêng.
  - title: Xào thịt săn — nước ngọt mà trong
    icon: flame
    minutes: 3 phút
    bullets:
      - text: >-
          Phi thơm hành tím với 1 muỗng canh dầu, cho thịt bằm vào **xào tơi
          tay** tới khi săn và thơm.
      - text: >-
          Xào săn trước giúp thịt **không vón cục, không ra bọt đen**, nước
          canh ngọt mà trong veo.
  - title: Nấu bí vừa chín tới
    icon: pot
    minutes: 12 phút
    bullets:
      - text: Châm **[[1|lít]] nước sôi** vào nồi thịt, sôi lại thì hớt bọt.
      - text: >-
          Thả bí vào, **lửa vừa, hé nắp**, nấu 10 phút — xiên đũa qua miếng
          bí thấy **vừa hết cấn** là đạt.
      - text: >-
          Nêm [[1|muỗng canh|frac]] nước mắm + ½ muỗng cà phê hạt nêm, nếm
          lại cho vừa miệng.
    callout:
      type: warn
      text: >-
        Đậy nắp kín + nấu quá lửa là bí **rã thành súp đặc** trong một nốt
        nhạc. Canh đúng kiểu phải còn **miếng bí nguyên hình, dẻo bùi**.
    timer:
      secs: 600
      label: Hẹn giờ nấu bí · 10:00
      doneMsg: Thử miếng bí coi — vừa mềm là tắt bếp!
  - title: Rắc hành ngò, dọn mâm
    icon: bowl
    minutes: 1 phút
    bullets:
      - text: Tắt bếp, rắc **hành lá + ngò rí + chút tiêu xay**.
      - text: Múc ra tô, ăn nóng với cơm — chan thẳng vô chén cũng "hết nước chấm".
    doneText: Múc canh ra tô — xong!

tipsTitle: 3 bí quyết cho **nồi canh ngọt lành**
tips:
  - icon: pumpkin
    title: Chọn bí dẻo, tránh bí sượng
    text: >-
      Trái bí ngon có **vỏ sần cứng, màu cam sậm, cầm nặng tay**; cắt ra thịt
      dày, hột chắc. Bí vỏ bóng láng thường non, nấu lên sượng và lạt.
  - icon: meat
    title: Xào thịt trước, đừng thả sống
    text: >-
      Thịt bằm thả thẳng vô nước là **vón cục và ra bọt đục**. Xào săn với
      hành phi trước — thịt tơi từng hạt, nước canh trong, thơm gấp đôi.
  - icon: drop
    title: Biến tấu một nồi thành ba món
    text: >-
      Thay thịt bằm bằng **tôm khô** (ngọt đậm đà kiểu miền Tây), **sườn non**
      (nấu lâu hơn 20 phút), hay thêm **đậu phộng sống** nấu mềm kiểu Huế —
      cùng một công thức nền, ba hương vị khác nhau.

serve:
  title: Bữa cơm chiều **20 phút mà ấm bụng**
  paras:
    - >-
      Canh bí đỏ hợp nhất với mấy món mặn khô: **thịt kho tiêu, cá chiên sả,
      trứng chiên** — mâm cơm 2 món 1 canh gọn gàng mà đủ chất. Màu vàng cam
      của bí đặt cạnh dĩa rau xanh nhìn đã con mắt.
    - >-
      Nhà có em bé? Múc phần bí ra **dầm nhuyễn với chút nước canh** là thành
      chén súp bí ngọt lành cho bé ăn dặm — một nồi lo được cả nhà.
faq:
  - q: Canh bí có nấu với tôm tươi được không?
    a: >-
      Quá hợp! Tôm lột vỏ băm dập, ướp chút tiêu rồi xào săn y như thịt bằm.
      **Vỏ tôm đừng bỏ** — cho vào nồi nấu 5 phút đầu rồi vớt ra, nước canh
      ngọt lừ như có nêm bột tôm.
  - q: Bí đỏ mua dư để được bao lâu?
    a: >-
      Trái nguyên để nơi thoáng mát cả **tháng**. Đã cắt thì bỏ hột, bọc kín
      ngăn mát ăn trong **4–5 ngày**; hoặc gọt sẵn, cắt miếng cấp đông — lúc
      nấu thả thẳng vô nồi, tiện như đồ mua sẵn.
