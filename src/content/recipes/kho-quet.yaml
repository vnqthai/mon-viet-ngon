stepsEyebrow: Vô bếp thôi!
stepsTitle: 5 bước ra **tộ kho quẹt sệt tới đáy**
stepsLead: >-
  Cả món gói trong một cái chảo và ba mươi phút. Chỗ duy nhất cần kiên nhẫn là
  lửa: từ lúc đổ nước mắm vào là phải nhỏ lửa cho tới cuối.
steps:
  - title: Thắng ba chỉ lấy mỡ và tóp
    icon: flame
    minutes: 10 phút
    bullets:
      - text: >-
          Thái ba chỉ thành hạt lựu chừng [[1|cm]]. Cho vào chảo **nguội**, bật
          lửa nhỏ — bắt đầu từ chảo nguội thì mỡ ra từ từ và tóp giòn đều.
      - text: >-
          Đảo thong thả **8–10 phút** tới khi miếng thịt **teo lại, vàng và
          giòn**. Vớt tóp mỡ ra chén để riêng, giữ lại phần mỡ trong chảo.
      - text: >-
          Tóp mỡ để riêng cho tới cuối mới thả vào — cho sớm là ỉu hết.
    callout:
      type: tip
      text: >-
        Muốn tóp giòn lâu: vớt ra rồi rắc **một nhúm muối nhỏ** lúc còn nóng,
        để trên giấy thấm cho ráo mỡ. Đừng đậy kín khi còn ấm, hơi nước đọng
        lại là mềm.
  - title: Phi hành tỏi, xào tôm khô
    icon: onion
    minutes: 5 phút
    bullets:
      - text: >-
          Trong chỗ mỡ vừa thắng, cho hành tím và tỏi băm vào phi **lửa vừa**
          tới khi vàng và dậy mùi. Đừng để nâu sậm, sẽ đắng.
      - text: >-
          Trút tôm khô đã ngâm và để ráo vào, đảo **2–3 phút** cho tôm săn lại
          và thấm mỡ.
      - text: >-
          Tôm khô ngâm rồi phải để thật ráo mới cho vào chảo — còn nước thì mỡ
          bắn và tôm bị hấp chứ không săn.
  - title: Rim — lửa nhỏ nhất, và đừng bỏ đi đâu
    icon: pot
    minutes: 15 phút
    intro: "Đây là toàn bộ món ăn, nằm trong mười lăm phút này:"
    bullets:
      - text: >-
          Pha [[4|muỗng canh]] nước mắm với [[3|muỗng canh]] đường và
          [[4|muỗng canh]] nước, **khuấy cho đường tan hẳn** rồi mới đổ vào
          chảo.
      - text: >-
          Sang tộ đất nếu có (giữ nhiệt tốt hơn), để **lửa nhỏ nhất**, đun
          **12–15 phút**. Thỉnh thoảng đảo nhẹ.
      - label: "Dấu hiệu tới:"
        text: >-
          Nước rút dần, chuyển từ nâu đỏ sang **nâu cánh gián bóng**, và khi
          **kéo đũa qua đáy tộ thấy hở ra một đường** rồi mới khép lại chậm —
          đó là đúng độ sệt.
      - text: >-
          Chưa tới mà tắt bếp thì tộ loãng, quẹt không bám; quá tay thì nguội
          xuống là đông cứng lại như kẹo.
    callout:
      type: warn
      text: >-
        Đường trong tộ này rất dễ cháy. Thấy có mùi khét nhẹ hay mép tộ ngả
        đen là **nhấc ra khỏi bếp ngay**, đừng chữa bằng cách thêm nước — vị
        đắng đã ngấm vào rồi.
    timer:
      secs: 780
      label: Hẹn giờ rim · 13:00
      doneMsg: Kéo đũa qua đáy tộ — hở ra một đường là tới!
  - title: Thả tóp mỡ, tiêu xanh, ớt
    icon: pepper
    minutes: 2 phút
    bullets:
      - text: >-
          Tắt bếp trước, rồi mới thả **tóp mỡ, chùm tiêu xanh và ớt** vào, đảo
          một vòng cho áo đều.
      - text: >-
          Nhiệt còn lại trong tộ đủ để tiêu xanh dậy mùi mà tóp mỡ **chưa kịp
          mềm**. Bật bếp lại là hỏng cả hai.
      - text: Rắc tiêu xay và hành lá thái nhỏ lên mặt.
  - title: Luộc rau và dọn ra mâm
    icon: lettuce
    minutes: 8 phút
    bullets:
      - text: >-
          Luộc rau củ trong nồi nước sôi có **chút muối và vài giọt dầu ăn** —
          rau xanh và bóng hơn. Luộc theo thứ tự cứng trước mềm sau.
      - text: >-
          Vớt ra thả ngay vào tô nước lạnh chừng 30 giây rồi để ráo. Rau giữ
          được màu và **giòn chứ không nhũn**.
      - text: >-
          Xếp rau củ ra dĩa lớn thành từng cụm theo màu, **đặt tộ kho quẹt vào
          một bên dĩa** chứ đừng đặt chính giữa — để còn chỗ gắp.
    doneText: Bẻ miếng đậu bắp, quẹt một vòng — xong!

tipsTitle: 6 bí quyết cho **tộ sệt đúng độ, không đắng**
tipsLead: >-
  Kho quẹt hỏng theo ba kiểu: loãng quẹt không bám, cứng như kẹo, và đắng
  khét. Sáu điều dưới đây chặn cả ba.
tips:
  - icon: flame
    title: Lửa nhỏ nhất, từ đầu tới cuối
    text: >-
      Đây là luật duy nhất thật sự quan trọng. Nước mắm và đường ở lửa lớn thì
      cạn trước khi kịp thấm, và đường cháy thành đắng. Nhỏ lửa thì mất mười
      lăm phút, nhưng đổi lại là màu cánh gián và vị có hậu.
  - icon: spoon
    title: Thử độ sệt bằng cách kéo đũa qua đáy
    text: >-
      Đừng nhìn màu mà đoán. Kéo đũa một đường qua đáy tộ: nếu thấy **hở đáy
      ra rồi nước mới khép lại chậm** là đúng. Khép lại ngay thì còn loãng;
      không khép lại thì đã quá.
  - icon: meat
    title: Tóp mỡ thả sau khi tắt bếp
    text: >-
      Cả cái ngon của tóp nằm ở chỗ giòn. Thả vào lúc còn rim là nó ngậm nước
      mắm và mềm oặt trong hai phút. Tắt bếp, đảo một vòng, thế là đủ.
  - icon: shrimp
    title: Tôm khô ngâm rồi phải để thật ráo
    text: >-
      Ngâm cho mềm là đúng, nhưng nước còn đọng trong con tôm sẽ làm loãng
      chỗ rim và kéo dài thời gian đun — mà đun lâu thì dễ cháy. Vớt ra rổ,
      để ráo mươi phút, thấm giấy nếu vội.
  - icon: pot
    title: Có tộ đất thì dùng tộ đất
    text: >-
      Tộ đất giữ nhiệt đều nên đường ít cháy điểm, và khi bưng lên bàn thì tộ
      còn nóng lâu — kho quẹt nguội là đông đặc lại, quẹt không ra. Không có
      thì dùng chảo nhỏ đáy dày, và dọn ngay.
  - icon: lettuce
    title: Luộc rau nhiều hơn mình nghĩ
    text: >-
      Tộ kho quẹt rất đậm, một muỗng nhỏ là đủ cho mấy miếng rau. Nhà bốn
      người thì luộc chừng nửa ký rau củ đủ loại — thiếu rau là cả nhà quay
      sang ăn mặn với cơm không.

serve:
  title: Tộ kho quẹt — **giữa dĩa rau luộc**
  paras:
    - >-
      Cách dọn đẹp nhất là một dĩa lớn: rau củ luộc xếp thành từng cụm theo
      màu — đậu bắp xanh, cà rốt cam, bầu trắng ngà — và tộ kho quẹt nhỏ đặt
      lệch về một bên. Mỗi người gắp rau, quẹt vào tộ, rồi ăn cùng cơm nóng.
    - >-
      Món này cũng rất hợp bàn nhậu. Thêm dĩa **cơm cháy** hoặc mấy miếng
      **bánh tráng nướng** bẻ vụn để quẹt thì ngồi được lâu. Ai thích cay thì
      dằm thêm trái ớt hiểm vào tộ.
  aside:
    title: Mâm gợi ý
    intro: "Ba thứ dọn cùng là đủ bữa:"
    items:
      - icon: rice
        text: "**Cơm trắng nóng** — kho quẹt mặn nên cơm phải nhiều."
      - icon: lettuce
        text: "**Dĩa rau củ luộc đủ màu** — đậu bắp, bầu, cà rốt, rau lang."
      - icon: bowl
        text: "**Một tô canh nhạt** — canh rau hay canh bí, để cân lại cái mặn."

faq:
  - q: Kho quẹt nguội bị đông cứng lại, làm sao?
    a: >-
      Bình thường — đường và mắm nguội thì đặc lại. Hâm bằng cách **đặt tộ vào
      chảo nước nóng** hoặc quay lò vi sóng 20 giây là mềm ra. Nếu vẫn quá
      đặc thì thêm một thìa nước sôi, khuấy đều. Lần sau tắt bếp sớm hơn một
      chút, vì tộ còn tiếp tục cạn sau khi nhấc khỏi bếp.
  - q: Làm chay được không?
    a: >-
      Được. Bỏ tôm khô và ba chỉ, thay bằng **nấm hương ngâm nở thái nhỏ** và
      **đậu hũ trắng thái hạt lựu chiên vàng** thay tóp mỡ, dùng nước tương
      thay nước mắm. Rim y hệt. Vị sẽ dịu hơn, nên nêm thêm chút tiêu và ớt
      cho đủ mạnh.
  - q: Không có tôm khô thì thay bằng gì?
    a: >-
      **Tép khô** hoặc **cá cơm khô** đều được, xé nhỏ trước khi rim. Vị sẽ
      mặn hơn nên bớt nước mắm xuống [[3|muỗng canh]]. Chỉ có ba chỉ không thôi
      cũng ra một tộ ngon, gọi là kho quẹt thịt — chỉ là mất phần ngọt hậu của
      tôm.
  - q: Rim bị đắng rồi có cứu được không?
    a: >-
      Không. Đường đã cháy thì vị đắng ngấm khắp tộ, thêm nước hay thêm đường
      đều chỉ làm loãng chứ không mất. Đổ đi và làm lại — lần này để lửa nhỏ
      hơn nữa và đứng canh.
  - q: Để dành được mấy ngày?
    a: >-
      Ngăn mát **1 tuần**, đậy kín. Món này càng để càng đậm. Nhưng
      **tóp mỡ thì nên để hộp riêng** và chỉ thả vào lúc hâm nóng dọn ra —
      để chung trong tộ qua đêm là tóp mềm hết.
  - q: Ăn kho quẹt với gì ngoài rau luộc?
    a: >-
      Cơm cháy là món kèm quen nhất sau rau luộc. Ngoài ra: **cơm nóng vo
      thành nắm nhỏ**, bánh tráng nướng bẻ miếng, hoặc dưa leo và khế chua
      thái lát. Miền Tây còn ăn với **rau vườn nhà** — đọt nhãn lồng luộc vừa
      chín tới, lá cách, đọt xoài non.

