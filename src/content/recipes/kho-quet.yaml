flavorNote: >-
  **Chuẩn tộ kho quẹt:** nước rim **sệt tới mức kéo đũa qua thấy hở đáy tộ một
  đường**, màu nâu cánh gián bóng. Mặn đậm nhưng có hậu ngọt, cay tiêu nổi lên
  ở cuối. Tóp mỡ vẫn **giòn rụm**, tôm khô mềm mà còn dai nhẹ.
storyEyebrow: Chuyện tộ kho quẹt
storyTitle: Cả nồi kho **rút lại còn một tộ** — và ở lại vì nó ngon
story:
  - >-
    Kho quẹt là một tộ nhỏ đựng thứ nước kho đã rim cạn tới mức **sệt lại bám
    đáy**. Không có miếng thịt to nào để gắp, không chan được lên cơm như canh
    — cách ăn đúng là **quẹt**: bẻ một miếng rau luộc hay xắn một muỗng cơm,
    miết một vòng vào lòng tộ rồi đưa lên miệng. Tên món nói đúng động tác đó.
  - >-
    Món này gốc ở đồng bằng sông Cửu Long, và làm từ toàn thứ để dành được: tôm
    khô, nước mắm, đường, một miếng ba chỉ. Vì đậm nên ăn rất ít mà đưa được
    nhiều cơm — một tộ con là đủ cho cả nhà.
  - >-
    Thứ hay nhất của kho quẹt là nó **kéo cả dĩa rau luộc lên hạng chính**.
    Đậu bắp, bầu, rau lang, cà rốt luộc vốn nhạt, chấm vào tộ kho quẹt là
    thành món được trông chờ. Nên khi làm, cứ luộc rau nhiều hơn mình nghĩ.

