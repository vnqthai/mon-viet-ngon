heroEyebrow: Cả nồi kho gói vào một cái tộ con…

quick:
  ingredients:
    - Thịt ba chỉ [[200|g]] — thái hạt lựu nhỏ, thắng lấy tóp mỡ
    - Tôm khô [[60|g]] — ngâm nước ấm 15 phút cho mềm
    - "Nước mắm [[4|muỗng canh]] · đường [[3|muỗng canh]] · nước [[4|muỗng canh]]"
    - Tiêu xanh [[2|nhánh]] · hành tím · tỏi · ớt · hành lá · tiêu xay
  steps:
    - Thái ba chỉ hạt lựu, cho vào chảo **để lửa nhỏ** cho ra mỡ, tới khi tóp vàng giòn thì vớt riêng.
    - Phi hành tím tỏi băm trong chỗ mỡ đó cho vàng thơm.
    - Trút tôm khô đã ngâm vào, đảo **2–3 phút** cho tôm săn và dậy mùi.
    - Pha nước mắm với đường và nước cho tan hẳn, đổ vào tộ, đun **lửa nhỏ nhất**.
    - Rim **12–15 phút** tới khi nước rút xuống còn **sệt và ngả màu cánh gián**.
    - Thả tóp mỡ, tiêu xanh, ớt vào, đảo một vòng rồi tắt bếp.
    - Rắc tiêu xay và hành lá. Dọn nóng cùng dĩa rau củ luộc.
  warning: >-
    Để lửa lớn cho nhanh là đường **cháy khét và đắng**, mà đắng rồi thì không
    chữa được. Cả bước rim phải ở **lửa nhỏ nhất**, thấy nồi chỉ lăn tăn chứ
    không sôi bùng.

