title: Kho quẹt **tộ nhỏ sệt lại, quẹt tới đáy**
summary: >-
  Tôm khô và tóp mỡ rim trong nước mắm đường tới khi **sệt lại thành một lớp
  nâu cánh gián bám đáy tộ**, cay tiêu và thơm hành. Bẻ miếng rau luộc quẹt
  một vòng là đủ đưa hết chén cơm.
region: Miền Tây
category: Kho
occasions: [Cơm nhà, Nhậu lai rai]
pubDate: 2026-08-01
time:
  total: 35 phút
  active: 30 phút
servingsBase: 4
difficulty: Dễ
