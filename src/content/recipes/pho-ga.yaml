quick:
  ingredients:
    - Gà ta [[1|con|frac]] (1,5–1,8 kg) — luộc nguyên con; xin thêm xương gà [[500|g]] ninh cho ngọt
    - Bánh phở tươi [[1000|g]] (hoặc [[400|g]] phở khô)
    - >-
      Hành tây [[1|củ]] · hành tím [[4|củ]] · gừng [[1|củ]] — nướng xém;
      hạt mùi [[1|muỗng canh|frac]] rang thơm (có rễ mùi càng quý)
    - Lá chanh [[5|lá]] thái chỉ · hành lá [[1|bó]] (đầu hành chẻ) · ngò rí
    - "Nêm: muối [[1|muỗng canh|frac]] · đường phèn [[15|g]] · nước mắm [[2.5|muỗng canh|frac]]"
    - "Ăn kèm: chanh, ớt, tiêu · quẩy nếu thích"
  steps:
    - Gà chà muối gừng rửa sạch; nướng xém hành tây, hành tím, gừng rồi cạo vỏ cháy; rang hạt mùi cho vô túi vải.
    - Luộc gà ngập nước lạnh với hành gừng nướng + muối — sôi hớt bọt, hạ **liu riu 25 phút**, tắt bếp ủ 10 phút.
    - Vớt gà **ngâm nước đá 5 phút** cho da căng giòn; lọc thịt, chặt lát bản to, bộ xương trả lại nồi.
    - Thả thêm xương gà + túi hạt mùi, ninh **lăn tăn 60 phút**, siêng hớt bọt — giữ lại lớp mỡ gà vàng óng.
    - Nêm **đường phèn trước, nước mắm sau** lúc nước sôi — ngọt dịu, mặn thanh, không quế hồi.
    - Trụng bánh phở, xếp gà, hành chẻ, chan nước dùng **sôi già**, rắc lá chanh thái chỉ + tiêu. Xì xụp liền cho nóng.
  warning: >-
    Hai lỗi giết tô phở gà: quen tay **thả quế hồi như phở bò** — mùi gà thanh
    bị đè mất tăm; và **luộc gà sôi bùng** — da nứt toác, thịt khô xác.

