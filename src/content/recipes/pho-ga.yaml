flavorNote: >-
  **Chuẩn vị:** nước vàng nhẹ ánh mỡ gà mà **trong nhìn thấu đáy**; húp một
  muỗng thấy **ngọt dịu của gà chạy trước, mùi lá chanh vương lại sau** —
  tuyệt không một bóng quế hồi.
storyEyebrow: Chuyện tô phở gà
storyTitle: Bản **thanh nhẹ** của phở Hà Nội
story:
  - >-
    Người ta kể rằng phở gà ra đời khoảng cuối những năm 1930, khi Hà Nội có
    lệ **mỗi tuần hai ngày không mổ bò** — hàng phở tiếc nồi nước, tiếc khách,
    bèn xoay qua con gà. Ai dè cái món "chữa cháy" ấy đứng luôn thành một
    trường phái: phở gà có hàng ruột của riêng mình, khách ruột của riêng
    mình, kiêu hãnh chẳng kém gì đàn anh phở bò.
  - >-
    Cái khác của phở gà nằm ở chữ **thanh**. Nồi nước dùng chỉ cậy vào ba
    thứ: xương gà ngọt dịu, **hành và gừng nướng xém** thơm ấm, thêm nhúm
    **hạt mùi rang** làm mùi nền — tuyệt nhiên không quế, không hồi, không
    thảo quả. Nhờ vậy nước trong vắt, vàng nhẹ lớp mỡ gà óng ánh, húp vào
    thấy nhẹ bẫng mà ngọt tới hậu. Rồi chữ ký cuối cùng: nhúm **lá chanh
    thái chỉ** rắc lên thịt gà — mùi the thơm bay lên là biết ngay, không
    lẫn đi đâu được.
  - >-
    Với bếp nhà, phở gà còn có cái tình riêng: bên bài **cơm gà Hội An**,
    nhà mình từng dặn trữ đông nước luộc gà cho phở gà sau này, "để dành
    là vừa đẹp" — bài này chính là để giữ lời hứa đó. Một con gà, hai
    tiếng đồng hồ, cả nhà có bữa sáng bốc khói như ngồi đầu phố cổ.

