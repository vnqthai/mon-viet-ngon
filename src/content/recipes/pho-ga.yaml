title: Phở gà **nước trong ngọt dịu, thơm nức lá chanh**
summary: >-
  Tô phở gà chuẩn Hà Nội: nước dùng **vàng nhẹ ánh mỡ gà mà trong veo**, gà
  ta da giòn thịt mọng, trên rắc nhúm **lá chanh thái chỉ** — thanh nhẹ mà
  ngọt sâu, nấu gọn hơn phở bò nhiều mà đãi khách vẫn nở mặt.
region: Miền Bắc
category: Món nước
occasions: [Bữa sáng]
