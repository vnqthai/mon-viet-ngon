title: Mì vịt tiềm **da vàng giòn, nước nâu thơm thảo mộc**
summary: >-
  Tô mì trứng vàng óng úp dưới một **cái đùi vịt chiên giòn da**, chan thứ
  nước dùng **nâu sậm thơm mùi thảo mộc** — ngọt hậu, ấm bụng, thoảng vị
  táo tàu và nấm đông cô. Món của người Hoa Chợ Lớn, nấu kỳ công nhưng đãi
  khách thì khỏi bàn.
