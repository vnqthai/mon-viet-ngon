quick:
  ingredients:
    - Đùi vịt góc tư [[4|cái]] (cỡ 350 g/cái) — hoặc [[1|con|frac]] vịt chặt tư
    - Mì trứng tươi [[600|g]] — sợi nhỏ, vàng ươm
    - >-
      Ướp vịt: xì dầu [[2|thìa canh|frac]] · dầu hào [[1|thìa canh|frac]] ·
      ngũ vị hương [[1|thìa cà phê|frac]] · rượu Mai Quế Lộ [[1|thìa canh|frac]]
    - >-
      Gói gia vị tiềm [[1|gói]] mua sẵn · táo tàu [[10|trái]] · kỷ tử [[10|g]] ·
      trần bì [[5|g]] · thảo quả [[1|trái]] · hoa hồi [[2|cánh]]
    - Nấm đông cô khô [[60|g]] · đường phèn [[20|g]] · gừng [[1|củ]] nướng
    - Cải thìa [[500|g]] · hành lá · ngò rí · dầu ăn để chiên vịt
  steps:
    - Bóp vịt với **gừng giã + rượu trắng** cho hết mùi, rửa sạch, lau thật khô.
    - Ướp vịt với xì dầu, dầu hào, ngũ vị hương, rượu Mai Quế Lộ — **ngăn mát tối thiểu 3 giờ**.
    - "**Chiên ngập dầu** cho da vàng nâu giòn đều, vớt ra để ráo."
    - Rang thơm gói gia vị, cho vô túi vải; ninh cùng gừng nướng + nước [[2.5|lít]].
    - Thả vịt đã chiên vào **hầm liu riu 60 phút**, nêm đường phèn + xì dầu cho nước nâu ngọt hậu.
    - Trụng cải thìa 15 giây, trụng mì, xếp tô, đặt đùi vịt lên, chan nước dùng nóng già.
  warning: >-
    Hai lỗi hay gặp: **không lau khô vịt trước khi chiên** — dầu bắn tung
    tóe mà da vẫn không giòn; và **hầm sôi bùng** — da vừa chiên xong bở
    bục ra, mất sạch công đoạn khó nhất.

