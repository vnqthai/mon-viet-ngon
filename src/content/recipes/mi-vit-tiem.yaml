flavorNote: >-
  **Chuẩn vị:** nước dùng **màu nâu hổ phách, trong chứ không đục**, húp
  vào thấy ngọt hậu của vịt và táo tàu, mùi thảo mộc **ấm ở hậu vị chứ
  không xộc lên mũi**. Da vịt còn giòn khi gắp lên khỏi tô.
storyEyebrow: Chuyện tô mì vịt tiềm
storyTitle: Tô mì của **người Hoa Chợ Lớn**
story:
  - >-
    Mì vịt tiềm là món của cộng đồng **người Hoa ở Chợ Lớn**, gốc từ vùng
    **Quảng Đông**, theo chân người di cư vào Sài Gòn từ trước năm 1975.
    Kiểu nấu này rất Quảng Đông: hầm con vịt cùng một túi gia vị khô, lấy
    mùi thảo mộc làm nền cho vị thịt thay vì lấn át nó.
  - >-
    Cái hay của món nằm ở **hai kết cấu chỏi nhau mà lại hợp**. Đùi vịt
    được **chiên vàng giòn da trước**, rồi mới thả vào nồi hầm — nên khi
    bưng ra, phần thịt đã mềm rục tới xương mà lớp da vẫn còn giữ được độ
    dai giòn. Chan nước dùng ngập mì nhưng **đùi vịt đặt cao lên trên**,
    cốt để cái da đó không bị ngâm mềm.
  - >-
    Nước dùng thì đi con đường ngược với phở: không cần trong veo, mà cần
    **nâu sậm và thơm ngầm**. Túi gia vị — **táo tàu, kỷ tử, trần bì, hoa
    hồi** — ninh cùng xương vịt và nấm đông cô cho ra thứ nước **ngọt hậu
    và thơm ấm**, húp tới đâu thấy mùi thảo mộc dâng lên tới đó. Cũng vì
    đậm đà mà không ngán, đây là món các hàng mì người Hoa bán suốt đêm.

