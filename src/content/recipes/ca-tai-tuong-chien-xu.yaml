flavorNote: >-
  **Chuẩn con cá:** vảy **dựng hết lên và giòn rào rạo** khi bẻ, màu vàng rơm
  chứ không nâu sậm; thịt bên trong **còn trắng và mọng**, gỡ ra thành miếng
  chứ không tơi bở. Chén mắm me phải **chua trước, ngọt sau**, sánh nhẹ.

storyEyebrow: Chuyện món ăn
storyTitle: Cả món nằm ở chỗ **không đánh vảy**
story:
  - >-
    Cá tai tượng là loài cá nước ngọt mình dẹp và bè ra hai bên, nuôi nhiều ở
    ao mương miền Tây. Người ta gọi tên vậy vì hai vây ngực dài thượt thò ra như
    hai sợi râu, còn thân thì tròn bè trông đúng như cái tai. Con cỡ một ký là
    vừa đẹp cho một mâm.
  - >-
    Món này có một điều trái với mọi phản xạ trong bếp: **không được đánh vảy**.
    Vảy cá tai tượng to, cứng và xếp chồng lên nhau; thả vào chảo dầu nóng già
    thì từng lớp vảy **dựng hết lên và giòn tan**, thành một lớp áo bao ngoài
    giữ cho thịt bên trong khỏi khô. Đánh vảy đi là mất luôn thứ làm nên tên
    "chiên xù".
  - >-
    Và vì lớp áo đó chịu được lửa, con cá mới chiên được lâu tới mức chín tận
    xương mà thịt vẫn mọng. Người miền Tây dựng đứng con cá lên giá khi dọn —
    một phần để khoe, một phần rất thật là **để dầu chảy hết xuống** và hai mặt
    vảy đều ráo, không bị mặt dưới ỉu vì nằm đọng dầu.
  - >-
    Đây là món của bàn đông người. Cá dọn nguyên con, ai cũng gỡ được phần mình,
    ăn tới đâu cuốn tới đó — nên nó hay xuất hiện ở đám tiệc miệt vườn hơn là
    trong mâm cơm hằng ngày. Cuốn kèm luôn có **khế chua và chuối chát**, hai
    thứ cắt hẳn chỗ ngậy của cá chiên.

ingredientGroups:
  - name: Con cá
    icon: fish
    items:
      - id: catt
        name: Cá tai tượng
        icon: fish
        base: 1
        unit: con
        note: >-
          Chọn con **còn bơi khỏe**, cỡ [[800|g]]–[[1.2|kg]] là vừa chảo nhà.
          Nhờ hàng cá **chỉ mổ bụng lấy ruột và mang**, dặn kỹ đừng đánh vảy,
          đừng cắt vây đuôi
      - id: khutanh
        name: Muối hột · gừng · rượu trắng
        icon: jar
        qtyText: 2 muỗng canh muối · 1 củ gừng · 3 muỗng canh rượu
        note: >-
          Chà muối hột với gừng đập dập khắp mình và trong bụng, xối rượu rồi
          rửa lại. Cá nước ngọt hay có mùi bùn, bước này bỏ là ăn thấy ngay
      - id: dauchien
        name: Dầu ăn
        icon: bottle
        base: 1
        unit: lít
        note: >-
          Đủ ngập chừng nửa con cá là được, không cần ngập hẳn — chiên một mặt
          rồi trở. Dầu dùng xong lọc lại vẫn chiên món khác được
  - name: Chén mắm me
    icon: lime
    items:
      - id: mevat
        name: Me vắt
        icon: lime
        base: 50
        unit: g
        note: >-
          Dầm với [[100|ml]] nước nóng rồi lọc bỏ hạt và xơ. Me vắt cho vị chua
          dày hơn nước cốt chanh, đây là chén chấm gốc của món
      - id: nemmamme
        name: Nước mắm · đường
        icon: jar
        qtyText: 3 muỗng canh mỗi thứ
        note: Nêm sao cho **chua trước ngọt sau**, nếm rồi mới thêm chứ đừng đổ hết một lần
      - id: toiotmam
        name: Tỏi · ớt băm
        icon: chili
        color: red
        qtyText: 1 muỗng canh mỗi thứ
        note: Băm nhuyễn, cho vào sau cùng để nổi lên mặt chén cho đẹp
  - name: Mẹt cuốn
    icon: herb
    items:
      - id: btcuon
        name: Bánh tráng cuốn
        icon: roll
        qtyText: 1 xấp
