        note: >-
          **Khế chua và chuối chát là cặp không thể thiếu** — chúng cắt chỗ ngậy
          của cá chiên. Chuối chát thái lát ngâm nước chanh cho khỏi thâm

stepsTitle: Bốn nhịp — nhịp **lau khô** quyết định cả chảo dầu
steps:
  - title: Sơ chế mà không đánh vảy
    icon: knife
    minutes: 15 phút
    bullets:
      - label: "Chỉ bỏ ruột và mang:"
        text: >-
          Rạch một đường ở bụng, lấy sạch ruột và mang. **Giữ nguyên vảy, vây và
          đuôi** — vảy là lớp áo giòn, vây đuôi xòe ra mới đẹp lúc dựng cá.
      - label: "Khử mùi bùn:"
        text: >-
          Chà muối hột với gừng đập dập khắp mình cá và trong bụng, để [[10|phút]],
          xối rượu trắng rồi rửa lại dưới vòi.
      - label: "Khứa mình cá:"
        text: >-
          Khứa vài đường xéo sâu tới xương ở hai bên mình để cá chín đều tận
          trong. Xát chút muối vào các đường khứa.
    callout:
      type: warn
      text: >-
        Đừng ướp cá bằng nước mắm hay hỗn hợp ướt trước khi chiên. Mình cá ẩm là
        vảy không dựng nổi, mà dầu thì bắn dữ. Muối khô xát vào đường khứa là đủ.
  - title: Lau thật khô
    icon: drop
    minutes: 10 phút
    intro: "Nghe nhỏ nhưng đây là chỗ hỏng nhiều nhất:"
    bullets:
      - text: >-
          Dùng giấy thấm lau khắp mình cá, **lau cả trong bụng và giữa các kẽ
          vảy**. Lau đi lau lại tới khi tờ giấy áp vào không còn ẩm.
      - text: >-
          Để cá nằm trên rổ chừng [[10|phút]] cho khô thêm ngoài không khí trước
          khi chiên.
    timer:
      secs: 600
      label: Hong cá cho ráo · 10:00
      doneMsg: Sờ thấy khô ráo là bắc chảo được rồi!
    callout:
      type: tip
      text: >-
        Nhà nào sợ dầu bắn thì rắc một lớp **bột chiên giòn thật mỏng** lên mình
        cá rồi phủi bớt. Nó hút nốt phần ẩm còn lại và làm vảy giòn thêm, miễn
        là mỏng tới mức gần như không thấy.
  - title: Chiên nghiêng chảo, chan dầu lên lưng
    icon: flame
    minutes: 20 phút
    bullets:
      - label: "Dầu phải nóng già:"
        text: >-
          Đun dầu tới khi thả đầu đũa gỗ vào thấy sủi tăm quanh đũa. Dầu chưa đủ
          nóng thì cá **ngậm dầu** và vảy nằm bẹp.
      - label: "Thả cá:"
        text: >-
          Nghiêng chảo, đặt cá ở mép rồi cho trượt xuống — đừng thả úp từ trên
          cao. Chiên **8–10 phút** một mặt, lửa vừa.
      - label: "Chan dầu:"
        text: >-
          Phần lưng cá nhô khỏi dầu thì dùng muôi **múc dầu nóng chan lên liên
          tục** cho vảy lưng cũng dựng và vàng.
      - text: >-
          Trở mặt, chiên tiếp **8–10 phút**. Cá chín khi vây đuôi cong xòe cứng
          lại và xiên đũa vào chỗ dày nhất thấy thịt tơi ra.
    timer:
      secs: 540
      label: Chiên mặt thứ nhất · 09:00
      doneMsg: Vàng rộm rồi — trở mặt nhẹ tay bằng hai cái xẻng nghen!
  - title: Dựng cá, pha mắm me, dọn mẹt
    icon: bowl
    minutes: 10 phút
    bullets:
      - label: "Dựng đứng:"
        text: >-
          Vớt cá ra, dựng đứng dựa vào một cái tô úp hoặc kẹp giữa hai chén cho
          đứng vững. Dầu chảy hết xuống, hai mặt vảy đều ráo và giòn.
      - label: "Mắm me:"
        text: >-
          Dầm me vắt với nước nóng, lọc bỏ hạt. Đun me với nước mắm và đường tới
          khi hơi sánh, để nguội bớt rồi cho tỏi ớt băm vào.
      - text: >-
          Dọn mẹt bánh tráng, bún, rau sống, khế, chuối chát cạnh con cá. Gỡ thịt
          bằng đũa từ lưng xuống, **ăn tới đâu gỡ tới đó** cho cá khỏi nguội.
    doneText: Xong — cuốn miếng đầu tiên khi vảy còn kêu rào rạo!

tipsTitle: 4 chỗ **quyết định** con cá chiên xù
tips:
  - icon: fish
    title: Không đánh vảy — dặn kỹ hàng cá
    text: >-
      Đây là chỗ hỏng phổ biến nhất, và hỏng ngay từ ngoài chợ: hàng cá quen tay
      đánh vảy sạch trước khi đưa. Dặn rõ **"để nguyên vảy, chỉ mổ bụng"**. Cá
      đã đánh vảy thì vẫn chiên ăn được, nhưng nó thành cá chiên bình thường,
      không còn lớp áo giòn nào để gọi là chiên xù.
  - icon: drop
    title: Khô ráo là điều kiện, không phải lời khuyên
    text: >-
      Vảy chỉ dựng lên khi gặp dầu nóng già mà bản thân nó khô. Còn ẩm thì hơi
      nước bốc lên đội ngược, vảy nằm bẹp và dầu bắn khắp bếp. Lau kỹ từng kẽ,
      rồi hong thêm mười phút — mười phút đó đổi lấy cả cái vảy giòn.
  - icon: flame
    title: Chan dầu lên lưng thay vì đổ đầy chảo
    text: >-
      Không cần cả chảo dầu ngập con cá. Chiên nửa dưới rồi **múc dầu nóng chan
      liên tục lên phần lưng nhô ra** là vảy trên cũng vàng đều, mà tốn chưa tới
      một nửa lượng dầu. Cách này cũng dễ trở cá hơn vì chảo không quá đầy.
  - icon: lime
    title: Chén mắm me phải chua trước
    text: >-
      Cá chiên ngậy, nên chén chấm phải nghiêng hẳn về chua mới cân được. Nêm
      theo thứ tự: me trước, nước mắm sau, đường cho vào từ từ và nếm liên tục.
      Chén nào ngọt lấn thì cuốn thứ ba là thấy ngán.

serve:
  title: Con cá **dựng giữa bàn** — gỡ tới đâu cuốn tới đó
  paras:
    - >-
      Cá chiên xù dọn nguyên con, dựng đứng, và không ai xẻ sẵn. Mỗi người gắp
      lấy phần mình: gỡ một miếng thịt trắng, bẻ theo một mảng vảy giòn nếu
      thích, đặt lên lá bánh tráng đã trải rau, cuốn lại rồi chấm mắm me.
    - >-
      Phần thịt hai bên lườn là chỗ ngọt nhất, còn **phần má và vây** thì dành
      cho người biết ăn. Gỡ hết một bên rồi mới trở qua bên kia, đừng xới lung
      tung — con cá sẽ nát và mất luôn dáng dựng.
  aside:
    title: Cuốn thế nào cho ngon
    intro: "Ba thứ không được thiếu trong một cuốn:"
    items:
      - icon: fish
        text: "**Một miếng thịt cá và một mảnh vảy giòn** — mềm và giòn cùng lúc mới đúng món."
      - icon: lime
        text: "**Lát khế chua với lát chuối chát** — hai thứ này cắt hẳn chỗ ngậy của cá chiên."
      - icon: noodle
        text: "**Một nhúm bún mỏng** để thấm dầu, đừng nhiều tới mức lấn vị cá."

faq:
  - q: Không mua được cá tai tượng thì thay con gì?
    a: >-
      Cách chiên này hợp với **cá mình dẹp, vảy to và cứng**. Cá diêu hồng hay
      cá rô phi cỡ một ký là gần nhất, cũng để nguyên vảy chiên y vậy. Cá lóc
      thì không hợp — mình tròn, vảy nhỏ, chiên xù không ra được lớp áo giòn đó.
  - q: Vảy không dựng lên mà nằm bẹp là do đâu?
    a: >-
      Gần như luôn là hai lỗi: **cá còn ẩm**, hoặc **dầu chưa đủ nóng**. Dầu
      nguội thì cá ngậm dầu trước khi kịp giòn. Thử lại bằng đầu đũa gỗ: sủi tăm
      quanh đũa mới thả cá. Đang chiên dở mà thấy nằm bẹp thì tăng lửa và chan
      dầu nóng lên lưng nhiều hơn.
  - q: Chiên xong để lâu có bị ỉu không?
    a: >-
      Có, và ỉu nhanh. Vì vậy mới có cái mẹo **dựng đứng con cá** — dầu chảy hết
      xuống, không mặt nào nằm đọng. Dựng được thì giữ giòn thêm chừng nửa
      tiếng. Chiên sát giờ dọn vẫn là tốt nhất.
  - q: Nhà không có chảo sâu lòng thì sao?
    a: >-
      Dùng chảo thường loại to, đổ dầu chừng [[3|cm]] và chiên từng mặt, chan
      dầu lên phần nhô ra như hướng dẫn. Cách này còn đỡ tốn dầu hơn. Chỉ cần
      chảo đủ rộng để con cá nằm lọt, đừng để đuôi cong vênh ra ngoài mà cháy.

