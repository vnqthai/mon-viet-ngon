quick:
  ingredients:
    - Cá tai tượng [[1|con]] chừng [[1|kg]] — **để nguyên vảy, nguyên vây, nguyên đuôi**
    - Muối hột · gừng đập dập · rượu trắng — để khử tanh
    - Dầu ăn — đủ ngập nửa con cá, chừng [[1|lít]]
    - "Mắm me: me vắt [[50|g]] · nước mắm [[3|muỗng canh|frac]] · đường [[3|muỗng canh|frac]] · tỏi ớt băm"
    - Bánh tráng cuốn · bún rối [[300|g]]
    - Rau sống · dưa leo · chuối chát · khế chua · xoài xanh
  steps:
    - >-
      **Chỉ mổ bụng lấy ruột và mang** — tuyệt đối không đánh vảy, không cắt vây
      và đuôi.
    - Chà muối hột với gừng đập dập khắp mình cá, xối rượu trắng, rửa lại rồi lau **thật khô**.
    - Bắc chảo sâu, dầu nóng già, nghiêng chảo chiên từng mặt **8–10 phút**, chan dầu lên lưng cá.
    - Vớt ra dựng đứng con cá lên giá hoặc dựa vào tô úp, để ráo dầu.
    - Pha mắm me, dọn kèm mẹt bánh tráng · bún · rau — gỡ tới đâu cuốn tới đó.
  warning: >-
    Cá còn ướt mà thả vào chảo dầu là **dầu bắn tung tóe**. Lau khô từng kẽ vảy
    bằng giấy thấm, và khi thả cá thì để nghiêng chảo, thả từ mép cho cá trượt
    xuống chứ đừng thả úp từ trên cao.

flavor:
