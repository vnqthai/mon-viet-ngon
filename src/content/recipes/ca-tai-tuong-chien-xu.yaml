title: Cá tai tượng chiên xù **dựng đứng, vảy giòn như áo giáp**
summary: >-
  Món dọn tiệc quen thuộc của miền Tây: con cá tai tượng để **nguyên vảy** thả
  chảo dầu, vảy dựng hết lên vàng rộm và giòn tan, thịt trong vẫn trắng ngọt.
  Dựng đứng con cá lên giá, gỡ từng miếng cuốn bánh tráng chấm mắm me.
