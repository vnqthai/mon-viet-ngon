        icon: noodle
        base: 300
        unit: g
        note: Một nhúm mỏng trong mỗi cuốn, chủ yếu để thấm bớt dầu
      - id: rauca
        name: Xà lách · rau thơm · hẹ
        icon: herb
        color: green
        qtyText: 1 mẹt
        note: Húng quế, tía tô, diếp cá — mẹt rau miền Tây càng nhiều loại càng đúng
      - id: khechuoi
