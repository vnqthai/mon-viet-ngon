steps:
  - title: Luộc mít non, xé sợi
    icon: pot
    minutes: 30 phút
    intro: "Làm mít trước vì nó cần thời gian nguội:"
    bullets:
      - label: "Gọt:"
        text: >-
          Gọt sạch vỏ xanh, xắt miếng lớn, **thả ngay vào thau nước pha chanh**
          (hoặc giấm) — vừa đỡ thâm vừa bớt mủ dính tay.
      - label: "Luộc:"
        text: >-
          Luộc với chút muối **20 phút** tới khi xiên đũa qua dễ dàng. Vớt ra,
          xả nước lạnh, để nguội hẳn.
      - label: "Xé:"
        text: >-
          **Xé dọc thớ** thành sợi cỡ đầu đũa. Xé chứ đừng xắt — sợi xé có mặt
          xù xì nên ngậm mắm tốt hơn hẳn miếng xắt mặt trơn.
    timer:
      secs: 1200
      label: Hẹn giờ luộc mít non · 20:00
      doneMsg: Xả nước lạnh, để nguội rồi xé sợi nghen!
    callout:
      type: tip
      text: >-
        Xoa chút dầu ăn lên tay và dao trước khi gọt thì **mủ mít không bám**.
        Mẹo cũ của hàng rau, hiệu nghiệm ngay.
  - title: Pha chén mắm nêm
    icon: spoon
    minutes: 10 phút
    bullets:
      - label: "Lọc:"
        text: >-
          Mắm nêm loại nguyên con thì **lọc qua rây**, bỏ xác, chỉ lấy nước.
          Loại đã xay sẵn thì dùng thẳng.
      - label: "Phi thơm:"
        text: >-
          Phi sả và tỏi băm với chút dầu tới vàng nhạt.
      - label: "Nấu:"
        text: >-
          Cho [[6|muỗng canh|frac]] mắm nêm + [[3|muỗng canh|frac]] thơm băm +
          [[2|muỗng canh|frac]] đường + [[4|muỗng canh|frac]] nước. Đun **lăn
          tăn 2 phút** rồi tắt bếp.
      - label: "Nêm lại:"
        text: >-
          Nguội bớt thì vắt tắc, cho ớt băm. Nếm thử: **mặn đậm, ngọt theo sau,
          chua nhẹ ở cuối**. Còn gắt thì thêm thơm, đừng thêm nước.
    callout:
      type: warn
      text: >-
        Đun sôi bùng là mắm nêm **bốc mùi nồng khắp nhà** mà vị lại nhạt đi. Chỉ
        cần nóng tới lăn tăn cho tan đường và bớt hăng.
  - title: Chuẩn bị rau bào
    icon: knife
    minutes: 10 phút
    bullets:
      - text: >-
          Xà lách, húng lủi, ngò gai **xắt sợi nhỏ** — đây là món trộn, để lá
          nguyên thì trộn không đều.
      - text: >-
          Dưa leo bỏ ruột, bào sợi to. Đu đủ xanh bào sợi, **bóp chút muối rồi
          vắt ráo** cho giòn và bớt hăng.
      - text: Để riêng từng thứ trong rổ, tới lúc xếp tô mới lấy.
  - title: Xắt thịt quay — làm sau cùng
    icon: knife
    minutes: 5 phút
    bullets:
      - text: >-
          Đặt miếng thịt **da hướng lên**, dùng dao bén xắt thành miếng vuông
          chừng 2 cm, cắt dứt khoát một nhát qua lớp da.
      - text: >-
          Xắt xong dọn liền. Miếng thịt quay để ngoài càng lâu, hoặc bị đậy kín
          lúc còn ấm, thì **da hút ẩm và mềm oặt**.
    callout:
      type: tip
      text: >-
        Thịt quay mua từ sáng mà chiều mới ăn thì hong lại trong nồi chiên không
        dầu hoặc lò **4–5 phút ở lửa lớn**, da giòn trở lại như mới.
  - title: Xếp tô và trộn
    icon: bowl
    minutes: 5 phút
    intro: "Xếp theo thứ tự này thì trộn lên mới đều:"
    bullets:
      - text: >-
          Đáy tô là **bún** rũ tơi. Kế đến lớp **rau bào**, rồi **mít non xé
          sợi**, trên cùng là **thịt quay**.
      - text: >-
          Rắc đậu phộng và hành phi, **dội mắm nêm** quanh thành tô chừng
          [[3|muỗng canh|frac]] mỗi tô.
      - text: >-
          Trộn từ dưới lên, nhẹ tay, tới khi sợi bún **áo đều màu nâu nhạt**.
          Thiếu mặn thì thêm mắm chứ đừng chan nước.
    doneText: Trộn xong là ăn liền — đừng để lâu!

tipsTitle: 4 chỗ **hơn thua** của tô bún mắm nêm
tips:
  - icon: pineapple
    title: Thơm băm quyết định chén mắm
    text: >-
      Mắm nêm nguyên chất mặn và nồng tới mức chấm vào là át hết mọi thứ. Thơm
      băm nhuyễn vừa kéo mặn xuống vừa thêm tầng ngọt thơm. Chén mắm còn gắt thì
      **thêm thơm, đừng thêm nước** — thêm nước là nhạt toẹt mà vẫn nồng.
  - icon: pod
    title: Mít non phải xé, không được xắt
    text: >-
      Sợi xé có mặt xù xì, ngậm mắm nêm rất tốt nên miếng nào cũng đậm. Miếng
      xắt mặt trơn thì mắm trôi tuột, ăn tới đó lại thấy nhạt. Luộc mềm rồi để
      nguội hẳn hãy xé — còn nóng mà xé là nát.
  - icon: meat
    title: Da giòn là thứ hỏng nhanh nhất trong tô
    text: >-
      Cả tô có một thứ giòn duy nhất, mà nó lại mất giòn chỉ trong mươi phút.
      Vậy nên **xắt thịt sau cùng**, không đậy kín khi còn ấm, và trộn tô xong
      là bưng ra ngay. Ăn chậm thì cứ để miếng thịt trên mặt, trộn tới đâu gắp
      tới đó.
  - icon: bowl
    title: Đừng chan mắm như chan nước lèo
    text: >-
      Bún mắm nêm là **món trộn khô**. Chan nhiều là đáy tô đọng một vũng mặn,
      bún nhão mà mặt trên vẫn nhạt. Chừng ba muỗng canh mỗi tô, trộn đều, thiếu
      thì thêm — chứ đọng nước rồi thì không rút lại được.

serve:
  title: Dọn bún mắm nêm — **mỗi người một tô, tự trộn**
  paras:
    - >-
      Món này ngon nhất trong năm phút đầu sau khi trộn. Nên đừng trộn sẵn cả
      mâm: bày bún, rau, mít, thịt ra tô cho từng người, để chén mắm nêm giữa
      bàn, ai ăn tới đâu dội tới đó. Người ăn mặn dội nhiều, người ăn nhạt dội
      ít — một chén vừa lòng cả nhà.
    - >-
      Không kịp mua thịt quay thì **luộc miếng ba chỉ** thay vào cũng ổn: mất
      lớp da giòn nhưng vẫn ngọt và mềm. Nhiều hàng ở Đà Nẵng vốn dọn cả hai
      thứ trong một tô.
  aside:
    title: Trên bàn nên có
    intro: "Ba thứ để bên cạnh cho ai muốn thêm:"
    items:
      - icon: chili
        text: "**Ớt xiêm băm** — mắm nêm cay mới đúng, nhưng cay tới đâu tùy người."
      - icon: lime
        text: "**Tắc cắt đôi** — vắt thêm lúc gần cuối tô cho bừng vị."
      - icon: pod
        text: "**Đậu phộng rang** — rắc thêm giữa chừng cho giòn lại."

faq:
  - q: Mắm nêm khác mắm ruốc và mắm tôm thế nào?
    a: >-
      **Mắm nêm** ủ từ **cá cơm** hoặc cá biển nhỏ, loãng, mùi nồng, pha xong có
      hậu chua nhẹ. **Mắm ruốc** ủ từ **con ruốc**, đặc sệt, màu nâu ngả tím,
      mặn mà có hậu ngọt. **Mắm tôm** thì tím đậm, loãng vừa, mùi mạnh nhất
      trong ba thứ. Không thay nhau được — đổi một cái là ra món khác hẳn.
  - q: Mít non thay bằng gì được?
    a: >-
      **Măng luộc** là thứ gần nhất về kết cấu, nhiều người ăn còn tưởng mít non
      chính là măng. **Đu đủ xanh luộc** cũng dùng được. Nhưng mít non có cái
      bùi riêng mà hai thứ kia không có, nên nếu chợ có thì đáng công đi tìm.
  - q: Mắm nêm nồng quá, nhà có người không chịu được mùi?
    a: >-
      Ba cách, dùng chung càng tốt: tăng **thơm băm** lên gấp rưỡi; **đun lăn
      tăn** cho bay bớt phần hăng nhất; và vắt **tắc** lúc mắm đã nguội. Vẫn
      không ổn thì pha thêm một chén nước mắm chua ngọt để bên cạnh — chuyện
      thường ở mâm miền Trung.
  - q: Làm trước được phần nào?
    a: >-
      Mắm nêm pha trước **2–3 ngày** để ngăn mát thì càng ngấm. Mít non luộc và
      xé sợi để được **1 ngày**. Riêng rau bào và thịt quay thì làm trong ngày,
      và xắt thịt ngay trước lúc dọn.

ticker:
  - text: Bún mắm nêm thịt quay da giòn
  - text: Mít non xé sợi ngậm đầy mắm
