storyEyebrow: Chuyện món ăn
storyTitle: Món ăn **đứng hay ngồi cũng được**
story:
  - >-
    Ở Đà Nẵng, bún mắm nêm là món quà chiều — bán trong những gánh nhỏ, tô bún
    trộn xong đưa ra là ăn ngay, không cần bàn ghế gì nhiều. Nó nhanh, mặn đậm,
    thơm nức, và **không có nước lèo** — đó là chỗ khác căn bản với những món
    bún khác cùng vùng.
  - >-
    Thứ làm nên tô bún là **mắm nêm** — mắm ủ từ **cá cơm** hoặc cá biển nhỏ,
    lên men tới khi dậy mùi và mặn đậm. Đừng lẫn với **mắm ruốc** (làm từ con
    ruốc, đặc sệt, màu nâu tím) hay **mắm tôm** miền Bắc. Mắm nêm loãng hơn cả
    hai, và pha xong thì có hậu chua nhẹ rất riêng.
  - >-
    Pha mắm nêm chỉ có một bí quyết: **thơm băm**. Mắm nguyên chất quá mặn và
    nồng, chấm vào là át hết; thơm băm nhuyễn kéo vị mặn xuống, thêm tầng ngọt
    và mùi trái cây. Người bán hàng nào cũng có tỷ lệ riêng, nhưng chưa ai bỏ
    thơm ra khỏi công thức.
  - >-
    Còn hai thứ ít nơi khác có: **thịt heo quay** với mảng da giòn rôm rốp, và
    **mít non luộc xé sợi**. Mít non nghe lạ nhưng vào tô lại hợp không ngờ —
    nó mềm, hơi bùi, và **hút mắm nêm** như miếng bọt biển, nên miếng nào cũng
    đậm đà. Ai ăn lần đầu thường tưởng là măng.

