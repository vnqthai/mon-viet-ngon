title: Bún mắm nêm **thịt quay da giòn, mít non xé sợi**
summary: >-
  Tô bún trộn kiểu Đà Nẵng: bún tươi, **thịt heo quay còn giòn da**, **mít non
  luộc xé sợi**, cả nắm rau bào — rồi dội thẳng chén **mắm nêm pha thơm** lên
  mà trộn.
region: Miền Trung
category: Bún trộn
occasions: [Ăn chơi]
pubDate: 2026-07-29
time:
  total: 50 phút
servingsBase: 4
difficulty: Vừa
featured: false
order: 21
art: bun-mam-nem
heroEyebrow: Trộn lên là dậy mùi…

quick:
  ingredients:
    - Bún tươi sợi nhỏ [[800|g]]
    - Thịt heo quay [[400|g]] — mua sẵn ở hàng quay, phần có da giòn
    - Mít non [[400|g]] — luộc mềm rồi xé sợi
    - Mắm nêm [[6|muỗng canh|frac]] — mắm ủ từ cá cơm, thơm nồng và mặn đậm
    - Thơm băm [[3|muỗng canh|frac]] · sả, tỏi, ớt băm · đường [[2|muỗng canh|frac]]
    - Rau bào [[400|g]] — xà lách, húng lủi, ngò gai, dưa leo, đu đủ xanh
    - Đậu phộng rang [[100|g]] · hành phi [[3|muỗng canh|frac]]
  steps:
    - Gọt mít non, **ngâm nước chanh** cho khỏi thâm và bớt mủ, luộc [[20|phút]] tới mềm.
    - Vớt mít ra để nguội, **xé dọc thớ** thành sợi cỡ đầu đũa.
    - "Pha mắm nêm: phi sả tỏi, cho mắm + thơm băm + đường + chút nước, đun lăn tăn rồi tắt bếp."
    - Thịt quay xắt miếng vuông vừa ăn, **giữ nguyên mảng da giòn** ở trên.
    - "Xếp tô: bún — rau bào — mít — thịt quay, rắc đậu phộng và hành phi, dội mắm nêm, trộn đều."
  warning: >-
    Xắt thịt quay quá sớm là **da mềm oặt** vì hơi nước. Xắt ngay trước lúc dọn,
    và đừng bao giờ đậy kín miếng thịt còn ấm.

