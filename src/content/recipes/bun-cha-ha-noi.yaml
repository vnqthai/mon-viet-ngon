heroEyebrow: Khói than thơm giữa phố cổ…

quick:
  ingredients:
    - Ba chỉ [[400|g]] thái mỏng (chả miếng) · nạc vai xay [[400|g]] (chả viên)
    - "Ướp: hành khô [[3|củ]] + tỏi [[3|tép]] băm · nước mắm [[3|muỗng canh|frac]] · đường [[1.5|muỗng canh|frac]] · dầu hào [[1|muỗng canh|frac]] · **nước hàng [[1.5|muỗng canh|frac]]** · tiêu"
    - "Nước chấm: nước ấm [[600|ml]] · nước mắm [[90|ml]] · đường [[80|g]] · giấm [[50|ml]] · tỏi ớt băm"
    - Đu đủ xanh [[300|g]] + cà rốt [[1|củ]] — ngâm giấm đường làm đồ chua
    - Bún rối sợi nhỏ [[1000|g]]
    - "Rau sống: xà lách · tía tô · **kinh giới** · húng, mùi"
  steps:
    - Đu đủ + cà rốt thái miếng mỏng, bóp muối xả sạch, **ngâm giấm đường 20 phút**.
    - Ba chỉ thái mỏng, nạc vai xay — chia hai thau, ướp chung một công thức có **nước hàng**, để **30 phút**.
    - Nặn thịt xay thành **viên dẹt cỡ 4–5 cm**; xếp thịt lát ra vỉ.
    - "Pha nước chấm với **nước ấm**: nếm phải thanh dịu — chua ngọt mặn không vị nào gắt."
    - Nướng chả trên **than hoa** (hoặc nồi chiên không dầu 180°C) tới **cháy cạnh mà còn mọng**.
    - Thả chả nóng + đồ chua vô bát nước chấm ấm; dọn kèm bún, mâm rau — gắp và nhúng!
  warning: >-
    Bát nước chấm quyết định cả mâm bún chả: pha xong phải **nếm thấy thanh
    dịu, húp được cả muỗng** — mặn gắt hay chua xộc là hỏng; và nhớ dọn
    **ấm**, nước chấm nguội ngắt là mất nửa cái ngon.

flavor:
  chua: 4.5
  ngot: 6
  man: 6
  cay: 2
  thom: 9
flavorNote: >-
  **Chuẩn vị Hà Nội:** miếng chả **cháy cạnh mà mọng nước**, thơm mùi khói
  than và nước hàng; bát nước chấm **ấm – thanh – dịu**, chua ngọt mặn cân
  tới mức húp không cũng thấy ngon.
storyEyebrow: Chuyện món ăn
storyTitle: Món quà trưa **thơm khói cả một góc phố**
story:
  - >-
    Cứ tầm trưa, đi ngang mấy con phố cổ Hà Nội là biết ngay hàng bún chả ở
    đâu: **mùi chả nướng than hoa bay ra tận đầu ngõ**, người bán tay quạt
    nan phe phẩy, vỉ chả xèo xèo nhỏ mỡ xuống lửa than đỏ hồng. Người Hà Nội
    ăn bún chả như một thói quen sang trọng kiểu bình dân — bát nước chấm
    ấm, đĩa bún trắng ngần, rổ rau xanh mướt, vậy là thành bữa trưa ra trò.
  - >-
    Bún chả có hai nhân vật chính: **chả viên** nặn từ thịt xay và **chả
    miếng** thái từ ba chỉ — thiếu một là "mất vai". Cả hai ướp chung một
    thứ làm nên màu nâu óng rất Hà Nội: **nước hàng**, tức đường thắng kiểu
    Bắc. Còn linh hồn thật sự nằm ở bát nước chấm: mắm – đường – giấm pha
    loãng tay, **ấm nóng, thanh tới mức húp được**, trong bát thả sẵn đu đủ
    xanh giòn tan.
  - >-
    Món này từng khiến cả thế giới tò mò khi Tổng thống Obama ngồi ghế nhựa
    ăn bún chả ở Hà Nội năm 2016 — nhưng với người Việt mình, bún chả chẳng
    cần ai quảng cáo. Nhà có cái vỉ nướng, hôm nào trời mát đem ra **nướng
    mẻ chả thơm um**, cả xóm biết nhà bạn ăn gì tối nay.

