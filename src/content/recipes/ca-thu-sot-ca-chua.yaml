quick:
  ingredients:
    - >-
      Cá thu cắt khúc [[600|g]] — chọn khúc dày cỡ 2,5 cm, thịt hồng xám, mặt
      cắt ráo
    - Cà chua [[5|trái]] chín đỏ · hành tím [[4|củ]] · tỏi [[3|tép]] · gừng [[1|nhánh]]
    - >-
      Nêm: nước mắm [[2|muỗng canh]] · đường [[1|muỗng cà phê]] · hạt nêm ·
      tiêu · [[150|ml]] nước
    - Thì là [[1|nắm]] · hành lá [[1|nắm]] · ớt sừng [[1|trái]]
  steps:
    - >-
      Cá rửa với **muối và gừng giã**, thấm thật khô, ướp chút muối tiêu
      [[15|phút]].
    - >-
      **Chiên sơ hai mặt** cho vàng se mặt (mỗi mặt 2–3 phút) rồi vớt ra — bước
      này giữ khúc cá khỏi nát khi rim.
    - >-
      Phi hành tỏi gừng, cho **3/4 chỗ cà chua** vào xào tới nhuyễn thành sốt,
      dằm nát.
    - >-
      Nêm nước mắm, đường, tiêu; châm [[150|ml]] nước, nấu sôi rồi **xếp cá vào
      rim lửa nhỏ 10–12 phút**, giữa chừng trở một lần.
    - >-
      Cho **1/4 cà chua còn lại** vào, nấu thêm 2 phút cho có miếng cà nguyên
      trong sốt.
    - Rắc thì là, hành lá, thả lát ớt, tắt bếp — để nghỉ 5 phút rồi dọn.
  warning: >-
    Đảo cá trong nồi là **nát hết khúc**. Muốn cá thấm đều thì **nghiêng nồi
    múc sốt rưới lên mặt cá**, và cả nồi chỉ trở đúng một lần.

