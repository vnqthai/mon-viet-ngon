title: Cá thu sốt cà chua **khúc cá còn nguyên, sốt sánh đỏ au**
summary: >-
  Món đưa cơm quen thuộc của bữa cơm nhà: khúc cá thu chiên sơ cho săn, rồi rim
  liu riu trong sốt cà chua sánh đỏ, rắc thì là và hành lá lúc cuối. Thịt cá
  chắc và **lành xương** — nên nhà có con nhỏ gắp là ăn được ngay.
