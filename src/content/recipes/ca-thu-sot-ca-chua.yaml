storyEyebrow: Chuyện nồi cá
storyTitle: Món cá **ai cũng biết nấu**, mà ít ai nấu tới nơi
story:
  - >-
    Cá sốt cà chua là món hầu như nhà nào cũng từng nấu. Nó dễ tới mức người ta
    ít khi để ý rằng **có một bản làm tới nơi tới chốn** — nơi khúc cá còn
    nguyên hình chứ không nát vụn, nơi nước sốt sánh bám vào miếng cá chứ không
    loãng như nước canh cà chua có thả cá vào.
  - >-
    Khoảng cách giữa hai bản đó nằm ở **hai việc rất nhỏ**. Thứ nhất: **chiên
    sơ khúc cá trước khi rim** — mặt ngoài se lại thành một lớp áo, giữ cho
    thớ thịt khỏi rã ra trong nồi. Thứ hai: **chia cà chua làm hai lượt** — ba
    phần tư xào nhuyễn từ đầu để làm nền sốt, một phần tư thả vào cuối để còn
    miếng cà nguyên có hình có dáng.
  - >-
    Chọn cá thu là chọn đúng loại cho món này: thịt **săn chắc, cắt khúc dày,
    lành xương**, nên rim lâu vẫn không rã và người ăn không
    phải dò xương. Nắm được hai việc nhỏ ở trên rồi thì đổi sang cá nục, cá
    ngừ, cá basa cũng ra món ngon — chỉ chỉnh lại thời gian rim cho hợp từng
    loại.

