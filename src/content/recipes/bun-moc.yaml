flavorNote: >-
  **Chuẩn bát:** nước dùng **trong nhìn thấy đáy**, ngọt hiền, hậu vị thoảng mùi
  nấm hương; viên mọc cắn vào **dai mềm** rồi gặp mộc nhĩ **giòn sựt** lấm tấm
  bên trong — đó là chỗ người ta nhớ.
storyEyebrow: Chuyện món ăn
storyTitle: Tên món đến từ **một cái làng**, không phải từ cách nấu
story:
  - >-
    Bún mọc lấy tên từ **làng Mọc** — tên nôm của làng Nhân Mục, nay thuộc quận
    Thanh Xuân — nơi món này được cho là ra đời. Nhưng có cách giải thích thứ
    hai cũng đứng vững: **"mọc"** đọc chệch từ **"mộc"**, tức viên giò sống vo
    tròn mộc mạc thả vào bát bún. Hai lối giải thích ấy tồn tại song song đã
    lâu, không bên nào dứt điểm được bên nào, và cũng chẳng ai thấy cần.
  - >-
    Điều đáng nói hơn là **cái viên mọc**. Giò sống không thôi thì mềm và trơn,
    ăn vài viên là chán. Người ta băm **mộc nhĩ** và **nấm hương** đã ngâm nở
    rồi trộn vào — mộc nhĩ cho những điểm **giòn sựt** lấm tấm, nấm hương cho
    mùi thơm ngầm. Cắn một viên là gặp cả ba thứ cùng lúc: dai của giò, sựt của
    mộc nhĩ, thơm của nấm.
  - >-
    Nước dùng thì đi theo lối Bắc cổ điển: **trong là trên hết**. Xương ống với
    sườn non hầm nhỏ lửa gần hai tiếng, hớt bọt đều tay, nêm nhạt. Không sa tế,
    không màu điều, không mắm tôm — bát bún mọc không có chỗ nào để giấu, nên
    nồi nước hỏng là cả bát hỏng.
  - >-
    Trên site này đã có **miến gà** cũng là món Bắc nước trong, cũng có mộc nhĩ
    nấm hương. Chỗ khác nằm ở nhân: miến gà là **thịt gà xé tơi thớ** trên sợi
    miến dong, còn bún mọc là **những viên tròn** nổi trên sợi bún trắng. Cùng
    một tinh thần nấu, hai bát nhìn ra khác nhau ngay từ xa.

