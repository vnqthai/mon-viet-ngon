title: Bún mọc **viên mọc nấm hương, nước dùng trong veo**
summary: >-
  "Mọc" là viên giò sống trộn **mộc nhĩ và nấm hương băm** — cắn vào dai mềm mà
  lấm tấm giòn. Một tô có mọc, sườn non và lát chả quế, chan thứ nước dùng trong
  đến mức nhìn thấy đáy bát.
region: Miền Bắc
category: Món nước
occasions: [Bữa sáng, Cơm nhà]
