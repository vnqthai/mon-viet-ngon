steps:
  - title: Trộn và quết viên mọc
    icon: knife
    minutes: 20 phút
    intro: "Làm trước tiên rồi cất ngăn mát — mọc để lạnh dễ nặn hơn hẳn:"
    bullets:
      - label: "Ngâm nấm:"
        text: >-
          Mộc nhĩ và nấm hương ngâm nước ấm [[20|phút]] cho nở hết. Cắt bỏ chân
          cứng, vắt ráo, **băm nhỏ cỡ hạt đậu xanh** — băm to thì viên mọc rời,
          băm nhuyễn quá thì mất cái sựt.
      - label: "Trộn:"
        text: >-
          Cho giò sống ra tô, thêm mộc nhĩ, nấm hương, hành tím băm,
          [[1|muỗng canh|frac]] nước mắm và [[1|muỗng cà phê|frac]] tiêu.
      - label: "Quết lại:"
        text: >-
          Dùng muỗng **quết mạnh một chiều** chừng 3 phút cho nấm quyện đều vào
          giò. Bọc kín, để ngăn mát **ít nhất 20 phút**.
    callout:
      type: warn
      text: >-
        Trộn kiểu đảo qua đảo lại thì nấm nằm rời trong khối giò, thả vào nồi là
        viên **bung ra**. Phải quết cho khối mọc dẻo dính trở lại như lúc đầu.
  - title: Hầm nồi nước dùng cho trong
    icon: pot
    minutes: 90 phút
    bullets:
      - label: "Chần xương:"
        text: >-
          Xương ống và sườn cho vào nồi nước lạnh, đun sôi [[3|phút]], đổ hết
          nước đó đi rồi **xả lại thật sạch** dưới vòi. Đây là bước quyết định
          nước có trong hay không.
      - label: "Hầm:"
        text: >-
          Cho xương, sườn, hành gừng nướng vào [[3|lít]] nước lạnh. Sôi lăn tăn
          thì hạ nhỏ lửa ngay, hầm **90 phút**, hớt bọt đều tay trong 20 phút đầu.
      - label: "Vớt sườn:"
        text: >-
          Sau [[40|phút]] thì vớt sườn non ra để riêng — hầm tiếp là thịt bã và
          rụng khỏi xương.
      - label: "Thêm nước nấm:"
        text: >-
          Đổ **nước ngâm nấm hương** đã lọc bỏ cặn vào nồi. Nêm muối, nước mắm
          và một viên đường phèn nhỏ, nếm cho **nhạt hơn khẩu vị thường một chút**.
    timer:
      secs: 3600
      label: Hẹn giờ hầm xương · 60:00
      doneMsg: Còn 30 phút nữa — nhớ giữ lửa lăn tăn nghen!
    callout:
      type: warn
      text: >-
        Nồi **sôi bùng** một lần thôi là nước đục vĩnh viễn — mỡ và đạm bị đánh
        tơi ra, lọc cách mấy cũng không trong lại. Bát bún mọc không có màu điều
        hay sa tế để giấu, nên chỗ này không được lơ là.
  - title: Thả mọc vào nồi
    icon: spoon
    minutes: 15 phút
    intro: "Nấu mọc ngay trong nồi nước dùng — đó là chỗ nồi nước ngọt thêm một tầng:"
    bullets:
      - label: "Nặn:"
        text: >-
          Để một bát nước lạnh bên cạnh. **Nhúng tay vào nước trước mỗi viên**,
          véo khối mọc cỡ quả quất rồi vo tròn. Đừng nặn to — viên to thì bên
          ngoài chín mà lõi còn sống.
      - label: "Thả:"
        text: >-
          Giữ nồi ở mức **lăn tăn**, thả từng viên vào. Viên chìm xuống rồi
          **nổi lên** là chín, chừng [[5|phút]]. Vớt ra bát để riêng.
      - text: >-
          Có thể để lại vài viên trong nồi cho ngấm nước, nhưng đừng để hết —
          mọc ngâm lâu là nở bở.
    timer:
      secs: 300
      label: Hẹn giờ luộc mọc · 05:00
      doneMsg: Viên nào nổi lên là chín rồi, vớt ra nghen!
    callout:
      type: tip
      text: >-
        Nặn thử **một viên** thả vào trước. Viên tan ra thì khối mọc còn ướt —
        quết thêm chút nữa rồi để lạnh lâu hơn. Viên cứng đơ thì lần sau bớt
        quết. Một viên thử rẻ hơn cả mẻ hỏng.
  - title: Dọn bát nóng
    icon: bowl
    minutes: 10 phút
    bullets:
      - text: >-
          Bún trụng nước sôi, xóc ráo, cho vào bát. Xếp **mọc một bên, sườn một
          bên**, đặt vài lát chả quế lên trên cho có mảng nâu vàng.
      - text: >-
          Chan nước dùng đang sôi, rắc hành lá và rau mùi thái nhỏ, chút tiêu.
          Dọn kèm rổ rau muống chẻ, xà lách và đĩa chanh ớt.
    doneText: Xong — bưng lên khi còn bốc khói!

tipsTitle: 4 chỗ **quyết định** bát bún mọc
tips:
  - icon: herb
    title: Giữ lại nước ngâm nấm hương
    text: >-
      Chỗ thơm nhất của cây nấm hương khô nằm trong **nước ngâm**, không nằm
      trong cái nấm. Đổ đi là mất trắng. Lọc bỏ cặn cát ở đáy rồi đổ vào nồi —
      nồi nước lập tức có một tầng mùi mà xương heo không cho được.
  - icon: alert
    title: Băm mộc nhĩ cỡ hạt đậu xanh, đừng băm nhuyễn
    text: >-
      Mộc nhĩ có mặt trong viên mọc là để **cắn nghe sựt**. Băm nhuyễn thành
      bột thì viên mọc chỉ còn màu lấm tấm mà không còn cảm giác, mà băm to quá
      thì viên rời. Cỡ hạt đậu xanh là chỗ vừa.
  - icon: clock
    title: Vớt sườn ra sau 40 phút
    text: >-
      Xương ống càng hầm càng ngọt, nhưng **sườn non thì không**. Quá 40 phút
      là thịt bã, rụng khỏi xương và bã ra trong nồi làm đục nước. Vớt ra để
      riêng, tới lúc dọn thả lại vào bát là vừa nóng.
  - icon: drop
    title: Nêm nhạt — bát bún mọc lấy vị hiền làm chuẩn
    text: >-
      Đây không phải bún bò hay bún riêu, không có tầng vị mạnh nào để đua. Nêm
      đậm là nó thành một bát bún xương bình thường. Nhạt hơn khẩu vị quen một
      chút thì mùi nấm hương mới nổi lên được — và đó mới là thứ đáng nhớ.

serve:
  title: Bát bún của **buổi sáng không vội**
  paras:
    - >-
      Bún mọc là món ăn sáng nhưng không phải món ăn vội. Nó nhạt, trong, ít
      màu — húp muỗng đầu thấy hiền, tới muỗng thứ ba mới nhận ra mùi nấm hương
      đi lên. Ai quen tô bún đậm mùi sẽ cần vài phút để bắt nhịp.
    - >-
      Nồi nước hầm được thì hầm từ tối hôm trước, mọc cũng trộn sẵn để ngăn mát.
      Sáng ra chỉ việc đun lại cho sôi lăn tăn, thả mọc, trụng bún — mười lăm
      phút là xong, mà bát bún vẫn đúng thứ đã ninh hai tiếng.
  aside:
    title: Trên mâm nên có
    intro: "Ba thứ dọn kèm, thiếu thì bát bún hụt một góc:"
    items:
      - icon: sprout
        text: "**Rau muống chẻ** — ngâm nước lạnh cho cong giòn, ăn cùng cho đỡ trơn."
      - icon: lime
        text: "**Chanh và ớt tươi** — vắt vào lúc gần cuối bát, nước dùng bừng lên."
      - icon: meat
        text: "**Chả quế xắt mỏng** — mảng nâu vàng duy nhất trên bát, đừng bỏ."

faq:
  - q: Không mua được giò sống thì tự làm được không?
    a: >-
      Được nhưng khá cực: thịt nạc mông xay lạnh nhiều lần rồi quết tới lúc dẻo
      quánh, cả quá trình phải giữ thật lạnh, hơi ấm lên là khối thịt **chảy
      nhão** và mất kết dính. Hàng giò chả ngoài chợ nào cũng có bán giò sống —
      đây là chỗ nên mua sẵn.
  - q: Mọc thả vào nồi bị tan hết thì làm sao?
    a: >-
      Vớt hết ra, cho khối mọc còn lại vào tô, **quết thêm** 2–3 phút rồi để
      ngăn mát 20 phút nữa. Nguyên nhân gần như luôn là một trong hai: khối mọc
      còn ướt quá, hoặc nồi đang **sôi bùng** lúc thả. Nước phải lăn tăn thôi.
  - q: Bún mọc khác miến gà chỗ nào, khi cả hai đều nước trong?
    a: >-
      Cùng lối nấu Bắc — trong, nhạt, thơm nấm — nhưng khác **nhân và sợi**.
      Miến gà là **sợi miến dong** trong mờ với thịt gà xé tơi thớ, nước nấu từ
      gà. Bún mọc là **sợi bún trắng** với những viên mọc tròn, sườn non và chả
      quế, nước nấu từ xương heo. Đặt cạnh nhau nhìn ra ngay.
  - q: Có nên cho măng vào không?
    a: >-
      Không, măng là của **bún măng** — một món khác. Bún mọc cổ điển không có
      măng, và thả măng vào là mùi măng lấn hết mùi nấm hương vốn là điểm tựa
      duy nhất của bát này. Muốn ăn măng thì nấu hẳn nồi bún măng cho ra món.

