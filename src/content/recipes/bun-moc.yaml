quick:
  ingredients:
    - Giò sống [[400|g]] — mua ở hàng giò chả, loại quết sẵn
    - Mộc nhĩ [[20|g]] + nấm hương [[20|g]] — ngâm nở, băm nhỏ
    - Sườn non [[400|g]] · xương ống [[500|g]] — nấu nước dùng
    - Chả quế [[150|g]] — xắt lát mỏng, xếp lên tô lúc dọn
    - Bún tươi sợi nhỏ [[800|g]] · hành tím [[4|củ]] · gừng [[1|nhánh]] nướng
    - "Dọn kèm: hành lá, rau mùi, rau muống chẻ, xà lách · chanh ớt"
  steps:
    - Trộn giò sống với mộc nhĩ + nấm hương băm, **quết lại cho quyện**, ướp lạnh.
    - Chần xương và sườn, xả sạch, hầm với hành gừng nướng **90 phút**, hớt bọt.
    - Nước sôi lăn tăn thì **thả từng viên mọc**, viên nổi lên là chín, vớt ra.
    - Nêm nhạt tay, giữ nồi lăn tăn. Nước phải **trong nhìn thấy đáy**.
    - Xếp bún, mọc, sườn, lát chả quế, chan nước sôi, rắc hành mùi.
  warning: >-
    Nặn mọc bằng tay khô là viên **nứt và bở**. Nhúng tay vào bát nước lạnh
    trước mỗi viên — viên ra tròn láng và không dính tay.

