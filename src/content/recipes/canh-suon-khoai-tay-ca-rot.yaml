flavorNote: >-
  **Chuẩn nồi canh:** nước **ngọt sâu vị xương** chứ không ngọt gắt vị bột
  nêm, màu hơi ngả vàng nhạt chứ không đục lờ. Miếng khoai **giữ được dáng
  mà bẻ ra thì bở tơi**, cà rốt mềm mà chưa nhũn.
storyEyebrow: Chuyện nồi canh chiều
storyTitle: Nồi canh **ai cũng biết nấu**, mà nấu ngon thì có mẹo

story:
  - >-
    Đây là nồi canh của những buổi chiều bình thường nhất. Không lễ lạt,
    không đãi ai — chỉ là đi chợ thấy dẻ sườn tươi, tiện tay lấy thêm củ
    khoai củ cà rốt, về nhà bắc nồi lên là xong bữa. Vị của nó cũng vậy:
    **ngọt hiền, không có góc cạnh nào**, ăn hoài không chán, và là món
    hiếm hoi mà đứa nhỏ khó tính nhất cũng chịu húp.
  - >-
    Nấu thì ai cũng nấu được, nhưng ngon hay không nằm ở hai chỗ nhỏ. Một
    là **chần sườn trước khi ninh** — mất năm phút, đổi lại nồi nước trong
    veo thay vì lờ đờ bọt xám. Hai là **thứ tự thả rau củ**: cà rốt cứng
    hơn nên vào trước, khoai tây bở hơn nên vào sau. Thả chung một lượt
    thì hoặc cà rốt còn sượng, hoặc khoai đã rã.
  - >-
    Nồi canh này còn có một cái tiện ít ai để ý: nó **chia được làm hai**.
    Phần nước trong với miếng sườn thì người lớn ăn với cơm; phần khoai
    tây cà rốt dầm nhuyễn với chút nước canh thì thành chén cho em bé. Một
    nồi, hai kiểu ăn, khỏi phải nấu riêng.

