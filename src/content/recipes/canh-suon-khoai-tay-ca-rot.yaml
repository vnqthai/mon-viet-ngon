quick:
  ingredients:
    - Sườn non [[500|g]] — chặt khúc 4 cm, chần sơ cho nước trong
    - Khoai tây [[400|g]] · cà rốt [[200|g]] — cắt miếng to cỡ ngón cái
    - Hành tím [[2|củ]] · hành lá + ngò rí [[1|nắm]]
    - "Nêm: nước mắm [[1.5|muỗng canh|frac]] · hạt nêm, muối, tiêu · nước [[1.8|lít]]"
  steps:
    - Sườn chần sơ với gừng – hành đập, rửa lại — bước này quyết định nước trong hay đục.
    - Ninh sườn với [[1.8|lít]] nước **30 phút** lửa nhỏ, hớt bọt cho kỹ.
    - Cà rốt vào **trước 8 phút**, khoai tây vào sau — đừng thả chung một lượt.
    - Nấu thêm **10 phút** tới khi xiên đũa qua khoai vừa hết cấn, nêm nếm.
    - Tắt bếp, rắc hành lá + ngò + tiêu. Múc ra tô, ăn nóng với cơm.
  warning: >-
    Khoai tây nấu quá tay là **rã hết thành nước đục sền sệt**. Xiên đũa
    thấy vừa qua là tắt bếp liền — khoai còn chín thêm trong nồi nóng.

