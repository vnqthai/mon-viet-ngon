title: Canh sườn khoai tây cà rốt **ngọt bùi, đứa nhỏ nào cũng chịu**
summary: >-
  Nước canh ngọt lịm từ sườn ninh, miếng khoai tây **bở tơi tan trong
  miệng**, khoanh cà rốt cam tươi còn giữ dáng. Món canh hiền lành nhất mâm
  cơm nhà — nấu một nồi là cả người lớn lẫn con nít đều có phần.
