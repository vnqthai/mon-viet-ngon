    - Gà ta [[1|con]] chừng [[1.4|kg]] — gà mái tơ thì thịt mềm và ngọt
    - Hành lá [[2|bó]] — cắt khúc dài, **một nửa lót dưới một nửa phủ trên**
    - Gừng [[1|củ]] thái sợi · hành tây [[1|củ]] bổ múi cau · sả [[2|cây]] đập dập
    - "Xoa gà: muối [[1|muỗng cà phê|frac]] · đường [[1|muỗng cà phê|frac]] · hạt nêm · tiêu"
    - "Muối chấm: muối [[1|muỗng canh|frac]] · tiêu · ớt · chanh · lá chanh thái chỉ"
  steps:
    - Xát muối hột với gừng khắp mình gà, rửa lại, **lau thật khô** cả trong bụng.
    - Xoa hỗn hợp muối đường tiêu khắp trong ngoài, nhét gừng sả hành tây vào bụng, ướp **30 phút**.
    - Trải nửa chỗ hành lá xuống đĩa sâu lòng, đặt gà lên, phủ nốt hành còn lại.
    - Hấp cách thủy **lửa vừa 40 phút**, trở gà một lần ở phút thứ 30.
    - Chặt miếng, xếp lại lên đĩa, rưới nước gà đọng dưới đáy, chấm muối tiêu chanh.
  warning: >-
    Đừng để nước trong nồi sôi ục ục và trào lên đĩa. Gà hấp mà **ngập nước
    thành gà luộc** — da bợt, thịt nhạt, và chỗ nước ngọt đáng lẽ đọng lại dưới
    đáy đĩa thì loãng ra hết. Nước chỉ cần đủ sôi bốc hơi, đĩa kê cao khỏi mặt
    nước.

