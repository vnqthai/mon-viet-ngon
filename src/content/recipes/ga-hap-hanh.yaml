title: Gà hấp hành **da vàng ươm, thịt ngọt nguyên**
summary: >-
  Con gà không đụng tới một giọt nước: đặt trên một lớp hành lá dày, hấp cách
  thủy cho chín bằng chính hơi của nó. Thịt ngọt đậm hơn gà luộc hẳn một bậc,
  da vàng ươm, và dưới đáy đĩa còn đọng lại thứ nước gà nguyên chất.
