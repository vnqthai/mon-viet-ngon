stepsTitle: Bốn nhịp — mà nhịp nào cũng **không cần trông nồi**
stepsLead: >-
  Món này gần như tự nấu lấy: ướp xong đặt vào nồi rồi canh giờ. Chỗ cần để ý
  chỉ có hai — lau khô con gà, và giữ cho nước đừng trào lên đĩa.
steps:
  - title: Làm sạch và lau khô
    icon: drop
    minutes: 10 phút
    bullets:
      - text: >-
          Xát muối hột với gừng đập dập khắp mình gà và trong bụng, chà kỹ chỗ
          nách cánh và khe đùi. Rửa lại dưới vòi cho sạch.
      - label: "Lau khô là bắt buộc:"
        text: >-
          Dùng giấy thấm lau khắp da và **lau cả trong bụng**. Da còn ẩm thì
          hấp xong bợt trắng chứ không vàng căng.
      - text: >-
          Cắt bỏ phần phao câu và mấy đầu móng chân cho gọn mắt.
  - title: Ướp khô 30 phút
    icon: jar
    minutes: 30 phút
    bullets:
      - text: >-
          Trộn muối, đường, hạt nêm và tiêu thành hỗn hợp khô. **Xoa đều khắp
          ngoài da và cả trong bụng**, xoa kỹ để gia vị bám vào.
      - text: >-
          Nhét gừng sợi, hành tây bổ múi cau và sả đập dập vào bụng gà. Gài hai
          chân gà chéo vào nhau cho con gà gọn dáng.
      - text: Để ướp **30 phút** ở nhiệt độ phòng, hoặc bọc kín để ngăn mát vài tiếng.
    timer:
      secs: 1800
      label: Ướp gà · 30:00
      doneMsg: Bắc nồi nước lên là vừa!
    callout:
      type: tip
      text: >-
        Muốn da vàng đậm hơn thì hòa chút nghệ tươi giã vắt nước vào hỗn hợp
        xoa, hoặc quét một lớp mỡ gà lên da trước khi hấp. Đừng dùng phẩm màu —
        chính hơi nóng và lớp da khô đã cho màu vàng rồi.
  - title: Xếp hành, hấp cách thủy
    icon: pot
    minutes: 40 phút
    bullets:
      - label: "Xếp:"
        text: >-
          Trải **một nửa chỗ hành lá** thành lớp dày xuống đĩa sâu lòng, đặt gà
          nằm nghiêng lên trên, rắc gừng sợi rồi phủ nốt nửa hành còn lại.
      - label: "Đặt nồi:"
        text: >-
          Kê đĩa lên giá trong nồi to, đổ nước dưới đáy nồi **thấp hơn mặt đĩa**.
          Đậy vung kín, hấp lửa vừa.
      - label: "Trở một lần:"
        text: >-
          Ở phút thứ 30, mở vung trở gà sang mặt kia, chan chút nước đọng trong
          đĩa lên mình gà rồi hấp tiếp [[10|phút]].
      - label: "Thử chín:"
        text: >-
          Xiên đũa vào chỗ dày nhất của đùi, nước chảy ra **trong** là chín. Còn
          hồng thì hấp thêm 5 phút.
    timer:
      secs: 2400
      label: Hẹn giờ hấp gà · 40:00
      doneMsg: Xiên thử đùi gà xem nước có trong chưa nghen!
  - title: Chặt miếng, rưới nước gà
    icon: knife
    minutes: 10 phút
    bullets:
      - text: >-
          Vớt gà ra, **để nghỉ [[10|phút]]** rồi mới chặt — chặt ngay lúc còn
          nóng già thì nước ngọt chảy hết ra thớt.
      - text: >-
          Chặt miếng vừa ăn, xếp lại theo dáng con gà lên đĩa có lót hành đã hấp.
      - label: "Đừng bỏ nước đáy đĩa:"
        text: >-
          Chỗ nước gà đọng dưới đáy **rưới ngược lên thịt**, hoặc chan vào chén
          cơm. Đó là phần đậm nhất của cả món.
      - text: Rắc lá chanh thái chỉ, dọn với chén muối tiêu chanh.
    doneText: Xong — rưới nước gà lên rồi mới bưng ra!

tipsTitle: 4 chỗ **quyết định** đĩa gà hấp hành
tips:
  - icon: drop
    title: Nước trong nồi phải thấp hơn đĩa
    text: >-
      Đây là ranh giới giữa gà hấp và gà luộc. Nước sôi trào lên ngập đĩa thì da
      bợt, thịt nhạt, và chỗ nước gà quý giá dưới đáy loãng ra thành nước lã. Đổ
      nước vừa phải, kê đĩa lên giá cho cao, và để lửa vừa chứ đừng lửa lớn.
  - icon: herb
    title: Hành lá lót dưới, đừng chỉ rắc lên trên
    text: >-
      Lớp hành dưới đáy làm hai việc cùng lúc: kê con gà lên cho hơi nóng luồn
      xuống mặt dưới, và tiết mùi lên thẳng vào da. Chỉ rắc hành lên trên thì mặt
      dưới con gà nằm áp đĩa, chín chậm hơn và da chỗ đó bị hấp trong nước đọng.
  - icon: jar
    title: Ướp khô, không ướp ướt
    text: >-
      Nhiều người quen ướp thịt bằng nước mắm hay dầu hào. Với món này thì không:
      hỗn hợp ướt làm da gà ẩm, hấp xong bợt trắng và mềm oặt. Muối đường tiêu
      trộn khô, xoa thật kỹ cả trong bụng — đủ đậm mà da vẫn căng vàng.
  - icon: clock
    title: Để gà nghỉ 10 phút rồi mới chặt
    text: >-
      Vừa vớt ra mà chặt ngay thì nước ngọt trong thớ thịt còn đang căng, chảy
      hết ra thớt và miếng gà khô lại. Để nghỉ mười phút cho thớ thịt lắng
      xuống, chặt ra miếng nào cũng mọng. Đây là mẹo dùng chung cho mọi món thịt
      nguyên khối.

serve:
  title: Đĩa gà **xếp lại nguyên dáng** — món giữa mâm
  paras:
    - >-
      Gà hấp hành chặt xong nên xếp lại theo dáng con gà trên đĩa, phủ hành đã
      hấp và rắc lá chanh thái chỉ. Nó là món giữa mâm: có cơm trắng, có bát
      canh, và ai cũng gắp tới được.
    - >-
      Phần **nước gà đọng dưới đáy đĩa** đừng bỏ. Rưới một nửa lên thịt cho
      bóng, còn một nửa để riêng ra chén nhỏ — chan cơm trắng thì hết veo, và
      trẻ nhỏ thường thích chỗ đó hơn cả miếng thịt.
  aside:
    title: Dọn cùng gì cho hợp
    intro: "Ba thứ đi cùng đĩa gà hấp:"
    items:
      - icon: lime
        text: "**Chén muối tiêu chanh có lá chanh** — vắt chanh ngay lúc dọn, vắt sớm là đắng."
      - icon: rice
        text: "**Cơm trắng nóng** chan nước gà dưới đáy đĩa."
      - icon: bowl
        text: "**Một bát canh thanh** — canh cải hoặc canh bí đao cho cân với chỗ đậm của gà."

faq:
  - q: Không có nồi hấp to thì làm sao?
    a: >-
      Chặt gà làm đôi hoặc làm tư rồi hấp trong nồi thường: kê một cái giá hoặc
      úp một cái chén dưới đáy nồi để kê đĩa lên khỏi mặt nước. Gà chặt sẵn thì
      hấp nhanh hơn, chừng **25–30 phút**. Cái mất là không dọn được nguyên con.
  - q: Da gà bị bợt trắng chứ không vàng?
    a: >-
      Ba nguyên nhân theo thứ tự hay gặp: **lau chưa khô**, **ướp bằng hỗn hợp
      ướt**, hoặc **nước sôi trào lên ngập đĩa**. Lần sau lau kỹ, ướp khô, và hạ
      mực nước xuống. Đang hấp dở mà thấy vậy thì mở vung, chắt bớt nước trong
      đĩa ra rồi hấp tiếp.
  - q: Gà công nghiệp hấp có được không?
    a: >-
      Được, nhưng rút giờ xuống còn **30 phút** vì thịt mềm sẵn, hấp lâu là nát.
      Thịt sẽ nhạt hơn gà ta thấy rõ, nên nêm nhỉnh tay hơn một chút và tăng
      gừng với hành lá để bù mùi.
  - q: Còn dư thì hâm lại thế nào?
    a: >-
      Cất cả thịt lẫn phần nước đáy đĩa vào hộp, để ngăn mát. Tới bữa **hấp lại
      5 phút** cùng chỗ nước đó là miếng gà mềm như mới. Đừng quay lò vi sóng —
      thịt gà hấp quay lại là khô xác và dai.

ticker:
  - text: Lót hành lá dưới đáy cho hơi luồn xuống
  - text: Nước đọng dưới đáy đĩa là chỗ ngọt nhất
