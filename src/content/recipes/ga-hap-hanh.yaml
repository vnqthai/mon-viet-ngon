flavorNote: >-
  **Chuẩn đĩa:** da **vàng ươm và căng**, chặt ra thấy thịt sát xương còn hồng
  nhạt là vừa chín tới; nước đọng dưới đáy đĩa **trong và ngọt gắt** chứ không
  đục. Mùi lên là mùi hành lá chín tới quyện gừng, không phải mùi luộc.

storyEyebrow: Chuyện món ăn
storyTitle: Cùng một con gà — **hấp thì đậm, luộc thì nhạt đi một nửa**
story:
  - >-
    Gà luộc là món quen tới mức ít ai hỏi lại. Nhưng đem một con gà y hệt mà
    **hấp** thay vì luộc thì khác hẳn, và lý do rất đơn giản: luộc là thả thịt
    vào nước, nên chất ngọt trong thịt tan ra nồi nước dùng; hấp thì thịt không
    chạm nước, chất ngọt ở lại trong thớ, phần chảy ra cũng chỉ đọng xuống đáy
    đĩa chứ không đi đâu mất.
  - >-
    Đó là lý do đĩa gà hấp bao giờ cũng có **một ít nước sánh dưới đáy** — thứ
    nước gà nguyên chất, mặn ngọt sẵn, rưới ngược lên thịt lúc dọn. Người quen
    nấu còn để dành chỗ nước đó chan cơm, và nó đậm hơn nước luộc gà nhiều lần.
  - >-
    Lớp hành lá lót dưới không phải để trang trí. Nó **kê con gà lên khỏi mặt
    đĩa**, cho hơi nóng luồn được xuống dưới nên gà chín đều hai mặt; đồng thời
    hành gặp hơi nóng thì tiết mùi lên thẳng vào da gà. Cùng lý do đó mà nửa còn
    lại được phủ lên trên — mùi đi từ cả hai phía.
  - >-
    Món này hợp mâm cơm có khách hơn là bữa thường, vì nó cần một con gà nguyên
    và một cái nồi to. Bù lại nó gần như không thể hỏng: canh đúng giờ, không
    đụng tới nữa, mở vung ra là xong. Trong mâm cỗ, đây là món **thay chỗ gà
    luộc** mà không ai thấy thiếu.

