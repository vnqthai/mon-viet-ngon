flavorNote: >-
  **Chuẩn vị:** muỗng trứng xúc lên **mịn không lỗ rỗ, mềm còn hơi rung
  rinh**, đậm dịu thơm tiêu hành — đứa nhỏ nhất mâm lùa cơm không cần ai
  dỗ.

storyEyebrow: Chuyện chén trứng
storyTitle: Món "chữa cháy" **hiền nhất** của bếp Việt
story:
  - >-
    Hỏi mười người giữ bếp "bữa nay lỡ cạn đồ ăn thì làm gì", dám chắc quá
    nửa trả lời: **trứng chưng**. Mấy trái trứng, nhúm thịt băm, ít nấm mèo
    — toàn đồ có sẵn trong tủ — đánh chung một tô, hấp cách thủy hai mươi
    phút là có món mặn mềm mướt cứu nguyên mâm cơm. Người miền Nam kêu
    **trứng chưng**, nhiều nhà kêu trứng hấp; còn phiên bản ép đặc nằm trên
    dĩa cơm tấm ngoài tiệm thì mang tên **chả trứng hấp** — anh em ruột một
    nhà cả.
  - >-
    Bản trong bài này là **bản cơm nhà**: mềm hơn chả trứng tiệm, xúc muỗng
    nào mướt muỗng đó, vị hiền để đứa nhỏ nhất mâm cũng lùa được cơm. Nhưng
    vẫn học của tiệm đúng hai chiêu: **chừa lòng đỏ phết mặt** phút chót cho
    lớp áo vàng óng nhìn là muốn xúc liền, và **nhúm miến ngâm cắt ngắn**
    trộn vô — miến hút nước thừa, miếng trứng xắn ra đứng dáng chứ không
    chảy.
  - >-
    Món này không có gì cao siêu, chỉ có ba cái "đừng": đừng đánh bông,
    đừng để lửa to, đừng quên đậy mặt chén. Giữ đủ ba cái đừng, chén trứng
    ra khỏi xửng **mặt mịn như tấm lụa vàng** — và bạn sẽ hiểu vì sao món
    giản dị này có mặt trên mâm cơm của gần như mọi nhà người Việt, từ Bắc
    chí Nam.

