stepsEyebrow: Vô bếp thôi!
stepsTitle: 5 bước ra **chén trứng vàng óng**
stepsLead: >-
  Toàn bộ việc tay chỉ chừng mười phút, còn lại là chờ xửng hấp làm giùm.
  Món dễ nhất site này — nhưng dễ không có nghĩa là không có mẹo.
steps:
  - title: Ngâm nở nấm mèo, miến
    icon: drop
    minutes: 15 phút
    bullets:
      - label: "Nấm mèo:"
        text: >-
          ngâm nước **ấm** 15 phút cho nở mềm hết cỡ, cắt bỏ gốc cứng, băm
          nhỏ. Nấm mèo là chỗ vui miệng nhất chén trứng — cắn trúng nghe
          **sần sật** mới đã.
      - label: "Miến:"
        text: >-
          ngâm nước lạnh 10 phút cho dẻo mềm, vớt ra **cắt khúc 2–3 cm**
          (lấy kéo cắt là nhanh nhất). Miến dài quá sẽ vón cục khi chưng.
      - label: "Hành tím:"
        text: băm nhuyễn; hành lá xắt nhỏ để riêng chờ rắc mặt.
    callout:
      type: tip
      text: >-
        Đừng ngâm nấm mèo bằng nước sôi cho nhanh — nấm nhớt, mất độ giòn.
        Nước ấm tay là đúng độ.
    timer:
      secs: 900
      label: Hẹn giờ ngâm nấm · 15:00
      doneMsg: Nấm nở mềm rồi — băm nhỏ thôi!
  - title: Trộn trứng — nhẹ tay thôi
    icon: egg
    minutes: 5 phút
    bullets:
      - label: "Đập trứng:"
        text: >-
          đập [[5|trái]] trứng, **tách riêng 2 lòng đỏ ra chén nhỏ** để dành
          phết mặt — đây là "chữ ký" của món, đừng làm biếng bỏ qua.
      - label: "Trộn:"
        text: >-
          phần trứng còn lại cho thịt băm (dằm tơi trước cho khỏi vón cục),
          nấm mèo, miến, hành tím vô; nêm [[1.5|muỗng canh|frac]] nước mắm
          + nhúm tiêu + [[3|muỗng canh]] nước ấm.
      - label: "Khuấy đúng kiểu:"
        text: >-
          khuấy **nhẹ tay theo một chiều** cho vừa hòa quyện là dừng — trứng
          mịn nhờ khuấy đủ, hỏng vì khuấy hăng.
    callout:
      type: warn
      text: >-
        Đánh bông kiểu làm bánh là đưa cả trời không khí vô trứng — hấp lên
        bọt nổi lỗ chỗ, mặt **rỗ như tổ ong**. Khuấy hòa là đủ, thấy sủi bọt
        là dừng liền.
  - title: Hấp cách thủy lửa vừa
    icon: pot
    minutes: 20 phút
    bullets:
      - label: "Chọn chén:"
        text: >-
          đổ trứng vô **chén sứ sâu lòng** (một chén lớn, hoặc chia mấy chén
          nhỏ cho mỗi người một phần — chén nhỏ chín nhanh hơn, chừng 12–15
          phút).
      - label: "Đậy mặt chén:"
        text: >-
          úp một cái dĩa nhỏ hoặc bọc màng thực phẩm chịu nhiệt lên miệng
          chén — chắn không cho nước từ nắp nồi **nhỏ giọt làm rỗ mặt**.
      - label: "Hấp:"
        text: >-
          nước trong nồi sôi mới đặt chén vô xửng, hạ **lửa vừa** cho nước
          sôi lăn tăn, đậy nắp nồi, hấp **20 phút**.
      - label: "Thử chín:"
        text: >-
          xiên cây tăm vô giữa chén, rút ra **khô ráo là chín**; còn ướt thì
          hấp thêm 3–5 phút rồi thử lại.
    callout:
      type: warn
      text: >-
        Lửa to nước sôi bùng là trứng nở xốp rồi xẹp — vừa **chai cứng vừa
        rỗ**. Nhớ khẩu quyết: nước sôi lăn tăn, trứng mịn màng.
    timer:
      secs: 1200
      label: Hẹn giờ hấp trứng · 20:00
      doneMsg: Xiên tăm thử coi — rút ra khô là chín rồi!
  - title: Phết lòng đỏ — mặt vàng óng như tiệm
    icon: sun
    minutes: 5 phút
    bullets:
      - label: "Pha lòng đỏ:"
        text: >-
          đánh tan 2 lòng đỏ để dành với **vài giọt dầu ăn** — chút dầu cho
          mặt trứng bóng mượt chứ không khô mốc.
      - label: "Phết:"
        text: >-
          mở nắp, gỡ dĩa đậy, **phết đều lòng đỏ** phủ kín mặt trứng — quét
          một lớp là đủ vàng óng.
      - label: "Hấp mở nắp:"
        text: >-
          hấp thêm **3–5 phút không đậy nắp nồi** cho lòng đỏ vừa ráo mặt —
          mở nắp để hơi thoát bớt, mặt trứng khô ráo óng ả chứ không đọng
          nước loang lổ.
    callout:
      type: tip
      text: >-
        Chiêu này học thẳng của tiệm cơm tấm: trộn hết lòng đỏ từ đầu thì
        mặt trứng lốm đốm — phải **chừa lại phết sau** mới ra lớp áo vàng
        mượt đều tăm tắp đó.
  - title: Dọn ra mâm
    icon: bowl
    minutes: 2 phút
    bullets:
      - text: >-
          Rắc **hành lá + tiêu xay** lên mặt trứng còn đang bốc khói — dọn
          nguyên chén, hay khéo tay **úp ngược ra dĩa** như ngoài tiệm
          càng đẹp mâm.
      - text: >-
          Lát ớt để **chén riêng** cho người lớn tự thêm — phần của mấy đứa
          nhỏ giữ nguyên vị hiền.
      - text: >-
          Dọn cùng cơm trắng nóng, dưa leo thái lát; xúc muỗng trứng **úp
          lên chén cơm** cho tụi nhỏ là đúng bài nhất.
    callout:
      type: tip
      text: >-
        Chén trứng đạt chuẩn nhìn là biết: **mặt vàng óng phẳng mịn, xắn
        muỗng vô thấy mềm còn hơi rung rinh**, bên trong lấm tấm thịt nấm —
        thơm nhẹ nhàng mà đưa cơm dữ dội.
    doneText: Chén trứng lên mâm — xong!

tipsTitle: 6 bí quyết cho **chén trứng mịn màng**
tipsLead: >-
  Trứng chưng dễ mà, sao có nhà chưng ra mịn như lụa, có nhà rỗ như tổ ong?
  Khác nhau đúng ở mấy điều nhỏ xíu này.
tips:
  - icon: sun
    title: Chừa lòng đỏ phết mặt
    text: >-
      Lớp áo vàng óng mượt là **chữ ký của món** — trộn hết lòng đỏ từ đầu
      thì không cách nào có được. Chừa 2 lòng đỏ, phết phút chót, hấp mở nắp
      vài phút là mặt trứng đẹp như tiệm.
  - icon: spoon
    title: Khuấy một chiều, đừng đánh bông
    text: >-
      Bọt khí đánh vô trứng sẽ nổi lên khi hấp, vỡ ra thành **lỗ rỗ**.
      Khuấy nhẹ theo một chiều cho hòa quyện là dừng — món này thưởng người
      nhẹ tay.
  - icon: drop
    title: Ba muỗng nước ấm cho mềm
    text: >-
      Trứng pha thêm chút nước sẽ chưng ra **mềm mướt, rung rinh** thay vì
      chắc nịch. Thích kiểu chắc miếng gần với chả trứng thì bớt nước lại —
      chỉnh được theo ý nhà mình.
  - icon: flame
    title: Nước sôi lăn tăn, không sôi bùng
    text: >-
      Nhiệt cao làm trứng nở xốp rồi xẹp xuống — thành phẩm **chai, rỗ tổ
      ong**. Lửa vừa đủ cho nước lăn tăn là trứng chín từ từ, mịn từ đáy
      lên mặt.
  - icon: bowl
    title: Đậy mặt chén khi hấp
    text: >-
      Hơi nước ngưng trên nắp nồi nhỏ giọt xuống là **thủ phạm số một** của
      mặt trứng rỗ loang lổ. Úp cái dĩa nhỏ lên miệng chén là xong chuyện —
      mẹo một giây, đẹp cả chén trứng.
  - icon: noodle
    title: Miến là "khung xương" giấu mặt
    text: >-
      Nhúm miến ngâm cắt ngắn hút hết nước thừa, giúp miếng trứng **xắn ra
      đứng dáng** chứ không chảy xệ — bí quyết đứng bếp của mấy tiệm cơm tấm
      lâu năm, mang về bếp nhà xài luôn.

serve:
  title: Dọn mâm **cơm nhà hiền khô**
  paras:
    - >-
      Chén trứng chưng nóng đặt giữa mâm, xắn tới đâu khói thơm bay tới đó.
      Xúc một muỗng **úp lên chén cơm nóng**, thêm lát dưa leo mát — đứa nhỏ
      lùa hết chén cơm hồi nào không hay, người lớn thì chan thêm muỗng nước
      mắm dằm ớt là "dậy" cả bữa.
    - >-
      Mâm hợp nhất với món này: trứng chưng + **canh bí đỏ thịt bằm** + dĩa
      **rau muống xào tỏi** — bộ ba hiền lành cho nhà có con nít, nấu nhàn
      tênh mà đủ đạm, đủ rau, đủ canh.
    - >-
      Món này còn là "vé thoát hiểm" cho ngày bận: 35 phút từ tủ lạnh lên
      mâm, nguyên liệu chẳng cần đi chợ. Khách ghé bất chợt cũng kịp — mà
      khách ăn xong thế nào cũng hỏi công thức.
  aside:
    title: Mâm cơm gợi ý
    intro: "Bộ ba hiền lành cho bữa chiều:"
    items:
      - icon: bowl
        text: "**Canh bí đỏ thịt bằm** — ngọt lành, chung ê-kíp hiền với trứng chưng."
      - icon: herb
        text: "**Rau muống xào tỏi** — xanh giòn, cân lại độ mềm của trứng."
      - icon: rice
        text: "**Cơm trắng nóng** — nồi cơm bữa đó nhớ nấu dư một chút."
      - icon: chili
        text: "**Chén mắm ớt để riêng** — người lớn tự thêm, phần bé giữ vị hiền."

faq:
  - q: Trứng chưng này có phải chả trứng của cơm tấm không?
    a: >-
      Anh em ruột đó! **Chả trứng cơm tấm đặc và nhiều nhân hơn** (thường
      thêm bì, ép khuôn lớn, cắt miếng đứng dáng), còn bản này mềm mướt hơn,
      đúng kiểu chén trứng của mâm cơm nhà. Muốn tiến gần bản cơm tấm: bớt
      nước, thêm miến và nhân.
  - q: Sao mặt trứng bị rỗ như tổ ong?
    a: >-
      Ba thủ phạm quen mặt: **lửa to quá** (nước sôi bùng), **nước từ nắp
      nhỏ giọt** (quên đậy mặt chén), **đánh trứng sủi bọt**. Lần sau né đủ
      ba cái là mặt trứng mịn tưng ngay.
  - q: Hấp bằng nồi cơm điện được không?
    a: >-
      Được, kiểu tiện nhất luôn: nấu cơm như thường, **lúc nồi vừa cạn
      nước** thì đặt chén trứng lên mặt cơm, đậy nắp — cơm chín trứng cũng
      chín. Mặt trứng sẽ không vàng óng bằng bản hấp xửng (khó phết lòng đỏ
      giữa chừng), bù lại một nồi ra luôn cả cơm lẫn món mặn.
  - q: Không có miến thì bỏ luôn được không?
    a: >-
      Được — trứng vẫn ngon, khối trứng chỉ **mềm "lỏng tay" hơn chút** khi
      xắn. Nấm mèo thì ráng đừng bỏ: cái sần sật của nó là điểm vui miệng
      nhất món này.
  - q: Trứng gà hay trứng vịt ngon hơn?
    a: >-
      Trứng vịt **béo đậm, màu vàng sậm hơn**; trứng gà thanh nhẹ, thơm dịu
      — nhà có bé thường chọn trứng gà. Quy đổi cho công thức này: 4 trứng
      vịt tương đương 5 trứng gà.
  - q: Làm dư, trữ được không?
    a: >-
      Đậy kín để **ngăn mát được 2 ngày**. Ăn lại thì hấp 5 phút hoặc quay
      vi sóng có đậy nắp — mềm gần như mới. Đừng hâm khô không đậy: mặt
      trứng chai lại, uổng công phết lòng đỏ.

