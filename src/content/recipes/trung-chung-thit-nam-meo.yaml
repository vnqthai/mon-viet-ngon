heroEyebrow: Mâm cơm chiều có con nít…

quick:
  ingredients:
    - Trứng gà [[5|trái]] (hoặc 4 trứng vịt — béo đậm hơn) — **chừa lại 2 lòng đỏ** để phết mặt
    - Thịt heo băm [[150|g]] — nạc dăm cho mềm
    - >-
      Nấm mèo khô [[10|g]] (miền Bắc gọi mộc nhĩ) + miến dong [[20|g]] —
      ngâm nở, cắt nhỏ
    - Hành tím [[2|củ]] băm · hành lá [[3|cọng]] · tiêu xay
    - >-
      Nêm: nước mắm [[1.5|muỗng canh|frac]] · thêm [[3|muỗng canh]] nước ấm
      cho trứng mềm mướt
  steps:
    - Ngâm nấm mèo nước ấm 15 phút cho nở, băm nhỏ; miến ngâm mềm, cắt khúc 2–3 cm.
    - >-
      Đánh trứng (chừa 2 lòng đỏ) với thịt băm, nấm, miến, hành tím, nước
      mắm, nước ấm — **khuấy nhẹ một chiều, đừng đánh bông**.
    - Đổ vô chén sứ sâu lòng, **đậy mặt chén**, hấp cách thủy lửa vừa 20 phút.
    - >-
      Xiên tăm rút ra khô là chín — phết lòng đỏ lên mặt, hấp **mở nắp**
      thêm 3–5 phút cho mặt vàng óng.
    - Rắc hành lá + tiêu, dọn với cơm nóng, dưa leo; ớt xắt lát để riêng cho người lớn.
  warning: >-
    Lửa to, nước từ nắp nhỏ giọt xuống, hay đánh trứng sủi bọt — dính một
    trong ba là mặt trứng **rỗ tổ ong** liền.

