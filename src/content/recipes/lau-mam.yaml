stepsEyebrow: Vô bếp thôi!
stepsTitle: 6 bước ra **nồi lẩu mắm chuẩn miền Tây**
stepsLead: >-
  Món này chia hai nhánh chạy song song: một bên là nồi nước lèo phải nấu
  đúng thứ tự, một bên là dọn rổ rau và dĩa đồ nhúng. Nồi nước lèo nấu xong
  có thể để đó cả tiếng, nên **cứ làm nước lèo trước cho xong rồi mới xoay
  qua rau**.
steps:
  - title: Nấu mắm cho rã, lọc bỏ xương
    icon: pot
    minutes: 20 phút
    intro: "Bước gốc của cả nồi lẩu — làm ẩu thì mấy bước sau không cứu được:"
    bullets:
      - label: "Nấu rã:"
        text: >-
          Cho [[150|g]] mắm cá linh + [[150|g]] mắm cá sặc vào nồi với
          [[500|ml]] nước, đun lửa vừa, **khuấy đều cho thịt mắm rã hết ra
          nước** — chừng 10–12 phút.
      - label: "Lọc kỹ:"
        text: >-
          Đổ qua rây mắt nhỏ, dùng muôi **miết cho ra hết nước cốt**, bỏ lại
          phần xương và vảy. Nước lọc ra màu nâu đục, đó là cốt của nồi lẩu.
      - label: "Ninh xương:"
        text: >-
          Song song, chần [[500|g]] xương heo qua nước sôi, rửa lại rồi ninh
          với [[1.5|lít]] nước lọc trong **40 phút**, hớt bọt cho nước trong.
    callout:
      type: warn
      text: >-
        Xương cá linh nhỏ như cây kim và **không tan khi nấu**. Rây một lần
        chưa yên tâm thì rây hai lần — đây là chỗ duy nhất của món này có thể
        gây hóc.
    timer:
      secs: 720
      label: Hẹn giờ nấu mắm · 12:00
      doneMsg: Tắt bếp, lọc qua rây liền nghen!
  - title: Phi sả, tỏi, ngải bún
    icon: flame
    minutes: 10 phút
    bullets:
      - text: >-
          Ngải bún cạo vỏ, **giã dập** (hoặc thái lát thật mỏng). Sả 2 cây
          băm nhuyễn, tỏi [[1|củ]] băm.
      - text: >-
          Bắc chảo, cho chút dầu, phi **tỏi trước cho vàng**, rồi tới sả băm,
          sau cùng mới thả ngải bún — đảo nhanh 1 phút là đủ dậy mùi.
      - text: >-
          Trút hết chỗ phi thơm vào nồi nước xương đang sôi, thả thêm 3 cây
          sả đập dập.
    callout:
      type: tip
      text: >-
        Ngải bún cho vào **sau cùng và đảo nhanh** — mùi của nó dịu, để lâu
        trên chảo nóng là bay mất. Không mua được ngải bún thì cứ nấu thiếu,
        đừng thay bằng riềng hay nghệ vì hai thứ đó lấn hết mùi mắm.
  - title: Ráp nồi nước lèo, nêm cho cân
    icon: drop
    minutes: 20 phút
    bullets:
      - text: >-
          Chắt **nước mắm đã lọc** vào nồi nước xương, thêm [[500|ml]] nước
          dừa tươi, đun sôi lại rồi hạ liu riu.
      - text: >-
          Thả cà tím cắt khúc vào, nấu **12–15 phút** cho miếng cà mềm rục và
          ngậm đầy nước lèo.
      - text: >-
          Nêm [[2|thìa canh|frac]] đường phèn, thả 2 trái ớt hiểm đập dập.
          Nếm thử — mặn đậm đi trước, hậu ngọt theo sau là đạt.
      - text: >-
          Nhạt thì thêm chút nước mắm; **lỡ mặn quá thì châm thêm nước dừa**
          chứ đừng châm nước lã, nước lã làm nồi lẩu bệch hẳn.
    callout:
      type: tip
      text: >-
        Nồi lẩu mắm **phải mặn hơn tô canh bình thường** — vì lát nữa rau
        nhúng vào sẽ kéo vị xuống rất nhanh. Nêm vừa miệng lúc chưa có rau là
        tới bàn thành nhạt.
    timer:
      secs: 900
      label: Hẹn giờ nấu cà tím · 15:00
      doneMsg: Cà mềm rồi, nếm lại nồi nước lèo!
  - title: Soạn dĩa đồ nhúng
    icon: knife
    minutes: 20 phút
    bullets:
      - text: >-
          Cá basa cắt khoanh dày cỡ đốt tay, rửa với nước muối gừng rồi để
          thật ráo. Cá kèo thì để nguyên con, chỉ chà muối cho sạch nhớt.
      - text: >-
          Tôm cắt râu chừa vỏ; mực làm sạch, **khứa vảy rồng** rồi cắt miếng
          — khứa vậy nhúng vào là miếng mực cuộn tròn, thấm nước lèo.
      - text: >-
          Thịt ba rọi quay cắt miếng vuông cỡ hai đốt tay, xếp riêng một góc
          dĩa cho miếng da khỏi mềm.
      - text: >-
          Chả cá thác lác quết thêm chút tiêu, để nguyên tô, tới bàn múc từng
          viên thả vào nồi.
  - title: Rửa rổ rau — nhiều hơn mình tưởng
    icon: herb
    minutes: 25 phút
    bullets:
      - text: >-
          Bông súng tước vỏ ngoài, bẻ khúc cỡ ngón tay. Rau nhút ngắt khúc,
          bỏ lớp phao trắng. Kèo nèo bẻ khúc, bắp chuối bào ngâm nước chanh
          loãng.
      - text: >-
          Rửa từng loại **riêng từng thau** rồi mới trộn chung lên rổ — rau
          đồng hay lẫn đất và ốc con.
      - text: >-
          Để rau thật ráo mới chất lên rổ. **Rau còn đọng nước là nồi lẩu
          loãng dần** sau vài lượt nhúng.
    callout:
      type: tip
      text: >-
        Ước lượng cho dễ: một người ăn cỡ **hai nắm rau đầy**, tức nồi
        [[6|người]] cần chừng một rổ cao ngang khuỷu tay. Thà dư chứ đừng
        thiếu — lẩu mắm mà hụt rau thì mặn không chịu nổi.
  - title: Bắc nồi lên bàn, nhúng tới đâu ăn tới đó
    icon: bowl
    minutes: 5 phút
    bullets:
      - text: >-
          Bắc nồi lên bếp giữa bàn, để lửa vừa cho nồi **sôi lăn tăn suốt
          bữa** chứ đừng sôi bùng.
      - text: >-
          Thả cá và chả cá trước vì lâu chín, rồi tới tôm mực, thịt quay thả
          sau cùng.
      - text: >-
          Rau **nhúng từng đũa nhỏ, ăn tới đâu nhúng tới đó**. Trút cả rổ vào
          nồi là rau nhũn và nước lèo nguội ngắt.
      - text: >-
          Gắp ra chén bún, chan nước lèo, dằm thêm ớt vào chén nước mắm bên
          cạnh cho ai ăn cay.
    doneText: Dọn lên bàn — xong!

tipsTitle: 6 điều quyết định **nồi lẩu mắm ngon hay dở**
tipsLead: >-
  Lẩu mắm không có bước nào khó về tay nghề, nhưng có vài chỗ mà sai một cái
  là hỏng cả nồi — hầu hết nằm ở khâu chọn mắm và cách nêm.
tips:
  - icon: fish
    title: Hai loại mắm, không phải một
    text: >-
      Đây là điều người miền Tây nhắc đầu tiên: **mắm cá linh cho hậu ngọt,
      mắm cá sặc cho mùi**. Nấu một loại thì nồi nước lèo lệch hẳn — chỉ cá
      linh thì thiếu mùi, chỉ cá sặc thì cụt hậu. Tỷ lệ dễ nhớ là **một một**,
      ai thích mùi đậm thì nhích mắm cá sặc lên chút.
  - icon: drop
    title: Nước dừa thay cho đường
    text: >-
      Mắm vốn mặn gắt, cần thứ kéo nó dịu lại. Đường thì làm nồi **ngọt lợ**,
      còn nước dừa tươi cho cái ngọt mỏng và thơm, lại giữ nước lèo trong hơn.
      Cỡ [[500|ml]] cho nồi [[6|người]] là vừa; nêm thêm đường phèn chỉ để
      chỉnh lần cuối.
  - icon: ginger
    title: Ngải bún là củ gì, mua ở đâu
    text: >-
      Ngải bún là **một loại củ thuộc họ gừng**, thân rễ chia nhánh như mấy
      ngón tay, màu vàng nhạt, nhìn na ná củ nghệ nhưng mùi dịu hơn hẳn — không
      xộc lên như gừng mà thoảng và lâu tan. Nó chính là thứ làm nồi mắm miền
      Tây khác nồi mắm nấu ở nơi khác. Hàng đồ khô ngoài chợ hay bán **dạng củ
      tươi hoặc lát phơi khô**; hỏi không có thì cứ nấu thiếu, vì riềng hay
      nghệ thay vào sẽ lấn át hết mùi mắm.
  - icon: pod
    title: Cà tím phải nấu mềm rục
    text: >-
      Nhiều người thả cà tím vào lúc gần ăn cho khỏi nát — làm vậy là phí.
      Miếng cà ngon phải **nấu từ đầu, mềm rục và ngậm đầy nước mắm**, gắp lên
      là ứa nước. Ngâm nước muối loãng trước khi nấu để miếng cà khỏi thâm đen.
  - icon: herb
    title: Rau nhúng từng đũa, đừng trút cả rổ
    text: >-
      Rau đồng nhả nước rất nhiều. Trút cả rổ vào nồi thì **nước lèo loãng và
      nguội**, mà rau cũng nhũn hết. Nhúng từng đũa nhỏ, rau đắng và điên điển
      chỉ nhúng thoáng qua rồi gắp ra liền, bông súng và kèo nèo thì để lâu
      hơn chút cho thấm.
  - icon: level
    title: Nêm mặn hơn bình thường
    text: >-
      Đây là chỗ người nấu lần đầu hay hụt. Nồi lẩu mắm nếm lúc chưa nhúng gì
      phải thấy **mặn hơn tô canh** một bậc rõ rệt, vì rau và bún sẽ kéo vị
      xuống rất nhanh. Ăn tới nửa bữa thấy nhạt thì châm thêm chút nước mắm
      đã lọc để dành từ đầu.

serve:
  title: Nồi giữa bàn — **ăn chậm, nói nhiều**
  paras:
    - >-
      Lẩu mắm không phải món dọn ra rồi ăn cho xong. Nồi đặt giữa bàn, lửa
      liu riu suốt buổi, ai đói lúc nào nhúng lúc đó — nên nó hợp với những
      bữa **đông người và ngồi lâu**: nhà có khách, cuối tuần con cháu về, hay
      một chiều mấy anh em ngồi lai rai.
    - >-
      Ăn kèm chuẩn nhất là **bún tươi cọng nhỏ**, gắp vào chén rồi chan nước
      lèo, gắp thêm miếng cá với một đũa rau. Ai thích cơm trắng cũng được,
      nhưng bún hợp hơn vì nó không hút mất nước lèo.
    - >-
      Nồi nước lèo nấu dư thì để nguội, cất ngăn mát được **3 ngày**, hôm sau
      đun lại chan bún là thành tô **bún mắm** — cùng một nồi, hai kiểu ăn.
      Chỉ có điều lần hai thì nêm lại cho vừa, vì để qua đêm vị mắm sẽ đằm
      xuống.
  aside:
    title: Trên bàn lẩu mắm
    intro: "Mấy thứ phải có sẵn:"
    items:
      - icon: herb
        text: "**Rổ rau chất cao** — càng nhiều loại càng vui, thiếu rau là hỏng bữa."
      - icon: bottle
        text: "**Chén nước mắm ớt** — dằm ớt hiểm, chấm cá và thịt quay."
      - icon: noodle
        text: "**Bún tươi trụng nóng** — cọng nhỏ, để riêng từng vắt cho dễ gắp."
      - icon: lime
        text: "**Chanh và ớt xắt** — ai ăn cay tự nêm vào chén."

faq:
  - q: Không mua được mắm cá linh hoặc cá sặc thì sao?
    a: >-
      Hàng khô ngoài chợ và mấy tiệm đặc sản miền Tây thường bán cả hai, có
      khi bán sẵn **hũ mắm trộn hai loại** để nấu lẩu. Nếu chỉ tìm được một
      loại thì cứ nấu, nhưng biết trước là nồi sẽ lệch: thiếu mắm cá linh thì
      cụt hậu ngọt, bù bằng cách tăng nước dừa; thiếu mắm cá sặc thì nhạt
      mùi, đành chịu. **Đừng thay bằng mắm nêm hay mắm ruốc** — khác hẳn dòng
      mắm, ra một món khác luôn.
  - q: Nồi lẩu hắc mùi mắm quá thì chữa sao?
    a: >-
      Thường do ba nguyên nhân: nấu mắm quá lâu, không lọc kỹ, hoặc thiếu sả
      và ngải bún. Chữa ngay tại chỗ bằng cách **thả thêm sả đập dập và một
      khúc ngải bún**, châm thêm nước dừa, đun lại vài phút. Lần sau thì canh
      nấu mắm đúng 10–12 phút, rã là tắt.
  - q: Rổ rau bắt buộc phải đủ mấy loại đó không?
    a: >-
      Không. Bông điên điển chỉ có **mùa nước nổi**, bông súng và kèo nèo cũng
      tùy chợ. Nguyên tắc là gom đủ **ba nhóm**: một thứ cọng xốp thấm nước
      (bông súng, kèo nèo, rau nhút), một thứ đắng nhẹ để cắt vị mặn (rau đắng,
      khổ qua thái mỏng), và một thứ giòn ăn sống được (bắp chuối bào, rau
      muống bào).
  - q: Nấu trước được phần nào?
    a: >-
      Nước lèo nấu trước cả ngày được, càng để càng đằm — nấu tới hết bước 3
      rồi để nguội, cất ngăn mát, tới bữa đun sôi lại. Đồ nhúng sơ chế trước
      **nửa ngày**, đậy kín ngăn mát. Riêng **rau thì rửa sát giờ ăn**, rửa
      sớm quá là héo và đọng nước.
  - q: Ăn không hết thì làm gì với nồi nước lèo?
    a: >-
      Lọc bỏ phần rau còn sót, để nguội rồi cất ngăn mát **3 ngày**. Hôm sau
      đun sôi lại, chan vô tô bún với ít thịt quay và rau sống là thành **bún
      mắm**. Nêm lại trước khi ăn vì để qua đêm vị sẽ khác đi một chút.
  - q: Nồi lẩu này cay được tới đâu?
    a: >-
      Tùy nhà. Bản này để **2 trái ớt hiểm trong nồi** — đủ ấm miệng chứ chưa
      cay. Nhà nào ăn cay thì đừng tăng ớt trong nồi mà **dằm ớt vào chén nước
      mắm riêng**, vì ớt nấu lâu trong nồi sẽ ngả sang cay gắt và lấn mất mùi
      mắm.

