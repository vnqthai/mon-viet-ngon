quick:
  ingredients:
    - Mắm cá linh [[150|g]] + mắm cá sặc [[150|g]] — **hai thứ nấu chung**, thiếu một là hụt vị
    - Nước dừa tươi [[500|ml]] + nước lọc [[1.5|lít]] · xương heo [[500|g]] ninh lấy nước
    - Cà tím [[3|trái]] · sả [[5|cây]] đập dập · tỏi [[1|củ]] · ớt
    - Ngải bún [[1|củ]] — **một loại củ họ gừng**, thơm dịu; không có thì bỏ qua
    - Cá basa hoặc cá kèo [[600|g]] · tôm sú [[300|g]] · mực [[300|g]]
    - Thịt ba rọi quay [[300|g]] — miếng da giòn thả sau cùng
    - Rổ rau đồng — bông súng, điên điển, rau nhút, rau đắng, kèo nèo, bắp chuối bào
    - "Nêm: đường phèn · nước mắm · bún tươi [[1|kg]] ăn kèm"
  steps:
    - Nấu hai loại mắm với [[500|ml]] nước cho **rã hết thịt mắm**, lọc qua rây bỏ xương.
    - Ninh xương heo lấy nước trong, chắt nước mắm đã lọc vào chung với nước dừa tươi.
    - Phi thơm tỏi + sả băm + **ngải bún giã**, trút vô nồi — đây là bước quyết định mùi.
    - Thả cà tím cắt khúc, nêm đường phèn cho **dịu cái gắt của mắm**, nếm lại.
    - Bày cá, tôm, mực, thịt quay ra dĩa; rổ rau rửa sạch để thật ráo.
    - Bắc nồi lên bếp giữa bàn, sôi thì nhúng — **rau nhúng sau cùng, ăn tới đâu nhúng tới đó**.
  warning: >-
    **Đừng đổ cả xác mắm vào nồi.** Mắm phải nấu rã rồi lọc bỏ xương — bỏ qua
    bước rây thì nồi lẩu vừa lợn cợn vừa mặn chát, mà xương cá linh nhỏ như
    cây kim rất dễ hóc.

