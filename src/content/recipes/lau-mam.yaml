title: Lẩu mắm miền Tây **nồi mắm dậy mùi, rổ rau chất núi**
summary: >-
  Nồi lẩu đặc trưng nhất của miền sông nước: **mắm cá linh nấu chung mắm cá
  sặc**, lọc bỏ xương rồi chan nước dừa tươi cho hậu ngọt, thả cà tím với sả
  cho thơm. Bên cạnh là rổ rau đồng chất cao — bông súng, điên điển, rau
  nhút, rau đắng — nhúng tới đâu ăn tới đó.
