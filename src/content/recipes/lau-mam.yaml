flavorNote: >-
  **Chuẩn vị:** nước lèo màu nâu sánh, **mùi mắm dậy lên rõ mà không nồng
  gắt**, húp vào mặn đậm rồi hậu ngọt kéo dài. Cà tím phải mềm rục thấm nước
  mắm, rau nhúng vừa tái còn giữ tiếng giòn.
storyEyebrow: Chuyện nồi lẩu mắm
storyTitle: Từ **hũ mắm để dành** thành nồi lẩu đãi khách
story:
  - >-
    Miền Tây một năm có mùa nước nổi, cá linh theo con nước về nhiều tới mức
    ăn không xuể. Cá ăn không hết thì **làm mắm để dành**, ủ với muối và thính
    trong hũ sành, để dành ăn quanh năm. Lẩu mắm ra đời từ chỗ đó — không phải
    món nghĩ ra để đãi tiệc, mà là cách người ta lấy hũ mắm trong nhà nấu
    thành nồi nước lèo cho cả nhà cùng ăn.
  - >-
    Vùng Châu Đốc là nơi món này thành danh, và cũng là nơi giữ được cái quy
    tắc quan trọng nhất: **nấu bằng hai loại mắm chứ không phải một**. Người
    miền Tây nói gọn — mắm cá linh cho hậu ngọt, mắm cá sặc cho mùi. Thiếu cá
    linh thì nồi mắm cụt hậu, thiếu cá sặc thì nhạt mùi, mà nấu đúng cả hai
    thì nước lèo dậy lên một thứ mùi rất riêng, đi ngang bếp là biết nhà đang
    nấu gì.
  - >-
    Thứ làm nồi lẩu mắm khác hẳn mọi nồi lẩu khác lại không nằm trong nồi mà
    nằm bên cạnh: **rổ rau**. Bông súng cọng dài bẻ khúc, bông điên điển vàng
    chỉ có mùa nước, rau nhút, rau đắng, kèo nèo, bắp chuối bào — có nhà dọn
    tới mười mấy loại. Nước lèo càng đậm thì rau càng phải nhiều, và cái ngon
    của món này chính là chỗ **hai bên kéo nhau về giữa**: gắp một đũa rau
    nhúng, chan chút nước mắm, ăn kèm miếng cá, thấy vừa vặn.

