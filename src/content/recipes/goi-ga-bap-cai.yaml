heroEyebrow: Nhà có tiệc là có gỏi…

quick:
  ingredients:
    - Gà ta [[800|g]] (nửa con hoặc 2 đùi góc tư) · gừng [[1|củ]] + hành tím [[2|củ]] để luộc
    - Bắp cải [[400|g]] bào sợi mỏng · cà rốt [[0.5|củ|frac]] bào sợi
    - Hành tây [[1|củ]] thái mỏng ngâm giấm đường · rau răm [[1|bó]] — đừng tiếc
    - Đậu phộng rang [[3|muỗng canh]] giã dối · hành phi [[2|muỗng canh]] · tiêu
    - >-
      Nước trộn: nước mắm [[2.5|muỗng canh|frac]] · đường [[2|muỗng canh]] ·
      nước cốt chanh [[2|muỗng canh]] · tỏi [[2|tép]] + ớt băm
  steps:
    - Luộc gà từ **nước lạnh** với gừng, hành tím, muối — sôi hớt bọt, hạ liu riu 15 phút, tắt bếp ủ 10 phút, vớt ngâm nước đá.
    - Bắp cải bào mỏng, **ngâm nước đá 10 phút** cho sợi cong giòn, vẩy thật ráo; cà rốt bào sợi để riêng.
    - Hành tây thái mỏng, ngâm giấm đường 10 phút cho hết hăng, vắt nhẹ.
    - Gà nguội **xé phay dọc thớ** miếng vừa gắp, da thái sợi; pha nước trộn đậm tay hơn nước chấm.
    - Trộn bắp cải + cà rốt + hành tây với ⅔ nước trộn trước, thêm gà + phần còn lại — **bóp nhẹ từng đợt** cho thấm.
    - Rắc rau răm, đậu phộng, hành phi, tiêu — đảo đều, dọn kèm chén nước mắm tỏi ớt.
  warning: >-
    Bắp cải ngâm xong phải **vẩy thật ráo** — sợi còn ướt là nước trộn bị
    pha loãng, dĩa gỏi nhạt thếch dù pha đúng công thức.

