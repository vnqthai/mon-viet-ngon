flavorNote: >-
  **Chuẩn vị:** đũa gỏi gắp lên phải **giòn rôm rốp trước, ngọt thịt gà
  theo sau**, chua mặn ngọt đằm quyện vô nhau, và cái the rau răm dậy lên
  chốt lại — thiếu cái the đó là chưa thành gỏi gà.
storyEyebrow: Chuyện dĩa gỏi
storyTitle: Con gà cúng và **dĩa gỏi của ngày sum họp**
story:
  - >-
    Nhà có đám giỗ, thế nào trên bàn thờ cũng có **con gà luộc nguyên con
    da vàng óng**. Nhang tàn, gà hạ xuống, má với mấy dì xúm lại xé phay —
    thịt xé dọc thớ từng miếng, bắp cải bào sẵn từ sớm, rau răm hái nguyên
    rổ. Chỉ một loáng, con gà trang nghiêm trên bàn thờ đã thành dĩa gỏi
    rôm rả giữa mâm, ai gắp cũng khen giòn khen ngọt. Món này vì vậy thành
    **món của những ngày nhà đông người** — đám giỗ, tất niên, đãi khách
    quý, đâu cũng gặp.
  - >-
    Hay ở chỗ, gỏi gà bắp cải **không thuộc riêng miền nào**: ngoài Bắc
    kêu là "nộm gà", trong Nam kêu "gỏi gà", cách gọi khác mà bài trộn
    giống nhau tới lạ — bắp cải sợi mỏng, hành tây, cà rốt, và nhất định
    phải một nắm rau răm. Thứ rau the nồng đó là **linh hồn của món**: đỡ
    cái béo của gà, đẩy cái ngọt của thịt — thiếu nó, dĩa gỏi như bàn tiệc
    thiếu tiếng cười.
  - >-
    Còn một lẽ nữa để thương: món này **tận dụng khéo tới giọt cuối**. Gà
    luộc dư bữa trước xé ra trộn là thành món mới; nồi nước luộc ngọt lừ
    bắc lên nấu cháo hành rắc tiêu, cuối tiệc múc mỗi người một chén nóng
    hổi. Một con gà, hai món, trọn một bữa đãi khách tươm tất.

