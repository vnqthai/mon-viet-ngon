stepsEyebrow: Vô bếp thôi!
stepsTitle: 5 bước ra **dĩa gỏi đãi khách**
stepsLead: >-
  Bắc nồi luộc gà trước, rồi tranh thủ đúng 30 phút đó lo trọn phần rau —
  gà nguội tới đâu, mọi thứ sẵn sàng tới đó, chỉ còn xé và trộn.
steps:
  - title: Luộc gà — liu riu, ủ, sốc đá
    icon: pot
    minutes: 30 phút
    intro: "Bài luộc gà quen thuộc của bếp mình, áp vô đây y chang:"
    bullets:
      - text: >-
          Gà chà muối rửa sạch, cho vô nồi **ngập nước lạnh** cùng gừng đập
          giập, hành tím (nướng sơ càng thơm) và [[1|muỗng cà phê]] muối.
      - text: >-
          Nước sôi thì **hớt bọt, hạ liu riu 15 phút** — mặt nước chỉ lăn
          tăn. Nửa con thì vậy là vừa; luộc nguyên con to thì theo bài
          **cơm gà Hội An**, liu riu 25 phút.
      - text: >-
          Tắt bếp, **đậy nắp ủ 10 phút** cho chín thấu tới xương, rồi vớt
          gà ngâm **thau nước đá** chừng 5 phút — da căng, thịt săn ngọt.
      - text: >-
          Nước luộc **giữ lại trọn nồi** — lát nữa nó thành nồi cháo chốt
          tiệc.
    callout:
      type: warn
      text: >-
        Sôi bùng từ đầu tới cuối là gà nứt da, thịt khô xác — dĩa gỏi mất
        ngon từ con gà. Liu riu cộng ủ mới ra thớ thịt mềm mọng.
    timer:
      secs: 900
      label: Hẹn giờ luộc gà · 15:00
      doneMsg: Tắt bếp, đậy nắp ủ 10 phút nữa nghen!
  - title: Bắp cải ngâm đá cho giòn cong
    icon: lettuce
    minutes: 15 phút
    bullets:
      - label: "Bào:"
        text: >-
          bắp cải bổ tư, cắt bỏ lõi, **bào hoặc thái sợi thiệt mỏng** —
          sợi có mỏng mới cong, mới rôm rốp.
      - label: "Ngâm đá:"
        text: >-
          thả sợi vô thau **nước đá 10 phút** — nhìn thấy sợi cong lại là
          đạt chuẩn.
      - label: "Vẩy ráo:"
        text: >-
          đổ ra rổ **vẩy thật ráo**, kỹ nữa thì trải lên khăn sạch thấm
          bớt. Cà rốt bào sợi để riêng, không cần ngâm.
    callout:
      type: warn
      text: >-
        Khâu vẩy ráo quyết định dĩa gỏi — sợi còn ướt là nước trộn bị pha
        loãng, gỏi nhạt hoài nêm không cứu nổi.
    timer:
      secs: 600
      label: Hẹn giờ ngâm bắp cải · 10:00
      doneMsg: Sợi cong giòn rồi — vẩy ráo thôi!
  - title: Xé phay gà, ngâm hành, pha nước trộn
    icon: knife
    minutes: 15 phút
    bullets:
      - label: "Hành tây:"
        text: >-
          thái mỏng theo chiều dọc củ, ngâm [[2|muỗng canh]] giấm +
          [[1|muỗng cà phê]] đường trong **10 phút**, vắt nhẹ — giòn ngọt,
          hết hăng xộc.
      - label: "Xé phay:"
        text: >-
          gà nguội thì lóc thịt, **xé tay dọc thớ thành miếng vừa gắp** —
          dày cỡ ngón út, đừng xé chỉ nhỏ kẻo gỏi bị khô. Da thái sợi trộn
          chung cho béo giòn.
      - label: "Nước trộn:"
        text: >-
          khuấy tan [[2.5|muỗng canh|frac]] nước mắm + [[2|muỗng canh]]
          đường + [[2|muỗng canh]] nước cốt chanh + tỏi ớt băm — nếm thấy
          **đậm hơn nước chấm bún một nấc** là đúng.
    callout:
      type: tip
      text: >-
        "Xé phay" là xé tay dọc thớ thịt — miếng gà giữ nguyên thớ ngọt,
        thấm nước trộn mà không nát. Lấy dao xắt ngang thớ là thịt bở vụn
        liền.
    timer:
      secs: 600
      label: Hẹn giờ ngâm hành tây · 10:00
      doneMsg: Hành hết hăng rồi — vắt nhẹ, chuẩn bị trộn!
  - title: Bóp gỏi từng đợt
    icon: bowl
    minutes: 5 phút
    intro: "Trộn từng đợt cho thấm đều mà sợi không nát:"
    bullets:
      - text: >-
          Cho bắp cải + cà rốt + hành tây vô thau rộng, rưới **⅔ nước
          trộn**, **bóp nhẹ nhàng** chừng một phút cho ngấm — bóp kiểu nâng
          lên thả xuống, không vò.
      - text: >-
          Thêm gà xé + phần nước trộn còn lại, trộn thêm một lượt. Để **3
          phút** cho thấm rồi nghiêng thau, **chắt bớt nước** tiết ra ở đáy.
      - text: >-
          Rắc **rau răm cắt khúc + phân nửa đậu phộng, hành phi**, đảo hai
          lượt chót là xong thau gỏi.
    callout:
      type: warn
      text: >-
        Đãi tiệc thì mọi thứ soạn riêng từng hộp, **khách ngồi vô bàn mới
        trộn** — trộn sớm nửa tiếng là gỏi ra nước, xẹp lép mất vui.
  - title: Lên dĩa kiểu mâm tiệc
    icon: flower
    minutes: 5 phút
    bullets:
      - text: >-
          Gắp gỏi ra **dĩa lớn, vun ngọn cao**, rắc phần đậu phộng hành phi
          còn lại + nhúm **tiêu xay**, cắm mấy lá rau răm nguyên và ít sợi
          ớt cho rực rỡ.
      - text: >-
          Dọn kèm **chén nước mắm tỏi ớt** — ai thích đậm nhúng thêm miếng
          gà.
      - text: >-
          Còn nồi nước luộc bắc lại lên bếp với **nắm gạo vo sạch** từ lúc
          xé gà — tàn bữa gỏi là cháo vừa nhừ, múc chén nóng rắc hành tiêu,
          khách nào cũng gật gù.
    doneText: Dĩa gỏi vun ngọn lên mâm — xong!

tipsTitle: 8 bí quyết cho **dĩa gỏi gà chuẩn mâm tiệc**
tipsLead: >-
  Nguyên liệu món này chợ nào cũng có, ăn thua là ở mấy cái "biết" nho
  nhỏ — đọc một lượt trước khi vô bếp nghen.
tips:
  - icon: pot
    title: Liu riu – ủ – sốc đá, thuộc lòng
    text: >-
      Ba nhịp cho con gà **chín thấu mà mọng**: liu riu để thịt không xác,
      ủ để chín tới xương, sốc đá để da căng thịt săn. Bài này xài cho mọi
      món gà luộc — thuộc một lần, ngon cả đời.
  - icon: knife
    title: Xé phay miếng vừa gắp
    text: >-
      Xé chỉ nhỏ nhìn tơi mà **ăn bị khô** — sợi mảnh hút cạn nước trộn.
      Miếng dày cỡ ngón út, xé dọc thớ, cắn vô còn nghe ngọt thịt — gỏi gà
      là món khoe thịt gà mà.
  - icon: lettuce
    title: Nước đá là thuốc giòn của bắp cải
    text: >-
      Lạnh làm sợi bắp cải **cong lại, cứng cáp** — gắp lên nghe rôm rốp.
      Ngâm đủ 10 phút thôi, ngâm cả buổi là sợi ngậm nước, trộn ra dĩa gỏi
      nhạt.
  - icon: herb
    title: Nắm rau răm quyết định
    text: >-
      Cái the nồng của rau răm **đỡ béo, đẩy ngọt** cho thịt gà — thiếu nó
      chỉ còn là dĩa bắp cải trộn thịt. Cắt khúc trộn thẳng vô, chừa ít lá
      nguyên cắm mặt cho thơm mắt thơm mũi.
  - icon: bottle
    title: Nước trộn đậm một nấc
    text: >-
      Bắp cải, hành tây kiểu gì cũng **tiết nước làm dịu vị** — pha đậm
      hơn nước chấm một nấc là vừa khớp. Nêm "vừa miệng" ngay từ chén là
      dĩa gỏi ra nhạt.
  - icon: onion
    title: Trị cái hăng của hành tây
    text: >-
      Mười phút ngâm giấm đường đổi lấy hành tây **giòn ngọt trong veo** —
      người ghét hành tây nhất bàn cũng gắp được. Vắt nhẹ trước khi trộn
      kẻo loãng gỏi.
  - icon: bowl
    title: Nước luộc là nửa bữa tiệc
    text: >-
      Đừng bao giờ đổ đi: thả nắm gạo là thành **nồi cháo hành chốt
      tiệc**; nhà tính nấu **phở gà** thì trữ ngăn đông làm nước dùng —
      con gà xài tới giọt cuối mới là dân bếp.
  - icon: bulb
    title: Cứu tinh của gà luộc dư
    text: >-
      Gà cúng, gà luộc dư để ngăn mát hay bị chê khô — xé phay bóp gỏi với
      nước trộn đậm chút là **sống dậy ngon lành**, nhiều khi còn hết trước
      nồi thịt kho.

serve:
  title: Dọn mâm — **dĩa gỏi giữa bàn, nồi cháo chờ cuối tiệc**
  paras:
    - >-
      Gỏi gà bắp cải sinh ra cho **mâm đông người**: dĩa gỏi vun ngọn đặt
      chính giữa, chén nước mắm tỏi ớt kề bên, ai ngồi đâu gắp cũng tiện.
      Món này lên mâm thường **hết trước nhất** — giòn, mát, the the, gắp
      lai rai nói chuyện hoài không ngán.
    - >-
      Đúng bài nhất là màn chốt: nồi **cháo hành nấu từ nước luộc gà** liu
      riu chờ sẵn, tàn bữa múc mỗi người một chén nóng rắc tiêu — bụng ấm,
      câu chuyện kéo thêm một hồi nữa mới chịu tan. Cặp "gỏi gà – cháo gà"
      của mâm tiệc quê là vậy, thiếu một vế cứ thấy chưa trọn.
    - >-
      Nhà làm mâm giỗ Nam Bộ đủ lệ thì để dĩa gỏi này đứng chung với **thịt
      kho hột vịt** và tô **canh khổ qua nhồi thịt** — mặn ngọt có, thanh
      đắng có, giòn the có; mâm cơm cúng ông bà tươm tất mà đãi khách cũng
      thịnh soạn.
  aside:
    title: Trên mâm đãi khách
    intro: "Đủ bộ này là bữa tiệc gà tròn trịa:"
    items:
      - icon: bowl
        text: "**Chén cháo hành rắc tiêu** — nấu từ nước luộc, món chốt tiệc ấm bụng."
      - icon: bottle
        text: "**Nước mắm tỏi ớt** — chấm thêm miếng gà cho đậm đà."
      - icon: claypot
        text: "**Thịt kho hột vịt** — mâm giỗ miền Nam đủ lệ là có mặt."
      - icon: okra
        text: "**Canh khổ qua nhồi thịt** — chén nước thanh cân lại dĩa gỏi đậm."

faq:
  - q: Gà ta hay gà công nghiệp?
    a: >-
      **Gà ta, gà thả vườn** thịt chắc ngọt, xé ra miếng còn nguyên thớ —
      đúng chất gỏi. Gà công nghiệp vẫn làm được: chọn đùi góc tư, luộc còn
      chừng 12 phút cộng ủ, xé miếng to tay hơn, và pha nước trộn đậm thêm
      chút để bù vị.
  - q: Bắp cải tím trộn được không?
    a: >-
      Được — dĩa gỏi rực rỡ hẳn lên. Bắp cải tím vị **hăng hơn một chút**,
      ngâm nước đá kỹ hơn cho dịu. Đẹp nhất là trộn **nửa trắng nửa tím**
      thêm cà rốt cam — dĩa gỏi đãi khách nhìn đã con mắt.
  - q: Đãi tiệc, làm trước sao cho gỏi không ra nước?
    a: >-
      Chia phần **để riêng từng hộp kín** từ chiều: gà xé, bắp cải ngâm
      vẩy ráo, hành tây ngâm, rau răm, nước trộn, đồ rắc. Khách ngồi vô
      bàn mới đổ chung bóp trộn — **5 phút ra dĩa**, giòn y như vừa làm.
  - q: Chua ngọt bị gắt, chỉnh sao?
    a: >-
      Gắt thường do đổ chanh với đường **một lượt rồi mới nếm**. Cách cứu:
      thêm từng muỗng cà phê nước mắm cho vị mặn kéo lại; lỡ gắt cả thau
      thì bào thêm nắm bắp cải chưa trộn vô chữa cháy là dịu ngay. Lần sau
      pha tới đâu nếm tới đó.
  - q: Rau răm thay được không?
    a: >-
      Nói thiệt lòng là **không** — cái the nồng của rau răm là hồn của
      gỏi gà. Thay húng lủi hay ngò rí thì vẫn ra dĩa trộn ngon, nhưng gắp
      lên không còn cái đã của "à, gỏi gà đây rồi". Chợ hết rau răm, thà
      đổi bữa khác nấu.
  - q: Gỏi còn dư cất được không?
    a: >-
      Gỏi ngon nhất **trong buổi** — sợi còn giòn, vị còn căng. Dư thì
      chắt hết nước, cho hộp kín ngăn mát, ăn trong ngày: sợi hết cong
      nhưng vị vẫn đậm — kẹp ổ bánh mì giòn lại thành món mới ra trò.

