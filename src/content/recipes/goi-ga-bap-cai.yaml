title: Gỏi gà bắp cải **gà ngọt bắp cải giòn, đám tiệc nào cũng có mặt**
summary: >-
  Bắp cải bào mỏng ngâm đá giòn rôm rốp, gà luộc xé phay ngọt thịt, rau răm
  the nồng **hào phóng đúng kiểu mâm tiệc** — dĩa gỏi mà đám giỗ đám cưới
  ba miền đâu cũng gặp, kèm chén cháo nóng nấu từ nước luộc là trọn bài.
region: Cả nước
category: Gỏi
occasions: [Đãi khách, Cỗ Tết]
pubDate: 2026-07-28
