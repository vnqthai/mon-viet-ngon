quick:
  ingredients:
    - Bánh mì ổ [[4|ổ]] · heo quay da giòn [[400|g]] (mua sẵn hoặc tự quay)
    - >-
      Sốt tương đen: tương đen [[3|muỗng canh]] · nước tương
      [[1|muỗng canh]] · đường [[1|muỗng canh]] · tỏi băm [[3|tép]] · bột năng
      [[1|muỗng cà phê]] pha nước · [[100|ml]] nước
    - >-
      Kèm ổ bánh: đồ chua cà rốt củ cải · dưa leo [[1|trái]] · ngò rí · hành lá
      · tiêu · ớt xắt
  steps:
    - >-
      Hâm heo quay trong lò **230°C 6–8 phút** cho da giòn lại — **đừng quay vi
      sóng**, da sẽ mềm nhũn.
    - >-
      Nấu sốt: phi tỏi, cho tương đen + nước tương + đường + nước, sôi rồi rót
      bột năng pha nước cho **sánh quánh như mật**.
    - Hâm ổ bánh **200°C 4–5 phút**, rạch chừa sống lưng.
    - >-
      Thái heo quay **lát mỏng, lát nào cũng dính mảng da** — thái ngang thớ,
      dao bén, một nhát dứt khoát.
    - >-
      Xếp thịt suốt chiều dài ổ, nhét đồ chua vắt ráo, dưa leo, ngò rí; rắc
      tiêu, thả ớt.
    - Chan sốt **rưới lên mặt thịt** rồi ăn liền — chan sớm là da hết giòn.
  warning: >-
    Chan sốt rồi để đó vài phút là **mảng da hút nước mềm ngay**. Sốt phải chan
    sau cùng, ổ nào ăn thì chan ổ đó.

flavor:
  chua: 3
  ngot: 5.5
  man: 6.5
