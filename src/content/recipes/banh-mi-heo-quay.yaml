title: Bánh mì heo quay **hai lớp giòn chồng nhau, chan sốt tương đen**
summary: >-
  Ổ bánh duy nhất có **hai thứ giòn cùng lúc**: vỏ bánh mới hâm và mảng da heo
  quay nổ rộp. Giữ được cả hai là nhờ một chén sốt tương đen sánh quánh — đủ đậm
  để bám vào thịt mà không đủ loãng để làm ướt ruột bánh.
region: Miền Nam
category: Bánh mì
occasions: [Bữa sáng, Ăn chơi]
