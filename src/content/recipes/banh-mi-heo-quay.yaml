flavorNote: >-
  **Chuẩn vị:** cắn xuống nghe **hai tiếng giòn** — vỏ bánh vỡ trước, mảng da
  heo quay răng rắc theo sau. Sốt tương đen ngọt đậm mà không lợ, quánh tới mức
  quệt vào ngón tay không chảy xuống.

storyEyebrow: Chuyện ổ bánh
storyTitle: Khi ổ bánh Pháp **gặp miếng thịt quay Quảng Đông**
story:
  - >-
    Ổ bánh mì heo quay là chỗ ba nền bếp chồng lên nhau rõ nhất trong một món
    ăn Việt: **cái ổ bánh** đến từ Pháp, **miếng thịt quay ngũ vị hương** và
    **chén tương đen** đến từ Quảng Đông, còn **đồ chua, ngò rí, ớt xắt** thì
    là phần người mình thêm vào. Vùng Chợ Lớn ở Sài Gòn — nơi đông người Hoa —
    là chỗ ba thứ đó gặp nhau sớm nhất.
  - >-
    Cái hay của nó là **hai lớp giòn xếp chồng**: vỏ bánh mới nướng và mảng da
    heo quay đã nổ rộp. Hầu như không món bánh mì nào khác có được chuyện này,
    và cũng vì vậy mà nó dễ hỏng nhất — chỉ cần chan sốt sớm vài phút, hoặc
    hâm miếng thịt bằng lò vi sóng, là mất sạch một lớp.
  - >-
    Nên công thức này thật ra là **công thức của một chén sốt và hai lần hâm**.
    Miếng heo quay thì mua ở lò quay cũng được, mà tự làm ở nhà cũng được — bếp
    nhà giờ có lò nướng và nồi chiên không dầu, quay được miếng ba chỉ da nổ
    không thua hàng.

