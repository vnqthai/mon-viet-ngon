quick:
  ingredients:
    - Ốc bươu đen (ốc nhồi) [[1|kg]] — ngâm nước vo gạo **4 tiếng** cho nhả sạch bùn
    - Chuối xanh [[5|trái]] · đậu phụ [[3|bìa]] · thịt ba chỉ [[300|g]]
    - Cà chua [[3|trái]] · nghệ tươi [[1|củ]] · hành tím [[3|củ]] + tỏi [[4|tép]]
    - Tía tô + lá lốt [[1|nắm]] mỗi thứ · hành lá [[3|nhánh]]
    - "Nêm: mẻ [[3|muỗng canh|frac]] · mắm tôm [[1|muỗng canh|frac]] · nước mắm, hạt nêm"
  steps:
    - Ốc ngâm nước vo gạo + vài lát ớt **4 tiếng**, luộc vừa há miệng, **khêu lấy ruột**, bỏ phần đuôi đen.
    - Chuối xanh tước vỏ, cắt khúc, **ngâm nước pha chút giấm** cho khỏi thâm và bớt chát.
    - Đậu phụ cắt miếng, rán vàng hai mặt. Ba chỉ thái con chì, ướp nghệ giã.
    - Phi hành tỏi, xào ba chỉ săn, cho chuối + cà chua vào, châm **nước luộc ốc** om **20 phút**.
    - Nước sánh lại thì thả **đậu rán + ruột ốc**, om thêm **5 phút** thôi — ốc dai là hỏng.
    - Nêm mẻ đã lọc + mắm tôm, tắt bếp, rắc tía tô + lá lốt + hành lá thái rối.
  warning: >-
    Ốc thả vào sớm là **dai như cao su**. Ốc chỉ được vào nồi ở **5 phút
    cuối**, khi chuối đã mềm và nước đã sánh — đây là lỗi hỏng món số một.

