title: Ốc om chuối đậu **béo bùi, thơm nức tía tô lá lốt**
summary: >-
  Nồi om vàng nghệ sánh quánh: con ốc giòn sần sật, khúc chuối xanh bùi bở,
  miếng đậu phụ rán vàng hút đẫm nước, ba chỉ béo ngậy — chua dịu vị **mẻ**,
  thơm nồng tía tô lá lốt. Món đồng quê miền Bắc, ăn với bún hay cơm đều đã.
