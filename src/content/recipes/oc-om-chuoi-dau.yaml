flavorNote: >-
  **Chuẩn nồi ốc om:** nước om **sánh sệt bám đũa**, màu vàng nghệ ngả nâu
  đỏ của cà chua. Chua dịu nền vị mẻ, mặn ngầm mùi mắm tôm — và trên hết là
  **mùi tía tô lá lốt xộc lên khi vừa mở vung**. Ốc phải giòn, chuối phải bở.
storyEyebrow: Chuyện nồi om đồng quê
storyTitle: Món của **ruộng đồng**, ba thứ rẻ tiền thành một nồi ngon

story:
  - >-
    Nhìn vào nồi ốc om chuối đậu là thấy cả cái khôn của bếp quê Bắc Bộ: con
    ốc bắt ngoài ruộng, buồng chuối chặt sau nhà, bìa đậu mua đầu ngõ — ba
    thứ rẻ nhất chợ, mà nấu chung lại thành món ai ăn cũng nhớ. Bí quyết
    nằm ở chỗ **ba thứ đó bù nhau**: ốc giòn, chuối bùi, đậu mềm hút nước;
    thiếu một là nồi om mất cân.
  - >-
    Món này thuộc loại **kén tay hơn kén nguyên liệu**. Ốc phải ngâm cho nhả
    hết bùn rồi khêu ruột, bỏ đúng phần đuôi; chuối xanh phải ngâm không thì
    thâm xì và chát; **mẻ** — thứ men chua nuôi từ cơm nguội, đặc sản riêng
    của bếp Bắc — phải lọc bỏ bã. Rườm rà thật, nhưng làm đủ một lần là
    hiểu vì sao người ta chịu khó.
  - >-
    Và rồi có một khoảnh khắc đáng để bỏ công: lúc tắt bếp, rắc nắm **tía tô
    lá lốt** thái rối lên mặt nồi đang sôi lăn tăn, hơi nóng bốc lên kéo
    theo mùi thơm nồng đặc trưng, đậy vung một phút rồi mở ra. Cả gian bếp
    thơm nức. Ai từng ăn món này ở quê đều nhớ đúng cái mùi đó.

