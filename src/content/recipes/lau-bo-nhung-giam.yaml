flavorNote: >-
  **Chuẩn nồi lẩu:** nước nhúng **chua dịu và ngọt nhẹ vị nước dừa**, thoảng
  thơm sả gừng — chua vừa đủ để làm mềm lát thịt chứ không tới mức uống được
  một muỗng. Lát bò nhúng xong **hồng nhạt ở giữa, mềm ngọt**.
storyEyebrow: Chuyện nồi lẩu ăn bằng tay
storyTitle: Nồi lẩu mà **không ai húp nước**
story:
  - >-
    Gần như mọi nồi lẩu đều kết thúc bằng việc chan nước vào bún mà húp. Nồi
    này thì không — **nước lẩu ở đây chỉ để nhúng**, chua tới mức không ai
    uống. Nhiệm vụ duy nhất của nó là làm lát thịt bò vừa chín tới và mềm ra
    trong vài giây.
  - >-
    Cái ngon nằm hết ở cuốn bánh tráng: lát bò nóng hổi, cọng bún, nắm rau
    sống, lát chuối chát chan chát, lát khế chua giòn — cuốn lại chấm mắm nêm
    pha thơm. Mỗi cuốn là một lần **tự cân vị**, ai thích chua thì thêm khế,
    ai thích chát thì thêm chuối.
  - >-
    Cũng vì vậy mà đây là món của bàn đông và của bữa ngồi lâu: mỗi người tự
    nhúng, tự cuốn, vừa làm vừa nói chuyện. Ăn hết dĩa thịt này thì bày dĩa
    khác, nồi nước vẫn nguyên đó — không có cái cảnh nồi lẩu cạn dần rồi hết
    vui.

