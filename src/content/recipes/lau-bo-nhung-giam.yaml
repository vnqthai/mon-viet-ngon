stepsEyebrow: Vô bếp thôi!
stepsTitle: 5 bước ra **bàn lẩu bò nhúng giấm**
stepsLead: >-
  Món lẩu dễ nhất trong nhóm — không hầm, không ninh, chỉ có thái thịt cho
  mỏng và pha chén mắm nêm cho đúng.
steps:
  - title: Thái thịt — ướp lạnh rồi mới thái
    icon: knife
    minutes: 20 phút
    bullets:
      - text: >-
          Cho khối bắp bò vào **ngăn đá 20 phút** cho hơi cứng mặt ngoài, đừng
          để đông đá hẳn.
      - text: >-
          Thái **lát thật mỏng, ngang thớ** — nhìn mặt thịt thấy các sợi cơ
          chạy theo chiều nào thì đặt dao cắt vuông góc chiều đó.
      - text: >-
          Bày dĩa xếp vòng, phủ màng bọc, để ngăn mát tới lúc dọn.
    callout:
      type: tip
      text: >-
        Không có thời gian ướp lạnh thì nhờ hàng bò **thái sẵn bằng máy** —
        nói rõ là "thái nhúng lẩu". Lát máy đều tăm tắp, còn tiện hơn thái tay.
  - title: Nấu nồi nước nhúng
    icon: pot
    minutes: 20 phút
    bullets:
      - text: >-
          Đun [[1.5|lít]] nước dừa tươi, thả sả đập dập, gừng thái sợi, hành
          tây cắt múi và thơm cắt miếng.
      - text: >-
          Sôi thì hạ lửa, nấu **10 phút** cho các thứ ra hết mùi.
      - text: >-
          Nêm [[50|g]] đường phèn và chút muối trước, **rồi mới rót giấm từng
          chút một**, nếm sau mỗi lần.
      - text: >-
          Thả [[50|g]] dừa nạo sợi vào ở phút cuối, nấu thêm 3 phút rồi tắt.
    callout:
      type: warn
      text: >-
        Đừng nêm chua tới mức uống được — nồi này **chua để nhúng thịt**, không
        phải để húp. Vị đúng là **chua dịu, ngọt nhẹ, thoảng thơm sả gừng**;
        nếm thấy chua nhăn mặt là quá tay, thêm nước dừa vào chữa.
  - title: Bày đồ cuốn
    icon: lettuce
    minutes: 15 phút
    bullets:
      - text: >-
          Rau sống rửa sạch, **vẩy thật ráo** rồi bày rổ — rau còn ướt thì
          cuốn bị bở và mắm nêm bị loãng.
      - text: >-
          Chuối chát và khế thái lát mỏng, **ngâm ngay vào tô nước có vắt
          chanh** để khỏi thâm đen, vớt ra để ráo lúc dọn.
      - text: >-
          Dưa leo cắt que dài, bún gỡ tơi ra dĩa, bánh tráng để nguyên xấp
          dưới khăn ẩm cho khỏi khô mép.
  - title: Pha chén mắm nêm
    icon: bottle
    minutes: 8 phút
    intro: "Chén chấm quyết định một nửa món ăn:"
    bullets:
      - text: >-
          Băm nhuyễn nửa trái thơm còn lại, trộn vào [[150|ml]] mắm nêm.
      - text: >-
          Thêm tỏi ớt băm và đường, khuấy đều, **nếm rồi chỉnh** — vị đúng là
          mặn ngọt cân nhau, cay dậy lên sau, không gắt mùi mắm.
      - text: >-
          Mắm nêm mặn quá thì pha loãng bằng **chút nước dừa trong nồi lẩu**,
          hợp vị hơn pha nước lọc.
    callout:
      type: tip
      text: >-
        Thơm băm không chỉ để cho ngọt — vị chua ngọt của nó **kéo mùi mắm nêm
        dịu hẳn xuống**, người không quen ăn mắm nêm cũng ăn được. Băm càng
        nhuyễn càng hoà.
  - title: Nhúng & cuốn tại bàn
    icon: roll
    minutes: 5 phút
    bullets:
      - text: >-
          Bắc nồi lên bếp giữa bàn, giữ **sôi lăn tăn** suốt bữa.
      - text: >-
          Gắp từng lát bò nhúng **8–10 giây**, thấy vừa đổi màu, **còn hồng
          nhạt là gắp ra ngay**.
      - text: >-
          Trải bánh tráng, xếp rau sống, một gắp bún, lát chuối chát, lát khế,
          que dưa leo, rồi đặt lát bò lên trên cùng. Cuốn chặt tay.
      - text: >-
          Chấm mắm nêm, cắn một miếng — chua, chát, ngọt, mặn, cay tới cùng
          lúc. Đó là đúng vị của món này.
    doneText: Cuốn đầu tiên đủ chua chát ngọt mặn — xong!

tipsTitle: 6 bí quyết cho **lát bò mềm và cuốn ngon**
tipsLead: >-
  Món này không có gì để hầm, để ninh — nên mọi thứ hỏng hay ngon đều nằm ở
  mấy chi tiết nhỏ dưới đây.
tips:
  - icon: knife
    title: Ngang thớ, và thật mỏng
    text: >-
      Thái **ngang thớ** để cắt đứt sợi cơ, thái **mỏng** để nhúng vài giây là
      chín. Sai một trong hai là lát thịt dai, mà nhúng lâu cho mềm thì lại
      càng dai hơn — không có đường ra.
  - icon: clock
    title: Tám tới mười giây, không hơn
    text: >-
      Lát bò mỏng chín gần như tức thì. Nhúng tới khi mặt ngoài vừa đổi màu,
      **giữa lát còn hồng nhạt** là gắp. Đây là điều duy nhất cần dặn cả bàn
      trước khi ăn — ai cũng có xu hướng nhúng lâu quá.
  - icon: drop
    title: Nước dừa là nền, đừng thay
    text: >-
      Nấu bằng nước lọc thì nồi nước chỉ còn chua trơ. **Nước dừa tươi** cho
      cái ngọt nền để cân với giấm, và đó cũng là thứ làm nồi này khác hẳn mấy
      nồi nhúng giấm nấu suông.
  - icon: bottle
    title: Rót giấm từ từ, nếm liên tục
    text: >-
      Mỗi loại giấm một độ chua. Nêm đường và muối trước cho có nền, rồi mới
      rót giấm **từng chút một**. Chua quá thì thêm nước dừa — nhưng cả nồi sẽ
      nhạt đi, phải nêm lại từ đầu.
  - icon: pineapple
    title: Thơm băm cứu chén mắm nêm
    text: >-
      Người ngại mắm nêm thường là ngại cái mùi gắt. **Thơm băm nhuyễn** làm
      mùi đó dịu hẳn mà vẫn giữ được vị đậm. Băm nhuyễn thật, đừng cắt hạt
      lựu — miếng to thì chỉ ngọt chỗ đó chứ không hoà vào chén.
  - icon: pod
    title: Chuối chát và khế đừng bỏ
    text: >-
      Hai thứ này nhìn phụ mà lại là **cái khung của cuốn bánh tráng**: chuối
      chát chặn cái ngậy của thịt, khế chua cắt cái mặn của mắm nêm. Bỏ đi thì
      cuốn nào cũng giống cuốn nào, ăn tới cuốn thứ tư là chán.

serve:
  title: Bàn lẩu ăn bằng tay — **món của bữa ngồi lâu**
  paras:
    - >-
      Bày rộng ra: nồi ở giữa, rổ rau một bên, dĩa thịt một bên, xấp bánh
      tráng và dĩa bún trong tầm tay mọi người. Mỗi người một chén mắm nêm
      riêng. Ai cũng tự nhúng, tự cuốn — không có người phục vụ, đó mới vui.
    - >-
      Thịt bày ra **từng dĩa nhỏ**, hết dĩa này mới bày dĩa khác, để phần còn
      lại nằm trong ngăn mát cho tươi. Nồi nước thì để lửa nhỏ suốt; vơi đi thì
      châm thêm chút nước dừa, đừng châm nước lọc.
  aside:
    title: Trên bàn nên có
    intro: "Bốn thứ không được thiếu:"
    items:
      - icon: bottle
        text: "**Chén mắm nêm pha thơm** — mỗi người một chén, đây là linh hồn món."
      - icon: pod
        text: "**Dĩa chuối chát và khế chua** — cái khung vị của mỗi cuốn."
      - icon: roll
        text: "**Bánh tráng và bún** — để trong tầm tay mọi người."
      - icon: lettuce
        text: "**Rổ rau sống vẩy thật ráo** — rau ướt là cuốn bở."

faq:
  - q: Không ăn được mắm nêm thì chấm gì?
    a: >-
      Pha **nước mắm chua ngọt** như nước chấm gỏi cuốn: nước mắm, đường,
      chanh, tỏi ớt, thêm chút nước dừa trong nồi. Không đúng bài bằng mắm nêm
      nhưng vẫn ngon. Hoặc thử mắm nêm pha nhiều thơm băm trước đã — nhiều
      người tưởng mình không ăn được, tới khi ăn thử bản pha khéo thì đổi ý.
  - q: Nên chọn phần thịt bò nào?
    a: >-
      **Bắp hoa** là đẹp nhất — có vân gân, nhúng xong vừa mềm vừa có cái sựt
      nhẹ. **Ba chỉ bò** béo và mềm hơn, hợp với người thích ngậy. Tránh phần
      nạc trơn hoàn toàn: nhúng xong khô và nhạt.
  - q: Nồi nước nhúng lỡ chua quá thì sao?
    a: >-
      Thêm nước dừa tươi cho loãng ra rồi nêm lại đường phèn và muối. Thả thêm
      **một củ hành tây cắt múi** cũng kéo vị ngọt lên rõ. Đừng thêm nước lọc
      — loãng vị mà không cứu được cái chua.
  - q: Thay bánh tráng bằng bún trong tô được không?
    a: >-
      Được, nhiều nhà làm vậy cho nhanh: bún vào tô, xếp rau, đặt thịt vừa
      nhúng lên, chan chút mắm nêm. Nhưng **cuốn bánh tráng vẫn hơn** — cuốn
      thì mỗi miếng có đủ mọi thứ cùng lúc, còn tô bún thì gắp trúng đâu ăn
      đó.
  - q: Chuẩn bị trước tới đâu được?
    a: >-
      Gần như mọi thứ: nước nhúng nấu sẵn để đó, mắm nêm pha sẵn (càng để càng
      hoà), rau nhặt rửa sẵn. **Chỉ có thịt thì thái sát giờ** và chuối chát,
      khế thì thái muộn nhất có thể — hai thứ này thâm rất nhanh dù đã ngâm
      chanh.
  - q: Nước dừa đóng hộp có dùng được không?
    a: >-
      Được nhưng nhạt hơn dừa tươi khá nhiều, và nhiều loại có sẵn đường nên
      phải giảm đường phèn. Nếu dùng hộp thì **tăng lượng thơm và hành tây**
      thả nồi để bù lại phần ngọt tự nhiên còn thiếu.

