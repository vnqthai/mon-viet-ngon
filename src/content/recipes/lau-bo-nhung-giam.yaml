heroEyebrow: Nồi lẩu mà ăn bằng tay…

quick:
  ingredients:
    - Bắp bò (hoặc ba chỉ bò) [[800|g]] — thái lát **thật mỏng ngang thớ**
    - Nước dừa tươi [[1.5|lít]] — chừng 3 trái
    - Giấm gạo [[150|ml]] · đường phèn [[50|g]] · muối
    - Hành tây [[1|củ]] cắt múi · sả [[3|cây]] đập dập · gừng [[1|khúc]] thái sợi
    - Dừa nạo sợi [[50|g]] · thơm (dứa) [[0.5|trái|frac]] cắt miếng
    - "Cuốn: bánh tráng · bún tươi · xà lách, húng quế, tía tô · chuối chát · khế chua · dưa leo"
    - "Chấm: mắm nêm pha thơm băm + tỏi ớt + đường"
  steps:
    - Bắp bò để **ngăn đá 20 phút** cho hơi cứng rồi mới thái — lát mới mỏng đều được.
    - Nấu nước dừa với sả đập dập, gừng sợi, hành tây và thơm cắt miếng.
    - Nêm **giấm từ từ** cùng đường phèn và muối — chua dịu, ngọt nhẹ, đừng chua gắt.
    - Thả dừa nạo sợi vào nồi ở phút cuối, nấu thêm 3 phút cho thơm béo.
    - Chuối chát và khế thái lát mỏng, **ngâm nước có vắt chanh** cho khỏi thâm.
    - Pha mắm nêm với thơm băm nhuyễn, tỏi ớt, đường — nếm cho **mặn ngọt cân, không gắt**.
    - Nhúng lát bò **8–10 giây là gắp**, cuốn bánh tráng với bún và rau, chấm mắm nêm.
  warning: >-
    Nhúng lâu là hỏng cả món. Lát bò mỏng chỉ cần **thoáng qua nước sôi tới khi
    vừa đổi màu**, còn hồng nhạt là gắp ngay — để trắng hết thì thớ co lại, dai
    và mất sạch vị ngọt.

