title: Lẩu bò nhúng giấm **cuốn bánh tráng, chấm mắm nêm**
summary: >-
  Bắp bò thái mỏng nhúng thoáng qua **nồi nước dừa nấu giấm chua dịu**, gắp ra
  cuốn bánh tráng với rau sống, chuối chát và khế chua, chấm mắm nêm — món lẩu
  Nam Bộ ăn kiểu cuốn, ngồi bao lâu cũng không ngán.
region: Miền Nam
category: Lẩu
occasions: [Nhậu lai rai, Đãi khách]
