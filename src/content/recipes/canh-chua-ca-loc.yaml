title: Canh chua cá lóc **chuẩn vị miền Tây**
summary: >-
  Nồi canh của mùa nước nổi: cá lóc đồng ngọt thịt, nước me chua thanh, khóm
  thơm lựng, nêm **ngọt đậm đúng chất Nam Bộ** — húp một miếng là nhớ quê liền.
region: Miền Tây
category: Canh
time:
  total: 45 phút
servingsBase: 4
difficulty: Dễ
featured: true
order: 1
art: canh-chua
heroEyebrow: Thương lắm miền Tây ơi…

quick:
  ingredients:
    - Cá lóc [[1|con|frac]] (700–900 g/con) — làm sạch nhớt, cắt khúc 4 cm
    - Me vắt [[50|g]] + [[100|ml]] nước sôi — dầm lọc lấy nước cốt
    - >-
      Khóm ¼ trái · cà chua [[2|trái]] · đậu bắp [[150|g]] · bạc hà [[2|cây]]
      · giá [[150|g]] · bông điên điển [[100|g]] (có thì càng đúng điệu)
    - Ngò om + ngò gai · tỏi [[4|tép]] · hành tím [[3|củ]] · ớt [[2|trái]]
    - >-
      Nêm: đường [[2.5|muỗng canh|frac]] · nước mắm [[3|muỗng canh|frac]] ·
      muối, hạt nêm, tiêu
  steps:
    - Cá chà muối + chanh cho sạch nhớt, cắt khúc, ướp muối – hạt nêm – tiêu – hành tím **15 phút**.
    - Dầm me lấy nước cốt; sơ chế hết rau củ; phi vàng ⅔ chỗ tỏi, vớt ra để dành.
    - Xào cà chua + ⅓ khóm với tỏi còn lại, châm [[1.5|lít]] nước + nước me, nấu sôi già.
    - Thả cá vào nước **đang sôi**, không khuấy, vớt bọt, nấu 8–10 phút.
    - Nêm **đường trước, nước mắm sau** — chua thanh, ngọt đậm, hậu mặn dịu.
    - Lửa lớn, cho khóm + đậu bắp + bạc hà nấu 2 phút, rồi giá + điên điển — sôi bùng là tắt bếp.
    - Rắc ngò om, ngò gai, tỏi phi, ớt. Ăn nóng với cơm + chén nước mắm ớt chấm cá.
  warning: >-
    Ba lỗi phá nồi canh nhiều nhất: thả cá lúc nước chưa sôi · khuấy mạnh tay ·
    nấu rau quá lâu.

flavor:
  chua: 8
  ngot: 8.5
  man: 5.5
  cay: 4
  thom: 9
flavorNote: >-
  **Quy tắc vàng:** húp thử một muỗng phải thấy **chua trước, ngọt đuổi theo
  liền, hậu mặn dịu** — thiếu một vế là nêm lại ngay.
storyEyebrow: Chuyện tô canh
storyTitle: Món ăn **quốc dân** của xứ sông nước
story:
  - >-
    Ở miền Tây, canh chua cá lóc không phải món ăn — nó là **ký ức**. Là buổi
    chiều mưa tháng chín, ba xách cần câu về với con cá lóc đồng còn giãy, má
    ra sau hè hái nắm ngò om, bẻ mấy trái đậu bắp, dầm vắt me chua. Nồi canh
    sôi lên, mùi thơm bay qua mấy nhà hàng xóm là biết nhà ai đang dọn cơm.
  - >-
    Cái hồn của canh chua miền Tây nằm ở sự **hào phóng của vị**: chua phải
    thanh chứ không gắt, ngọt phải đậm chứ không lợ — người miền Tây nêm đường
    mạnh tay hơn mọi miền khác, đó không phải sai sót mà là bản sắc. Rồi tới
    mùa nước nổi, tô canh còn được thả thêm nhúm bông điên điển vàng ươm —
    người ta nói vậy là **gói cả mùa lũ vô một tô canh**.
  - >-
    Công thức dưới đây là kiểu nấu nhà quê đúng điệu: không cầu kỳ, nhưng từng
    bước đều có lý do. Nấu đúng, bạn sẽ có nồi canh **nước trong veo, cá ngọt
    lừ, rau giòn rụm** — chan cơm nóng là hết nồi lúc nào không hay.

