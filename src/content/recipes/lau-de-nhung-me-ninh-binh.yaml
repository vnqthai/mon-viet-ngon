title: Lẩu dê nhúng mẻ **chua thanh kiểu Ninh Bình**
summary: >-
  Thịt dê thái mỏng nhúng vào **nồi nước lẩu chua dịu bằng mẻ**, ăn với cải
  xanh, rau cần và tía tô — bản lẩu dê miền Bắc, không béo chao mà chua thanh,
  càng ăn càng thấy nhẹ miệng.
region: Miền Bắc
category: Lẩu
occasions: [Nhậu lai rai, Đãi khách]
