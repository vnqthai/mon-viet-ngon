stepsEyebrow: Vô bếp thôi!
stepsTitle: 5 bước ra **nồi lẩu dê chua thanh**
stepsLead: >-
  Việc nặng nhất là hầm xương, mà hầm xương thì chỉ tốn thời gian chứ không
  tốn tay. Chỗ cần để ý là lúc nêm mẻ — cho từng chút và nếm liên tục.
steps:
  - title: Khử mùi thịt dê
    icon: ginger
    minutes: 20 phút
    bullets:
      - label: "Bóp:"
        text: >-
          bóp cả [[800|g]] thịt với gừng giã + [[3|muỗng canh]] rượu trắng
          trong [[10|phút]], xả nước thật sạch.
      - label: "Chần:"
        text: >-
          đun nồi nước sôi có vài lát gừng, chần thịt **2 phút**, vớt ra xả
          nước lạnh, để ráo. Nước chần đổ bỏ.
      - label: "Chia hai phần:"
        text: >-
          phần miếng đem hầm, phần khối nạc đẹp cho vào ngăn đá **15 phút**
          cho hơi cứng lại — lát nữa thái mới mỏng đều được.
    callout:
      type: tip
      text: >-
        Ướp lạnh khối thịt trước khi thái là mẹo chung của mọi món nhúng: thịt
        hơi đông thì dao đi ngọt, lát nào cũng mỏng như nhau, nhúng vào là
        chín cùng lúc.
  - title: Hầm xương lấy nước nền
    icon: pot
    minutes: 90 phút
    bullets:
      - text: >-
          Chần xương heo qua nước sôi rồi xả sạch — bước này bỏ hết bọt bẩn,
          nước dùng mới trong.
      - text: >-
          Hầm xương với [[2.5|lít]] nước, lửa liu riu **1,5 tiếng**, hớt bọt
          trong 15 phút đầu.
      - text: Vớt bỏ xương, giữ lại phần nước trong.
    callout:
      type: warn
      text: >-
        Sôi bùng suốt buổi là nước đục ngầu, chua thế nào cũng không cứu được
        cái nhìn. Giữ **sôi lăn tăn** từ đầu tới cuối.
    timer:
      secs: 5400
      label: Hẹn giờ hầm xương · 90:00
      doneMsg: Nước xương trong và ngọt rồi — vớt xương ra thôi!
  - title: Xào thơm & hầm phần dê miếng
    icon: flame
    minutes: 45 phút
    bullets:
      - text: >-
          Phi thơm hành tím băm, cho **sả đập dập và riềng thái lát** vào đảo
          tới khi dậy mùi.
      - text: >-
          Trút phần dê miếng vào **xào săn mặt**, rồi đổ hết vào nồi nước xương.
      - text: >-
          Hầm lửa nhỏ **40 phút** tới khi miếng dê mềm mà còn thớ — xiên đũa
          thấy nhẹ tay nhưng chưa rã ra là được.
  - title: Nêm mẻ — cho từng chút, nếm liên tục
    icon: jar
    minutes: 10 phút
    intro: "Bước quyết định vị của cả nồi:"
    bullets:
      - text: >-
          Hoà [[4|muỗng canh]] mẻ với một muôi nước dùng nóng cho tan, rồi
          **lọc qua rây** — chỉ lấy phần nước, bã bỏ đi.
      - text: >-
          Rót nước mẻ vào nồi **từng nửa muôi một**, khuấy đều rồi nếm. Dừng
          lại khi thấy **chua dịu ở hậu vị**, chưa tới mức chua đầu lưỡi.
      - text: >-
          Thả cà chua bổ múi cau và hành tây cắt múi, nấu thêm 5 phút cho cà
          chua mềm ra màu.
      - text: >-
          Nêm nước mắm và chút đường cho tròn vị. Nếm lần cuối: **ngọt xương —
          chua mẻ — thơm sả riềng**, ba tầng rõ ràng.
    callout:
      type: warn
      text: >-
        Mẻ mỗi hũ một độ chua, có hũ gắt gấp đôi hũ khác — nên **không có con
        số đúng cho mọi nhà**. Cứ cho ít rồi thêm; lỡ chua quá thì phải thêm
        nước và nêm lại từ đầu, mất công hơn nhiều.
  - title: Thái lát & dọn bàn
    icon: knife
    minutes: 15 phút
    bullets:
      - text: >-
          Lấy khối thịt trong ngăn đá ra, **thái lát thật mỏng ngang thớ**,
          bày dĩa xếp vòng.
      - text: >-
          **Chén chấm:** tán chao với chút nước, thêm **gừng băm** và ớt —
          gừng trong chén chấm là chi tiết đặc trưng của món dê ngoài Bắc.
          Nhà nào quen tương bần thì dùng tương bần cũng đúng bài.
      - text: >-
          Bắc nồi lên bếp giữa bàn để sôi lăn tăn. **Nhúng lát thịt chừng
          15–20 giây, còn hồng giữa lát là gắp** — nhúng lâu là dai.
      - text: >-
          Rau nhúng theo thứ tự: cải xanh trước, rau cần sau, **tía tô thả
          cuối cùng ngay trước khi gắp** cho khỏi mất mùi.
    doneText: Gắp lát dê tái chấm chao gừng — xong!

tipsTitle: 6 bí quyết cho **nồi lẩu chua dịu, thịt mềm**
tipsLead: >-
  Nồi lẩu này chỉ có hai chỗ dễ hỏng — mùi dê và độ chua của mẻ. Nắm sáu điều
  dưới đây là xong cả hai.
tips:
  - icon: jar
    title: Mẻ phải lọc, và phải nêm cuối
    text: >-
      Hoà mẻ với nước nóng rồi **lọc qua rây bỏ bã** — nếu không thì nồi lẩu
      lợn cợn. Và nêm mẻ ở **cuối cùng**, sau khi thịt đã mềm: nước chua làm
      thớ thịt săn lại, nêm sớm là hầm mãi không mềm.
  - icon: ginger
    title: Riềng hợp thịt dê hơn gừng
    text: >-
      Gừng dùng để **khử mùi lúc sơ chế**, còn **riềng mới là thứ tạo mùi cho
      nồi lẩu**. Riềng thơm hắc và ấm, đứng cạnh vị dê rất hợp — thiếu riềng
      thì nồi lẩu nhạt mùi hẳn đi một tầng.
  - icon: knife
    title: Ướp lạnh rồi mới thái
    text: >-
      Khối thịt để ngăn đá **15 phút** cho hơi cứng thì thái mới mỏng đều được.
      Lát dày mỏng lộn xộn thì nhúng cùng lúc mà lát chín lát sống, lát dai
      lát mềm.
  - icon: clock
    title: Nhúng đúng 15–20 giây
    text: >-
      Lát thịt mỏng chỉ cần thoáng qua nước sôi. **Còn hồng nhạt ở giữa lát là
      gắp** — để lâu hơn là thớ co lại, dai và mất ngọt. Nhúng từng lát một,
      đừng thả cả dĩa vào nồi.
  - icon: lettuce
    title: Bộ ba rau đúng bài
    text: >-
      **Cải xanh** đắng nhẹ, **rau cần** giòn sần sật, **tía tô** thơm nồng —
      ba thứ này bổ khuyết cho nhau và đều hợp vị dê. Tía tô thả cuối, nhúng
      thoáng qua rồi gắp liền, để lâu là nát và mất mùi.
  - icon: bulb
    title: Không mua được mẻ thì làm sao
    text: >-
      Hàng khô ngoài chợ hầu như đâu cũng có, hũ nhỏ dùng được lâu. Kẹt lắm
      thì thay bằng **nước cơm rượu** hoặc **giấm gạo pha loãng thêm chút nước
      me** — chua sẽ sắc hơn mẻ một chút, nên cho ít lại và nêm thật từ từ.

serve:
  title: Nồi lẩu chua giữa bàn — **ăn ngày trời trở lạnh**
  paras:
    - >-
      Nồi lẩu này hợp nhất với **ngày trời se lạnh**: nước chua thanh nóng
      hổi, gắp lát thịt vừa nhúng tái, cuốn cọng rau cần, chấm chén chao gừng.
      Ăn chậm, nhúng tới đâu ăn tới đó — món này không ai vội được.
    - >-
      Cuối bữa chan nước lẩu vào bún, húp một chén — lúc này nước đã đậm vị
      thịt và ngấm hết mùi sả riềng, ngon hơn hẳn lúc mới bắc lên. Nhớ chừa
      lại đủ nước cho khúc này.
  aside:
    title: Trên bàn nên có
    intro: "Bốn thứ dọn kèm nồi lẩu:"
    items:
      - icon: bottle
        text: "**Chén chao tán với gừng băm** — chi tiết riêng của món dê ngoài Bắc."
      - icon: lettuce
        text: "**Rổ cải xanh, rau cần, tía tô** — bộ ba hợp vị dê nhất."
      - icon: noodle
        text: "**Bún rối** — chan nước lẩu ăn cuối bữa."
      - icon: chili
        text: "**Ớt tươi thái lát** — ai ăn cay thì thả thẳng vào chén."

faq:
  - q: Mẻ là gì, mua ở đâu, để được bao lâu?
    a: >-
      Mẻ là **cơm nguội ủ lên men**, chua dịu và thơm mùi men gạo — gia vị làm
      chua quen thuộc của bếp Bắc, cũng chính là thứ tạo vị cho ốc om chuối
      đậu. Hàng khô ngoài chợ đâu cũng bán, hũ nhỏ. Để ngăn mát dùng được vài
      tháng, thỉnh thoảng cho thêm chút cơm nguội là mẻ nuôi tiếp.
  - q: Sao không hầm nhừ hết chỗ thịt cho tiện?
    a: >-
      Hầm hết thì mất đúng cái hay của món. **Phần miếng hầm** cho nồi nước có
      chất và có miếng thịt mềm để gắp; **phần lát mỏng nhúng tại bàn** mới
      cho được cái mềm ngọt còn hồng giữa lát. Hai kết cấu trong một nồi, đó
      là lý do món này gọi là "nhúng".
  - q: Nồi lẩu chua quá rồi, chữa sao?
    a: >-
      Thêm nước dùng nóng cho loãng ra, rồi **nêm lại chút đường và nước mắm**
      cho cân. Thả thêm hành tây cắt múi cũng kéo vị ngọt lên khá nhiều. Lần
      sau nhớ rót mẻ từng nửa muôi một và nếm sau mỗi lần.
  - q: Thịt dê nhúng bị dai — sai chỗ nào?
    a: >-
      Hai chỗ: **thái dọc thớ** thay vì ngang thớ, hoặc **nhúng quá lâu**.
      Thái ngang thớ để cắt đứt sợi cơ, và nhúng đúng 15–20 giây rồi gắp ra —
      lát thịt còn hồng nhạt giữa là đúng độ, đừng chờ trắng hết.
  - q: Có cần riềng không hay bỏ được?
    a: >-
      Bỏ được nhưng tiếc. Riềng là thứ cho nồi lẩu cái **mùi ấm hắc** rất hợp
      với thịt dê, gừng không thay được vì gừng cay và thanh hơn. Không có
      riềng tươi thì dùng riềng khô, ngâm nước ấm 15 phút cho mềm rồi thả nồi.
  - q: Nấu trước tới đâu được nếu đãi khách?
    a: >-
      Làm trước hết phần nồi nước — hầm xương, xào thơm, hầm dê miếng — rồi
      tắt bếp. **Phần mẻ và cà chua để nêm ngay trước khi dọn**, còn thịt thái
      lát thì thái sát giờ và giữ trong ngăn mát. Khách tới chỉ việc bắc nồi
      lên bếp.

