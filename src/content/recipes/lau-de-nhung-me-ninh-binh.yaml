heroEyebrow: Xứ núi đá, con dê và hũ mẻ…

quick:
  ingredients:
    - Thịt dê [[800|g]] — nửa thái mỏng để nhúng, nửa để nguyên miếng hầm
    - Xương heo [[500|g]] — hầm [[1.5|tiếng]] lấy nước ngọt nền
    - Mẻ [[4|muỗng canh]] — lọc qua rây, chỉ lấy nước
    - Sả [[4|cây]] · gừng [[1|củ]] · riềng [[1|khúc]] · hành tím [[5|củ]]
    - Cà chua [[3|trái]] · hành tây [[1|củ]]
    - Rau nhúng — cải xanh, rau cần, tía tô · bún tươi
    - "Chén chấm: chao tán hoặc tương bần + gừng băm + ớt"
  steps:
    - Bóp dê với **gừng giã + rượu trắng**, xả sạch, rồi chần qua nước sôi có gừng.
    - Hầm xương heo [[1.5|tiếng]] lấy nước dùng, vớt xương bỏ, giữ lại nước trong.
    - Phi thơm sả gừng riềng hành, **xào phần dê miếng cho săn**, trút vào nồi nước dùng, hầm mềm.
    - Lọc mẻ qua rây lấy nước, **nêm vào từng chút một** — chua dịu là dừng, đừng gắt.
    - Thả cà chua bổ múi cau và hành tây cắt múi, nêm lại cho vừa.
    - Phần dê còn lại **thái lát mỏng ngang thớ**, bày dĩa để nhúng tại bàn.
    - Bắc nồi lên bếp giữa bàn — nhúng thịt tái, nhúng rau, chấm chao gừng, ăn với bún.
  warning: >-
    Đổ mẻ thẳng vào nồi mà không lọc là nồi lẩu đầy cặn lợn cợn, nhìn đục và
    ăn sạn. **Hoà mẻ với chút nước dùng rồi lọc qua rây**, chỉ lấy phần nước
    chua — bã bỏ đi.

flavor:
  chua: 6
  ngot: 5
  man: 6
  cay: 2.5
  thom: 8
flavorNote: >-
  **Chuẩn nồi lẩu:** nước lẩu **trong, chua dịu ở hậu vị** chứ không chua gắt
  đầu lưỡi; lát thịt dê nhúng tái **còn hồng giữa lát, mềm ngọt**; mùi sả gừng
  riềng dậy lên trước, mùi dê chỉ còn thoang thoảng.
storyEyebrow: Chuyện nồi lẩu miền Bắc
storyTitle: Cùng con dê, **hai miền nấu ngược nhau**
story:
  - >-
    Miền Nam gặp thịt dê thì nghĩ ngay tới chao: béo, đậm, thơm nồng. Miền Bắc
    — mà rõ nhất là vùng núi đá Ninh Bình, nơi con dê là đặc sản — lại đi
    đường ngược: lấy **mẻ** làm chua nồi nước, để vị dê nổi lên trên một nền
    thanh chứ không nằm dưới một lớp béo.
  - >-
    **Mẻ** là cơm nguội ủ lên men, chua dịu và thơm mùi men gạo — thứ gia vị
    làm chua rất riêng của bếp Bắc, khác hẳn cái chua sắc của chanh hay giấm.
    Cái chua của mẻ **đến sau, ở hậu vị**, nên húp miếng nước lẩu thấy nhẹ
    miệng chứ không nhăn mặt.
  - >-
    Cách ăn cũng khác: thay vì hầm nhừ hết cả nồi, người ta chừa lại một phần
    thịt **thái lát mỏng để nhúng tái ngay tại bàn**. Lát thịt vừa chín tới,
    còn hồng ở giữa, mềm và ngọt — gắp ra chấm chao gừng, kèm cọng rau cần
    giòn sần sật.

