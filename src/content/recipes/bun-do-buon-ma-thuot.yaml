title: Bún đỏ Buôn Ma Thuột **nấu thẳng trong nồi, sợi ăn màu**
summary: >-
  Tô bún cọng to hơn bún thường, **thả thẳng vào nồi nước lèo** nên sợi ngấm đỏ
  cam từ trong ra chứ không phải chỉ chan nước đỏ lên trên. Màu ấy là **gạch cua
  và dầu điều**, không phải phẩm màu.
