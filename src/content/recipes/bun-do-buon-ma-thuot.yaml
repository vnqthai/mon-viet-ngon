quick:
  ingredients:
    - Bún cọng to [[800|g]] — cỡ bằng chiếc đũa; thay được bằng bún bò Huế cọng lớn
    - Cua đồng xay [[500|g]] · tôm khô hoặc tép [[80|g]] · thịt heo bằm [[200|g]]
    - Xương ống heo [[600|g]] — hầm lấy nước ngọt
    - "Lên màu: dầu điều [[3|muỗng canh|frac]] · cà chua [[3|trái]] · gạch cua vớt được"
    - Trứng cút [[16|trái]] luộc bóc vỏ · tóp mỡ [[80|g]] · hành phi
    - "Rau trụng: rau cần nước [[200|g]] · cải ngọt [[200|g]] · giá [[150|g]]"
    - "Dọn kèm: mắm tôm, ớt chưng, chanh"
  steps:
    - Hầm xương ống [[2|lít]] nước trong 1 giờ, hớt bọt cho nước trong.
    - Lọc cua đồng lấy nước, nấu lửa vừa cho riêu **kết tảng rồi vớt ra**.
    - Phi hành tím với dầu điều, xào cà chua và gạch cua cho ra màu, trút vào nồi.
    - Trộn riêu với tôm xay + thịt bằm, vo viên, thả vào nồi nấu chín.
    - Thả bún vào **nấu thẳng trong nồi 8–10 phút** cho sợi ăn màu, rồi múc ra tô.
  warning: >-
    Đừng trụng bún riêng rồi chan nước lên như mấy tô bún khác — làm vậy sợi bún
    vẫn **trắng**, tô ra chỉ có nước đỏ. Cái tên "bún đỏ" nằm ở chính sợi bún.

