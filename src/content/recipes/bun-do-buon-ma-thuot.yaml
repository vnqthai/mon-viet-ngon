flavorNote: >-
  **Chuẩn tô:** sợi bún đỏ cam từ ngoài vào, cắn thấy **mềm mà còn hơi sựt**;
  nước lèo ngọt đậm mùi cua, thoảng chua cà chua, ăn tới đâu thấy no tới đó.
storyEyebrow: Chuyện món ăn
storyTitle: Tô bún **của buổi chiều tối** trên phố núi
story:
  - >-
    Bún đỏ là món của Buôn Ma Thuột, và là món **ăn theo giờ**. Hàng quán dọn
    ra lúc xế chiều, đông nhất khi trời tối hẳn, bán tới khuya. Có nguyên một
    khúc phố tối nào cũng chi chít quán bún đỏ, khách ngồi ghế nhựa thấp quanh
    nồi nước lèo đỏ au. Đi Buôn Ma Thuột mà tìm ăn bún đỏ vào buổi sáng thì
    thường là hụt.
  - >-
    Ba thứ làm nên cái tô này. Thứ nhất là **sợi bún**: to hơn sợi bún thường
    chừng gấp rưỡi, cỡ bằng chiếc đũa — xấp xỉ sợi bún bò Huế loại lớn chứ chưa
    tới mức sợi bánh canh, và mỗi hàng lại nhỉnh hơn kém nhau đôi chút. Thứ hai
    là cách nấu: bún **thả thẳng vào nồi nước lèo** chứ không trụng riêng, nên
    nó vừa nở ra vừa ngấm màu, ngấm vị. Thứ ba là màu đỏ, đến từ **gạch cua, cà
    chua và dầu điều**.
  - >-
    Nói cho rõ chỗ hay bị hiểu nhầm: **hạt điều màu** dùng nấu dầu điều là loại
    hạt nhỏ màu cam đỏ, đun nóng thì tiết ra dầu đỏ óng để lên màu món ăn — nó
    **không phải hạt điều rang muối** người ta vẫn ăn chơi, dù hai thứ cùng tên
    gọi tắt. Cùng thứ dầu này là cái làm nồi bún bò Huế và nồi cà ri có màu.
  - >-
    Nền vị thì quen thuộc với người Việt: **riêu cua đồng**. Nhưng riêu ở đây
    được trộn thêm tôm xay và thịt bằm rồi vo thành viên, nên không tơi như tảng
    riêu trong tô bún riêu mà chắc và đậm hơn. Cộng với sợi bún to, tô bún đỏ ăn
    no hơn hẳn — đúng kiểu một bữa tối gọn nhẹ mà chắc bụng.

