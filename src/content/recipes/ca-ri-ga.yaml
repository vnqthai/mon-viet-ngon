title: Cà ri gà **vàng óng nước dừa, nghe mùi là biết nhà có tiệc**
summary: >-
  Gà ta ướp bột cà ri sả thơm lựng, om mềm trong nước dừa, khoai lang khoai
  môn chiên sơ bùi ngọt, phút cuối rưới **nước cốt dừa béo lịm** — nồi cà ri
  vàng óng của mọi đám tiệc miền Nam, chấm bánh mì hay chan bún đều đã đời.
region: Miền Nam
category: Kho
occasions: [Đãi khách]
pubDate: 2026-07-28
