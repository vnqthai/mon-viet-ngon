flavorNote: >-
  **Chuẩn vị:** nước cà ri vàng nghệ ánh cam, sánh nhẹ ôm lấy muỗng; húp
  thấy **béo nước dừa – thơm sả nghệ – hậu ngọt dịu**, miếng gà mềm mọng
  còn nguyên da, khoai bùi tan mà chưa rã.
storyEyebrow: Chuyện nồi cà ri
storyTitle: Nồi to nhất nhà, **để dành cho ngày vui**
story:
  - >-
    Ở miền Nam, cà ri gà ít khi nấu nồi nhỏ. Nó là món của **đám giỗ, đám
    cưới, tân gia** — mấy dịp cả họ xúm lại, bếp đỏ lửa từ sáng sớm, và cái
    nồi to nhất nhà được khiêng ra. Mùi sả nghệ quyện nước dừa bay tới đâu,
    con nít đánh hơi tới đó, chầu chực sẵn bên rổ bánh mì chờ giờ khui nồi.
  - >-
    Gốc gác món này là cà ri **theo chân người Ấn tới Sài Gòn** từ hơn trăm
    năm trước, rồi được bếp miền Nam "nắn" lại theo ý mình: bột cà ri nhẹ
    tay hương liệu, thiên về sả và nghệ; nồi nước ngọt béo nước dừa; thêm
    khoai lang khoai môn cho chắc bụng. Thành ra cà ri gà xứ mình **béo mà
    thanh, thơm mà hiền**, cay chỉ đủ ấm cổ — người già con nít ăn chung
    một nồi.
  - >-
    Công thức dưới đây là bản bếp nhà đúng bài: khoai chiên sơ cho om lâu
    không nát, nước dừa chia **hai lượt** — lượt dão om gà cho ngọt, lượt
    cốt đặc rưới cuối cho béo dậy mùi. Nắm chắc hai điểm đó là nồi cà ri
    của bạn đãi được cả họ, không cần đợi tới đám tiệc mới dám nấu.

