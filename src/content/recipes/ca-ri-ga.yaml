stepsEyebrow: Vô bếp thôi!
stepsTitle: 6 bước ra **nồi cà ri vàng óng**
stepsLead: >-
  Trình tự khôn nhất: ướp gà xong là rảnh tay chiên khoai, gà om vừa mềm
  thì khoai cũng ráo dầu chờ sẵn — mọi thứ nối nhau một mạch tới lúc khui
  nồi.
steps:
  - title: Chặt gà, ướp cà ri
    icon: knife
    minutes: 35 phút
    intro: "Khúc gà chặt to hay nhỏ quyết định nồi cà ri đẹp hay nát:"
    bullets:
      - label: "Sơ chế:"
        text: >-
          gà chà muối + gừng đập (hoặc chanh), rửa sạch, **thấm thật khô**.
          Chặt khúc to: đùi làm hai, cánh chặt đôi, giữ nguyên da.
      - label: "Ướp:"
        text: >-
          trộn gà với [[2|muỗng canh|frac]] bột cà ri + sả tỏi hành băm +
          [[1|muỗng cà phê]] muối + [[1|muỗng canh|frac]] đường +
          [[1|muỗng canh|frac]] dầu ăn. Bóp nhẹ tay, ướp **30 phút**.
    callout:
      type: tip
      text: >-
        Thấy chợ có hũ **cà ri dầu** thì múc 1 muỗng thế chỗ dầu ăn trong
        phần ướp — màu đẹp hơn, mùi sâu hơn nữa.
    timer:
      secs: 1800
      label: Hẹn giờ ướp gà · 30:00
      doneMsg: Gà thấm rồi — bắc nồi phi sả thôi!
  - title: Chiên sơ khoai — khoai nào cũng nguyên khúc
    icon: flame
    minutes: 15 phút
    intro: "Tranh thủ lúc chờ gà thấm, lo phần khoai:"
    bullets:
      - label: "Cắt khúc:"
        text: >-
          khoai lang, khoai môn gọt vỏ, cắt khúc to cỡ **hộp quẹt**, rửa
          sạch mủ rồi để thật ráo.
      - label: "Chiên sơ:"
        text: >-
          dầu nóng già, chiên lửa vừa tới **vàng nhẹ các mặt** (ruột chưa
          cần chín), vớt ra giấy thấm dầu.
    callout:
      type: tip
      text: >-
        Khoai môn gọt vỏ dễ ngứa tay — đeo bao tay, hoặc giữ tay và củ
        khoai **thật khô** rồi hẵng gọt, ngứa liền bớt hẳn.
  - title: Phi sả, xào gà săn
    icon: pot
    minutes: 10 phút
    bullets:
      - text: >-
          Nồi đáy dày, [[2|muỗng canh|frac]] dầu ăn, phi phần sả tỏi hành
          còn lại tới **vàng thơm lựng**.
      - text: >-
          Trút gà vô, **lửa vừa lớn xào 4–5 phút** cho mặt thịt săn, da
          hơi vàng — lớp bột cà ri áo quanh miếng gà dậy mùi là đạt.
    callout:
      type: warn
      text: >-
        Bột cà ri **rất mau khét** — thấy sém đáy nồi là hạ lửa liền.
        Khét một chút thôi là cả nồi nhẫn đắng, khó cứu lắm.
  - title: Om nước dừa hai lượt
    icon: claypot
    minutes: 25 phút
    bullets:
      - text: >-
          Châm [[400|ml]] nước dừa tươi + phần **nước dão** (nước cốt vắt
          lượt hai, lỏng hơn cốt đầu) + nước nóng cho vừa ngập mặt gà.
      - text: >-
          Thả sả cây đập dập + lá cà ri (nếu có). Sôi thì hớt bọt, hạ
          **liu riu om 20 phút** cho gà chín mềm.
    callout:
      type: tip
      text: >-
        Không có nước dừa tươi thì thay bằng nước lọc + 1 muỗng cà phê
        đường phèn — vị ngọt thanh gần giống, đừng thay bằng nước ngọt
        có ga.
    timer:
      secs: 1200
      label: Hẹn giờ om gà · 20:00
      doneMsg: Gà mềm rồi — tới lượt khoai vô nồi!
  - title: Khoai vô nồi, nêm vị đám tiệc
    icon: spoon
    minutes: 20 phút
    bullets:
      - text: >-
          Cho khoai chiên vô, om liu riu thêm **15 phút** tới xiên đũa
          qua khúc khoai thấy nhẹ tay.
      - text: >-
          Nêm lại: [[1|muỗng cà phê]] muối · [[1|muỗng canh|frac]] đường,
          nếm rồi cân theo miệng nhà — chuẩn miền Nam là **mặn ngọt cân
          nhau, béo đằm hậu ngọt**.
    callout:
      type: tip
      text: >-
        Muốn nước sánh nhẹ kiểu quán: **dầm tan 1–2 khúc khoai lang** vô
        nước cà ri — chất sánh thiệt thà hơn bột năng nhiều.
    timer:
      secs: 900
      label: Hẹn giờ om khoai · 15:00
      doneMsg: Khoai mềm tới — rưới nước cốt thôi!
  - title: Nước cốt đặc — chữ ký của nồi cà ri
    icon: drop
    minutes: 5 phút
    bullets:
      - text: Rưới phần **cốt đặc nhất** vô nồi, khuấy nhẹ đúng một vòng.
      - text: >-
          Nước **vừa lăn tăn trở lại là tắt bếp** — nêm nếm lần cuối, thả
          ớt lát nếu nhà ăn cay.
      - text: >-
          Múc tô, rưới thêm muỗng nước cốt lên mặt cho **loang vệt trắng**
          đẹp như tiệm — dọn cùng bánh mì nóng, bún tươi hoặc cơm.
    callout:
      type: warn
      text: >-
        Cho cốt đặc rồi mà nấu **sôi già là tách dầu** — mặt nồi nổi váng
        lợn cợn, vị béo hóa gắt. Lăn tăn là dừng, nhớ nghen.
    doneText: Khui nồi đãi cả nhà — xong!

tipsTitle: 7 bí quyết cho **nồi cà ri béo mượt**
tipsLead: >-
  Cà ri gà nguyên liệu dễ kiếm, ăn thua nhau ở mấy cái "biết" của người
  nấu đám lâu năm — đọc kỹ trước khi đi chợ nghen.
tips:
  - icon: meat
    title: Đùi cánh giữ da mới béo
    text: >-
      Cà ri gà ngon nhờ **chút mỡ dưới da** tan vô nước dừa. Lột da "cho
      đỡ ngán" là nồi cà ri lạt béo hẳn đi — sợ ngán thì bớt cốt đặc,
      đừng bớt da.
  - icon: jar
    title: Bột cà ri Việt, đừng nhầm hàng xóm
    text: >-
      Hũ bột **"cà ri Ấn Độ" của chợ Việt** nhẹ mùi hương liệu, thiên sả
      nghệ — nó sinh ra cho món này. Curry Nhật đóng viên sệt ngọt kiểu
      khác, bột Ấn chính gốc lại nồng hơn nhiều — thay vô là lạc giọng
      liền.
  - icon: flame
    title: Chiên sơ khoai là luật
    text: >-
      Mặt khoai se lại như lớp áo giáp, om 15–20 phút vẫn nguyên khúc,
      cắn vô ruột mới bở bùi. Bỏ bước này, khoai môn rã ra là nước cà ri
      đục lền, coi như thua.
  - icon: drop
    title: Nước dừa hai lượt, cốt đặc đi sau
    text: >-
      Nước dão chịu được lửa om lâu; cốt đặc chỉ cần **ấm tới là dậy
      béo**, sôi già là tách dầu. Chia hai lượt là mẹo giữ béo mượt của
      mấy dì nấu đám lâu năm.
  - icon: stem
    title: Sả đóng hai vai
    text: >-
      Sả băm ướp cho thấm vô thớ thịt, sả đập dập thả nồi cho thơm nước —
      thiếu vai nào nồi cà ri cũng "mỏng mùi" đi một nửa.
  - icon: spoon
    title: Nêm kiểu miền Nam — béo đằm hậu ngọt
    text: >-
      Cà ri gà xứ này nêm **muối – đường là chính**, hơi ngọt hơn khẩu
      vị thường một chút; phần mặn để dành cho chén muối ớt chanh chấm
      gà. Nêm mặn quá là mất cái "hiền" của món.
  - icon: clock
    title: Nấu đãi tiệc — canh giờ kiểu nhà nghề
    text: >-
      Nấu tới hết bước om khoai từ sớm rồi tắt bếp; sát giờ dọn mới hâm
      sôi nhẹ và rưới cốt đặc. Món lúc nào cũng "vừa nấu xong" dù khách
      tới trễ cả tiếng — mẹo ruột của mấy đám tiệc miền Tây, miền Nam.

serve:
  title: Dọn cà ri — **xé bánh mì, chan bún, kiểu nào cũng đã**
  paras:
    - >-
      Kinh điển nhất: tô cà ri bốc khói + **bánh mì nóng giòn**. Xé miếng
      vỏ giòn chấm ngập tới ruột bánh, vớt theo khúc khoai bùi — kiểu ăn
      làm ổ bánh mì hết trước cả nồi. Trong bếp nhà này, đội **bò kho**
      với đội cà ri gà vẫn tranh nhau chức "món chấm bánh mì đỉnh nhất",
      chưa phân thắng bại.
    - >-
      Đãi tiệc đúng bài miền Nam thì chan **bún tươi**: gắp nhúm bún vô
      chén, chan nước cà ri nóng, thêm khúc khoai miếng gà — nhẹ bụng, ăn
      được nhiều vòng, khách khen nức nở mà chủ nhà chỉ việc múc. Con nít
      thì cứ chan cơm nóng, quẹt sạch chén hồi nào không hay.
    - >-
      Còn muốn ra dáng mâm tiệc trọn bộ: khai vị dĩa **chả giò** giòn rụm
      hay **gỏi cuốn** mát lành, kế tới nồi cà ri gà nóng hổi giữa bàn —
      thực đơn "nhà có đám" mà chuẩn bị gọn hơ trong một buổi.
  aside:
    title: Trên bàn cà ri
    intro: "Đủ bộ này là bữa cà ri viên mãn:"
    items:
      - icon: roll
        text: "**Bánh mì nóng giòn** — hâm lò 3 phút, xé chấm là chân ái."
      - icon: noodle
        text: "**Bún tươi** — đãi khách chan bún, thanh cảnh mà sang."
      - icon: lime
        text: "**Muối ớt chanh** — chấm riêng miếng gà, đậm lên một bậc."
      - icon: chili
        text: "**Ớt tươi hay sa tế** — nồi chung để hiền, ai ăn cay tự thêm."

faq:
  - q: Cà ri mà nằm kệ "Kho" là sao ta?
    a: >-
      Bị "soi" hoài vụ này! Kệ Kho của nhà này gom hết mấy món **rim –
      kho – hầm đậm đà ăn với cơm, bánh mì** về một chỗ cho dễ kiếm — bò
      kho đứng đó, cà ri gà qua đứng kế cho có bạn. Xếp kệ theo kiểu bếp
      nhà thôi, món ngon là được, danh xưng tính sau.
  - q: Nước cốt dừa lon dùng được không?
    a: >-
      Được và rất tiện — chọn lon **không đường**, và mẹo hay: **đừng
      lắc lon**. Khui ra hớt lớp kem đặc bên trên để dành làm "cốt đặc"
      rưới cuối, phần lỏng bên dưới chính là nước dão đem om. Một lon
      chia hai vai, gọn hơ.
  - q: Khoai nào om không nát? Khoai tây được không?
    a: >-
      Được — khoai tây là bản rất phổ biến, nhiều nhà nấu vậy. Bí quyết
      nằm ở **chiên sơ** chứ không nằm ở giống khoai. Combo khoai lang
      (ngọt) + khoai môn (bùi béo) là bản "đủ vị" nhất; thích thì thả
      thêm cà rốt cho có màu.
  - q: Nhà có con nít, cay nhiều ít tính sao?
    a: >-
      Nồi chung cứ nêm **hiền** như công thức — cay ở đây chỉ đủ ấm cổ.
      Ai ăn cay dữ thì dọn kèm chén **sa tế hoặc ớt tươi**, tự nêm vô
      chén mình; muốn cả nồi cay hẳn thì thêm 1 muỗng cà phê ớt bột ngay
      từ lúc ướp gà.
  - q: Nấu nồi to đãi tiệc, nhân đôi công thức được không?
    a: >-
      Được — chỉnh **số khẩu phần ngay trên trang này** là mọi định lượng
      tự tính lại, khỏi bấm máy. Lưu ý nồi to lâu sôi hơn nên thời gian
      om nhích thêm chút, và nêm cuối bằng cái lưỡi chứ đừng bằng con số
      — nồi càng to, nếm càng phải kỹ.
  - q: Cà ri để qua bữa, hâm sao cho khỏi tách dầu?
    a: >-
      Ngăn mát được **2–3 ngày**, vị còn thấm hơn. Khi hâm để **lửa nhỏ,
      khuấy nhẹ**, vừa sôi lăn tăn là dừng — bật lửa lớn cho lẹ là lớp
      cốt dừa tách dầu ngay. Nồi đãi tiệc còn dư, mai chan bánh mì ăn
      sáng là hết ý.

