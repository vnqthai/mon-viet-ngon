quick:
  ingredients:
    - Gà ta [[1200|g]] — ưu tiên đùi + cánh, chặt khúc to, **giữ nguyên da**
    - >-
      Ướp: bột cà ri [[2|muỗng canh|frac]] (hũ "cà ri Ấn Độ" của chợ Việt) ·
      sả băm [[2|cây]] · tỏi + hành tím băm · muối, đường
    - Khoai lang [[300|g]] + khoai môn [[300|g]] — cắt khúc to, chiên sơ vàng mặt
    - >-
      Nước dừa tươi [[400|ml]] · nước cốt dừa [[250|ml]] — chừa riêng phần
      **cốt đặc**, phần lỏng (nước dão) đem om
    - Sả [[3|cây]] đập dập · lá cà ri 1 nhánh (có càng thơm, không có không sao)
    - "Ăn kèm: bánh mì nóng · bún tươi hoặc cơm · muối ớt chanh"
  steps:
    - Gà chặt khúc to, thấm khô; ướp bột cà ri + sả tỏi hành băm + muối đường **30 phút**.
    - Khoai lang, khoai môn cắt khúc, **chiên sơ vàng mặt** — bí quyết khoai om lâu không nát.
    - Phi sả tỏi vàng thơm, trút gà vô **xào săn** cho gia vị áo quanh dậy mùi.
    - Châm nước dừa tươi + nước dão, thả sả đập (+ lá cà ri), om **liu riu 20 phút**.
    - Cho khoai vô om **15 phút** tới mềm; nêm muối – đường kiểu miền Nam **béo đằm hậu ngọt**.
    - Rưới **nước cốt đặc**, nước vừa lăn tăn là tắt bếp liền — múc tô, chấm bánh mì nóng.
  warning: >-
    Nước cốt dừa đặc mà **nấu sôi già là tách dầu, vị gắt** — rưới vô sau
    cùng, thấy lăn tăn quanh mép nồi là tắt bếp ngay.

