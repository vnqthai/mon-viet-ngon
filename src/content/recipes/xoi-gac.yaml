title: Xôi gấc **đỏ cam bóng mỡ, đóng khuôn xắt miếng**
summary: >-
  Đĩa xôi đỏ cam của mâm cỗ: thịt gấc bóp với chút rượu trắng, trộn vào nếp rồi
  đem hấp, quyện nước cốt dừa và đường nên hạt nào cũng **bóng mỡ và đứng màu**.
  Ép chặt vào khuôn, úp ra đĩa là một khối đứng nguyên hình, xắt miếng như xắt
  bánh.
region: Miền Bắc
category: Xôi
occasions: [Cỗ Tết, Đãi khách]
