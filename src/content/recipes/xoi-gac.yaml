heroEyebrow: Mâm cỗ ngày Tết, đĩa đỏ đặt chính giữa…

quick:
  ingredients:
    - Nếp cái hoa vàng [[600|g]] — ngâm **8 giờ** với [[1|muỗng cà phê]] muối
    - Gấc chín [[1|quả]] cỡ vừa — lấy phần thịt đỏ bám quanh hạt
    - Rượu trắng [[1|muỗng canh]] · muối [[1|muỗng cà phê|frac]] — bóp với thịt gấc
    - Nước cốt dừa [[150|ml]] · đường [[80|g]] — trộn vào sau khi xôi chín
    - Dừa nạo sợi [[50|g]] — rắc lên mặt lúc dọn
  steps:
    - >-
      Bổ gấc, nạo hết phần **thịt đỏ bám quanh hạt**, bóp với rượu trắng và
      muối, để **30 phút**.
    - >-
      Nếp ngâm 8 giờ, vo lại, để **ráo 20 phút**, rồi bóp chung với thịt gấc cho
      đỏ đều.
    - Đồ **40 phút**, giữa chừng xới tơi một lần.
    - >-
      Trộn nước cốt dừa đã nấu tan đường vào xôi nóng, đảo đều, đồ tiếp
      **10 phút**.
    - Ép vào khuôn có lót màng bọc, úp ra đĩa, rắc dừa nạo.
  warning: >-
    Cho đường vào **trước** khi đồ là hỏng: đường hút nước của hạt nếp, xôi ra
    vừa cứng vừa sượng lõi. Đường và nước cốt dừa chỉ trộn khi xôi **đã chín**,
    rồi đồ thêm mười phút cho ngấm.

