flavorNote: >-
  **Chuẩn đĩa:** màu **đỏ cam đều từ ngoài vào trong**, không phải đỏ ở mặt mà
  trắng ở lõi; hạt nếp bóng mỡ, dẻo, ép chặt mà xắt ra vẫn thấy rõ từng hạt;
  ngọt vừa phải và béo hậu do nước cốt dừa, thơm mùi nếp là chính.
storyEyebrow: Chuyện món ăn
storyTitle: Màu đỏ ấy **không nhuộm được bằng gì khác**
story:
  - >-
    Trong mâm cỗ Tết miền Bắc, đĩa xôi gấc gần như luôn được đặt chính giữa.
    Màu đỏ là màu của may mắn, nên cỗ cưới, cỗ Tết, giỗ chạp — chỗ nào cần một
    đĩa xôi trang trọng thì chỗ đó có xôi gấc.
  - >-
    Cái đỏ ấy đến từ lớp **thịt mềm bám quanh hạt gấc**, không phải từ ruột quả.
    Bổ quả gấc chín ra sẽ thấy một khối hạt đen xếp chặt, mỗi hạt bọc trong một
    lớp thịt đỏ sẫm dày chừng vài milimét. Nạo lấy đúng lớp đó, bóp với chút
    rượu trắng cho nó tách khỏi hạt và tan đều, rồi trộn vào nếp — thế là xong
    phần màu.
  - >-
    Nếp trộn màu xong thì đem **đồ** — chữ nhà bếp quen dùng cho món nếp,
    nghĩa là làm chín bằng **hơi nước** chứ không nấu trong nước; nồi hấp xôi
    truyền thống gọi là **chõ**, xửng hấp thường cũng thay được.
  - >-
    Chút **rượu trắng** trong công thức làm hai việc cùng lúc: giúp thịt gấc rời
    khỏi hạt dễ hơn, và giữ cho màu đỏ ăn sâu vào hạt nếp thay vì chỉ bám ngoài.
    Đồ xong rượu bay hết, không còn lại mùi nào.
  - >-
    Khâu cuối cùng — **ép khuôn** — mới là thứ làm đĩa xôi gấc khác đĩa xôi
    thường. Xôi nóng ép chặt vào khuôn vuông hoặc khuôn hoa, để nguội bớt rồi úp
    ra, cắt thành từng miếng như cắt bánh. Đặt lên mâm cỗ, nó đứng vững thành
    khối chứ không xẹp, và mỗi người gắp một miếng gọn gàng.

ingredientGroups:
  - name: Nếp
    icon: rice
    items:
      - id: nepxgc
        name: Nếp cái hoa vàng
        icon: rice
        color: gold
        base: 600
        unit: g
        note: >-
          Loại nếp hạt to tròn, trắng đục, thơm — đây là món cỗ nên đáng mua nếp
          ngon. Ngâm **8 giờ** cho hạt nở đều, lâu hơn xôi thường vì còn phải
          chịu thêm mười phút đồ lần hai
      - id: muoixgc
        name: Muối hạt
        icon: jar
        qtyText: ¼ muỗng cà phê
        note: >-
          Ít thôi — đây là món ngọt, chút mặn chỉ để làm cái ngọt rõ hơn chứ
          không phải để nêm mặn
  - name: Gấc
    icon: pumpkin
    items:
      - id: gacxgc
        name: Gấc chín
        icon: pumpkin
        color: red
        base: 1
        unit: quả
        note: >-
          Chọn quả **vỏ đỏ cam đều, gai nở và thưa, cầm nặng tay**. Quả còn vàng
          là chưa chín tới, thịt nhạt màu. Quả cỡ vừa (chừng 1 kg) đủ cho 600 g
          nếp; mua được nửa quả thì càng gọn
      - id: ruouxgc
        name: Rượu trắng
        icon: bottle
        base: 1
        unit: muỗng canh
        note: >-
          Bóp với thịt gấc, để 30 phút. Giúp thịt tách khỏi hạt và màu đỏ ăn vào
          hạt nếp. Đồ xong bay hết mùi
      - id: muoigacxgc
        name: Muối
        icon: jar
        qtyText: ¼ muỗng cà phê
        note: Bóp cùng rượu — chút mặn làm màu gấc lên tươi hơn
  - name: Trộn sau khi chín
    icon: drop
    items:
      - id: cotduaxgc
        name: Nước cốt dừa
        icon: drop
        base: 150
        unit: ml
        note: >-
          Nấu tan đường vào đây rồi mới trộn vào xôi **đã chín**. Không có nước
          cốt dừa thì thay bằng [[60|g]] mỡ gà hoặc dầu ăn, đĩa xôi vẫn bóng
          nhưng bớt béo thơm
      - id: duongxgc
        name: Đường
        icon: jar
        base: 80
        unit: g
        note: >-
          Cỗ miền Bắc thường để ngọt nhẹ; thích ngọt rõ thì tăng lên
          [[120|g]]. Nếm thử nước cốt dừa trước khi trộn là chắc nhất
      - id: duanaoxgc
        name: Dừa nạo sợi
        icon: pod
        qtyText: 50 g
        note: >-
          Rắc lên mặt lúc dọn cho có chỗ nhai. Dừa bánh tẻ (không quá non, không
          quá già) là vừa
  - name: Dụng cụ
    icon: basket
    items:
      - id: khuonxgc
        name: Khuôn ép
        icon: basket
        qtyText: 1 khuôn
        note: >-
          Khuôn vuông hoặc khuôn hoa đều được; không có thì dùng **một cái bát
          tô lót màng bọc** rồi úp ngược ra đĩa — cũng thành khối tròn đẹp
      - id: mangbocxgc
        name: Màng bọc thực phẩm
        icon: jar
        qtyText: 1 cuộn
        note: Lót kín lòng khuôn trước khi cho xôi vào, úp ra mới không dính

steps:
  - title: Lấy thịt gấc, bóp rượu
    icon: knife
    minutes: 40 phút
    intro: "Làm trước tiên vì còn phải để ngấm 30 phút:"
    bullets:
      - label: "Bổ quả:"
        text: >-
          Bổ đôi quả gấc, dùng thìa nạo lấy toàn bộ **khối hạt kèm lớp thịt đỏ
          bám quanh**. Phần cùi vàng sát vỏ thì bỏ, nó nhạt màu và hơi đắng.
      - label: "Bóp rượu:"
        text: >-
          Cho khối hạt vào bát to, rưới [[1|muỗng canh]] rượu trắng và
          [[1|muỗng cà phê|frac]] muối, **bóp bằng tay** cho thịt đỏ tuột hết
          khỏi hạt.
      - label: "Để ngấm:"
        text: >-
          Để yên **30 phút**. Sau đó nhặt bỏ hạt đen, giữ lại phần thịt đỏ sánh.
    callout:
      type: tip
      text: >-
        Đeo găng khi bóp gấc — màu đỏ bám vào móng tay mấy ngày mới hết. Không
        có găng thì bôi chút dầu ăn lên tay trước khi làm.
    timer:
      secs: 1800
      label: Hẹn giờ ngấm thịt gấc · 30:00
      doneMsg: Nhặt bỏ hạt đen, giữ lại phần thịt đỏ nghen!
  - title: Ngâm nếp và trộn màu
    icon: rice
    minutes: 8 giờ
    bullets:
      - label: "Ngâm:"
        text: >-
          Vo nếp 2–3 nước, ngâm ngập nước lạnh **8 giờ**. Ngâm tối hôm trước,
          sáng làm là vừa.
      - label: "Để ráo:"
        text: >-
          Vo lại nhẹ, đổ ra rá để đứng **20 phút**. Nếp cho xôi gấc phải ráo hơn
          xôi thường vì lát nữa còn thêm nước cốt dừa.
      - label: "Trộn gấc:"
        text: >-
          Trút thịt gấc vào nếp, **bóp và xóc bằng tay** cho tới khi không còn
          hạt nếp trắng nào. Đây là lúc quyết định màu — bóp kỹ thì đỏ đều từ
          ngoài vào trong.
    callout:
      type: warn
      text: >-
        Đừng cho đường vào lúc này. Đường hút nước ngược ra khỏi hạt nếp, đồ bao
        lâu cũng còn lõi cứng — và đó là lỗi làm hỏng đĩa xôi gấc nhiều nhất.
  - title: Đồ lần một
    icon: pot
    minutes: 40 phút
    bullets:
      - label: "Vào chõ:"
        text: >-
          Trải nếp đã trộn gấc lên xửng, **dàn bằng mặt**, chọc vài lỗ thông
          hơi. Lót khăn xô dưới vung.
      - label: "Đồ:"
        text: >-
          Lửa vừa, **40 phút** tính từ khi nước sôi mạnh.
      - label: "Xới giữa chừng:"
        text: >-
          Phút thứ **20** mở ra xới tơi từ dưới lên rồi đậy lại. Chõ đầy như thế
          này rất dễ chín không đều.
    timer:
      secs: 2400
      label: Hẹn giờ đồ lần một · 40:00
      doneMsg: Bấm thử hạt giữa chõ — dẻo trong là chín rồi!
  - title: Trộn cốt dừa, đồ lần hai
    icon: drop
    minutes: 15 phút
    bullets:
      - label: "Nấu nước cốt:"
        text: >-
          Đun [[150|ml]] nước cốt dừa với [[80|g]] đường trên lửa nhỏ cho tan
          hết, **đừng để sôi bùng**. Nếm thử độ ngọt ở bước này.
      - label: "Trộn:"
        text: >-
          Rưới từ từ vào xôi **đang còn nóng**, đảo nhẹ tay bằng đũa cả cho thấm
          đều. Rưới một lúc hết là chỗ ướt chỗ khô.
      - label: "Đồ tiếp:"
        text: >-
          Đậy vung đồ thêm **10 phút** cho hạt nếp uống hết phần nước cốt.
      - text: >-
          Mở ra thấy hạt **bóng mỡ, rời nhau, màu đỏ cam đậm lên** là đạt.
    callout:
      type: tip
      text: >-
        Nếm lại lần cuối ở đây. Nhạt thì rắc thêm chút đường rồi đảo, đồ thêm
        3 phút. Sau khi ép khuôn thì không chỉnh được nữa.
  - title: Ép khuôn, úp ra đĩa
    icon: plate
    minutes: 15 phút
    bullets:
      - label: "Lót khuôn:"
        text: >-
          Lót màng bọc kín lòng khuôn, để thừa mép ra ngoài cho dễ nhấc.
      - label: "Ép:"
        text: >-
          Xúc xôi nóng vào khuôn, dùng mặt sau thìa **ép thật chặt và đều tay**,
          nhất là bốn góc. Ép lỏng thì úp ra là khối xôi vỡ.
      - label: "Để nguội bớt:"
        text: >-
          Để **10 phút** cho khối xôi định hình rồi mới úp ra đĩa, nhấc màng bọc
          ra.
      - label: "Trang trí:"
        text: Rắc dừa nạo sợi lên mặt. Xắt miếng vuông hoặc miếng tam giác khi dọn.
    doneText: Xong — đặt chính giữa mâm cỗ!

tipsTitle: 4 chỗ **quyết định** đĩa xôi gấc
tips:
  - icon: alert
    title: Đường vào sau, không vào trước
    text: >-
      Đây là lỗi kinh điển của món này. Trộn đường vào nếp sống thì đường rút
      nước ngược ra khỏi hạt, đồ bốn mươi phút vẫn còn **lõi cứng trắng** ở
      giữa, mà nhìn ngoài thì tưởng chín. Trộn sau khi xôi đã chín rồi đồ thêm
      mười phút — hạt ngấm ngọt mà vẫn dẻo.
  - icon: bulb
    title: Bóp gấc bằng tay, đừng xay
    text: >-
      Có người cho cả khối hạt vào máy xay cho nhanh. Xay thì hạt đen vỡ ra, vị
      **đắng và chát** trộn thẳng vào xôi, mà màu lại xỉn đi vì lẫn mảnh hạt.
      Bóp tay mất năm phút, thịt đỏ tuột ra sạch còn hạt vẫn nguyên để nhặt bỏ.
  - icon: pumpkin
    title: Chọn quả gấc chín tới
    text: >-
      Vỏ phải **đỏ cam đều**, gai nở và thưa, cầm nặng tay. Quả còn vàng hay còn
      đốm xanh thì lớp thịt mỏng, màu nhạt, phải dùng gấp đôi lượng mà đĩa xôi
      vẫn hồng nhạt chứ không đỏ. Mua nửa quả cắt sẵn cũng được, miễn nhìn thấy
      lớp thịt đỏ dày bám quanh hạt.
  - icon: plate
    title: Ép khuôn lúc xôi còn nóng
    text: >-
      Xôi nguội thì hạt đã se mặt, ép cách mấy cũng không dính vào nhau, úp ra
      là rời từng mảng. Ép ngay lúc còn hầm hập, ép **chặt và đều tay**, để
      nguội mười phút trong khuôn rồi mới úp — khối xôi ra sắc cạnh, xắt miếng
      không vỡ.

serve:
  title: Đặt chính giữa mâm, **xắt miếng như xắt bánh**
  paras:
    - >-
      Xôi gấc lên mâm cỗ thì đóng khuôn rồi xắt thành từng miếng, mỗi người gắp
      một miếng. Đĩa để nguội vẫn ngon, thậm chí nguội rồi mới thấy rõ vị nếp và cái
      béo hậu của nước cốt dừa.
    - >-
      Ngày thường thì khỏi cần khuôn: xới vun lên đĩa, rắc dừa nạo, ăn nóng với
      **muối vừng** hoặc chấm chút đường. Trẻ con hay thích ăn kiểu này hơn.
  aside:
    title: Ba lối dọn
    intro: "Cùng một chõ xôi, ba dịp ba kiểu:"
    items:
      - icon: plate
        text: "**Ép khuôn xắt miếng** — cho mâm cỗ, đĩa đứng khối và gọn gàng."
      - icon: rice
        text: "**Xới vun lên đĩa** — ngày thường, ăn nóng cho dẻo."
      - icon: meat
        text: "**Kèm giò lụa hoặc gà luộc** — cỗ Tết hay dọn ba thứ đó cạnh nhau."

faq:
  - q: Không mua được gấc tươi thì thay bằng gì?
    a: >-
      Có **dầu gấc** bán sẵn dạng chai — trộn [[3|muỗng canh]] vào nếp trước khi
      đồ là lên màu đỏ cam khá giống. Đổi lại mất hẳn mùi thơm riêng của thịt
      gấc tươi và màu hơi phẳng, không có chiều sâu. Gấc đông lạnh (loại đã tách
      thịt, đóng gói) thì gần với tươi hơn nhiều, rã đông rồi dùng như thường.
  - q: Xôi đỏ ở ngoài mà trắng ở trong là vì sao?
    a: >-
      Do **bóp gấc chưa kỹ**. Thịt gấc phải được xoa vào từng hạt nếp cho tới
      khi không nhìn thấy hạt trắng nào nữa, việc này mất chừng 3–4 phút bóp
      thật lực. Trộn qua loa bằng đũa thì màu chỉ bám mặt ngoài, đồ xong xới lên
      là lộ ra lõi trắng.
  - q: Ép khuôn xong bị vỡ khi úp ra, làm sao?
    a: >-
      Hai nguyên nhân: ép lúc xôi đã nguội, hoặc ép chưa đủ chặt. Chữa bằng cách
      cho xôi trở lại khuôn, **hấp lại 5 phút cho nóng mềm**, rồi ép lại thật
      lực và để nguội 10 phút mới úp. Lót màng bọc cũng giúp nhiều — úp ra chỉ
      việc kéo màng.
  - q: Làm trước một ngày được không?
    a: >-
      Được, nhưng phải hấp lại. Ép khuôn xong bọc kín để ngăn mát; hôm sau đem
      cả khối **hấp 10–12 phút** là mềm dẻo trở lại, rồi mới úp ra đĩa và rắc
      dừa. Đừng quay lò vi sóng — mặt ngoài dai lại còn lõi vẫn lạnh.

