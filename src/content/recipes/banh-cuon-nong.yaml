title: Bánh cuốn nóng **mỏng mướt như lụa, tráng tới đâu hết tới đó**
summary: >-
  Bánh cuốn Hà Nội làm tại nhà **không cần nồi hấp căng vải** — một cái chảo
  chống dính có nắp là tráng được vỏ bánh mỏng mướt, cuốn nhân thịt mộc nhĩ
  đậm đà, rắc hành phi vàng ruộm, chấm chén nước mắm ấm thanh dịu đúng vị
  Bắc. Bí quyết duy nhất phải nhớ: cho bột được nghỉ đủ giờ.
region: Miền Bắc
category: Hấp
occasions: [Ăn chơi]
time:
  total: 1 giờ 30 phút (+ nghỉ bột 2 giờ)
servingsBase: 4
difficulty: Kỳ công
featured: false
order: 30
art: banh-cuon
heroEyebrow: Quà sáng Hà Nội ngay bếp nhà…

quick:
  ingredients:
    - >-
      Vỏ bánh: bột gạo tẻ [[150|g]] + bột năng [[70|g]] + [[650|ml]] nước +
      ½ muỗng cà phê muối + [[1|muỗng canh]] dầu ăn — pha xong **nghỉ bột
      tối thiểu 2 giờ**
    - >-
      Nhân: thịt heo băm [[250|g]] · mộc nhĩ khô [[15|g]] (miền Nam kêu nấm
      mèo) ngâm nở băm nhỏ · hành tây [[0.5|củ|frac]] + hành tím [[2|củ]] băm
    - Hành tím [[6|củ]] thái mỏng + [[100|ml]] dầu ăn — phi vàng, giữ lại cả dầu
    - >-
      Nước chấm: nước mắm [[3|muỗng canh|frac]] · đường [[2|muỗng canh]] ·
      giấm gạo [[1.5|muỗng canh|frac]] · [[250|ml]] nước ấm · vài lát ớt
    - "Ăn kèm: chả quế hoặc chả lụa [[200|g]] · dưa leo [[1|trái]] · rau mùi, giá trụng"
  steps:
    - >-
      Khuấy tan hai thứ bột + muối + dầu với nước, **nghỉ bột 2 giờ**; kỹ
      nữa thì chắt lớp nước trong bên trên, thay đúng lượng nước mới.
    - Mộc nhĩ ngâm nở, băm nhỏ; xào thịt băm với hành cho **tơi và ráo hẳn**, nêm mắm tiêu.
    - Phi hành tím vàng nhạt, vớt liền ra giấy thấm; pha nước chấm với nước ấm — nêm **thanh dịu tới mức húp được**.
    - >-
      Chảo chống dính lửa vừa-nhỏ, quét dầu thật mỏng; **khuấy bột lại** rồi
      múc một vá nhỏ, nghiêng chảo láng đều, đậy nắp 30–45 giây.
    - Bánh chuyển trong, phồng lăn tăn là chín — úp chảo ra mâm thoa dầu, rải nhân, **cuộn lỏng tay**.
    - Lặp tới hết bột (cuộn cái trước trong lúc chảo tráng cái sau); xếp dĩa, rắc hành phi, dọn chả + rau + chén mắm ấm.
  warning: >-
    Bột gạo lắng đáy rất nhanh — **quên khuấy trước mỗi vá** là cái bánh đầu
    dày bịch, mấy cái sau toàn nước. Khuấy từ đáy tô, mỗi lần múc.

flavor:
  chua: 2.5
  ngot: 3.5
  man: 5
  cay: 1.5
  thom: 8.5
flavorNote: >-
  **Chuẩn vị:** vỏ bánh mỏng mướt dai nhẹ, còn nóng hôi hổi; nhân đậm vừa
  phải; chén nước chấm **ấm, thanh dịu tới mức húp một muỗng không nhăn
  mặt** — mặn gắt là trật vị Bắc rồi.

storyEyebrow: Chuyện dĩa bánh
storyTitle: Món quà sáng **mỏng như lụa** của Hà Nội
story:
  - >-
    Ở Hà Nội, bánh cuốn là món quà sáng **phải ngồi chờ**: bà hàng múc vá
    bột láng lên mặt vải căng trên nồi hơi nghi ngút, đậy vung mươi giây,
    rồi luồn que tre hớt ra một tấm bánh mỏng như lụa. Khách ngồi quanh,
    lượt nào ăn nóng lượt đó — bánh cuốn ngon nhất người ta từng ăn, bao
    giờ cũng là cái **vừa ra khỏi nồi**.
  - >-
    Tin vui cho bếp nhà: muốn có lượt bánh nóng đó, **không cần nồi hấp
    căng vải**. Một cái chảo chống dính có nắp là đủ — đậy nắp lại, hơi
    nước bị nhốt bên trong tự "hấp" chín mặt bánh y như nồi vải, chỉ khác
    cách lấy bánh: úp chảo một nhịp là xong. Bí quyết thật sự nằm ở chỗ
    khác: **bột phải được nghỉ**. Bột nghỉ đủ giờ mới ngậm no nước, tráng
    lên trong mướt, dai nhẹ; bột pha xong tráng liền là bánh bở, đục, còn
    nguyên mùi bột sống.
  - >-
    Cuốn xong rắc hành phi vàng ruộm, kề dĩa chả quế, chan chén nước mắm ấm
    thanh dịu — ai hoài cổ thêm **một hai giọt tinh dầu cà cuống** cho đúng
    vị Hà Nội xưa. Lần đầu tráng tay chân hơi lóng ngóng, tới cái bánh thứ
    ba là quen nhịp; còn tới dĩa thứ hai thì cả nhà đã kéo ghế ngồi quanh
    bếp, y như ngồi hàng bánh cuốn.

