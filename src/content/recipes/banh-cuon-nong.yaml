stepsEyebrow: Vô bếp thôi!
stepsTitle: 6 bước ra **dĩa bánh cuốn nóng hổi**
stepsLead: >-
  Nhịp khôn nhất: pha bột trước rồi đi làm nhân, phi hành, pha mắm — bột
  nghỉ xong là mọi thứ sẵn sàng, chỉ việc đứng tráng một mạch. Tráng tay
  lần đầu hơi vụng, đừng lo — có nguyên một bước nói về chuyện đó.
steps:
  - title: Pha bột & nghỉ bột — nền của tất cả
    icon: jar
    minutes: 10 phút (+ nghỉ 2 giờ)
    intro: "Vỏ bánh mướt hay bở là quyết định trọn ở thau bột này:"
    bullets:
      - label: "Pha:"
        text: >-
          trộn đều bột gạo + bột năng + muối, châm [[650|ml]] nước **từ
          từ**, vừa châm vừa khuấy cho tan hết óc trâu, cuối cùng cho
          [[1|muỗng canh]] dầu ăn khuấy thêm một lượt.
      - label: "Vì sao 2 gạo : 1 năng:"
        text: >-
          bột gạo tẻ là thân bánh — mềm, mướt; bột năng cho **dai và
          trong**. Ít năng hơn bánh bở dễ rách khi cuộn, nhiều năng hơn bánh
          dai cứng kiểu bột lọc — tỉ lệ này là điểm cân.
      - label: "Nghỉ bột:"
        text: >-
          đậy khăn, để **tối thiểu 2 giờ** (để qua đêm ngăn mát càng ngon).
          Hạt bột cần thời gian ngậm no nước — bánh mới trong, dai nhẹ, hết
          mùi bột sống.
      - label: "Kỹ hơn nữa:"
        text: >-
          hết giờ nghỉ, **chắt bỏ lớp nước trong** bên trên rồi châm lại
          đúng lượng nước mới, khuấy đều — bánh trong hơn hẳn và không lo
          chua bột.
    callout:
      type: tip
      text: >-
        Nhịp chuẩn của một bữa quà sáng cuối tuần: **pha bột từ tối hôm
        trước**, sáng ra chỉ việc khuấy lại và tráng — bột nghỉ càng lâu,
        bánh càng "nét".
    timer:
      secs: 7200
      label: Hẹn giờ nghỉ bột · 120:00
      doneMsg: Bột nghỉ đủ rồi — khuấy lại từ đáy và tráng thôi!
  - title: Làm nhân thịt mộc nhĩ
    icon: meat
    minutes: 15 phút
    intro: "Tranh thủ lúc bột nghỉ, lo phần nhân:"
    bullets:
      - label: "Ngâm nấm:"
        text: >-
          mộc nhĩ (nấm mèo) ngâm nước ấm **15 phút** cho nở mềm, cắt bỏ gốc
          cứng, băm nhỏ cỡ hạt lựu — băm nhỏ mới cuộn gọn trong lớp bánh
          mỏng.
      - label: "Xào nhân:"
        text: >-
          phi thơm hành tím với 1 muỗng canh dầu, cho thịt băm vô **đảo tơi
          ngay từ đầu**; thịt săn thì thêm hành tây + mộc nhĩ, nêm
          [[1|muỗng canh]] nước mắm.
      - label: "Xào tới ráo:"
        text: >-
          giữ lửa vừa, đảo tới khi nhân **ráo hẳn, không còn đọng nước
          đáy chảo** mới tắt bếp, rắc ½ muỗng cà phê tiêu trộn đều.
    callout:
      type: warn
      text: >-
        Nhân ướt là kẻ thù số một của vỏ bánh — đọng nước tới đâu bánh nhão,
        rách tới đó. Chịu khó xào thêm một phút cho ráo hẳn.
    timer:
      secs: 900
      label: Hẹn giờ ngâm mộc nhĩ · 15:00
      doneMsg: Nấm nở mềm rồi — vớt ra băm nhỏ thôi!
  - title: Phi hành vàng & pha chén mắm
    icon: onion
    minutes: 15 phút
    bullets:
      - label: "Phi hành:"
        text: >-
          hành tím thái lát mỏng đều, thấm khô. Cho hành vô chảo **từ lúc
          dầu còn nguội**, lửa vừa, đảo đều tay — dầu nóng lên từ từ nên
          hành vàng đều, không cháy góc.
      - label: "Vớt đúng lúc:"
        text: >-
          hành **vừa chớm vàng nhạt là vớt liền** ra giấy thấm, tãi mỏng;
          nhiệt dư sẽ đẩy thêm một tông thành vàng ruộm. Dầu phi hành giữ
          lại — lát nữa thoa mâm, thoa dĩa thơm lắm.
      - label: "Pha nước chấm:"
        text: >-
          hòa [[2|muỗng canh]] đường vô [[250|ml]] nước ấm cho tan, thêm
          [[3|muỗng canh|frac]] nước mắm + [[1.5|muỗng canh|frac]] giấm.
          Nếm thử: **mặn dịu – ngọt nhẹ – chua thoảng**, loãng tới mức húp
          một muỗng không nhăn mặt. Thả vài lát ớt.
    callout:
      type: tip
      text: >-
        Đúng bài Hà Nội xưa còn thêm **một hai giọt tinh dầu cà cuống** cho
        cả chén — cà cuống là loài côn trùng nước, con đực có túi tinh dầu
        thơm cay rất riêng, giờ hiếm và đắt. Có thì quý, không có cũng chẳng
        sao.
  - title: Tráng bánh — chảo thay nồi hấp
    icon: flame
    minutes: 30 phút
    intro: "Nhịp tráng gói trong bốn chữ: láng – đậy – đếm – úp:"
    bullets:
      - label: "Chuẩn bị chảo:"
        text: >-
          chảo chống dính 24–26 cm **không trầy xước**, lửa vừa-nhỏ; quét
          lớp dầu mỏng tới mức chỉ còn thấy bóng mờ (dùng cọ hoặc khăn giấy
          chấm dầu).
      - label: "Láng bột:"
        text: >-
          **khuấy bột từ đáy tô** rồi múc một vá nhỏ chừng 60 ml, nhấc chảo
          khỏi bếp, đổ bột vô và **nghiêng xoay một vòng thật nhanh** cho
          phủ kín đáy — đổ một lần thôi, đừng chêm vá bổ sung.
      - label: "Đậy nắp:"
        text: >-
          đặt chảo lại bếp, **đậy nắp 30–45 giây** — hơi nước bị nhốt bên
          trong sẽ hấp chín mặt bánh. Cái nắp chính là "nồi hấp mini" của
          mình.
      - label: "Nhìn là biết chín:"
        text: >-
          bánh **chuyển màu trong, phồng lăn tăn vài bong bóng** là đạt; mở
          nắp còn thấy chỗ trắng đục thì đậy thêm mươi giây nữa.
    callout:
      type: warn
      text: >-
        Cái bánh đầu tiên hầu như luôn… xấu — dày, rách, hoặc dính. Cứ coi
        đó là bánh "cúng chảo": nó báo cho mình biết lửa đang lớn hay nhỏ,
        dầu dày hay mỏng. Chỉnh một nấc là cái thứ hai đẹp liền, đừng nản!
    timer:
      secs: 40
      label: Hẹn giờ tráng bánh · 00:40
      doneMsg: Mở nắp coi — bánh trong, phồng lăn tăn là chín!
  - title: Úp bánh, vô nhân, cuộn lỏng tay
    icon: roll
    intro: >-
      Trong lúc cái bánh sau nằm trong chảo đậy nắp, mình cuộn cái trước —
      giữ được nhịp kép này là 30 phút xong hết thau bột:
    bullets:
      - label: "Úp bánh:"
        text: >-
          thoa dầu (lấy luôn dầu phi hành cho thơm) lên mâm hoặc thớt sạch,
          rồi **úp ngược chảo xuống dứt khoát một nhịp** — bánh rơi nguyên
          tấm, phẳng phiu.
      - label: "Rải nhân:"
        text: >-
          gắp chừng một muỗng canh nhân, rải thành **một đường ngang** ở
          phần ba dưới của tấm bánh — nhân dàn đều thì cuộn lên mới thấy
          nhân ở mọi khúc cắn.
      - label: "Cuộn:"
        text: >-
          cuốn hai ba vòng **lỏng tay**, hai đầu để hở tự nhiên kiểu hàng
          Hà Nội (thích kín thì gấp hai mép trước khi cuộn). Bánh đang mềm
          oặt — cuốn chặt là rách, là bẹp.
      - label: "Xếp dĩa:"
        text: >-
          bánh cuộn xong xếp lên dĩa có thoa tí dầu hành, cái nọ gối hờ cái
          kia cho khỏi dính nhau.
    callout:
      type: tip
      text: >-
        Đừng cầu toàn từng nếp cuốn — hàng bánh cuốn Hà Nội cuộn nhanh tay,
        cái nào cũng hơi "tùy hứng". Nhìn hơi xộc xệch một chút mới đúng là
        bánh tráng tay.
  - title: Dọn dĩa — rắc hành phi, hâm mắm ấm
    icon: bowl
    minutes: 5 phút
    bullets:
      - text: >-
          Rắc **hành phi vàng ruộm** phủ mặt bánh, điểm nhánh rau mùi; xếp
          chả quế thái lát xéo, dưa leo, giá trụng vào một góc dĩa.
      - text: >-
          Nước chấm bắc lên bếp **hâm cho ấm** (ấm môi là đủ, đừng nóng
          bỏng), chan ra chén nhỏ mỗi người một chén.
      - text: >-
          Ăn ngay khi bánh còn nóng: gắp miếng bánh **chấm ngập chén mắm
          ấm**, cắn kèm miếng chả quế — mềm, đậm, thơm đủ tầng.
    callout:
      type: tip
      text: >-
        Ai từng ăn bánh cuốn hàng sẽ nhớ chi tiết này: chén nước chấm lúc
        nào cũng **âm ấm** — mắm ấm mới dậy mùi, bánh nguội tới đâu mắm sưởi
        lại tới đó.
    doneText: Dĩa bánh nóng lên mâm — xong!

tipsTitle: 8 bí quyết **tráng bánh mượt tay**
tipsLead: >-
  Bánh cuốn chảo không khó, chỉ lạ tay. Nắm 8 điều này là mẻ đầu tiên đã ăn
  được, mẻ thứ hai đã khoe được.
tips:
  - icon: clock
    title: Nghỉ bột — bước tàng hình quan trọng nhất
    text: >-
      Hạt bột cần **tối thiểu 2 giờ** ngậm no nước mới cho vỏ bánh trong,
      dai nhẹ, hết mùi bột sống. Pha xong tráng liền là bánh bở, đục — không
      mẹo nào cứu được.
  - icon: spoon
    title: Khuấy trước mỗi vá
    text: >-
      Bột gạo nặng, chỉ 1–2 phút là lắng hết xuống đáy. Không khuấy lại thì
      vá đầu đặc quánh, vá sau toàn nước — **khuấy từ đáy tô trước mỗi lần
      múc** thành phản xạ luôn cho chắc.
  - icon: flame
    title: Lửa vừa-nhỏ, nắp đậy kín
    text: >-
      Chảo + nắp = nồi hấp mini: hơi nước quẩn bên trong mới hấp mặt bánh
      chín trong. Lửa lớn làm mép bánh **khô quăn, gãy rách** trước khi mặt
      bánh kịp chín.
  - icon: drop
    title: Dầu quét "như không quét"
    text: >-
      Dầu nhiều thì bột trượt láng không đều, bánh lại **rỗ mặt**. Dùng cọ
      hoặc khăn giấy chấm dầu lau qua một lượt — thấy chảo chỉ hơi bóng mờ
      là chuẩn.
  - icon: roll
    title: Cuộn lỏng tay
    text: >-
      Vỏ bánh mềm oặt như lụa ướt — cuốn hờ hai ba vòng là tự ôm lấy nhân.
      Siết chặt kiểu cuốn chả giò là bánh **rách, bẹp dí**, uổng công tráng
      mỏng.
  - icon: onion
    title: Hành phi — vàng nhạt là vớt
    text: >-
      Nhiệt dư trong hành sẽ đẩy màu thêm một tông sau khi vớt. Đợi vàng
      ruộm trong chảo mới vớt là ra ngoài thành **nâu, đắng** — mất toi chỗ
      hành đẹp.
  - icon: bottle
    title: Nước chấm thanh, ấm, không tỏi
    text: >-
      Nước chấm bánh cuốn Bắc là kiểu **loãng dịu húp được**, chỉ điểm vài
      lát ớt — pha kiểu tỏi ớt đậm đà của miền Nam là át hết vị bánh. Trước
      khi dọn nhớ hâm ấm.
  - icon: bulb
    title: Cái bánh đầu là bánh "cúng chảo"
    text: >-
      Nghề tráng nào cũng vậy: cái đầu tiên để dò lửa, dò dầu. Nó xấu là
      **chuyện bình thường** — đừng vì nó mà chỉnh loạn công thức, chỉ cần
      sửa đúng một nấc lửa hoặc lớp dầu.

serve:
  title: Dọn mâm **kiểu quà sáng Hà Nội**
  paras:
    - >-
      Bánh cuốn đúng điệu phải ăn **lượt nào nóng lượt đó**: một người đứng
      tráng, cả nhà ngồi quanh gắp dần — bánh ra tới đâu hết tới đó, đúng
      cái thú ngồi hàng bánh cuốn, chỉ khác là ngay bếp nhà mình.
    - >-
      Gắp miếng bánh mềm mướt **chấm ngập chén mắm ấm**, cắn thêm lát chả
      quế thơm thoảng mùi quế, thỉnh thoảng đổi vị bằng miếng dưa leo, nhúm
      giá trụng. Sáng cuối tuần dọn kiểu này, nhà cửa thơm mùi hành phi tới
      trưa.
    - >-
      Lỡ ghiền "góc Hà Nội" rồi thì trưa đổi qua **bún chả Hà Nội** nướng
      thơm lừng, hôm khác làm tô **phở gà** thanh ngọt — bếp nhà mình gom đủ
      bộ quà Hà Nội hồi nào không hay.
  aside:
    title: Trên mâm bánh cuốn
    intro: "Đủ bộ này là chuẩn hàng bánh cuốn:"
    items:
      - icon: bottle
        text: >-
          **Chén nước mắm ấm** — thanh dịu, vài lát ớt; ai hoài cổ thêm giọt
          tinh dầu cà cuống.
      - icon: meat
        text: "**Chả quế thái lát** — béo thơm, cặp bài trùng của bánh cuốn."
      - icon: herb
        text: "**Rau mùi + giá trụng** — thanh mát, đỡ ngấy cho vỏ bánh mềm."
      - icon: pod
        text: "**Dưa góp đu đủ cà rốt** — chua giòn đổi miệng, có thì càng vui."

faq:
  - q: Không có bột năng thì thay bằng gì?
    a: >-
      **Bột khoai tây hoặc bột bắp**, cùng lượng — bánh vẫn thành, chỉ kém
      dai và kém trong hơn một chút. Tuyệt đối đừng thay bằng bột nếp: dẻo
      dính bết, không ra bánh cuốn.
  - q: Bánh cứ rách hoặc dính chảo — do đâu?
    a: >-
      Dò theo thứ tự đáng ngờ: **chảo trầy xước** (đổi chảo khác là hết
      liền) → **dầu quét dày quá** (bột trượt, bánh rỗ) → **lửa lớn quá**
      (mép khô quăn, gãy rách) → **bột chưa nghỉ đủ** (bánh bở). Soi từng
      cái là ra bệnh ngay.
  - q: Tráng nồi hấp căng vải có ngon hơn bản chảo không?
    a: >-
      Nồi vải tráng được **mỏng hơn nữa** — đó là đồ nghề của hàng chuyên.
      Nhưng dựng nồi, căng vải, canh hơi đều cầu kỳ; bản chảo là bản bếp
      nhà: mỏng mướt đủ ghiền mà sáng nào hứng lên cũng làm được.
  - q: Bánh cuốn Thanh Trì khác gì bánh cuốn nóng?
    a: >-
      Thanh Trì là làng bánh cuốn nức tiếng của Hà Nội: bánh **chay không
      nhân**, tráng mỏng tang từng lá xếp lớp, thoa hành phi, ăn nguội kèm
      chả và nước chấm (xưa quý nhất là pha cà cuống). Bản mình làm là
      **bánh cuốn nóng có nhân** — hai anh em một nhà bánh cuốn.
  - q: Bột pha rồi để qua đêm được không?
    a: >-
      Quá tốt là đằng khác: đậy kín để **ngăn mát qua đêm**, sáng mai chắt
      nước cũ, châm đúng lượng nước mới rồi khuấy đều là tráng — bánh còn
      trong và thơm hơn bột mới pha.
  - q: Bánh nguội rồi, làm sao ngon lại?
    a: >-
      Hấp lại vài phút, hoặc quay vi sóng có **đậy chén nước / khăn ẩm** —
      bánh mềm lại gần như mới. Nhưng nói thiệt lòng: bánh cuốn là món ăn
      tại trận, tráng tới đâu ăn tới đó vẫn là nhất.

