flavorNote: >-
  **Chuẩn nồi lẩu:** nước lẩu **vàng nâu sánh nhẹ, béo bùi mùi chao** chứ không
  loãng như nước hầm xương; miếng dê **da mềm dẻo, thịt còn thớ** chứ không bã;
  khoai môn bở tan trong miệng mà miếng vẫn còn nguyên trong nồi.
storyEyebrow: Chuyện nồi lẩu dê
storyTitle: Miếng chao — **thứ làm nên cả nồi lẩu**
story:
  - >-
    Nhắc "lẩu dê" ở miền Nam thì gần như ai cũng hiểu là **lẩu dê nấu chao**.
    Chao — đậu hũ ủ lên men — vừa mặn vừa béo vừa dậy mùi, chính là thứ hợp
    nhất với thịt dê: nó không giấu mùi dê đi mà **đứng ngang hàng với mùi
    đó**, hai bên cân nhau thành một mùi thứ ba rất riêng.
  - >-
    Nồi lẩu này còn có hai người bạn không thể thiếu. **Khoai môn** hút nước
    lẩu vào rồi bở tan trong miệng, làm nồi nước sánh lại một cách tự nhiên
    chẳng cần bột. **Tàu hũ ky chiên phồng** thì ngược lại — giòn rộp lúc mới
    thả, rồi mềm dần ngậm đầy nước lẩu, ăn miếng nào cũng khác miếng nào.
  - >-
    Đây là món của bàn đông người, nồi đặt giữa, mỗi người một chén chao sa tế
    riêng. Nhúng cải xanh vô nước lẩu đang sôi, gắp ra chấm chao, kèm miếng
    thịt dê — rồi tự hiểu vì sao quán lẩu dê nào tối nào cũng kín bàn.

