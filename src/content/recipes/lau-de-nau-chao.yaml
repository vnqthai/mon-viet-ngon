quick:
  ingredients:
    - Thịt dê có da [[1|kg]] — vai hoặc đùi, chặt miếng [[4|cm]]
    - "Khử mùi: gừng giã [[1|củ]] + rượu trắng [[3|muỗng canh]]"
    - "Ướp: chao đỏ [[4|viên]] + chao trắng [[2|viên]] · sả băm [[4|cây]] · tỏi + hành tím băm · ngũ vị hương [[1|muỗng cà phê]]"
    - Khoai môn [[500|g]] cắt khối · tàu hũ ky [[100|g]] chiên phồng
    - Nước dừa tươi [[1|lít]] + nước lọc [[1|lít]]
    - Rau nhúng — cải xanh, tần ô, tía tô · bún hoặc mì
    - "Chén chấm: chao [[4|viên]] tán + nước chao + đường + sa tế + sả băm"
  steps:
    - Bóp thịt dê với **gừng giã + rượu trắng** [[10|phút]], xả sạch — bước khử mùi, đừng bỏ.
    - Tán nhuyễn chao, trộn với sả tỏi hành + ngũ vị hương, **ướp thịt tối thiểu 1 tiếng**.
    - Phi thơm sả tỏi, cho thịt vào **xào săn mặt** rồi mới đổ nước dừa + nước lọc.
    - Hầm lửa nhỏ **60–75 phút** tới khi miếng da mềm dẻo, xiên đũa qua nhẹ tay.
    - Khoai môn **chiên sơ cho se mặt** rồi mới thả vào — chiên rồi thì mềm mà không tan vào nước.
    - Tàu hũ ky cắt miếng, **chiên phồng**, để riêng, ăn tới đâu thả tới đó.
    - Bắc nồi lên bếp giữa bàn, nhúng rau, chấm chao sa tế, ăn với bún hoặc mì.
  warning: >-
    Không khử mùi kỹ thì cả nồi lẩu ám mùi hoi, chao thơm cỡ nào cũng không
    che nổi. Bóp gừng rượu, xả sạch, rồi **chần qua nước sôi có đập gừng** một
    lượt nữa là chắc ăn.

