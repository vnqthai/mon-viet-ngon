title: Lẩu dê nấu chao **béo bùi, thơm nức nồi**
summary: >-
  Thịt dê ướp chao tán nhuyễn với sả tỏi, nấu thành **nồi nước lẩu vàng nâu béo
  ngậy**, thả khoai môn bở và tàu hũ ky chiên phồng — nhúng cải xanh với tần ô,
  chấm chén chao sa tế. Nồi lẩu Nam Bộ đúng bài.
