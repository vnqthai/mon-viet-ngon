quick:
  ingredients:
    - Cá thát lát [[800|g]] nguyên con — nạo ra được chừng [[400|g]] thịt
    - Hành lá [[1|nắm]] · hành tím [[4|củ]] · tỏi [[3|tép]]
    - Tiêu xay [[1|muỗng cà phê]] · muối [[1|muỗng cà phê]] · đường [[1|muỗng cà phê|frac]]
    - Nước mắm [[1|muỗng canh]] · bột năng [[1|muỗng canh]] · dầu ăn để chiên
    - "Nước chấm: me vắt [[2|muỗng canh]] · nước mắm · đường · tỏi ớt"
  steps:
    - >-
      Nạo thịt cá bằng thìa, **xuôi từ đuôi lên đầu**, chừa lại da và xương.
    - >-
      Quết thịt cá với muối trong cối hoặc đập mạnh trong tô **10–15 phút** tới
      khi dẻo quánh và dính tay.
    - Trộn hành tiêu, nước mắm, đường, bột năng; quết thêm 3 phút cho hoà đều.
    - >-
      Cho vào ngăn mát **30 phút**, rồi nhúng tay nước lạnh vo thành miếng tròn
      dẹt dày 1 cm.
    - Chiên ngập dầu lửa vừa, mỗi mặt **3–4 phút** tới khi vàng rám.
  warning: >-
    Quết chưa tới thì miếng chả **bở và rã ra trong chảo** — đó là lỗi duy nhất
    làm hỏng món này. Nhấc một nắm thịt lên, thấy nó **dính lằng nhằng theo tay
    thành sợi** chứ không rơi rớt xuống, mới là quết đủ.

