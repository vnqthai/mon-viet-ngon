        unit: g
        note: >-
          Nguyên con chừng [[800|g]] nạo ra được [[400|g]] thịt. Chọn con
          **mình dẹt, da bóng, mắt trong, ấn vào thấy đàn hồi**. Ngoài miền Tây
          thì cá tươi khó kiếm — hàng đông lạnh và **chả cá thát lát quết sẵn**
          bán khá phổ biến ở siêu thị, dùng được, chỉ kém dai hơn cá tự nạo
