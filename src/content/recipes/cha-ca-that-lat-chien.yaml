title: Chả cá thát lát chiên **quết tay cho dai, chiên vàng rám**
summary: >-
  Thịt cá thát lát nạo ra rồi quết liên tục cho tới lúc **dẻo quánh và dính
  tay**, nêm tiêu hành, vo thành miếng tròn dẹt đem chiên. Cắn vào nghe giòn
  sựt ở lớp vỏ vàng rám, bên trong dai và ngọt, chấm nước mắm me chua ngọt.
region: Miền Tây
category: Chiên
