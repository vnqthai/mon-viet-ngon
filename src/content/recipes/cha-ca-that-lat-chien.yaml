          khỏi nấu nước mắm me

steps:
  - title: Nạo thịt cá
    icon: knife
    minutes: 20 phút
    intro: "Nếu mua chả quết sẵn thì bỏ qua bước này:"
    bullets:
      - label: "Làm sạch:"
        text: >-
          Đánh vảy, bỏ ruột, rửa sạch rồi lau khô. Cắt bỏ đầu và vây.
      - label: "Nạo thịt:"
        text: >-
          Đặt con cá nằm nghiêng, dùng **thìa cà phê cạo xuôi từ đuôi lên đầu**
          dọc theo sống lưng. Thịt cá sẽ tuột ra thành từng dải trắng, để lại da
          và xương gần như nguyên vẹn.
      - label: "Nhặt xương dăm:"
        text: >-
          Dàn thịt ra đĩa, soi kỹ nhặt hết mảnh xương dăm còn sót — cá này nhiều
          xương nhỏ.
      - text: >-
          Ướp lạnh phần thịt vừa nạo trong ngăn mát **15 phút** trước khi quết.
          Thịt lạnh thì lên độ dẻo nhanh hơn.
    callout:
      type: tip
      text: >-
        Nạo bằng thìa chứ đừng dùng dao lóc — dao lấy được nhiều thịt hơn nhưng
        kéo theo cả xương dăm và mảnh da. Thìa chỉ cạo được phần thịt mềm, đó
        chính là thứ mình cần.
  - title: Quết — mười lăm phút quyết định
    icon: pot
    minutes: 20 phút
    intro: "Không có đường tắt nào cho bước này:"
    bullets:
      - label: "Cho muối trước:"
        text: >-
          Cho thịt cá vào cối hoặc tô sâu lòng, rắc [[1|muỗng cà phê]] muối.
          Muối phải vào **ngay từ đầu** — đây là thứ làm thịt cá kết mạng và
          dai.
      - label: "Quết:"
        text: >-
          Giã trong cối, hoặc túm cả nắm thịt nhấc lên rồi **đập mạnh xuống lòng
          tô**, lặp đi lặp lại. Làm **10–15 phút** liên tục.
      - label: "Nhận biết đủ:"
        text: >-
          Nhấc một nắm thịt lên: đạt là khi nó **dính lằng nhằng theo tay thành
          sợi** và không rơi rớt xuống. Màu cũng chuyển từ trắng đục sang trắng
          ngà bóng.
      - label: "Nêm và quết tiếp:"
        text: >-
          Trộn hành lá, hành tím, tỏi băm, tiêu, [[1|muỗng canh]] nước mắm,
          đường và [[1|muỗng canh]] bột năng. Quết thêm **3 phút** cho đều.
    timer:
      secs: 900
      label: Hẹn giờ quết cá · 15:00
      doneMsg: Nhấc thử một nắm — dính theo tay thành sợi là đạt rồi!
    callout:
      type: warn
      text: >-
        Máy xay **không thay được việc quết**. Lưỡi dao cắt đứt thớ thịt thay vì
        đập cho nó kết lại, nên xay xong ra một khối mịn mà bở, chiên lên là rã.
        Nếu buộc phải dùng máy thì chọn chế độ nhồi bột, và vẫn phải quết tay
        thêm vài phút ở cuối.
  - title: Ướp lạnh rồi vo miếng
    icon: clock
    minutes: 35 phút
    bullets:
      - label: "Ướp lạnh:"
        text: >-
          Bọc kín tô, cho vào ngăn mát **30 phút**. Khối chả se lại, vo miếng
          dễ hơn nhiều và chiên ít rã.
      - label: "Vo miếng:"
        text: >-
          Nhúng tay vào bát nước lạnh, véo từng nắm cỡ quả trứng gà, vo tròn rồi
          **ấn dẹt xuống dày chừng 1 cm**. Nhúng tay lại sau mỗi vài miếng.
      - label: "Miết mép:"
        text: >-
          Miết mép cho tròn và láng — mép nứt thì lúc chiên dầu chui vào và
          miếng chả nứt toác.
    callout:
      type: tip
      text: >-
        Miếng dày quá thì vỏ ngoài vàng sậm mà lõi chưa chín; mỏng quá thì khô
        và mất độ dai. **Một phân** là chỗ cân nhất — dày bằng đốt ngón tay út.
  - title: Chiên vàng rám
    icon: flame
    minutes: 15 phút
    bullets:
      - label: "Đun dầu:"
        text: >-
          Đổ dầu ngập chừng 2 cm, đun tới **lửa vừa**. Thả một mẩu chả nhỏ vào
          thử: nổi lên và sủi tăm đều quanh mép là được.
      - label: "Chiên:"
        text: >-
          Thả từng miếng vào, **đừng xếp chật chảo**. Chiên mỗi mặt
          **3–4 phút** tới khi vàng rám.
      - label: "Đừng lật sớm:"
        text: >-
          Để yên cho mặt dưới se lại và vàng rồi mới lật. Lật sớm là miếng chả
          còn mềm và dễ vỡ.
      - label: "Vớt ráo:"
        text: >-
          Vớt ra để lên vỉ hoặc giấy thấm. Đặt lên đĩa phẳng ngay thì hơi nước
          đọng dưới đáy làm mặt chả mềm lại.
    callout:
      type: warn
      text: >-
        Dầu quá nóng thì vỏ ngoài sậm màu trong một phút mà lõi vẫn sống; dầu
        chưa đủ nóng thì miếng chả **hút dầu và bở**. Lửa vừa, chiên chậm, và
        thử dầu bằng một mẩu nhỏ trước khi thả cả mẻ.
  - title: Pha nước mắm me
    icon: bottle
    minutes: 10 phút
    bullets:
      - text: >-
          Dầm [[2|muỗng canh]] me vắt với [[100|ml]] nước ấm, lọc bỏ hạt và xơ.
      - text: >-
          Nấu nước me với [[2|muỗng canh]] đường và [[2|muỗng canh]] nước mắm
          trên lửa nhỏ cho sánh lại, chừng 3 phút.
      - text: Tắt bếp, để nguội bớt rồi cho tỏi ớt băm vào. Nếm và chỉnh chua ngọt.
    doneText: Xong — dọn nóng với rau răm và dưa leo!

tipsTitle: 4 chỗ **quyết định** đĩa chả cá thát lát
tips:
  - icon: alert
    title: Muối vào trước, quết đủ mười lăm phút
    text: >-
      Hai việc này đi liền nhau và là toàn bộ bí quyết của món. Muối cho vào
      **ngay từ đầu** làm chất đạm trong thịt cá kết thành mạng; quết là thứ
      đánh cho mạng ấy hình thành. Thiếu một trong hai thì miếng chả bở, chiên
      lên rã ra trong chảo. Kiểm bằng cách nhấc nắm thịt lên xem có **dính theo
      tay thành sợi** không.
  - icon: bulb
    title: Máy xay không làm thay được
    text: >-
      Lưỡi dao xay **cắt đứt** thớ thịt, trong khi quết là **đập cho thớ kết
      lại** — hai việc ngược nhau. Xay xong ra khối mịn nhìn rất đẹp mà chiên
      lên bở như thịt viên công nghiệp. Nếu ngại mỏi tay thì chia nhỏ ra quết
      làm ba đợt, vẫn hơn dùng máy.
  - icon: clock
    title: Ướp lạnh trước khi vo miếng
    text: >-
      Ba mươi phút trong ngăn mát làm khối chả se lại và giữ dáng. Vo miếng lúc
      chả còn ấm thì nó nhão, dính tay, miếng nào cũng méo và dễ rã khi thả vào
      chảo. Đây là bước tốn không công gì mà đổi được cả mẻ.
  - icon: flame
    title: Lửa vừa và đừng lật sớm
    text: >-
      Chiên chả cá là chiên chậm. Lửa vừa để lõi kịp chín trong lúc vỏ vàng dần;
      và để yên **ít nhất ba phút** cho mặt dưới se lại rồi mới lật. Lật đi lật
      lại vài lần cho "mau chín" là cách chắc chắn nhất để miếng chả vỡ nát.

serve:
  title: Dọn nóng, **chấm nước mắm me hoặc tương ớt**
  paras:
    - >-
      Chả cá thát lát ăn nóng ngay sau khi chiên là ngon nhất — lúc đó lớp vỏ
      còn giòn sựt còn ruột thì dai và nóng. Xếp ra đĩa cùng ít rau răm và mấy
      lát dưa leo, đặt chén nước mắm me bên cạnh.
    - >-
      Đây là món đứng được ở nhiều chỗ trong bữa. Dọn với cơm trắng thì thành
      món mặn đưa cơm; để nguyên đĩa giữa bàn thì thành mồi nhậu; kẹp vào ổ bánh
      mì với ít đồ chua là bữa sáng gọn. Miền Tây còn hay xắt miếng thả vào tô
      bún cho có thêm chỗ dai.
  aside:
    title: Ba cách dọn
    intro: "Cùng một mẻ chả, ba kiểu bữa:"
    items:
      - icon: rice
        text: "**Ăn với cơm trắng** — chấm nước mắm me, thành món mặn đưa cơm."
      - icon: chili
        text: "**Để giữa bàn nhậu** — chấm tương ớt, ăn kèm rau răm và dưa leo."
      - icon: bread
        text: "**Kẹp bánh mì** — thêm đồ chua và chút tương ớt, bữa sáng gọn."

faq:
  - q: Mua chả cá thát lát quết sẵn thì có phải quết lại không?
    a: >-
      Nên quết lại **5 phút** dù hàng ghi là đã quết. Hàng đông lạnh sau khi rã
      đông thường bị chảy nước và mất bớt độ kết dính; quết lại vài phút với chút
      muối là nó dẻo trở lại. Sau đó nêm hành tiêu như thường. Miếng chả sẽ vẫn
      kém dai hơn cá tự nạo một chút, nhưng chênh không nhiều.
  - q: Chiên xong miếng chả bị rã ra trong chảo?
    a: >-
      Ba nguyên nhân, xếp theo mức hay gặp. Một là **quết chưa tới** — lỗi phổ
      biến nhất. Hai là **không ướp lạnh** trước khi vo miếng. Ba là dầu chưa đủ
      nóng nên miếng chả nằm lâu trong dầu ấm và ngấm dầu rồi bung ra. Lần sau
      kiểm cả ba, mà chú ý nhất vào cái thứ nhất.
  - q: Cá thát lát và cá thác lác có phải một loài không?
    a: >-
      "Thát lát" và "thác lác" đều thông dụng — tài liệu và thương hiệu đặc sản
      Hậu Giang ghi "thát lát", nhiều từ điển ghi "thác lác"; tên được cho là
      gốc tiếng Khmer. Site này dùng "thát lát" cho thống nhất.
  - q: Ngoài chiên thì chả cá thát lát làm được món gì?
    a: >-
      Ba hướng quen nhất. **Dồn khổ qua** — moi ruột trái khổ qua, nhồi chả vào
      rồi hầm, đây là món rất miền Tây. **Thả lẩu** — véo từng viên thả vào nồi
      đang sôi, chả nổi lên là chín. **Nấu canh** — vo viên nhỏ thả vào canh
      chua hoặc canh rau. Bản chiên trong bài này là bản để rõ nhất cái dai, nên
      cũng là bản để kiểm xem mình quết đã tới chưa.
  - q: Làm sẵn để tủ được bao lâu?
    a: >-
      Khối chả sống bọc kín để ngăn mát được **2 ngày**, ngăn đá được 1 tháng.
      Miếng đã chiên thì để ngăn mát 3 ngày, hâm lại bằng cách **rán lại trên
      chảo khô** hoặc cho vào nồi chiên không dầu 5 phút — vỏ giòn lại gần như
      mới. Đừng quay lò vi sóng, miếng chả sẽ dai nhách và ướt.

