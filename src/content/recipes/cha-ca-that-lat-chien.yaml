flavorNote: >-
  **Chuẩn miếng:** vỏ ngoài **vàng rám và giòn sựt**, ruột trắng ngà, bẻ đôi
  thấy **thớ dai kéo theo** chứ không vụn ra; cắn nghe dai và bật lại, ngọt vị
  cá rõ; thơm mùi tiêu và hành lá, không tanh.
storyEyebrow: Chuyện món ăn
storyTitle: Cả món nằm trong **mười lăm phút quết tay**
story:
  - >-
    Cá thát lát là loài cá nước ngọt dẹt như lưỡi dao, sống nhiều ở sông rạch
    miền Tây, và vùng Hậu Giang thì nổi tiếng nhất về nó. Thịt cá trắng, ngọt,
    nhưng có một đặc tính hiếm: **quết càng lâu thì càng dẻo và càng dai**, dai
    tới mức miếng chả bẻ ra còn kéo thớ.
  - >-
    Cũng vì thế mà cá này gần như luôn được làm thành chả chứ ít khi kho hay
    chiên nguyên con — nó nhiều xương dăm, mà phần thịt thì lại đúng là thứ để
    quết. Người ta nạo lấy thịt bằng thìa, xuôi từ đuôi lên đầu, chừa lại nguyên
    bộ da và xương.
  - >-
    Rồi tới **khâu quết** — thứ quyết định cả món. Bỏ thịt vào cối giã, hoặc cho
    vào tô rồi nhấc lên đập mạnh xuống, làm đi làm lại mười lăm phút. Thịt từ
    chỗ rời rạc chuyển dần sang dẻo quánh, cuối cùng thì **dính lằng nhằng theo
    tay thành sợi**. Tới đó là được. Đây là việc nặng tay, và cũng là lý do miếng
    chả hàng nhà làm bao giờ cũng dai hơn hàng công nghiệp.
  - >-
    Chả quết xong thì làm được nhiều thứ: vo viên chiên vàng ăn với cơm hoặc
    nhậu, dồn vào trái khổ qua đem hầm, hay thả vào nồi lẩu. Bản chiên là bản
    gọn nhất và cũng là bản để rõ nhất cái dai — không có nước dùng nào che đi
    được, quết chưa tới là biết ngay.

ingredientGroups:
  - name: Cá
    icon: fish
    items:
      - id: cattlcct
