title: Cơm cháy chà bông **giòn rụm, mỡ hành sóng sánh**
summary: >-
  Cơm nguội ép mỏng, **phơi cho thật khô** rồi thả vào chảo dầu nóng già — miếng
  cơm nở bung, giòn tan. Rưới mỡ hành, rắc chà bông, chan chút sốt mắm đường
  cay: món ăn vặt làm từ đúng thứ nhà nào cũng có dư.
region: Miền Nam
category: Cơm
occasions: [Ăn chơi, Cho bé]
pubDate: 2026-07-31
time:
  total: 1 giờ (+ phơi khô 4 giờ)
  active: 40 phút
servingsBase: 4
difficulty: Vừa
featured: false
order: 101
art: com-chay-cha-bong
heroEyebrow: Nồi cơm còn dư từ tối qua…

quick:
  ingredients:
    - Cơm nguội [[800|g]] — cơm hơi khô, để ngăn mát qua đêm là tốt nhất
    - Chà bông [[100|g]] — heo hoặc gà, loại sợi bông tơi
    - Hành lá [[1|nắm]] + dầu ăn [[4|muỗng canh|frac]] — làm mỡ hành
    - Dầu chiên [[500|ml]] — chiên ngập, dùng lại được
    - "Sốt: nước mắm [[2|muỗng canh|frac]] · đường [[2|muỗng canh|frac]] · ớt bột · tỏi"
  steps:
    - Ép cơm thành miếng mỏng **dưới 5 mm**, càng mỏng càng dễ giòn.
    - Sấy hoặc phơi tới khi miếng cơm **cứng như bìa**, bẻ nghe rắc.
    - Dầu nóng già (thả hạt cơm nổi liền) mới thả — chiên tới vàng nở.
    - Chưng mỡ hành, nấu sốt mắm đường cho hơi sánh.
    - Rưới sốt, rưới mỡ hành, rắc chà bông. Ăn liền lúc còn giòn.
  warning: >-
    Cơm chưa khô hẳn mà thả vào chảo là **bắn dầu tung toé** và miếng cơm không
    nở, ăn vừa dai vừa ngấm dầu. Bẻ thử một miếng: gãy giòn nghe "rắc" mới được
    chiên.

flavor:
  chua: 1
