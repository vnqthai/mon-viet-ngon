flavorNote: >-
  **Chuẩn miếng:** cắn nghe **giòn rụm** rồi vỡ vụn chứ không dai; mặt cơm vàng
  nhạt đều, không chỗ nâu chỗ trắng; sốt thấm mỏng ở mặt trên mà **đáy miếng vẫn
  khô ráo** — sốt nhiều quá thì miếng cơm ỉu trong năm phút.
storyEyebrow: Chuyện món ăn
storyTitle: Từ **lớp cháy đáy nồi** thành món ăn vặt bán cả thùng
story:
  - >-
    Cơm cháy vốn không phải món ai nấu ra cả — nó là **lớp cơm sém dưới đáy nồi
    gang**, thứ ngày xưa gạt ra để riêng. Vùng Ninh Bình lấy lớp cháy đó phơi
    khô rồi chiên phồng lên, ăn với **sốt tim cật** đậm và béo; đó là bản cổ,
    và tới giờ vẫn là đặc sản của vùng.
  - >-
    Vào tới Sài Gòn thì món đổi vai hẳn. Người ta thôi chờ đáy nồi mà **chủ động
    làm ra miếng cơm cháy** từ cơm nguội, ép mỏng cho đều, và thay chén sốt đậm
    bằng ba thứ nhẹ hơn: **mỡ hành, chà bông, chút sốt mắm đường cay**. Từ món
    ăn kèm bữa cơm, nó thành **món ăn vặt** — đóng bịch, để lâu, mang đi được.
  - >-
    Cái hay nằm ở chỗ nó giải quyết một chuyện có thật trong mọi bếp: nồi cơm
    hôm qua còn dư. Cơm nguội để tủ lạnh thì hạt se lại, **mất nước, rời ra** —
    đúng thứ tính chất cần để miếng cơm cháy nở giòn. Nấu cơm mới mà làm thì
    ngược lại, phải hong khô mất công hơn nhiều.
  - >-
    Trên site đã có **cơm chiên cá mặn** cũng là món cứu cơm nguội. Nhưng cơm
    chiên giữ hạt rời và ăn thay bữa; còn cơm cháy thì ép hạt **dính thành
    mảng** rồi làm cho giòn — cùng một nắm cơm nguội, hai đường đi ngược nhau.

