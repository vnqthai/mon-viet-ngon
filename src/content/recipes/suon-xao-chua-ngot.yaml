flavorNote: >-
  **Chuẩn vị:** chua thanh **chạy trước** rồi ngọt đuổi theo liền, mặn chỉ
  đứng nền — sốt sánh bóng **bám áo khúc sườn** chứ không loãng đọng đáy dĩa.
  Ớt chuông phải còn giòn, thơm còn dai chứ không nhũn.
storyEyebrow: Chuyện chảo sườn
storyTitle: Món xào **được lòng con nít nhất** mâm cơm

story:
  - >-
    Trong họ nhà sườn, đây là món **dễ dụ con nít** nhất. Sườn ram thì đậm
    đà kiểu người lớn, sườn nướng thì phải chờ than — còn sườn xào chua ngọt
    có cái màu đỏ cam bóng lưỡng, có miếng thơm ngọt lịm, có ớt chuông đỏ
    xanh vui mắt. Dọn lên bàn là đám nhỏ chỉ trỏ trước cả khi nếm.
  - >-
    Món này khác sườn ram ở chỗ căn bản: **sườn được chiên sơ trước**, nên
    rìa khúc giòn nhẹ và lớp sốt bám ngoài chứ không thấm sâu vô thớ thịt.
    Nhờ vậy cắn miếng sườn nghe **ba tầng** — giòn ở rìa, mềm ở trong, chua
    ngọt ở lớp áo. Đổi lại, phải chịu khó bắc thêm một chảo dầu.
  - >-
    Cái khó duy nhất nằm ở **chén sốt**. Chua nhiều một chút là gắt, đường
    nhiều một chút là thành món tráng miệng. Mẹo của mình: pha sốt ra chén
    riêng, **nếm thử bằng đầu đũa trước khi đổ vô chảo** — lúc đó còn sửa
    được, chứ đổ vô rồi thì chỉ còn cách chữa cháy.

