quick:
  ingredients:
    - Sườn non [[600|g]] — chặt khúc 3–4 cm, chần sơ rồi để thật ráo
    - Thơm (dứa) [[150|g]] · ớt chuông đỏ + xanh [[1|trái]] mỗi màu · hành tây [[1|củ]]
    - Tỏi [[4|tép]] + hành tím [[2|củ]] băm · hành lá [[2|nhánh]]
    - Bột bắp [[2|muỗng canh|frac]] — áo sườn trước khi chiên
    - "Sốt chua ngọt: giấm gạo [[3|muỗng canh|frac]] · đường [[3|muỗng canh|frac]] · tương cà [[2|muỗng canh|frac]] · nước mắm [[1.5|muỗng canh|frac]] · nước [[100|ml]]"
  steps:
    - Sườn chần sơ với gừng – hành đập, rửa lại, **để thật ráo** rồi ướp 20 phút.
    - Lăn sườn qua **bột bắp mỏng tang**, chiên lửa vừa tới **vàng rìa**, vớt ra.
    - Pha sẵn chén sốt chua ngọt, khuấy tan đường — **nếm trước khi đổ vô chảo**.
    - Phi tỏi hành, cho hành tây + thơm vào đảo nhanh, trút sườn vô.
    - Rưới sốt, đảo lửa lớn tới khi **sốt keo bám áo từng khúc**, thả ớt chuông vào chót.
    - Tắt bếp, rắc hành lá + tiêu. Ớt chuông còn giòn là đúng bài.
  warning: >-
    Sườn còn ướt mà thả vô chảo dầu là **văng bỏng tay và bột bong hết**.
    Chần xong phải để ráo hẳn, lấy giấy thấm khô mặt sườn rồi mới lăn bột.

