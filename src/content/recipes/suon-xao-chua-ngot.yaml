title: Sườn xào chua ngọt **chua dẫn trước, sốt bóng áo từng khúc**
summary: >-
  Khúc sườn chiên vàng giòn rìa, áo lớp sốt **đỏ cam bóng lưỡng** chua thanh
  ngọt dịu, xen miếng thơm vàng với ớt chuông đỏ xanh còn giòn sựt. Món xào
  bắt mắt nhất mâm cơm nhà, dọn ra là chén cơm nào cũng vơi nhanh.
region: Cả nước
category: Xào
occasions: [Cơm nhà, Cho bé, Đãi khách]
