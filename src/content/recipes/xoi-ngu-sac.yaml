title: Xôi ngũ sắc **năm màu xếp thành bông hoa năm cánh**
summary: >-
  Một mẻ nếp chia làm năm, mỗi phần ngâm một thứ nước lá rồi hấp riêng: trắng,
  xanh lá dứa, vàng nghệ, đỏ gấc, tím lá cẩm. Xới ra bày sát nhau thành **bông
  hoa năm cánh**, cánh nào cũng đủ dẻo và thơm mùi riêng của thứ nhuộm nó.
region: Tây Bắc
category: Xôi
occasions: [Cỗ Tết, Đãi khách]
pubDate: 2026-08-01
