heroEyebrow: Mâm xôi ngày hội trên bản, đủ năm màu…

quick:
  ingredients:
    - Nếp nương hoặc nếp cái hoa vàng [[800|g]] — chia **năm phần bằng nhau**
    - Lá cẩm tím [[1|bó]] — đun lấy nước tím
    - Lá dứa [[1|bó]] — xay lọc lấy nước xanh
    - Nghệ tươi [[1|củ]] — giã vắt lấy nước vàng
    - Thịt gấc [[3|muỗng canh]] — bóp rượu trắng, lấy màu đỏ
    - Muối [[1|muỗng cà phê]] · dầu ăn hoặc mỡ gà [[2|muỗng canh]]
  steps:
    - Nấu nước lá cẩm, xay lọc lá dứa, vắt nghệ, bóp gấc — được bốn thứ nước màu.
    - >-
      Chia nếp năm phần. Bốn phần ngâm bốn thứ nước màu **8 giờ**, phần còn lại
      ngâm nước lã.
    - Vo lại từng phần, để **ráo 20 phút**, xóc muối.
    - >-
      Hấp từng màu riêng **30–35 phút**, hoặc chung một xửng nhưng ngăn bằng lá
      chuối.
    - Xới ra mâm, xếp năm phần sát nhau thành bông hoa năm cánh.
  warning: >-
    Hấp chung mà **không ngăn** thì màu tím và màu đỏ loang sang phần trắng, cả
    mâm ra một thứ hồng lem nhem. Ngăn bằng dải lá chuối dựng đứng, hoặc chịu
    khó hấp từng mẻ.

