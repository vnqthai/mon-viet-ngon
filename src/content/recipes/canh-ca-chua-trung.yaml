flavorNote: >-
  **Chuẩn tô canh:** nước canh **đỏ cam trong**, chua dịu ngọt nhẹ; **vân
  trứng nổi thành dải mềm trôi lơ lửng** chứ không tan thành nước đục hay đóng
  thành mảng cứng. Miếng cà chua còn giữ được hình múi để gắp.
storyEyebrow: Chuyện tô canh
storyTitle: Tô canh **cứu bữa của mọi nhà**
story:
  - >-
    Có lẽ không có tô canh nào được nấu nhiều bằng tô này. Vài trái cà chua với
    mấy quả trứng — hai thứ mà bếp nào cũng sẵn — cộng lại thành một tô canh
    nóng trong đúng mười phút. Ngày nào đi làm về muộn, mở tủ lạnh thấy trống
    trơn, thì đây là câu trả lời.
  - >-
    Nhưng đơn giản không có nghĩa là không có nghề. Cùng hai nguyên liệu đó,
    có tô canh nước đục lờ với mấy vụn trứng chìm nghỉm, có tô canh **nước đỏ
    trong với những dải vân trứng mềm trôi lơ lửng như mây**. Khác biệt nằm ở
    đúng ba việc: xào cà chua cho ra màu, hạ lửa trước khi rót trứng, và chờ
    mười lăm giây.
  - >-
    Tô canh này cũng là món dễ thương với con nít: ngọt dịu, không cay, miếng
    cà chua mềm và trứng thì đứa nào cũng thích. Nhà có bé thì nêm nhạt tay
    hơn một chút và dằm nát miếng cà chua ra là bé húp hết chén.

