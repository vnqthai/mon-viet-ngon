art: canh-ca-chua-trung
heroEyebrow: Mười phút, hai nguyên liệu, một tô canh…

quick:
  ingredients:
    - Cà chua [[4|trái]] — chọn trái chín đỏ đều, mềm tay
    - Trứng gà [[3|quả]] — đánh **vừa tan**, thêm chút tiêu
    - Hành tím [[2|củ]] · hành lá [[2|cọng]] · ngò rí
    - "Nêm: nước mắm [[1|muỗng canh]] · đường [[1|muỗng cà phê]] · muối"
    - Nước [[1.2|lít]]
  steps:
    - >-
      Cà chua rửa sạch: **một nửa bổ múi cau, một nửa băm nhuyễn** — nửa băm
      để ra màu, nửa múi để có miếng gắp.
    - Phi thơm hành tím, cho phần **cà chua băm vào xào tới khi nát ra và ngả đỏ sậm**, chừng 3 phút.
    - Cho phần múi cau vào đảo 1 phút, rồi chan [[1.2|lít]] nước sôi.
    - Nêm nước mắm, đường, muối cho vừa. Đun sôi rồi **hạ xuống sôi lăn tăn**.
    - Đánh trứng vừa tan với chút tiêu — **đừng đánh bông**.
    - Rót trứng thành **dòng mỏng theo vòng tròn**, rồi **để yên 15 giây** cho trứng se.
    - Khuấy **nhẹ một chiều** đúng vài vòng, rắc hành ngò, tắt bếp.
  warning: >-
    Rót trứng vào nồi đang sôi bùng, hoặc khuấy ngay khi vừa rót, là trứng tan
    hết vào nước — tô canh đục lờ mà không có vân nào. **Sôi lăn tăn, rót
    mỏng, chờ 15 giây, rồi mới khuấy một chiều.**

flavor:
