title: Canh cà chua trứng **vân trứng nổi như mây**
summary: >-
  Cà chua xào cho ra màu đỏ au, chan nước sôi rồi **rót trứng thành dòng mỏng**
  và chờ mười lăm giây mới khuấy — tô canh ngọt dịu có những dải vân trứng mềm
  trôi lơ lửng, mười phút là xong.
region: Cả nước
category: Canh
occasions: [Cơm nhà, Cho bé]
pubDate: 2026-07-31
time:
  total: 15 phút
  active: 12 phút
servingsBase: 4
difficulty: Dễ
featured: false
