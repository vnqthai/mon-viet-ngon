heroEyebrow: Tiếng da nổ rôm rốp dưới dao…

quick:
  ingredients:
    - >-
      Thịt ba chỉ nguyên miếng [[1000|g]] — chọn miếng **vuông vức, da dày, ba
      tầng mỡ nạc rõ**
    - >-
      Ướp mặt thịt: ngũ vị hương [[2|muỗng cà phê]] · muối [[1.5|muỗng cà phê|frac]]
      · đường [[1|muỗng cà phê]] · tỏi băm [[4|tép]] · tiêu · chao đỏ
      [[1|viên]] (có thì càng thơm)
    - "Xử lý da: giấm [[2|muỗng canh]] · muối hột [[500|g]] để phủ da lúc nướng"
  steps:
    - >-
      Chần miếng thịt trong nước sôi **5 phút** cho da căng, vớt ra thấm thật
      khô.
    - >-
      **Xăm da thật dày** bằng nĩa hoặc kim, chỉ xăm thủng lớp da, đừng đâm
      xuống tới nạc.
    - >-
      Ướp gia vị **chỉ ở mặt thịt và bốn cạnh**, tuyệt đối không dây lên da;
      quét giấm lên da.
    - >-
      Để ngăn mát **không đậy, qua đêm 8–24 giờ** cho mặt da khô kiệt như tờ
      giấy.
    - >-
      Bọc giấy bạc quanh phần thịt, **phủ lớp muối hột dày kín mặt da**, nướng
      **190°C trong 50 phút**.
    - >-
      Gỡ bỏ hết lớp muối, quét chút giấm, nướng tiếp **230°C trong 15–20 phút**
      cho **da nổ rộp đều**.
    - Để nghỉ 10 phút rồi chặt miếng vuông cỡ hai đốt tay.
  warning: >-
    Gia vị ướp mà dây lên mặt da là chỗ đó **cháy đen và không nổ**. Ướp xong
    lấy khăn giấy lau lại mặt da một lượt cho chắc.

flavor:
  chua: 0.5
  ngot: 3
  man: 6
  cay: 1
  thom: 8.5
flavorNote: >-
  **Chuẩn vị:** dao chặt xuống nghe **rôm rốp như chặt bánh đa**, mặt da rỗ đều
  li ti chứ không phồng vài chỗ; cắn vào giòn tan rồi tới lớp mỡ trong và thớ
  nạc còn mọng. Da dai như da luộc là hong chưa đủ khô.

storyEyebrow: Chuyện miếng thịt
storyTitle: Miếng heo quay **của mâm giỗ**, giờ nướng bằng lò nhà
story:
  - >-
    Ở miền Nam, heo quay là món của **dịp trọng**: mâm cúng giỗ, đám hỏi, khai
    trương, rằm lớn. Nhà nào cũng ra lò quay đặt trước một miếng, về chặt ra
    xếp dĩa, ăn kèm bánh hỏi hoặc cuốn bánh tráng. Kiểu quay này đi vào Nam
    theo người Hoa vùng Quảng Đông, nên mới có bộ gia vị **ngũ vị hương và
    chao** đặc trưng của nó.
  - >-
    Cái làm người ta ngại tự làm là chữ "quay" — nghe như phải có lò quay treo
    móc, quạt gió, than hồng. Thật ra lò quay chỉ giải quyết đúng một chuyện:
    **hơi nóng khô bao quanh mặt da**. Lò nướng nhà và nồi chiên không dầu làm
    được y hệt, thậm chí dễ canh hơn vì chỉnh được nhiệt.
  - >-
    Nguyên lý thì gọn: lớp da heo có nước, có mỡ, có đạm. Muốn nó **nổ rộp**
    thì mặt ngoài phải khô kiệt trước đã, rồi gặp nhiệt cao đột ngột, chỗ nước
    còn sót bên trong hóa hơi và đẩy lớp da phồng lên thành hàng ngàn bọt li
    ti. Nên toàn bộ công đoạn dài dòng phía trước — chần, xăm, quét giấm, hong
    tủ lạnh, phủ muối hột — đều phục vụ đúng một mục tiêu: **làm khô mặt da**.

