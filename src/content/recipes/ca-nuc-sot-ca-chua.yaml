heroEyebrow: Nồi cá liu riu trên bếp cả buổi sáng…

quick:
  ingredients:
    - >-
      Cá nục [[600|g]] — chọn con cỡ ba ngón tay, mắt trong, mang đỏ tươi, thân
      cứng
    - Cà chua [[5|trái]] chín · hành tím [[4|củ]] · tỏi [[3|tép]] · ớt [[2|trái]]
    - >-
      Nêm: nước mắm [[2.5|muỗng canh|frac]] · đường [[1.5|muỗng cà phê|frac]] ·
      tiêu · dầu điều [[1|muỗng canh]] · [[200|ml]] nước
    - Hành lá, ngò rí · muối hột và chanh để rửa cá
  steps:
    - >-
      Làm sạch cá: đánh vảy, mổ bụng, **cạo hết lớp màng đen trong bụng** — đó
      là chỗ tanh nhất, không phải mình cá.
    - >-
      Bóp cá với muối hột và chanh, rửa lại nhiều nước, **khứa 2–3 đường chéo**
      hai bên thân, ướp muối tiêu [[15|phút]].
    - >-
      Chiên sơ hai mặt cho vàng se (mỗi mặt 2–3 phút), vớt ra — chiên xong con
      cá mới đứng được cả buổi rim.
    - >-
      Phi hành tỏi với dầu điều, cho **3/4 cà chua** vào xào dằm nhuyễn thành
      sốt, nêm mắm đường tiêu, châm [[200|ml]] nước.
    - >-
      Xếp cá vào, **rim lửa nhỏ nhất 35–40 phút**, đậy hé nắp; hết nước thì
      châm thêm chút nước sôi.
    - >-
      Thả nốt **1/4 cà chua** và ớt, nấu thêm 3 phút, rắc hành lá ngò rí rồi
      tắt bếp.
  warning: >-
    Bỏ sót **lớp màng đen trong bụng cá** là cả nồi tanh, mà nêm kiểu gì cũng
    không chữa được. Cạo cho bằng sạch tới khi bụng cá trắng hồng.

