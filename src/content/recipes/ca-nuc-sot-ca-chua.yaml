title: Cá nục sốt cà **rim tới rục xương, ăn với cơm hay bánh mì đều được**
summary: >-
  Hộp cá sốt cà tuổi thơ, làm bằng nồi nhà: cá nục để nguyên con, chiên sơ rồi
  rim liu riu trong sốt cà chua tới khi **xương mềm rục, ăn được cả con**. Rẻ,
  dễ, và là món hiếm hoi vừa chan cơm vừa quệt bánh mì đều hợp.
region: Miền Trung
category: Kho
occasions: [Cơm nhà, Bữa sáng]
pubDate: 2026-07-31
