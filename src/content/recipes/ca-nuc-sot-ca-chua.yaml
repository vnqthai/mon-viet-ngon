flavorNote: >-
  **Chuẩn vị:** con cá còn nguyên hình mà **xương sống bấm nhẹ là mềm**, sốt
  cà đỏ au sánh bám kín thân cá, mặn ngọt đậm hơn cá thu một bậc vì cá nục vốn
  chắc thịt. Chan lên cơm nóng là thấy đủ.

storyEyebrow: Chuyện nồi cá
storyTitle: Hộp cá sốt cà **làm bằng nồi nhà**
story:
  - >-
    Ai lớn lên ở Việt Nam cũng nhớ cái hộp cá sốt cà — thứ mở ra là có ngay bữa
    cơm, quệt bánh mì cũng được. Cái hộp đó gần như luôn đựng **cá nục hoặc cá
    trích**, hai loại cá biển nhỏ, rẻ, mà thịt lại chắc và đậm. Nồi cá nục sốt
    cà rim ở nhà chính là bản gốc của nó, chỉ khác là thơm hơn nhiều và tự nêm
    được theo miệng mình.
  - >-
    Miền Trung biển gần, cá nục theo thuyền về chợ từ sớm và rẻ quanh năm, nên
    đây là món cơm nhà thường ngày chứ không phải món của dịp nào. Cá nục có
    hai kiểu nấu quen thuộc: **hấp cuốn bánh tráng** cho ngày muốn ăn thanh, và
    **rim sốt cà** cho ngày muốn có món mặn để dành ăn hai bữa.
  - >-
    Chỗ khác biệt so với cá thu sốt cà nằm ở **thời gian**. Cá thu cắt khúc dày,
    rim mươi phút là xong. Cá nục để nguyên con, xương nhỏ mà nhiều, nên phải
    **rim liu riu ba bốn mươi phút** cho xương mềm rục — tới lúc đó thì gắp cả
    con lên ăn không phải dò xương, và đó cũng là lúc thịt cá thấm sốt tới tận
    trong.

