stepsEyebrow: Vô bếp thôi!
stepsTitle: 4 bước ra **nồi chè đậu xanh bột báng**
stepsLead: >-
  Món chè dễ nhất trong nhóm. Chỉ cần nhớ hai chữ "riêng" và "sau": bột báng
  luộc riêng, đường nêm sau.
steps:
  - title: Nấu đậu xanh — mềm trước, ngọt sau
    icon: pot
    minutes: 25 phút
    bullets:
      - text: >-
          Đậu ngâm 3 tiếng, đãi lại cho sạch, nấu với [[900|ml]] nước và lá dứa
          buộc gút.
      - text: >-
          Sôi thì **hạ lửa liu riu và hớt bọt** trong 5 phút đầu — hớt sạch thì
          nước chè trong, để bọt tan lại là nước đục và có mùi hăng.
      - text: >-
          Nấu chừng **20 phút**, thử một hạt: **bấm giữa hai ngón thấy nát,
          nhưng nhìn hạt vẫn còn tròn** là đúng độ. Hạn chế khuấy — mỗi lần
          khuấy là thêm mấy hạt vỡ.
    callout:
      type: warn
      text: >-
        Tuyệt đối **chưa cho đường vào lúc này**. Đường làm vỏ hạt săn lại,
        nấu thêm bao lâu cũng không bở nữa. Đây là lỗi phổ biến nhất của mọi
        nồi chè hạt.
    timer:
      secs: 1200
      label: Hẹn giờ nấu đậu · 20:00
      doneMsg: Bấm thử một hạt — nát mà còn tròn là tới lúc nêm đường!
  - title: Luộc bột báng ở nồi riêng
    icon: rice
    minutes: 15 phút
    bullets:
      - text: >-
          Ngâm bột báng trong nước lạnh **20 phút** cho hạt nở mềm mặt ngoài.
      - text: >-
          Đun một nồi nước sôi khác, thả bột báng vào, **khuấy nhẹ liên tục
          phút đầu** cho khỏi dính đáy. Luộc tới khi hạt **trong hết lõi
          trắng** — chừng 10 phút với hạt nhỏ.
      - text: >-
          Vớt ra **xả ngay nước lạnh** cho hạt săn và rời nhau, để ráo chờ dùng.
    callout:
      type: warn
      text: >-
        Thả bột báng sống thẳng vào nồi chè là hỏng: hạt nhả tinh bột làm cả
        nồi **đục ngầu và nhớt như hồ**. Luộc riêng — xả lạnh — mới cho vào,
        không có cách nào khác.
  - title: Nêm & rót nước cốt dừa
    icon: drop
    minutes: 8 phút
    bullets:
      - text: >-
          Vớt lá dứa. Nêm [[160|g]] đường + nửa chỗ muối, khuấy tan, **nếm
          lại** — phải thấy ngọt có hậu đậm chứ không ngọt trơn.
      - text: >-
          Thả bột báng đã luộc vào, đảo nhẹ.
      - text: >-
          Khuấy [[1|muỗng canh]] bột năng với chút nước nguội, trộn vào
          [[300|ml]] cốt dừa cùng nửa chỗ muối còn lại, rồi rót cả vào nồi chè.
      - text: >-
          Đun tới khi thấy **lăn tăn ở mép nồi là tắt bếp ngay**. Nước cốt dừa
          sôi bùng sẽ tách dầu, nổi váng vàng trên mặt.
  - title: Múc ly — nóng hay lạnh tùy bữa
    icon: bowl
    minutes: 2 phút
    bullets:
      - text: >-
          **Ăn nóng:** múc chén, rắc đậu phộng rang giã thô lên mặt, ăn liền
          lúc còn bốc khói.
      - text: >-
          **Ăn lạnh:** để nồi nguội hẳn rồi cho ngăn mát vài tiếng. Múc ly,
          thêm đá viên, rắc đậu phộng.
      - text: >-
          Ly lạnh thì nêm **nhỉnh ngọt hơn một chút** ngay từ trong nồi — đá
          tan ra sẽ kéo vị nhạt xuống.
    doneText: Múc muỗng có cả đậu lẫn bột báng — xong!

tipsTitle: 5 bí quyết cho **nồi chè trong, hạt còn nguyên**
tipsLead: >-
  Nồi chè này hỏng thì chỉ hỏng theo đúng vài kiểu, và kiểu nào cũng chữa được
  bằng một câu ngắn.
tips:
  - icon: jar
    title: Mềm trước, ngọt sau — luật của mọi nồi chè hạt
    text: >-
      Đường rút nước ra khỏi hạt đậu đang nấu, làm vỏ hạt săn chai lại. Cứ nấu
      cho hạt mềm hẳn **rồi mới nêm đường**, không riêng gì đậu xanh — đậu đỏ,
      đậu đen, hạt sen đều cùng một luật.
  - icon: rice
    title: Bột báng luộc riêng, xả lạnh
    text: >-
      Luộc riêng thì hạt **trong veo, rời nhau, dai nhẹ**; luộc chung thì cả
      nồi nhớt. Xả nước lạnh ngay sau khi vớt là để hạt săn lại — không xả thì
      chúng dính thành cục.
  - icon: drop
    title: Muối chia đôi
    text: >-
      Nửa nhúm muối vào nồi chè để vị ngọt có chỗ tựa, nửa còn lại vào nước cốt
      dừa để cái béo nổi lên. Chia đôi vậy ăn rõ hơn hẳn so với dồn hết vào một
      chỗ.
  - icon: spoon
    title: Khuấy càng ít càng đẹp
    text: >-
      Mỗi vòng khuấy là thêm mấy hạt đậu vỡ ra, nước chè đục dần. Muốn đảo thì
      **lắc nhẹ nồi** hoặc lùa muỗng dọc theo thành, đừng khuấy vòng giữa nồi.
  - icon: clock
    title: Nấu tối, ăn trưa hôm sau
    text: >-
      Chè này để qua đêm trong ngăn mát **ngon hơn lúc mới nấu** — hạt đậu ngấm
      hết vị ngọt béo. Chỉ cần nhớ nấu nước hơi loãng hơn ý muốn một chút, vì
      để lạnh là nồi sẽ đặc lại.

serve:
  title: Ly chè đậu xanh — **nóng buổi tối, lạnh buổi trưa**
  paras:
    - >-
      Đây là món chè "hai mùa" đúng nghĩa. Trời mát thì múc chén nóng, húp
      từng muỗng có cả hạt đậu bở lẫn hạt bột báng dai. Trời nóng thì cho ly,
      thêm nắm đá, đậu phộng rắc lên trên — mát miệng ngay.
    - >-
      Nhà có con nít thì đây là món chè an toàn nhất để bắt đầu: không cay,
      không chua, hạt mềm dễ nuốt. Chỉ cần **giã thật mịn hoặc bỏ hẳn đậu
      phộng** với bé nhỏ, và nấu bột báng thật trong cho dễ ăn.
  aside:
    title: Dọn kèm gì cho đủ
    intro: "Ba thứ để cạnh nồi chè:"
    items:
      - icon: pod
        text: "**Đậu phộng rang giã thô** — cái giòn duy nhất trong ly."
      - icon: drop
        text: "**Chén cốt dừa đặc** — ai thích béo thì chan thêm."
      - icon: flower
        text: "**Dừa nạo sợi** — thêm hương và cái sựt nhẹ."

faq:
  - q: Hạt đậu nấu mãi không mềm, nấu cả tiếng vẫn sượng?
    a: >-
      Hai nghi phạm. Một là **nêm đường quá sớm** — hạt chai rồi thì hết cứu,
      lần sau nhớ nêm sau. Hai là **đậu cũ**: hạt để lâu nấu bao lâu cũng
      sượng. Chọn đậu hạt vàng tươi, đều màu, không có hạt lấm tấm đen.
  - q: Nồi chè đục ngầu và nhớt?
    a: >-
      Chắc chắn do luộc bột báng thẳng trong nồi chè. Cứu tạm bằng cách
      **chắt phần nước đục ra, thêm nước sôi và nêm lại**, nhưng lần sau thì
      luộc riêng nồi khác. Khuấy nhiều làm đậu vỡ cũng góp phần làm đục.
  - q: Không có bột báng thì thay bằng gì?
    a: >-
      Thay bằng **bột khoai** (loại sợi khô ngâm nở) hoặc **trân châu nhỏ**,
      cách xử lý y hệt: ngâm nở, luộc riêng, xả lạnh. Bỏ hẳn cũng được, nhưng
      ly chè sẽ chỉ còn một kết cấu, ăn mau chán.
  - q: Chè để lạnh bị đặc quánh lại?
    a: >-
      Bột năng nguội thì đặc, chuyện bình thường. Thêm chút nước lọc hoặc nước
      dão dừa, khuấy đều là về độ cũ. Muốn khỏi phiền thì lần sau **giảm bột
      năng còn nửa muỗng** nếu biết trước là sẽ ăn lạnh.
  - q: Nấu bằng nồi áp suất được không?
    a: >-
      Được và nhanh hơn nhiều — nhưng canh chừng, đậu xanh rất mau nát. Nấu
      **5 phút kể từ lúc lên áp** rồi xả áp ngay, mở ra thử hạt. Bột báng và
      nước cốt dừa thì vẫn phải làm riêng ở ngoài như thường.
  - q: Ăn với đá thì có bị nhạt không?
    a: >-
      Có, nên phải tính trước: nếu biết sẽ ăn lạnh thì **nêm nồi ngọt và mặn
      nhỉnh hơn** một chút, đá tan sẽ kéo về vừa. Hoặc làm sẵn đá bằng chính
      nước cốt dừa pha loãng — cách này ly chè càng ăn càng béo chứ không nhạt.

