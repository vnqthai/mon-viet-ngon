title: Chè đậu xanh bột báng **hạt trong, nước cốt dừa béo**
summary: >-
  Đậu xanh nấu bở mà **còn nguyên hạt**, thả cùng bột báng luộc trong veo trong
  nồi nước lá dứa, rót nước cốt dừa vào sau cùng — ly chè Nam Bộ ăn nóng cũng
  được, thêm đá cũng được.
region: Miền Nam
category: Chè
occasions: [Ăn chơi, Cho bé]
pubDate: 2026-07-31
time:
  total: 50 phút
  active: 25 phút
servingsBase: 4
difficulty: Dễ
featured: false
order: 86
art: che-dau-xanh-bot-bang
heroEyebrow: Cùng nắm đậu xanh, người Nam nấu khác…

quick:
  ingredients:
    - Đậu xanh cà vỏ [[200|g]] — ngâm 3 tiếng
    - Bột báng [[70|g]] — ngâm nước lạnh 20 phút, **luộc riêng**
    - Đường [[160|g]] · muối [[0.5|muỗng cà phê|frac]] · lá dứa [[3|lá]]
    - Nước cốt dừa [[300|ml]] + bột năng [[1|muỗng canh]]
    - Đậu phộng rang giã thô · đá viên (nếu ăn lạnh)
  steps:
    - Đậu ngâm nở, nấu với [[900|ml]] nước + lá dứa buộc gút, lửa vừa, **hớt bọt** trong 5 phút đầu.
    - Nấu tới khi hạt **bấm là nát nhưng nhìn vẫn tròn** — chừng 20 phút, đừng khuấy nhiều.
    - Bột báng ngâm nở đem **luộc riêng nồi khác** tới khi trong hết lõi trắng, xả nước lạnh.
    - Nêm đường + muối vào nồi đậu, nếm cho **ngọt có hậu mặn nhẹ**.
    - Cho bột báng vào, rót nước cốt dừa đã khuấy bột năng, **sôi lăn tăn là tắt**.
    - Múc ly, rắc đậu phộng. Ăn nóng, hoặc để nguội rồi thêm đá.
  warning: >-
    Nêm đường **quá sớm, lúc hạt đậu chưa mềm**, là hạt sẽ chai lại — nấu thêm
    nửa tiếng cũng không bở nữa. Nguyên tắc chung cho mọi nồi chè hạt: mềm
    trước, ngọt sau.

flavor:
  chua: 0
  ngot: 7.5
