flavorNote: >-
  **Chuẩn ly chè:** hạt đậu **bở tơi trong miệng mà nhìn vẫn còn nguyên hình**,
  hạt bột báng trong veo dai nhẹ, nước chè hơi sánh chứ không loãng như nước
  lã. Vị béo của cốt dừa phải **có hậu mặn** thì mới ngọt mà không ngán.
storyEyebrow: Chuyện ly chè
storyTitle: Cùng nắm đậu xanh, **hai miền nấu ra hai món**
story:
  - >-
    Người Bắc lấy đậu xanh đồ chín rồi đánh cho tan hết hạt thành một khối vàng
    mịn. Người Nam thì để nguyên hạt, nấu thành nồi chè có nước, thả thêm bột
    báng cho có cái dai, rồi rót nước cốt dừa vào. Cùng một nguyên liệu rẻ tiền
    mà ra hai món khác nhau tới mức đặt cạnh nhau khó tin là họ hàng.
  - >-
    Bản Nam Bộ dễ nấu hơn hẳn — không phải mỏi tay đánh, chỉ cần canh đúng hai
    chuyện: **đừng nêm đường sớm** và **luộc bột báng ở nồi riêng**. Hai lỗi
    này là nguyên nhân của gần hết mấy nồi chè hỏng: một cái làm đậu chai
    cứng, cái kia làm cả nồi đục ngầu và nhớt.
  - >-
    Ly chè này linh hoạt tới mức thành món chè quốc dân của mấy xe chè lề
    đường: buổi tối múc nóng, ban trưa thêm đá bào. Nhà có con nít thì càng
    tiện — ngọt dịu, mềm, hạt bột báng tròn tròn dai dai, đứa nào cũng thích.

