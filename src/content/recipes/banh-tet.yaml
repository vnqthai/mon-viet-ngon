title: Bánh tét **đòn tròn gói lá chuối, cắt ra từng khoanh**
summary: >-
  Nếp cuộn quanh cột đậu xanh có miếng ba chỉ nằm giữa, gói lá chuối thành đòn
  tròn dài rồi luộc suốt đêm. Cắt ngang thành **khoanh tròn dày cỡ đốt tay** —
  mỗi khoanh là một vòng nếp trắng ôm vòng đậu vàng, chấm thịt hồng ở tâm.
