quick:
  ingredients:
    - Nếp [[1|kg]] — ngâm **8 giờ**, xóc muối, xào sơ với nước cốt dừa
    - Đậu xanh cà vỏ [[400|g]] — ngâm **4 giờ**, đồ chín, nắm thành cột dài
    - Thịt ba chỉ [[500|g]] — thái thanh dài, ướp muối tiêu hành **1 giờ**
    - Lá chuối [[10|tàu]] · dây lạt hoặc dây nylon [[15|sợi]]
    - Nước cốt dừa [[200|ml]] · muối [[2|muỗng canh]] · tiêu [[1|muỗng canh]]
  steps:
    - >-
      Ngâm nếp 8 giờ, đậu 4 giờ. Xào nếp với nước cốt dừa và muối cho ráo, để
      nguội.
    - Đồ đậu chín, tán mịn, nắm thành **cột dài** bọc quanh thanh thịt đã ướp.
    - >-
      Trải lá chuối, rải nếp thành hình chữ nhật, đặt cột nhân dọc giữa, **cuộn
      tròn** lại.
    - Gấp hai đầu, dựng đòn lên dằn cho chặt, buộc dây thành nhiều khoanh đều.
    - Luộc **6–8 giờ**, nước ngập đòn, châm nước sôi khi cạn. Vớt ra treo cho ráo.
  warning: >-
    Cuộn lỏng tay thì lúc luộc nếp nở ra làm **đòn bánh phình chỗ này tóp chỗ
    kia**, cắt khoanh ra méo và nhân lệch hẳn sang một bên. Cuộn xong phải dựng
    đòn xuống mặt bàn dằn vài lần cho nếp dồn đều rồi mới buộc.

