flavorNote: >-
  **Chuẩn khoanh:** cắt ra thấy **ba vòng đồng tâm rõ ràng** — nếp trắng ngoài,
  đậu vàng giữa, thịt ở tâm; vòng nếp dày đều quanh chu vi chứ không lệch; nếp
  dẻo quánh và **thoảng béo nước cốt dừa**; miếng thịt mềm rục, phần mỡ trong
  như thạch.
storyEyebrow: Chuyện món ăn
storyTitle: Đòn tròn thì **cắt tới đâu ăn tới đó**, đó là cả cái lý của nó
story:
  - >-
    Bánh tét miền Nam gói thành **đòn tròn dài** chừng hai gang tay, buộc dây
    thành nhiều khoanh đều nhau. Cắt ngang một nhát là ra một khoanh tròn, nhìn
    thấy đủ ba vòng: nếp trắng ở ngoài, đậu xanh vàng ở giữa, miếng thịt hồng
    nằm chính tâm.
  - >-
    Dáng đòn ấy không phải chuyện thẩm mỹ. Đòn bánh treo lên chỗ thoáng thì
    **cắt tới đâu ăn tới đó**, phần chưa cắt vẫn kín lá và để được thêm nhiều
    ngày. Trong tiết trời nóng của miền Nam, đó là cách giữ bánh khôn nhất mà
    không cần tủ lạnh.
  - >-
    Nếp làm bánh tét thường được **xào qua với nước cốt dừa** trước khi gói —
    khâu này miền Bắc không làm. Nếp xào ráo thì hạt săn, cuộn chặt tay hơn và
    khi luộc ít bị nhão; nước cốt dừa thì để lại vị béo thoảng trong từng khoanh,
    thứ mà ăn một miếng là nhận ra ngay đây là bánh miền Nam.
  - >-
    Nhân thì mỗi nhà một kiểu. Phổ biến nhất là đậu xanh với thịt ba chỉ. Miền
    Tây có bánh tét nhân **chuối xiêm chín** — cắt ra khoanh có vòng chuối tím
    sẫm ở giữa, ngọt và không có thịt nên để được lâu hơn. Cần Thơ thì nổi tiếng
    với bánh tét nhuộm **lá cẩm**, vỏ nếp lên màu tím. Cùng một cách gói, đổi
    ruột là ra một đòn bánh khác hẳn.

