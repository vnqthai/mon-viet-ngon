heroEyebrow: Bộ gia vị làm nên cái tên…

quick:
  ingredients:
    - Chân giò heo [[1.2|kg]] — lấy phần móng và bắp, còn nguyên bì
    - Riềng [[100|g]] — củ già, giã nhuyễn · nghệ tươi [[1|củ]]
    - Mẻ [[3|muỗng canh]] — cơm nguội ủ lên men, lọc lấy nước
    - Mắm tôm [[1.5|muỗng canh|frac]] · nước mắm · đường · rượu trắng
  steps:
    - "**Thui chân giò** bằng đèn khò hoặc bọc giấy đốt, tới khi bì ngả **vàng nâu sậm**."
    - Cạo sạch phần cháy, rửa lại, chặt khúc chừng [[4|cm]] còn nguyên bì.
    - Giã riềng và nghệ cho nhuyễn; lọc mẻ qua rây lấy nước, **bỏ bã**.
    - Ướp thịt với riềng, nghệ, mắm tôm, nước mẻ, chút rượu trắng và đường — **1 tiếng**.
    - Xào thịt trên lửa lớn **7–8 phút** cho săn mặt và dậy mùi riềng.
    - Chế nước xâm xấp, đun sôi rồi **hạ liu riu 50–60 phút** tới khi thịt mềm.
    - Mở vung đun cạn cho **nước sánh lại bám vào miếng thịt**, nêm lần cuối.
    - Rắc lá mơ hoặc rau răm thái nhỏ, dọn nóng với bún hoặc cơm.
  warning: >-
    Đổ mẻ nguyên cả bã vào nồi là nước kho **lợn cợn và chua gắt**. Hoà mẻ với
    chút nước, lọc qua rây, chỉ lấy phần nước — và nêm từng chút một, nếm rồi
    mới thêm.

