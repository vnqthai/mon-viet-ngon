flavorNote: >-
  **Chuẩn nồi giả cầy:** nước kho **sánh, màu vàng nghệ đậm, bám vào miếng
  thịt** chứ không loang lỏng. Miếng chân giò **thịt mềm rời xương mà lớp bì
  vẫn săn, cắn có độ giòn sựt**. Mùi riềng nổi lên trước, cái chua của mẻ đến
  sau cùng ở hậu vị.
storyEyebrow: Chuyện nồi giả cầy
storyTitle: "Cái tên nói đúng: **giả theo một lối nấu cũ**"
story:
  - >-
    Giả cầy là món của bếp Bắc, và tên món nói thẳng ra cách làm: nấu **giả**
    theo lối một món cỗ cũ ở làng quê — mượn nguyên bộ gia vị đặc trưng
    **riềng · mẻ · mắm tôm**, nhưng nguyên liệu thì là chân giò heo. Bộ ba gia
    vị ấy mạnh tới mức nó định hình cả món, và đó là lý do cái tên ở lại.
  - >-
    Ba thứ đó mỗi thứ làm một việc. **Riềng** — củ trông giống gừng nhưng xơ
    hơn, thơm hắc và cay ấm — là mùi chủ đạo, giã nhuyễn ướp thẳng vào thịt.
    **Mẻ** là cơm nguội ủ lên men, chua dịu và thơm mùi men gạo, cho cái chua
    đến ở hậu vị chứ không sắc như chanh hay giấm. **Mắm tôm** lo phần đậm và
    dày cho nước kho.
  - >-
    Chỗ làm nên miếng giả cầy ngon nằm ở bước đầu tiên: **thui lớp bì**. Bì
    được hơ lửa cho ngả vàng nâu sẽ săn lại và giữ được độ giòn sựt suốt cả
    tiếng ninh — trong khi phần thịt bên trong đã mềm rời xương. Bỏ bước này
    thì miếng chân giò ninh xong bì nhũn và nhạt màu.

