flavorNote: >-
  **Chuẩn nồi bò kho:** nước **đỏ cam sóng sánh** (không đặc như sốt, không
  loãng như canh), húp thấy ngọt nước dừa, thơm sả quyện hồi quế, miếng gân
  **dẻo quánh** cắn dính môi.
storyEyebrow: Chuyện nồi bò kho
storyTitle: Món **Tây gặp ta** ngon nhất của bếp Việt
story:
  - >-
    Bò kho là đứa con lai đẹp nhất của thời bếp Việt gặp bếp Pháp: cái nền
    ragout hầm bò cà rốt của Tây, vô tay người Việt được **ướp ngũ vị hương,
    thả sả đập, chan nước dừa** — thành một món chẳng giống ai, mà ai ăn
    cũng ghiền. Sáng sớm Sài Gòn, tô bò kho bốc khói kế giỏ bánh mì nóng là
    cảnh quen của mọi con hẻm.
  - >-
    Bí quyết nồi bò kho ngon nằm ở **ba tầng chuẩn bị**: ướp cho thấm, xào
    cho săn, hầm cho mềm. Xào săn mặt thịt trước khi châm nước là bước nhiều
    người bỏ qua nhất — chính nó khóa vị ngọt trong thớ, cho miếng bò mềm
    mà không bã. Còn màu đỏ cam đặc trưng? **Dầu điều + cà chua**, màu thật
    của bếp nhà, không cần viên gia vị.
  - >-
    Nấu một nồi chiều cuối tuần, tối cả nhà chấm bánh mì rôm rả; sáng hôm
    sau hâm lại **chan hủ tiếu** — bò kho qua đêm còn thấm đậm hơn đêm đầu.
    Một công nấu, hai bữa ngon, kiểu tính toán rất chi là "má mình".

