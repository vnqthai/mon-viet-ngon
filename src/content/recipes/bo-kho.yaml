heroEyebrow: Nồi bò kho sôi lục bục…

quick:
  ingredients:
    - Nạm bò [[500|g]] + gân bò [[300|g]] — cắt khối quân cờ 3 cm
    - "Ướp: ngũ vị hương [[1|muỗng cà phê]] · sả băm [[2|cây]] · tỏi + hành tím băm · nước mắm [[2|muỗng canh|frac]] · đường [[1|muỗng canh|frac]] · dầu điều [[2|muỗng canh|frac]]"
    - Nước dừa tươi [[500|ml]] · cà rốt [[3|củ]] cắt khúc xéo
    - Sả [[3|cây]] đập dập · gừng [[3|lát]] · hoa hồi [[2|hoa]] · quế [[1|thanh]] nhỏ
    - Cà chua [[2|trái]] băm (hoặc tương cà [[2|muỗng canh|frac]]) — tạo màu, dậy vị
    - "Ăn kèm: bánh mì nóng (hoặc hủ tiếu/cơm) · húng quế, ngò gai · hành tây · chanh, muối tiêu"
  steps:
    - Bò rửa muối gừng, cắt khối 3 cm, ướp gia vị **30 phút** (gân chần sơ 5 phút trước khi ướp).
    - Phi thơm sả tỏi, **xào bò lửa lớn cho săn** mặt thịt, thêm cà chua băm đảo 2 phút.
    - Châm [[500|ml]] nước dừa + nước nóng ngập thịt; thả sả đập, gừng, hồi, quế.
    - Hầm **liu riu 1 giờ 15** (gân mềm dẻo, nạm mềm mà còn khối) — hớt bọt, hé vung.
    - Cho cà rốt vô, hầm thêm **20 phút**; nêm lại mắm – đường – muối cho **đậm vừa chấm bánh mì**.
    - Múc tô, rắc húng quế ngò gai + hành tây; dọn bánh mì nóng + muối tiêu chanh. Xé, chấm, quẹt!
  warning: >-
    Bò kho mềm hay dai ăn thua ở lửa: **sôi liu riu** thịt mới mềm mọng —
    sôi bùng 2 tiếng thịt vẫn dai mà nước thì cạn queo, khét đáy.

