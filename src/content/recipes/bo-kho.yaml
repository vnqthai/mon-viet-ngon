stepsEyebrow: Vô bếp thôi!
stepsTitle: 6 bước ra **nồi bò kho đỏ óng**
stepsLead: >-
  Tổng cộng 2 tiếng nhưng tay làm thật sự chỉ chừng 30 phút — còn lại là nồi
  bò tự sôi lục bục cho thơm nhà thơm cửa.
steps:
  - title: Sơ chế & ướp bò
    icon: knife
    minutes: 35 phút
    bullets:
      - label: "Khử mùi:"
        text: >-
          bò chà xát muối hột + gừng đập, rửa sạch, thấm khô. **Gân bò chần
          nước sôi 5 phút** với vài lát gừng rồi mới cắt.
      - label: "Cắt khối:"
        text: >-
          nạm và gân cắt khối quân cờ **cỡ 3 cm** — nhỏ hơn là hầm xong teo
          mất tiêu, to hơn thì lâu thấm.
      - label: "Ướp:"
        text: >-
          trộn bò với [[1|muỗng cà phê]] ngũ vị hương, sả tỏi hành băm,
          [[2|muỗng canh|frac]] nước mắm, [[1|muỗng canh|frac]] đường,
          [[2|muỗng canh|frac]] dầu điều, ½ muỗng cà phê tiêu — bóp đều,
          ướp **30 phút**.
    callout:
      type: tip
      text: >-
        Ngũ vị hương mỗi hiệu đậm nhạt khác nhau — cứ khởi điểm 1 muỗng cà
        phê, thiếu thơm lúc nêm cuối bổ sung, chứ cho nhiều ngay từ đầu là
        hăng nồng khó cứu.
    timer:
      secs: 1800
      label: Hẹn giờ ướp bò · 30:00
      doneMsg: Bò thấm rồi — bắc chảo xào săn!
  - title: Xào săn — khóa ngọt trong thớ thịt
    icon: flame
    minutes: 10 phút
    bullets:
      - text: >-
          Nồi đáy dày, [[2|muỗng canh|frac]] dầu, phi thơm phần sả tỏi còn
          dính lại từ thau ướp.
      - text: >-
          **Lửa lớn**, trút bò vào xào nhanh tay **3–4 phút** tới khi mặt
          thịt săn lại, cạnh miếng thịt hơi xém.
      - text: Thêm cà chua băm (hoặc tương cà), đảo **2 phút** cho tan quyện, lên màu.
    callout:
      type: warn
      text: >-
        Đừng bỏ bước này để "tiết kiệm 5 phút" — thịt không xào săn, hầm ra
        vừa **bã vừa đục nước**, mất nửa cái ngon của nồi bò kho.
  - title: Châm nước dừa, thả gia vị thơm
    icon: pot
    minutes: 5 phút
    bullets:
      - text: >-
          Châm [[500|ml]] nước dừa tươi + nước **nóng** cho ngập mặt thịt
          chừng 2 cm.
      - text: >-
          Hồi + quế **rang sơ trên chảo khô 1 phút** cho dậy mùi, thả vô nồi
          cùng sả đập dập + gừng lát.
      - text: Đun sôi, **hớt sạch bọt** nổi lên trong 5 phút đầu.
    callout:
      type: tip
      text: >-
        Sợ vớt sót hồi quế lúc dọn? Cột chung vô **túi vải/lồng lọc trà** —
        cuối buổi nhấc ra một lần là sạch nồi.
  - title: Hầm liu riu — thời gian làm việc của nó
    icon: claypot
    minutes: 1 giờ 15
    bullets:
      - text: >-
          Hạ **lửa nhỏ nhất còn sôi lăn tăn**, hé vung, hầm **1 giờ 15
          phút**. Thỉnh thoảng đảo nhẹ, hớt váng bọt.
      - text: >-
          Nước cạn dưới mặt thịt thì châm thêm **nước nóng** (nước lạnh làm
          thịt thắt lại, dai ngay).
      - text: >-
          Kiểm tra: xiên đũa qua miếng nạm thấy **xuyên nhẹ**, miếng gân
          **dẻo trong** là đạt chuẩn.
    callout:
      type: warn
      text: >-
        Món này **không có đường tắt bằng lửa lớn** — nhiệt cao chỉ làm nước
        cạn nhanh còn collagen trong gân chưa kịp mềm. Kiên nhẫn là gia vị
        thứ mười của bò kho.
    timer:
      secs: 4500
      label: Hẹn giờ hầm bò · 75:00
      doneMsg: Thử đũa xem — tới giờ thả cà rốt!
  - title: Thả cà rốt, nêm nước kho
    icon: spoon
    minutes: 25 phút
    bullets:
      - text: Cho cà rốt vô, hầm tiếp **20 phút** tới chín mềm còn khối.
      - text: >-
          Vớt sả, gừng, túi hồi quế ra. Nêm lại: nước mắm – đường – muối
          theo khẩu vị, chuẩn là **đậm hơn nước canh, nhạt hơn nước kho tộ**
          — vì còn chấm bánh mì.
      - text: >-
          Thích nước sánh nhẹ kiểu quán: hòa **1 muỗng canh bột năng** với
          nước nguội, rưới từ từ vô nồi đang sôi, khuấy tới độ sánh vừa ý.
    callout:
      type: tip
      text: >-
        Nếm cuối mà thấy "thơm nhưng nhạt hồn" — thêm **½ muỗng cà phê ngũ
        vị hương pha loãng nước nóng** rưới vô, đảo đều 2 phút. Mùi bò kho
        bừng lại liền.
    timer:
      secs: 1200
      label: Hẹn giờ cà rốt · 20:00
      doneMsg: Cà rốt mềm rồi — nêm lần cuối và dọn!
  - title: Múc tô, dọn bánh mì
    icon: bowl
    minutes: 5 phút
    bullets:
      - text: >-
          Múc bò gân cà rốt vô tô, chan nước kho ngập, rắc **húng quế, ngò
          gai, hành tây khoanh** lên mặt.
      - text: >-
          Dọn kèm **bánh mì nóng giòn** (rắc nước lên vỏ, nướng lại 3 phút
          là giòn như mới ra lò) + chén muối tiêu chanh.
      - text: >-
          Ăn đúng bài: xé bánh mì **chấm ngập nước kho**, gắp miếng gân chấm
          muối tiêu chanh — đổi qua lại tới muỗng cuối cùng.
    doneText: Quẹt sạch nồi — xong!

tipsTitle: 7 bí quyết cho **nồi bò kho mềm đậm**
tipsLead: >-
  Bò kho nhà ai cũng nấu mà mỗi nhà một trời một vực — khác nhau đúng ở mấy
  điểm này.
tips:
  - icon: meat
    title: Nạm + gân là cặp bài trùng
    text: >-
      Nạm cho **thớ mềm ngọt**, gân cho **độ dẻo sần sật** và chất keo làm
      nước kho sóng sánh tự nhiên. Kho toàn thăn nạc "cho sang" là ra nồi
      thịt khô bã — chọn phần rẻ mà đúng, ngon hơn phần đắt mà sai.
  - icon: flame
    title: Xào săn rồi mới hầm
    text: >-
      Mặt thịt xém nhẹ trong chảo nóng tạo **tầng vị nướng** mà nước sôi
      không bao giờ cho được, đồng thời khóa nước ngọt trong thớ. 5 phút này
      đáng giá bằng nửa tiếng hầm.
  - icon: drop
    title: Nước dừa tươi, không nước ngọt
    text: >-
      Ngọt của nước dừa là **ngọt thanh có hậu**, quyện với ngũ vị hương ra
      đúng "mùi bò kho Sài Gòn". Không có dừa thì nước lọc + mía lau/1 muỗng
      đường phèn — đừng dùng soda hay nước dừa lon pha đường.
  - icon: star
    title: Hồi quế rang sơ, ngũ vị chừng mực
    text: >-
      Hồi + quế rang 1 phút trước khi thả — mùi thơm **nở gấp đôi**. Còn ngũ
      vị hương là dao hai lưỡi: đủ thì thơm sâu, quá tay thì cả nồi thành
      "tiệm thuốc bắc".
  - icon: claypot
    title: Lửa liu riu + châm nước nóng
    text: >-
      Hai luật khi hầm: sôi **lăn tăn** thôi, và cạn nước thì châm **nước
      nóng**. Nước lạnh đổ vô nồi đang hầm làm thịt co thắt — dai trở lại
      không cứu được.
  - icon: tomato
    title: Cà rốt vô sau
    text: >-
      Thả cà rốt từ đầu là **nát nhừ tan xác** khi bò vừa mềm. Cứ 20 phút
      cuối mới cho vô — khúc cà rốt chín ngọt, óng màu mà còn nguyên dáng.
  - icon: clock
    title: Qua đêm càng đậm
    text: >-
      Bò kho là món **"ngủ một giấc dậy ngon hơn"** — vị thấm sâu, nước dậy
      màu. Nấu dư ra, mai hâm sôi chan hủ tiếu mì hay ăn với cơm nóng, ngon
      không thua gì tô mới nấu.

serve:
  title: Dọn bò kho — **bánh mì nóng là chân ái**
  paras:
    - >-
      Kiểu kinh điển nhất: tô bò kho bốc khói + **ổ bánh mì nóng giòn**. Xé
      miếng vỏ giòn chấm sâu xuống lớp nước đỏ cam, vớt theo miếng gân dẻo —
      một miếng là hiểu vì sao dân Sài Gòn ăn bò kho từ sáng sớm.
    - >-
      Đổi kiểu thì chan lên **hủ tiếu hoặc mì trứng** trụng, thành tô hủ
      tiếu bò kho đúng chất quán người Hoa; hoặc giản dị nhất là **chan cơm
      nóng** — nước kho quyện cơm, con nít ăn quên thôi.
    - >-
      Nhà đãi khách buổi tối? Nồi bò kho nấu trước từ trưa, tới giờ chỉ hâm
      sôi, cắt bánh mì — **chủ nhà nhàn mà mâm vẫn sang**, món này sinh ra
      để đãi đông người.
  aside:
    title: Trên bàn bò kho
    intro: "Đủ bộ này là bữa bò kho viên mãn:"
    items:
      - icon: roll
        text: "**Bánh mì nóng giòn** — hâm lại lò 3 phút trước khi dọn."
      - icon: herb
        text: "**Húng quế + ngò gai + hành tây** — rắc lúc tô còn bốc khói."
      - icon: lime
        text: "**Muối tiêu chanh** — chấm riêng miếng bò, đậm đà hơn hẳn."
      - icon: chili
        text: "**Sa tế/ớt sừng** — cho người thích tô bò kho cay xé."

faq:
  - q: Nhà có nồi áp suất, rút ngắn được bao nhiêu?
    a: >-
      Nhiều lắm: xào săn xong châm nước, **áp suất 25 phút** (gân 30 phút)
      rồi xả van, mở nắp thả cà rốt nấu thường 15 phút và nêm. Tổng còn
      chừng **50 phút**. Vị gần bằng hầm thường — chỉ nước kém sánh chút,
      bù bằng ít bột năng là đẹp.
  - q: Dùng gói gia vị bò kho bán sẵn được không?
    a: >-
      Được — gói gia vị là "đường tắt tử tế", nêm theo bao bì. Nhưng vẫn nên
      **thêm sả đập, hồi quế rang và nước dừa tươi** — chính mấy thứ tươi đó
      chia đôi nồi bò kho "ăn được" và nồi "thơm nức nhà".
  - q: Không có nước dừa tươi thì sao?
    a: >-
      Thay bằng nước lọc + **1 muỗng canh đường phèn**, hoặc nước dừa đóng
      hộp loại **không đường**. Tránh nước dừa lon có đường — ngọt gắt, hầm
      lâu dễ gắt cổ.
  - q: Muốn nước kho sánh như ngoài quán?
    a: >-
      Quán thường dùng bột năng hoặc bột gạo: hòa **1 muỗng canh bột năng +
      3 muỗng nước**, rưới từ từ vô nồi sôi, khuấy nhẹ tới độ ưng ý. Còn
      "sánh tự nhiên" thì tăng gân bò — collagen tan ra là chất sánh xịn
      nhất.
  - q: Bò kho để được mấy ngày, cấp đông được không?
    a: >-
      Ngăn mát **3 ngày**, hâm sôi kỹ trước khi ăn. Cấp đông ngon lành
      **1 tháng** — chia hộp nhỏ theo bữa, rã đông hâm sôi, thả nhúm rau
      thơm mới là như vừa nấu. Mẹo: cà rốt cấp đông hơi bở, nếu định trữ
      đông thì bớt cà rốt lại.
  - q: Sao nồi bò kho của mình bị đắng nhẹ?
    a: >-
      Ba nghi phạm: **ngũ vị hương quá tay** (nặng mùi thuốc bắc), **hồi quế
      rang cháy** thay vì rang sơ, hoặc **dầu điều phi khét**. Chữa tạm:
      thêm nước dừa + 1 củ cà rốt nấu 15 phút cho vị ngọt kéo lại; lần sau
      canh ba thứ đó nhẹ tay hơn.

