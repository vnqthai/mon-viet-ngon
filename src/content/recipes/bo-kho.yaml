title: Bò kho **mềm tan, chấm bánh mì quẹt sạch nồi**
summary: >-
  Bò nạm gân hầm **nước dừa tươi** tới mềm tan, nước kho đỏ cam óng ánh thơm
  sả – hồi – quế, cà rốt ngọt lịm — xé ổ bánh mì nóng chấm ngập là hiểu vì
  sao món này ai cũng thương.
region: Miền Nam
category: Kho
occasions: [Đãi khách]
