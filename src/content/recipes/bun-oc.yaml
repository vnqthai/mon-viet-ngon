flavorNote: >-
  **Chuẩn bát:** nước **chua dịu và thơm hơi men**, không phải cái chua gắt của
  chanh; màu đỏ nhạt trong chứ không sánh; con ốc cắn nghe **giòn sần sật**, hết
  miếng vẫn còn hậu ngọt.
storyEyebrow: Chuyện món ăn
storyTitle: Ba thứ, và cả ba đều phải **đúng**
story:
  - >-
    Bún ốc là bát bún tối giản nhất trong các món bún Hà Nội: gọn trong **nước,
    ốc, và ớt chưng**. Chính vì gọn như vậy nên nó khó — mỗi thứ đều đứng một
    mình giữa bát, thứ nào làm dối là lộ ra ngay ở thìa đầu tiên.
  - >-
    Nền của bát là **nước luộc ốc**. Con ốc thả vào nồi nước, luộc vừa há miệng
    là nhả ra thứ nước ngọt riêng, hơi tanh mát, khác hẳn nước xương. Lọc kỹ
    qua khăn xô để bỏ hết cát rồi dùng luôn làm nước dùng — đó là lý do bát bún
    ốc ngọt mà nhẹ, húp xong không thấy nặng bụng.
  - >-
    Chua thì phải bằng **giấm bỗng**. Bỗng là phần bã còn lại sau khi cất rượu
    nếp, chua mà thoảng mùi men, đục nhẹ. Thay bằng chanh thì bát bún chua gắt
    và trơ; thay bằng me thì ngả sang vị món Nam. Giấm bỗng khó mua hơn nhưng
    nó **là** vị của món này, không có đường vòng nào.
  - >-
    Vậy nên bát bún ốc nêm theo một hướng riêng hẳn: nồi nước phải **trong hơn,
    chua rõ hơn và nhạt tay hơn** so với mọi bát bún đỏ khác, để cái ngọt của
    nước luộc ốc còn nổi lên được. Và con ốc phải thật giòn — cả bát trông vào
    đúng nó.

