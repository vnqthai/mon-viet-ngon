title: Bún ốc **nước chua thanh, con ốc giòn sần sật**
summary: >-
  Nước dùng nấu từ chính **nước luộc ốc** lọc trong, chua nhẹ và thoảng mùi men
  nếp. Bát này gọn trong ba thứ: **con ốc giòn sần sật**, nước chua thanh màu
  đỏ nhạt, và một thìa **ớt chưng** nổi váng đỏ cam trên mặt.
region: Miền Bắc
category: Món nước
occasions: [Bữa sáng, Ăn chơi]
pubDate: 2026-07-31
time:
  total: 1 giờ 20 phút (+ ngâm ốc qua đêm)
  active: 50 phút
servingsBase: 4
difficulty: Vừa
featured: false
order: 99
art: bun-oc
heroEyebrow: Gánh bún góc chợ, nồi nước chua dịu…

quick:
  ingredients:
    - Ốc nhồi (ốc bươu ta) [[1.5|kg]] — ngâm nước vo gạo + ớt **qua đêm**
    - Giấm bỗng [[150|ml]] — **bã nếp còn lại sau khi cất rượu**, chua dịu và
      thoảng mùi men; mua ở hàng bún riêu hoặc hàng đậu ngoài chợ
    - Cà chua [[4|trái]] · hành tím [[4|củ]] · mỡ heo hoặc dầu ăn
    - Bún tươi sợi nhỏ [[800|g]] · tía tô [[1|nắm]] · hành lá
    - "Ớt chưng: ớt bột [[2|muỗng canh|frac]] + mỡ nóng"
    - "Dọn kèm: rau muống chẻ, xà lách, tía tô · chén mắm tôm nhỏ"
  steps:
    - Ngâm ốc qua đêm với nước vo gạo và vài lát ớt cho nhả hết bùn.
    - Luộc ốc **vừa há miệng là vớt**, khều ruột, bỏ phần đuôi đen.
    - Lọc nước luộc ốc qua rây lót khăn — đó là nền của cả nồi.
    - Chưng cà chua với hành tím, trút vào nồi, chua bằng **giấm bỗng**, nêm nhạt.
    - Xào ốc riêng với hành mỡ, xếp lên bát, chan nước, rưới ớt chưng.
  warning: >-
    Luộc ốc quá tay là con ốc **dai như cao su**, khều ra cũng teo lại. Nước vừa
    sôi, con ốc há mày là vớt ngay — tính bằng chục giây, không phải bằng phút.

