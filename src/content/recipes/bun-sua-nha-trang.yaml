title: Bún sứa Nha Trang **sứa giòn sần sật, nước cá trong veo**
summary: >-
  Tô bún của phố biển: nước lèo nấu từ **cá tươi nguyên con**, trong tới mức
  nhìn thấy đáy, và con **sứa** trắng đục cắn nghe **giòn sần sật** như sụn. Sứa
  xếp vào tô rồi chan nước lèo đang sôi lên là vừa.
