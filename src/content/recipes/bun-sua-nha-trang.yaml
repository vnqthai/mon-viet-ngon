quick:
  ingredients:
    - Sứa chân ăn liền [[500|g]] — rửa nhiều nước, ngâm đá cho giòn lại
    - Cá tươi nhỏ (cá liệt, cá nục nhỏ) [[600|g]] — nấu nước, **20 phút thôi**
    - Phi lê cá thu hoặc cá mối [[300|g]] — quết chả, đem hấp
    - Bún tươi sợi nhỏ [[800|g]] · cà chua [[2|trái]] · hành tím [[4|củ]] nướng
    - "Nêm: nước mắm [[2|muỗng canh|frac]] · muối · chút đường"
    - "Dọn kèm: xà lách, giá, bắp chuối bào, rau thơm · chén mắm ruốc ớt tỏi"
  steps:
    - Sứa xả **3–4 nước**, bóp nhẹ, ngâm nước đá [[20|phút]], vớt ráo. Không luộc.
    - Quết cá với hành tiêu cho dẻo, ém khuôn, **hấp 15 phút**, nguội mới xắt.
    - Nướng hành tím sém vỏ; hầm cá nhỏ **20 phút** rồi lọc lấy nước trong.
    - Thả cà chua, nêm nhạt tay, giữ nồi **lăn tăn** cho nước đừng đục.
    - Xếp bún, chả, **sứa để sống** vào tô, chan nước đang sôi, rắc hành ngò.
  warning: >-
    **Đừng thả sứa vào nồi.** Gặp nước sôi lâu, con sứa co rút lại còn một nửa
    và dai như cao su — mất sạch cái giòn vốn là toàn bộ lý do của món này.

