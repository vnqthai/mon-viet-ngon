steps:
  - title: Xử con sứa — làm sai ở đây thì hết cứu
    icon: bowl
    minutes: 25 phút
    intro: "Sứa mua về không nấu, chỉ rửa và làm lạnh:"
    bullets:
      - label: "Xả nhiều nước:"
        text: >-
          Đổ sứa ra rổ, xả dưới vòi rồi bóp **nhẹ tay** trong nước sạch, thay
          nước **3–4 lần** tới khi nước trong và không còn mùi. Vắt chanh vào
          nước cuối cho hết mùi tanh còn sót.
      - label: "Ngâm đá:"
        text: >-
          Thả sứa vào tô nước đá [[20|phút]]. Miếng sứa đang mềm sẽ **săn lại
          và giòn hẳn lên** — đây là bước làm nên chữ "sần sật" của tô bún.
      - label: "Để ráo:"
        text: >-
          Vớt ra rổ, để ráo thật kỹ rồi cất ngăn mát tới lúc dọn. Sứa còn ướt
          thì chan nước vào tô sẽ loãng.
    callout:
      type: warn
      text: >-
        **Bóp mạnh là nát.** Con sứa gần như toàn nước, bóp như bóp rau là nó
        rã ra thành vụn. Chỉ đảo nhẹ trong chậu nước, để nước làm việc thay tay.
  - title: Quết và hấp chả cá
    icon: knife
    minutes: 30 phút
    bullets:
      - label: "Ướp:"
        text: >-
          Phi lê cá lạng bỏ da, xắt nhỏ, ướp hành tím băm, [[1|muỗng cà
          phê|frac]] tiêu trắng, chút đường và nước mắm. Để **15 phút** ngăn mát.
      - label: "Quết:"
        text: >-
          Xay từng mẻ nhỏ, xay **nhấp nhả** chứ đừng xay một hơi. Trút ra tô,
          quết mạnh **một chiều** chừng 5 phút tới khi khối cá dẻo dính, vỗ
          xuống thớt nghe **bộp**. Trộn thì là vào sau cùng.
      - label: "Hấp:"
        text: >-
          Ém vào tô lòng nông, dàn dày chừng 2 cm, **hấp 15 phút**. Để nguội
          hẳn rồi mới xắt miếng vuông — nóng mà xắt là nát mặt.
    timer:
      secs: 900
      label: Hẹn giờ hấp chả · 15:00
      doneMsg: Để nguội hẳn mới xắt nghen!
    callout:
      type: tip
      text: >-
        Tô này đã có sứa lo phần giòn rồi, nên chả **chỉ cần hấp**, khỏi chiên.
        Muốn có thêm chỗ vàng thì chiên riêng vài miếng, nhưng đừng chiên hết.
  - title: Nấu nồi nước cá cho thật trong
    icon: pot
    minutes: 30 phút
    bullets:
      - label: "Sơ chế:"
        text: >-
          Cá nhỏ móc mang, bỏ ruột, rửa muối rồi xả lại. Cá liệt và cá nục nhỏ
          thì để nguyên con, không cần lóc thịt.
      - label: "Nướng hành:"
        text: >-
          Hành tím nướng trực tiếp trên lửa tới **sém vỏ**, rửa tro, đập dập.
      - label: "Hầm:"
        text: >-
          Cho cá và hành vào [[2.5|lít]] nước lạnh, sôi lăn tăn thì hạ nhỏ lửa,
          hớt bọt, hầm **đúng 20 phút**. Lọc qua rây, bỏ xác cá.
      - label: "Nêm:"
        text: >-
          Thả cà chua bổ múi cau, nấu [[5|phút]]. Nêm [[2|muỗng canh|frac]] nước
          mắm, [[1|muỗng cà phê|frac]] muối, chút đường. Nếm thấy **ngọt trước,
          mặn sau, hậu vị nhẹ tênh** là đạt.
    timer:
      secs: 1200
      label: Hẹn giờ hầm cá · 20:00
      doneMsg: Lọc liền nghen — để lâu là nước đắng!
    callout:
      type: warn
      text: >-
        Cá nhỏ **nhanh ra ngọt và cũng nhanh ra đắng** — 20 phút là đủ, quá tay
        thì nước vừa đắng vừa tanh ngược. Và đừng bao giờ để nồi sôi bùng: đục
        rồi thì không cứu lại được.
  - title: Dọn tô — sứa vào sau cùng
    icon: bowl
    minutes: 10 phút
    intro: "Thứ tự xếp tô có ý nghĩa, đừng đảo:"
    bullets:
      - text: >-
          Bún trụng nước sôi, xóc ráo, cho vào tô. Xếp **chả cá một bên**, rau
          sống thái nhỏ một bên.
      - text: >-
          Gắp **sứa để sống** lên trên cùng, rồi mới chan nước lèo đang sôi.
          Nước nóng chỉ kịp làm ấm miếng sứa — đó đúng là chỗ mình muốn.
      - text: >-
          Rắc hành ngò xắt nhỏ, chút tiêu. Dọn kèm chén mắm ruốc, chén ớt tỏi
          giã và vài lát chanh.
    doneText: Xong — ăn liền khi sứa còn lạnh trong tô nóng!

tipsTitle: 4 chỗ **quyết định** tô bún sứa
tips:
  - icon: alert
    title: Sứa chân, đừng mua nhầm sứa tai
    text: >-
      Ra hàng, cầm túi lên nhìn: **sứa chân** là những dải dày, **trắng đục**,
      nhìn khô ráo. **Sứa tai** là mảng mỏng, **trong xanh**, nhiều nước. Mua
      nhầm sứa tai thì tô bún vẫn ăn được, nhưng miếng sứa mềm nhũn và nhạt —
      mất đúng cái thứ mình bỏ công đi mua.
  - icon: drop
    title: Nước đá làm sứa giòn trở lại
    text: >-
      Sứa đóng túi để lâu thường hơi mềm. Ngâm nước đá 20 phút là nó **săn lại**
      thấy rõ. Mẹo này áp cho cả lúc dọn: dĩa sứa để ngăn mát tới phút cuối mới
      lấy ra, chênh lệch nóng lạnh trong tô chính là chỗ ăn thích.
  - icon: fish
    title: Nấu nước bằng cá nhỏ nguyên con, đừng dùng xương heo
    text: >-
      Xương heo cho nước béo và nặng — hợp bún bò, sai với tô này. Cá nhỏ nguyên
      con cho thứ ngọt **thanh và mảnh**, đúng nền cho miếng sứa vốn gần như
      không có vị. Cá liệt là ngon nhất vì không có xương dăm, lọc rất nhẹ.
  - icon: spoon
    title: Mắm ruốc để riêng, đừng nêm vào nồi
    text: >-
      Nêm mắm ruốc thẳng vào nồi là cả nồi đục và nồng — hỏng luôn cái nước
      trong vừa mất công giữ. Dọn một chén riêng: người quen vị thì khuấy một
      muỗng vào tô mình, người lạ vị để nguyên. Một nồi vừa lòng cả nhà.

serve:
  title: Tô bún của **buổi sáng phố biển**
  paras:
    - >-
      Bún sứa là món ăn sáng, và là món ăn nhanh — hàng ở đây múc một tô chưa
      tới một phút vì mọi thứ đã dọn sẵn từng khay. Ở nhà cũng nên vậy: nồi nước
      nấu từ tối, chả hấp để ngăn mát, sứa rửa sẵn. Sáng ra bắc nồi lên là có tô
      nóng trong mười phút.
    - >-
      Rau sống ở đây được **thái nhỏ trộn chung** rồi bỏ thẳng vào tô, khác lối
      để nguyên lá của bún bò. Cứ theo lối đó — rau thái nhỏ thấm nước lèo,
      ăn tới đâu quyện tới đó.
  aside:
    title: Trên bàn nên có
    intro: "Ba thứ dọn kèm, thiếu thì tô bún hụt một góc:"
    items:
      - icon: jar
        text: "**Mắm ruốc** — một chén nhỏ, ai quen vị thì khuấy vào tô mình."
      - icon: chili
        text: "**Ớt tỏi giã** — giã thô trong cối, cay mà còn nghe sựt."
      - icon: lime
        text: "**Chanh xắt lát** — vắt vào lúc gần cuối tô, nước lèo bừng lên."

faq:
  - q: Mua sứa ở đâu, và loại nào dùng được ngay?
    a: >-
      Chợ và siêu thị bán hai loại. **Sứa ăn liền** đóng túi là loại đã ngâm
      phèn, khử mặn sẵn — rửa lại vài nước rồi ngâm đá là dùng được, đây là loại
      công thức này viết cho. **Sứa muối** đóng thùng thì mặn chát, phải ngâm
      nước lã đổi nhiều lần trong vài tiếng mới hết mặn. Đọc nhãn trước khi mua.
  - q: Nấu nước bằng cá nguyên con thì có tanh không?
    a: >-
      Không, nếu làm đủ ba việc: **móc mang bỏ ruột và rửa muối** thật kỹ, thả
      **hành tím nướng sém** vào nồi, và hầm **đúng 20 phút** rồi lọc liền. Cá
      nhỏ nhả ngọt rất nhanh; qua mốc đó mới là lúc mùi tanh quay lại. Nồi đạt
      thì húp vào thấy ngọt mảnh, hậu vị nhẹ tênh.
  - q: Sứa có mùi tanh, rửa hoài không hết thì sao?
    a: >-
      Thêm một lượt: pha nước với **nước cốt chanh** hoặc vò nắm **lá ổi** vào
      nước rửa, ngâm 5 phút rồi xả lại. Nếu vẫn nồng thì túi sứa đó để lâu rồi,
      đừng cố — món này không có gì che được mùi vì cả tô đều nhạt và trong.
  - q: Không mua được sứa thì nấu gì với nồi nước này?
    a: >-
      Cứ tăng phần **chả cá hấp** lên gấp rưỡi, thêm một ít chả chiên vàng cho
      có chỗ đậm, là vẫn được một tô ngon trên đúng nồi nước ấy. Nhưng đừng thay
      sứa bằng mực hay tôm: chúng có vị riêng khá mạnh, chen vào là nồi nước
      trong mất chỗ đứng.

