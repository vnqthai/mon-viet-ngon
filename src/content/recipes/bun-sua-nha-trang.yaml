flavorNote: >-
  **Chuẩn tô:** nước lèo **trong nhìn thấy đáy**, ngọt mảnh chứ không dày; miếng
  sứa trắng đục, cắn vào nghe **sựt** một cái rồi tan, không dai không nhớt;
  miếng chả hấp mềm mà vẫn dai tay.
storyEyebrow: Chuyện món ăn
storyTitle: Cả tô trông vào **một miếng sứa giòn**
story:
  - >-
    Hàng bún sứa nào ở Nha Trang cũng chọn đúng một phần của con sứa: **phần
    chân** — chùm tua phía dưới, trắng đục, dày mình, khô ráo, cắn nghe **giòn
    sần sật** như miếng sụn. Đó là chỗ tô bún này đứng được một mình. Ra chợ cứ
    hỏi **sứa chân** rồi nhìn cho đúng: miếng dày, trắng đục và ráo tay.
  - >-
    Nồi nước thì nấu từ **chính con cá**, nên ngọt thanh và mảnh. Người Nha Trang
    chuộng **cá liệt** — loại cá bé chỉ chừng ba ngón tay, đuôi xoè như cái nơ,
    thịt ngọt và lành xương nên hầm xong lọc rất nhẹ, nước ra trong veo. Không
    có cá liệt thì cá nục nhỏ hay cá cơm to đều thay được.
  - >-
    Vậy nên tô bún sứa là tô **nhẹ tênh**: nước trong, chả cá hấp trắng, sứa để
    sống. Cái nóng duy nhất là muôi nước chan lên lúc dọn — vừa đủ làm chín cái
    bên ngoài miếng sứa mà chưa kịp làm nó co lại. Húp thìa đầu thấy thanh, tới
    thìa thứ ba thì cái ngọt của cá mới dâng lên.
  - >-
    Ngoài hàng thường bán chung một tô gọi là **bún cá sứa** — vừa chả cá vừa
    sứa. Công thức dưới đây theo đúng lối đó: giữ miếng chả hấp cho tô có chỗ
    mềm, còn phần giòn thì để dành cho sứa.

