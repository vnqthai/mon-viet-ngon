title: Bánh tráng cuốn thịt heo **lát nào cũng hai đầu da**
summary: >-
  Món Đà Nẵng bày cả mâm cho cả nhà tự cuốn: lát thịt luộc **có da ở cả hai
  đầu**, hai lớp bánh chồng lên nhau, một rổ rau đủ vị, và chén **mắm nêm**
  pha thơm đậm đà.
region: Miền Trung
category: Cuốn
occasions: [Ăn chơi, Đãi khách]
pubDate: 2026-07-29
time:
  total: 1 giờ 10 phút
servingsBase: 4
difficulty: Dễ
featured: true
order: 30
art: banh-trang-cuon
heroEyebrow: Cả nhà xúm lại cuốn…

quick:
  ingredients:
    - Thịt mông có da, miếng **cong tự nhiên** [[1|kg]] — chỗ làm nên "hai đầu da"
    - Bánh tráng khô mỏng [[20|cái]] · mì lá [[20|lá]] — lá bánh ướt mềm, lót trong
    - Rau đủ thứ [[600|g]] — xà lách, húng quế, tía tô, diếp cá, giá, chuối chát, khế, dưa leo
    - Mắm nêm [[6|muỗng canh|frac]] · thơm băm [[3|muỗng canh|frac]] · tỏi ớt sả
    - "Luộc thịt: hành tím [[3|củ]] · muối · chút giấm cho thịt trắng"
  steps:
    - Buộc chặt miếng thịt bằng dây, luộc **lửa liu riu 45 phút**, xiên đũa không ra nước hồng là chín.
    - Vớt thịt **thả ngay vào nước đá 10 phút** — da giòn, thịt trắng, không khô mặt.
    - Xắt **ngang bề rộng miếng thịt**, lát mỏng — miếng cong nên dao cắt qua da ở cả hai đầu.
    - "Pha mắm nêm: phi tỏi sả, cho mắm + thơm băm + đường + chút nước, khuấy sôi nhẹ, tắt bếp vắt tắc."
    - Bày mâm rau, xếp thịt, dọn bánh tráng và mì lá — ai nấy tự cuốn, chấm ngập mắm nêm.
  warning: >-
    Luộc xong mà để nguội tự nhiên là **da nhăn và thịt khô mặt**. Thịt vừa vớt
    phải thả thẳng vào nước đá, không có ngoại lệ.

flavor:
  chua: 4
  ngot: 4
  man: 7
