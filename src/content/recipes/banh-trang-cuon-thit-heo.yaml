flavorNote: >-
  **Chuẩn cuốn:** cắn một miếng phải nghe đủ ba tầng — **da sần sật**, nạc mềm
  ngọt, rau tươi mát — rồi mắm nêm ập lên sau cùng, mặn thơm mà không gắt.
storyEyebrow: Chuyện món ăn
storyTitle: Cái duyên nằm ở **hai vành da**
story:
  - >-
    Ở Đà Nẵng, quán bánh tráng cuốn thịt heo nào cũng dọn ra mâm na ná nhau —
    rau, bánh, mắm nêm. Thứ để người ta so hơn thua là **dĩa thịt**: lát thịt
    phải có **hai vành da ở hai đầu**, nạc và mỡ xen giữa. Nhìn ra ngay từ xa,
    và làm được thì mới gọi là đúng bài.
  - >-
    Bí quyết không nằm ở dao mà nằm ở **miếng thịt mua về**. Phải chọn miếng
    mông hoặc vai còn nguyên da, dày dặn và **cong tự nhiên như lưỡi liềm**.
    Luộc nguyên miếng, để nguội, rồi xắt **ngang bề rộng** — vì miếng cong nên
    lưỡi dao đi qua lớp da ở cả hai đầu lát. Miếng thịt vuông vức thì xắt kiểu
    gì cũng chỉ ra một đầu da.
  - >-
    Chỗ đặc biệt thứ hai là **hai lớp bánh**. Ngoài lớp bánh tráng khô mỏng để
    cuốn, người Đà Nẵng lót thêm một lá **mì lá** — lá bánh ướt mềm, cùng thứ bột
    gạo tráng như bánh cuốn nhưng không nhân. Lớp khô giữ cho cuốn chắc tay, lớp
    ướt làm cuốn mềm và dẻo; thiếu một lớp là hụt hẳn.
  - >-
    Và không thể thiếu **mắm nêm** — mắm ủ từ cá cơm, thơm nồng và mặn đậm, khác
    hẳn nước mắm pha chua ngọt của miền Nam. Pha mắm nêm với **thơm băm** là bước
    làm dịu: cái ngọt của thơm kéo vị mặn xuống, để mắm còn thơm mà không còn gắt.

