steps:
  - title: Buộc và luộc nguyên miếng
    icon: pot
    minutes: 50 phút
    intro: "Luộc nguyên miếng, đừng cắt nhỏ — cắt nhỏ là mất luôn hai đầu da:"
    bullets:
      - label: "Buộc:"
        text: >-
          Cạo rửa sạch da, dùng dây buộc quanh miếng thịt cho **chặt và giữ được
          dáng cong**. Buộc chặt thì lát thịt sau này gọn mặt, không tở ra.
      - label: "Luộc:"
        text: >-
          Nồi nước ngập thịt + hành tím đập dập + [[1|muỗng canh|frac]] muối +
          [[1|muỗng canh|frac]] giấm. Sôi thì **hớt sạch bọt**, hạ lửa liu riu,
          luộc **45 phút** cho miếng [[1|kg]].
      - label: "Thử chín:"
        text: >-
          Xiên đũa vào chỗ dày nhất, **không ra nước hồng** là được. Ra nước hồng
          thì luộc thêm 5 phút rồi thử lại.
    timer:
      secs: 2700
      label: Hẹn giờ luộc thịt · 45:00
      doneMsg: Xiên thử đi — chín rồi thì thả nước đá liền nghen!
    callout:
      type: warn
      text: >-
        Nước **sôi bùng** suốt buổi là thịt co lại, ăn khô và bã. Giữ nồi ở mức
        lăn tăn, mặt nước chỉ hơi động là đúng.
  - title: Thả nước đá — bước không được bỏ
    icon: drop
    minutes: 10 phút
    bullets:
      - text: >-
          Chuẩn bị sẵn thau nước đá **trước khi** thịt chín. Vớt thịt ra là thả
          thẳng vào, ngâm **10 phút**.
      - text: >-
          Lạnh đột ngột làm **lớp da co lại và giòn sần sật**, thịt trắng, mặt
          cắt mịn. Vớt ra để ráo, tháo dây, đợi nguội hẳn mới xắt.
    timer:
      secs: 600
      label: Hẹn giờ ngâm nước đá · 10:00
      doneMsg: Vớt ra để ráo — đợi nguội hẳn mới xắt nghen!
    callout:
      type: tip
      text: >-
        Làm trước một buổi thì càng tiện: thịt để nguyên miếng trong ngăn mát,
        lúc dọn mới xắt. Thịt lạnh **xắt ra lát mỏng và gọn** hơn thịt còn ấm
        nhiều.
  - title: Xắt cho ra hai đầu da
    icon: knife
    minutes: 10 phút
    intro: "Cả món trông cậy vào mấy nhát dao này:"
    bullets:
      - label: "Đặt miếng thịt:"
        text: >-
          Để miếng thịt nằm sao cho **bề cong hướng lên**, phần da ôm ra ngoài
          hai phía.
      - label: "Nhát dao:"
        text: >-
          Dao thật bén, **xắt ngang bề rộng miếng thịt** thành lát mỏng chừng
          3 mm. Vì miếng cong nên mỗi nhát đi qua lớp da ở **cả hai đầu** — ra
          đúng lát "hai đầu da", nạc và mỡ xen ở giữa.
      - label: "Bày dĩa:"
        text: >-
          Xếp lát thịt **lợp mí như vảy cá** trên dĩa dài, hai vành da quay ra
          ngoài cho nhìn thấy rõ.
    callout:
      type: tip
      text: >-
        Không mua được miếng cong thì dùng **ba chỉ** — lát chỉ có một đầu da,
        ăn vẫn ngon lành, chỉ là thiếu cái duyên để khoe. Đừng vì vậy mà bỏ món.
  - title: Pha chén mắm nêm
    icon: spoon
    minutes: 10 phút
    bullets:
      - text: >-
          Phi thơm **sả + tỏi băm** với chút dầu tới vàng nhạt.
      - text: >-
          Cho [[6|muỗng canh|frac]] mắm nêm + [[3|muỗng canh|frac]] thơm băm +
          [[2|muỗng canh|frac]] đường + [[3|muỗng canh|frac]] nước, khuấy đều,
          để **sôi lăn tăn 2 phút** rồi tắt bếp.
      - text: >-
          Nguội bớt thì vắt tắc, rắc ớt băm. Nếm lại — **mặn đậm, ngọt theo sau,
          thơm dậy lên trên**; còn gắt thì thêm thơm chứ đừng thêm nước.
    callout:
      type: warn
      text: >-
        Đun sôi bùng là mắm nêm **bốc mùi nồng khắp nhà** mà vị lại nhạt đi. Chỉ
        cần nóng tới lăn tăn cho tan đường và bớt hăng là đủ.
  - title: Bày mâm, ai nấy tự cuốn
    icon: basket
    minutes: 10 phút
    bullets:
      - label: "Bày:"
        text: >-
          Giữa mâm là dĩa thịt, quanh là rổ rau, chồng bánh tráng khô và xấp mì
          lá để riêng, chén mắm nêm đặt vừa tầm tay mọi người.
      - label: "Cuốn:"
        text: >-
          Trải **bánh tráng khô** xuống trước, đặt **một lá mì lá** lên trên, rồi
          mới tới rau — thịt — chuối chát — khế. Gập hai mép, cuộn chặt tay.
      - text: Chấm ngập mắm nêm, cắn một miếng lớn. Cuốn tới đâu ăn tới đó.
    doneText: Mâm dọn xong — mời cả nhà!

tipsTitle: 4 chỗ **hơn thua** của mâm cuốn
tips:
  - icon: meat
    title: Chọn miếng thịt trước, rồi mới nói chuyện dao
    text: >-
      Người ta hay tưởng "hai đầu da" là kỹ thuật xắt. Thật ra **90% nằm ở miếng
      thịt mua về**: phải là miếng còn nguyên da, dày dặn, **cong tự nhiên**. Ra
      hàng thịt cứ nói rõ "lấy miếng cong để cuốn bánh tráng", người bán hiểu ngay.
  - icon: drop
    title: Nước đá làm nên miếng da
    text: >-
      Cùng một miếng thịt, luộc xong để nguội tự nhiên thì da mềm oặt và nhăn;
      thả nước đá thì da **co giòn sần sật**, mặt cắt mịn như hàng. Cùng công
      sức, khác hẳn kết quả — chỉ tốn thêm một thau đá.
  - icon: pineapple
    title: Thơm băm quyết định chén mắm
    text: >-
      Mắm nêm nguyên chất quá mặn và nồng, chấm vào là át hết mọi thứ khác. Thơm
      băm vừa kéo vị mặn xuống vừa thêm tầng thơm ngọt. Chén mắm còn gắt thì
      **thêm thơm, đừng thêm nước** — thêm nước là nhạt toẹt mà vẫn nồng.
  - icon: lettuce
    title: Rau phải nhiều thứ, và phải thật ráo
    text: >-
      Mâm ở Đà Nẵng có cả chục loại rau, không phải để trưng mà vì mỗi thứ giữ
      một vai: xà lách cho mát, húng quế và tía tô cho thơm, **chuối chát cho
      chát**, **khế cho chua**, giá cho giòn. Rửa sớm, vẩy thật ráo — rau còn
      đọng nước là cuốn nhão và mắm bị loãng.

serve:
  title: Mâm cuốn — **cứ để mỗi người tự lo**
  paras:
    - >-
      Món này dọn ra là xong việc của người nấu. Không cần cuốn sẵn, cũng đừng
      cuốn sẵn — cuốn để lâu là bánh khô cứng và rau ra nước. Bày nguyên liệu ra
      mâm, mỗi người tự cuốn theo ý mình, người thích nhiều rau thì nhiều rau,
      người thích dày thịt thì dày thịt.
    - >-
      Nhà đông thì luộc luôn [[1.5|kg]] thịt, phần dư để ngăn mát ăn hôm sau —
      xắt mỏng chấm mắm nêm ăn với cơm nóng cũng hết veo.
  aside:
    title: Bày sao cho gọn mâm
    intro: "Bốn thứ để riêng, đừng trộn chung:"
    items:
      - icon: meat
        text: "**Dĩa thịt** — xếp lợp mí, hai vành da quay ra ngoài."
      - icon: roll
        text: "**Bánh tráng và mì lá** — chồng riêng hai xấp, đừng để chồng lên nhau kẻo dính."
      - icon: lettuce
        text: "**Rổ rau** — chuối chát và khế để một góc riêng cho dễ tìm."
      - icon: jar
        text: "**Mắm nêm** — chia hai ba chén nhỏ, khỏi phải với qua bàn."

faq:
  - q: Mì lá tìm không ra thì thay bằng gì?
    a: >-
      Ra hàng bánh cuốn hỏi **bánh ướt tráng lá, không nhân** là đúng thứ đó.
      Vẫn không có thì cuốn bằng mỗi bánh tráng khô cũng được — cuốn sẽ dai hơn
      và ít mềm, nhưng không mất vị. Đừng thay bằng bún, cuốn sẽ bung.
  - q: Bánh tráng khô có phải nhúng nước không?
    a: >-
      **Không.** Bánh tráng dùng cho món này là loại mỏng, dẻo sẵn, cuốn thẳng
      chứ không nhúng — đó là chỗ khác với gỏi cuốn. Nếu mua nhằm loại dày cứng
      thì chỉ **phẩy nhẹ tay ướt** lên mặt bánh, đừng nhúng vào nước.
  - q: Nhà có người không ăn được mắm nêm thì sao?
    a: >-
      Pha thêm một chén **nước mắm chua ngọt** (1 mắm : 1 đường : 1 chanh : 5
      nước + tỏi ớt) để bên cạnh. Chuyện thường ở mâm cuốn miền Trung, không ai
      thấy lạ — chỉ cần đừng bắt cả mâm theo một chén.
  - q: Luộc thịt bao lâu cho miếng nhỏ hơn?
    a: >-
      Tính theo bề dày chứ đừng tính theo cân. Miếng dày 5–6 cm cần **45 phút**;
      mỏng chừng 3 cm thì **30 phút** là đủ. Cách chắc ăn nhất vẫn là xiên đũa
      vào chỗ dày nhất xem có ra nước hồng không.

ticker:
  - icon: meat
    text: Lát thịt luộc hai đầu da
  - icon: jar
    text: Mắm nêm pha thơm băm
