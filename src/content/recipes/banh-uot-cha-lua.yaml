quick:
  ingredients:
    - >-
      Bột bánh: bột gạo tẻ [[150|g]] + bột năng [[80|g]] + [[700|ml]] nước +
      ½ muỗng cà phê muối + [[1|muỗng canh]] dầu — **nghỉ bột 2 giờ**
    - Chả lụa [[250|g]] thái sợi · giá sống [[150|g]] · dưa leo [[1|trái]]
    - Hành tím [[6|củ]] phi vàng, giữ lại cả dầu
    - >-
      Nước mắm chua ngọt: nước mắm [[3|muỗng canh|frac]] · đường
      [[3|muỗng canh]] · nước ấm [[200|ml]] · nước cốt chanh
      [[1.5|muỗng canh|frac]] · tỏi ớt băm
    - Rau thơm — húng quế, rau thơm, xà lách xé
  steps:
    - >-
      Pha bột, **nghỉ tối thiểu 2 giờ**, chắt lớp nước trong bên trên rồi châm
      lại đúng lượng nước mới.
    - >-
      Phi hành tím vàng nhạt là vớt, **giữ lại dầu hành** để thoa mâm và thoa
      giữa các lá bánh.
    - >-
      Chảo chống dính lửa vừa-nhỏ, quét dầu mỏng, **khuấy bột từ đáy** rồi múc
      một vá, láng đều, đậy nắp 30–40 giây.
    - >-
      Úp chảo lấy bánh ra mâm thoa dầu — **để trần, không cuốn nhân**, thoa chút
      dầu hành rồi chồng lá kế lên.
    - >-
      Pha mắm chua ngọt cho **loãng và dịu**; trụng giá qua nước sôi rồi ngâm
      nước lạnh cho giòn.
    - >-
      Xếp lá bánh ra dĩa (gấp đôi hoặc cắt vừa miếng), phủ chả lụa thái sợi,
      giá, dưa leo, rau thơm, rắc hành phi, chan mắm rồi trộn nhẹ.
  warning: >-
    Chồng lá bánh mà quên thoa dầu hành giữa các lớp là chúng **dính chặt thành
    một khối**, gỡ ra rách hết. Cứ mỗi lá một lượt dầu mỏng.

flavor:
  chua: 5
  ngot: 5
  man: 5.5
  cay: 2.5
  thom: 8
flavorNote: >-
  **Chuẩn vị:** lá bánh **mềm mướt, dai nhẹ, còn ấm chứ không nóng bỏng**; chén
  mắm chua ngọt loãng dịu, gắp lên thấy nước mắm bám đều chứ không đọng đáy
  dĩa. Chả lụa thái sợi phải giòn dai, không bở.

storyEyebrow: Chuyện dĩa bánh
storyTitle: Cùng một lá bánh, **miền Nam gọi hai tên khác nhau**
story:
  - >-
    Ngoài Bắc, mọi lá bánh tráng từ bột gạo hấp hơi đều gọi chung là **bánh
    cuốn**. Vào tới miền Nam thì tách làm hai, và ranh giới rất rạch ròi: có
    nhân thịt mộc nhĩ bên trong thì kêu **bánh cuốn**, còn để trần không nhân
    thì kêu **bánh ướt**. Cùng một thau bột, cùng một cách tráng, chỉ khác ở
    chuyện có cuốn cái gì vào hay không.
  - >-
    Khác cái tên rồi thì khác luôn cách ăn. Bánh cuốn phải ăn **nóng hổi từng
    lượt tráng**, còn bánh ướt thì để **nguội bớt** cho lá bánh se lại, dai
    hơn, rồi mới xếp dĩa. Bánh cuốn chấm chén mắm ấm thanh dịu kiểu Bắc; bánh
    ướt thì **chan thẳng chén mắm chua ngọt tỏi ớt** lên dĩa rồi trộn — đúng
    kiểu ăn của miền Nam.
  - >-
    Càng vào Nam, dĩa bánh ướt càng đầy: chả lụa, chả quế, nem chua, bánh tôm
    chiên, giá trụng, dưa leo, rau thơm, hành phi. Nó không còn là "lá bánh
    chấm mắm" nữa mà thành **một dĩa trộn**, ăn no bụng mà vẫn nhẹ. Ở nhà thì
    làm gọn lại: lá bánh, chả lụa, giá, rau, hành phi — bấy nhiêu đã đủ ra một
    bữa sáng tử tế.

