stepsEyebrow: Vô bếp thôi!
stepsTitle: 5 bước ra **dĩa bánh ướt chả lụa**
stepsLead: >-
  Bánh ướt dễ hơn bánh cuốn ở chỗ **không phải cuốn nhân** — tráng xong chỉ việc
  úp ra, thoa dầu, chồng lên. Nên đây là món đáng thử trước nếu chưa quen tráng
  bánh bao giờ.
steps:
  - title: Pha bột & nghỉ bột
    icon: jar
    minutes: 10 phút (+ nghỉ 2 giờ)
    bullets:
      - label: "Pha:"
        text: >-
          trộn đều [[150|g]] bột gạo + [[80|g]] bột năng + muối, châm
          [[700|ml]] nước từ từ vừa khuấy cho tan hết óc trâu, cuối cùng cho
          [[1|muỗng canh]] dầu ăn.
      - label: "Nghỉ bột:"
        text: >-
          đậy khăn, để **tối thiểu 2 giờ**, để qua đêm ngăn mát càng tốt. Hạt
          bột ngậm no nước thì lá bánh mới trong mướt và hết mùi bột sống.
      - label: "Chắt nước trong:"
        text: >-
          hết giờ nghỉ, **chắt bỏ lớp nước trong bên trên** rồi châm lại đúng
          lượng nước mới, khuấy đều. Lá bánh trong hơn hẳn và không bị chua bột.
    callout:
      type: tip
      text: >-
        Tỉ lệ ở đây **nhiều bột năng hơn công thức bánh cuốn** một chút. Lý do:
        bánh ướt ăn lúc đã nguội bớt, mà bột gạo để nguội thì cứng lại — thêm
        bột năng giữ cho lá bánh mềm mướt tới lúc lên dĩa.
    timer:
      secs: 7200
      label: Hẹn giờ nghỉ bột · 120:00
      doneMsg: Chắt nước trong, châm nước mới, khuấy đều rồi tráng thôi!
  - title: Phi hành & pha chén mắm
    icon: onion
    minutes: 15 phút
    bullets:
      - label: "Phi hành:"
        text: >-
          hành tím thái lát mỏng, cho vào chảo **lúc dầu còn nguội**, lửa vừa,
          đảo đều. **Vừa chớm vàng nhạt là vớt** ra giấy thấm; dầu phi để riêng
          một chén.
      - label: "Pha mắm:"
        text: >-
          hòa [[3|muỗng canh]] đường vào [[200|ml]] nước ấm cho tan, thêm
          [[3|muỗng canh|frac]] nước mắm, để nguội rồi mới vắt
          [[1.5|muỗng canh|frac]] nước cốt chanh.
      - label: "Nếm:"
        text: >-
          phải **chua ngọt rõ, mặn dịu**, loãng tới mức chan cả dĩa mà không
          gắt. Cuối cùng thả tỏi ớt băm — tỏi ớt sẽ nổi lên mặt chén, đúng kiểu
          miền Nam.
    callout:
      type: warn
      text: >-
        Vắt chanh lúc nước còn nóng là **mất mùi thơm và hóa đắng**. Đợi nguội
        hẳn rồi mới vắt, chỉ một bước chờ mà khác hẳn chén mắm.
  - title: Trụng giá, thái chả, xé rau
    icon: sprout
    minutes: 10 phút
    bullets:
      - label: "Trụng giá:"
        text: >-
          nước sôi mạnh, thả giá vào **đúng 10 giây** rồi vớt ra ngâm ngay nước
          lạnh. Vớt để ráo — giá giòn, hết mùi hăng mà không mềm nhũn.
      - label: "Thái chả:"
        text: >-
          chả lụa thái **sợi to cỡ que đũa**. Đây là chỗ bánh ướt khác bánh
          cuốn: bên kia xếp lát chả bên cạnh, bên này thái sợi để **trộn lẫn**
          vào dĩa.
      - label: "Rau:"
        text: >-
          xà lách và rau thơm rửa sạch, vẩy thật ráo, **xé nhỏ bằng tay** chứ
          đừng thái dao — rau xé giữ được độ giòn và không bị thâm mép.
  - title: Tráng lá bánh — không nhân, chỉ chồng lớp
    icon: flame
    minutes: 25 phút
    intro: "Nhịp tráng gọn trong bốn chữ: láng – đậy – úp – thoa dầu:"
    bullets:
      - label: "Chuẩn bị:"
        text: >-
          chảo chống dính 24–26 cm **không trầy xước**, lửa vừa-nhỏ, quét lớp
          dầu mỏng tới mức chỉ còn bóng mờ.
      - label: "Láng bột:"
        text: >-
          **khuấy bột từ đáy tô** rồi múc một vá chừng 60 ml, nhấc chảo khỏi
          bếp, đổ vào và nghiêng xoay một vòng nhanh cho phủ kín đáy.
      - label: "Đậy nắp:"
        text: >-
          đặt lại lên bếp, **đậy nắp 30–40 giây**. Lá bánh chuyển trong, phồng
          lăn tăn là chín.
      - label: "Úp & chồng lớp:"
        text: >-
          úp ngược chảo xuống mâm đã thoa dầu hành — **để nguyên lá, không cuốn
          gì hết**. Thoa một lượt dầu hành mỏng lên mặt rồi mới chồng lá kế
          tiếp.
      - label: "Lặp tới hết bột:"
        text: >-
          cứ thế tới hết thau bột. Chồng xong để **nguội bớt chừng 10 phút** —
          lá bánh se lại, dai nhẹ, gắp không rách.
    callout:
      type: warn
      text: >-
        Quên thoa dầu giữa các lớp là cả chồng bánh **dính thành một khối**, gỡ
        ra rách nát. Chén dầu phi hành để ngay cạnh bếp, tráng xong lá nào thoa
        lá đó thành phản xạ.
    timer:
      secs: 40
      label: Hẹn giờ tráng bánh · 00:40
      doneMsg: Mở nắp coi — lá bánh trong, phồng lăn tăn là chín!
  - title: Xếp dĩa & chan mắm
    icon: bowl
    minutes: 5 phút
    bullets:
      - text: >-
          Lấy từng lá bánh, **gấp đôi rồi cắt ngang thành miếng vừa gắp** (hoặc
          cuộn hờ rồi cắt khúc), xếp trải dĩa.
      - text: >-
          Phủ chả lụa thái sợi, giá trụng, dưa leo, rau xé lên mặt; rắc **hành
          phi vàng ruộm** phủ kín.
      - text: >-
          Chan **2–3 muỗng nước mắm chua ngọt** vòng quanh dĩa, trộn nhẹ tay
          cho đều rồi ăn liền.
    callout:
      type: tip
      text: >-
        Đúng kiểu hàng thì chan mắm **thẳng lên dĩa** chứ không để chén chấm
        riêng — nước mắm đã pha loãng dịu, chan cả dĩa mới thấm đều từng miếng
        bánh.
    doneText: Dĩa bánh ướt chả lụa lên bàn — xong!

tipsTitle: 7 bí quyết **lá bánh mướt, dĩa trộn đều**
tipsLead: >-
  Bánh ướt không khó, chỉ có vài chỗ dễ trượt tay. Bảy điều dưới đây là những
  chỗ đó.
tips:
  - icon: clock
    title: Nghỉ bột đủ 2 giờ
    text: >-
      Hạt bột phải ngậm no nước mới cho lá bánh **trong và dai nhẹ**. Pha xong
      tráng liền là bánh bở, đục, còn nguyên mùi bột sống — không mẹo nào cứu
      được.
  - icon: spoon
    title: Khuấy bột trước mỗi vá
    text: >-
      Bột gạo lắng đáy chỉ trong một hai phút. Không khuấy lại thì vá đầu đặc
      quánh, vá sau toàn nước — **khuấy từ đáy tô mỗi lần múc**.
  - icon: drop
    title: Thoa dầu hành giữa từng lớp
    text: >-
      Đây là lỗi phá hỏng cả mẻ bánh ướt. Chồng lá không thoa dầu là dính chặt
      thành khối. Một lượt dầu **mỏng thôi** cho mỗi lá, vừa chống dính vừa
      thơm.
  - icon: jar
    title: Nhiều bột năng hơn bánh cuốn
    text: >-
      Bánh ướt ăn lúc nguội bớt, mà bột gạo nguội thì cứng lại. Tỉ lệ khoảng
      **2 gạo : 1 năng** giữ cho lá bánh còn mềm mướt tới lúc lên dĩa.
  - icon: lime
    title: Vắt chanh khi nước mắm đã nguội
    text: >-
      Vắt lúc còn nóng là mùi chanh bay hết và **hóa đắng hậu**. Pha đường với
      nước ấm, cho mắm, đợi nguội, rồi mới chanh và tỏi ớt.
  - icon: sprout
    title: Trụng giá đúng mười giây
    text: >-
      Lâu hơn là giá mềm nhũn, ra nước làm loãng chén mắm trên dĩa. Mười giây
      rồi **ngâm nước lạnh ngay** — giòn mà hết hăng.
  - icon: knife
    title: Chả thái sợi, không thái lát
    text: >-
      Dĩa bánh ướt là một **dĩa trộn**, nên mọi thứ phải cùng cỡ để gắp lên
      được đủ vị. Lát chả to nằm riêng một góc thì thành ra hai món ăn cạnh
      nhau.

serve:
  title: Dọn dĩa **kiểu hàng bánh ướt buổi sáng**
  paras:
    - >-
      Bánh ướt là món **ăn nhẹ buổi sáng** — dĩa mỏng, trộn đều, chan mắm chua
      ngọt, ăn xong vẫn còn thấy nhẹ bụng. Nhà nào ăn khỏe thì thêm quả trứng
      luộc hoặc miếng nem chua là thành bữa no.
    - >-
      Dọn đúng bài thì để **chồng lá bánh trên mâm giữa bàn**, ai ăn tự lấy,
      tự cắt, tự chan mắm theo khẩu vị — người thích chua nhiều, người thích
      cay nhiều. Hũ hành phi và chén dầu hành để bên cạnh, ai thích thơm thì
      rắc thêm.
    - >-
      Cùng một lá bánh ướt mà đổi thứ phủ lên là ra món khác hẳn: **bánh ướt
      lòng gà** kiểu Đà Lạt, hay **bánh ướt tôm chấy** kiểu Huế. Còn muốn ăn
      nóng hổi có nhân thì qua **bánh cuốn nóng** — anh em ruột của món này.
  aside:
    title: Trên dĩa bánh ướt
    intro: "Đủ mấy thứ này là ra đúng dĩa hàng:"
    items:
      - icon: meat
        text: "**Chả lụa thái sợi** — giòn dai, trộn lẫn chứ không nằm riêng."
      - icon: sprout
        text: "**Giá trụng** — giòn mát, cắt cái mềm của lá bánh."
      - icon: onion
        text: "**Hành phi + dầu hành** — một thứ để rắc, một thứ để thoa lá bánh."
      - icon: bottle
        text: "**Mắm chua ngọt tỏi ớt** — chan thẳng lên dĩa, đừng để chén riêng."

faq:
  - q: Mua bánh ướt làm sẵn ngoài chợ có được không?
    a: >-
      Được, và rất nhiều nhà làm vậy — chợ nào ở miền Nam cũng có sạp bán bánh
      ướt tráng sẵn từ sáng sớm. Mua về **thoa thêm chút dầu hành và hấp lại
      3–4 phút** cho mềm mướt, rồi làm tiếp từ bước xếp dĩa. Chọn bịch bánh
      **còn ấm, lá rời nhau**, đừng lấy bịch đã bết thành khối.
  - q: Bánh ướt với bánh cuốn khác nhau thật hay chỉ khác tên gọi?
    a: >-
      Khác thật, dù cùng một thau bột. **Bánh cuốn có nhân** thịt mộc nhĩ, ăn
      **nóng hổi**, chấm chén mắm ấm thanh dịu. **Bánh ướt để trần không nhân**,
      ăn khi đã **nguội bớt**, chan mắm chua ngọt tỏi ớt rồi trộn. Ngoài Bắc thì
      gọi chung cả hai là bánh cuốn.
  - q: Lá bánh cứ rách khi gỡ ra, do đâu?
    a: >-
      Dò theo thứ tự: **chảo trầy xước** (đổi chảo là hết) → **quên thoa dầu
      lên mâm** → **gỡ lúc bánh còn quá nóng** (đợi mươi giây cho se lại) →
      **bột chưa nghỉ đủ giờ**. Bốn chỗ này gần như bao trọn mọi ca rách bánh.
  - q: Không có chảo chống dính thì tráng bằng gì?
    a: >-
      Cách cổ điển là **căng vải lên miệng nồi nước sôi** rồi láng bột lên mặt
      vải, đậy vung, hớt ra bằng que tre dẹt. Tráng được mỏng hơn chảo nhiều
      nhưng phải dựng nồi, canh hơi — đáng làm nếu định làm thường xuyên.
  - q: Làm dư thì để được bao lâu?
    a: >-
      Lá bánh chồng sẵn có thoa dầu, bọc kín, để **ngăn mát 2 ngày**. Lấy ra
      **hấp lại 3–4 phút** là mềm mướt gần như mới. Đừng để ngăn đá — rã đông
      ra là lá bánh bở nát.
  - q: Ăn kèm thêm gì cho no bụng hơn?
    a: >-
      Kiểu miền Nam thì thêm **nem chua, chả quế, bánh tôm chiên, hoặc trứng
      luộc**. Nhiều hàng còn rắc thêm tôm khô rang. Giữ nguyên phần nền — lá
      bánh, giá, rau, hành phi, mắm chua ngọt — rồi chất gì lên cũng hợp.

