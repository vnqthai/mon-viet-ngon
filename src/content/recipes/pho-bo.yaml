title: Phở bò **nước trong, thơm lựng quế hồi**
summary: >-
  Tô phở quốc dân nấu tại gia: nước dùng hầm xương **trong veo, ngọt sâu**,
  thơm dịu gừng nướng quế hồi, bánh phở mềm, bò tái chín đủ đầy — công phu một
  buổi mà cả nhà xì xụp như ngoài tiệm.
region: Miền Bắc
category: Bún – Phở
time:
  total: 4 giờ 30 phút
servingsBase: 4
difficulty: Kỳ công
featured: true
order: 2
art: pho-bo
heroEyebrow: Thơm từ đầu ngõ thơm vô…

quick:
  ingredients:
    - Xương ống bò [[1500|g]] — nhờ người bán chặt khúc
    - Nạm hoặc gầu bò [[500|g]] (phần thịt chín) · thăn bò [[300|g]] (phần tái)
    - Bánh phở tươi [[1000|g]] (hoặc [[400|g]] phở khô)
    - Gừng [[2|củ]] · hành tây [[2|củ]] · hành tím [[4|củ]] — nướng xém thơm
    - "Túi gia vị rang thơm: quế [[1|thanh]] · hồi [[3|hoa]] · thảo quả [[2|trái]] · đinh hương [[4|nụ]] · hạt mùi [[1|muỗng canh|frac]]"
    - "Nêm: muối [[1|muỗng canh|frac]] · đường phèn [[20|g]] · nước mắm [[3|muỗng canh|frac]]"
    - Hành lá, ngò rí, ngò gai · chanh, ớt · quẩy nếu thích
  steps:
    - Xương rửa sạch, **chần 3 phút** trong nước sôi có gừng + muối, xả kỹ từng khúc — bước quyết định nồi nước trong.
    - Nướng xém gừng, hành tây, hành tím rồi cạo sạch vỏ cháy; rang quế – hồi – thảo quả – đinh hương – hạt mùi, cho hết vô túi vải.
    - Hầm xương + nạm với [[3.5|lít]] nước và muối, **sôi lăn tăn, hớt bọt đều tay**; thả hành gừng nướng + túi gia vị.
    - Sau **1 giờ** vớt túi gia vị ra kẻo hắc; sau **90 phút** vớt nạm, ngâm nước lạnh 10 phút cho săn; xương hầm tiếp cho đủ **3 giờ**.
    - Nêm đường phèn trước, nước mắm sau cùng lúc nước đang sôi — ngọt sâu, mặn dịu, thơm thoang thoảng.
    - Thăn bò để ngăn đá 20 phút, **thái lát thiệt mỏng ngang thớ**; nạm xắt lát; hành tây thái khoanh ngâm nước đá; trụng bánh phở.
    - Tô trụng nước sôi cho nóng, xếp bánh phở – nạm – thăn tái – hành, chan nước dùng **sôi sùng sục** cho thịt tái vừa chín tới. Dọn kèm chanh ớt.
  warning: >-
    Nước dùng đục là do ba lỗi: chần xương qua loa · để nồi sôi bùng · quên hớt
    bọt. Nhớ câu thần chú "sôi lăn tăn sủi tăm" là nồi phở trong veo.

flavor:
  chua: 0.5
  ngot: 6.5
  man: 5.5
  cay: 1.5
  thom: 9.5
flavorNote: >-
  **Chuẩn vị:** húp muỗng nước dùng thấy **ngọt sâu của xương chạy trước, mặn
  dịu theo sau**, quế hồi chỉ **thoang thoảng chứ không xộc** — và nhìn tô phải
  thấu tới đáy.
storyEyebrow: Chuyện tô phở
storyTitle: Món ăn **mang hồn Việt** đi khắp thế giới
story:
  - >-
    Phở sinh ra từ những gánh hàng rong đất Bắc hồi đầu thế kỷ hai mươi, quẩy
    qua các phố Hà Nội — Nam Định mỗi sớm tinh mơ. Một đầu gánh là nồi nước
    dùng nghi ngút khói, đầu kia là bánh phở, thịt bò, dăm ba cái ghế con. Từ
    cái gánh tre ấy, phở đi một mạch ra thế giới: người ta có thể chưa biết
    Việt Nam ở đâu, nhưng nghe **"phở"** là gật gù liền.
  - >-
    Cái làm nên tô phở không phải thịt, mà là **nồi nước dùng**: xương ống hầm
    lâu cho ngọt tủy, gừng và hành nướng xém tạo mùi nền ấm áp, túi quế hồi
    thảo quả đinh hương góp hương thơm "rất phở" không lẫn với bất kỳ món nào.
    Không có bí truyền gì ở đây — chỉ có **sự kiên nhẫn**: chần xương cho kỹ,
    hớt bọt cho chăm, giữ lửa liu riu cho nước sôi lăn tăn suốt ba tiếng.
  - >-
    Công thức này là bản nhà nấu thong thả ngày cuối tuần: không bột ngọt,
    không viên gia vị, ngọt là **ngọt thiệt từ xương**. Nấu một lần, sáng hôm
    sau cả nhà có tô phở bốc khói — và bạn sẽ hiểu vì sao người Việt đi xa,
    nhớ nhà là nhớ phở.

