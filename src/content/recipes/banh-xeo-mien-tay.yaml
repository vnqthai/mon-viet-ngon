title: Bánh xèo miền Tây **vỏ giòn rụm, nghe xèo là thèm**
summary: >-
  Vỏ bánh pha **nước cốt dừa** vàng ươm màu nghệ, đổ mỏng giòn tan, nhân tôm
  thịt giá đậu xanh đầy ắp — cuốn lá cải xanh chấm mắm chua ngọt, ăn một cái
  là muốn cái nữa liền.
region: Miền Tây
category: Bánh
occasions: [Ăn chơi, Đãi khách]
pubDate: 2026-07-27
time:
  total: 1 giờ 30 phút
servingsBase: 4
difficulty: Vừa
featured: false
order: 25
art: banh-xeo
heroEyebrow: Chiều mưa đổ bánh xèo…

quick:
  ingredients:
    - "Vỏ bánh: bột gạo [[400|g]] · bột nghệ [[1|muỗng cà phê]] · nước cốt dừa [[200|ml]] · nước [[600|ml]] · hành lá"
    - Tôm [[300|g]] · ba rọi [[300|g]] xắt mỏng · giá [[300|g]] · đậu xanh cà vỏ [[100|g]] hấp chín
    - "Rau cuốn: cải bẹ xanh, xà lách · húng quế, tía tô, diếp cá · dưa leo"
    - "Nước chấm: mắm [[3|muỗng canh|frac]] + đường [[3|muỗng canh|frac]] + nước ấm + chanh + tỏi ớt + đồ chua"
    - Dầu ăn (hoặc mỡ heo) để đổ bánh
  steps:
    - Đậu xanh ngâm **1 giờ**, hấp chín tơi (làm việc này đầu tiên).
    - Pha bột + nghệ + muối với nước cốt dừa và nước, khuấy mịn, **nghỉ bột 30 phút**, thêm hành lá xắt.
    - Ba rọi xắt mỏng, tôm rửa ráo; pha mắm chua ngọt + làm đồ chua; rau rửa vẩy khô.
    - Chảo **nóng già** tráng dầu — xào chín tái vài con tôm + mấy lát thịt ngay trong chảo.
    - Khuấy bột, chế **một vá**, nghiêng chảo tráng thiệt lẹ cho mỏng — phải nghe **"xèo"** thiệt lớn; rắc đậu xanh + nắm giá, đậy nắp 30 giây.
    - Mở nắp, rưới muỗng dầu quanh rìa, chiên lửa vừa tới **rìa vàng cong tróc lên** — gập đôi, trượt ra dĩa. Cuốn cải xanh, chấm mắm, ăn nóng tại trận.
  warning: >-
    Bánh mềm xìu không giòn là do bộ ba: **bột đặc quá – chảo chưa đủ nóng –
    đổ quá dày**. Bột phải loãng chảy thành dòng, chảo phải "xèo" thiệt lớn
    mới chế bột.

flavor:
