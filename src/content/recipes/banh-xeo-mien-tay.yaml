flavorNote: >-
  **Chuẩn bánh:** rìa **giòn rụm như bánh tráng nướng**, giữa mềm vừa, thơm
  béo dừa – nghệ; cuốn rau chấm mắm là đủ **giòn – mát – chua – ngọt** trong
  một miếng.
storyEyebrow: Chuyện cái bánh
storyTitle: Món ăn **đặt tên bằng âm thanh** của chảo nóng
story:
  - >-
    Ít có món nào thật thà như bánh xèo: tên món chính là **tiếng bột chạm
    chảo nóng** — "xèoooo" một phát giòn tan, ai đứng gần bếp cũng nuốt nước
    miếng. Ở miền Tây, cứ chiều mưa rả rích là mấy má mấy dì lại bắc chảo:
    người đổ bánh, người lặt rau, con nít chầu chực bên bếp chờ cái bánh
    đầu tiên — thứ "bánh test chảo" ngon nhất trần đời.
  - >-
    Bánh xèo miền Tây có hai chữ ký riêng: **nước cốt dừa trong bột** cho vỏ
    bánh béo thơm phưng phức, và **lá cải bẹ xanh** thay bánh tráng để cuốn —
    vị nhẫn nhẹ của cải ôm miếng bánh béo giòn, chấm ngập chén mắm chua ngọt,
    cân nhau từng chút một. Bánh phải to, phải mỏng, rìa phải giòn — khác hẳn
    bánh khọt hay bánh xèo miền Trung nhỏ mà dày.
  - >-
    Công thức này là bản pha bột tự làm từ đầu, tỉ lệ đã cân để **lần đầu đổ
    cũng giòn**. Bí quyết không nằm ở tay nghề mà ở ba thứ đo đếm được: độ
    loãng của bột, độ nóng của chảo, độ mỏng của lớp bột — đọc kỹ phần bước
    là nắm trọn.

