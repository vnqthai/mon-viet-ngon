name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build with Astro
        uses: withastro/action@v6
        with:
          # v6 mặc định đã là 24, nhưng ghi rõ để lần sau nâng action không
          # âm thầm đổi luôn Node build. Giữ ở bản CHẴN = LTS.
          node-version: 24
      - name: QA sau build — phạm luật là không deploy
        # Đặt SAU bước build có chủ đích: check-third-party soi được cả dist/
        # (đúng thứ khách sẽ nhận), còn node + node_modules thì action trên đã
        # cài sẵn trong job. Fail ở đây ⇒ job build đỏ ⇒ job deploy không chạy —
        # luật "Tài sản & bên thứ ba" (ROADMAP phần 4) do máy giữ trên MỌI lần
        # push, không phụ thuộc ai nhớ chạy qa ở máy mình.
        run: npm run qa

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
